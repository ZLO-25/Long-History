id: unit-america-rise
title: 美國崛起（上）：從十三個殖民地到憲法，立國的制度與想法
histories:
- 美國史
- 美洲史
- 錢的歷史
- 世界通史
mystery: 美國為什麼這麼強？先從制度和想法看：殖民地自治、獨立宣言、憲法，每一步靠什麼想法支撐，又讓誰付出了代價？
teaser: 從 1619 年的一場殖民地議會，到 1787 年的憲法，美國先把「權力從哪來、怎麼限制」寫成規則。下一課再看財政、土地、工業與美元。
goals:
- 能說出殖民地自治、獨立宣言與憲法分權，各自替美國打下什麼基礎
- 能說出自然權利、同意統治、分權與制衡等想法，如何一路連到《獨立宣言》、憲法與《聯邦黨人文集》，並知道學界對洛克影響大小、自由主義與共和主義的看法不同
- 能判讀獨立宣言、憲法的原文，說出它們實際寫了什麼、沒寫什麼
- 能分辨後見之明與倖存者偏差，不把歷史當成投資建議
minutes: 30
steps:
- type: hook
  text: |
    想像一個班級：一開始是幾個同學自己訂班規，班費怎麼花由大家選出的代表決定。
    後來班級越辦越大，有人負責管帳，讓大家相信「借出去的錢一定會還」；班上也一直找到新的空間和資源。
    但如果你只看這個班級後來多風光，就會漏掉兩個問題：每一步到底是怎麼走成的？有誰其實沒有被問過意見？
    這個單元要一起看美國怎麼走到今天。我們不找「唯一的答案」，而是把幾種解釋並排，再看每一種解釋的代價。
    這一課是上半場：先看制度與立國思想。財政、土地、工業與美元留給下一課。
- type: card
  id: event-thirteen-colonies
  depth: understand
  prompt: 先回到 1607 年。注意兩件事：殖民地離英國很遠、管得鬆，議會因此握有什麼權力？1763 年戰勝法國之後，英國為什麼開始想讓殖民地分擔成本？
- type: card
  id: event-american-founding-philosophy
  depth: deep
  prompt: 殖民地人憑什麼說「我們可以脫離英國」？先讀故事與三段原文，認識自然權利、同意統治、社會契約、分權與共和主義。再看「史家怎麼吵」：洛克自由主義派與 Bailyn、Wood 這一派，對建國者主要受誰影響看法不同，這張卡並列兩種說法，沒有裁決。
- type: source
  card: event-american-founding-philosophy
  idx: 0
  question: 《獨立宣言》寫「政府的正當權力來自被治理者的同意」，這句話最能說明什麼？
  options:
  - 只要政府擁有足夠的武力，就有資格統治
  - 人民一旦同意，就永遠不能再改變政府
  - 政府能不能統治，要看被治理的人是否同意，不是憑血統或強制
  - 宣言明確規定了立法、行政、司法三權分立
  answer: 2
  explain: 這句話把政府正當性的來源放在被治理者的同意。這是宣言的主張，和洛克談同意統治的語言很接近；不過這張卡也提醒，宣言寫的是「生命、自由與追求幸福」，不是洛克原本的「生命、自由與財產」，所以不是照抄洛克，學界對洛克影響有多大也有不同看法。宣言同時寫到人民有權「改變或廢除」不保障這些權利的政府，所以選項 1 不對；三權分立要到憲法才用條文設計，宣言並沒有規定。
  hints:
  - 先找關鍵詞「consent of the governed」，政府的權力是誰給的？
  - 宣言有沒有說人民同意後就不能改變政府？回想卡片的「制度或機制變化」。
  - 分權是 1787 年憲法才處理的事，宣言這一句在談的是什麼？
  ref: event-american-founding-philosophy#C4
- type: card
  id: event-declaration-of-independence
  depth: deep
  prompt: 讀完故事與三段原文後，特別看「史家怎麼吵」：「人人生而平等」是偽善，還是後人可以要求兌現的承諾？
- type: source
  card: event-declaration-of-independence
  idx: 2
  question: 《獨立宣言》把「未經我們同意就向我們課稅」列為對英王的控訴之一，最能說明殖民地人民的主張是什麼？
  options:
  - 稅應該經過自己或自己的代表同意，不能由遠方單方面決定
  - 殖民地反對任何形式的政府與稅收
  - 英國從來沒有向殖民地徵收過任何稅
  - 只有奴隸不需要繳稅
  answer: 0
  explain: 這條控訴對應 1760 年代的口號「無代表不納稅」：殖民地認為自己沒有代表在英國國會，稅就不該被強加；英國則主張國會可以「虛擬代表」殖民地。但也要記得，宣言是一份爭取國內外支持的政治文件，這張控訴清單是殖民地這一方的說法。
  hints:
  - 先找原文裡的關鍵字「without our Consent」，它在講什麼？
  - 回想 1760 年代殖民地喊出的口號，是不是跟「代表」有關？
  - 這句話是反對「所有稅」，還是反對「沒經過我們同意的稅」？
  ref: event-declaration-of-independence#C1
- type: card
  id: event-us-constitution
  depth: deep
  prompt: 注意《邦聯條例》哪裡太弱、憲法怎麼分權，也看看「五分之三妥協是讓步，還是壓制」這段史家的討論。
- type: source
  card: event-us-constitution
  idx: 1
  question: 憲法第 1 條第 2 款寫的「所有其他人口的五分之三」，實際上是在規定什麼？
  options:
  - 奴隸被當成五分之三個人來看待
  - 計算各州眾議員席次與直接稅分配時，奴隸人口怎麼計入的規則
  - 從此廢除奴隸制
  - 奴隸可以擁有五分之三的投票權
  answer: 1
  explain: 它是計算眾議員席次與直接稅分配的計數規則，不是在說「奴隸只算五分之三個人」；憲法條文甚至沒有使用「奴隸」一詞。維基百科整理的看法指出，它讓蓄奴州在眾議院與選舉人團中取得較大的政治影響力。南方原本主張全額計入、北方主張不計，雙方各退一步才談成。被計入的人本身並沒有因此享有憲法權利，這是美國強大背後的一項代價。
  hints:
  - 看這句話出現的位置：憲法第 1 條在設立國會，第 2 款談的是什麼分配？
  - 「席次」和「直接稅」都跟「人口怎麼算」有關。
  - 想一想：被「計入」是不是就等於「得到權利」？
  ref: event-us-constitution#C2
- type: chain
  prompt: 把這幾個「想法與文件」依出現的時間先後排成一條線（最上面最早）。
  items:
  - 洛克《政府論》出版（1689 年底）
  - 孟德斯鳩《論法的精神》出版（1748 年）
  - 大陸會議通過《獨立宣言》（1776 年）
  - 費城制憲會議完成並簽署憲法（1787 年 9 月）
  - 麥迪遜在《聯邦黨人文集》第 51 篇寫下「必須以野心對抗野心」（1788 年 2 月）
  explain: 洛克的《政府論》1689 年底出版（書名頁印 1690 年），孟德斯鳩 1748 年談權力分立，1776 年宣言把「同意」寫進立國理由，1787 年憲法把權力分給國會、總統與法院，1788 年麥迪遜在文集裡說明為什麼要讓權力互相牽制。要注意：這條線只是依時間排的先後，不等於證明每一步都直接受到前一個影響。洛克自由主義派強調宣言接近洛克的語言；Bailyn 認為殖民地人讀得最多的是英國反對派（如《加圖書信》）對權力腐化的警告，Wood 則認為 1787 年的制憲者與 1776 年的共和理想已有不同。各說法並存，沒有定論。
  hints:
  - 先分出哪些是 17、18 世紀歐洲思想家的書，哪些是美國建國時期的文件。
  - 宣言在前，憲法在後；《聯邦黨人文集》是在憲法簽署之後，為了說服各州批准而寫的。
  - 洛克的書在 1689 年底，孟德斯鳩的書在 1748 年，兩者都比 1776 年早。
  ref: event-american-founding-philosophy#C2
- type: check
  items:
  - kind: choice
    q: 關於美國憲法與權利法案，下列哪一項正確？
    options:
    - 權利法案和憲法同時在 1787 年通過
    - 權利法案在 1791 年 12 月生效，最初約束的是聯邦政府
    - 憲法簽署日（1787 年 9 月 17 日）就是憲法生效日
    - 憲法條文裡寫有「三權分立」這個詞
    answer: 1
    explain: 憲法 1787 年簽署，要到 1788 年第九個州批准才達到生效門檻；權利法案是之後在批准辯論的壓力下加上的十條修正案，1791 年 12 月生效，最初只約束聯邦政府。憲法條文也沒有「三權分立」這個詞，只是分別在第 1、2、3 條設立國會、總統與法院。
    hints:
    - 回想卡片的時間線：簽署、批准、生效，是同一天嗎？
    - 權利法案是為了回應批准時哪一派人的疑慮才加上的？
    ref: event-us-constitution#C2
  - kind: choice
    q: 麥迪遜在《聯邦黨人文集》第 51 篇寫「必須以野心對抗野心」，最接近下列哪一個意思？
    options:
    - 掌權者只要品德夠高，政府就不會出問題
    - 把權力分給不同部門，讓各部門的野心互相牽制，不必只靠好人當權
    - 鼓勵每個公民都去爭取當官
    - 把所有權力集中到一個機關，提高效率
    answer: 1
    explain: 卡片說明，麥迪遜的想法是「如果人都是天使，就不需要政府」，所以制度要假設掌權者不都是天使，用各部門互相牽制來保護自由。這是《聯邦黨人文集》的主張，它不是憲法條文的一部分，而是為了說服各州批准憲法而寫的報紙文章。
    hints:
    - 想一想：「如果人都是天使」這句話是在說明什麼？
    - 憲法第 1、2、3 條把權力交給不同機關，目的是什麼？
    - 這句話想靠「好人」還是靠「制度」來保護自由？
    ref: event-american-founding-philosophy#C4
  - kind: choice
    q: 關於美國立國思想的來源，下列哪一項最符合卡片的並列說法？
    options:
    - 學界一致認為《獨立宣言》完全照抄洛克
    - 洛克自由主義派強調宣言接近洛克的語言；Bailyn 等人則強調殖民地人讀得最多的是英國反對派對權力腐化的警告，兩種看法並存
    - 洛克的《政府論》是為了替光榮革命辯護而寫，所以和美國無關
    - 《聯邦黨人文集》是憲法的一部分
    answer: 1
    explain: 宣言把洛克的「生命、自由與財產」改成「生命、自由與追求幸福」，不是照抄；洛克的影響有多大、建國者主要受自由主義還是共和主義影響，學界並列兩種看法，沒有定論。另外，多數學者認為《政府論》主要寫於光榮革命之前，《聯邦黨人文集》也不是憲法的一部分。
    hints:
    - 回想卡片的「史家怎麼吵」：有幾派說法？
    - 宣言寫的是「追求幸福」還是「財產」？
    ref: event-american-founding-philosophy
  - kind: order
    q: 依時間先後排列：
    items:
    - 維吉尼亞殖民地召開第一次議會（1619 年）
    - 《獨立宣言》通過（1776 年）
    - 費城制憲會議簽署憲法（1787 年 9 月）
    - 權利法案（前十條修正案）生效（1791 年 12 月）
    explain: 1619 年維吉尼亞的議會是殖民地自治的開端；1776 年《獨立宣言》；1787 年 9 月制憲會議簽署憲法；1791 年 12 月權利法案生效。
    hints:
    - 先分出殖民地時期、獨立與憲法。
    - 憲法簽署之後，才有各州批准與權利法案。
    - 權利法案是憲法的前十條修正案。
    ref: event-us-constitution#C2
  - kind: short
    q: 《獨立宣言》寫「人人生而平等」，為什麼不能直接說當時所有人都享有平等？
    model: 因為當時的「人人」並不包括奴隸，也不包括原住民族；宣言寫下理想，但實際的權利要靠後來的憲法、修正案與長期的抗爭才逐步擴大。
    explain: 宣言提出了影響很大的原則，但同一時期奴隸制仍然存在，原住民族也被排除在外。讀歷史要同時看「寫了什麼」和「誰被排除在外」。
    hints:
    - 回到獨立宣言卡，看「受益者與受損者」（C5）與「不可類比的差異」（C10）。
    - 想一想：1776 年的美國，哪些人沒有投票權或自由？
    ref: event-declaration-of-independence#C5
- type: recap
  model_answer: 這一課的問題是：美國的制度和想法從哪裡來？殖民地議會與地方自治經驗，是獨立後州政府與聯邦制度的底子；《獨立宣言》把「政府權力來自被治理者的同意」寫成立國理由，憲法再用成文規則分權，麥迪遜在《聯邦黨人文集》裡說明要「以野心對抗野心」。至於這些想法從哪裡來，學界並列不同看法：洛克自由主義派強調宣言接近洛克的自然權利與同意統治，Bailyn 與 Wood 等人則強調英國反對派對權力腐化的警告與共和理想，影響大小沒有定論。每一條解釋背後都有代價：宣言說「人人生而平等」，當時的「人人」卻不包括奴隸與原住民；五分之三規則也把奴隸制寫進了憲法的計算方式。下一課接著看財政、土地、工業與美元。事後看很清楚的事，當時並不清楚；本單元不構成投資建議。

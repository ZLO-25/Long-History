    - no: 16
      part: 4
      title: 借錢為什麼能致富？
      en: The Capitalist Creed
      claim: |
        哈拉瑞認為，信用（借貸）建立在「相信未來會更好」上：銀行能借出比手上現金多很多的錢，而科學帶來的進步信念讓人更願意放款投資 [b16][b26]。他介紹亞當・斯密《國富論》把利潤再投資看成造福大家的方式，並以荷蘭東印度公司、法國密西西比公司為例，說明公司和資本如何推動殖民與泡沫 [b16]。他也舉出商人遊說政府發動鴉片戰爭、販奴貿易和比利時國王在剛果的暴行，提醒資本主義同樣可能帶來巨大苦難 [b16]。
      cards:
        - finance-voc
        - event-dutch-formosa
        - finance-mississippi-bubble
        - war-opium-war
        - event-atlantic-slave-trade
      card_notes:
        finance-voc: 書中「公司加帝國」的代表例子
        event-dutch-formosa: 公司在臺灣同時靠信用和武力
        finance-mississippi-bubble: 信用過度膨脹變成泡沫的例子
        war-opium-war: 商人利益推動戰爭的例子
        event-atlantic-slave-trade: 追求利潤造成巨大苦難的例子
      debate:
        - who: 蓋倫・史卓森（Galen Strawson，哲學家，《衛報》書評）
          text: 書中的亞當・斯密被誤讀了。他認為書又一次把斯密描繪成「貪婪的使徒」，這不符合斯密的思想 [b27][b22]。
          src:
            - b27
            - b22
          stance: 反對
      think: 角色扮演：你是 1630 年代大員的荷蘭東印度公司商館長，要讓公司賺錢，你會靠什麼——借錢投資、和漢人合作，還是武力？看「荷蘭東印度公司統治臺灣（大員與熱蘭遮城）」卡比對。這支持「資本與帝國聯手」嗎？

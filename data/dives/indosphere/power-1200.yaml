# 南進與吳哥示意圖：以今日越南、柬埔寨的省（Natural Earth 10m 舊省界）近似當時的勢力範圍；寮國、泰國整國用經緯線切出一部分。
# npm run power 會拼成同名 .geojson（底圖 data/ne/indochina_provinces.geojson，npm run basemap -- IC）。邊界只是示意。
year: 1200
basemap: indochina_provinces
title: 吳哥極盛：占婆成為吳哥的屬國（約 1200 年）
note: 1177 年占婆攻陷吳哥；闍耶跋摩七世反擊後，1190 年代攻下占婆，占婆成為吳哥的屬國約三十年。此時北方的大越（李朝）已在 1069 年取得占婆北方三州（約今廣平與廣治北部）。吳哥在泰國、寮國的範圍只是示意。

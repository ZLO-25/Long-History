# 歐洲勢力示意圖：以今日國界（Natural Earth 50m admin-0）近似當時各國；一國跨兩個勢力時用經線（lng_lt／lng_gt）或緯線（lat_lt／lat_gt）切開。
# npm run power 會從 data/ne/europe_countries.geojson 拼成同名 .geojson。切線依據寫在各勢力的 area；邊界只是示意。
year: 1789
basemap: europe_countries
title: 大革命前夕的歐洲（1789 年）
note: 1789 年的法國是一個王國，國王路易十六；周圍是奧地利哈布斯堡、普魯士、英國、俄羅斯等君主國。今日德國一帶分成數百個邦，名義上屬於神聖羅馬帝國；義大利也分成好幾個國家。今日比利時是「奧屬尼德蘭」，今日法國東南部的薩伏依與尼斯屬於薩丁尼亞王國，波蘭－立陶宛已在 1772 年被俄、普、奧第一次瓜分，1793、1795 年還會再被瓜分到消失。以今日國界近似，邊界只是示意。
view: [[35, -11], [60, 33]]

# 深入專題：日本戰國。專題是疊在長河上的一層「放大鏡」：把一段時代的卡片、人物、故事線、勢力圖聚在一起。
# 怎麼新增一個專題見 docs/dives.md
id: dive-sengoku
title: 日本戰國：從應仁之亂到鎖國
question: 一個將軍還在、卻管不動各地的國家，怎麼打了一百多年？信長、秀吉、家康各自接手了什麼局面、做了什麼選擇，最後換來的太平，為什麼伴隨著禁教與對外管制？
blurb: 這個專題把戰國一百七十年放大來看：誰在什麼時候最強、三位「天下人」各自做了什麼決定、鐵砲與白銀怎麼把日本接上世界，以及這段歷史和明朝、朝鮮、琉球、臺灣有什麼關係。三人並不是同一條路上的接棒者，每一次接手都伴隨著對前一家的取代。
range: { start: 1467, end: 1639 }
histories: [日本史]
visual: power
power_ui:
  title: 勢力圖
  subtitle: 誰在什麼時候最強
  caveat: 以「令制國」為單位、用今日都道府縣的範圍近似，所以邊界只是示意，不是當時確切的領地線。北海道（蝦夷地）與沖繩（琉球王國）不在圖內。
  legend: 令制國
# 專題時間軸的軌道：每張卡依類型分軌（沒列到的類型放「其他」）

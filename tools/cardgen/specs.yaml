- { id: event-westward-expansion, type: event, track: west, name: 路易斯安那購地與西進擴張, time: "1803–1890", civ: "美國（建國初期）, 法國, 拉丁美洲", brief: "路易斯安那購地1803（1500萬美元，霸菱與荷普銀行融資）、印第安人遷移法1830/淚之路、天命昭昭、美墨戰爭1846–48、加州淘金、宅地法1862、1890邊疆關閉。強調原住民受損。" }
- { id: event-monroe-doctrine, type: event, track: west, name: 門羅主義, time: "1823", civ: "美國（建國初期）, 拉丁美洲, 英國", brief: "1823門羅咨文、反對歐洲再殖民美洲、英國海軍的實質撐腰、後來羅斯福推論1904、美國與拉丁美洲的長期糾葛。" }
- { id: war-american-civil-war, type: war, track: west, name: 南北戰爭, time: "1861–1865", civ: "美國（內戰與工業化）", brief: "奴隸制與聯邦、林肯、解放奴隸宣言1863、蓋茲堡、北方工業與鐵路優勢、戰爭融資（綠鈔、國家銀行法1863、傑伊·庫克賣公債）、南方棉花外交失敗、第十三修正案、重建。" }
- { id: event-gilded-age-industrialization, type: event, track: west, name: 鍍金時代：美國工業化與移民潮, time: "1870–1913", civ: "美國（內戰與工業化）", brief: "橫貫大陸鐵路1869後、卡內基鋼鐵、洛克斐勒標準石油、摩根、大量移民、1890謝爾曼反托拉斯法、約1890年代美國工業產值超越英國；美國為什麼強大的經濟底座。" }

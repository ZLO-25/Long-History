id: unit-qin-rise-fall
title: 秦的興亡：十年統一天下，為什麼十五年就亡了？
histories: [中國史, 世界通史]
mystery: 前 221 年秦統一天下，始皇帝希望傳到二世、三世，一直到萬世；結果秦朝只維持了十五年。秦最強的時候，讓它亡的東西是不是已經在裡面了？
teaser: 一根立在城門口的木頭、一場下不停的大雨、一個搶著收秦朝檔案的人：秦怎麼起來，又怎麼倒下。
goals:
  - 能說出商鞅變法的連坐、軍功爵與獎勵耕戰，怎麼讓秦國變強
  - 能用一條因果鏈說明從商鞅變法、統一六國到大澤鄉起事、漢承秦制的過程
  - 能判讀一段《史記》的法令原文，說出它要百姓怎麼做
  - 能比較秦與漢用類似的制度，為什麼一個短一個長，並並列史家的不同看法
  - 能指出「焚書坑儒」「暴秦」這些說法哪些部分有史料爭議
minutes: 38
steps:
  - type: hook
    text: |
      想像有一個班級，班規超級嚴：一個人遲到，同組的人知道卻不說，就一起罰；誰比賽拿分，誰就能當幹部，不看你平常人緣。
      靠著這套班規，這個班在校際比賽一路贏到冠軍。比賽結束了，班規卻沒有放鬆，大家還被派去做更多公差。
      兩千兩百多年前的秦國，就像這個班：靠一套嚴格的規則統一天下，卻在十五年內垮掉。讓它贏的東西，會不會也是讓它輸的東西？
  - type: card
    id: event-shang-yang-reform
    depth: understand
    prompt: 先看秦國怎麼變強：注意商鞅用了哪些獎勵和懲罰。讀「經過」時也留意，商鞅失勢逃亡時，在客舍碰到了什麼事？
  - type: source
    card: event-shang-yang-reform
    idx: 0
    question: 依照這段法令，一個秦國百姓發現同組的人犯法，法令要他怎麼做？
    options:
      - 裝作沒看到，免得惹麻煩
      - 去告發；告發的人和在戰場砍下敵人首級得一樣的賞
      - 私下勸對方改過就好
      - 先問過村裡的貴族再決定
    answer: 1
    explain: 「不告姦者腰斬，告姦者與斬敵首同賞」：不告發要腰斬，告發的賞和打仗立功一樣。這套連坐讓人人互相監督，國家的命令能一路貫徹到最底層。但它也會反過來困住人：商鞅失勢逃亡時，客舍主人就因為「商君之法，舍人無驗者坐之」，不敢收留沒有憑證的他。
    hints:
      - 先找兩個關鍵詞：「不告姦者」和「告姦者」，後面各接什麼？
      - 「與斬敵首同賞」是把告發和哪一種功勞放在一起？
      - 不告發的下場是「腰斬」，所以法令要百姓怎麼做？
    ref: event-shang-yang-reform#C4
  - type: card
    id: event-qin-unification
    depth: understand
    prompt: 秦國用這套動員力量打了十年仗。注意：統一以後，秦有沒有停下來？讀「直接結果」看看統一後又派出多少人北擊匈奴。
  - type: card
    id: event-burning-books
    depth: deep
    prompt: 統一後的秦朝還想統一思想。這張卡請讀到「史家怎麼吵」：「焚書」和「坑儒」，哪一件的史料比較可靠？
  - type: card
    id: event-chen-sheng-wu-guang
    depth: understand
    prompt: 秦始皇死後隔年，一場大雨改變了一切。注意「背景」寫了秦朝統一後對百姓做了什麼，也看「常見誤解」：「失期當斬」是不是一定成立？
  - type: chain
    prompt: 把下列事件依照「因 → 果」排成一條鏈（最上面是最早的原因）。
    items:
      - 商鞅變法：編什伍、行連坐，獎勵耕戰與軍功
      - 秦國強大，十年間滅掉六國，前 221 年統一
      - 廢除分封、設郡縣，統一度量衡、車軌與文字
      - 前 213 年李斯建議焚書，私藏《詩》《書》要交出燒毀
      - 前 209 年秦朝徵調九百名戍卒去守漁陽，在大澤鄉遇大雨誤期
      - 陳勝、吳廣認為誤期依法要斬，在大澤鄉起事
      - 秦朝滅亡，劉邦建立漢朝，卻沿用秦的政府機構與法律
    explain: 商鞅打造的動員體制讓秦打贏統一戰爭；統一後秦把同一套思路用到全國：郡縣、統一標準，再到控制思想的焚書。秦朝統一後施行嚴法、重稅與大量徭役，九百名戍卒被徵調北上，遇雨誤期，又相信誤期要斬，於是起事；各地反秦勢力接連而起，秦朝滅亡。漢朝接手後，用的仍是秦的機器。注意：「焚書」有《史記》的焚書令可查，但隔年處死四百六十多人的「坑儒」，真實程度在學界有很大爭議。
    hints:
      - 最早的原因是秦國「變強」的那一件事。
      - 統一之後先改制度，再管思想；焚書（前 213 年）比大澤鄉（前 209 年）早。
      - 最後一步是秦亡以後，新的朝代拿秦的制度怎麼辦。
    ref: event-chen-sheng-wu-guang#C1
  - type: decision
    role: 你是前 209 年七月的屯長陳勝
    situation: |
      秦始皇去年死了，二世剛即位。你和吳廣是兩個帶隊的屯長，帶著九百名被徵調的戍卒，要北上去守漁陽（今北京密雲）。
      走到大澤鄉，天下大雨，道路不通。你算了算，已經趕不上期限了。大家都知道一句話：「失期，法皆斬」。
      先別急著看選項：如果你是他，只知道這些，你會怎麼做？
    options:
      - { label: 帶大家起事反秦, result: 這是陳勝、吳廣當年的選擇。他們殺了押隊的軍官，喊出「王侯將相寧有種乎」，打出恢復楚國的旗號，隊伍很快增加到約一萬人；陳勝在陳縣稱王，國號「張楚」。但幾個月後他就被自己的車夫殺害，吳廣也被部下殺死。 }
      - { label: 繼續趕路到漁陽，說明是大雨誤期, result: 推測：如果秦法真的誤期就斬，全隊可能被處斬；但有學者根據睡虎地秦簡《徭律》「水雨，除興」（遇大雨可免除徵發），認為秦法未必誤期就斬，那也可能免罰；王子今則認為戍邊和徭役不同，軍事行動誤期向來重罰。歷史沒有走這條路，所以後果只能推測。 }
      - { label: 解散隊伍，各自逃走, result: 推測：依《史記》，陳勝、吳廣自己判斷逃走是死、起事也是死，他們認為逃走也躲不過。歷史沒有走這條路，所以後果只能推測。 }
    actual: 陳勝、吳廣選擇起事。他們自己的政權只撐了幾個月，滅秦的是後來接著起兵的劉邦、項羽等人；但這是秦始皇死後第一場反秦起事，打破了秦朝「不可挑戰」的局面，各地反秦勢力接連而起，秦朝前 206 年滅亡。
    ref: event-chen-sheng-wu-guang#C2
    note: 「沒有發生的選項」的後果都是推測，標示清楚。另外，「失期當斬」是不是秦法的明文規定，學者還在爭論；不過戍卒對重罰的恐懼是真實的。
  - type: compare
    cards: [event-qin-unification, event-han-inherits-qin]
    prompt: 比一比秦和漢：漢朝嘴上批評秦，手上用的卻是秦的制度。
    rows:
      - { aspect: 存在多久, a: 前 221 年統一，前 206 年滅亡，只維持了十五年, b: 前 202 年劉邦稱帝建立；漢朝延續下來，讓秦開創的中央集權體制穩定下來 }
      - { aspect: 地方怎麼管, a: 廢除分封，全國分為三十六郡（後增至四十），由中央派官治理, b: 漢初郡國並行：西部 13 個郡由中央直轄，東部 10 個半自治王國；前 154 年七國之亂後，前 145 年才把王國的權力收回中央 }
      - { aspect: 法律, a: 統一後施行嚴法、重稅與大量徭役, b: 劉邦入咸陽時「約法三章」，但蕭何後來編的漢律許多條文源自秦律；沿自秦律的肉刑後來才改為較輕的笞刑 }
      - { aspect: 怎麼說自己, a: 始皇帝要「二世三世至于萬世，傳之無窮」, b: 不想被說成「用一個暴政換掉另一個暴政」，形象上強調寬厚，實際上沿用秦的政府機構 }
    question: 同樣一套中央集權的制度，為什麼秦十五年就亡，漢卻穩定下來？請至少說出一個可能的原因，再說說史家對「漢比秦寬厚」有哪些不同看法。
    model_answer: 一個可能的原因是「用法」不同：漢初沒有一次把郡縣推到全國，而是郡國並行，再花幾十年一步步收回王國的權力；漢律雖然許多條文源自秦律，後來也把沿自秦律的肉刑改為較輕的笞刑。依讀書筆記，哈拉瑞認為漢朝不去微觀管理百姓的日常生活，改用儒家的個人道德忠誠取代法家式的監控（但皇帝的權力仍沒有法律限制）。但「漢寬秦暴」本身也有爭議：漢代的賈誼把秦描寫成殘暴的政權，在〈過秦論〉中認為秦亡於自身的失誤，因為守天下和取天下是兩回事；Denis Twitchett 則認為漢高祖的政府「不得不採用」秦的政府機構，並提醒後世筆下秦朝的嚴刑峻法可能受到後來政治偏見的影響；法學者賀海仁把漢朝在法律與政體上延續秦制、話語上卻以批判秦朝為主的現象，稱為「秦法悖論」。這題沒有標準答案。
    hints:
      - 先看「地方怎麼管」那一列：漢朝是一次到位，還是慢慢來？
      - 再看「法律」那一列：漢律是從哪裡來的？如果制度差不多，差別可能在「怎麼用」。
      - 點上方按鈕打開漢承秦制卡、切到「深入」，「史家怎麼吵」並列了賈誼、Twitchett、賀海仁三種看法；秦統一卡的「史家怎麼吵」也有賈誼〈過秦論〉。
  - type: today
    card: event-burning-books
    question: 有人說「秦朝焚書，就跟今天刪掉網路上的文章一樣」。這個類比哪裡不成立？
    model_answer: 先說不能類比的地方：秦代的書寫在竹簡上，複本極少，禁書的效果和印刷時代、網路時代完全不同；而且秦朝也沒有把書全部燒光，醫藥、占卜、種樹的書不燒，官方的博士仍可保存《詩》《書》。隔年處死諸生的事件，真實性和規模都還有爭議，不宜當成確定的「大屠殺」拿來比較。可以借來想的是「控制資訊來源」：只准官方保存與解釋知識、民間私藏有罪，會讓資訊全部集中到中央；另外，這個故事本身也提醒我們，一個流傳兩千年的說法，最早的出處和後來的加油添醋要分開看。
  - type: check
    items:
      - kind: choice
        q: 陳勝、吳廣在大澤鄉起事，直接的導火線是什麼？
        options: [李斯建議焚書, 遇上大雨誤了期限，而且相信誤期依法要斬, 劉邦攻進咸陽, 秦始皇下令統一文字]
        answer: 1
        explain: 九百名戍卒在大澤鄉遇雨，道路不通，趕不上期限；依《史記》「失期，法皆斬」，兩人判斷逃走是死、起事也是死，於是起事。這條法是不是真的這麼嚴，學者還在爭論，但大家相信會被斬，就足以讓人選擇造反。
        hints: [回想決策步驟裡你扮演的角色碰上了什麼天氣。, 看陳勝吳廣卡第一段原文：「會天大雨……」後面接什麼？]
        ref: event-chen-sheng-wu-guang#story
      - kind: order
        q: 依時間先後排列：
        items: [商鞅第一次推行變法, 秦國出兵滅韓，開始統一戰爭, 嬴政稱「始皇帝」, 李斯建議焚書, 陳勝、吳廣在大澤鄉起事, 劉邦稱帝]
        explain: 前 356 年商鞅第一次變法 → 前 230 年滅韓 → 前 221 年稱始皇帝 → 前 213 年焚書 → 前 209 年大澤鄉起事 → 前 202 年劉邦稱帝。
        hints: [商鞅變法比秦統一早了一百多年。, 焚書在秦始皇還活著的時候；大澤鄉起事在他死後。]
        ref: event-qin-unification#C2
      - kind: short
        q: 用一兩句話說明：讓秦變強的東西裡，哪一樣後來也成了讓它出問題的地方？
        model: 例如商鞅以來的嚴法、連坐和動員全國人力的體制：它讓秦打贏了十年的統一戰爭，但統一後秦仍繼續大規模徵調人力（例如蒙恬率 30 多萬人北擊匈奴、徵調戍卒守邊），加上嚴法、重稅與大量徭役；九百名戍卒相信誤期要斬，寧可起事，各地反秦勢力隨之而起。
        explain: 這就是「盛的時候找衰的種子」：同一套制度，打天下時是優點，守天下時可能變成負擔。不過這是一種解讀，不是唯一答案。
        hints: [回去看商鞅變法卡的獎懲方式，再看陳勝吳廣卡的「背景」。, 想想看：打仗時很好用的「動員力」，天下統一以後還一直用，會怎麼樣？]
        ref: event-chen-sheng-wu-guang#C1
  - type: recap
    model_answer: 秦最強的時候，讓它亡的東西很可能已經在裡面了。商鞅變法用連坐、軍功和獎勵耕戰，把秦國改造成能動員全國人力種田、打仗的國家，這讓秦十年間滅掉六國；但統一後，秦繼續用同一套思路治理全國：嚴法、重稅、大量徭役，還想用焚書統一思想。前 209 年，九百名戍卒在大澤鄉遇雨誤期，相信「失期，法皆斬」，選擇起事；各地反秦勢力接連而起，秦朝在前 206 年滅亡。諷刺的是，接手的漢朝沿用了秦的政府機構和法律，只是調整了用法、慢慢收回地方的權力。也要記得兩個提醒：第一，「焚書坑儒」裡的焚書有《史記》的焚書令可查，但「坑儒」在《史記》以前沒有任何文獻提到，被殺的未必是儒生，「坑」也不一定是活埋，四個字連用最早出現在 4 世紀初；第二，「暴秦」的形象多半出自漢代以後的史家，有學者提醒後世筆下秦的嚴刑峻法可能受到政治偏見影響，連「失期當斬」是不是秦法明文也有爭議。這是一種參考說法，不是標準答案。
reflect: 陳勝、吳廣算一算已經趕不上期限，又相信遲到就會被重罰，於是覺得「怎麼做都是死」。你有沒有遇過一條規定，讓你覺得「反正已經來不及了，怎麼做都一樣」？那時候你知道這條規定真正寫的是什麼嗎？知道以後，你的選擇會不會不一樣？
next: [unit-rome-fall, unit-ming-silver, unit-athens-sparta]

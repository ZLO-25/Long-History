- { id: event-marshall-plan, type: event, track: west, name: 馬歇爾計畫, time: "1948–1952", civ: "美國（世界強權）, 英國, 法國, 日耳曼與法蘭克/德國, 義大利", brief: "1947哈佛演說、歐洲復興計畫約130億美元、OEEC、蘇聯拒絕、圍堵與美元援助的雙重目的。" }
- { id: event-containment-nato, type: event, track: west, name: 杜魯門主義、圍堵政策與北約, time: "1947–1949", civ: "美國（世界強權）, 俄羅斯與蘇聯/蘇聯, 英國, 法國", brief: "肯楠長電報1946/X文章1947、杜魯門主義1947（希臘土耳其）、柏林封鎖與空運1948–49、北約1949第五條。冷戰開始。可連 event-end-of-cold-war。" }
- { id: war-korean-war, type: war, track: east, name: 韓戰, time: "1950–1953", civ: "朝鮮（近現代）, 美國（世界強權）, 中華人民共和國, 俄羅斯與蘇聯/蘇聯", brief: "1950-06-25北韓南侵、聯合國軍、仁川登陸、中共參戰、三八線停戰1953；對臺灣：第七艦隊巡防臺海、美援、1954中美共同防禦條約。" }

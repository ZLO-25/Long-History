title: 亞歷山大去世時的帝國（前 323 年六月）
note: "前 323 年六月，亞歷山大在巴比倫去世，只有三十二歲。這張圖畫他征服的範圍：希臘與馬其頓（由安提帕特攝政）、小亞細亞、敘利亞與地中海東岸、埃及、美索不達米亞、波斯高原、中亞南部到印度河流域。埃及只留尼羅河谷與三角洲，中亞只畫阿姆河到錫爾河之間的南部。帝國太大，各地靠當地行省總督治理，並沒有一條明確的邊界；今日國界只能近似。他死後將領們搶了四十多年，帝國分裂（見前 275 年那張圖）。孔雀王朝此時尚未建立，北印度當時是難陀王朝，圖中沒有畫；迦太基與羅馬共和國只標示位置當背景。以今日國界近似，邊界只是示意；切線理由見 docs/dive-greece.md。"

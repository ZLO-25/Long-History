id: unit-rome-1
title: 不要國王之後：羅馬共和怎麼運作，又怎麼壞掉
histories: [希臘羅馬史, 世界通史]
mystery: 羅馬人趕走國王之後，設計了兩位執政官、元老院、公民大會和保民官，讓權力互相牽制。這套制度是怎麼運作的？它又是怎麼一步一步，變成連將軍帶兵進首都都擋不住？
teaser: 一位保民官的法案被同僚否決，他用投票把對方撤職；一位總督站在一條小河邊，過河就是死罪。
goals:
  - 能說出執政官、元老院、公民大會、保民官各自做什麼，並指出共和的「人民」不包括哪些人
  - 能判讀一段波利比烏斯的敘述，說出他為什麼把羅馬政制稱讚為混合政體，也能分辨古代數字是誰說的
  - 能說出提比略·格拉古面對同僚否決時當時看得到的選項與各自的代價
  - 能依時間排出從格拉古到凱撒渡盧比孔河的幾個關鍵事件，並說明「馬略改革」為什麼有爭論
minutes: 50
companion: unit-rome-2
steps:
  - type: hook
    text: |
      想像你們班有兩位班長，一年一任，其中一人想做的事，另一人可以喊停。重要的大事，要先交給一群資深老師組成的委員會討論；更多的事，由全班分組投票。另外還有一位專門替同學喊停的代表，誰也不能動他。
      這樣的設計，作用是讓一個人沒辦法長期握有最高權力。羅馬人趕走國王之後，就是這樣管自己的國家。
      這個單元要看它怎麼運作、誰被擋在門外，以及幾百年後，它怎麼被人用軍隊越過去。
  - type: card
    id: event-roman-republic-founding
    depth: understand
    prompt: 先分清楚執政官、元老院、公民大會、保民官各做什麼。注意「趕走國王」的故事有多少是傳說，以及卡片最後問的：這個「人民」到底包括誰、不包括誰。
  - type: source
    card: event-roman-republic-founding
    idx: 0
    question: 波利比烏斯寫：「若只看執政官的權力，這套政制完全像是君主制。」他接下來想說的是什麼？
    options:
      - 羅馬其實是君主制，元老院和人民只是裝飾
      - 這只是其中一面；元老院和人民也各有力量，三者混在一起互相牽制
      - 羅馬共和是真正的民主，每個居民都能投票
      - 執政官的權力太大，應該廢除這個官職
    answer: 1
    explain: 波利比烏斯是希臘史家。他的意思是：只看執政官，像君主制；只看元老院，像貴族制；只看公民大會，像人民當家。三種成分都參與，互相牽制，所以他稱讚這套政制，認為很難找到更好的。但這是他的看法：現實中官職要先有錢、有出身，所以同一個制度，也可以被看成少數家族輪流掌權。
    hints:
      - 他是在稱讚羅馬，還是在批評？先想想他為什麼要說「若只看」。
      - 「若只看……」的意思是，還有別的面向沒有被這句話算進去。
      - 回到卡片的「混合政體」：三種成分是哪三種？
    ref: event-roman-republic-founding#C4
  - type: card
    id: event-conflict-of-orders
    depth: understand
    prompt: 保民官是怎麼來的？注意平民用的不是刀劍，而是「集體離開城市、拒絕當兵」。也看「史家怎麼吵」：這場兩百年的鬥爭，有學者連它是否真的發生過都懷疑。
  - type: card
    id: event-twelve-tables
    depth: understand
    prompt: 法律寫下來公開，有什麼好處？再注意它保留了哪些貴族特權，想想「公開」和「公平」是不是同一件事。
  - type: card
    id: war-second-punic
    depth: understand
    prompt: 這是共和第一次大規模的壓力測試。注意坎尼之後多數義大利同盟為什麼還站在羅馬這邊，以及費邊被任命為獨裁官、任期結束後元老院沒有延長他的權力：想想這說明當時的制度處在什麼狀態。
  - type: card
    id: person-hannibal
    depth: understand
    prompt: 漢尼拔的故事幾乎都是羅馬一方寫的。讀「為什麼沒打羅馬城」，想想：馬哈巴爾那句名言，是當時的紀錄嗎？
  - type: source
    card: person-hannibal
    idx: 0
    question: 波利比烏斯寫：坎尼之後，羅馬方「其餘的人英勇戰死，共七萬人」。卡片怎麼提醒我們看待這個數字？
    options:
      - 這是確切的統計，可以直接當成事實
      - 這是迦太基人自己記的，所以一定被誇大
      - 這是古代說法之一，別的作者和現代學者的數字不同，不宜當成確定的數字
      - 這個數字是漢尼拔自己刻在銅板上的
    answer: 2
    explain: 卡片把數字並列：波利比烏斯記羅馬方步兵陣亡約七萬，李維記約四萬五千五百，現代學者有人認為兩者都太高。古代的數字多出自羅馬一方，波利比烏斯又是為羅馬人寫作的希臘史家；漢尼拔立銘文記的是他進入義大利時的兵力，不是羅馬的傷亡。讀古代數字，要先問：誰說的？怎麼算的？
    hints:
      - 先看這段話的出處：波利比烏斯是哪一邊的人？
      - 卡片「史家怎麼吵」裡，李維的數字和他的一樣嗎？
      - 漢尼拔銘文裡記的是什麼？是傷亡，還是他剛到義大利時的兵力？
    ref: war-second-punic#A4
  - type: decision
    role: 你是前 133 年剛當選的保民官提比略·格拉古
    situation: |
      保民官是平民選出的官員，人身受保護，可以否決法案。你提出《土地法》：個人占用的國有公地要有上限，多出來的分給沒有土地的公民。支持你的人說，這也能增加符合財產資格、可以當兵的公民。傳統說法認為，富人用奴隸經營大莊園、占用公地，農民失去土地；近年有學者認為這個說法並不完整。
      現在，另一位保民官奧克塔維烏斯是你的同僚，他用否決權擋下了這部法案（據說受到元老院慫恿）。依規則，法案過不了。
      先別急著看選項：如果你是提比略，只知道這些，你會怎麼做？
    options:
      - label: 撤回或修改法案
        result: 推測：可能保住和同僚、元老院的關係，也可能讓法案縮水到幫不上多少人。歷史沒有走這條路，所以後果只能推測。
      - label: 等這位同僚任期結束
        result: 推測：保民官任期只有一年，等下去不必把同僚撤職；但法案要停擺，下一年的保民官會不會放行，也沒有保證。歷史沒有走這條路，所以後果只能推測。
      - label: 讓人民大會表決，把他撤職
        result: 這是提比略當年的選擇。普魯塔克記載，投票進行到三十五個部落中的十七個時，他暫停了一下，懇求奧克塔維烏斯讓步；對方在有錢人的壓力下拒絕，投票繼續，奧克塔維烏斯被撤職，法案通過。代價是，英文維基稱這個做法有效，但違憲；後來有前執政官批評它違反官職同僚的原則，反對者也因此有了攻擊他的理由。
    actual: 法案通過後，提比略又想競選連任下一年的保民官，這可能不合法，確實違反慣例。他的堂兄、大祭司西庇阿·納西卡要求執政官動武，被拒後自己帶了一群人衝進集會，提比略和支持者被棍棒、木椅打死，屍體被丟進台伯河。十年後，弟弟蓋烏斯也走上同一條路：前 121 年，元老院第一次通過「元老院最終決議」，請執政官用一切手段保衛國家；執政官動武，蓋烏斯死去（被殺還是自殺，說法不一），支持者許多人被殺或被處死。另一方面，土地委員會留下的界石顯示分配確實有進行；義大利同盟者卻是土地改革的強力反對者。
    ref: person-tiberius-gracchus#P3
    note: 沒有發生的選項，後果都是推測。這題沒有標準答案，也不要用後見之明批評他：當時的人不知道這一步會走到流血。普魯塔克和阿庇安都寫在事發兩百多年後。普魯塔克寫「據說」這是羅馬趕走國王以來第一次以公民流血收場的內鬥，阿庇安也說在他之前沒有人把刀劍帶進公民大會；這是他們回頭看的判斷，意思是政治爭執第一次鬧到殺人，不是說羅馬之前從來沒有暴力。
  - type: card
    id: event-gracchi-reforms
    depth: understand
    prompt: 先讀「農民真的消失了嗎」：傳統說法是戰爭之後富人占地、農民失地，近年學者卻有修正。再注意蓋烏斯做了什麼，以及「元老院最終決議」第一次出現。
  - type: card
    id: person-tiberius-gracchus
    depth: understand
    prompt: 讀「從另一邊看他」：被他撤職的奧克塔維烏斯是什麼反應？再想想，剛才你選的做法，和他的有什麼不同。
  - type: compare
    cards: [event-conflict-of-orders, event-gracchi-reforms]
    prompt: 比一比共和裡的兩次衝突：前 494 年平民撤離，和前 133 年提比略的土地法。
    rows:
      - aspect: 誰發動、用什麼辦法
        a: 平民士兵拒絕出征，集體離開羅馬城，等於全體罷工
        b: 保民官提比略提出土地法，被同僚否決後，讓人民大會把同僚撤職
      - aspect: 對方怎麼回應
        a: 貴族派出代表去談判，雙方妥協，平民可以選出自己的保民官
        b: 提比略想連任時，一群元老帶人衝進集會，用棍棒、椅子把他和支持者打死
      - aspect: 後來怎麼樣
        a: 平民陸續爭到成文法、擔任執政官的資格；前 287 年《霍騰西烏斯法》讓平民會議的決議約束全體公民
        b: 前 121 年元老院第一次通過「元老院最終決議」，執政官動武，蓋烏斯死去（被殺或自殺，說法不一），支持者被殺
      - aspect: 史料的限制
        a: 傳統說法來自幾百年後的作家，有學者懷疑這場鬥爭是否真的發生過
        b: 普魯塔克和阿庇安寫於事發兩百多年後；農民是否真的被擠出土地，學者也有不同看法
    question: 同樣是「共和裡的衝突」，兩次收場的方式差在哪裡？這能說明什麼？
    model_answer: 前 494 年的衝突，是用集體不合作逼出談判，最後妥協成新的制度（保民官）；前 133 年的衝突，卻是從議場吵到街頭，有人被打死，之後元老院又用「最終決議」請執政官用一切手段處理。卡片說，這是政治衝突從議場轉向街頭的過程。不過要小心：兩個故事的史料都寫在幾百年後，細節有爭議，而且我們不能只用這兩次來說「共和從此註定走向崩壞」，那是回頭看的判斷。這題沒有標準答案。
    hints:
      - 先看第一列：兩邊用的辦法，一個是不合作，一個是什麼？
      - 再看第二列：對方的回應，一個是談判，一個是什麼？
      - 最後問自己：規則還在，卻有人用暴力處理爭議，這代表什麼？
  - type: card
    id: event-marian-reforms-sulla
    depth: understand
    prompt: 「馬略改革」很常見，但卡片說近年多數專家不接受它是一次性的大改革。注意前 88 年蘇拉做了什麼第一次，以及他的「獨裁官」和傳統的有什麼不同。
  - type: card
    id: social-roman-slavery-spartacus
    depth: understand
    prompt: 共和說的「人民」不包括奴隸。看奴隸做什麼工作、被釋放之後能不能成為公民，以及起義者要什麼，史料其實沒有說。
  - type: source
    card: social-roman-slavery-spartacus
    idx: 0
    question: 阿庇安寫：起義者被俘虜後，「沿著從羅馬到卡普阿的道路被一路釘上十字架」。這段話最能支持下面哪個說法？
    options:
      - 起義者的目標是廢除羅馬的奴隸制
      - 斯巴達克斯被俘後，在這條路上被釘十字架
      - 羅馬在起義之後放寬了對奴隸的限制
      - 起義被鎮壓後，被俘的追隨者遭到公開示眾的處決
    answer: 3
    explain: 這段話只寫結局：約 6,000 名被俘的追隨者沿路被釘十字架。斯巴達克斯本人戰死，遺體始終沒有找到。至於起義者要什麼，史料沒有說他們要廢除奴隸制；古代作者只說他想逃走或進軍羅馬，而且這些作者都站在羅馬一邊，起義者自己沒有留下紀錄。
    hints:
      - 先看這句話的主詞：被釘十字架的是誰？
      - 再問：這句話有沒有提到起義者想要什麼？
      - 回到卡片：斯巴達克斯本人的下場是什麼？
    ref: social-roman-slavery-spartacus#E4
  - type: decision
    role: 你是前 49 年的凱撒，站在盧比孔河邊
    situation: |
      你在高盧當了好幾年總督，任期快結束了。元老院命令你解散軍隊、回羅馬；同時，元老院倚重的是龐培的軍事力量。
      羅馬法律規定，總督帶兵進入義大利本土，就喪失指揮權，你本人和士兵都可以被判死罪。河的那一邊，就是義大利本土。
      先別急著看選項：如果你是凱撒，只知道這些，你會怎麼做？
    options:
      - label: 解散軍隊，回羅馬面對政敵
        result: 推測：守住了法律，但也交出了手中最大的本錢；回去之後元老院和龐培會怎麼對你，卡片沒有記載。歷史沒有走這條路，所以後果只能推測。
      - label: 帶著軍團越過河
        result: 這是凱撒當年的選擇。他率領第十三軍團渡河。龐培、執政官和許多元老逃出羅馬，凱撒占領阿里米努姆，前 48 年在法薩盧斯打敗龐培。代價是，從這一刻起，他成了用武力對抗羅馬自己政府的人，內戰隨之爆發。
    actual: 蘇埃托尼烏斯（寫於事發約一百五十年後）記載，他在河邊說：現在還可以回頭，但只要過了那座小橋，一切就要靠刀劍來決定。渡河後，他在內戰中打敗龐培；前 44 年初當上「終身獨裁官」，同年 3 月 15 日在元老院會議上被一群元老刺殺。刺殺者自認是在救共和，結果卻引發下一輪內戰。
    ref: person-caesar#P3
    note: 沒有發生的選項，後果都是推測。這題沒有標準答案。「骰子已經擲下」那句話，蘇埃托尼烏斯和普魯塔克的版本不一樣，凱撒實際說了什麼，無法確定。
  - type: card
    id: event-rubicon
    depth: understand
    prompt: 注意渡河的是第十三軍團，不是整支大軍；也注意「渡河那天就是共和結束的日子」為什麼是常見誤解。
  - type: card
    id: person-caesar
    depth: understand
    prompt: 《高盧戰記》是誰寫的？為什麼現代學者多把它看成宣傳？再看「他當了幾次獨裁官」：「終身」和傳統的獨裁官差在哪裡？
  - type: chain
    prompt: 把下列事件依照時間順序排成一條鏈（最上面最早）。
    items:
      - 前 133 年提比略·格拉古在集會中被打死
      - 前 107 年馬略讓任何人志願入伍，連最窮的公民也收
      - 前 91 年同盟者戰爭爆發，之後義大利的同盟者陸續取得公民權
      - 前 88 年蘇拉帶著軍團進入羅馬
      - 前 82 年蘇拉公布公敵名單，成為沒有期限的獨裁官
      - 前 49 年凱撒率軍團渡過盧比孔河
    explain: 前 133 年格拉古之死 → 前 107 年馬略收志願兵 → 前 91 年同盟者戰爭爆發（打到前 88 年前後） → 前 88 年蘇拉進軍羅馬 → 前 82 年公敵宣告與無期限獨裁官 → 前 49 年凱撒渡河。這只是先後順序，不代表前一件事必然帶來後一件：卡片說，學者對「馬略改革」是不是一次性的大改革有爭論，對將軍的「私人軍隊」怎麼形成也不同意，有人強調軍餉、長期戰爭與內戰。
    hints:
      - 最早的是這個單元決策題裡的那位保民官。
      - 蘇拉的兩件事，進軍羅馬在前，公敵名單在後。
      - 最後一件發生在蘇拉開了帶兵進羅馬的先例之後：另一位將軍帶著軍團越過一條小河。
    ref: event-marian-reforms-sulla#C7
  - type: today
    card: event-roman-republic-founding
    question: 有人說「羅馬共和就是古代的民主，可以直接拿來和今天的民主比較」。這個說法哪裡不成立？
    model_answer: 先說不能類比的地方：羅馬公民權只給少數人，女性、奴隸和被征服者沒有政治權利；官職要先有錢、有出身，權力長期集中在富有家族；共和初期的史料幾乎都是幾百年後寫的，細節多是傳統說法而不是當時文件。可以借來想的是結構：用「任期短、成對、可以互相否決」的官職，防止一個人長期握有最高權力；以及，當有人帶兵越過規則、又沒有東西擋得住時，這套設計就失靈了。這裡只描述結構，不預測。
    hints:
      - 先想：今天的選舉，誰有投票權？羅馬共和裡，誰被排除了？
      - 回想卡片：女性、奴隸和被征服者，各自的處境是什麼？
      - 想想：任期一年、兩人互相否決，能不能擋住一個帶著軍隊的人？
  - type: check
    items:
      - kind: choice
        q: 提比略·格拉古的土地法被同僚保民官奧克塔維烏斯否決之後，歷史上他實際怎麼做？
        options:
          - 讓人民大會表決，把奧克塔維烏斯撤職
          - 帶著軍隊進入羅馬
          - 像前 494 年的平民那樣，集體離開城市
          - 宣布自己是獨裁官
        answer: 0
        explain: 提比略讓人民大會把同僚撤職，法案隨之通過；英文維基稱這個做法有效，但違憲。軍隊進羅馬是後來蘇拉才做的；集體撤離是前 494 年平民的辦法；他也沒有當獨裁官。
        hints:
          - 回想決策題：他看得到哪三個選項？
          - 提比略當時的身分是保民官，不是將軍。
        ref: person-tiberius-gracchus#P3
      - kind: choice
        q: 關於「馬略改革」，卡片整理的現代學者看法是什麼？
        options:
          - 馬略一次改革就創造了職業軍隊，這是學界定論
          - 馬略從來沒有招募過志願兵
          - 多數專家不接受這是一次性的全面改革，認為改變來得較晚、是逐漸發生的
          - 馬略改革讓羅馬立刻結束了內戰
        answer: 2
        explain: 前 107 年馬略確實收了志願兵，估計約 3,000 到 5,000 人，戰勝後就遣散了。但「一次改革就有職業軍隊」這個說法從 19 世紀開始流傳，現在多數專家不接受，有學者稱它是「現代學術的建構」；真正的改變多發生在同盟者戰爭與內戰期間，而且是逐漸的。
        hints:
          - 馬略有沒有招志願兵？先回想卡片裡的數字。
          - 卡片「史家怎麼吵」第一段，說這個想法「現在專家大多……」。
        ref: event-marian-reforms-sulla#C1
      - kind: choice
        q: 蘇拉擔任的獨裁官，和羅馬傳統的獨裁官最大的差別是什麼？
        options:
          - 傳統的獨裁官由人民選出，是終身職
          - 傳統的獨裁官緊急時才任命、任務完成就該辭職；蘇拉經法律任命，沒有期限
          - 兩者沒有差別，只是名稱不同
          - 傳統的獨裁官由保民官任命，蘇拉由執政官任命
        answer: 1
        explain: 傳統的獨裁官由執政官在緊急狀況下任命，任務完成就該辭職，常見的說法是最長六個月。蘇拉用《瓦勒里烏斯法》成為沒有期限、免除過去行為責任的獨裁官，還重新安排國家制度；後來凱撒更當上終身獨裁官，才有了今天「獨裁者」的意思。
        hints:
          - 傳統的獨裁官是平時就有的，還是緊急時才設？
          - 誰任命獨裁官？任務完成之後他該做什麼？
        ref: event-roman-republic-founding#C7
      - kind: short
        q: 有人說「格拉古兄弟是替窮人對抗貪婪富人的英雄，沒有爭議」。用一兩句話說明，這句話哪裡過於簡化。
        model: 提比略讓人民大會撤換否決他的同僚、又想連任保民官，反對者認為這違反慣例；義大利的同盟者也是土地改革的強力反對者；而「農民被大莊園擠垮」這個傳統說法，近年學者也有修正。
        explain: 格拉古兄弟處理的問題是真的，但做法有爭議，受益者與反對者也不是簡單的「窮人對富人」。卡片也提醒，兄弟死後，蓋烏斯的多數法律還保留下來，共和又維持了近百年，所以不能說「格拉古之後共和就立刻倒了」。
        hints:
          - 提比略處理同僚否決的辦法，當時所有人都同意嗎？
          - 義大利的同盟者，是支持還是反對土地改革？
          - 「農民被大莊園擠垮」這個說法，卡片說近年怎麼了？
        ref: event-gracchi-reforms#C1
  - type: recap
    model_answer: 羅馬人趕走國王（細節多是傳說）之後，設了兩位任期一年、能互相否決的執政官，加上終身的元老院、公民大會和保民官，波利比烏斯稱讚這是互相牽制的混合政體；但能參與的只有男性公民，權力長期集中在富有家族，奴隸、女性、被征服者都在門外。平民靠集體撤離爭到保民官和成文法，這時制度還能用談判化解衝突。第二次布匿戰爭顯示，羅馬的同盟網絡與動員能力撐得住；戰後的土地問題（傳統說法，近年有修正）與義大利同盟者的不滿，是之後的背景。提比略用撤職繞過同僚否決，想連任時被打死，之後蓋烏斯之死、元老院最終決議，讓政治衝突從議場走向街頭。馬略收志願兵（是否「改革」有爭論）、同盟者戰爭、蘇拉進軍羅馬和公敵宣告、無期限獨裁官，一步步打破舊慣例，最後凱撒帶兵渡盧比孔河。所以共和為什麼壞掉，沒有單一答案：土地與兵源、暴力、軍隊的忠誠，以及誰被排除在外，都有份；哪個最關鍵，學者也還在吵。這題沒有標準答案，你也可以挑你覺得最關鍵的一個。
reflect: 提比略的法案被同僚否決，他選擇用大會把對方撤職，法案通過了，卻也讓反對者有了攻擊他的理由。想一次你在班上或社團，覺得規則擋住了一件你認為對的事：你當時怎麼做？現在回頭看，哪一步的代價是你一開始沒想到的？

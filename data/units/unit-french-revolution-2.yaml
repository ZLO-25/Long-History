id: unit-french-revolution-2
title: 法國大革命（下）：「人人平等」怎麼走到斷頭台，又換來一個皇帝？
histories: [歐洲史, 世界通史]
mystery: 1789 年 8 月，法國宣告「人生而自由，在權利上一律平等」。不到五年，連許多帶頭的革命領袖都上了斷頭台；再過十年，法國人又有了一位皇帝。追求自由的革命，為什麼會走到這裡？
teaser: 一份寫著「人人平等」的宣言、一疊越印越多的紙幣、一場決定國王命運的表決、一部要妻子服從丈夫的法典。
goals:
  - 能判讀《人權和公民權宣言》第 1 條，並說出 1791 年憲法和德古熱的《女權宣言》怎麼顯示「人人」其實不包括所有人
  - 能說明戰爭、物價（指券）與恐懼怎麼把革命推向恐怖統治
  - 能說明旺代戰爭中「另一邊」的人怎麼看革命
  - 能比較人權宣言與拿破崙法典，說出拿破崙保留了革命的什麼、收回了什麼
minutes: 42
steps:
  - type: hook
    text: |
      想像全班投票通過一條新班規：「每個人都有平等的發言權」。可是過了一陣子，班上開始抓「破壞團結的人」，誰說錯話就被記名字，連當初帶頭訂班規的人也被記了。最後大家累了，說：「乾脆讓一個能幹的人來當班長，什麼都他決定好了。」
      法國大革命後半段，就有點像這樣。這一課我們看：「人人平等」寫下來之後，發生了什麼事？
  - type: card
    id: event-declaration-rights-of-man
    depth: understand
    prompt: 先讀宣言寫了什麼，再讀 1791 年憲法：誰才能當「主動公民」？德古熱的《女權宣言》改寫了哪一句？
  - type: source
    card: event-declaration-rights-of-man
    idx: 0
    question: 依照宣言第 1 條，社會上的差別（例如身分高低）在什麼情況下才可以存在？
    options:
      - 只能建立在公共利益之上
      - 看出身是貴族還是平民
      - 由國王決定
      - 有錢的人可以多一點權利
    answer: 0
    explain: 「Social distinctions may be founded only upon the general good」：社會上的差別只能建立在公共利益之上。這句話等於宣告：貴族、教士靠出身得到的特權，從此沒有正當性。但要注意，宣言寫的是 Men（人／男人），1791 年的憲法也只讓繳稅的成年男人當「主動公民」。
    hints:
      - 讀括號裡的中文翻譯，找到第二句的「只能建立在……之上」。
      - 「公共利益」是某個人的好處，還是大家的好處？
      - 想想看：舊制度裡的貴族特權，是根據什麼來的？
    ref: event-declaration-rights-of-man#C4
  - type: card
    id: social-womens-march-versailles
    depth: understand
    prompt: 從巴黎平民的生活看革命：一個工人要花多少收入買麵包？1789 年 10 月，婦女為什麼走到凡爾賽？
  - type: card
    id: finance-assignats
    depth: understand
    prompt: 革命政府接手了國王的債，發明了一種新紙幣。注意指券為什麼越印越多？一張 100 里弗的指券，後來剩多少？
  - type: decision
    role: 你是 1793 年 1 月國民公會裡的一位議員
    situation: |
      路易十六在 1791 年 6 月喬裝出逃、在瓦倫被抓回來；1792 年法國對奧地利開戰，8 月王權被推翻，9 月共和成立。現在國民公會要決定怎麼處置被廢的國王。
      羅伯斯比等雅各賓派說：很多人懷疑國王和外國勾結，他危害國家安全，根本不用審，必須處死。吉倫特派則主張：把判決交給全國人民公投，或者就算判了死刑，也先緩期執行。
      先別急著看選項：如果你是這位議員，只知道這些，你會怎麼投？
    options:
      - { label: 投「無條件、立即處死」, result: 這是最後過半的選擇。721 位議員中，有 361 人投給無條件立即處死，剛好多一票過半；1793 年 1 月 21 日路易十六被送上斷頭台。 }
      - { label: 投「交給全國人民公投」, result: 議員們真的表決過這個提議，但被否決了。推測：如果真的交給公投，結果難以預料，也可能拖上很久，讓國內各派爭得更厲害。後果只能推測。 }
      - { label: 投「判死刑，但緩期執行」, result: 議員們也表決過緩刑，同樣被否決。推測：國王留在獄中，可能成為保王派和外國軍隊號召的對象，也可能讓國內局勢暫時緩和。歷史沒有走這條路，所以後果只能推測。 }
    actual: 國民公會先表決國王有罪（沒有人投反對），再否決交給公投，最後以剛好過半的票數決定無條件立即處死，緩刑提案也被否決。路易十六在 1793 年 1 月 21 日被處決，同年法國西部爆發旺代戰爭、巴黎走向恐怖統治。
    ref: event-execution-louis-xvi#C2
    note: 「沒有發生的選項」的後果都是推測，標示清楚。決策前的三張卡（人權宣言、婦女進軍、指券）都沒有寫到國王的判決結果；mystery 與 teaser 也已避開。
  - type: card
    id: event-execution-louis-xvi
    depth: understand
    prompt: 看看從瓦倫出逃到處決國王的經過。讀羅伯斯比的演說時想一想：他說「路易不是被告，你們也不是法官」，是什麼意思？
  - type: card
    id: event-reign-of-terror
    depth: understand
    prompt: 1793 年的法國同時面對外國軍隊、內戰和物價上漲。注意《嫌疑犯法》怎麼定義「嫌疑犯」？恐怖統治怎麼結束？
  - type: card
    id: war-vendee
    depth: understand
    prompt: 從「另一邊」看革命：法國西部的農民為什麼起來反抗？「地獄縱隊」做了什麼？史家為什麼對這場戰爭該怎麼稱呼吵得很兇？
  - type: card
    id: event-brumaire-coup
    depth: understand
    prompt: 恐怖統治結束後，督政府並不穩定。注意西哀士為什麼想找「一把劍」？拿破崙怎麼在兩天裡拿到權力？
  - type: card
    id: event-napoleonic-code
    depth: understand
    prompt: 拿破崙留下最久的東西不是戰功，而是一部法典。注意它保留了革命的哪些原則，又對女性寫了什麼？
  - type: chain
    prompt: 把下列事件依照「因 → 果」排成一條鏈（最上面是最早的原因）。
    items:
      - 1789 年國民議會通過《人權和公民權宣言》
      - 1791 年國王一家出逃，在瓦倫被抓回
      - 1792 年對外開戰，8 月王權被推翻、9 月共和成立
      - 1793 年 1 月處決路易十六，3 月旺代爆發叛亂
      - 1793–1794 年恐怖統治，1794 年熱月政變處死羅伯斯比
      - 1799 年霧月政變，拿破崙掌權
    explain: 宣言把主權交給國民，國王的地位越來越尷尬；瓦倫出逃讓很多人不再相信國王。對外戰爭加上對「叛徒」的恐懼，推翻了王權、處決了國王；處決與徵兵又引爆旺代的叛亂。內外交迫之下，國民公會用恐怖統治對付「嫌疑犯」，直到 1794 年熱月政變。之後的督政府不穩定、不得人心，最後由拿破崙用軍隊結束了這一切。
    hints:
      - 宣言是 1789 年，最早。
      - 國王是先出逃，後來才被處決。
      - 羅伯斯比倒台後，還要再過五年拿破崙才掌權。
    ref: event-french-revolution#C2
  - type: compare
    cards: [event-declaration-rights-of-man, event-napoleonic-code]
    prompt: 比一比革命初期的宣言和拿破崙的法典：拿破崙保留了什麼、收回了什麼？
    rows:
      - { aspect: 時間, a: 1789 年 8 月 26 日, b: 1804 年 3 月 21 日頒布，1807 年改名《拿破崙法典》 }
      - { aspect: 平等, a: 「人生而自由，在權利上一律平等」；社會差別只能建立在公共利益之上, b: 所有法國人都享有民事權利，各地不再用不同的法律和封建習慣 }
      - { aspect: 女性, a: 宣言沒有提女性；1791 年憲法只讓繳稅的成年男人當主動公民，德古熱另寫《女權宣言》抗議, b: 第 213 條寫「丈夫應保護妻子，妻子應服從丈夫」 }
      - { aspect: 宗教與國家, a: 宣言沒有一條專門講教會；它寫的是主權屬於國民（第 3 條）、法律是公意的表現（第 6 條）, b: 結婚和出生登記由政府官員辦理，不再交給教會；史家 Lentz 說法典的原則之一是「國家不依附宗教」 }
    question: 有人說「拿破崙是大革命的繼承者」，也有人說「拿破崙是大革命的終結者」。請用表格裡的一兩列，說說你比較同意哪一個，或兩個都對在哪裡。
    model_answer: 兩種說法都有道理。說他是繼承者：法典把「法律之前人人平等」、人人享有民事權利、出生和結婚由政府登記這些革命的原則，寫成全國統一、取代封建時代七拼八湊法律的法典，還隨著法軍傳到歐洲各地。說他是終結者：他用軍隊推翻督政府，自己當上終身執政、再稱帝，議會的權力被削弱；法典也明文要妻子服從丈夫，已婚婦女的權利比未婚或守寡的女人還少。可以說，拿破崙保留了革命對「特權」的否定，卻收回了革命對「權力要由人民決定」的追求。這題沒有標準答案。
    hints:
      - 先看「平等」那一列：法典有沒有延續宣言的想法？
      - 再看「女性」那一列：哪一邊對女性更不平等？
      - 想想看：一個人掌握大權、用法律保住革命的部分成果，這算繼承還是結束？
  - type: today
    card: event-reign-of-terror
    question: 有人說「恐怖統治證明，革命一定會變成獨裁」。這個說法哪裡不成立？
    model_answer: 先說不能類比的地方：1793 年的法國沒有獨立的司法審查、沒有成熟的政黨與新聞自由保障，國民公會同時是立法者、行政者和審判者，而且正同時面對外國軍隊、內戰和物價飛漲；這和今天有憲法法院、上訴制度、國際人權公約的國家情境很不一樣。把「所有革命」都說成一定會變獨裁，也忽略了每場革命面對的條件不同。可以借來想的是：當一個政府認為自己處在「生死存亡」之際，又把「敵人」的定義寫得很模糊（例如《嫌疑犯法》說「言行顯示支持暴政」的人），權力就很容易被用來對付任何不同意見的人。
  - type: check
    items:
      - kind: choice
        q: 1793 年處決路易十六的表決，結果是怎樣？
        options: [全體議員一致通過，立即處死國王, 交給全國人民公投，由多數人民決定處死, 721 人中 361 人投給無條件立即處死，剛好多一票過半, 判處死刑，但緩期執行]
        answer: 2
        explain: 議員們先表決國王有罪，再否決把案子交給公投；最後 721 人中有 361 人投給無條件立即處死，剛好多一票過半。
        hints: [回想決策題裡你投票時有哪些選項。, 「剛好多一票」的意思是什麼？]
        ref: event-execution-louis-xvi#C2
      - kind: order
        q: 依時間先後排列：
        items: [人權宣言通過, 婦女進軍凡爾賽, 國王出逃被抓回瓦倫, 處決路易十六, 羅伯斯比在熱月政變後被處決, 霧月政變, 《法國人的民法典》頒布]
        explain: 1789 年 8 月人權宣言 → 1789 年 10 月婦女進軍凡爾賽 → 1791 年 6 月瓦倫 → 1793 年 1 月處決國王 → 1794 年 7 月熱月政變 → 1799 年 11 月霧月政變 → 1804 年 3 月民法典。
        hints: [宣言和婦女進軍都在 1789 年。, 民法典是拿破崙掌權之後才頒布的。]
        ref: event-french-revolution#C2
      - kind: short
        q: 用一兩句話說明：為什麼旺代的農民會起來反抗革命政府？
        model: 1790 年政府要神父宣誓效忠國家，很多村民熟悉的神父因為拒絕而被趕走；1793 年 2 月國民公會又下令全國徵兵 30 萬，由各村未婚男子抽籤。對宗教的不滿加上徵兵，讓旺代一帶的農民在 3 月起事。
        explain: 革命對巴黎的群眾來說是解放，對旺代的農民來說卻是趕走神父、把兒子抓去當兵。從不同的地方看，同一場革命可以很不一樣。
        hints: [看旺代卡：起事前，村裡的神父發生了什麼事？, 1793 年 2 月政府下了什麼命令？]
        ref: war-vendee#A2
  - type: recap
    model_answer: 1789 年的《人權和公民權宣言》寫下「人生而自由，在權利上一律平等」，否定了出身帶來的特權；但 1791 年的憲法只讓繳稅的成年男人當主動公民，德古熱寫《女權宣言》抗議，殖民地的奴隸也還沒有自由。之後，國王出逃失去信任，對外戰爭、物價上漲（指券越印越多）和對「叛徒」的恐懼一起把革命推向更激烈的方向：1792 年共和成立，1793 年國王以剛好過半的票數被處死，西部的旺代起來反抗，巴黎則用《嫌疑犯法》和斷頭台對付「嫌疑犯」，直到 1794 年熱月政變處死羅伯斯比。之後的督政府不穩定，1799 年拿破崙用軍隊奪權，1804 年稱帝，並頒布了保留「法律之前平等」、卻要妻子服從丈夫的民法典。要記得兩個提醒：第一，恐怖統治的正式死刑判決大多不在巴黎，旺代戰爭的死亡人數和該怎麼稱呼，史家還在爭論；第二，「革命一定會變獨裁」不是歷史的定律，每一步都和當時的戰爭、物價和恐懼有關。這是一種參考說法，不是標準答案。
reflect: 恐怖統治時，《嫌疑犯法》把「言行顯示支持暴政」的人都當成嫌疑犯，標準很模糊。你有沒有看過一群人因為害怕或生氣，開始用很模糊的標準指責別人？那時候你做了什麼？如果再遇到一次，你會怎麼做？

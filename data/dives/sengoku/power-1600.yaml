# 大名勢力示意圖：1600 年 9 月（關原之戰前夕）
# 畫法同 power-1582.yaml。顏色：偏藍＝東軍（德川方），偏紅＝西軍（石田・毛利方），灰＝立場不明或中途倒戈。
# 2026-11-03 查核：秀賴石高改為「蔵入地最盛期逾 220 萬石、關原後約 65 萬石」（原寫 65 萬石為戰後數字）；筑前條目補筑後立花宗茂（西）；紀伊桑山一晴依日文維基改為東軍、整條改灰並與堀內（西）並列；新增因幡（宮部長熙 西／龜井茲矩 東，灰）補 JP-31 東半空白；其餘 31 個勢力陣營抽查無誤。
year: 1600
title: 關原之戰前夕（1600 年 9 月）：東軍藍、西軍紅
note: 以令制國為單位、用今日縣界近似的示意圖。關原不是「兩塊領土打仗」，而是散布全國的大名各自選邊：同一個縣裡常常東西軍都有，本圖只標該國主要大名並以顏色表示陣營。小早川秀秋（筑前）開戰時在西軍、中途倒戈，畫成灰色。

# 深入專題：大航海時代（檔名＝id 去掉 dive-）。程式說明見 docs/dives.md 第十一節（主視覺：航線）
id: dive-age-of-discovery
title: 大航海時代：海洋怎麼把世界連成一張網
question: 1400 年時，美洲人、歐洲人和東亞人幾乎不知道彼此存在；兩百年後，美洲的白銀流進中國、臺灣的鹿皮賣到日本、番薯長在福建的山坡上。這張網是誰織起來的？誰得到好處、誰付出代價？
blurb: 先看中國和葡萄牙兩種出海方式，再看西班牙橫越大西洋、美洲被征服與哥倫布大交換，接著看橫越太平洋的白銀怎麼把臺灣捲進來，最後是荷蘭、鄭氏在東亞海域爭奪臺灣。多數卡片都能連到原住民族、被奴役者與在地商人的角度。
range: { start: 1405, end: 1684 }
histories: [歐洲史, 東南亞史, 臺灣史, 中國史, 美洲史]
visual: routes
voyages:
  title: 航線圖
  subtitle: 誰在什麼時候走哪一條海路
  caveat: 帆船要順著風帶和洋流走，所以每條線只把史料記載的停靠港與大致的轉向點連起來，點與點之間的弧線是示意，不是某艘船真正的航跡。點一條航線會打開它的卡片，地圖也會飛到那條線。
  items:
    - { route: sea-zheng-he, card: event-zheng-he-voyages, label: 鄭和第七次下西洋, year: 1431, note: 比歐洲人更早，明朝就派出大船隊橫渡印度洋；這條線畫到波斯灣口的忽魯謨斯，分隊另到東非。後來朝廷自己喊停。 }
    - { route: sea-columbus-1492, card: event-columbus-aztec, label: 哥倫布第一次橫渡大西洋, year: 1492, note: 美洲和歐亞非兩個隔絕上萬年的世界，從這一年接在一起。 }
    - { route: sea-da-gama-1497, card: event-vasco-da-gama, label: 達伽馬繞過非洲到印度, year: 1497, note: 葡萄牙想繞過中間商、直接從海路到印度買香料，這條路真的走通了。 }
    - { route: sea-magellan, card: event-magellan-circumnavigation, label: 麥哲倫—埃爾卡諾環球航行, year: 1519, note: 第一次有船繞地球一圈；出發的約 270 人，只有 18 人隨維多利亞號回到西班牙。 }
    - { route: sea-manila-galleon, card: commodity-manila-galleon, label: 馬尼拉大帆船（墨西哥—菲律賓來回）, year: 1565, note: 墨西哥的白銀經太平洋運到馬尼拉，換走福建商人運來的絲綢，這條航線走了 250 年。 }
    - { route: sea-voc-tayouan, card: finance-voc, label: 荷蘭東印度公司：荷蘭—巴達維亞—大員—日本, year: 1624, note: 一家有軍隊的公司，把荷蘭、巴達維亞、臺灣和日本連在一起，臺灣被它統治了 38 年。 }

id: unit-athens-sparta
title: 雅典與斯巴達：強權為什麼會開戰？
histories: [希臘羅馬史, 世界通史]
mystery: 一個國家變強，鄰國一定會害怕，最後一定會開戰嗎？
teaser: 兩千四百年前的一句話，今天還被拿來預測大國會不會打仗。
goals:
  - 能分清楚戰爭的「長期結構原因」和「直接導火線」
  - 能判讀一段修昔底德的敘述，說出它是誰的觀點
  - 能比較希臘和中國春秋時代兩場「盟主之戰」的異同
  - 能指出把古代戰爭類比今天時，哪裡不成立
minutes: 30
steps:
  - type: hook
    text: |
      想像你們學校有兩個很強的社團：一個人數最多、最會比賽；另一個本來很小，這幾年突然變得很有錢、很多人加入。
      老社團的社長開始緊張：「他們會不會搶走我們的地位？」
      兩千四百年前的希臘，就發生了很像的事，只是社團換成了兩個城邦，結局是一場打了 27 年的戰爭。
  - type: card
    id: war-greco-persian
    depth: story
    prompt: 先看雅典是怎麼變強的：注意那筆「意外的錢」。
  - type: card
    id: commodity-laurion-silver
    depth: story
    prompt: 雅典的錢從哪裡來？誰在礦坑裡工作？
  - type: card
    id: war-peloponnesian
    depth: understand
    prompt: 讀「起因：結構與導火線」時，試著把原因分成兩堆：很久以前就存在的，和最後點燃戰爭的。
  - type: source
    card: war-peloponnesian
    idx: 0
    question: 修昔底德這句話，最能說明下列哪一件事？
    options:
      - 戰爭是因為墨伽拉法令這件小事引起的
      - 修昔底德認為表面爭端之下，有一個更深的原因：權力消長和恐懼
      - 斯巴達人親口承認他們害怕雅典
      - 這是雅典和斯巴達簽訂的和約內容
    answer: 1
    explain: 這句話是修昔底德自己的判斷，不是斯巴達人說的話，也不是條約。他把「雅典變強＋斯巴達害怕」當成真正的原因，把科西拉、波提狄亞等爭端看成表面的導火線（墨伽拉法令他只是順帶一提）。讀史料時先問：「這是誰說的？他想說服誰？」
    hints:
      - 先看句子的主詞：誰變強了？誰感到害怕？
      - 這句話是寫歷史的人（修昔底德）的判斷，還是當事人的原話？
      - 「made war inevitable」的意思是「讓戰爭無法避免」，它在講的是原因的深淺。
    ref: war-peloponnesian#A2
  - type: chain
    prompt: 把下列事件依照「因 → 果」排成一條鏈（最上面是最早的原因）。
    items:
      - 雅典在勞里昂挖到豐富銀礦，拿錢造艦隊
      - 雅典艦隊在薩拉米斯打敗波斯
      - 雅典成為提洛同盟的盟主，收取盟邦貢金
      - 斯巴達對雅典的擴張感到警戒
      - 伯羅奔尼撒戰爭爆發
    explain: 銀礦 → 艦隊 → 打敗波斯 → 成為同盟盟主並收錢 → 引起斯巴達警戒 → 開戰。每一步都讓雅典更強，也讓斯巴達更不安。注意：這條鏈說明「壓力怎麼累積」，但不代表每一步都「必然」導向下一步。
    hints:
      - 先找出最早發生、而且跟「錢」有關的事件。
      - 雅典要先有艦隊，才可能打贏海戰；打贏海戰之後，其他城邦才會找它當盟主。
      - 最後兩步：先有「害怕」，才有「開戰」。
    ref: war-peloponnesian#A2
  - type: card
    id: war-chengpu
    depth: story
    prompt: 同一個時代的中國也有「兩大集團」對決。讀完想想看：哪裡像？哪裡不像？
  - type: compare
    cards: [war-peloponnesian, war-chengpu]
    prompt: 比一比兩場「盟主之戰」。
    rows:
      - { aspect: 時間, a: 前 431–404 年（打了 27 年）, b: 前 632 年（一天決勝的會戰） }
      - { aspect: 對手, a: 雅典帶提洛同盟 vs 斯巴達帶伯羅奔尼撒同盟, b: 晉國帶齊、秦、宋 vs 楚國帶陳、蔡 }
      - { aspect: 結果, a: 雅典投降，艦隊只剩 12 艘, b: 晉文公成為霸主，楚國沒有因此衰落 }
      - { aspect: 誰寫的歷史, a: 雅典人修昔底德（他自己參過戰）, b: 《左傳》等後代整理的書，不同古書說法不一 }
    question: 兩場戰爭最大的相同點和最大的不同點各是什麼？
    model_answer: 相同點：都是兩大集團各帶一批盟友，爭奪「誰當老大」。不同點：伯羅奔尼撒戰爭是長期消耗戰，最後靠瘟疫、遠征失敗和波斯的錢分出勝負；城濮是一場會戰就定勝負，而且春秋霸主名義上還要尊周天子。另外，兩邊留下的史料性質也不一樣，要小心比較。
    hints:
      - 先看表格裡的「對手」那一列，兩邊的結構像不像？
      - 再看「時間」和「結果」：打多久、輸的一方怎麼了？
      - 最後想想「誰寫的歷史」會不會影響我們看到的版本。
  - type: decision
    role: 你是前 415 年的雅典將軍
    situation: |
      戰爭打到一半，雙方簽了和約，但都沒有真正遵守。西西里島上的盟邦塞傑斯塔來求救，請雅典幫忙對付鄰城塞利努斯，還答應出錢。
      公民大會上，年輕的亞西比德熱烈主張：趁機出兵，說不定能拿下整個西西里，連富庶的敘拉古都是雅典的；老將尼西阿斯警告：西西里太遠了，斯巴達還在旁邊虎視眈眈。你要怎麼投票？
    options:
      - { label: 支持大規模遠征西西里, result: 這正是雅典當年的選擇。兩批共約 200 艘船、上萬名士兵出發，前 413 年全軍覆沒，約 7,000 名俘虜被關進採石場，很多人病死、餓死，其他人被賣為奴隸。 }
      - { label: 反對遠征，守住本土和海上糧道, result: 推測：雅典可以保住艦隊和兵力，但西西里的資源也拿不到；戰爭可能拖得更久。歷史沒有走這條路，所以後果只能推測。 }
    actual: 雅典選擇了遠征，結果慘敗。同一時間斯巴達在阿提卡築堡常駐，上萬名奴隸逃走，銀礦受損；波斯又開始出錢幫斯巴達建艦隊。遠征的失敗成為雅典最後投降的重要原因之一。
    ref: war-peloponnesian#A7
    note: 「沒有發生的選項」的後果都是推測，標示清楚。
  - type: today
    card: war-peloponnesian
    question: 有人說「今天的大國競爭就是現代版的雅典與斯巴達」。這個類比哪裡不成立？
    model_answer: 至少三點：一、古代沒有核武，今天大國開戰的代價完全不同；二、今天各國經濟互相依賴得多，雅典和斯巴達沒有這種程度的貿易網絡；三、雅典輸掉的關鍵包括瘟疫和西西里遠征這些自己的決定，不能只用「崛起對老大」來解釋。所以類比可以幫我們提問，但不能拿來預測結果。
  - type: check
    items:
      - kind: choice
        q: 下列哪一個是伯羅奔尼撒戰爭的「導火線」，而不是長期結構原因？
        options: [雅典勢力增長, 斯巴達的恐懼, 雅典對墨伽拉實施貿易禁令, 雅典以盟邦貢金擴建艦隊]
        answer: 2
        explain: 墨伽拉法令是戰前發生的具體事件，屬於導火線；雅典變強、斯巴達害怕、用貢金建艦隊，則是長期累積的結構。
        hints: [導火線通常是一件「具體、時間很近」的事。, 哪一個選項有明確的命令或決定？]
        ref: war-peloponnesian#A2
      - kind: order
        q: 依時間先後排列：
        items: [薩拉米斯海戰, 提洛同盟成立, 伯羅奔尼撒戰爭開始, 西西里遠征失敗, 雅典投降]
        explain: 前 480 薩拉米斯 → 前 478/477 提洛同盟 → 前 431 開戰 → 前 413 西西里慘敗 → 前 404 投降。
        hints: [先打敗波斯，才有反波斯的同盟。, 西西里遠征發生在戰爭中段。]
        ref: war-greco-persian#A7
      - kind: short
        q: 用一兩句話說明：為什麼斯巴達本來沒有艦隊，最後卻能在海上打敗雅典？
        model: 因為戰爭後期波斯出錢支持斯巴達建艦隊，條件是斯巴達承認波斯對小亞細亞的控制；加上雅典在西西里損失大量船隻與兵力。
        explain: 關鍵是「外部勢力介入」：第三方的錢改變了雙方實力。
        hints: [回去看卡片的「交戰方與聯盟結構」。, 誰有錢、又想讓雅典變弱？]
        ref: war-peloponnesian#A1
  - type: recap
    model_answer: 不一定。雅典變強、斯巴達害怕，確實讓衝突的壓力越來越大；但修昔底德說「無可避免」只是一種詮釋，像卡根這樣的史家就認為，雙方的領導人其實有機會避免戰爭，是一連串不肯讓步的決定把雙方推進戰爭。而且雅典最後輸掉，跟瘟疫、西西里遠征和波斯的錢都有關係，不只是「崛起對老大」。
next: [unit-rome-fall, unit-imjin-war]

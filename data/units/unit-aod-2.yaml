id: unit-aod-2
title: 白銀、鹿皮與熱蘭遮城：臺灣怎麼被捲進世界
histories: [臺灣史, 世界通史, 中國史, 東南亞史, 歐洲史]
mystery: 1600 年前後，美洲白銀經馬尼拉流入中國，荷蘭人、西班牙人、日本人、鄭氏都在搶東亞海上的生意。為什麼臺灣會在 1624 年前後突然變成各方都想要的地方？原住民族與漢人農民，各付出了什麼代價？
teaser: 一種明朝人要用來繳稅的金屬，一條橫渡太平洋的航線，一座被荷蘭人蓋起來的城堡，和一群拿鐮刀與竹槍起事的農民。
goals:
  - 能說出美洲白銀、馬尼拉、福建商人與荷蘭人來到大員之間的因果連結
  - 能站在明朝官員的位置，比較 1622 年面對荷蘭人占澎湖時當時看得到的幾條路
  - 能分辨荷蘭人、西拉雅人、漢人農民與明朝官員對同一件事的不同看法，並指出誰留下了紀錄
  - 能依因果排出 1622 澎湖、1624 大員、1652 郭懷一、1662 鄭成功的關係，並分辨哪一組只是先後
minutes: 45
level: 皆可
curriculum: ["歷 Bb-IV-1", "歷 Bb-IV-2", "歷 Ia-IV-2", "歷 Mb-V-1"]
companion: unit-aod-3
steps:
  - type: hook
    text: |
      想像全校的福利社只收一種貼紙，這種貼紙又只有校外一個班級拿得到。於是校外的同學提著貼紙來，換走福利社最好賣的東西；想做生意的人，就在通往福利社的必經路口搶位置。（這只是比喻。）
      1600 年前後，那種「貼紙」是白銀。美洲挖出來的銀，一路橫渡太平洋到馬尼拉，再被福建商人換走絲綢與瓷器。而這條銀路旁邊，就是臺灣。
      這個單元要看：這條銀的路怎麼把臺灣拉進世界，臺灣上的人又付出了什麼。
    guess:
      q: 1600 年前後，美洲的白銀大量流進中國。你猜中國為什麼需要這麼多白銀？
      options:
        - 中國的銀礦枯竭了，需要大量進口來補上
        - 明朝改用白銀繳稅，白銀在中國比在別處更值錢
        - 皇帝想用白銀蓋更大的宮殿，需要大量原料
        - 美洲人很愛中國的茶葉，用白銀來付茶錢
      reveal: 卡片說，明朝改用白銀繳稅之後，銀在中國比在別處值錢得多，大約是歐洲的兩倍，所以美洲的白銀才會大量經過馬尼拉，換走福建商人運來的絲綢與瓷器。
  - type: card
    id: event-longqing-kaihai
    depth: understand
    prompt: 明朝原本禁止民間出海，後來只開了一個口岸。注意「開」的是什麼、有哪些限制，以及月港商人出海後換回了什麼。
    focus: [C4, C6]
    quick:
      - q: 隆慶開海是「全面開放」嗎？
        a: 不是。只有福建月港一個口岸允許民間出洋，商人要先申請許可證（文引）、繳稅，仍禁止去日本，也不准運武器和鐵、硫磺等物資。
      - q: 月港商人出海後，換回了什麼？
        a: 他們把絲綢、瓷器運到馬尼拉，換回西班牙人從美洲運來的白銀；西班牙銀元透過月港流入中國。
  - type: card
    id: commodity-manila-galleon
    depth: understand
    prompt: 白銀是怎麼橫渡太平洋的？注意為什麼要千里迢迢送銀子，以及這條路線的代價。
    focus: [B6]
    quick:
      - q: 為什麼要千里迢迢把美洲的銀子運到亞洲？
        a: 因為明朝改用白銀繳稅，使白銀在中國的價值約是歐洲的兩倍，美洲白銀因此大量流向亞洲。
      - q: 這條航線有什麼代價？
        a: 航程凶險：回美洲要四到八個月，一趟常死幾十到一百多人；馬尼拉的華人被隔離居住，還多次遭到屠殺。
  - type: card
    id: event-dutch-penghu-1622
    depth: understand
    prompt: 荷蘭人其實先到的是澎湖，不是臺灣。注意他們想要什麼、怎麼築城，以及明朝官員一開始怎麼回應。
    focus: [C1]
    quick:
      - q: 荷蘭人為什麼要占澎湖？
        a: 荷蘭東印度公司想打進中國市場，但明朝只讓特定港口與商人和外國人往來，荷蘭人就想用武力或占據據點，逼明朝開放。
      - q: 澎湖的城是誰蓋的？
        a: 荷蘭人抓福建沿海的漢人當勞工，被迫築城。
  - type: decision
    role: 你是 1622 年的福建巡撫商周祚
    situation: |
      荷蘭東印度公司的艦隊攻打澳門失敗後，退到澎湖，從 8 月開始築城，還抓福建沿海的漢人當勞工。他們的目的，是用占據據點逼明朝開放通商。
      明朝的規矩是：只讓特定港口與商人和外國人往來。
      先別急著看選項：如果是你，你會怎麼回應？
    options:
      - label: 同意荷蘭人留在澎湖，開放他們和福建通商
        result: 推測：卡片說，荷蘭人占澎湖就是想逼明朝開放通商；但明朝官員會不會答應、答應之後福建的海防與商人會怎樣，卡片都沒有記載。歷史沒有走這條路，所以後果只能推測。
      - label: 要荷蘭人退到臺灣，那裡可以通商
        result: 這是歷史上 1622 年 9 月 19 日商周祚的做法。但荷蘭人沒有照辦，10、11 月反而襲擊廈門，也攻擊漳州的港口。
      - label: 立刻調集水師，進攻澎湖，把荷蘭人趕走
        result: 推測：卡片沒有記載 1622 年的明軍能不能辦到。歷史上，明軍是 1624 年才大舉進逼澎湖。歷史沒有在 1622 年走這條路，所以後果只能推測。
    actual: 巡撫商周祚 1622 年要荷蘭人退到臺灣通商，荷蘭人沒有照辦，還襲擊福建沿海。1623 年《明熹宗實錄》記他奏報「紅夷」已拆城離開，但荷蘭人後來又回頭在澎湖築城；夏天，主和的商周祚被換掉，強硬的南居益接任。1624 年 7 月 30 日明軍包圍荷蘭人的城堡，8 月 3 日荷蘭人求和，撤出澎湖，轉到臺灣的大員。
    ref: event-dutch-penghu-1622#C2
    note: 沒有發生的選項，後果都是推測，第一個與第三個選項是本單元為了讓你比較而設計的。還要注意：「臺灣當時不屬明朝」是當時官員的判斷，不能拿來直接套今天的主權爭論。
  - type: card
    id: event-dutch-formosa
    depth: understand
    prompt: 荷蘭人在大員落腳之後，怎麼讓西南部的田地被開墾？誰得到好處、誰付出了代價？
    focus: [C4, C5]
    quick:
      - q: 荷蘭人手不夠，怎麼讓臺灣的田地被開墾？
        a: 從福建招募漢人來開墾，提供免費船運、工具、耕牛和種子，再向他們收人頭稅和農產稅（歐陽泰稱這種合作為「共構殖民」）。
      - q: 誰受益、誰受損？
        a: 受益的是公司與股東、取得土地與經商機會的漢人移民與商人；受損的是被征服、被課稅的原住民聚落，被迫繳人頭稅、常遭士兵勒索的漢人農民，以及大量被捕殺的梅花鹿。
  - type: card
    id: social-siraya-deer
    depth: understand
    prompt: 外來者忙著做生意，住在這裡的西拉雅人呢？注意他們被要求交出什麼，以及鹿皮生意改變了什麼。
    focus: [E3, E4]
    quick:
      - q: 1635–1636 年之後，西拉雅各社被要求做什麼？
        a: 約 28 社代表到大員表示歸順。和約要求他們交出土地主權、不得再攻擊荷蘭人和荷蘭的盟友，並協助荷蘭攻打其他聚落。
      - q: 鹿皮生意怎麼改變西拉雅人的生活？
        a: 1638 年出口日本的鹿皮多達 151,400 張，之後因鹿群減少降到每年約 5–8 萬張；梅花鹿大幅減少，也衝擊原住民的年齡階級社會。
  - type: card
    id: event-guo-huaiyi-1652
    depth: understand
    prompt: 荷蘭人靠漢人移民賺錢，也向他們收最多的稅。注意農民為什麼不滿，以及鎮壓的是哪些人。
    focus: [C1]
    quick:
      - q: 漢人農民為什麼不滿？
        a: 1640 年起收人頭稅，士兵常藉臨檢濫用權力；1651 年頭家陳情，只有夜間臨檢被禁止，人頭稅沒有取消。另外蔗園面積大減，許多農民失業。
      - q: 起事的人用什麼武器？荷蘭人怎麼鎮壓？
        a: 起事的多半是農民，拿鐮刀、竹槍；荷蘭人用火槍，並動員新港、蕭壠、麻豆等西拉雅聚落的戰士一起反擊，郭懷一被新港人射殺。
  - type: sources2
    a: { card: social-siraya-deer, idx: 0 }
    b: { card: event-hamada-yahei-1628, idx: 1 }
    question: 左邊是 1635 年荷蘭人與麻豆社的和約條款；右邊是 1628 年新港社人被放回後，傳教士干治士報告的內容（背景：濱田彌兵衛一行曾帶新港社的人到日本）。把它們放在一起讀，哪個說法最合理？
    options:
      - 兩份都是西拉雅人自己寫下的文字，所以能直接代表他們的想法
      - 兩份都證明西拉雅人完全支持荷蘭人的統治，沒有任何不滿的聲音
      - 兩份都是明朝官員寫給皇帝的奏章，目的是說明臺灣和朝廷有什麼關係
      - 一份是荷蘭人訂的條款，一份是傳教士轉述，聲音多半經過荷蘭人的手
    answer: 3
    why_wrong:
      - 條款是荷蘭人訂的，報告是傳教士寫的，都不是西拉雅人自己的文字；卡片也說，他們自己留下的文字很少。
      - 條款是征服之後要他們接受的條件；傳教士轉述的內容裡，西拉雅人批評荷蘭人，說日本人待他們比較好。
      - 兩份的作者是荷蘭人與傳教士，不是明朝官員。
      - null
    explain: 條款是荷蘭人在征服麻豆之後要求的：交出土地主權、不得攻擊荷蘭人。傳教士干治士的報告則轉述被放回的西拉雅人說日本人待他們很好、批評荷蘭人。兩份都是荷蘭一方寫下或轉述的。卡片提醒：西拉雅人自己留下的文字很少，大部分描述出自荷蘭人之手；轉述也不是逐字的記錄。
    hints:
      - 先分別找出兩份文字的作者：是誰訂的條款？是誰寫的報告？
      - 卡片「他們留下的證據」說，西拉雅人自己的文字多不多？
    ref: social-siraya-deer#E5
    open:
      question: 荷蘭人在大員經營、招募漢人開墾、要求原住民交出主權，這件事在荷蘭東印度公司、西拉雅人、漢人農民和明朝官員眼裡，各是什麼？請各用一句話寫，並說明哪一方的聲音比較少被留下來。
      points:
        - 荷蘭東印度公司：是賺錢的生意，不是國家；招募漢人開墾，收人頭稅與農產稅，賣鹿皮、蔗糖
        - 西拉雅人：被要求交出土地主權、協助荷蘭攻打其他聚落，鹿越抓越少，生活被迫改變
        - 漢人農民與明朝官員：農民撐起稅收卻被士兵借臨檢勒索，1652 年起事；明朝官員 1622 年要荷蘭人退到臺灣通商，《明史》記澎湖警報平息了，但荷蘭人占著臺灣如故
        - 西拉雅人自己留下的文字很少，我們讀到的聲音，大多經過荷蘭人的手
      model_answer: 荷蘭東印度公司把它當成賺錢的生意：招募漢人開墾，收人頭稅與農產稅，再賣鹿皮與蔗糖。西拉雅人被要求交出土地主權、協助荷蘭攻打其他聚落，鹿越抓越少，生活被迫改變。漢人農民撐起殖民地的稅收，卻要繳最多稅，又被士兵借臨檢勒索，1652 年起事。明朝官員則在 1622 年要荷蘭人退到臺灣通商；《明史》寫澎湖的警報平息了，荷蘭人占著臺灣的情形照舊。比較少被留下來的是西拉雅人的聲音：他們自己留下的文字很少，我們讀到的，多半經過荷蘭人的手。
  - type: card
    id: event-koxinga-taiwan
    depth: understand
    prompt: 第三個來的是鄭成功。注意他為什麼渡海，以及他的軍隊怎麼在臺灣活下來。
    focus: [C1]
    quick:
      - q: 鄭成功為什麼在 1661 年渡海攻臺？
        a: 1659 年他北攻南京失敗，在大陸沿海打不過清軍，需要新的根據地，所以把目光轉向荷蘭人控制的臺灣。
      - q: 鄭軍來臺後怎麼養活自己？
        a: 靠屯田：軍人平時種田養活自己；鄭成功病逝後，兒子鄭經接手，也靠對外貿易賺錢。
  - type: chain
    prompt: 把下列事件依照先後排成一條鏈（最上面最早）。排完會追問你：哪一組是前一件讓後一件發生，哪一組只是先後。
    items:
      - 荷蘭人占澎湖築城，被明軍逼退
      - 荷蘭人轉到大員，蓋起熱蘭遮城
      - 荷蘭人聯合新港社征服麻豆等社，各社交出土地主權
      - 漢人農民因人頭稅與勒索起事，被荷蘭與西拉雅聯軍鎮壓
      - 鄭成功渡海圍攻熱蘭遮城，荷蘭人投降
    explain: 荷蘭人先占澎湖，1624 年被明軍逼退，轉到對岸的大員；1635、1636 年征服麻豆等社；1652 年郭懷一起事被鎮壓；1661 年鄭成功渡海，1662 年初荷蘭人投降。每一步都排在前一步之後，但不是每一步都是前一步造成的。
    hints:
      - 最早的是在澎湖碰壁，最晚的是荷蘭人離開。
      - 荷蘭人先落腳大員，才有後面征服原住民聚落和招募漢人開墾。
      - 郭懷一事件是 1652 年，鄭成功渡海是 1661 年。
    ref: event-dutch-formosa#C2
    followup:
      question: 下面哪一組，只是時間上的先後，卡片並沒有把前一件寫成後一件的原因？
      options:
        - 荷蘭人被明軍趕出澎湖 → 轉到大員落腳
        - 荷蘭人招募福建漢人來開墾 → 漢人農民成為最主要的稅源，也是怨氣最大的一群
        - 郭懷一事件 → 鄭成功渡海攻臺
        - 荷蘭人招募福建漢人來開墾 → 鄭成功在現成的農業社會上屯田養兵
      answer: 2
      explain: 卡片寫鄭成功渡海的背景，是 1659 年北攻南京失敗、在大陸沿海打不過清軍；清朝的遷界令是 1661 年的事，卡片沒有把它寫成渡海的原因。荷蘭時期已有數萬漢人在西南部開墾，讓鄭家可以屯田。郭懷一事件的卡片則說，據漢人俘虜供述郭懷一曾暗示鄭成功會派艦隊，但學者認為兩者關聯不大，所以只算先後，不畫成因果。
      why_wrong:
        - 卡片說荷蘭人被明軍圍困而撤出澎湖，轉往大員落腳，這是因果。
        - 卡片說荷蘭人招募漢人來臺開墾、收人頭稅，漢人成為最主要的稅源與怨氣最大的一群，這是背景與原因。
        - null
        - 卡片說荷蘭時期已有數萬漢人在西南部開墾，鄭家來臺後能在現成的農業社會上屯田，這是背景。
  - type: transfer
    card: event-manila-1571
    case: |
      1586 年，馬尼拉的華人約有一萬人，西班牙人只有約兩千人。西班牙人把華人安置在城外的八連，訂了居民上限，並常勒索他們。1603 年，福建人閻應龍、張嶷說呂宋有金銀山，明朝派人去勘查，西班牙人懷疑這是入侵的前哨。10 月，華人起事，被西班牙、日本與他加祿盟軍鎮壓並追殺。死亡人數各說不一，英文維基寫一萬五千到兩萬五千人。福建官員指責張嶷，也說西班牙人不該殺那麼多華人，但沒有進一步行動。貿易很快恢復。英文維基還寫，後來活下來的華人每年要繳 8 比索的執照費。
    question: （延伸題，有時間再做）這一課看到，荷蘭人靠漢人農民開墾賺錢，又收稅、動員別的群體鎮壓，1652 年農民起事。請借用這個想法看 1603 年的馬尼拉：它和大員的郭懷一事件，有哪些地方像、哪些地方不同？
    hint: 先問：誰撐起當地的經濟？他們被怎麼對待？事件之後，誰出面鎮壓？再比導火線有沒有不同。
    points:
      - 像：外來的華人（大員則是漢人農民）撐起殖民地經濟，卻被限制居住、課費或課稅，又常被勒索
      - 像：殖民當局動員其他群體鎮壓，馬尼拉是日本與他加祿盟軍，大員是西拉雅人
      - 像：死亡人數各說不一，事後生意或生產仍繼續
      - 不同：導火線不同，馬尼拉是金銀山的傳言與西班牙人的猜疑，大員是人頭稅、勒索與蔗糖業衰退；一個是西班牙殖民政府，一個是荷蘭東印度公司
    model_answer: 相似的地方是：兩邊都是外來的華人或漢人撐起殖民地的經濟，卻被限制居住、課費或課稅，又常被勒索；起事之後，殖民當局都動員別的群體鎮壓，馬尼拉是日本與他加祿盟軍，大員是西拉雅人；死亡人數也都是各說不一的估計，事後生意或生產仍然繼續。不同的地方是導火線：馬尼拉是金銀山的傳言與西班牙人的猜疑，大員則是人頭稅、士兵勒索與蔗糖業衰退；管理的也不同，一邊是西班牙殖民政府，一邊是荷蘭東印度公司。這題沒有標準答案，重點是借用「靠外來移民賺錢、又怕他們」這個結構，並說清楚哪裡不同。
    ref: event-manila-1571#C6

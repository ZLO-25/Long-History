# 底圖地名的人工校訂（npm run labels 會讀這份檔）
# names：英文名 → 臺灣慣用中文譯名（蓋過 Natural Earth 的 name_zht）
# english：英文名 → 顯示用的英文（Natural Earth 原名不好讀或有誤時）
# skip：不標的地名（太冷僻、在南極、或 Natural Earth 資料有誤）
# min_zoom：英文名 → 從第幾級縮放開始顯示（歷史課常用的海、海峽提早出現）
# rivers：主要河流（Natural Earth 河流沒有中文名）；ne 是 Natural Earth 裡的英文名
# extra：Natural Earth 沒有、但歷史課常用的地名


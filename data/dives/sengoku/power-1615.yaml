# 大名勢力示意圖：1615 年（大坂夏之陣後、元和偃武）
# 2026-11-03 查核：池田忠繼已於 1615 年 3 月（夏之陣前）病死，岡山改為池田忠雄；鳥取 1615 年仍是池田長幸（6 萬石），池田光政 1617 年才入封，名稱改為因幡・伯耆諸藩；補伊予宇和島伊達秀宗（1614 年入封）、肥前唐津寺澤廣高、筑後柳川田中忠政、津輕弘前津輕氏等同縣內的大藩於說明文字。顏色與對應卡片 id 未改。
# 畫法同 power-1582.yaml。顏色：深色＝德川幕府直轄領、親藩與譜代；其餘＝外樣大名。
year: 1615
title: 元和偃武（1615 年）：幕府・親藩・譜代 vs 外樣
note: 以令制國為單位、用今日縣界近似的示意圖。豐臣家滅亡後，關東、東海、近畿與交通要地由幕府直轄或由親藩・譜代把守，外樣大名多在邊陲；同年公布武家諸法度與一國一城令。許多縣裡有好幾個藩，本圖只標石高最大的一家。

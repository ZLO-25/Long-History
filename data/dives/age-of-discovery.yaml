# 總結任務：三課都走完之後出現（points 來自三課的 goals 與 mystery）
capstone:
  question: 這個專題的大問題是：這張海上的網是誰織起來的？誰得到好處、誰付出代價？請用三課看到的例子，寫一段話比較「明朝、葡萄牙、西班牙、荷蘭東印度公司、鄭氏」：誰出錢、要什麼、怎麼控制、誰付代價。至少寫到三個以上的勢力。
  min: 100
  points:
    - 明朝：鄭和船隊由朝廷出資，為了朝貢與國威，成本高、收益比不上成本，北方又有蒙古壓力，1433 年後停止（原因不只一個）；後來只開福建月港、要許可證與稅，並不是全面開放
    - 葡萄牙：王室出資，要香料貿易，用沿岸堡壘、商館、艦隊與通行證控制航線，不占內陸；被攻擊的沿岸城市與商人付出代價
    - 西班牙：靠征服、原住民盟軍與天花控制美洲，用委託監護制與強迫勞動挖銀；馬尼拉靠華人撐起，華人被隔離又遭屠殺；美洲原住民人口大崩潰
    - 荷蘭東印度公司與鄭氏：公司用特許狀、軍隊與股東的錢，在大員靠漢人開墾、人頭稅與鹿皮賺錢，西拉雅人與漢人農民付代價；鄭成功在大陸打不過清軍，渡海取代荷蘭，靠屯田立足
  model_answer: 明朝的鄭和船隊由朝廷出資，為了朝貢與國威，花費太大、收益比不上成本，北方又有蒙古的壓力，1433 年之後就停止遠航；後來只開福建月港，商人要領許可證、繳稅。葡萄牙由王室出資，要的是香料貿易，用沿岸堡壘、商館、艦隊與通行證控制航線，被攻擊的沿岸城市與商人付出代價。西班牙靠征服、原住民盟軍與天花控制美洲，用委託監護制與強迫勞動開採白銀，原住民人口大崩潰；馬尼拉靠華人撐起來，華人卻被隔離、還遭屠殺。荷蘭東印度公司是股東出資、有軍隊的公司，在大員招漢人開墾、收人頭稅、賣鹿皮，西拉雅人與漢人農民付出代價；鄭成功在大陸沿海打不過清軍，渡海取代荷蘭，靠屯田立足。每一方要的東西不同，控制的辦法也不同，而代價常常落在沒有被問過的人身上。
legacy:
  title: 今日影子
  items:
    - then: 1492 年之後，美洲的作物隨著船隻傳到舊世界：16 世紀西班牙人把番薯、玉米帶到亞洲，葡萄牙人把辣椒帶到印度。
      now: 今天辣椒是印度菜不可缺少的調味，番薯和玉米也是亞洲常見的食物；英文維基把玉米、番薯傳入亞洲與當地人口成長連在一起。
      tag: 飲食
      card: event-columbian-exchange
      src: [L1]
    - then: 1494 年托德西利亞斯條約在大西洋上畫一條南北線，線以東歸葡萄牙、以西歸西班牙；1500 年葡萄牙宣稱占有今天巴西的土地。
      now: 今天巴西是人口最多的葡萄牙語國家，多數人以葡萄牙語為母語；拉丁美洲的其他國家，多數說西班牙語。
      tag: 語言與地名
      card: event-treaty-tordesillas
      src: [L2, L3, L8]
    - then: 1543 年，西班牙探險家比利亞洛沃斯把這片群島命名為「腓力王的群島」（las Islas Filipinas），紀念西班牙王儲腓力（後來的腓力二世）。
      now: 今天國名「菲律賓」（Philippines）就是從這個名字來的。
      tag: 語言與地名
      card: event-manila-1571
      src: [L4]
    - then: 16 世紀中葉，葡萄牙商人與傳教士到日本，帶去了新的食物、遊戲與詞彙。
      now: 日語今天仍有從葡萄牙語來的外來語，例如パン（麵包，來自 pão）、カルタ（紙牌，來自 cartas de jogar）；天ぷら（tempura）一般也被說成來自葡萄牙語，但英文維基只寫「來自 tempero」，詞源在學界有爭議，這裡不下定論。
      tag: 語言與地名
      card: commodity-nanban-trade
      src: [L5]
    - then: 1557 年起葡萄牙人在澳門居留，後來澳門一直由葡萄牙管理，直到 1999 年 12 月 20 日移交給中國。
      now: 澳門回歸後，葡萄牙語仍是特別行政區的官方語言之一；「澳門歷史城區」有二十多處教堂、廣場和建築，2005 年列入世界遺產，展現中西建築的交會。
      tag: 國界與人口
      card: event-macau-1557
      src: [L6, L7, L3]
    - then: 荷蘭東印度公司在 1624 年開始修建熱蘭遮城（Fort Zeelandia），作為在大員的據點，直到 1634 年完成。
      now: 這座城在今天臺南安平，中文叫「安平古堡」；遺址仍留有南牆、外牆和瞭望塔的殘跡，是臺灣人認識荷蘭時期的景點。
      tag: 紀念與爭議
      card: event-dutch-formosa
      src: [L9]
    - then: 1521 年，麥哲倫在菲律賓的麥克坦島戰役中戰死，船隊由埃爾卡諾帶回西班牙，完成環球航行；西班牙要到 1565 年才在群島建立據點。
      now: 在菲律賓，拉普拉普（Lapulapu）被看成「第一位菲律賓英雄」與反抗西班牙殖民的象徵，有紀念像，4 月 27 日是拉普拉普日；但他的事蹟只有皮加費塔一人的記述，其餘史料很少。
      tag: 紀念與爭議
      card: event-magellan-circumnavigation
      src: [L10]
    - then: 1492 年哥倫布橫渡大西洋，對歐洲人來說是「發現」，對美洲原住民來說卻是被入侵的開始。
      now: 美國的哥倫布日每年 10 月第二個星期一；華盛頓特區、佛蒙特、新墨西哥、緬因、明尼蘇達等地不承認哥倫布日，改過「原住民日」，柏克萊市 1992 年起就開始這樣做。
      tag: 紀念與爭議
      card: person-columbus
      src: [L11]

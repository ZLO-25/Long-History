  - type: recap
    model_answer: 草原原本以部落為基本單位，人們不容易效忠部落以外的對象，所以常常分裂。成吉思汗把人編成十人、百人、千人、萬人的層層單位，把新加入的部落成員打散，依功績升遷，再加上驛站、情報，以及向敵人與當地顧問學攻城的做法，讓蒙古軍隊從中國北方打到波斯。（大英百科與世界史百科全書的重點不同，並不互相排斥；學界對外擴張的原因也沒有共識。）忽必烈在 1260 年被推為大汗，1271 年改稱元，1279 年統一全中國；窩闊台設立的驛站，讓傳教士、使者、商人能比以前容易長途旅行。但「蒙古和平」是征服之後的和平：被攻陷的城市、被摧毀的次要商路城市都付出代價，統治集團內部也有內戰與政變；旅行者魯不魯乞還得鞭打累壞的馬。我們讀到的史料，多出自被征服者、替蒙古人做事的人或外來旅行者，所以屠城的數字差很多、馬可波羅有沒有到過中國也有爭論，「四等人制」是不是真的法律也有學者質疑。這是一種參考說法，不是標準答案。
    points:
      - 千戶制、打散部落成員、依功績升遷、驛站與情報，把分裂的草原部落變成能長途作戰的軍隊
      - 征服之後，驛站讓往來比較容易，但「蒙古和平」是暴力征服之後的結果，對不同的人意義不同
      - 史料多出自被征服者、替蒙古人做事的人或外來旅行者，數字與說法要問誰寫、為誰寫
      - 「四等人制」與馬可波羅是否到過中國，都有學者質疑或爭論，要並列看

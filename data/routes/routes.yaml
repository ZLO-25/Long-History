    waypoints: [{ lat: 5.4, lng: 36.0, name: 東非（示意） }, { lat: 12.6, lng: 43.4, name: 曼德海峽（南方路線假說，示意） }, { lat: 20.0, lng: 77.0, name: 南亞（示意） }, { lat: -2.0, lng: 110.0, name: 巽他陸棚（今東南亞群島，示意） }, { lat: -12.5, lng: 132.883, name: 馬傑德貝貝（約 6.5 萬或 5 萬年前，有爭議） }, { lat: -33.75, lng: 143.083, name: 蒙哥湖（約 4 萬年前） }]

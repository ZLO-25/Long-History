        q: 用一兩句話說明：為什麼說江戶日本「鎖國」這個說法不太準確？
        model: 因為日本沒有完全關門：長崎對中國與荷蘭、對馬對朝鮮、薩摩對琉球、松前對愛努人，四口一直開著；而且「鎖國」這個詞是 1801 年志筑忠雄翻譯坎普費爾的書時才造出來的，不是當時的官方用語，所以近幾十年越來越多研究改用「海禁」。

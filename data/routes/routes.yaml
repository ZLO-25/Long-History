  - id: sea-voc-tayouan
    name: 荷蘭東印度公司航線：荷蘭—巴達維亞—大員—日本
    kind: sea
    start: 1624
    end: 1662
    precision: attested-ports
    note: 從荷蘭出發的船在好望角補給後，照「布勞威爾航線」往南進入「咆哮西風帶」（南緯 40 度一帶），一路往東橫越印度洋，看到阿姆斯特丹島或聖保羅島就轉向東北往爪哇；這條航線 1611 年由布勞威爾試出，1616 年起成為公司船長的規定航線 [s1]。之後從巴達維亞北上，到大員（荷蘭在臺灣的據點，1624–1662）[s2]，再到日本（1641 年以前在平戶，之後在長崎出島）[s3]。荷蘭到好望角一段與南中國海一段的轉向點只是示意。

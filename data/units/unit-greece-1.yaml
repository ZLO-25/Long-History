id: unit-greece-1
title: 人民自己管自己？雅典民主怎麼長出來
histories: [希臘羅馬史, 世界通史]
mystery: 「人民自己管自己」聽起來很公平，雅典人卻是從欠債變奴隸、貴族搶權、外敵壓境一步一步走到這裡的。這個制度是怎麼長出來的？而它說的「人民」，到底包括誰、不包括誰？
teaser: 一筆銀礦的錢，平分給每個人，還是拿去造船？
goals:
  - 能說出城邦、梭倫改革、克里斯提尼改革各解決了什麼問題
  - 能判讀一段希羅多德的敘述，說出克里斯提尼為什麼去拉攏平民
  - 能說出銀礦的錢「平分或造船」這個選擇，當時看得到哪些選項、各有什麼代價
  - 能描述雅典民主怎麼運作，並指出誰被排除在「人民」之外
minutes: 40
level: 皆可
curriculum: []
companion: unit-greece-2
steps:
  - type: hook
    text: |
      想像你們班沒有老師、沒有班長，班上的事全靠每個人舉手決定：誰當值日、怎麼分班費、要不要處罰某個同學。
      聽起來很公平吧？兩千五百年前的雅典，真的這樣管自己。
      不過先問一個問題：這個「每個人」，是誰？我們先看這個制度是怎麼長出來的，再回頭問這個問題。
    guess:
      q: 「人民自己管自己」的制度，在雅典是怎麼出現的？
      options:
        - "有一位聰明的領袖想出理想的制度，一次就寫成法律"
        - "窮人欠債被賣成奴隸、貴族又在搶權，社會快撐不住，才一步一步改出來"
        - "打贏波斯之後，雅典為了獎勵人民，才給他們投票的權利"
        - "城邦很小，大家住得近、好商量，自然就變成人人開會"
      reveal: "歷史上比較接近第二個。前 6 世紀初，窮農民還不起債就可能被賣成奴隸，梭倫用法律把危機壓下來；僭主被趕走後貴族搶權，克里斯提尼為了贏過對手去拉攏平民，約前 508 年把人重新分組。當時這套制度還不叫「民主」，叫 isonomia。"
  - type: card
    id: event-greek-polis-colonization
    depth: understand
    prompt: 先看舞台：古希臘為什麼不是一個國家？注意「城邦」是什麼、誰算公民，還有「公民同時是戰士」這件事。
    focus: [C1, C4]
    quick:
      - q: "為什麼說古希臘不是一個國家？"
        a: "被歸為城邦的聚落約有 1,500 個，每個都有自己的法律、軍隊和公民，各自獨立。海外的殖民地建好後也很快獨立，不是母城的一部分。"
      - q: "「公民同時是戰士」是什麼意思？"
        a: "重裝步兵要自備青銅盔甲、盾牌和長矛，盔甲很貴，能不能負擔是身分的一部分。公民排成密集的方陣打仗，所以公民同時也是戰士。"
  - type: card
    id: event-solon-reform
    depth: understand
    prompt: 前 6 世紀初的雅典出了什麼危機？注意欠債的人會有什麼下場，以及梭倫做了什麼、沒做什麼。
    focus: [C1, C2]
    quick:
      - q: "為什麼窮農民會變成奴隸？"
        a: "他們借錢時常拿土地或自己的身體當擔保，還不起就可能連同妻子和孩子被奴役、被賣掉。梭倫用解負令取消債務契約，也禁止再用人身當擔保。"
      - q: "很多人以為梭倫創立了民主，其實呢？"
        a: "他依財產把公民分成四等，只有富人能當高官。最窮的一等雖然能進公民大會和陪審法庭，卻不能做任何官職，所以只是往民主走了一步，還不是民主。"
  - type: card
    id: event-cleisthenes-reform
    depth: understand
    prompt: 梭倫之後貴族又在搶權。注意克里斯提尼怎麼「重新分班」，以及他一開始是為了什麼才去拉攏平民。
    focus: [C2, C4]
    quick:
      - q: "克里斯提尼為什麼要把人重新分成十個部落？"
        a: "舊的四個部落依血緣分，貴族靠家族和地盤把持政治。新部落由城區、沿海、內陸各一部分合成，把不同地方的人混在一起，貴族的地方勢力就派不上用場。"
      - q: "他一開始就是為了建立民主，才去拉攏平民嗎？"
        a: "不是。希羅多德說他在爭權中居於下風，才去拉攏平民。當時的新制度叫 isonomia（大家在法律和政治上平等），「民主」這個詞是後來才通行的。"
  - type: source
    card: event-cleisthenes-reform
    idx: 0
    question: 這段希羅多德的敘述，最能說明克里斯提尼為什麼去拉攏平民？
    options:
      - 他從一開始就想建立人人平等的民主，所以主動去找平民幫忙
      - 斯巴達國王要求他這樣做，他只是照辦
      - 他爭權居於下風，有了平民的支持才壓過對手
      - 平民先發動起義，他是被逼著改革的
    answer: 2
    explain: 希羅多德寫的是權力鬥爭：克里斯提尼爭不過對手，才把原本被排除在外的平民拉到自己這邊，改了部落，有平民撐腰就遠遠壓過對手。這不代表他沒有理想，但這段文字裡看不到「一開始就想建立民主」，當時的新制度也還不叫民主，而叫 isonomia（大家在法律和政治上平等）。讀史料時要問：作者交代的是動機，還是結果？
    hints:
      - 先看「平民原本被排除在一切之外」之後發生了什麼事：是誰先動的？
      - 「有了平民支持，他就遠遠壓過對手」，說明他需要平民幫他做什麼？
      - 這段文字有沒有提到「平等」或「民主」這種字眼？
    ref: event-cleisthenes-reform#C2
    why_wrong:
      - "這段文字沒有提到理想或「民主」；當時的新制度叫 isonomia，民主一詞是後來才通行的。"
      - "斯巴達國王克里昂米尼是站在他的對手伊薩哥拉斯那邊，兩度出兵都失敗；文中是他自己去拉攏平民。"
      - null
      - "文中是克里斯提尼先去把平民拉到自己這一邊，不是平民先起義逼他。"
    critique:
      question: "這段話是希羅多德寫的，克里斯提尼自己沒有留下文字。關於他的想法，這份史料最合理的用法是哪一個？"
      options:
        - "能證明他一輩子只為了權力，心裡完全沒有任何理想可言"
        - "能證明當時的雅典人已經把這套新制度叫作「民主」"
        - "因為不是他自己寫的，所以這段話沒有任何參考價值"
        - "能看出希羅多德怎麼解釋他的動機，但他的內心仍是推測"
      answer: 3
      explain: "克里斯提尼沒有文字留下來，我們只能靠後人的記載推測。希羅多德說他爭不過對手才拉攏平民；World History Encyclopedia 認為他可能是想削弱血緣團體，也替自己的家族爭取空間。所以這段話能說明一種解釋，卻不能證明他的內心。當時用的字也是 isonomia，不是民主。"
      why_wrong:
        - "這段話只說了他怎麼贏，沒有證明他有沒有理想；他是否只為權力，仍是推測。"
        - "卡片指出當時用的字是 isonomia，「民主」是後來才通行的。"
        - "希羅多德的記載仍是重要的史料，只是要記得它是別人轉述的解釋。"
        - null
  - type: compare
    cards: [event-solon-reform, event-cleisthenes-reform]
    prompt: 比一比雅典走向民主的前兩步：梭倫和克里斯提尼。
    rows:
      - aspect: 時間
        a: 傳統上定在前 594 年
        b: 約前 508 年（前 510 年趕走僭主之後）
      - aspect: 起因
        a: 窮農民還不起債，連家人都可能被當奴隸，人民起來反抗上層階級
        b: 僭主被趕走後貴族搶權，克里斯提尼居於下風，去拉攏平民
      - aspect: 做了什麼
        a: 取消債務契約、禁止用人身當借錢的擔保，並依財產把公民分成四等
        b: 把依血緣的四個舊部落換成依居住地混合的十個新部落，議事會由 400 人擴為 500 人
      - aspect: 窮人與一般公民得到什麼
        a: 最窮的一等不能做官，但可以進公民大會和陪審法庭
        b: 一般男性公民參與政治的權利擴大，貴族的地方勢力被削弱
      - aspect: 誰還是被排除
        a: 女性在四個等級裡都沒有政治角色；奴隸仍是奴隸
        b: 女性、奴隸與外邦人不是公民
    question: 梭倫和克里斯提尼各自解決了什麼問題？為什麼兩個人的改革都還不能說是「完整的民主」？
    model_answer: 梭倫解決的是社會快撐不住的債務危機：窮人還不起債就可能被賣成奴隸，他取消債務、禁止用人身擔保，還讓最窮的人也能進公民大會和陪審法庭，但最窮的一等仍不能做官，他本人也不是民主派。克里斯提尼解決的是貴族家族靠血緣和地盤把持政治的問題：他把人重新分組、混合不同地區，削弱貴族的地方勢力，也讓公民大會的權力變大。兩個人的改革都只讓部分人受益：女性、奴隸、外邦人還是被擋在門外，而且當時用的字是 isonomia，「民主」這個詞是後來才通行的。這題沒有標準答案，重點是看出兩次改革解決的問題不同，但都是危機或爭權逼出來的。
    hints:
      - 先看表格的「起因」那一列：兩個人面對的問題一樣嗎？
      - 再看「誰還是被排除」：兩次改革之後，哪些人仍然沒有政治權利？
      - 想想看：這兩次改革是因為有人想實現理想，還是因為舊辦法行不通了？
    points:
      - 梭倫解決債務危機：取消債務、禁止用人身擔保，讓最窮的人也能進公民大會和陪審法庭
      - 克里斯提尼解決貴族靠血緣和地盤把持政治：把人重新分組，削弱貴族的地方勢力
      - 兩次改革都擋掉一部分人：女性、奴隸、外邦人不算公民，當時也還不叫「民主」
      - 兩次都是危機或爭權逼出來的，不是有人先想好理想
  - type: decision
    role: 你是約前 483 年雅典公民大會裡的一位公民
    situation: |
      雅典東南邊的勞里昂銀礦，是城邦自己的礦場，租給私人承包商開採。最近挖到一條特別豐富的新礦脈，收入很可觀。照習慣，礦場的收入是分給市民的。
      七年前，雅典才在馬拉松擊退波斯的登陸部隊，東邊那個大帝國還在。這時地米斯托克利在公民大會上站起來，主張停止分錢，改拿這筆錢造三列槳戰船（雅典的主力戰艦），理由是要對付鄰近的埃伊納島。
      先別急著看選項：如果你是在場的一位公民，只知道這些，你會怎麼舉手？
    options:
      - label: 照舊，平分給每個公民
        result: 推測：每個人立刻拿到錢，這個提議很容易通過，因為好處就在眼前。但艦隊要靠這筆錢才造得起來，雅典到幾年後可能就沒有那麼多戰船。歷史沒有走這條路，所以後果只能推測。
      - label: 先存起來，以後再決定
        result: 推測：錢還在，不必立刻得罪想分錢的人；但船不是說要就有，將來真的需要時趕不趕得上，沒人知道。歷史沒有走這條路，所以後果只能推測。
      - label: 停止分錢，拿去造三列槳戰船
        result: 這是雅典當年的選擇。普魯塔克說，地米斯托克利是「唯一」敢在公民大會上提議停止分錢的人。到前 480 年波斯大軍南下時，雅典有大約兩百艘戰船（不同來源的數字不一，也有說是一百艘）。代價是眼前少拿一筆錢，好處要等幾年後的戰爭才看得出來。
    actual: 雅典選擇了造船。前 480 年，薛西斯的大軍渡海而來，地米斯托克利用假消息把波斯艦隊引進狹窄的薩拉米斯海峽，希臘贏了。但這個功臣的下場並不好：戰後大約十年，他被陶片放逐，之後在缺席時被雅典判叛國，最後逃到波斯，死在波斯王讓他治理的馬格尼西亞。另一個值得想的地方是：這筆錢是靠礦坑裡的奴隸挖出來的，而他們沒有投票權。
    ref: person-themistocles#P3
    note: 沒有發生的選項，後果都是推測，標示清楚。決策題先請學生寫下自己的想法再看選項；這題沒有標準答案，歷史上也不是所有人都贊成。
  - type: card
    id: commodity-laurion-silver
    depth: understand
    prompt: 這筆銀子是誰挖出來的？注意礦山屬於誰、礦坑裡是什麼人在工作。
    focus: [B2, B3]
    quick:
      - q: "礦山屬於誰？實際在坑裡工作的是誰？"
        a: "礦山屬於雅典國家，租給私人承包商經營。坑裡的工作幾乎全由奴隸承擔，承租的人向奴隸主租奴隸，奴隸死了或逃了還要補人。"
      - q: "說雅典民主是「全民參政」，漏掉了什麼？"
        a: "漏掉支撐它的財富有一部分來自沒有任何權利的奴隸勞動。造船用的銀子，就是礦坑裡的奴隸挖出來的。"
  - type: card
    id: war-greco-persian
    depth: understand
    prompt: 看這支艦隊後來在哪裡派上用場。注意薩拉米斯海峽的地形，還有雅典為什麼會和波斯開戰。
    focus: [A2, A3]
    quick:
      - q: "雅典為什麼會和波斯開戰？"
        a: "波斯統治小亞細亞的希臘城邦，這些城邦起義時，雅典派兵去支援，起義軍還燒了薩第斯。波斯平定起義後，就轉頭去討伐支援的人。"
      - q: "為什麼狹窄的薩拉米斯海峽，對船比較多的波斯不利？"
        a: "波斯艦隊數量較多，擠進狹窄的海峽就展開不了。地米斯托克利還放假消息，引誘他們開進去。"
  - type: card
    id: person-themistocles
    depth: understand
    prompt: 讀「從另一邊看他」：同樣一個陶片放逐，在雅典人眼裡和在他眼裡，意思為什麼不一樣？
    focus: [P5]
    quick:
      - q: "同樣是陶片放逐，雅典人和地米斯托克利的看法為什麼不同？"
        a: "在雅典人眼裡，它是防止有人權力太大的辦法，普魯塔克說是用來平息人們對傑出者的嫉妒。對他來說，這卻是把打贏波斯的功臣趕走。"
      - q: "戰後斯巴達為什麼對他心裡不滿？"
        a: "他瞞著斯巴達，把被波斯毀掉的雅典城牆重建起來。修昔底德說斯巴達人嘴上沒發作，心裡不滿；後來正是斯巴達人指控他與波斯有往來。"
  - type: chain
    prompt: 把下列事件排成一條鏈（最上面最早）。排完之後想一想：哪些前後之間是「前一件促成後一件」，哪些只是先後？
    items:
      - 克里斯提尼改革後，公民大會作主的雅典決定派船支援愛奧尼亞的起義
      - 波斯為了報復，在馬拉松登陸，被雅典與普拉提亞軍擊退
      - 勞里昂發現新礦脈，地米斯托克利說服公民不分錢、改造戰船
      - 波斯大軍南下，希臘艦隊在薩拉米斯打敗波斯艦隊
      - 雅典靠海軍成為提洛同盟的盟主
    explain: 雅典派船幫愛奧尼亞起義，招來波斯報復，才有前 490 年的馬拉松；之後有了新礦脈和造船的決定，這支艦隊成了薩拉米斯海戰的主力；戰後雅典靠海軍當上提洛同盟的盟主。注意這條鏈說的是「一步銜接一步」，不代表每一步都是必然。
    hints:
      - 先找出最早的一步：和克里斯提尼改革、公民大會有關的那一個。
      - 馬拉松在前 490 年，薩拉米斯在前 480 年，造船的決定夾在兩者之間。
      - 同盟是「打贏之後」才成立的。
    ref: war-greco-persian#A7
    followup:
      question: "這五件事裡，哪兩件之間只是先後，卡片並沒有說前一件促成後一件？"
      options:
        - "派船支援起義，到波斯報復、在馬拉松登陸"
        - "馬拉松打贏波斯，到勞里昂發現新礦脈"
        - "新礦脈與造船的決定，到薩拉米斯海戰"
        - "薩拉米斯打贏波斯，到雅典成為同盟盟主"
      answer: 1
      explain: "卡片說新礦脈是雅典意外挖到的「意外財源」，沒有證據顯示它是馬拉松打贏換來的；造船的理由，卡片寫的是對付鄰近的埃伊納島，也有說法是為了預防波斯入侵。所以依卡片，這兩件事只能說是一前一後。其他三組，卡片都寫了前一件促成後一件。"
      why_wrong:
        - "雅典派兵支援起義，波斯才轉而討伐支援的人，這是因果。"
        - null

<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>歷史長河：國高中生的歷史學習</title>
    <meta name="description" content="給國高中生的互動歷史學習網站：從一個謎題出發，讀卡片、看史料、排因果、比一比，配時間軸與地圖。涵蓋臺灣史、東亞史、世界史與錢的歷史。" />
    <!-- 效能：卡片資料和程式同時開始下載，不必等程式跑起來才抓 -->
    <link rel="preload" href="%BASE_URL%index.json" as="fetch" crossorigin="anonymous" />
    <!-- 網址直接指到單元／專題等要讀內文的頁面時，卡片長內文也一開始就抓（src/App.tsx 會接手這個 Promise）。
         只指到一張卡（?card=）時，先抓那張卡自己的小檔（幾 KB），內文馬上能看；完整內文照常在背景下載 -->
    <script>(function () {
      var s = location.search, j = function (u) { return fetch(u).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }); };
      var c = /[?&]card=([\w-]+)/.exec(s);
      if (c && !/[?&](unit|dive|story|sim|topic|chain|today)=/.test(s)) window.__hrCard = j('%BASE_URL%data/cards/' + c[1] + '.json');
      else if (/[?&]story=/.test(s) && /[?&]read=1/.test(s)) { /* 故事閱讀頁自己帶出處，不必搶先抓全部內文 */ }
      else if (/[?&](card|unit|dive|story|sim|topic|chain|today)=/.test(s)) window.__hrDetail = j('%BASE_URL%index-detail.json');
    })();</script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M2 20 Q9 12 16 18 T30 14' stroke='%232b6cb0' stroke-width='4' fill='none'/></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

id: unit-sengoku-2-gun
title: 一把外國槍怎麼改變日本？從種子島到本能寺（1543–1582）
histories: [日本史]
mystery: 1543 年前後，兩挺火繩槍在九州南方的小島上岸。不到四十年，尾張一個地方領主的兒子打下近畿、趕走將軍、蓋起第一座有巨大天主的城。他靠的是槍、錢，還是人？
teaser: 一艘漂到小島的船、一張免稅招商的告示、一千挺還是三千挺的爭論，還有一個早上就結束的政權。
goals:
  - 能說出火繩槍傳入日本的經過，以及《鐵炮記》這份記載哪裡要小心
  - 能判讀《鐵炮記》的一段原文，說出它要讀者相信什麼
  - 能用一條因果鏈說明從鐵砲傳入、桶狹間、樂市到長篠、本能寺的過程
  - 能比較同一片海上，日本得到鐵砲、明朝卻得到倭寇的差別
  - 能指出「三千挺三段擊」「樂市樂座是自由經濟」這些說法哪些部分出自後世
minutes: 40
steps:
  - type: hook
    text: |
      想像一款遊戲出了一件新裝備：威力大，但貴、慢、下雨就失靈，而且誰都買得到。
      半年後，排行榜第一名的人不是第一個買到它的人，而是最快找到工匠量產、買得起彈藥、又把隊友組織起來的人。
      1543 年前後傳進日本的火繩槍，就是這件裝備。這個單元要問：靠它爬到第一的織田信長，贏的到底是槍、錢，還是人？
  - type: card
    id: tech-tanegashima-arquebus
    depth: deep
    prompt: 先看槍怎麼來的。注意兩件事：日本工匠仿製時最難的是哪個零件？消息傳開後，是誰來學、誰來量產？讀到「史家怎麼吵」：《鐵炮記》是哪一年寫的？學者為什麼說倭寇可能也傳了槍？
  - type: source
    card: tech-tanegashima-arquebus
    idx: 0
    question: 依照這段《鐵炮記》的文字，島主種子島時堯面對那兩挺槍時做了什麼？
    options:
      - 嫌價錢太貴，沒有買
      - 不計價錢買下兩挺，當成傳家寶
      - 一口氣買了一百挺，裝備自己的軍隊
      - 請葡萄牙人只賣火藥配方，不買槍
    answer: 1
    explain: 原文說他「不說價錢貴得離譜」，買下「蠻種的二鐵炮」當「家珍」，也就是不計價錢買下兩挺當傳家寶。但讀這段文字要先知道它的情境：《鐵炮記》是 1606 年才寫成的，距離事件六十多年；文中沒有寫金額，常聽到的「二千兩」在卡片的來源裡找不到出處；而且時堯當時只有 16 歲、還不是領主，所以有學者認為「買下高價鐵砲」的記述有疑點，這本書可能是為了宣傳種子島流砲術而寫，把功勞全算在時堯一人頭上。一份史料想讓你相信什麼，常常和它是誰、什麼時候、為了什麼寫的有關。
    hints:
      - 先找「二鐵炮」前後的字：「求め」是買、「家珍」是什麼意思？
      - 「其の價の高くして及ひ難きを言はすして」：價錢高得難以負擔，但他「不說」，接著做了什麼？
      - 答案是兩挺、當傳家寶；再想想為什麼卡片提醒這段文字寫在六十多年後。
    ref: tech-tanegashima-arquebus#T2
  - type: card
    id: war-okehazama
    depth: deep
    prompt: 槍傳入十七年後，信長打了成名的一仗。切到「深入」讀「兵力與軍事技術」：這一仗靠的是鐵砲嗎？Conlan 認為當時決定勝負的是什麼？也看「常見誤解」：「迂迴奇襲」「今川要上洛」這些說法從哪裡來？
  - type: card
    id: person-oda-nobunaga
    depth: understand
    prompt: 讀「關鍵決定」：1568 年他為什麼選擇擁立將軍，而不是自己當主人？讀「他改變了什麼」時，把「戰爭方式」「經濟」「宗教與權威」分開記，最後回顧時會用到。也看「常見誤解」：長篠「三段擊」的說法是誰整理出來的？
  - type: card
    id: finance-rakuichi-azuchi
    depth: deep
    prompt: 課本說樂市樂座是「自由經濟的先驅」。讀「怎麼運作」：安土掟書第 2 條和第 13 條規定了什麼？這是「開放」還是「集中」？再讀「史家怎麼吵」和「後見之明」：為什麼研究者說它是「招商＋統制」？
  - type: decision
    role: 你是 1575 年 5 月（舊曆）的織田信長
    situation: |
      盟友德川家康向你求援：武田勝賴率軍包圍了三河的長篠城，守軍只有約 500 人；家康自己能動員的大約 8 千人，撐不住。
      你手上的鐵砲一次只能打一發，裝填很慢、怕雨、射程不過百餘公尺。武田家也有鐵砲，估計約 1,000 到 1,500 挺，而且很會用馬。
      你的優勢是：你控制了堺這個集散地和國友這個生產地，鐵砲、火藥和鉛可以透過堺與南蠻貿易的網絡大量取得；你和家康合起來的兵力，各種估計都比武田多。
      鐵砲貴又慢。你要帶多少挺去？到了戰場怎麼用？先別急著看選項：如果你是他，只知道這些，你會怎麼做？
    options:
      - { label: 集中上千挺鐵砲，在長篠城西邊的設樂原沿小河築馬防柵與土壘，把鐵砲隊配在柵後等武田來攻；另派一支部隊夜襲武田後方的砦, result: 這是信長當年的選擇。《信長公記》記他挑出「鐵砲約一千挺」交給五名部將，另派酒井忠次帶約 4 千人與 500 挺鐵砲夜襲鳶巢山砦，切斷武田退路；武田只能正面進攻，激戰到下午，山縣昌景、馬場信春等重臣戰死，但大部分武田死者是在撤退時陣亡。 }
      - { label: 不築工事、不等待，直接以全軍正面衝向武田陣地解圍, result: 推測：向敵陣衝鋒是當時的正攻法，武田也擅長用馬、同樣有鐵砲，在沒有柵欄與地形掩護下正面對撞，聯軍的鐵砲優勢未必發揮得出來。歷史沒有走這條路，所以後果只能推測。 }
      - { label: 把鐵砲平均分給各部隊、不特別集中，照一般打法作戰, result: 推測：鐵砲平時分散在各家臣團裡（卡片引 1581 年明智光秀家中軍法「每千石配鐵砲 5 挺」來說明這種配備方式，這是幾年後的史料）；不集中使用，就沒有「一次上千挺在柵後射擊」的效果。歷史沒有走這條路，所以後果只能推測。 }
      - { label: 不出援，讓家康自己想辦法, result: 推測：織田與德川自 1562 年清洲同盟起並肩作戰，家康兵力約 8 千，長篠城若陷落，武田會繼續往三河、遠江擴張。歷史沒有走這條路，所以後果只能推測。 }
    actual: 信長選擇集中鐵砲、築馬防柵、夜襲後方。但這一仗為什麼贏，史家看法不一：2010 年代以來的研究認為兩軍沒有明顯的質的差距，武田也有鐵砲；Conlan 主張火器在日本擴散緩慢，真正決定勝負的是動員、訓練與補給的「組織技術」；鉛彈成分分析則顯示聯軍透過堺與南蠻貿易取得大量鉛，武田要熔銅錢造彈，補給差距可能比戰術更關鍵。他當時看得到的是自己的商業網絡、較多的兵力和設樂原的窪地能藏住軍隊；他看不到的是，後人會把這一仗寫成「三千挺鐵砲三段擊打垮騎馬軍團」，而《信長公記》只寫了「千挺計」，也看不到武田要到七年後的 1582 年才滅亡，而自己會在同一年死在本能寺。
    ref: war-nagashino#A4
    note: 「沒有發生的選項」的後果都是推測，標示清楚。兵力與鐵砲數字全部是估計：通說聯軍 3 萬 8 千對武田 1 萬 5 千，高柳光壽估聯軍約 1 萬 6 到 1 萬 8 千對武田 8 千到 1 萬；「三千挺」出自江戶時代的《甫庵信長記》與後人補筆，「三段擊」最早見於江戶時代的通俗讀物、明治陸軍戰史再寫成定論。
  - type: chain
    prompt: 把下列事件依照「因 → 果」排成一條鏈（最上面是最早的原因）。
    items:
      - 1543 年前後葡萄牙人把火繩槍帶到種子島，島主買下兩挺、命刀匠仿製
      - 紀州根來寺、堺商人來學，國友、堺、根來成為量產中心；1550 年京都附近的戰鬥已有人被槍打死
      - 1560 年桶狹間之戰，信長以兩三千人擊殺今川義元；這時決定勝負的仍是長槍與動員組織
      - 1567 年信長攻下美濃、在加納發出樂市制札；1568 年擁立足利義昭進入京都
      - 1573 年信長驅逐義昭，室町幕府實質結束，他成為近畿霸主、有餘力東援
      - 1575 年長篠之戰，信長集中千挺以上鐵砲與馬防柵擊敗武田勝賴
      - 1577 年安土山下町中掟書發布、1579 年安土城天主完成，宣示他是全國的主人
      - 1582 年 6 月 21 日本能寺之變，信長身邊只有少數隨從，遭部將明智光秀襲擊自盡
    explain: 槍先到、工匠與商人幾年內吃透技術，這是「槍」；但桶狹間時鐵砲傳入不到二十年，信長靠的是地形、集結速度與組織，這是「人」；攻下美濃後他用樂市把商人和稅基吸到自己的城下，又掌握堺與國友，這是「錢」。三者加起來，才有長篠一次集中上千挺鐵砲、連鉛和火藥都比對手充足的局面。最後一步提醒我們：這個政權高度依附在信長一個人身上，他一死就在一夜之間瓦解，接手的不是織田家的兒子，而是趕回來「復仇」的部將秀吉。
    hints:
      - 最早的原因是槍「傳進來」，接著才是「量產」。
      - 桶狹間（1560）比入京（1568）早；趕走將軍（1573）比長篠（1575）早。
      - 安土城是長篠之後蓋的；本能寺是最後一步。
    ref: person-oda-nobunaga#P2
  - type: compare
    cards: [tech-tanegashima-arquebus, event-wokou-ningbo]
    prompt: 比一比同一片海上的兩個結果：1540 年代，日本得到了鐵砲，明朝卻得到了倭寇。
    rows:
      - { aspect: 外國船來了怎麼辦, a: 島主買下兩挺槍、命刀匠仿製；各地大名長年交戰、都需要能快速訓練大量步兵的武器，所以搶著買、搶著仿製, b: 明朝自 1371 年起海禁，民間不准出海、只准朝貢；1523 年寧波之亂後關掉浙江、福建市舶司，中日合法貿易幾乎斷絕 }
      - { aspect: 海上跑的是誰, a: 葡萄牙人搭中國人的船漂到種子島；學者宇田川武久主張倭寇可能也把東南亞式的火繩槍分批帶到九州與西日本, b: 王直、徐海等中國商人領導的走私集團，以平戶、五島、雙嶼為據點；《明史》自己寫「真倭十之三，從倭者十之七」 }
      - { aspect: 擴散的結果, a: 堺商人學了一、兩年就學會，國友、堺、根來量產；三十年後信長一次能集中千挺以上, b: 1548 年朱紈攻毀雙嶼後走私集團轉而武裝化，1553 年「連艦數百」，1555 年一度有 2 萬人（估計） }
      - { aspect: 政府最後怎麼收場, a: 日本的幕府已管不動地方，連派遣勘合船的權力都落到大內、細川兩家手上；掌握堺與國友的信長比對手更快組織起鐵砲隊, b: 胡宗憲招撫離間、戚繼光連勝，加上 1567 年開放月港准民間出海（仍禁日本），倭患才真正平息 }
      - { aspect: 史家提醒, a: 《鐵炮記》寫在六十多年後、有不少美化；火藥與火器源自中國，火繩槍是歐洲改良，不是葡萄牙人「發明」的, b: 「倭寇＝日本海盜」不對，16 世紀主要倭寇集團都由中國商人領導；「三比七」只是明人的概略印象，不是統計 }
    question: 同一片海、同一批船，為什麼日本得到了槍，明朝得到了倭寇？差別是技術，還是別的東西？
    model_answer: 差別不在技術本身：火藥與火器源自中國，火繩槍是歐洲改良，同一種火繩槍在 1540 年代同時出現在日本、明朝沿海與朝鮮。差別在「誰被允許跟海上的人做生意」。日本的幕府管不動地方，各地大名長年交戰、需要新武器，島主、刀匠、商人可以直接買、學、量產；明朝禁海，想做生意的人只能走私，走私集團被取締後武裝起來，就成了「倭寇」，直到 1567 年開放月港才平息。不過別急著把日本寫成「開放的贏家」：鐵砲傳入日本的途徑本身就有爭論，宇田川武久認為走私的倭寇很可能也是傳播者，而卡片也說葡萄牙人正是從雙嶼這個走私交會點摸到日本的航線；也就是說，被明朝禁掉的那條路，正是把槍送進日本的路之一。這題沒有標準答案。
    hints:
      - 先看「外國船來了怎麼辦」：一邊是「買下來仿製」，一邊是「禁止」。
      - 再看「海上跑的是誰」：兩邊其實是同一批人（中國海商、葡萄牙人、倭寇），所以差別不在「船上有什麼」。
      - 想想看：「禁」會讓一門人人想做的生意消失，還是轉到地下？卡片的「為什麼值得學」怎麼說？
  - type: today
    card: tech-tanegashima-arquebus
    question: 有人說「鐵砲傳入日本幾年就擴散開來，就像今天的新科技一樣，想管也管不住」。這個類比哪裡不成立？
    model_answer: 先說不能類比的地方：16 世紀的鐵砲擴散靠的是手工鍛造與師徒傳承，一個村子幾百名工匠就是「產業」，而且當時的日本幕府已管不動地方；今天的武器技術依賴精密機械、材料科學與出口管制體系，擴散的速度、門檻與國際規範完全不同，所以不能拿種子島直接推論「今天也管不住」。可以借來想的是三件事：第一，技術擴散的關鍵不是「第一把槍」，而是接收方有沒有既有的刀匠、商人與訂單網絡，同一件東西傳到不同地方，結果會不一樣；第二，真正的瓶頸常常不在裝備本身，而在它的「耗材」，日本很快能造槍，鉛與火藥卻要靠港口與貿易網絡取得，所以掌握港口的人占優勢；第三，對照明朝的例子，一刀切的「禁」未必讓東西消失，而可能把它推到看不見的地方。
  - type: check
    items:
      - kind: choice
        q: 關於長篠之戰的鐵砲數量，《信長公記》怎麼寫？
        options: [三千挺，分三排輪流射擊, 決戰時「千挺計」（約一千挺），另有別働隊五百挺, 一萬挺, 完全沒有提到鐵砲]
        answer: 1
        explain: 太田牛一《信長公記》寫信長挑出「鐵砲約一千挺」交給五名部將，另派 500 挺跟酒井忠次去鳶巢山，合計約 1,500 挺；「三千挺」出自江戶時代的《甫庵信長記》與池田本旁邊補寫的「三」字，「三段擊」在《信長公記》裡找不到，最早見於江戶時代的通俗讀物。最有名的版本不一定是最早的版本。
        hints: [回想決策步驟的「實際發生」：當時人寫的數字是多少？, 看長篠之戰卡的史料那一段：「鉄炮千挺計」。]
        ref: war-nagashino#A4
      - kind: order
        q: 依時間先後排列：
        items: [火繩槍傳到種子島, 桶狹間之戰, 信長擁立足利義昭進入京都, 長篠之戰, 安土山下町中掟書發布, 本能寺之變]
        explain: 1543 年前後種子島 → 1560 年桶狹間 → 1568 年入京 → 1575 年長篠 → 1577 年安土掟書 → 1582 年本能寺。
        hints: [槍先傳入，十七年後才有桶狹間。, 入京在長篠之前；安土的掟書在安土城動工（1576）之後、本能寺之前。]
        ref: person-oda-nobunaga#P2
      - kind: short
        q: 用一兩句話說明：日本很快就能自己造槍了，為什麼戰國大名還要歡迎南蠻船停泊自己的港口？
        model: 因為槍可以自己造，火藥的原料硝石日本不產、鉛也要輸入，這些多靠葡萄牙船運來；南蠻船停泊還帶來關稅與武器，卡片說這是九州大名改宗的現實誘因之一，所以大名有理由歡迎它們。

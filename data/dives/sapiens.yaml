  chapters:
    - no: 1
      part: 1
      title: 地球上曾經不只一種人？
      en: An Animal of No Significance
      claim: |
        哈拉瑞認為，人類本來只是一種普通的動物：大約 200 萬年前到 1 萬年前，地球上同時住著尼安德塔人、直立人、佛羅勒斯人等好幾種「人」，智人只是其中之一 [b1][b23]。他主張人類腦袋大、很耗能，長期只在食物鏈中段，直到大約 10 萬年前才突然爬到頂端 [b1][b23]。其他人種為什麼消失？書裡介紹「取代說」和「混血說」，提到 DNA 研究發現現代歐亞人身上帶有少量尼安德塔人基因，並傾向認為智人只和少數其他人類混血、大多是把他們排擠掉，甚至可能屠殺了他們；但他也強調這些多半是根據稀少資料的推測 [b1]。
      cards:
        - event-homo-species
        - event-out-of-africa
      card_notes:
        event-homo-species: 列出各種人類的年代和地點，檢查「多種人並存」
        event-out-of-africa: 智人走出非洲的年代，可對照「何時登頂」
      debate:
        - who: 莎莉・麥克布里蒂與艾莉森・布魯克斯（Sally McBrearty & Alison S. Brooks）
          text: 智人的起源可能更早、也更漸進。她們整理非洲化石紀錄，認為化石大致連續；若把 H. helmei（一群介於較古老人類和智人之間的非洲化石）也算進智人，起源可推到約 25 萬到 30 萬年前 [b31]。
          src:
            - b31
          stance: 補充
        - who: 傑貝爾依羅化石研究（摩洛哥，2017 年發表）
          text: 智人出現的時間和地點可能更早、更廣。這批化石用熱釋光法（測量被火燒過的石器累積了多少輻射，來推算年代）測得約 31.5 萬年前，常被看成最早的智人之一；也有學者質疑它該不該算智人 [b38]。
          src:
            - b38
          stance: 補充
        - who: 尼安德塔人與丹尼索瓦人的古 DNA 研究（2010 年起）
          text: 現在學界多認為以取代為主、有少量混血，大致合乎書的傾向。非洲以外的人約有 2% 尼安德塔人 DNA；2010 年科學家又從西伯利亞洞穴一塊指骨的 DNA 認出丹尼索瓦人，美拉尼西亞人等族群也帶有他們的 DNA [b54][b55]。
          src:
            - b54
            - b55
          stance: 支持
      think: 排排看：把「智人出現（傑貝爾依羅化石）」「智人抵達澳洲」「尼安德塔人消失」照年代排好（看「人屬的多個物種：智人、尼安德塔人與其他人類」和「智人走出非洲、抵達澳洲」兩張卡）。第一件到最後一件隔了多久？這算「突然」嗎？
      minutes: 10
    - no: 2
      part: 1
      title: 會說故事，為什麼能稱霸？
      en: The Tree of Knowledge
      claim: |
        哈拉瑞認為，大約 7 萬年前智人的思考和溝通方式出現大躍進（他稱為「認知革命」），可能來自偶然的基因突變；之後才出現船、油燈、弓箭等新東西 [b2]。他主張語言讓人能講八卦、判斷誰可信，更關鍵的是能談「不存在的東西」，例如神、國家、公司 [b2][b22]。哈拉瑞認為，只要大家相信同一個故事，成千上萬互不認識的人也能合作；黑猩猩靠彼此熟識維持群體，群體大到一定程度就會分裂；人類光靠八卦和私交，能互相信任的人數也有限，但靠共同的想像突破了這個限制 [b2]。
      cards:
        - event-cognitive-revolution
        - event-out-of-africa
      card_notes:
        event-cognitive-revolution: 整理 7 萬年前前後的出土證據，檢驗「突變」說
        event-out-of-africa: 智人擴散各大陸的時間，和認知革命對得上嗎？
      debate:
        - who: 莎莉・麥克布里蒂與艾莉森・布魯克斯（Sally McBrearty & Alison S. Brooks）
          text: 現代行為是慢慢累積的，不是一次突變。〈沒有發生的革命〉一文認為，骨器、顏料加工、遠距交易、裝飾品等，在非洲中石器時代（約 30 萬到 5 萬年前的非洲石器時期）就零星出現，比 4 到 5 萬年前早了好幾萬年 [b31][b32]。
          src:
            - b31
            - b32
          stance: 反對
        - who: 南非布隆伯斯洞穴（Blombos Cave）的考古發現
          text: 7 萬年前以前就有象徵行為的證據。洞穴裡有約 10 萬年前的顏料作坊、約 7 萬 7 千年前刻有幾何紋的赭石、約 7 萬 5 千年前的貝殼珠；曾被拿來解釋認知革命的 FOXP2 基因說法也受到質疑 [b32]。
          src:
            - b32
          stance: 反對
        - who: 達珊娜・納拉亞南（Darshana Narayanan，神經科學家）
          text: 書裡有些生物學說法不準確。她和幾位生物學家查核後認為：書說所有猿猴都有口語語言，但照語言學定義，有規則的符號語言是人類獨有；書說黑猩猩會對抗獵豹，但兩者分布不重疊，可能和花豹搞混了 [b29]。
          src:
            - b29
          stance: 反對
      think: 預測看看：如果「認知革命」是 7 萬年前的一次突變，考古上應該看到什麼？如果是慢慢累積，又會看到什麼？先寫下你的預測，再對照「認知革命？現代人行為的出現」卡上的出土年代。
      core: true
      minutes: 20
    - no: 3
      part: 1
      title: 採集時代的人過得比較好？
      en: A Day in the Life of Adam and Eve
      claim: |
        哈拉瑞拿採集者和後來的農民比較，認為採集者吃得更多樣、傳染病較少、每週工作時間也較短：就連住在喀拉哈里沙漠這類嚴苛環境的現代採集者，平均每週也只工作約 35 到 45 小時，比不少現代人少 [b3][b37]。但他也承認採集生活有嬰兒死亡率高、意外多、跟不上的人可能被拋下等艱苦面 [b3]。他一再提醒：這段時期留下的證據很少，現代的採集部落又差異很大，我們對當時的信仰、階層和暴力程度所知有限 [b3]。
      cards:
        - event-out-of-africa
        - building-gobekli-tepe
      card_notes:
        event-out-of-africa: 延伸例子：採集者如何擴散到各大陸
        building-gobekli-tepe: 採集者也能蓋大型石造建築的實例
      debate:
        - who: 賈德・戴蒙（Jared Diamond，演化生物學家、地理學家）
          text: 採集者的身體比後來的農民健康。他 1987 年的文章認為，骨骸顯示採集者較高、較少營養不良；不過他寫的喀拉哈里採集者每週找食物只花約 12 到 19 小時，比書中的 35 到 45 小時少很多 [b30]。
          src:
            - b30
          stance: 支持
        - who: 理查・李（Richard Lee）的工時調查與大衛・卡普蘭（David Kaplan）的檢討
          text: 工時多少，要看「工作」怎麼算。李原本只算找食物；加上加工和煮飯後，男性每週約 44.5 小時、女性約 40.1 小時。卡普蘭 2000 年的文章則質疑「工作」「閒暇」的定義，以及飲食到底夠不夠 [b56]。
          src:
            - b56
          stance: 補充
        - who: 勞倫斯・基利（Lawrence Keeley，考古學家）與史迪芬・平克（Steven Pinker，心理學家）
          text: 採集和部落社會可能比想像中暴力。基利估計九成以上已知社會打過仗，部落戰爭的死亡比例平均約是 20 世紀戰爭的 20 倍；平克也主張轉到農業文明後暴力死亡率約降為五分之一。人類學家弗格森（R. Brian Ferguson）則認為他們挑了死傷特別高的例子 [b57][b58]。
          src:
            - b57
            - b58
          stance: 反對
        - who: 大衛・格雷伯與大衛・溫格羅（David Graeber & David Wengrow）
          text: 史前社會沒有單一模樣。《萬物的黎明》認為，有些群體一年中會在階層嚴明和平等共治之間季節性切換，所以不能用一種「採集者生活」來概括 [b35]。
          src:
            - b35
          stance: 補充
      think: 角色扮演：你是考古學家，經費只夠做一件事來判斷「採集者過得比較好」——分析骨骸、研究石器，還是調查今天的採集部落？你選哪一個？它能回答什麼、不能回答什麼？
      minutes: 10
    - no: 4
      part: 1
      title: 巨獸滅絕，人類是兇手？
      en: The Flood
      claim: |
        哈拉瑞認為，智人坐船抵達澳洲後幾千年內，巨型有袋動物等大型動物大量消失；美洲大約 1 萬 6 千年前人類到達時也出現同樣的情況，紐西蘭的動物撐過了 4 萬 5 千年的氣候變化，卻在約 800 年前人類登島之後，失去大約六成鳥種 [b4]。他認為這些動物撐過了以前的冰期，而且同期海洋生物變化不大，所以主因是人類而非氣候 [b4]。他把人類比喻成吞沒其他物種的「大洪水」，並警告大型動物的滅絕還沒結束 [b4]。
      cards:
        - event-megafauna-extinction
        - event-peopling-americas
        - event-out-of-africa
      card_notes:
        event-megafauna-extinction: 各大陸大型動物消失的年代，是判案主證據
        event-peopling-americas: 人類何時到美洲，決定時間對不對得上
        event-out-of-africa: 人類抵達澳洲的年代，可和當地滅絕對照
      debate:
        - who: 主張氣候是主因的研究者
          text: 證據還不足以定罪人類。研究第四紀（約 258 萬年前到今天這段地質年代）滅絕的學者認為，澳洲大型動物化石稀少、年代難精準測定，不少物種和人類共存過一段時間；部分學者仍認為氣候變遷才是主因，2025 年的文獻回顧說學界仍深度分裂 [b33]。
          src:
            - b33
          stance: 反對
        - who: 托比亞斯・安德曼（Tobias Andermann）等人 2020 年研究
          text: 人類是主因。他們分析 12 萬 6 千年來的哺乳動物滅絕，認為約 96% 主要是人類活動造成，而且常在人類初抵各大陸時成批發生；也有不少學者主張是人類狩獵加上氣候壓力共同作用 [b33]。
          src:
            - b33
          stance: 支持
        - who: 白沙足跡研究（Pigati 等人，2023 年）
          text: 人類可能更早到美洲，讓「一到就滅絕」的推論變複雜。新墨西哥州白沙的人類腳印定在約 2.3–2.1 萬年前（仍有爭議）；如果成立，人類和美洲巨獸共存了約一萬年，滅絕才集中在約 1.3–1.1 萬年前 [b59][b60][b33]。
          src:
            - b59
            - b60
            - b33
          stance: 反對
      think: 當一次法官：要判「人類是兇手」，需要哪兩件事在時間上對得上？對照「大型動物滅絕（更新世晚期）」和「人類抵達美洲」兩張卡的年代，你會判有罪、無罪，還是證據不足？
      minutes: 10
    - no: 5
      part: 2
      title: 種田是一場大騙局？
      en: History's Biggest Fraud
      claim: |
        哈拉瑞認為，大約 1 萬 2 千到 1 萬年前，中東、中美洲和中國各自獨立開始農業 [b5]。他主張農業讓人口變多，卻讓多數人更辛苦：工作更久、飲食變單調、更容易生病和鬧饑荒，所以稱之為「史上最大騙局」（第 5 章）；甚至可以說是小麥馴化了人類 [b5][b24][b22]。他也拿哥貝克力石陣為例，認為可能是先有大型宗教建築，人們才為了供應建造者而開始耕作 [b5]。
      cards:
        - event-fertile-crescent-agriculture
        - building-gobekli-tepe
        - event-east-asia-agriculture
      card_notes:
        event-fertile-crescent-agriculture: 最早農業的考古證據，檢驗「農民更辛苦」
        building-gobekli-tepe: 檢驗「先有神廟才有農業」的關鍵遺址
        event-east-asia-agriculture: 另一個農業起源地，可比較各地過程
      debate:
        - who: 賈德・戴蒙（Jared Diamond）
          text: 早期農民的骨骸顯示健康變差。他舉伊利諾州、俄亥俄州的玉米農民骨骸，有更多營養不良、貧血和傳染病；他也認為農業讓少數菁英能拿走別人的糧食，加重女性負擔 [b30]。
          src:
            - b30
          stance: 支持
        - who: 詹姆斯・斯科特（James C. Scott，《反穀》作者）
          text: 農業和國家的關係比書說的更慢、更政治。他認為定居早於農業，常發生在濕地；從馴化作物到美索不達米亞出現國家隔了四千多年；穀物同時成熟、容易看見和收稅，特別適合國家控制人民 [b34]。
          src:
            - b34
          stance: 補充
        - who: 雅各・維斯多夫（Jacob Weisdorf，經濟史家）等研究者與東南亞的生物考古研究
          text: 農業不全是騙局。不少研究者認為，高熱量作物是後來文明興起的必要條件，人口也因此快速增加；而且健康代價各地不同，東南亞稻作社會的牙齒健康就沒有像其他地區那樣明顯變差 [b61]。
          src:
            - b61
          stance: 反對
        - who: 哥貝克力石陣 2019 年起的新發掘
          text: 「先有神廟才有農業」的說法變弱了。遺址發現住屋、蓄水池和日常工具，學者大多放下「只是神廟、沒人住」的看法；遺址有大量磨石，但還不確定磨的是野生還是栽培穀物 [b36]。
          src:
            - b36
          stance: 反對
      think: 你會怎麼選：你是 1 萬年前的採集者，附近的野生小麥長得很好。你會定居下來種田，還是繼續四處採集？寫下一個理由。再看「哥貝克力石陣」卡：住屋和水池的新發現，讓「先有神廟才有農業」更可信還是更不可信？
      core: true
      minutes: 20
    - no: 6
      part: 2
      title: 人人平等也是想像出來的？

id: unit-america-rise-2
title: 美國崛起（下）：財政、土地、工業與美元
histories:
- 美國史
- 美洲史
- 錢的歷史
- 世界通史
mystery: 有了制度還不夠。美國怎麼建立信用、擴張土地、長出大企業，又怎麼讓美元成為世界的中心？每一步，誰得到好處、誰付出代價？
teaser: 從漢彌爾頓的財政計畫、西進與鍍金時代、馬歇爾計畫，到 1944 年被寫進國際貨幣規則的美元，美國變強有很多條線，而每一條線都有人付出代價。
goals:
- 能說出漢彌爾頓財政計畫、西進擴張、鍍金時代工業化與美元地位，各自替美國變強加了什麼
- 能判讀國際貨幣基金協定的原文，說出它實際寫了什麼、沒寫什麼
- 能比較西進擴張與鍍金時代：誰受益、誰付出代價
- 能指出「美國為什麼強」有制度、土地與資源、時機、美元等並列的解釋，而且沒有單一定論
- 能分辨後見之明與倖存者偏差，不把歷史當成投資建議
minutes: 35
level: 高中
curriculum: []
steps:
- type: hook
  text: |
    上一課我們看了美國的制度和想法：殖民地自治、獨立宣言、憲法。但有了規則，國家還要有錢、有土地、有工廠。
    這一課要看五件事：漢彌爾頓怎麼讓新國家借得到錢，西進擴張和鍍金時代怎麼讓美國變大，二戰後的馬歇爾計畫做了什麼，美元又怎麼被放到世界貨幣體系的中心。
    我們不找「唯一的答案」，而是把幾種解釋並排，再看每一種解釋的代價。這一課接在上半場之後；整合題會用到上半的制度與立國思想，建議先做上半場。
  guess:
    q: 獨立戰爭後，美國欠了一大筆債，借據的市價遠低於票面。漢彌爾頓怎麼讓大家相信新國家會還錢？
    options:
    - 只承認一半的債，剩下的一筆勾消，先把負擔減輕
    - 按票面價值全額還債，還替各州承擔債務，用關稅等穩定收入付利息
    - 向外國借更多的錢，先用新債去還舊債
    - 大量印發鈔票，把舊債一次還清
    reveal: 漢彌爾頓主張聯邦按票面價值還債、替各州承擔債務，再用關稅等收入支付利息，後來又設立銀行、定義美元。但當時也有人擔心富人與投機者大賺，計畫在國會差點被擋下。
- type: sim
  sim: debase
  prompt: 先動手玩玩看：如果政府偷偷減少銀幣的含銀量，大家對錢的信心會怎麼變？提醒：這個模擬玩的是金屬貨幣；1792 年美元被定義為約含 371.25 格令純銀，而今天的美元已不是金屬貨幣。道理相通，都是貨幣的價值要靠大家的信任，但運作方式不一樣。
- type: card
  id: finance-hamilton-financial-plan
  depth: understand
  prompt: 一個剛打完仗、欠一身債的新國家，怎麼讓人相信它會還錢？注意哪些事是 1790、1791、1792 年分幾次推動的，不是一次完成。
  focus: [F1, F3]
  quick:
  - q: 新國家的信用為什麼很差？漢彌爾頓的辦法是什麼？
    a: 戰後聯邦與各州背了大量債務，政府借據的市價遠低於票面。漢彌爾頓主張聯邦按票面價值還債、替各州承擔債務，並用關稅等收入支付利息。
  - q: 很多人以為漢彌爾頓的計畫是一次法案就完成的，其實呢？
    a: 其實是 1790 到 1792 年間分幾次推動：1790 年還債與換債，1791 年設立第一銀行，1792 年的《鑄幣法》才把美元定義清楚。
- type: chain
  prompt: 把漢彌爾頓建立信用的做法，依先後順序排成一條鏈（最上面最早）。
  items:
  - 獨立戰爭後聯邦與各州背了大量債務，政府借據的市價遠低於票面
  - 漢彌爾頓向國會提出《公共信用報告》，主張按票面價值還債並承擔各州債務
  - 國會通過法案，讓債權人以舊債換新發的聯邦公債
  - 國會設立特許期 20 年的美國第一銀行
  - 《鑄幣法》設立鑄幣局，並定義美元的金屬含量
  followup:
    question: 下面哪一組只是「先後」，卡片沒有說前一件促成後一件？
    options:
    - 政府借據的市價遠低於票面 → 漢彌爾頓提出按票面還債的辦法
    - 反對者擔心投機客大賺 → 首都遷往波多馬克河一帶，法案才通過
    - 設立特許期 20 年的第一銀行 → 《鑄幣法》定義美元
    - 憲法承認邦聯時期的債務有效 → 還債計畫有了憲法的基礎
    answer: 2
    explain: 卡片把設銀行和定義美元當成同一套計畫裡分次推動的兩個辦法，並沒有說設了銀行才促成《鑄幣法》。其他三組，卡片都有寫出關聯：信用很差是提出辦法的原因，反對者的疑慮要靠政治交換才化解，憲法則替承認舊債打下基礎。
    why_wrong:
    - 卡片說，借據市價遠低於票面、新國家信用很差，正是漢彌爾頓提出辦法要解決的問題。
    - 卡片寫到，計畫在國會幾乎被擋下，要靠首都位置的政治交換才過關。
    - null
    - 卡片寫到，憲法第六條承認邦聯時期訂下的債務依然有效，替還債打下基礎。
  explain: 先有「信用很差」的問題，再提出辦法（1790 年 1 月），法案通過、舊債換新債（1790 年 8 月），接著設銀行（1791 年 2 月），最後以《鑄幣法》定義美元（1792 年 4 月）。這套計畫是 1790 到 1792 年間分幾次推動的，不是一次法案完成。
  hints:
  - 最早的是「問題」，而不是「解決辦法」。
  - 先處理舊債，再談設銀行。
  - 把美元定義清楚的《鑄幣法》是這幾件事裡最晚的。
  ref: finance-hamilton-financial-plan#F3
- type: decision
  role: 你是 1790 年的美國國會議員
  situation: |
    戰爭欠下的舊借據，市價遠低於票面。漢彌爾頓主張一律按票面價值償還，連後來才買進借據的人也一樣。
    麥迪遜則主張要區分「原始債權人」與「後來買進借據的投機者」。
    如果你手上有一票，你支持哪一邊？
  options:
  - label: 支持漢彌爾頓：按票面價值償還，不分原始持有人
    result: 這是歷史走的路。1790 年 8 月法案簽署，債權人以舊債換新發的聯邦公債。批評者擔心富人與投機者大賺，也擔心各州得失不均，但聯邦的信用逐漸建立起來。
  - label: 支持麥迪遜：區分原始債權人與後來買進借據的投機者
    result: 推測：麥迪遜確實提過這個主張，但被否決，歷史沒有走這條路，所以後果只能推測。投機者的獲利可能會少一些、爭議也許較小，但要分辨誰是原始債權人、誰是買家，執行起來可能更複雜。
  actual: 國會最後採用漢彌爾頓的辦法，但計畫在國會幾乎被擋下，要靠首都遷往波多馬克河一帶的政治交換才過關；1792 年又發生金融恐慌。事後看，美國公債的信用逐漸建立，但在 1790 年當時，結果並不確定。
  ref: finance-hamilton-financial-plan#F2
  note: 沒有發生的選項，後果都是推測，已標示清楚。這是歷史情境，不構成投資建議。
- type: card
  id: event-westward-expansion
  depth: deep
  prompt: 這是「土地與資源」的解釋，也是代價最清楚的一段。注意三件事：購地買下的是什麼？《印第安人遷移法》的條文寫了什麼、實際執行時又是什麼樣子？「史家怎麼吵」裡，邊疆論受到什麼批評？
  focus: [terms, C4, debate]
  quick:
  - q: 路易斯安那購地讓美國多了什麼？那片土地上的人有被問過嗎？
    a: 美國用約 1,500 萬美元向法國買下路易斯安那，領土大約多了一倍。但那片土地上本來就住著許多原住民族，他們沒有被問過意見。
  - q: 《印第安人遷移法》的條文寫了什麼？實際執行時又是什麼樣子？
    a: 條文是授權總統與部落「交換土地」，把部族遷到密西西比河以西。實際上許多遷移是被迫的，例如切羅基人在 1838–39 年被迫遷徙，估計約 4,000 人死亡，史稱「淚之路」。
- type: card
  id: event-gilded-age-industrialization
  depth: understand
  prompt: 鐵路、鋼鐵、石油：民間大公司讓美國的工業長大，國會也開始管壟斷。注意《謝爾曼法》通過之後，標準石油要到哪一年才被判決解散。
  focus: [C4, C6]
  quick:
  - q: 鐵路為什麼會讓鋼鐵、石油長出巨型公司？
    a: 因為鐵路把原料、工廠與市場串成一張網。有了這張網，鋼鐵、石油等產業才長出巨型公司，例如卡內基的鋼鐵和洛克斐勒的標準石油。
  - q: 國會通過《謝爾曼法》之後，壟斷就立刻消失了嗎？
    a: 沒有。《謝爾曼法》1890 年通過，早期執法的效果有限，標準石油要到 1911 年才被最高法院判決解散。
- type: compare
  cards:
  - event-westward-expansion
  - event-gilded-age-industrialization
  prompt: 比一比兩段讓美國「變大、變強」的時期。
  rows:
  - aspect: 時間
    a: 1803 年到 1890 年
    b: 1870 年到 1913 年（本卡為了涵蓋標準石油成立到聯準會前後所選的起訖，不是單一來源的定義）
  - aspect: 擴張的方式
    a: 購地、條約、戰爭與立法（例如宅地法）
    b: 鐵路、鋼鐵與石油等民間大公司推動，政府以事後規範為主（例如反托拉斯法）
  - aspect: 受益者
    a: 取得土地與出海口的美國政府、白人農場主、投機者與移民
    b: 握有鐵路、鋼鐵與石油的企業主與金融家
  - aspect: 付出代價者
    a: 被迫遷移的原住民族、墨西哥及割讓區內的墨西哥人
    b: 面對罷工與壓力的工人、被排華法案排除的華人勞工、被大公司擠壓的小企業
  - aspect: 史家的爭論
    a: 邊疆造就民主，還是征服與土地剝奪？遷移是「保護」還是掠奪？
    b: 大資本家是強盜大亨，還是產業領袖？
  question: 這兩段讓美國變強的過程，誰得到好處、誰付出代價？為什麼不能只看「變強」兩個字？
  points:
  - 兩段都讓美國的領土、產業與財富快速變大，所以常被放進「美國為什麼強」的答案
  - 受益的人和付出代價的人不是同一批：西進受益的是政府、農場主、投機者與移民，代價由原住民族與墨西哥承擔；鍍金時代受益的是企業主與金融家，代價由工人、華人勞工與小企業承擔
  - 史家的評價也不同（邊疆論與批評者、強盜大亨與產業領袖），本單元不下定論
  model_answer: 兩段都讓美國的領土、產業與財富快速變大，所以常被放進「美國為什麼強」的答案；但受益的人和付出代價的人不是同一批。西進階段，政府以購地、條約與立法取得並分配土地，受益的是政府、農場主、投機者與移民，付出代價的是被迫遷移的原住民族與割讓土地的墨西哥；鍍金時代主要由民間大企業推動，受益的是鐵路、鋼鐵與石油的企業主與金融家，付出代價的包括面對罷工壓力的工人、被排華法案排除的華人勞工與被擠壓的小企業。史家對此也有不同看法：特納的邊疆論認為邊疆塑造了美國的民主，批評者則認為這套說法忽略原住民族、女性與墨西哥人的經驗；大資本家被批評者稱為強盜大亨，另一種看法強調他們降低成本、創造就業。本單元不替這些爭論下定論。
  hints:
  - 先看「受益者」和「付出代價者」兩列，哪些群體只出現在其中一列？
  - 再看「史家的爭論」那一列，同一件事為什麼會有兩種評價？
  - 回到卡片的「史家怎麼吵」，看看邊疆論和強盜大亨各自被怎麼批評或辯護。
- type: card
  id: event-marshall-plan
  depth: deep
  prompt: 這是「時機」的解釋。讀「史家怎麼吵」：馬歇爾計畫是善意重建，還是美國利益？又有學者怎麼質疑援助的貢獻？
  focus: [debate]
  quick:
  - q: 馬歇爾計畫是善意重建，還是美國利益？兩種看法各怎麼說？
    a: 傳統看法強調美國以援助拯救戰後歐洲，避免經濟崩潰與政治動盪。另一派強調美國也有自身利益：援助物資多向美國採購，同時能擴大西歐市場、抵擋蘇聯影響，所以兼具人道與冷戰戰略目的。
  - q: 有學者質疑援助的貢獻，理由是什麼？
    a: Milward 等學者認為援助的貢獻被誇大，西歐在計畫開始前已在復甦。DeLong 與 Eichengreen 則認為關鍵不只是金額，而是計畫促使歐洲各國採取穩定財政與市場導向的政策。
- type: card
  id: finance-dollar-reserve-currency
  depth: deep
  prompt: 這是「美元」的解釋。注意 1971 年美元不再兌換黃金之後，為什麼仍是最主要的儲備貨幣；也請讀「後見之明與倖存者偏差」那一段。本單元不構成投資建議。
  focus: [F3, debate]
  quick:
  - q: 1971 年美元不再能換黃金，為什麼它沒有就此垮掉？
    a: 美元不再靠黃金，價值靠政府與央行的信用。它的地位能延續，通常被歸於美國金融市場的深度、網路效應、法治與慣性：大家都用它計價、結算與借貸，換成別的貨幣成本很高。
  - q: 特里芬難題在說什麼？
    a: 世界需要更多美元來做交易，但美元流出越多，大家就越懷疑美國的黃金夠不夠換。也就是說，發行世界貨幣的國家，要同時顧國內目標和供應世界貨幣的責任。
- type: source
  card: finance-dollar-reserve-currency
  idx: 0
  question: 1944 年國際貨幣基金協定寫「各會員國貨幣的平價，要以黃金或美元來表示」，最能說明什麼？
  options:
  - 1944 年美元就已占了各國外匯存底的 58%，是最主要的貨幣
  - 各國從此必須用美元支付所有的貿易款項，不能用其他貨幣
  - 美元被放在和黃金並列的位置，成為各國匯率的基準
  - 美元從 1944 年起就不能再兌換黃金，只能當成普通貨幣
  answer: 2
  why_wrong:
  - 「約 58%」是 IMF 統計中 2024 年前後的占比（估計），不是 1944 年的數字。
  - 「平價」是各國匯率的基準，不是規定付款只能用哪一種貨幣。
  - null
  - 當時美元以每盎司 35 美元掛黃金；要到 1971 年才停止兌換。
  critique:
    question: 這是 1944 年布列敦森林會議通過的協定條文。關於這份史料，下列哪個判斷最穩妥？
    options:
    - 它說明 1944 年的規則把美元放在中心，但不能證明之後一定維持
    - 它能證明美元到今天仍是最主要的儲備貨幣，因為這條規則一直沒有改過，所以不會變
    - 它能證明美元的價值從一開始就和黃金無關，只靠大家的信任來維持
    - 它能證明當時每一個國家都完全同意，沒有任何國家對美元有不同的想法
    answer: 0
    explain: 條文是 1944 年的制度規則，只能說明當時的設計；1971 年美元就不再兌換黃金，之後的地位靠信任與網路效應延續。事後看美元「撐了這麼久」好像理所當然，但 1971 年與 2008 年前後，當時的人並不確定，這是後見之明；儲備貨幣的地位也是慢慢變化的。
    why_wrong:
    - null
    - 1971 年美元不再兌換黃金，這套規則已經改變；今天的地位靠的是別的條件。
    - 1944 年的規則是以每盎司 35 美元掛黃金，美元與黃金有直接關係。
    - 卡片沒有說每個國家都沒有異議；規則是政府談判決定的，不能用條文證明大家的想法。
  explain: 這是 1944 年的制度規則，說明美元被放進國際貨幣體系的中心，並搭配每盎司 35 美元的黃金價格。「約 58%」是 IMF 統計中 2024 年前後美元占外匯存底的比例（估計），不是 1944 年的數字；美元要到 1971 年才停止兌換黃金。
  hints:
  - 先看原文把「黃金」和什麼並列。
  - 「平價」是用來決定各國貨幣之間的匯率基準，不是規定付款只能用哪一種貨幣。
  - 58% 和停止兌換黃金，分別是哪一個年代的事？
  ref: finance-dollar-reserve-currency#F2
- type: today
  card: finance-dollar-reserve-currency
  question: 常聽到「美元霸權就是美國強大的祕密」，或「美元遲早會像英鎊一樣退位」。拿 1944 到 1971 年的故事來類比今天，哪裡不成立？
  points:
  - 1944 年的美元背後有黃金作為最後的承諾，今天的美元是法定貨幣，靠制度與信任
  - 戰後初期美國握有大量官方黃金、經濟規模占世界的比重遠高於今天；當時是固定匯率，今天是浮動匯率加上自由流動的資本市場；現在的競爭者也和當年的英鎊不同
  - 可以借來思考的是：一種貨幣被廣泛使用，網路效應會讓地位容易延續、變化很慢；1971 年與 2008 年前後的預測都沒有發生，這是後見之明，也不能說美元是美國強大的唯一原因
  model_answer: 先說不能類比的地方：1944 年的美元背後有黃金作為最後的承諾，今天的美元是法定貨幣，靠制度與信任；戰後初期美國握有全世界約三分之二到七成的官方黃金，經濟規模占世界的比重也遠高於今天；當時是政府談判決定的固定匯率，今天則是浮動匯率加上高度自由流動的資本市場；現在的競爭者（歐元、人民幣）所面對的局面，也和當年的英鎊不同。所以不能用 1971 年以前的結論直接套到今天，也不能說美元是美國強大的唯一原因。可以借來思考的是：一種貨幣被廣泛用來計價、結算與儲備時，網路效應會讓它的地位容易延續；這類地位的變化通常很慢，臨界點很難判斷；1971 年與 2008 年前後，當時的人也不確定美元能不能維持，結果事後看並沒有發生，這是後見之明。本單元不構成投資建議。

    note: 去程（每年約 3 月從阿卡普爾科出發）：先往北緯 18 度，再一路維持在北緯 10–15 度之間順著信風到馬里亞納群島，約兩個月；1668 年起規定停靠關島，再兩三週到馬尼拉 [s1]。回程（約 6 月底從馬尼拉出發）：往北到臺灣、日本外海，順著北緯 40 度附近的西風往東，到加利福尼亞海岸再往南回阿卡普爾科，平均要六個月 [s1]。1565 年烏爾達內塔找到這條回程航線 [s1][s2]。轉向點只是示意；菲律賓東側的入口（聖貝納迪諾海峽）依英文維基。

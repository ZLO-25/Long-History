# 深入專題：古羅馬（檔名＝id 去掉 dive-）。規劃書 docs/dive-greece-rome-plan.md 第二節；程式說明見 docs/dives.md
id: dive-ancient-rome
title: 古羅馬：一座城怎麼變成地中海，又怎麼守不住
question: 羅馬人趕走國王、發誓不再讓一個人說了算，為什麼五百年後還是出現了皇帝？一個管了整個地中海的帝國，又是怎麼一步步守不住的？
blurb: 這個專題把前 509 年到西元 476 年的羅馬放大來看：共和的制度怎麼運作、擴張怎麼改變了它、內戰怎麼把權力集中到一個人手上、帝國又怎麼在三世紀的危機之後一步步分裂。最後一區帶你對照希臘與羅馬，看兩個古代文明各自留下了什麼。
range: { start: -509, end: 476 }
histories: [希臘羅馬史]
visual: power
power_ui:
  title: 羅馬疆域圖
  subtitle: 羅馬在什麼時候管到哪裡
  caveat: 羅馬的疆域邊界很不固定，行省和附庸國也常常改變；這裡只能用今日的國界近似，一個國家只有一部分在羅馬境內時，會用經線或緯線切開，邊界只是示意，不是當時確切的界線。
  legend: 今日國界

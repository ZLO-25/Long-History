year: 1980
basemap: world_countries
title: 蘇聯入侵阿富汗之後（1980 年）
note: 1979 年 12 月蘇聯出兵阿富汗，緩和時期結束。越南 1975 年統一、1978 年底出兵柬埔寨；寮國、衣索比亞、安哥拉、莫三比克、南葉門、剛果人民共和國、貝南也由親蘇的馬列政權執政。中國在 1979 年 1 月與美國建交，反過來和美國一起對抗蘇聯；美國同時與中華民國斷交、終止共同防禦條約，改以《臺灣關係法》維持關係。以今日國界近似，邊界只是示意。

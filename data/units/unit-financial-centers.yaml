id: unit-financial-centers
title: 金融中心為什麼會搬家？從布魯日、安特衛普到阿姆斯特丹、倫敦、紐約
histories: [錢的歷史, 歐洲史, 美國史, 世界通史]
mystery: 從中世紀的市集到今天的紐約，「錢的首都」一直在換地方。商人和資金為什麼會離開一座繁榮的城市，改去另一座？
teaser: 河口淤積、一場圍城、一次世界大戰，都和「錢的首都」換人有關。這一課追著錢跑，看它每次為什麼搬家。
goals:
  - 能說出布魯日、安特衛普、阿姆斯特丹、倫敦、紐約各自在金融中心接力中的位置
  - 能判讀當時人留下的文字，分清「寫信人或銀行的說法」和「實際發生的事」
  - 能比較「安特衛普→阿姆斯特丹」與「倫敦→紐約」兩次中心轉移的異同
  - 能指出用過去的金融中心類比今天時哪裡不成立，並分辨後見之明與倖存者偏差
minutes: 50
steps:
  - type: hook
    text: |
      想像班上有一群人，固定在某個地方交換卡片、互相借點數。大家會去那裡，是因為路好走、有人幫你評理、大家都放心。
      如果有一天，通往那裡的路被堵住了，或是管場地的人和別人吵起來，或是最大的借方賴帳不還，你會怎麼辦？
      多半會約去別的地方。歷史上的「金融中心」，也一次又一次這樣搬家。這一課就跟著錢，從中世紀的市集一路跑到紐約。
  - type: card
    id: finance-champagne-fairs
    depth: story
    prompt: 先看起點。注意香檳伯爵為什麼要保護商人，也注意市集最後衰落時，卡片列了不只一個原因。
  - type: card
    id: finance-bruges-bourse
    depth: story
    prompt: 接著到布魯日。注意它衰落的兩種常見解釋，一種是自然條件，一種是政治衝突。也要記住 bourse 在這裡不是股票交易所。
  - type: card
    id: finance-antwerp-bourse
    depth: understand
    prompt: 商人轉去的新地方是安特衛普。注意它靠什麼興起，以及 1557 年的暫停還債為什麼不等於它馬上沒落。
  - type: source
    card: finance-antwerp-bourse
    idx: 0
    question: 雅各布·富格爾在 1523 年寫信給查理五世，說「沒有我，陛下無法取得羅馬皇冠」。這句話最能說明什麼？
    options:
      - 富格爾自己認為，他借給查理五世的錢對皇帝取得皇位很關鍵
      - 查理五世已經把所有借款都還清了
      - 富格爾家族在安特衛普蓋了第一棟專門興建的交易所
      - 這句話證明皇帝選舉的結果完全由富格爾一個人決定
    answer: 0
    explain: 這是寫信人自己的說法。卡片記載，富格爾在 1519 年為皇帝選舉大筆放款，估計約 54 萬弗羅林，是當時總額約 85 萬中的大宗，所以他確實出了大部分的錢。但「沒有我就不行」是他自己的表述，不能直接當成他一人決定了結果。另外，這段文字是英文條目所引的英譯，各譯本措辭略有差異。
    hints:
      - 先看是誰寫給誰：是銀行家寫給皇帝，還是史家的研究結論？
      - 回到卡片「起源與背景」，找 1519 年那筆放款的數字。
      - 「出了大部分的錢」和「一個人決定了結果」，是同一件事嗎？
    ref: finance-antwerp-bourse#F2
  - type: card
    id: war-fall-of-antwerp
    depth: deep
    prompt: 讀完請特別看「史家怎麼吵」：1576 年的洗劫與 1585 年的陷落，是衰落的轉捩點，還是長期趨勢的一部分？也看「常見誤解」，分清這兩件事相隔幾年。
  - type: chain
    prompt: 把安特衛普興起、衰落到阿姆斯特丹接手的過程，依時間先後排成一條鏈（最上面最早）。
    items:
      - 布魯日的河口逐漸淤積，外國商人逐步轉向安特衛普
      - 1531 年安特衛普新交易所落成
      - 1557 年腓力二世的政府暫停還債，借錢給他的銀行家大受打擊
      - 1576 年欠餉的西班牙士兵洗劫安特衛普（西班牙之怒）
      - 1585 年安特衛普投降，北方持續控制河口、封鎖斯海爾德河
      - 不少商人與工匠北遷，阿姆斯特丹成為重要去向
    explain: 這是時間順序，不代表每一步都是下一步的唯一原因。卡片提醒，安特衛普的興衰同時牽涉商路、君主借款與戰爭，各自的分量不下定論。對阿姆斯特丹的崛起來說，安特衛普的陷落與人才資金北遷也只是原因之一，不是唯一原因。
    hints:
      - 最早的一步和「舊中心布魯日」有關。
      - 1531 年的交易所代表繁榮期，1557 和 1576 都是在它之後發生的壞消息。
      - 最後兩項是：城市投降之後，人和錢往哪裡走？
    ref: war-fall-of-antwerp#A7
  - type: decision
    role: 你是 1585 年夏天安特衛普的新教徒商人
    situation: |
      8 月 17 日，安特衛普向帕爾馬公爵投降。依投降條件，新教徒有四年時間處理財產後離開（維基百科寫四年，其他來源或有不同說法）。
      你的城市沒有被摧毀，但出海的斯海爾德河口握在北方手裡，船很難進來。北方的阿姆斯特丹正在接納人和資金。
      你要把生意搬到北方，還是留在安特衛普？
    options:
      - { label: 帶著家當和生意往北遷，去阿姆斯特丹, result: 歷史上不少商人和工匠走了這條路。安特衛普人口從圍城前約 10 萬降到約 4 萬，阿姆斯特丹是重要去向。但卡片沒有記載個別商人後來過得好不好，所以不能說北遷一定成功。 }
      - { label: 留在安特衛普，等河口很快重新開放, result: 推測：你很可能等不到。卡片只記載，河口到 1792 年才重新開放，荷蘭徵收通行稅到 1863 年才免除。留下的人實際過得如何，卡片沒有寫，所以這條路的後果只能推測。 }
    actual: 不少人北遷，許多技術工匠與新教徒的去向以阿姆斯特丹為重要一站。多數論述認為，這是阿姆斯特丹在 17 世紀成為金融與貿易中心的原因之一，但不是唯一原因。
    ref: war-fall-of-antwerp#A9
    note: 這是歷史情境，不構成投資建議。要小心後見之明：當時的人並不知道河口會被封鎖那麼久。
  - type: card
    id: finance-amsterdam-wisselbank
    depth: understand
    prompt: 北遷的商人把信任的重心放在阿姆斯特丹。注意「銀行貨幣」是什麼，以及 agio 代表大家願意多付一點錢換什麼。
  - type: source
    card: finance-amsterdam-wisselbank
    idx: 0
    question: 亞當·斯密在 1776 年寫道，阿姆斯特丹銀行「宣稱，不把存放在它那裡的任何部分借出去」。讀這句話時最該注意什麼？
    options:
      - 這句話證明銀行從來沒有放過款
      - 這是銀行對外的宣稱；卡片另外記載銀行逐步放寬準備，並放款給東印度公司與市政府，所以要分清「宣稱」和「實際」
      - 斯密在這句話裡是在說銀行已經倒閉
      - 這句話說明銀行貨幣沒有任何溢價
    answer: 1
    explain: 斯密寫下的是銀行自己的說法。卡片整理的記載是，銀行的全額準備政策逐步放寬，並放款給東印度公司（1657 年起，1682 年的額度為 170 萬銀行荷盾）與市政府。同一家銀行，公開形象和後來揭露的運作有落差，讀史料要分清「宣稱」和「實際」。
    hints:
      - 先看句子的主詞和動詞：是誰「宣稱」？
      - 回到卡片「改變了什麼」，看銀行的準備政策後來怎麼變。
      - 這段文字是斯密寫下當時流傳的說法，還是銀行的帳本？
    ref: finance-amsterdam-wisselbank#F5
  - type: card
    id: finance-amsterdam-decline
    depth: understand
    prompt: 阿姆斯特丹的位置後來也被取代。注意卡片區分了「資金所有權」和「市場所在地」：荷蘭的錢真的消失了嗎？
  - type: card
    id: finance-london-rise
    depth: deep
    prompt: 讀完請看「常見誤解」和被質疑的羅斯柴爾德故事，想一想：倫敦是一夕取代阿姆斯特丹的嗎？
  - type: card
    id: finance-new-york-overtakes-london
    depth: deep
    prompt: 最後一站是紐約。請特別看「史家怎麼吵」：美元什麼時候超過英鎊？也注意 1925 年英國回到戰前平價這個決定。
  - type: compare
    cards: [war-fall-of-antwerp, finance-new-york-overtakes-london]
    prompt: 比一比兩次中心轉移：安特衛普→阿姆斯特丹，與倫敦→紐約。
    rows:
      - { aspect: 時間, a: 1576 年 11 月西班牙之怒，到 1585 年 8 月投降, b: 約 1914 年到 1931 年（卡片取的區間），傳統說法的終點是 1944 年布列敦森林體系 }
      - { aspect: 主要衝擊, a: 軍隊欠餉而洗劫、圍城，斯海爾德河被封鎖, b: 英國戰時向美國借錢，美國由債務國變成債權國；英國 1925 年回到戰前平價 }
      - { aspect: 人與錢往哪裡去, a: 工匠、新教徒與商人北遷，阿姆斯特丹是重要去向, b: 紐約的承兌市場成長，各國央行把美元也放進外匯準備（Eichengreen 與 Flandreau 的主張） }
      - { aspect: 舊中心之後, a: 安特衛普沒有被摧毀，但失去首要地位，人口從約 10 萬降到約 4 萬, b: 倫敦仍是重要的金融中心，英鎊在英鎊區仍有影響力 }
      - { aspect: 學者爭論, a: 洗劫與陷落是轉捩點，還是長期趨勢的一部分, b: 美元何時超車：1920 年代中期，還是 1944 年 }
    question: 這兩次轉移最大的差別是什麼？又有什麼共同點？
    model_answer: 最大的差別是，安特衛普受到的是軍事打擊和河口封鎖，人和資本真的搬了家；倫敦輸給紐約，沒有城市被攻陷，主要是債務、儲備貨幣與金融制度的變化，倫敦並沒有消失。共同點是，兩次都不是一夕之間完成，原因都不只一個，史家對轉捩點在哪裡也都有不同看法：安特衛普有「陷落是轉捩點」對「長期趨勢」的爭論，紐約超車則有 1920 年代中期對 1944 年的爭論。
    hints:
      - 先看「主要衝擊」那一列：哪一邊有城市被圍攻？
      - 再看「舊中心之後」：兩個舊中心是消失了，還是仍然重要？
      - 回去看兩張卡的「史家怎麼吵」，找出兩邊各有什麼爭論。
  - type: today
    card: finance-new-york-overtakes-london
    question: 今天會不會有「下一個金融中心」，像歷史上那樣取代紐約？用過去的例子來類比，哪裡不成立？
    model_answer: 先說不能類比的地方。一戰後的英鎊與美元處在金本位時代，沒有 IMF，也沒有今天的央行互換與浮動匯率；英國背後還有帝國與英鎊區。中世紀布魯日、安特衛普的商人搬家，是帶著貨物與人員轉往另一座城市，今天資金可以在全球電子市場快速移動，條件完全不同。所以不能因為歷史上接力過幾次，就推斷下一個一定會出現，或說它會在何時出現。能借來思考的是幾個結構：依賴單一通道的中心，遇到通道受阻又和外部權力衝突時，商人可能轉往條件更好的城市；金融中心靠的是信用與制度的信任；儲備貨幣的地位，不只取決於經濟規模，也取決於金融市場、制度與各國央行的信任。這些只是思考的線索，不是預測，本單元也不構成投資建議。
  - type: check
    items:
      - kind: choice
        q: 布魯日的 bourse 最接近下列哪一種東西？
        options:
          - 商人聚會、換錢、交換匯票的場所
          - 公開買賣公司股票的證券交易所
          - 由市政府設立的帳簿貨幣銀行
          - 每年輪流舉辦六次的定期市集
        answer: 0
        explain: 布魯日的 bourse 是商人聚會與匯兌之處，並不是買賣股票的現代證券交易所；現代意義的股票交易要到 17 世紀初的阿姆斯特丹才出現。把它說成「世界第一個證券交易所」有些誇大。
        hints:
          - 回想卡片的「常見誤解」：bourse 不等於什麼？
          - 布魯日的 bourse 主要處理哪三件事：買賣、換錢、匯票？
        ref: finance-bruges-bourse#F1
      - kind: order
        q: 依時間先後排列這些事件：
        items:
          - 香檳市集興盛（約 1180–1320 年）
          - 安特衛普新交易所落成（1531 年）
          - 阿姆斯特丹匯兌銀行設立（1609 年）
          - 英格蘭銀行暫停以紙鈔兌換黃金（1797 年）
          - 英國放棄金本位（1931 年）
        explain: 香檳市集在中世紀，安特衛普交易所在 16 世紀，阿姆斯特丹匯兌銀行在 17 世紀初，停兌黃金發生在拿破崙戰爭期間，英國放棄金本位在一戰後。
        hints:
          - 先分出中世紀、16–17 世紀、18 世紀末與 20 世紀。
          - 1797 年停兌黃金發生在英法長期戰爭期間。
        ref: finance-amsterdam-wisselbank#F2
      - kind: choice
        q: 關於「紐約什麼時候取代倫敦」，哪個說法最符合卡片的內容？
        options:
          - 只有 1944 年布列敦森林體系這一種說法是對的
          - 只有 1920 年代中期這一種說法是對的
          - 兩種說法都有人主張，差別在於用什麼指標來衡量（例如各國外匯準備）
          - 1931 年英國放棄金本位的當天，美元就取代了英鎊
        answer: 2
        explain: 傳統說法以 1944 年布列敦森林體系為終點；Eichengreen 與 Flandreau 主張，以各國外匯準備衡量，美元約在 1920 年代中期就已追上英鎊。換手的時間點取決於怎麼統計，學界仍有不同意見。1931 年英國放棄金本位，並不代表英鎊消失或倫敦失去地位。
        hints:
          - 回到卡片「史家怎麼吵」，找「什麼時候換手？」這一段。
          - 「換手」要用什麼數字來量？
          - 1931 年之後，倫敦和英鎊還在嗎？
        ref: finance-new-york-overtakes-london#F5
      - kind: short
        q: 用一兩句話說明：為什麼不能因為「安特衛普→阿姆斯特丹→倫敦→紐約」排成一排，就說金融中心一定會照這個模式一個接一個？
        model: 這條接力線是我們事後只看贏家排出來的，有後見之明：當時的人看到的是全歐洲最熱鬧的市場，不知道哪次違約或戰事是轉捩點。我們也比較少聽到其他曾經風光、後來消失的城市和家族，這是倖存者偏差。而且每次轉移的原因不同，不能直接套到未來。
        explain: 回頭看，轉移像一條筆直的路，但當時沒有人知道結局。只記得勝出的城市，會讓我們誤以為歷史本來就會這樣發展。本題只是談歷史，不構成投資建議。
        hints:
          - 回到安特衛普卡的「事後看很清楚的陷阱」。
          - 誰的故事比較容易被記住？
          - 每次轉移的原因，是同一種嗎？
        ref: finance-antwerp-bourse
  - type: recap
    model_answer: 金融中心會搬家，不是因為單一原因。商人和資金會去「最方便又最放心」的地方：布魯日靠近海，但河口淤積，又與統治者發生衝突；安特衛普靠香料、銀行家與君主借款興盛，卻受 1557 年違約、1576 年洗劫、1585 年陷落與河口封鎖打擊，人與資金北移到阿姆斯特丹；阿姆斯特丹因匯兌銀行與信用而興盛，後來受戰爭與占領打擊，銀行信用也被耗損；倫敦靠國債、新稅與銀行信用撐過長期戰爭，一戰後則因英國背債、美國成為債權國而讓出位置給紐約。舊中心通常不會消失，而且史家對轉捩點在哪裡常有不同看法。最後提醒：回頭看像一條必然的路，但那是後見之明，也只看到了勝出者（倖存者偏差）；歷史可以幫我們理解金融中心怎麼移動，卻不能用來預測市場，本單元不構成投資建議。

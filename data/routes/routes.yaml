  - id: sea-hellespont-grain
    name: 黑海—赫勒斯滂—雅典 糧食航線
    kind: sea
    start: -500
    end: -322
    precision: attested-ports
    note: 雅典的進口糧食有相當部分來自黑海北岸的博斯普魯斯王國（雅典是它最大的糧食買家，國王給雅典船隻港口特權）[s3]，船要經博斯普魯斯與赫勒斯滂（達達尼爾）兩個海峽才進得了愛琴海，所以這條航線是雅典對外政策的重點 [s1]；依賴程度學界有爭論 [s1]。經停港：狄奧多西亞（全年不結冰的穀物港）[s3] → 拜占庭 → 塞斯托斯 → 蘇尼翁岬 → 比雷埃夫斯。海上路徑為兩港之間不穿過陸地的最短海路 [s9]；年份範圍為估計。
    method: sea
    waypoints: ['854743', '520985', '501609', '580108', '580062']
    sources:
      - { id: s1, title: "Keen, Grain for Athens: the Hellespontine route (Electronic Antiquity 1.6, 1993)", url: 'https://scholar.lib.vt.edu/ejournals/ElAnt/V1N6/keen.html', accessed: 2026-10-24 }
      - { id: s3, title: Wikipedia「Bosporan Kingdom」, url: 'https://en.wikipedia.org/wiki/Bosporan_Kingdom', accessed: 2026-10-25 }
      - { id: s2, title: Pleiades 地名資料庫, url: 'https://pleiades.stoa.org/', accessed: 2026-10-24 }
      - { id: s9, title: "Natural Earth 1:10m 陸地（world-atlas，公有領域；用來算港間不穿過陸地的海路）", url: 'https://www.naturalearthdata.com/', accessed: 2026-10-25 }

  - id: sea-alexandria-rome
    name: 亞歷山卓—羅馬 運糧航線
    kind: sea
    start: -30
    end: 332
    precision: attested-ports
    note: 埃及糧食由政府雇用的私人大船（專為運尼羅河糧食到義大利而建 [s7]）運到義大利，再經奧斯提亞／波爾圖斯走台伯河進羅馬 [s1]。經停港依《使徒行傳》記載的兩艘亞歷山卓船：呂家的每拉港（帝國運糧船北線的固定停靠港，有大型糧倉遺址）[s4][s5] → 尼多斯 → 克里特島南岸的佳澳 [s5]；另一艘亞歷山卓船經敘拉古 → 利基翁 → 普特奧利 [s6]。保羅那艘船後來遇暴風漂到馬爾他，是意外，不畫入。港間為不穿過陸地的最短海路 [s9]，實際航跡隨季風改變。約 332 年亞歷山卓運糧船隊改送君士坦丁堡（也有看法認為約 308 年已不再送羅馬）[s3]。
    method: sea
    waypoints: ['727070', '639005', '599575', '589834', { lat: 37.07, lng: 15.29, name: Syracusae }, '452416', '432815']
    sources:
      - { id: s1, title: Wikipedia「Cura Annonae」, url: 'https://en.wikipedia.org/wiki/Cura_Annonae', accessed: 2026-10-24 }
      - { id: s3, title: ostia-antica.org「The fourth century」, url: 'https://ostia-antica.org/dict/topics/fourth-century/fourth-century-4.htm', accessed: 2026-10-24 }
      - { id: s4, title: "IVP New Testament Commentary：Journey to Fair Haven (Acts 27:1-8)", url: 'https://www.biblegateway.com/resources/ivp-nt/Prologue-Journey-Fair-Haven', accessed: 2026-10-25 }
      - { id: s5, title: "《使徒行傳》27:6（NIV）", url: 'https://www.biblegateway.com/verse/en/Acts%2027:6', accessed: 2026-10-25 }
      - { id: s6, title: "《使徒行傳》28:11-13（NIV）", url: 'https://christianity.com/bible/niv/acts/28-11-13', accessed: 2026-10-25 }
      - { id: s7, title: "Hirschfeld, The Ship of Saint Paul: Historical Background (Biblical Archaeologist, 1990)", url: 'https://digitalcommons.trinity.edu/class_faculty/60', accessed: 2026-10-25 }
      - { id: s2, title: Pleiades 地名資料庫, url: 'https://pleiades.stoa.org/', accessed: 2026-10-24 }
      - { id: s9, title: "Natural Earth 1:10m 陸地（world-atlas，公有領域；用來算港間不穿過陸地的海路）", url: 'https://www.naturalearthdata.com/', accessed: 2026-10-25 }

  - id: sea-baetica-rome
    name: 貝提卡—羅馬 橄欖油航線
    kind: sea
    start: -27
    end: 260
    precision: attested-ports
    note: 貝提卡（瓜達幾維河流域）的 Dressel 20 雙耳瓶裝橄欖油運到羅馬，空瓶堆成泰斯塔丘；約 260 年代停止堆放 [s1]。這裡畫的是 1–2 世紀最直接的「離岸島嶼航線」：出瓜達幾維河口、過直布羅陀海峽，經巴利阿里群島南方的卡布雷拉島（Cabrera、Ses Salines 沉船載有 Dressel 20）、科西嘉與薩丁尼亞之間的博尼法喬海峽（Lavezzi、Capo Testa 沉船群），到羅馬外港 [s3]。另有一條沿西班牙、高盧、義大利海岸走的「沿岸航線」，沉船同樣很多，地圖未畫 [s3]。港間為不穿過陸地的最短海路 [s9]。
    method: sea
    waypoints: [{ lat: 36.79, lng: -6.36, name: 瓜達幾維河口（Baetis 河口） }, { lat: 36.0, lng: -5.6, name: 直布羅陀海峽 }, { lat: 39.15, lng: 2.93, name: 卡布雷拉島（Cabrera，沉船所在） }, { lat: 41.33, lng: 9.3, name: 博尼法喬海峽（Lavezzi 沉船群） }, '423012']
    sources:

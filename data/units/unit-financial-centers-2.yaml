id: unit-financial-centers-2
title: 金融中心為什麼會搬家？（下）從阿姆斯特丹、倫敦到紐約
histories:
- 錢的歷史
- 歐洲史
- 美國史
- 世界通史
mystery: 阿姆斯特丹靠什麼接下安特衛普與熱那亞的位置？倫敦又為什麼會把「錢的首都」讓給紐約？今天的紐約，會不會是下一個被取代的？
teaser: 這一課接著追後半段的接力：阿姆斯特丹的匯兌銀行、倫敦靠國債撐過長期戰爭，一次世界大戰後紐約接手。最後想想：這些故事拿來類比今天，哪裡不成立？
goals:
- 能說出阿姆斯特丹、倫敦、紐約在金融中心接力中的位置
- 能比較「安特衛普→阿姆斯特丹」與「倫敦→紐約」兩次中心轉移的異同
- 能比較熱那亞銀行家與阿姆斯特丹匯兌銀行的運作方式有什麼不同
- 能指出用過去的金融中心類比今天時哪裡不成立，並分辨後見之明與倖存者偏差
minutes: 30
steps:
- type: hook
  text: |
    上一課我們追到熱那亞：安特衛普走下坡的同一段時間，熱那亞的銀行家家族從 1557 年起成為西班牙王室的主要放款人。
    這一課接著問三個問題：北邊的阿姆斯特丹靠什麼接下位置？倫敦為什麼能撐過拿破崙戰爭，卻在一次世界大戰後把位置讓給紐約？今天的我們，能不能拿這些故事來預測下一個金融中心？
    提醒：這一課接在上半場之後，後面的題目會用到香檳市集、安特衛普與熱那亞的內容；如果還沒讀，建議先回去做上半場。
- type: card
  id: finance-amsterdam-wisselbank
  depth: understand
  prompt: 回到北方：不少商人與工匠北遷，阿姆斯特丹是重要去向。注意「銀行貨幣」是什麼，以及 agio 代表大家願意多付一點錢換什麼。
- type: source
  card: finance-amsterdam-wisselbank
  idx: 0
  question: 亞當·斯密在 1776 年寫道，阿姆斯特丹銀行「宣稱，不把存放在它那裡的任何部分借出去」。讀這句話時最該注意什麼？
  options:
  - 這句話證明銀行從來沒有放過款
  - 這是銀行對外的宣稱；卡片另外記載銀行逐步放寬準備，並放款給東印度公司與市政府，所以要分清「宣稱」和「實際」
  - 斯密在這句話裡是在說銀行已經倒閉
  - 這句話說明銀行貨幣沒有任何溢價
  answer: 1
  explain: 斯密寫下的是銀行自己的說法。卡片整理的記載是，銀行的全額準備政策逐步放寬，並放款給東印度公司與市政府。同一家銀行，公開形象和後來揭露的運作有落差，讀史料要分清「宣稱」和「實際」。
  hints:
  - 先看句子的主詞和動詞：是誰「宣稱」？
  - 回到卡片「改變了什麼」，看銀行的準備政策後來怎麼變。
  - 這段文字是斯密寫下當時流傳的說法，還是銀行的帳本？
  ref: finance-amsterdam-wisselbank#F5
- type: card
  id: finance-amsterdam-decline
  depth: understand
  prompt: 阿姆斯特丹的位置後來也被取代。注意卡片區分了「資金所有權」和「市場所在地」：荷蘭的錢真的消失了嗎？
- type: card
  id: finance-london-rise
  depth: deep
  prompt: 讀完請看「常見誤解」和被質疑的羅斯柴爾德故事，想一想：倫敦是一夕取代阿姆斯特丹的嗎？
- type: card
  id: finance-new-york-overtakes-london
  depth: deep
  prompt: 最後一站是紐約。請特別看「史家怎麼吵」：美元什麼時候超過英鎊？也注意 1925 年英國回到戰前平價這個決定。
- type: compare
  cards:
  - war-fall-of-antwerp
  - finance-new-york-overtakes-london
  prompt: 比一比兩次中心轉移：安特衛普→阿姆斯特丹，與倫敦→紐約。
  rows:
  - aspect: 時間
    a: 1576 年 11 月西班牙之怒，到 1585 年 8 月投降
    b: 約 1914 年到 1931 年（卡片取的區間），傳統說法的終點是 1944 年布列敦森林體系
  - aspect: 主要衝擊
    a: 軍隊欠餉而洗劫、圍城，斯海爾德河被封鎖
    b: 英國戰時向美國借錢，美國由債務國變成債權國；英國 1925 年回到戰前平價
  - aspect: 人與錢往哪裡去
    a: 工匠、新教徒與商人北遷，阿姆斯特丹是重要去向
    b: 紐約的承兌市場成長，各國央行把美元也放進外匯準備（Eichengreen 與 Flandreau 的主張）
  - aspect: 舊中心之後
    a: 安特衛普沒有被摧毀，但失去首要地位，人口從約 10 萬降到約 4 萬
    b: 倫敦仍是重要的金融中心，英鎊在英鎊區仍有影響力
  - aspect: 學者爭論
    a: 洗劫與陷落是轉捩點，還是長期趨勢的一部分
    b: 美元何時超車：1920 年代中期，還是 1944 年
  question: 這兩次轉移最大的差別是什麼？又有什麼共同點？
  model_answer: 最大的差別是，安特衛普受到的是軍事打擊和河口封鎖，人和資本真的搬了家；倫敦輸給紐約，沒有城市被攻陷，主要是債務、儲備貨幣與金融制度的變化，倫敦並沒有消失。共同點是，兩次都不是一夕之間完成，原因都不只一個，史家對轉捩點在哪裡也都有不同看法：安特衛普有「陷落是轉捩點」對「長期趨勢」的爭論，紐約超車則有 1920 年代中期對 1944 年的爭論。
  hints:
  - 先看「主要衝擊」那一列：哪一邊有城市被圍攻？
  - 再看「舊中心之後」：兩個舊中心是消失了，還是仍然重要？
  - 回去看兩張卡的「史家怎麼吵」，找出兩邊各有什麼爭論。
- type: today
  card: finance-new-york-overtakes-london
  question: 今天會不會有「下一個金融中心」，像歷史上那樣取代紐約？用過去的例子來類比，哪裡不成立？
  model_answer: 先說不能類比的地方。一戰後的英鎊與美元處在金本位時代，沒有 IMF，也沒有今天的央行互換與浮動匯率；英國背後還有帝國與英鎊區。中世紀布魯日、安特衛普的商人搬家，是帶著貨物與人員轉往另一座城市，今天資金可以在全球電子市場快速移動，條件完全不同。所以不能因為歷史上接力過幾次，就推斷下一個一定會出現，或說它會在何時出現。能借來思考的是幾個結構：依賴單一通道的中心，遇到通道受阻又和外部權力衝突時，商人可能轉往條件更好的城市；金融中心靠的是信用與制度的信任；儲備貨幣的地位，不只取決於經濟規模，也取決於金融市場、制度與各國央行的信任。這些只是思考的線索，不是預測，本單元也不構成投資建議。
- type: check
  items:
  - kind: order
    q: 依時間先後排列這些事件：
    items:
    - 阿姆斯特丹匯兌銀行設立（1609 年）
    - 英格蘭銀行暫停以紙鈔兌換黃金（1797 年）
    - 英國放棄金本位（1931 年）
    explain: 阿姆斯特丹匯兌銀行在 17 世紀初（1609 年）；英格蘭銀行停止以紙鈔兌換黃金發生在拿破崙戰爭期間（1797 年）；英國放棄金本位在一戰之後（1931 年）。
    hints:
    - 先分出 17 世紀、18 世紀末與 20 世紀。
    - 1797 年停兌黃金發生在英法長期戰爭期間。
    - 1931 年是一次世界大戰之後的事。
    ref: finance-amsterdam-wisselbank
  - kind: choice
    q: 關於「紐約什麼時候取代倫敦」，哪個說法最符合卡片的內容？
    options:
    - 只有 1944 年布列敦森林體系這一種說法是對的
    - 只有 1920 年代中期這一種說法是對的
    - 兩種說法都有人主張，差別在於用什麼指標來衡量（例如各國外匯準備）
    - 1931 年英國放棄金本位的當天，美元就取代了英鎊
    answer: 2
    explain: 傳統說法以 1944 年布列敦森林體系為終點；Eichengreen 與 Flandreau 主張，以各國外匯準備衡量，美元約在 1920 年代中期就已追上英鎊。換手的時間點取決於怎麼統計，學界仍有不同意見。1931 年英國放棄金本位，並不代表英鎊消失或倫敦失去地位。
    hints:
    - 回到卡片「史家怎麼吵」，找「什麼時候換手？」這一段。
    - 「換手」要用什麼數字來量？
    - 1931 年之後，倫敦和英鎊還在嗎？
    ref: finance-new-york-overtakes-london
  - kind: short
    q: 用一兩句話比較：熱那亞銀行家替西班牙王室轉移資金的方式，和阿姆斯特丹匯兌銀行的運作，有什麼不同？
    model: 熱那亞銀行家是少數家族，與西班牙王室簽 asiento 貸款合約，先在法蘭德斯用匯票付軍餉，再向王室收回白銀，借款對象是君主。阿姆斯特丹匯兌銀行則是市政府設立的銀行，用帳簿上的銀行貨幣，讓商人以一致的標準記帳與轉帳、結算匯票。
    explain: 兩者都用帳面或匯票，避免搬運大批金屬，但前者是私人銀行家與君主之間的借貸合約，後者是城市政府設立、服務商人結算的公共機構。
    hints:
    - 先分別找出：誰是出錢的人，誰是用錢的人？
    - 熱那亞卡「怎麼運作」提到 asiento 與匯票；阿姆斯特丹卡 F1 提到銀行貨幣與市政府。
    - 一邊的對象是君主，一邊的對象是商人，這是最大的差別。
    ref: finance-age-of-genoese#F3
  - kind: short
    q: 用一兩句話說明：為什麼不能因為「香檳→布魯日→安特衛普→熱那亞→阿姆斯特丹→倫敦→紐約」排成一排，就說金融中心一定會照這個模式一個接一個？
    model: 這條接力線是我們事後只看贏家排出來的，有後見之明：當時的人看到的是全歐洲最熱鬧的市場，不知道哪次違約或戰事是轉捩點。我們也比較少聽到其他曾經風光、後來消失的城市和家族，這是倖存者偏差。而且熱那亞這一環講的是銀行家家族與市集結算的網路，時間（1557–1627 年）還和安特衛普末期、阿姆斯特丹興起互有重疊，每次轉移的原因也不同，不能直接套到未來。
    explain: 回頭看，轉移像一條筆直的路，但當時沒有人知道結局。只記得勝出的城市，會讓我們誤以為歷史本來就會這樣發展。本題只是談歷史，不構成投資建議。
    hints:
    - 回到安特衛普卡的「事後看很清楚的陷阱」。
    - 誰的故事比較容易被記住？
    - 熱那亞銀行家的時期（1557–1627 年）和前後兩個城市的時間，是接得整整齊齊，還是有重疊？
    ref: finance-antwerp-bourse
- type: recap
  model_answer: 阿姆斯特丹因匯兌銀行與信用而興盛，後來受戰爭與占領打擊，銀行信用也被耗損；倫敦靠國債、新稅與銀行信用撐過長期戰爭，一戰後則因英國背債、美國成為債權國而讓出位置給紐約。比較兩次轉移：安特衛普受到軍事打擊與河口封鎖，人與資金真的搬了家；倫敦輸給紐約沒有城市被攻陷，主要是債務、儲備貨幣與金融制度的變化，倫敦並沒有消失。把整串接力寫成「香檳→布魯日→安特衛普→熱那亞→阿姆斯特丹→倫敦→紐約」只是簡化：熱那亞銀行家的時期與前後城市互有重疊，舊中心通常不會消失，史家對轉捩點在哪裡也常有不同看法。最後提醒：回頭看像一條必然的路，但那是後見之明，也只看到了勝出者（倖存者偏差）；歷史可以幫我們理解金融中心怎麼移動，卻不能用來預測市場，本單元不構成投資建議。

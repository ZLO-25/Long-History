  subtitle: 誰占了哪幾州
  caveat: 以今日中國省級行政區（加上越南、北韓整國）的範圍近似東漢的州郡；一省跨兩個勢力時，用一條經線或緯線切開，所以邊界只是示意，不是當時確切的界線。北方草原、青藏高原與西域不在圖內；名義上服從、實際自治的勢力（例如遼東公孫氏、交州士燮）也標出來。

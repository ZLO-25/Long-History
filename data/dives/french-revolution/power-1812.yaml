title: 拿破崙帝國的頂點（1812 年 6 月，進攻俄羅斯之前）
note: 1812 年 6 月，法蘭西帝國直接統治今日比利時、荷蘭、萊茵河左岸、德國西北沿海、義大利西部與亞得里亞海東岸（伊利里亞諸省）；周圍是拿破崙的兄弟或部下當國王的附庸國（西班牙、義大利、那不勒斯、萊茵邦聯、華沙大公國），奧地利與普魯士被迫結盟、出兵跟著打俄國。和他作對的只剩英國、俄國、瑞典、葡萄牙（英軍支援），以及在西班牙打游擊的人民。同年 6 月 24 日大軍渡過涅曼河進攻俄國，冬天撤退時幾乎全軍覆沒。以今日國界近似，邊界只是示意。

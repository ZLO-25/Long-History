id: unit-mongol-empire
title: 蒙古帝國：草原部落怎麼連起歐亞？「蒙古和平」又是誰的和平？
histories: [世界通史, 中國史]
mystery: 原本分成許多部落、常常各自為政的草原民族，怎麼在半個世紀裡把從中國到波斯的土地放進同一套統治？被他們連起來的歐亞，那個後人稱為「蒙古和平」的時代，對誰才是和平？
teaser: 一場屠城，兩個數字差了將近一倍；一位教宗的使者親眼看到新大汗即位；一個威尼斯人說大汗的紙鈔沒人敢不收，到今天還有人懷疑他根本沒到過中國。
goals:
  - 能說出千戶制、功績升遷與驛站，怎麼把草原部落變成一支能長途作戰的軍隊
  - 能判讀兩段旅行者的一手史料，並問出作者是誰、為什麼去、能證明什麼與不能證明什麼
  - 能說明同一場屠城為什麼數字差很多，以及讀這類史料時為什麼要問「誰寫、替誰寫」
  - 能並列「四等人制」與「馬可波羅有沒有到中國」的不同學者看法，不把任何一邊當成唯一答案
  - 能分析「蒙古和平」對不同的人意味著什麼，並指出把它類比成今天的世界連線哪裡不成立
minutes: 50
level: 皆可
curriculum: ["歷 Hb-IV-1", "歷 Hb-IV-2", "歷 Ha-V-1", "歷 Mb-V-1"]
steps:
  - type: hook
    text: |
      想像一所學校，同學平常都只跟自己的小圈子走：每個圈子有自己的老大，彼此常吵架。
      突然有人宣布：全校重新打散編班，大家只聽校長的；誰表現好就升組長，不看你是哪個圈子的。
      13 世紀初的蒙古草原，差不多就是這樣被重新編過一次。之後半個世紀，這支軍隊從中國北方一直打到波斯，還在歐洲打敗波蘭、德意志與匈牙利的軍隊。
      但這個故事有兩種記憶：一種說它把歐亞連起來，一種說它是一連串的征服與屠城。而且，描寫破壞的史料多是被征服者或替蒙古人做事的人寫的，蒙古人自己的《蒙古秘史》又是為蒙古王室寫的。
    guess:
      q: 蒙古軍隊能在短時間內打贏那麼多地方，你覺得最關鍵的是什麼？（沒有對錯，先猜猜看）
      options:
        - 馬騎得好、箭射得準，個人武藝比別人強
        - 把部落打散、重新編組，又依功績升遷的軍隊組織
        - 比對手更先進的武器
        - 對手剛好互相內鬥，沒有力量抵抗
      reveal: 卡片裡沒有單一答案。大英百科強調十進位的軍隊組織與不需要飼料的蒙古馬；世界史百科全書強調快速機動（每個騎兵最多有 16 匹備用馬）、驛站傳遞消息、情報，還有向敵人與當地顧問學攻城。不同作者的重點不同，並不互相排斥。
  - type: card
    id: event-mongol-empire-rise
    prompt: 先看草原本來是什麼樣子，再看成吉思汗做了什麼。注意：「部落」為什麼讓草原常常分裂？他怎麼處理新加入的部落成員？
    depth: understand
    focus: [C1, C4]
    quick:
      - q: 草原原本為什麼常常分裂？成吉思汗用什麼辦法改變？
        a: 草原社會的基本單位是部落，人們不容易效忠部落以外的對象，所以常常分裂。成吉思汗把人編成十人、百人、千人、萬人的層層單位，有部落加入時把成員分散到各單位，讓他們效忠他本人，而不是原來的部落首領。
      - q: 蒙古軍隊裡，指揮官怎麼升遷？違令怎麼處罰？
        a: 指揮官依功績升遷，而不是依氏族輩分。違令最常見的處罰是鞭打，逃跑、擅自撤退、站崗時睡著可處死。
  - type: card
    id: event-mongol-empire-rise
    prompt: 這一步讀的是「屠城死了多少人」。不用記數字，要想的是：這些數字是誰寫的、為誰寫的？
    depth: deep
    focus: [debate, C5, misc]
    quick:
      - q: 同一座城梅爾夫，卡片列出哪兩種數字？
        a: 同時代的伊本·阿西爾估計死亡 70 萬人；稍晚的志費尼寫的是一位教士數了十三天，得出 130 萬。兩個數字差了將近一倍，卡片不替任何一個數字背書。
      - q: 為什麼讀這些史料時，要問「誰寫的、為誰寫的」？
        a: 描寫破壞的史料多是被征服者或替蒙古人做事的人所寫（例如志費尼本人替蒙古人做事，後來任巴格達總督），描寫蒙古內部的《蒙古秘史》又是為蒙古王室寫的。常見的說法是這些數字大幅誇大，但這不表示沒有屠殺。
  - type: source
    card: event-mongol-empire-rise
    idx: 0
    question: 這句話記的是 1246 年貴由即位的場面。依這句話，當時是怎麼進行的？
    options:
      - 貴由在戰場上打敗對手之後，自己坐上皇帝的位子
      - 首領們把貴由扶上皇帝的座位，並在他面前跪下
      - 成吉思汗生前在鄂嫩河邊，就把汗位直接交給了貴由
      - 教宗的使者替貴由戴上王冠，宣布他即位
    answer: 1
    why_wrong:
      - 引文裡沒有戰場，寫的是大集會上的即位場面。
      - null
      - 成吉思汗 1227 年就去世了，貴由是 1246 年在大集會上才被扶上汗位。
      - 引文裡是首領們向貴由下跪，沒有說教宗的使者替他加冕；使者只是在場看到。
    explain: 「他們回到帳裡，把貴由扶上皇帝的座位，首領們在他面前跪下。」這是蒙古大集會（忽里勒台）推舉大汗的場面，由柏朗嘉賓親眼看到。他還說貴由即位時到場的使者有四千多人。
    hints:
      - 先找動詞：誰把貴由「扶上」座位？
      - 再看最後半句：首領們做了什麼動作？
      - 這個場面在蒙古的大集會上進行，推舉大汗正是大集會的功能之一。
    ref: event-mongol-empire-rise#C4
    critique:
      question: 柏朗嘉賓是教宗派往蒙古的使者。他為什麼去？這段話能證明什麼、不能證明什麼？
      options:
        - 他是外國使者，親眼所見可證明有這個儀式；但只是一位歐洲人的一句話，蒙古人怎麼看要靠別的史料
        - 他是蒙古人的敵人，所以他親眼看到、寫下來的每一件事都一定是假的，完全不能參考
        - 他的書是一手史料，也就是當時的人寫的，所以書裡每一件事都已經等於確定的事實
        - 他是蒙古官員，這是替貴由寫的官方紀錄，所以內容可靠，不必再和別的史料核對
      answer: 0
      explain: 柏朗嘉賓是方濟會的傳教士，卡片引哥倫比亞大學的教學網站說，他和魯不魯乞想勸阻蒙古人進攻並使其改信，都沒有成功，但帶回了歐洲最早的可靠蒙古見聞。他能證明自己看到了什麼，卻是外來者的視角；一手史料也不等於每個字都正確，要和其他史料對照。
      why_wrong:
        - null
        - 卡片沒有說他是敵人；他的記錄還被視為歐洲最早的可靠蒙古見聞。
        - 一手史料是「當時的人寫的」，不保證每一句都正確，仍要核對。
        - 他是教宗派來的外國使者，不是蒙古官員；他的書不是蒙古官方紀錄。
  - type: card
    id: event-yuan-dynasty
    prompt: 忽必烈把蒙古政權帶進中國，建了元朝。這一步請讀「史家怎麼吵」：課本常寫的「四等人制」，學者怎麼說？紙鈔又為什麼前期被看成成功、後期被看成失敗？
    depth: deep
    focus: [debate]
    quick:
      - q: 教科書常見的「四等人制」，卡片裡洪麗珠引劉曉、舩田善之怎麼說？
        a: 洪麗珠引劉曉：「人分四等並非法有明文，即不是『制』」，所以「四等人」算不算一種制度要重新檢討。她也轉述舩田善之：色目人做官不一定比漢人、南人高，用人的本質是「參用」，不是「歧視」。洪麗珠自己則說，在做官與法律地位上，「四等人」仍是比較能突顯特性的說法。卡片註明劉曉、舩田善之的原文本站沒有讀到。
      - q: 元朝紙鈔前期和後期為什麼評價不同？
        a: 起初的白銀本位整合了貨幣市場；長期的財政壓力讓統治者放寬標準，改成不能兌換金屬的信用貨幣。軍事壓力（尤其內戰）造成多發紙鈔，1350 年的至正交鈔沒有準備金，很多人不肯收。差別在有沒有守住準備與發行量。
  - type: source
    card: event-yuan-dynasty
    idx: 0
    question: 這段是《馬可波羅遊記》寫元朝紙鈔的一句話。依這句話，大汗對紙鈔有什麼規定？
    options:
      - 紙鈔可以自由選擇收或不收，不收也沒關係
      - 拒收紙鈔的人要付 3% 的費用
      - 沒有人敢拒收，違者處死
      - 只有商人必須收，一般百姓可以不收
    answer: 2
    why_wrong:
      - 引文說的是沒有人敢拒收，不是自由選擇。
      - 3% 是舊鈔換新鈔時付的費用（卡片引馬可波羅），不是拒收的處罰。
      - null
      - 引文說「無論自認多麼重要」都不敢拒收，沒有分商人或百姓。
    explain: 「無論自認多麼重要，沒有人敢拒收，違者處死。」馬可波羅這樣描寫紙鈔的威力。但卡片提醒：他說拒收者處死，本站沒有找到中國史料佐證，只能當作他的說法。
    hints:
      - 先看句子的主詞：「沒有人」怎麼了？
      - 「無論自認多麼重要」是不是在說連身分高的人也一樣？
      - 最後半句是拒收的下場。
    ref: event-yuan-dynasty#C4
    critique:
      question: 馬可波羅有沒有到過中國，學者有爭論。讀他寫的這句話，怎麼做最穩妥？
      options:
        - 因為 Frances Wood 證明他的書是偽造的，所以這句話一點參考價值也沒有，可以直接忽略
        - 因為 Vogel 證明他到過中國，所以他書裡寫的每一條規定都等於元朝真正的法令
        - 因為元朝確實發行了紙鈔，所以「拒收處死」一定也是真的
        - 這是作者的說法，卡片沒找到中國史料佐證，要證明得靠別的史料
      answer: 3
      explain: 卡片寫的是 Wood 懷疑、Vogel 反駁，兩邊並列，沒有誰「證明」了什麼。紙鈔存在是一回事，「拒收處死」是不是真的規定是另一回事。讀遊記要把「他看到的」「他聽說的」「他說的規定」分開，並找其他史料核對。
      why_wrong:
        - Wood 提出質疑，不是證明偽造；卡片也說兩邊論點並列、不下結論。
        - Vogel 反駁了 Wood，但卡片沒有說書裡每一條都等於元朝法令。
        - 紙鈔存在，不等於這條處罰規定存在；卡片說這點沒有找到中國史料佐證。
        - null
  - type: card
    id: event-pax-mongolica
    prompt: 驛站、旅行者、「蒙古和平」。邊讀邊想：這個和平，是誰的和平？也注意驛站的間距，各來源寫得不一樣。馬可波羅有沒有到過中國的完整爭論，在「想看更多」的「史家怎麼吵」裡，有時間再讀。
    depth: deep
    focus: [C4, C5, terms, misc]
    quick:
      - q: 驛站站與站之間的距離，卡片怎麼寫？可以當成唯一答案嗎？
        a: 不可以。維基百科說約一天馬程（25–30 英里），哥倫比亞大學的教學網站說主要商路上大約每 20 英里一站，各來源寫法不同。
      - q: 「蒙古和平」這個詞有什麼爭議？
        a: 它是後人仿「羅馬和平」造的詞，指蒙古統治下歐亞往來變得比較容易。但它不等於沒有戰爭：指的是征服之後的相對穩定，而且常有內戰與政變。也不是人人受益：有城市被蒙古軍摧毀、被迫改變貿易流向；連使用驛站的旅行者魯不魯乞，也得鞭打累壞的馬、忍受飢渴寒冷。
  - type: chain
    prompt: 把下列事件依照「因 → 果」排成一條鏈（最上面是最早的原因）。
    items:
      - 草原部落被編成十進位的層層單位，新加入的部落成員被打散，效忠大汗
      - 蒙古軍征服草原、中亞、波斯與中國北方，把它們放進同一套統治
      - 窩闊台設立驛站，站上備有補給和新馬
      - 傳教士、使者、商人比以前更容易長途旅行，歐洲人與中國、波斯之間出現更多書寫記錄
      - 馬可波羅等人的書，成為歐洲人認識東亞的重要來源
    explain: 十進位編組是蒙古軍隊的骨架（大英百科談蒙古為什麼打得贏時強調這一點，其他作者另有別的重點）；征服把各地放進同一套統治，窩闊台時期又設立驛站，之後長途旅行才比較容易；旅行者留下的記錄，後來成為歐洲人認識東亞的重要來源。要記得兩件事：驛站本來也是支援軍隊信使的設施，不是只為旅行者而設；記錄是旅行者寫的，內容有沒有誇大或轉述，要靠其他史料核對。
    hints:
      - 最早的是軍隊怎麼被組織起來。
      - 卡片的寫法是：征服先把各地放進同一套統治，窩闊台時期又設立驛站。
      - 有了驛站，旅行者才比較容易出發；他們留下記錄在最後。
    ref: event-pax-mongolica#C2
    followup:
      question: 排在後面的事不一定是前面的結果。下面哪一項，卡片只寫成「有學者主張、仍有爭議」，不能當成確定的因果？
      options:
        - 蒙古征服之後，窩闊台設立驛站
        - 驛站設立之後，旅行者比較容易長途旅行
        - 鼠疫沿著蒙古的商路傳到西方
        - 旅行者的記錄成為歐洲人認識東亞的來源
      answer: 2
      explain: 卡片寫的是：有學者主張蒙古軍與商路幫了鼠疫西傳，但黑死病的發源地與路徑仍有爭議。而「征服把各地納入同一套統治，窩闊台時期又設立驛站，之後長途旅行才比較容易」「馬可波羅的書成為歐洲人認識東亞的重要來源」，卡片都是直接寫出來的。連線讓人和貨流動，不代表疾病的路徑已經確定。
      why_wrong:
        - 卡片把「征服之後、窩闊台時期又設立驛站」寫成長途旅行變容易的原因，沒有標成有爭議。
        - 卡片直接寫驛站設立之後，長途旅行才變得比較容易，沒有標成有爭議。
        - null
        - 卡片寫馬可波羅的書成為歐洲人認識東亞的重要來源。
  - type: compare
    cards: [event-mongol-empire-rise, event-pax-mongolica]
    prompt: 同一個帝國，兩張卡看到的是不同的面。比一比：誰在寫、誰得到好處、誰付出代價。
    rows:
      - { aspect: 史料是誰寫的, a: 描寫破壞的多是被征服者或替蒙古人做事的人（志費尼後來任巴格達總督；伊本·阿西爾是被攻擊一方的同時代編年史家）；蒙古內部的《蒙古秘史》是為蒙古王室寫的, b: 多是旅行者的見聞：柏朗嘉賓與魯不魯乞是方濟會傳教士，馬可波羅出身威尼斯商人家庭；內容有沒有誇大或轉述，要靠其他史料核對 }
      - { aspect: 誰得到好處, a: 蒙古貴族與跟隨他們的將領, b: 能使用驛站的信使、官員、使者與商人 }
      - { aspect: 誰付出代價, a: 被攻陷的城市與居民；巴爾赫即使馬上投降，人民仍被殺, b: 被蒙古軍摧毀、被迫改變貿易流向的城市；旅途中又餓又渴、又冷又累的人 }
      - { aspect: 哪些說法不能當成唯一答案, a: 梅爾夫的死亡人數有 70 萬和 130 萬兩種；常見的說法是大幅誇大，但不表示沒有屠殺, b: 驛站的間距有 25–30 英里和約 20 英里兩種；「蒙古和平」這個詞本身有爭議 }
    question: 「蒙古和平」對誰是和平？對誰不是？請至少說出兩個不同的群體。
    model_answer: 對能使用驛站的信使、官員、使者和商人來說，路比以前好走，歐洲人與中國、波斯之間也出現更多往來和記錄。但這個「和平」是「巨大而暴力的征服」之後的結果：被蒙古軍攻陷的城市和居民付出了代價（巴爾赫即使馬上投降，人民仍被殺），被摧毀的次要路線城市也被迫改變貿易流向；連旅行者魯不魯乞也要鞭打累壞的馬、忍受飢渴寒冷。統治集團內部還有內戰與政變。另外要注意，我們讀到的史料多是被征服者、替蒙古人做事的人，或外來旅行者寫的，所以「和平」這個說法要問是誰的視角。這題沒有標準答案。
    points:
      - 受益的是能使用驛站的信使、官員、使者與商人，往來與記錄變多
      - 付出代價的是被攻陷的城市與居民、被迫改變貿易流向的城市
      - 「和平」是征服之後的結果，統治集團內部也有內戰與政變
      - 史料多出自被征服者、替蒙古人做事的人或外來旅行者，要問是誰的視角
    hints:
      - 先比「誰得到好處」與「誰付出代價」兩列。
      - 再想：這個詞是什麼時候、被誰造出來的？（看「蒙古和平」那張卡的 C1）
      - 最後一列提醒我們，不是每個數字或詞都有單一答案。

id: unit-cold-war-2
title: 冷戰（下）：太空、阿富汗與一個帝國的瓦解
histories: [歐洲史, 美國史]
mystery: 1957 年，蘇聯第一個把人造衛星送上太空；1961 年，又第一個把人送上太空。可是三十年後，這個擁有核武的超級強國沒有被外國打敗，卻在 1991 年由自己的加盟共和國宣布「不再存在」。一個帝國，是怎麼從裡面散掉的？
teaser: 一顆 83.6 公斤的金屬球、一趟秘密飛往北京的行程、一場陷在山谷裡的戰爭、一場很快失敗的政變。
goals:
  - 能說明太空競賽為什麼同時是科學比賽，也是飛彈和面子的比賽
  - 能說出尼克森訪華到美中建交的幾個步驟，以及《臺灣關係法》怎麼來的
  - 能說出 1986 年戈巴契夫在阿富汗問題上面對的選項，以及他最後怎麼決定
  - 能判讀戈巴契夫辭職演說的一段原文，並指出說話的人站在哪個立場
  - 能比較雷根和戈巴契夫，說明「冷戰怎麼結束」為什麼有不同的解釋
  - 能說出 1989 到 1991 年東歐劇變與蘇聯解體的主要經過
minutes: 45
steps:
  - type: hook
    text: |
      上一課停在 1962 年：甘迺迪和赫魯雪夫在古巴危機裡各退一步，美蘇開始用熱線和條約管理核武。但比賽沒有停，只是換了場地。
      想像兩家公司比了三十年，一家先拿下好幾個「第一」，還有上萬名員工；最後它卻不是被對手併購，而是自己的分公司一家一家宣布獨立，總公司就這樣解散了。
      這一課我們先跟著火箭上太空、跟著季辛吉秘密飛到北京，再走進 1986 年蘇共中央的一場政治局會議，替戈巴契夫做一次決定。
  - type: card
    id: tech-space-race
    depth: understand
    prompt: 先看比賽的新場地。為什麼一顆 83.6 公斤的史普尼克，會讓美國人那麼害怕？前半段誰拿下比較多「第一」？蘇聯的「太空鐵幕」是什麼意思？
  - type: card
    id: event-nixon-china
    depth: understand
    prompt: 冷戰不只是美蘇兩邊。美國為什麼要接近中國？注意 1971、1972、1979 年分別發生什麼事；「認知」和「承認」差在哪裡？從臺灣看，這七年發生了什麼？
  - type: decision
    role: 你是 1986 年 11 月 13 日出席蘇共中央政治局會議的戈巴契夫
    situation: |
      你在 1985 年 3 月當上總書記，蘇聯經濟長期停滯，和美國的軍備競賽、對外衝突又是沉重的負擔。美國總統雷根稱蘇聯為「邪惡帝國」。
      1979 年 12 月底，蘇聯大軍開進阿富汗，殺死不聽話的領導人阿明，扶植卡爾邁勒。原本以為很快就能收場，但各地的反抗者「聖戰士」得到美國經巴基斯坦秘密送來的援助，沙烏地阿拉伯、中國等國也出錢出力。蘇軍最多時約 11 萬 5 千人，能占住喀布爾等城市，卻控制不了山區：潘傑希爾谷地在 1980 到 1985 年間被攻打了九次，政府軍始終守不住。
      出兵之後，聯合國大會以 104 票對 18 票通過決議表達抗議，美國實施穀物禁運、帶頭抵制莫斯科奧運，剛簽好的限武條約 SALT II 也沒有被美國參議院批准。到這次會議時，你自己也說：「我們已經在阿富汗打了六年。」
      先別急著看選項：如果你是戈巴契夫，只知道這些，你會怎麼做？
    options:
      - label: 增兵、加大攻勢，打到贏為止
        result: 推測：蘇軍已經有十萬以上，山區卻始終打不下來；反抗軍的後方在巴基斯坦，外國援助也會繼續送進來。增兵等於在經濟停滯時再加一筆大開支，也會讓和美國的關係更緊張。歷史沒有走這條路，所以後果只能推測。
      - label: 維持現有兵力，繼續打下去
        result: 推測：戈巴契夫自己在這次會議上估計，如果做法不改，還會再打二、三十年。維持現狀也許守得住城市，但傷亡和開支會一年一年累積。歷史沒有走這條路，所以後果只能推測。
      - label: 訂下期限，分兩年把部隊撤出來
        result: 這是戈巴契夫在會議上主張的做法。他說「我們需要盡快結束這個過程」，提議 1987、1988 年各撤出一半部隊；1987 年年中他宣布將全面撤軍。至於撤軍之後阿富汗怎麼了，等一下的阿富汗卡會告訴你。
    actual: 戈巴契夫在 1986 年 11 月 13 日的政治局會議上說「如果做法不改，我們還會再打二、三十年」，主張 1987、1988 年各撤出一半部隊。1989 年 2 月 15 日，最後一支蘇軍縱隊越過邊界回到國內。但撤軍沒有帶來和平：阿富汗接著陷入內戰，估計有 100 萬到 300 萬阿富汗人在這場戰爭中死亡。
    ref: war-soviet-afghan#A7
    note: 沒有發生的選項，後果都是推測，標示清楚。阿富汗卡的故事、史料與觀點都寫到這次會議和撤軍，雷根卡的「史家怎麼吵」也提到援助游擊隊「有助於結束蘇聯占領」，所以兩張卡都放在決策之後；teaser 原本想寫「打了將近十年的戰爭」，會預告撤軍的時間，改成「陷在山谷裡的戰爭」。
  - type: card
    id: war-soviet-afghan
    depth: understand
    prompt: 對照你的選擇，看看這場戰爭從頭到尾怎麼走。蘇聯是有計畫地往南擴張，還是一步步陷進去？美國是不是故意把蘇聯拉進「越戰泥沼」？為什麼說蘇軍撤走並沒有帶來和平？
  - type: card
    id: person-reagan
    depth: understand
    prompt: 美國這邊的對手。雷根前半任和後半任，對蘇聯的做法有什麼不同？「星戰計畫」是什麼？他一句「推倒這道牆」，真的就讓圍牆倒了嗎？
  - type: card
    id: person-gorbachev
    depth: understand
    prompt: 認識做決定的人。他想「修好」蘇聯，靠的是哪幾個政策？注意：他不是從來不動武，1990、1991 年在巴庫和維爾紐斯發生了什麼？西方和蘇聯國內，怎麼看他得諾貝爾和平獎？
  - type: source
    card: person-gorbachev
    idx: 0
    question: 戈巴契夫在 1991 年 12 月 25 日的辭職演說裡，怎麼說冷戰的結束？
    options:
      - 冷戰是因為美國逼蘇聯投降才結束的
      - 他辭去總統職務，並說冷戰已經結束、軍備競賽已經停止，把這當成他任內推動的成果
      - 冷戰還沒結束，蘇聯會繼續和美國競爭
      - 他辭職是因為在選舉中輸給雷根
    answer: 1
    explain: 「I cease my activities in the post of the U.S.S.R. president」是宣布辭去蘇聯總統；「The Cold War has ended, the arms race has stopped」是說冷戰結束、軍備競賽停止。戈巴契夫卡的「史家怎麼吵」指出，他把這些當成自己推動的成果。讀的時候要想到：這是當事人在下台那天替自己說的話，雷根卡就記下另一種看法，認為雷根的外交政策「促成了冷戰的結束」。兩種說法孰輕孰重，卡片寫明目前來源不足，不能只聽一方。
    hints:
      - 先找「cease」：他停止做什麼？
      - 後半句的兩個「has ended」「has stopped」說的是什麼結束了？
      - 想想看：誰在說這段話？他會怎麼替自己的任期下結論？
    ref: person-gorbachev#P4
  - type: card
    id: event-gorbachev-reform
    depth: understand
    prompt: 把改革的步驟排出來：國營企業法、合作社法、1989 年的選舉。為什麼改革反而讓商品短缺更嚴重？「改革害死了蘇聯」和「蘇聯早就病入膏肓」，兩種看法各看重什麼？
  - type: card
    id: event-end-of-cold-war
    depth: understand
    prompt: 1989 年像骨牌一樣。依序找出波蘭、匈牙利、波羅的海人鏈、柏林圍牆、馬爾他會談。哪一個國家是唯一用暴力推翻共黨政權的？冷戰到底是哪一天結束的，史家有幾種說法？
  - type: card
    id: event-soviet-collapse-1991
    depth: understand
    prompt: 最後四個月。1991 年 8 月的政變想做什麼，結果反而造成什麼？12 月 8 日、21 日、25 日、26 日分別發生什麼？為什麼說蘇聯「不是被外國打垮的」？
  - type: chain
    prompt: 把蘇聯走向解體的過程，依照「因 → 果」排成一條鏈（最上面是最早的原因）。
    items:
      - 蘇聯經濟長期停滯，軍備競賽與對外戰爭的開支沉重
      - 1985 年戈巴契夫上台，推動改革重建與開放政策，也放鬆對東歐的控制
      - 1989 年蘇聯舉行第一次全國性競爭選舉，東歐各國共產政權接連下台，柏林圍牆開放
      - 1990 年 3 月立陶宛率先宣布獨立，各加盟共和國紛紛要求自主
      - 1991 年 8 月強硬派發動政變想阻止聯盟鬆動，很快失敗，中央權威崩潰
      - 1991 年 12 月俄羅斯、烏克蘭、白俄羅斯宣布蘇聯不再存在，戈巴契夫辭職，蘇聯解散
    explain: 經濟停滯加上軍備競賽和對外戰爭的負擔，讓新上台的戈巴契夫決定改革；他放寬言論和選舉，也不再緊抓東歐，1989 年東歐的共產政權像骨牌一樣倒下。被放出來的要求回到蘇聯內部，立陶宛等共和國要求獨立。強硬派想用政變把局面拉回來，政變失敗反而讓中央權威崩潰，最後由三個加盟共和國宣布蘇聯不再存在。每一步都是上一步打開、卻控制不住的局面推出來的。
    hints:
      - 最早的原因是經濟和開支的問題，不是某一個人。
      - 東歐先劇變，蘇聯自己的加盟共和國才接著要求獨立。
      - 政變是想「救」聯盟，所以它在各共和國要求獨立之後。
    ref: event-end-of-cold-war#C2
  - type: compare
    cards: [person-reagan, person-gorbachev]
    prompt: 比一比冷戰最後十年的兩位對手：雷根和戈巴契夫。
    rows:
      - aspect: 上台
        a: 1981 年就任美國總統
        b: 1985 年 3 月成為蘇共總書記
      - aspect: 一開始的路線
        a: 放棄「緩和」，稱蘇聯為「邪惡帝國」，提出星戰計畫，經巴基斯坦秘密援助阿富汗游擊隊
        b: 推動改革重建與開放政策，外交上提出淡化軍事對抗的「新思維」
      - aspect: 1987 年
        a: 在布蘭登堡門喊話「戈巴契夫先生，推倒這道牆！」，同時和蘇聯談判
        b: 和雷根談判，簽下《中程核武條約》
      - aspect: 怎麼說冷戰的結束
        a: 英文維基寫道，他的外交政策「促成了冷戰的結束」
        b: 辭職演說把「冷戰結束了，軍備競賽停止了」說成自己推動的成果
      - aspect: 爭議與代價
        a: 國債增為三倍、伊朗門事件、對愛滋疫情反應遲緩
        b: 商品短缺越來越嚴重；巴庫、維爾紐斯動武；當時民調 90% 的蘇聯公民不贊成他得諾貝爾獎
    question: 冷戰的結束，比較像是雷根「逼」出來的，還是戈巴契夫「選」出來的？請各舉一個支持的理由，再說說你的看法。
    model_answer: 說是雷根「逼」出來的，理由是他重新加強軍備、提出星戰計畫、援助阿富汗游擊隊，給蘇聯很大的壓力，英文維基也說他的外交政策促成了冷戰結束。說是戈巴契夫「選」出來的，理由是他自己決定談判、從阿富汗撤軍、放鬆對東歐的控制，1991 年也選擇交出權力、沒有動武維持聯盟。但雷根卡提醒：強硬能不能換到條約，要看對方內部有沒有改變；兩張卡也都寫明兩種說法孰輕孰重，目前來源不足。還有第三種看法：長期經濟停滯和各共和國的民族主義才是根本，柏林圍牆打開的直接導火線，甚至是東德官員在記者會上的一句口誤。這題沒有標準答案，重點是說出每種看法看重的是什麼。
    hints:
      - 先看「一開始的路線」：兩人上台時各自做了什麼？
      - 再看「怎麼說冷戰的結束」：這兩種說法各是誰說的？
      - 想想看：如果蘇聯上台的不是戈巴契夫，雷根的強硬還會換到條約嗎？（雷根卡「不可類比的差異」有一句話可以參考。）
  - type: today
    card: event-nixon-china
    question: 有人說「1970 年代美國為了對付蘇聯，可以跟北京建交、跟臺北斷交，所以今天的美臺關係一定也會照同樣的劇本走」。這個類比哪裡不成立？又有哪些地方值得借來想？
    model_answer: 先說不能類比的地方：1970 年代的三角格局，是以蘇聯為美中共同的對手，而蘇聯在 1991 年已經解散，今天不是那個三角；1971 年以前美中沒有正式往來，今天兩國關係的複雜度不能直接回推；臺灣今天的政治制度與國際處境也和 1970 年代不同。這張卡只寫當年決策的框架，不評估今天各方的政策選項，所以「一定照同樣劇本走」說不出根據。可以借來想的是三個結構：第一，「與對手的對手靠近」的三角關係；第二，「各說各話又不撕破臉」的文字安排，例如《上海公報》裡美方用的是「認知」而不是「承認」；第三，沒有外交關係卻維持實質往來的非官方機制，1979 年的《臺灣關係法》至今仍是美國處理臺灣問題的重要法律基礎。
  - type: check
    items:
      - kind: choice
        q: 1972 年尼克森訪問北京時，美國和中華人民共和國的關係是什麼？
        options:
          - 當場正式建交，同時和中華民國斷交
          - 發表《上海公報》、改善關係，但還沒有建交；正式建交要到 1979 年 1 月 1 日
          - 雙方簽下共同防禦條約
          - 美國宣布承認臺灣是中國的一部分
        answer: 1
        explain: 1972 年 2 月尼克森訪問北京、杭州和上海，發表《上海公報》，雙方各自陳述立場；1973 年互設聯絡處，1979 年 1 月 1 日才正式建交。公報裡美方是「認知」兩岸的中國人都主張只有一個中國，並不是「承認臺灣是中國的一部分」。
        hints:
          - 卡片的「常見誤解」第一條就在講這件事。
          - 從 1972 到 1979，中間隔了幾年？
        ref: event-nixon-china#C2
      - kind: order
        q: 依時間先後排列：
        items:
          - 蘇聯發射史普尼克 1 號
          - 阿波羅 11 號登月
          - 尼克森訪問北京
          - 蘇聯大軍開進阿富汗
          - 戈巴契夫成為蘇共總書記
          - 最後一支蘇軍撤出阿富汗
          - 蘇聯正式解散
        explain: 1957 年 10 月史普尼克 1 號 → 1969 年 7 月阿波羅 11 號 → 1972 年 2 月尼克森訪華 → 1979 年 12 月蘇聯出兵阿富汗 → 1985 年 3 月戈巴契夫上台 → 1989 年 2 月 15 日最後一支蘇軍撤出 → 1991 年 12 月 26 日蘇聯解散。
        hints:
          - 太空競賽的兩件事最早，都在 1970 年以前。
          - 戈巴契夫上台時，阿富汗戰爭已經打了好幾年。
        ref: war-soviet-afghan#A7
      - kind: short
        q: 用一兩句話說明：為什麼說蘇聯「不是被外國打垮的」？
        model: 因為蘇聯沒有在戰爭中戰敗，而是 1991 年 8 月強硬派政變失敗、中央權威崩潰後，各加盟共和國接連宣布獨立；12 月 8 日由俄羅斯、烏克蘭、白俄羅斯三國領袖宣布蘇聯不再存在，12 月 26 日蘇聯正式解散。
        explain: 軍備競賽確實是蘇聯的沉重負擔，但最後的轉折發生在蘇聯內部：政變失敗，加上各共和國自己宣布退出。
        hints:
          - 回去看蘇聯解體卡：宣布蘇聯不再存在的是誰？
          - 1991 年 8 月發生了什麼事，讓中央再也管不住各共和國？
        ref: event-soviet-collapse-1991#C2
  - type: recap
    model_answer: 古巴危機之後，美蘇的比賽換到太空：蘇聯先拿下第一顆衛星、第一位太空人，美國 1969 年才靠阿波羅 11 號登月扳回；能送衛星的火箭也能送核彈，所以這場比賽一半是科學、一半是飛彈和面子。1970 年代，美國利用中蘇不和接近北京，1979 年和北京建交、和臺北斷交，再用《臺灣關係法》維持非官方往來。同一年底蘇聯出兵阿富汗，以為很快收場，卻陷在山區裡；1986 年戈巴契夫在政治局說再不改變就要再打二、三十年，主張分兩年撤軍，1989 年 2 月最後一支蘇軍撤出。戈巴契夫想用改革重建和開放政策修好蘇聯，卻控制不住被放出來的要求：1989 年東歐劇變、柏林圍牆開放，1990 年立陶宛宣布獨立，1991 年 8 月政變失敗，12 月蘇聯解散。要記得兩個提醒：第一，「雷根逼出來」「戈巴契夫選出來」「結構早就撐不住」是並列的解釋，卡片寫明目前沒有定論；第二，冷戰結束對東歐和波羅的海國家是獨立和民主選舉，對 1990 年代的很多俄羅斯人卻是經濟崩跌、壽命下降，對阿富汗人則是接著來的內戰。這是一種參考說法，不是標準答案。

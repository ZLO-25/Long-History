# 大名勢力示意圖：1590 年 8 月（小田原征伐、奧州仕置之後）
# 畫法同 power-1582.yaml。這一年秀吉完成統一：北條滅亡、家康移封關東、東北大名臣服。
# 2026-11-03 查核：抽查 24 個勢力的縣對應大致無誤（依日維小田原征伐／奧州仕置）；補上 1590 年獲秀吉承認為獨立大名的津輕為信（青森縣西半，以東經 141.0 度與南部切開），並把 1588 年起屬上杉（本庄繁長）的出羽庄內從最上切給上杉（山形縣以東經 140.1 度切開）。其餘保留。
year: 1590
title: 秀吉統一日本（1590 年 8 月）
note: 以令制國為單位、用今日縣界近似的示意圖。秀吉的直轄領與一門・譜代大名合畫成一色；外樣大名各自一色。家康剛從東海移封關東（8 月 1 日江戶入城），伊達政宗的宮城領地要到 1591 年葛西大崎一揆後才確定，圖上先標示。

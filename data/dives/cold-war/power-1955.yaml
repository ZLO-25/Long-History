year: 1955
basemap: world_countries
title: 兩大陣營成形（1955 年底：華沙公約成立之後）
note: 1949 年北大西洋公約組織（北約）成立，1955 年西德加入；同年 5 月蘇聯與東歐七國簽下華沙公約。德國分成西德（北約）與東德（華沙公約），朝鮮半島在 1953 年停戰後以停戰線分成南北，越南 1954 年以北緯 17 度暫時分成南北。美國在亞太另外和日本、南韓、中華民國（臺灣）、菲律賓、澳洲、紐西蘭等國簽了防禦條約。沒有塗色的國家不屬於這幾個陣營（例如中立的瑞典、瑞士、奧地利，或剛獨立的印度、印尼）。以今日國界近似，邊界只是示意。

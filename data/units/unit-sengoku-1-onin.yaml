id: unit-sengoku-1-onin
title: 將軍還在，為什麼沒人聽他？應仁之亂到川中島（1467–1561）
histories: [日本史]
mystery: 1467 年，室町幕府的將軍還坐在京都，兩大家族卻在他眼前打了十年仗，打完以後誰也沒贏。一場將軍家的繼承糾紛，怎麼會變成一百年的亂世？
teaser: 一首哀嘆京都成了荒野的和歌、一個被寫成「流浪武士」的幕府官員、一場大多沒打起來的宿敵對決：日本戰國是怎麼開始的。
goals:
  - 能說出應仁之亂的結構原因與導火線，以及它為什麼「沒有贏家」
  - 能判讀《應仁記》所錄的一首和歌，分辨文學的哀嘆與實際的破壞範圍
  - 能用一條因果鏈說明從將軍繼承爭議、京都內戰到各地大名自立、互相消耗的過程
  - 能比較應仁之亂後的日本與唐朝藩鎮割據，說出「中央還在卻沒人聽」的相同與不同
  - 能指出北條早雲「素浪人下剋上」、川中島「一騎討」這些故事哪些部分出自後世
minutes: 38
steps:
  - type: hook
    text: |
      想像一個班級：班長還在，但他選不出接班人，兩個副班長各拉一派，在教室裡吵了十年，桌椅全被砸爛，最後誰也沒贏。
      吵完以後，各組組長發現一件事：班長說什麼，其實可以不理。於是每一組自己訂規矩、自己收班費，甚至組員推翻組長自己當。
      1467 年開始的日本，就像這個班級。將軍還在，為什麼沒人聽他？這個單元從京都的一場大火開始看。
      （提醒：這一課的卡片內容偏高中程度，是給高中生或想挑戰的國中生的。國中生不用全部讀完，先看每一步提示問的那一段就好。）
  - type: card
    id: war-onin
    depth: deep
    prompt: 先看這場仗怎麼打起來、怎麼結束。讀「起因」時把「結構」和「導火線」分開；讀「結果」時注意：誰贏了？再讀到「史家怎麼吵」：《應仁記》把日野富子寫成元凶，近年的研究怎麼說？
  - type: source
    card: war-onin
    idx: 0
    question: 「汝や知る 都は野辺の 夕雲雀……」這首和歌最可能在表達什麼？
    options:
      - 東軍打贏了，作者在慶祝勝利
      - 將軍足利義政退位時寫給兒子的叮嚀
      - 大內政弘撤兵回鄉時的告別
      - 京都已成荒野，作者看著雲雀飛起而落淚，是對戰後京都的哀嘆
    answer: 3
    explain: 這首和歌收在《應仁記》裡，是飯尾彥六左衛門尉詠戰亂後的京都：「京都已成荒野，看黃昏雲雀飛起，眼淚卻落下」。讀史料要分兩層：第一層是「感受」，京都人確實覺得首都毀了；第二層是「範圍」，依卡片整理的研究，上京的寺社、公家與武家宅邸大多燒毀，但下京大致倖存，「花都成狐狼巢穴」這類句子是文學性的哀嘆。另外別忘了，《應仁記》本身也有問題：它帶有濃厚的儒教色彩、有不少錯誤，連版本成於何時都有爭論，所以它寫的「誰的錯」要特別小心。
    hints:
      - 先看括號裡的中譯：「京都已成荒野」是什麼心情？
      - 「落つる涙」是落下的眼淚；一個在慶祝的人會落淚嗎？
      - 這首和歌是「亂後」詠京都的，所以它在哀嘆戰爭留下的景象。
    ref: war-onin#A8
  - type: card
    id: event-sengoku-japan
    depth: deep
    prompt: 拉遠看整個時代。讀「制度或機制變化」：戰國大名靠什麼統治？也看「戲劇 vs 史實」：戰國真的天天在打仗嗎？「下剋上」真的到處都是嗎？
  - type: decision
    role: 你是 1493 年的伊勢新九郎盛時（後世叫他北條早雲）
    situation: |
      你是幕府裡有身分、有薪水的官員。1493 年，新將軍派你去伊豆討伐殺母弒弟的堀越公方（幕府派在關東的分支首領），你打下來了，現在伊豆在你手上。
      你看得到的局勢是：應仁之亂已過十幾年，京都的將軍管不動地方；關東有堀越公方與古河公方並立，守護上杉家也分成山內、扇谷兩系互鬥。
      把你的想法寫下來。
    options:
      - { label: 留下來，自己治理伊豆, result: 這是他當年的選擇。他以韮山城為據點，花了約五年（1493–1498）才平定全伊豆；1495 年前後取得小田原城（黑田基樹等主張 1496 年以後），1506 年在相模實施指出檢地，1516 年滅三浦氏，1519 年死於韮山。一個幕府官員就這樣變成有自己領國的大名。 }
      - { label: 把伊豆交回幕府或堀越公方體系，自己回京都繼續當幕府官員, result: 推測：他 1491 年確實回過幕府任職，所以這條路他走過；但將軍權威正在崩解，交回去的伊豆未必有人守得住。歷史沒有走這條路，所以後果只能推測。 }
      - { label: 回駿河，當甥兒今川氏親的重臣, result: 推測：氏親是他扶上位的，對氏親來說他是奪回家督的恩人，通說他的居城興國寺城也是氏親給的；但那樣他就只是今川家東邊的一個親戚，不會有自己的領國。歷史沒有走這條路，所以後果只能推測。 }
    actual: 他選擇留下來。史家對這個選擇的解讀分成兩邊：家永遵嗣等人強調 1493 年的行動與明應政變連動，是奉命的公務，不是單純的個人野心；黑田基樹則仍把它放在「下剋上」的系譜裡。卡片的結論是「奉命」與「自立」並不互斥。他當時看得到的是幕府的命令、崩解中的將軍權威和內鬥的關東；他看不到的是，兒子氏綱會改姓北條、後北條氏會以小田原為中心統治關東近一個世紀，直到 1590 年被豐臣秀吉消滅，也看不到自己會被江戶時代的軍記寫成「以詐術起家的素浪人」。
    ref: person-hojo-soun#P3
    note: 「沒有發生的選項」的後果都是推測，標示清楚。另外，他的生年有 1432 與 1456 兩說，所以「1493 年他幾歲」也有兩種答案（卡片依 1456 年說算出 37 歲；依 1432 年舊說則是 61 歲，這是推算）；小田原奪城的年份同樣有爭論。
  - type: card
    id: person-hojo-soun
    depth: deep
    prompt: 你剛替他做了決定，現在看真正的伊勢新九郎。課本和小說常說他是「白手起家的流浪武士」。讀「史家怎麼吵」：他到底是素浪人還是幕府官員？新說是怎麼證明的？再讀「關鍵決定」，對照你剛才寫下的想法。
  - type: card
    id: war-kawanakajima
    depth: deep
    prompt: 六十年後，各地大名已經自己當家，武田信玄和上杉謙信在川中島對峙了十二年。讀「史家怎麼吵」：到底打了幾次？「一騎討」和「啄木鳥戰法」出自哪本書？
  - type: chain
    prompt: 把下列事件依照「因 → 果」排成一條鏈（最上面是最早的原因）。
    items:
      - 1464 年將軍足利義政無子，立弟弟義視為繼承人；隔年兒子義尚出生，繼承問題成為派系鬥爭的焦點
      - 1467 年畠山政長與畠山義就在京都上御靈社開戰，幾個月內升級為東軍（細川）與西軍（山名）的全面戰爭
      - 1473 年細川勝元與山名宗全相繼病死，仗卻還在打；1477 年大內政弘撤兵才結束，沒有人達成目標
      - 守護在京制度瓦解，將軍再也管不動各地大名；守護代取代守護，「下剋上」風氣興起
      - 1485 年山城國一揆、之後加賀一向一揆等接連起事；1493 年伊勢宗瑞（北條早雲）攻入伊豆，常被當作東國戰國的開端
      - 各地戰國大名不再靠幕府任命，自己統治領地、自己訂分國法
      - 1553 年起武田與上杉在川中島對峙十餘年，地方大名互相消耗、誰也吃不掉誰
    explain: 繼承爭議加上畠山、斯波兩家的家督之爭，讓有力大名分成兩派；導火線一點燃，京都就打了十年。因為沒有贏家，守護大名各自回領國，幕府從「全國政權」變成「京都地方政權」。接著是地方的翻轉：守護代取代守護、農民與門徒組成一揆、幕府官員變成領國大名。等到 16 世紀中葉，像武田、上杉這樣的大名已經各自統治一方，卻也在邊境互相消耗。注意：應仁之亂是不是「戰國的起點」仍有爭論，也有學者主張以 1493 年的明應政變為起點。
    hints:
      - 最早的原因是「將軍家選不出接班人」。
      - 先有京都的十年內戰，才有「守護回領國、將軍管不動」的結果。
      - 1485 年山城、1493 年伊豆是地方翻轉的例子；川中島（1553 年起）是大名已經自立之後的事。
    ref: war-onin#A9
  - type: compare
    cards: [war-onin, event-fanzhen]
    prompt: 比一比兩個「中央還在，卻沒人聽」的時代：15 世紀的室町幕府，和 8 到 10 世紀的唐朝。
    rows:
      - { aspect: 中央是什麼樣的政權, a: 室町幕府是靠守護大名「人在京都」維持的武家聯合政權，沒有常備軍、沒有全國稅制, b: 唐朝皇帝與長安朝廷，但邊疆的節度使同時握有軍隊、收稅和任命官員的權力 }
      - { aspect: 怎麼失控的, a: 將軍繼承爭議加上畠山、斯波兩家的家督之爭，引爆十年內戰；1486 年仍留在京都的守護只剩細川一門, b: 763 年為了快點結束安史之亂，朝廷讓許多投降的叛將直接當節度使；河朔三鎮 57 位節度使中朝廷任命的只有 4 位，賦稅也不上繳 }
      - { aspect: 地方的實力派, a: 守護大名，之後守護代、國人、一揆接連翻轉上層, b: 節度使；多是父死子繼或部將擁立 }
      - { aspect: 中央還撐了多久, a: 幕府權威衰落後名義仍在，到 1573 年織田信長驅逐將軍足利義昭才結束, b: 唐朝靠各類藩鎮之間的平衡又維持了一百多年，907 年朱溫廢唐 }
      - { aspect: 史家怎麼說, a: 戰國從 1467 還是 1493 年開始，學者有兩說；也有人認為交戰雙方自己都不清楚目標, b: 真正割據的主要是河朔三鎮，有學者認為藩鎮失控的時間只有約六十年 }
    question: 兩邊都是「中央還在、地方不聽」。相同的地方是什麼？最大的不同又是什麼？史家提醒我們哪裡不要說過頭？
    model_answer: 相同的是結構：中央名義上都沒有消失，但地方的軍事領主掌握了兵、稅和人事，中央無法號令。不同的是「中央原本靠什麼維持」：唐朝有皇帝與朝廷體系，多數藩鎮的節度使仍聽中央任免，真正割據的主要是河朔三鎮，朝廷還能靠東南財源再撐一百多年；室町幕府本來就是靠守護大名人在京都、互相承認才維持的聯合政權，沒有常備軍與全國稅制，一旦守護回到領國，將軍就從全國政權變成京都地方政權，戰國大名乾脆自己訂法律。史家提醒兩邊都別說過頭：唐朝並非「安史之亂一平就分崩離析」；日本也不是 1467 年之後天天在打仗，16 世紀前半守護大名仍有影響力、大致互相承認秩序。這題沒有標準答案。
    hints:
      - 先看「中央是什麼樣的政權」那一列：一個有常備軍和稅制，一個沒有，這會影響失控以後還剩什麼。
      - 再看「怎麼失控的」：是中央自己把權力交出去（任命降將當節度使），還是中央內部先打起來？
      - 「史家怎麼說」那一列兩邊都在提醒「沒有全面失控」，想想為什麼課本常常寫得比較絕對。
  - type: today
    card: war-onin
    question: 有人說「應仁之亂後將軍管不動大名，就像今天中央政府管不動地方政府」。這個類比哪裡不成立？
    model_answer: 先說不能類比的地方：室町幕府是靠守護大名「人在京都」維持的武家聯合政權，沒有常備軍、沒有全國稅制，守護是帶著私兵的武士領主；今天的國家有憲法、官僚體系與正規軍，中央與地方的關係由法律和預算規範，地方首長也不是世襲的軍事領主，所以不能把「將軍管不動大名」直接比作現代的中央與地方。而且「管不動」是一個過程，不是一夕之間：有學者認為幕府權威一直撐到 1493 年前後。可以借來想的是兩件事：第一，一個靠「大家都在場、互相承認」維持的秩序，核心成員一旦為了繼承問題打起來、又沒有人能贏，權威會怎麼一點一點流失；第二，一場沒有贏家的長期內戰，反而會讓原本在邊緣的人（被大量雇用的足輕、守護代、一揆、派到地方的官員）站到台前。
  - type: check
    items:
      - kind: choice
        q: 下列哪一個是應仁之亂的「直接導火線」？
        options: [葡萄牙人把火繩槍帶到種子島, 大內政弘撤兵回周防, 1467 年畠山政長與畠山義就在京都上御靈社開戰, 織田信長驅逐將軍足利義昭]
        answer: 2
        explain: 將軍繼承爭議、畠山與斯波的家督之爭、幕府財政困難是長期的結構；1467 年 1 月（舊曆）兩位畠山在上御靈社開打，是把結構點燃的導火線，幾個月內升級為東西兩軍的全面戰爭。其他選項要不是發生在戰後，就是幾十年、一百年後的事。
        hints: [導火線是一件「具體、時間很近」的事，而且發生在戰爭一開始。, 回去看應仁之亂卡「起因：結構與導火線」的最後一句。]
        ref: war-onin#A2
      - kind: order
        q: 依時間先後排列：
        items: [應仁之亂爆發, 大內政弘撤兵、應仁之亂結束, 山城國一揆, 留在京都的守護只剩細川一門, 伊勢宗瑞（北條早雲）攻入伊豆, 第四次川中島合戰]
        explain: 1467 年爆發 → 1477 年結束 → 1485 年山城國一揆 → 1486 年留在京都的守護只剩細川一門 → 1493 年伊豆討入 → 1561 年第四次川中島。前五個年份見應仁之亂卡與北條早雲卡，川中島見川中島卡。前兩件是京都的內戰，中間三件是將軍管不動、地方開始翻轉，最後一件是大名已經自立、互相對峙的時代。
        hints: [應仁之亂打了十年，所以「爆發」和「結束」中間隔十年。, 山城國一揆、守護只剩細川、伊豆討入都在應仁之亂結束後十幾年內；川中島是半個世紀以後的事。]
        ref: war-onin#A8
      - kind: short
        q: 用一兩句話說明：為什麼近年的研究說北條早雲不是「白手起家的素浪人」？
        model: 因為他出身世代擔任幕府政所執事的伊勢氏分家，1483 年當上將軍的申次眾、1487 年成為奉公眾，有身分有俸祿；1493 年攻入伊豆也是奉新將軍足利義澄之命。「素浪人」的形象是江戶中期以後受《太閤記》影響才出現的。
        explain: 一個人的「出身故事」會依時代需要被改寫：江戶時代把他寫成以詐術起家的浪人，明治以後變成「下剋上的勵志典型」，戰後的研究才靠史料把他放回幕府官員的位置。讀人物時，先問「這個說法最早是誰寫的」。
        hints: [回去看北條早雲卡的故事第一句：他 1483 年、1487 年分別當了什麼？, 再看「史家怎麼吵」第一段：「素浪人」的說法是哪個時代才出現的？]
        ref: person-hojo-soun#P6
  - type: recap
    model_answer: 一場繼承糾紛之所以變成一百年的亂世，關鍵不在糾紛本身，而在它打壞了室町幕府賴以維持的東西。幕府是靠守護大名人在京都、互相承認才運作的聯合政權，沒有常備軍、沒有全國稅制。1467 年將軍繼承爭議與畠山、斯波的家督之爭把大名分成兩派，京都打了十年，沒有人達成目標，到 1486 年留在京都的守護只剩細川一門。守護回到領國以後，將軍說什麼就沒人理了：守護代取代守護、山城與加賀的一揆接連起事、像伊勢宗瑞這樣的幕府官員把任務區變成自己的領國，戰國大名自己訂分國法。到 16 世紀中葉，武田與上杉這樣的大名已經各自統治一方，卻也在川中島這樣的邊境互相消耗十幾年，誰也吃不掉誰，這替後來從近畿崛起的織田信長留出了時間。兩個提醒：第一，戰國不是天天打仗，16 世紀前半守護大名仍有影響力，連「戰國從哪年開始」都有 1467 年與 1493 年等不同說法；第二，我們熟悉的很多故事（日野富子挑起戰爭、北條早雲是素浪人、川中島一騎討）都出自後世的軍記，史家正一條一條對照當時的文書。這是一種參考說法，不是標準答案。

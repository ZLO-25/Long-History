title: 圖拉真去世時的羅馬（117 年）
note: "117 年 8 月圖拉真在回程中去世，這是羅馬疆域最大的時候。核心行省從不列顛（英格蘭與威爾斯，哈德良長城以南）、萊茵河與多瑙河以內的日耳曼與多瑙諸省、106 年新設的達契亞（今羅馬尼亞西部），到整個地中海沿岸、埃及與阿拉伯行省。另用橘色標出圖拉真約 113 至 117 年東征新取得的亞美尼亞、美索不達米亞與亞述（今伊拉克與亞美尼亞、土耳其東部）；他一死，繼位的哈德良就放棄了這些地方，所以它們只在這一年短暫出現。東邊的安息是對手。邊界以今日國界近似，萊茵—多瑙河沿線與北非沙漠邊界只是示意；切線理由見 docs/dive-rome.md。"

id: unit-greece-2
title: 贏了之後：從雅典帝國到亞歷山大
histories: [希臘羅馬史, 世界通史]
mystery: 雅典打贏波斯之後成了希臘最強的城邦，為什麼不到八十年就投降？後來整個希臘，又為什麼先被北邊的馬其頓、再被西邊的羅馬收走？
teaser: 一個「共同防衛」的同盟，怎麼變成盟主的錢包；一場投票，怎麼把一整支遠征軍送上回不來的路。
goals:
  - 能說出提洛同盟怎麼從共同防衛變成「雅典帝國」，並分辨政敵的指控與官方說法
  - 能說出西西里遠征當時看得到的選項與各自的代價，並說明阿爾西比亞德斯為什麼讓人又愛又恨
  - 能依時間排出蘇格拉底之死、馬其頓崛起、亞歷山大東征到羅馬征服希臘的順序
  - 能比較雅典與羅馬兩次「保護者變統治者」的故事，並指出類比的限制
minutes: 45
companion: unit-greece-1
steps:
  - type: hook
    text: |
      想像你們班靠大家出錢、出力，組成聯隊打贏了一場很難的比賽。贏了之後，班長說：「班費放在我這邊比較安全，怎麼用，我說了算。」
      一開始你覺得有道理；後來發現，班費被拿去裝飾班長自己的教室。你想退出聯隊，卻被攔下來。
      大約兩千五百年前的雅典，就像這個班長。這個單元要看：贏了之後會發生什麼事。
  - type: card
    id: event-delian-league
    depth: understand
    prompt: 同盟一開始是為了什麼？注意盟邦用什麼方式出力（出錢還是出船），想退出的城邦下場如何，以及前 454 年金庫搬去了哪裡。
  - type: source
    card: event-delian-league
    idx: 0
    question: 這句話「雅典把希臘人的公款從提洛島搬來自己保管」，最適合怎麼理解？
    options:
      - 雅典官方對盟邦公布的搬遷理由
      - 伯里克里斯的政敵對他的指控，批評雅典把盟邦的錢拿去美化自己的城市
      - 盟邦代表在提洛島會議上的投票結果
      - 波斯國王對雅典同盟的警告
    answer: 1
    explain: 這是普魯塔克記下的當時政敵的指控。雅典公開的說法是金庫放在提洛島不安全，搬到雅典是為了防波斯；伯里克里斯的回應則是，只要雅典替盟邦擋住波斯，就不必向盟邦交代錢怎麼用。同一件事，雅典、政敵和盟邦會講得不一樣，讀史料時要先問：這是誰說的？
    hints:
      - 先看句子的主詞：誰「搬」、誰在「保管」？語氣是在說明，還是在指責？
      - 卡片的「史家怎麼吵」寫了雅典公開說的理由，和政敵的批評，兩者語氣一樣嗎？
      - 這句話的作者是普魯塔克，他是引用誰的話？
    ref: event-delian-league#C6
  - type: decision
    role: 你是前 415 年雅典公民大會裡的一位公民
    situation: |
      雅典和斯巴達已經打了十幾年：前 431 年開戰，前 430 年起城裡爆發瘟疫，領袖伯里克里斯也病死；前 421 年雙方簽了和約，大致恢復戰前狀態，但雙方的盟邦與將領並沒有全部遵守。
      現在公民大會要投票：要不要派艦隊遠征西西里？主張出兵的是阿爾西比亞德斯，名門出身、很會說話，由伯里克里斯照顧長大；原本反對的是尼西阿斯。
      先別急著看選項：如果你是台下的一位公民，只知道這些，你會怎麼舉手？你信不信那個說得最動聽的人？
    options:
      - label: 大規模遠征西西里
        result: 這是雅典當年的選擇。首批派出超過 100 艘船、約 5,000 名步兵與輕裝兵，前 413 年又增援約 73 艘。結果全軍覆沒，約 7,000 名俘虜被關進敘拉古的採石場，許多雅典人病死、餓死，非雅典籍的俘虜被賣為奴隸（數字都是古代記載的估計）。
      - label: 不出兵，守住本土和海上糧道
        result: 推測：艦隊和兵力可以留在身邊，不必賭一場遠在海外的仗；但西西里的好處也拿不到，戰爭可能拖得更久。歷史沒有走這條路，所以後果只能推測。
      - label: 只派小規模兵力
        result: 推測：損失可能比較小，但也可能兵力不夠、白白冒險，兩邊都不討好。歷史沒有走這條路，所以後果只能推測。
    actual: 雅典投票出兵，阿爾西比亞德斯與尼西阿斯等三位將軍帶兵出航。出發前，雅典城裡的赫爾墨斯像被人破壞，阿爾西比亞德斯成為主要嫌疑人；被召回受審時，他逃到敵國斯巴達；普魯塔克記載，他勸斯巴達派將軍去西西里對付雅典軍，又勸他們在雅典附近的狄凱里亞築堡駐軍。遠征最後全軍覆沒，推動出兵的人自己卻中途逃走，在西西里送命的士兵與家屬怎麼看他，卡片沒有記載。前 413 年起斯巴達在狄凱里亞築堡常駐，約 2 萬名雅典奴隸逃走、銀礦受損，波斯也開始出錢幫斯巴達建艦隊。
    ref: person-alcibiades#P3
    note: 沒有發生的選項，後果都是推測，標示清楚。這題沒有標準答案。「雅典與斯巴達」單元也有一題西西里的決策，那裡看的是戰略；這裡換個角度，問的是「你信不信那個說服你的人」。
  - type: card
    id: war-peloponnesian
    depth: understand
    prompt: 看雅典輸在哪裡。注意瘟疫、西西里遠征、波斯的錢，各自在戰爭的哪一個階段出現。
  - type: card
    id: person-alcibiades
    depth: understand
    prompt: 他一生換邊三次。注意阿里斯托芬形容雅典人對他的心情，以及「從另一邊看他」。
  - type: chain
    prompt: 把下列事件依照時間順序排成一條鏈（最上面最早）。
    items:
      - 雅典靠盟邦貢金擴建艦隊，斯巴達越來越警戒，前 431 年戰爭開始
      - 前 430 年起雅典城內爆發瘟疫，伯里克里斯也病死
      - 前 415–413 年西西里遠征慘敗
      - 前 413 年起，斯巴達在狄凱里亞築堡，波斯開始出錢支持斯巴達建艦隊
      - 前 405 年羊河之役，雅典艦隊覆滅，前 404 年雅典投降
    explain: 貢金養大的雅典艦隊讓斯巴達不安，戰爭在前 431 年爆發；瘟疫奪走領袖，西西里遠征又賠掉一大批船與人，斯巴達築堡、拿到波斯的錢之後有了艦隊，羊河之役掐斷雅典的糧道。開戰之後的每一步都削弱雅典，但卡片提醒：不能只用「崛起對老大」解釋，雅典自己的決定也很重要。
    hints:
      - 最早的是開戰的背景：雅典變強、斯巴達害怕。
      - 瘟疫發生在戰爭初期，西西里在戰爭中段。
      - 最後兩步是雅典失去海上優勢，然後投降。
    ref: war-peloponnesian#A7
  - type: card
    id: event-death-of-socrates
    depth: understand
    prompt: 看戰敗後的雅典。注意前 403 年民主恢復時的大赦、審判的陪審團怎麼產生，以及史家對「這是政治審判還是宗教審判」怎麼吵。
  - type: card
    id: event-macedon-rise
    depth: understand
    prompt: 雅典和斯巴達互相消耗的時候，北邊有人在準備。注意腓力二世用什麼打造軍隊、錢從哪裡來、前 338 年之後發生了什麼。
  - type: card
    id: event-alexander-campaign
    depth: understand
    prompt: 先看十年的路線，再看「受益者與受損者」：同一場戰爭，對底比斯、推羅、加薩和波斯來說是什麼？
  - type: card
    id: person-alexander
    depth: understand
    prompt: 讀「從另一邊看他」，想想看：埃及人、波斯人自己的看法，為什麼卡片說來源不足？
  - type: card
    id: event-hellenistic-kingdoms
    depth: understand
    prompt: 亞歷山大一死，帝國怎麼了？注意他有沒有安排繼承人，以及後來希臘語為什麼反而傳得更遠。
  - type: card
    id: war-roman-conquest-greece
    depth: understand
    prompt: 西邊的羅馬登場了。注意前 196 年宣布了什麼、之後又留下了什麼，還有前 146 年科林斯發生了什麼事。
  - type: source
    card: war-roman-conquest-greece
    idx: 0
    question: 波利比烏斯記下的宣告說要讓希臘人「自由」，這裡的「自由」是什麼意思？
    options:
      - 希臘各邦從此擁有像今天國家一樣完整的主權，羅馬完全不能過問
      - 希臘人可以不遵守任何法律，想做什麼就做什麼
      - 希臘各邦都要改用羅馬的法律才算自由
      - 不駐軍、不納貢、依自己祖先的法律生活
    answer: 3
    explain: 宣告裡自己把「自由」寫得很清楚：不駐軍、不納貢、依自己祖先的法律。這和今天的個人權利或國家主權不是同一回事。而且卡片提醒，羅馬在科林斯、卡爾基斯和德米特里亞斯三個要塞仍留有駐軍，直到前 194 年才全部撤出。
    hints:
      - 不要用今天「自由」的意思，只看這段話後面列出來的三個條件。
      - 「garrisons」是駐軍，「tribute」是貢金，這兩個字少了會怎樣？
      - 回去看卡片：宣告之後，羅馬真的立刻把軍隊都撤走了嗎？
    ref: war-roman-conquest-greece#A7
  - type: compare
    cards: [event-delian-league, war-roman-conquest-greece]
    prompt: 比一比兩次「來幫忙的強國」：前 5 世紀的雅典，和前 2 世紀的羅馬。
    rows:
      - aspect: 一開始怎麼說
        a: 前 478 年以雅典為盟主，目標是繼續對抗波斯、解放東方的希臘城邦
        b: 前 196 年宣布許多希臘人「自由，不駐軍，不納貢，用自己祖先的法律」
      - aspect: 盟邦或被解放者付出什麼
        a: 大部分盟邦繳貢金代替出船，第一次是 460 塔蘭特
        b: 羅馬在三個要塞留下駐軍，前 194 年才全部撤出
      - aspect: 有人想退出或反抗時
        a: 納克索斯、塔索斯想退出，被打到投降，城牆被拆、船被沒收
        b: 前 146 年阿卡亞同盟與羅馬開戰失敗，科林斯被毀
      - aspect: 後來變成什麼
        a: 前 454 年金庫搬到雅典，同盟被稱為「雅典帝國」
        b: 希臘歸馬其頓總督管，前 27 年才另設阿卡亞行省
      - aspect: 史料的限制
        a: 搬金庫的理由，雅典的說法和政敵的批評不同
        b: 科林斯為什麼被毀，史家沒有定論，卡片多依英文維基轉引
    question: 兩個「保護者變統治者」的故事，最像的地方和最不一樣的地方各是什麼？
    model_answer: 最像的地方：兩個強國都是以「保護、解放」開始，後來都靠錢或駐軍留下控制力，想退出或反抗的人付出很大代價。最不一樣的地方：雅典是同盟的盟主，靠貢金和海軍把同盟變成帝國；羅馬是從外面來的大國，先打敗馬其頓，再因為盟友不聽話而直接控制。另外要記得，兩邊的說法都有立場，也都有史家不同意的地方，所以不能只用一句「他們都在騙人」帶過。這題沒有標準答案。
    hints:
      - 先看第一列「一開始怎麼說」：兩邊的口號像不像？
      - 再看第三列：有人想退出或反抗，下場一樣嗎？
      - 最後想：這兩個故事裡，盟邦自己怎麼想，卡片有沒有寫？
  - type: today
    card: event-death-of-socrates
    question: 有人說「蘇格拉底之死證明，多數決會殺死真理，所以不能相信投票」。這個說法哪裡不成立？
    model_answer: 先說不能類比的地方：古代雅典沒有今日的言論自由憲法保障，也沒有上訴制度；這場審判又發生在戰敗、三十僭主統治、民主剛恢復之後，受當時政治氣氛影響，不能簡單等同於今天的司法案件。而且史家也沒有定論：有人把它當成「群眾統治」的缺陷，也有人認為這是剛恢復的民主在保護自己，還有人認為他長期被當成怪人。可以借來想的是：多數決做出的決定也可能出錯，所以才需要保障少數人說話的辦法。
    hints:
      - 先想：今天的法院有哪些保護被告的辦法，是雅典沒有的？
      - 卡片的「史家怎麼吵」，有沒有人說這是政治審判而不只是宗教審判？
      - 如果多數決會出錯，有什麼辦法可以降低錯誤的代價？
  - type: check
    items:
      - kind: choice
        q: 前 323 年亞歷山大在巴比倫去世後，他的帝國怎麼了？
        options:
          - 沒有清楚的繼承人，部將先瓜分各省，接著互相打了約五十年
          - 兒子順利繼位，帝國維持原樣統治了兩百年
          - 馬上被西邊的羅馬併吞
          - 波斯人起來奪回所有土地，恢復阿契美尼德帝國
        answer: 0
        explain: 帝國靠的是他個人的威望和部將指揮的軍隊，他沒有清楚的繼承人。部將（繼業者）先瓜分各省，再互相打了約五十年，最後形成托勒密埃及、塞琉古王國、安提柯馬其頓三大格局。
        hints:
          - 回想卡片裡「沒有明確的繼承人」那一句。
          - 羅馬併吞托勒密埃及是前 30 年，離他去世還很久。
        ref: event-hellenistic-kingdoms#C2
      - kind: choice
        q: 腓力二世在亞歷山大登基前，就替東征準備好了什麼？
        options:
          - 以雅典為盟主、靠盟邦貢金養艦隊的提洛同盟
          - 以羅馬為首、善於用軍團戰勝方陣的軍隊
          - 長槍方陣和科林斯同盟
          - 由斯巴達監察官統一指揮的伯羅奔尼撒聯軍
        answer: 2
        explain: 腓力二世改良長槍方陣、擴充騎兵，用金銀礦支付軍費，前 337 年讓希臘各邦組成科林斯同盟，推他當盟主與對波斯作戰的統帥；前 336 年先遣軍已經渡海。所以亞歷山大接手的是現成的軍隊、同盟和已經出發的戰爭。
        hints:
          - 想一想：亞歷山大剛繼位就能鎮壓希臘各邦，靠的是誰留下的什麼？
          - 提洛同盟成立在前 478 年，那時腓力還沒出生。
        ref: event-macedon-rise#C2
      - kind: order
        q: 依時間先後排列：
        items:
          - 蘇格拉底被處死
          - 喀羅尼亞之戰，馬其頓打敗雅典與底比斯聯軍
          - 亞歷山大在巴比倫去世
          - 皮德納之戰，馬其頓王國結束
          - 科林斯被羅馬毀滅
        explain: 前 399 年蘇格拉底 → 前 338 年喀羅尼亞 → 前 323 年亞歷山大去世 → 前 168 年皮德納 → 前 146 年科林斯被毀。
        hints:
          - 蘇格拉底之死在雅典戰敗之後不久，是五件事裡最早的。
          - 亞歷山大去世在他父親打贏喀羅尼亞之後。
          - 羅馬的兩件事都在馬其頓與亞歷山大之後，皮德納在科林斯被毀之前。
        ref: war-roman-conquest-greece#A7
      - kind: short
        q: 用一兩句話說明：羅馬在前 196 年宣布希臘人「自由」，為什麼後來科林斯還是被毀了？
        model: 宣告的「自由」只是不駐軍、不納貢、依自己的法律，羅馬仍在三個要塞留有駐軍，到前 194 年才撤出；後來阿卡亞同盟與羅馬開戰失敗，前 146 年科林斯被毀。為什麼被毀，史家沒有定論。
        explain: 「自由」的意思要看宣告怎麼寫，而不是看今天的用法；至於科林斯被毀的原因，卡片列了不同說法，沒有定論。
        hints:
          - 回去看宣告裡的三個條件，以及之後的駐軍。
          - 想想：阿卡亞同盟最後做了什麼，結果怎麼樣？
        ref: war-roman-conquest-greece#A8
  - type: recap
    model_answer: 雅典打贏波斯後，靠提洛同盟的貢金成了「帝國」，金庫還搬進了自己城裡，斯巴達越來越警戒，前 431 年兩邊開戰。戰爭中瘟疫奪走伯里克里斯、西西里遠征慘敗，斯巴達又拿到波斯的錢建艦隊，前 404 年雅典投降。戰後民主恢復，雅典又審判並處死了蘇格拉底。城邦們互相消耗的時候，北邊的馬其頓靠腓力二世的長槍方陣和金礦崛起，前 338 年在喀羅尼亞打敗雅典與底比斯聯軍，隔年當上希臘各邦同盟的盟主；他的兒子亞歷山大打垮波斯，死後帝國被部將瓜分，希臘語卻成了各地的通用語。最後西邊的羅馬先宣布希臘人「自由」，前 146 年卻毀了科林斯，希臘本土從此歸羅馬的馬其頓總督管。所以雅典為什麼輸掉，沒有單一的答案：盟主變成錢包、自己的遠征決定、瘟疫、波斯的錢、城邦互相消耗，都有份。這題沒有標準答案，你也可以挑一個你覺得最關鍵的原因。

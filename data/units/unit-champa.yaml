id: unit-champa
title: 占婆去哪裡了？越南地圖為什麼是長長的 S 形
histories: [占婆史, 越南史, 柬埔寨史, 東南亞史]
mystery: 一千年前，越南中部是另一個國家：拜印度神、說南島語的占婆。今天地圖上已經找不到占婆了。占婆去哪裡了？越南又是怎麼變得這麼長的？
teaser: 越南對北方的中國是抵抗者，對南方的占婆和柬埔寨卻是擴張者；同一段歷史，從不同鄰居的角度看，完全不一樣。
goals:
  - 能說出占婆是什麼樣的國家：南島語族、接受印度宗教和梵文、靠航海貿易
  - 能判讀《明史》對 1471 年越南攻破占婆的記載
  - 能把越南「南進」的幾個關鍵年份依序排出來
  - 能比較越南「抵抗明朝」和「吞併占婆」兩件事，說明同一個國家在不同鄰居眼中的不同面貌
  - 能指出占婆國亡了，但占族和下高棉人今天仍然住在原地
minutes: 35
steps:
  - type: hook
    text: |
      打開越南地圖，你會看到一個長長的 S 形，從北邊的河內一直拉到南邊的胡志明市。
      但一千年前，越南只有北部的紅河三角洲；中部是占婆，南部的湄公河三角洲屬於高棉人（柬埔寨）。
      這個單元，我們要追查：越南是怎麼一步步變長的？原本住在那裡的人又去了哪裡？
  - type: card
    id: event-champa
    depth: story
    prompt: 邊讀邊找：占婆人說的是哪一個語族的語言？他們拜的是哪裡的神？
  - type: source
    card: event-champa
    idx: 1
    question: 記載唐朝歷史的《新唐書》說占婆「有文字，喜浮屠道」。從這句話可以看出占婆是一個什麼樣的國家？
    options:
      - 沒有文字、也沒有宗教的部落
      - 完全使用漢字、信仰儒家的國家
      - 被唐朝直接派官統治的郡縣
      - 有自己的文字，也信奉佛教
    answer: 3
    explain: 「浮屠」是古代中國對佛（佛教）的稱呼，「喜浮屠道」就是喜歡佛教。再加上「有文字」，可以看出占婆有自己的文字和宗教。卡片也說，占婆大約從 4 世紀起以梵文為學術語言、奉濕婆為國教；可見占婆的信仰不只一種，既奉印度教的濕婆，也喜歡佛教。
    hints:
      - 「浮屠」在古文裡常常指佛或佛塔。
      - 史書說它「有文字」，所以不是沒有文字的部落。
      - 卡片說占婆接受的是印度的宗教和梵文，不是漢字和儒家。
    ref: event-champa#story
  - type: card
    id: building-my-son
    depth: story
    prompt: 美山的神塔是為哪一位印度神蓋的？1969 年發生了什麼事？
  - type: card
    id: war-nam-tien-champa
    depth: story
    prompt: 讀的時候把年份圈起來：1069、1306、1471、1697、1832 各發生了什麼事？
  - type: source
    card: war-nam-tien-champa
    idx: 0
    question: 根據《明史》，1471 年越南大舉攻打占婆，起因是什麼？
    options:
      - 越南要占城交出犀牛、大象和寶物，並用對待明朝的禮節對待越南，占城不肯
      - 占城先派兵攻打越南的都城
      - 明朝皇帝命令越南去攻打占城
      - 占城國王過世，沒有人繼位
    answer: 0
    explain: 《明史》說「安南索占城犀象、寶貨，令以事天朝之禮事之。占城不從，大舉往伐」。也就是越南要占城像對待明朝一樣對待自己，占城不肯，越南就出兵；1471 年「破其國，執王槃羅茶全及家屬五十餘人」。
    hints:
      - 找「占城不從」這四個字，前面寫的就是越南的要求。
      - 「天朝」指的是明朝。
      - 越南要的是犀牛、大象、寶物，還有「禮節」。
    ref: war-nam-tien-champa#story
  - type: card
    id: event-mekong-delta-vietnam
    depth: story
    prompt: 胡志明市（西貢）四百年前叫什麼名字？是哪一國的港口？
  - type: chain
    prompt: 把越南「南進」的過程依時間排好（最上面最早）。
    items:
      - 越南北部脫離中國自主，國土只有紅河三角洲一帶
      - 李朝打敗並俘虜占婆國王，取得北方三個州
      - 陳朝把玄珍公主嫁給占婆國王，換來烏、里兩州
      - 後黎朝攻破占婆都城毗闍耶
      - 柬埔寨國王准許越南人在普利安哥（後來的西貢）設稅關、定居
      - 阮主派阮有鏡南下設立嘉定
      - 明命帝正式併吞占婆剩下的南方小國
    explain: 10 世紀自主 → 1069 年取得三州 → 1306 年和親換兩州 → 1471 年攻破毗闍耶 → 1623 年在普利安哥設稅關 → 1698 年設嘉定 → 1832 年併吞占婆。
    hints:
      - 越南要先自主，才談得上往南擴張。
      - 先處理占婆的北部，再往南到湄公河三角洲。
      - 占婆的南方小國最後才被併吞，比設嘉定還晚。
    ref: war-nam-tien-champa#story
  - type: compare
    cards: [war-nam-tien-champa, war-ming-dai-viet]
    prompt: 15 世紀的越南，先被明朝改成中國的一個省，自己打回獨立；過了幾十年，又攻破了南方的占婆。比一比這兩件事。
    rows:
      - { aspect: 越南的角色, a: 擴張的一方，攻破占婆都城毗闍耶, b: 被占領的一方，被明朝改成「交趾布政使司」 }
      - { aspect: 時間, a: 1471 年，後黎朝的黎聖宗南征, b: 1406 年明軍出兵，1428 年黎利建立後黎朝 }
      - { aspect: 結局, a: 占婆只剩南方小國，1832 年被阮朝併吞, b: 明軍議和撤退，黎利稱帝，國號大越 }
      - { aspect: 越南人怎麼記住, a: 越南史家把這七百年叫做「南進」, b: 〈平吳大誥〉至今是越南中學課本裡的名篇 }
    question: 為什麼說「越南不只是被侵略的國家」？用這兩件事來說明。
    model_answer: 1406 年明朝出兵，隔年把越南改成中國的一個省，黎利起兵把明軍趕走，這時越南是抵抗者。可是同一個後黎朝，1471 年又攻破占婆都城，把占婆的地方據為己有，這時越南是擴張者。同一個國家，對北方的中國是抵抗者，對南方的占婆卻是擴張者；從不同鄰居的角度看，歷史完全不一樣。
    hints:
      - 先看「越南的角色」那一列。
      - 兩件事都和後黎朝有關，時間只差幾十年。
      - 從明朝看、從占婆看，越南分別是什麼樣子？
  - type: decision
    role: 你是 1690 年代占婆南方小國的國王
    situation: |
      你的祖先在 1471 年失去了都城毗闍耶，現在你只統治南方的一小塊地方。
      北邊越南的阮主越來越強，阮主的移民也一步步往南進入高棉人的湄公河三角洲。你可以向阮主稱臣當附庸，也可以和阮主對抗。你會怎麼做？
    options:
      - { label: 向阮主稱臣，當附庸國, result: 這是歷史上發生的事：1697 年占婆成為阮主的附庸，名義上還有自己的國王；但 1832 年明命帝把它正式併吞，占婆從地圖上消失了。 }
      - { label: 起兵和阮主對抗, result: 推測：占婆這時只剩南方的小國，卡片說占婆本來就由好幾個政權組成、不夠集權，對抗強大的鄰居可能很困難。歷史沒有走這條路，所以後果只能推測。 }
    actual: 1697 年占婆成為越南阮主的附庸，1832 年被明命帝正式併吞；但占族並沒有消失，今天仍住在越南中南部和柬埔寨。
    ref: war-nam-tien-champa#story
    note: 「沒有發生的選項」的後果都是推測，標示清楚。
  - type: today
    card: building-my-son
    question: 美山的神塔在 1969 年的轟炸中大半被毀。今天世界各地也有文化遺產在戰火中受損。這兩件事可以直接類比嗎？
    model_answer: 不能完全類比。美山在越戰前早已荒廢，是殖民時期才被重新發現的古代聖地；今天戰火中的文化遺產往往還有社群在使用，保護時要考慮的事情不同。可以借來思考的是：戰爭不只殺傷人命，也會一下子毀掉幾百年留下來的歷史證據，而且很難復原，美山山谷至今還有未爆彈要清除。
  - type: check
    items:
      - kind: choice
        q: 占族說的語言屬於哪一個語族？
        options: [漢藏語族, 南島語族, 印歐語族, 和越南人一樣的語族]
        answer: 1
        explain: 占婆人的祖先是沿海的南島語族，說南島語系的占語，和越南人、高棉人說的是完全不同系統的語言；卡片用臺灣原住民族來比喻。
        hints: [卡片用臺灣的哪一群人來比喻占族？, 臺灣原住民族的語言屬於哪個語族？]
        ref: event-champa#story
      - kind: choice
        q: 1471 年越南攻破的占婆都城叫什麼名字？
        options: [吳哥, 西貢, 河仙, 毗闍耶]
        answer: 3
        explain: 1471 年後黎朝的黎聖宗攻破占婆都城毗闍耶，據說有十二萬人被殺或被俘。
        hints: [吳哥是柬埔寨的都城，西貢和河仙在湄公河三角洲。, 這座都城的名字有「毗」字。]
        ref: war-nam-tien-champa#story
      - kind: choice
        q: 湄公河三角洲在越南人來以前，主要是哪一群人的土地？
        options: [高棉人（柬埔寨）, 日本人, 華人, 泰國人]
        answer: 0
        explain: 湄公河三角洲原本是高棉王國的一部分，長達八百多年；今天越南南部還住著一百多萬高棉人，叫做下高棉人。
        hints: [「下高棉人」的「高棉」是哪個國家的主要民族？, 胡志明市四百年前是哪一國的小港口？]
        ref: event-mekong-delta-vietnam#story
      - kind: short
        q: 用一兩句話說明：為什麼說占婆國亡了，占族卻沒有消失？
        model: 占婆這個國家在 1832 年被併吞，但占族人還住在越南中南部和柬埔寨，2019 年越南有約 17.9 萬占族人，還過自己的卡特節。
        explain: 卡片的常見誤解說，占族成為越南 54 個官方民族之一，柬埔寨也有數十萬占族人。國家沒了，人和文化還在。
        hints: [卡片說 2019 年越南有多少占族人？, 占族今天還過什麼節日？]
        ref: event-champa
  - type: recap
    model_answer: 占婆是南島語族建立、接受印度宗教和梵文、靠航海貿易的海岸王國，在美山山谷為濕婆蓋了九百年的神塔。越南在 10 世紀脫離中國自主後，從紅河三角洲一步步往南擴張：1069 年取得三州、1306 年用和親換兩州、1471 年攻破占婆都城毗闍耶，1697 年占婆成為阮主附庸，1832 年被正式併吞。越南人接著南下湄公河三角洲，從柬埔寨手中取得西貢一帶，1757 年整個三角洲歸越南控制。所以越南的「長」，是吞併占婆和下高棉換來的；但占族和高棉人並沒有消失，今天仍住在原地。
reflect: 你學過的臺灣史裡，有沒有一群人「國家沒了，人還在」的例子？從他們的角度，同一段歷史會怎麼寫？

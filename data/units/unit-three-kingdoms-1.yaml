crosscheck: { date: 2026-11-07, by: 獨立查核 agent（未參與寫作）, result: 通過, notes: "逐句對照七張卡（黃巾、董卓、亂世百姓、屯田、官渡、赤壁、三國鼎立）。source idx 0 是《後漢書·董卓列傳》「盡徙洛陽人數百萬口……二百里內無復孑遺」，answer 1 正確，「數百萬口」依卡片 exaggerated 欄提醒是估計；choice answer 1（夜襲烏巢）正確；order 年份 184、189、196、200、208 見黃巾卡 C2、董卓卡 C2、屯田卡 C2、官渡卡 A2、赤壁卡；chain 順序與 explain 相符。compare 每格有據：de Crespigny 1991 說曹軍兵少、2010 年著作懷疑袁紹兵力優勢（官渡卡 historiography／A4），英文維基袁約 11 萬曹約 4 萬；曹操自稱八十萬、周瑜估計 22–24 萬含七八萬荊州降兵、聯軍約五萬（赤壁卡 story／A4）；de Crespigny「曹操戰敗的記載很可能被誇大」（赤壁卡 historiography）。today 先講不能類比，對應官渡卡 A12。修正：mystery 刪去卡片沒有的「漢朝統治將近四百年」，hook 同改；mystery 原寫「孫權、劉備隔著長江對峙」等於先洩漏決策答案，改為董卓卡 C7 的「皇帝成了招牌、將領各據一方」；百姓卡的 E4 寫到赤壁後曹軍撤退，會在決策前洩漏答案，移到赤壁卡之後，屯田卡提示改用屯田卡自己的難民說法；decision 刪去卡片沒有的孫權年齡、孫策、劉琮、「會獵於吳」，改用赤壁卡的「號稱八十萬水軍」「荊州降兵」；actual「荊州南部」改為卡片的「荊州大部分」；chain「同歸於盡」改為卡片的「何進反被殺、宦官遭屠殺」，explain 不再說屯田讓曹操在官渡勝出（屯田卡 C6 說官渡時曹軍仍缺糧）；short 與 recap 同樣補上這個保留；compare 參考說法刪去卡片沒有的「勝利者喜歡把對手寫強」，改引 de Crespigny。決策前讀到的屯田卡 C7 提到「對吳作戰」，屬順帶一句，保留。" }

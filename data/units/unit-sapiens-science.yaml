        q: 下列關於庫克第一次航行的說法，哪一個最正確？
        options:
          - 這趟航行只為了觀測金星凌日，和英國的擴張無關
          - 這趟航行由庫克自己出錢，皇家海軍和皇家學會都沒有參與
          - 庫克抵達時澳洲東岸沒有人居住，所以宣布占領時不需要詢問任何人
          - 公開任務是觀測金星凌日，秘密命令還要他尋找南方大陸、替英國宣布占領土地
        answer: 3
        explain: 這趟航行由皇家海軍和皇家學會共同贊助，同一艘船既做天文觀測、採集植物、測繪海岸，也依秘密命令替國王宣布占領土地。秘密命令其實寫著要「徵得當地人同意」才占領，但在澳洲東岸，當地居民沒有被詢問；在植物學灣，加迪加爾人一開始就當面阻擋登陸。

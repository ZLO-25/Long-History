    options:
      - { label: "寫明這是三和文化層的數字，不是卑南文化的年代；並註明若把石柱也算巨石遺物，年代可能上推", result: "這是李坤修文章的寫法。作者寫明這個地點屬於三和文化層，所以這組數字不是卑南文化的年代；如果把卑南文化的石柱也算巨石遺物，年代可能上推到卑南文化出現的時候，或許早於 3,000 B.P.。" }
      - { label: "直接寫「卑南文化的巨石距今約 2310 到 1980 年」", result: "推測：這樣會把比卑南文化晚的文化層的數字，當成卑南文化的年代，讀的人很容易誤會。這不是作者的寫法，所以後果只能推測。" }
      - { label: "因為數字都有誤差，乾脆不報年代", result: "推測：沒有數字，讀的人就無法檢查或比較，也看不出測的是哪一層。這不是作者的寫法，所以後果只能推測。" }

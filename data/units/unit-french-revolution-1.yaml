id: unit-french-revolution-1
title: 法國大革命（上）：為什麼「繳不出利息」會推翻國王？
histories: [歐洲史, 世界通史]
mystery: 1789 年的法國有約 2,800 萬人，國王手上權力很大，卻收不到足夠的稅。這一年，一場本來只是為了「怎麼把稅收上來」而召開的會議，幾個月內就變成攻佔監獄、廢除封建特權、宣告人人平等。一筆帳，怎麼會變成一場革命？
teaser: 一本暢銷的財政報告、一場吵了六週的投票規則、一間只關了 7 個人的監獄。
goals:
  - 能說明七年戰爭、美國獨立戰爭的債怎麼讓法國王室陷入財政危機
  - 能說出三級會議「每個等級一票」和「每人一票」的爭議，以及第三等級怎麼改稱國民議會
  - 能判讀西耶斯《第三等級是什麼？》的一段原文，說出作者想爭取什麼
  - 能比較議會裡的改變與巴黎街頭的行動，並說明兩者怎麼互相推動
minutes: 38
steps:
  - type: hook
    text: |
      想像你家每個月的收入都不夠付信用卡的利息，可是家裡有幾個成員依照「家規」可以不用分擔開銷。你想改家規，請全家開會，但開會的規則是「每一房一票」，而不用出錢的那兩房加起來剛好比你多一票。
      你會乖乖照規則開會，還是乾脆說：「我們這一房的人最多，應該一人一票」？
      1789 年的法國就卡在這裡。我們先走進那場會議，再回頭看那本帳：繳不出利息，怎麼會推翻一個國王？
  - type: decision
    role: 你是 1789 年 6 月三級會議裡的一位第三等級（平民）代表
    situation: |
      王室欠了一大筆債、想加稅，國王只好召開 1614 年以來第一次的三級會議。會議已經在凡爾賽吵了六個星期。你們第三等級約有 610 位代表，人數和教士、貴族兩個等級加起來差不多。
      但教士和貴族堅持「每個等級一票」：只要他們兩個等級聯手，就能二比一保住免稅特權。你們一直要求三個等級一起開會、「每人一票」，對方不肯。
      先別急著看選項：如果你是這位代表，只知道這些，你會怎麼做？
    options:
      - { label: 自己宣布代表全國，改稱「國民議會」, result: 這是第三等級當年的選擇。6 月 17 日他們以 491 票對 89 票改稱國民議會；6 月 20 日發現會場被關，就到附近的室內網球場發誓：不制定出憲法絕不解散。6 月 27 日國王讓步，要教士和貴族加入。 }
      - { label: 接受「每個等級一票」，先把稅制改革談成, result: 推測：教士和貴族可以用兩票對一票擋下對自己不利的稅制，改革很可能又被特權等級頂回去（等一下的財政卡會看到，1787 年就發生過一次）；國王的財政問題也未必能解決。歷史沒有走這條路，所以後果只能推測。 }
      - { label: 退出會議，回家鄉抗議, result: 推測：第三等級失去在凡爾賽發聲的位置，國王可能宣布會議失敗、另想辦法加稅或借錢；但各地的不滿也可能用別的方式爆發。歷史沒有走這條路，所以後果只能推測。 }
    actual: 第三等級在 6 月 17 日改稱國民議會，6 月 20 日在網球場宣誓不制定憲法絕不解散，國王最後讓步。原本只是為了收稅的會議，從這一刻起變成了要重寫國家規則的議會。
    ref: event-estates-general-1789#C2
    note: 「沒有發生的選項」的後果都是推測，標示清楚。財政卡 F5 寫到「三級會議很快變成國民議會」，所以把財政卡放在決策之後。
  - type: card
    id: finance-french-royal-debt
    depth: understand
    prompt: 回頭看帳：國王為什麼非開三級會議不可？法國的錢花到哪裡去了？1781 年那本暢銷的財政報告，漏算了什麼？1787 年財政總監提議「所有土地都要繳稅」時，被誰擋下來？
  - type: card
    id: event-estates-general-1789
    depth: understand
    prompt: 看看第三等級怎麼從「繳稅的人」變成「代表全國的人」：注意 6 月 17 日和 6 月 20 日分別發生了什麼。
  - type: source
    card: event-estates-general-1789
    idx: 0
    question: 西耶斯在這段話裡，怎麼回答「第三等級是什麼」？
    options:
      - 第三等級什麼都不是，應該聽貴族的
      - 第三等級是「一切」，但被鎖鏈綁住、受到壓迫
      - 第三等級只是國王的僕人
      - 第三等級應該和貴族交換位置
    answer: 1
    explain: 「What is the Third Estate? Everything; but an everything shackled and oppressed」：第三等級是「一切」，國家靠他們運作，卻被特權綁住。這是 1789 年 1 月出版的小冊子，作者是一位教士，他想說服大家：第三等級就是整個國家，特權等級反而是多出來的。所以讀的時候也要想到：這是替一方說話的文字，不是中立的描述。
    hints:
      - 先找問句後面的第一個字：Everything。
      - 「but」後面是轉折：這個「一切」怎麼了？
      - shackled（被鎖住）和 oppressed（被壓迫）是好事還是壞事？
    ref: event-estates-general-1789#C1
  - type: card
    id: event-storming-bastille
    depth: understand
    prompt: 7 月，事情從議場走到街頭。注意：群眾為什麼要去巴士底？裡面關了幾個人？消息傳到鄉下又發生了什麼事？
  - type: chain
    prompt: 把下列事件依照「因 → 果」排成一條鏈（最上面是最早的原因）。
    items:
      - 七年戰爭與美國獨立戰爭，法國王室大量借錢
      - 1787 年財政總監提議所有土地都要繳稅，被教士和貴族擋下
      - 國王宣布召開 1614 年以來第一次三級會議
      - 為了投票方式僵持，第三等級改稱國民議會、在網球場宣誓
      - 國王罷免內克，巴黎群眾攻佔巴士底
      - 8 月 4 日夜裡，國民議會宣布廢除封建制度
    explain: 打仗借來的錢還不出來，國王只好向有特權的人收稅；特權階級不肯，國王只能召開三級會議來找錢。會議卻因為投票規則卡住，第三等級乾脆自己宣布代表全國。國王罷免受歡迎的內克，巴黎群眾擔心被鎮壓，攻佔巴士底；鄉下也爆發「大恐慌」，議會在 8 月 4 日夜裡宣布廢除封建制度。每一步都是上一步沒有解決的問題逼出來的。
    hints:
      - 最早的原因是「錢」。
      - 三級會議是國王為了找錢才召開的。
      - 廢除封建制度是在攻佔巴士底之後。
    ref: event-french-revolution#C2
  - type: compare
    cards: [event-estates-general-1789, event-storming-bastille]
    prompt: 比一比兩種「革命」：一種在議場裡，一種在街頭。
    rows:
      - { aspect: 時間, a: 1789 年 5 月 5 日開幕，6 月 17 日改稱國民議會、6 月 20 日網球場宣誓, b: 1789 年 7 月 14 日攻佔巴士底，7 月 20 日到 8 月 5 日鄉間大恐慌 }
      - { aspect: 誰在行動, a: 第三等級的代表（多半是律師、官員等受過教育的平民）, b: 巴黎群眾與鄉間農民 }
      - { aspect: 用什麼方法, a: 投票、宣誓、要求制定憲法, b: 搶步槍、圍攻監獄、攻擊領主的莊園 }
      - { aspect: 帶來什麼改變, a: 會議從「替國王籌錢」變成「重寫國家規則」, b: 國王被迫承認巴黎的新政府、召回內克；議會在 8 月 4 日夜裡宣布廢除封建制度 }
    question: 議場裡的代表和街頭的群眾，誰比較「推動」了革命？請說出兩邊互相影響的一個例子。
    model_answer: 兩邊是互相推動的。議場先提出了新的說法：不是國王、也不是特權等級，而是「國民」才有權決定國家的規則；但國王罷免內克、調動軍隊時，是巴黎群眾攻佔巴士底，讓國王不得不讓步、承認巴黎的新政府。鄉下的大恐慌，又逼得議會在 8 月 4 日夜裡宣布廢除封建制度。反過來說，街頭的行動也需要議場把它變成法律和宣言，才不只是一場暴動。這題沒有標準答案，重點是看到兩者怎麼一來一往。
    hints:
      - 先看「帶來什麼改變」那一列：議會廢除封建制度，是在哪件事之後？
      - 國王在巴士底之後做了什麼讓步？
      - 想想看：如果只有街頭、沒有議會，或只有議會、沒有街頭，會怎麼樣？
  - type: today
    card: finance-french-royal-debt
    question: 有人說「法國大革命告訴我們，政府欠太多錢就會發生革命」。這個說法哪裡不成立？
    model_answer: 先說不能類比的地方：18 世紀的法國沒有中央銀行、沒有可以自己印的法定紙幣，國王借錢要靠信用、包稅商和賣官；稅是依身分（教士、貴族、平民）而不同，是法律明訂的特權；三級會議一百多年沒開過，沒有民選國會常設監督預算。今天的民主國家有國會審預算、有中央銀行，欠債也不一定會走向革命。可以借來想的是：當「誰該付錢」的規則被大多數人認為不公平，而且又沒有正常的管道可以改規則時，財政問題就可能變成政治問題。
  - type: check
    items:
      - kind: choice
        q: 1789 年三級會議裡，第三等級最主要的要求是什麼？
        options: [每個等級一票, 每人一票，三個等級一起開會, 廢除國王, 把巴士底改成博物館]
        answer: 1
        explain: 教士和貴族要「每個等級一票」，這樣他們兩個等級聯手就能二比一；第三等級人數最多，所以要求「每人一票」、三個等級一起開會。
        hints: [第三等級的人數和另外兩個等級加起來差不多。, 哪一種投票方式對人多的一方比較有利？]
        ref: event-estates-general-1789#C2
      - kind: order
        q: 依時間先後排列：
        items: [內克發表《致國王財政報告》, 顯貴會議擋下卡隆的改革, 三級會議開幕, 網球場宣誓, 攻佔巴士底, 八月四日夜廢除封建制度]
        explain: 1781 年內克的報告 → 1787 年顯貴會議 → 1789 年 5 月 5 日三級會議開幕 → 6 月 20 日網球場宣誓 → 7 月 14 日攻佔巴士底 → 8 月 4 日夜廢除封建制度。
        hints: [財政報告和顯貴會議都在 1789 年以前。, 巴士底在 7 月，廢除封建在 8 月。]
        ref: event-french-revolution#C2
      - kind: short
        q: 用一兩句話說明：為什麼國王需要召開三級會議？
        model: 因為王室為了七年戰爭、美國獨立戰爭借了大量的錢，財政快撐不下去；1787 年想讓所有土地都繳稅，卻被教士和貴族擋下，國王只好召開一百多年沒開過的三級會議來找錢。
        explain: 三級會議本來是國王「找錢」的工具，結果變成第三等級「改規則」的舞台。
        hints: [回去看財政卡：國王的錢出了什麼問題？, 1787 年那次改革為什麼失敗？]
        ref: finance-french-royal-debt#F3
  - type: recap
    model_answer: 法國大革命一開始是一筆帳的問題。王室為了七年戰爭和美國獨立戰爭借了大量的錢，1781 年那本暢銷的財政報告卻讓大家以為國家還有盈餘；1787 年財政總監想讓所有土地都繳稅，被有免稅特權的教士和貴族擋下。國王只好召開 1614 年以來第一次三級會議來找錢，會議卻卡在「每個等級一票」還是「每人一票」。第三等級乾脆改稱國民議會、在網球場宣誓要制定憲法；國王罷免內克後，巴黎群眾攻佔巴士底，鄉下爆發大恐慌，議會在 8 月 4 日夜裡宣布廢除封建制度。要記得兩個提醒：第一，事後看好像是一條直線，但每一步當時都有別的可能；第二，巴士底裡只關了 7 個人，它的意義在於象徵，不在於救出了多少犯人。這是一種參考說法，不是標準答案。
reflect: 第三等級遇到一條對自己不利的規則，選擇不照規則走、自己宣布新規則。你有沒有遇過一條你覺得不公平的規則？你當時是照做、抗議，還是想辦法改它？你覺得什麼時候「不照規則走」是對的？

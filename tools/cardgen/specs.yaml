- { id: event-us-china-trade-war, type: event, track: china, name: 美中貿易戰與科技戰, time: "2018–2026", civ: "美國（冷戰後）, 中華人民共和國, 臺灣（中華民國）", brief: "2018 301條款關稅、華為實體清單2019、2022晶片出口管制與CHIPS法案、台積電赴美設廠、2025關稅升級與2025–2026休戰。修昔底德陷阱框架可用 frameworks: [thucydides-trap]，但要呈現批評。", revise: "把卡片更新到 2026 年 10 月（time.end 改 2026）。只用下列已查證事實與網址，不要自己加事件；查不到的寫「來源不足」或「未知」。(1) 2025-02-01 川普以芬太尼為由依 IEEPA 對中國加徵 10%，3 月 4 日升到 20%；中方反制含鎢等出口管制。(2) 4 月 2 日宣布對等關稅（對中 34%），連環加碼後美方 4 月對中『對等關稅』達 125%、加上芬太尼稅合計約 145%，中方對美 125%；4 月 4 日中國把 7 種中重稀土與相關磁鐵納入出口許可管制。(3) 2025-05-12 日內瓦聯合聲明：美方對等關稅降到 10%（暫停 24 個百分點 90 天）、中方相應降到 10%；一手來源 https://www.whitehouse.gov/briefings-statements/2025/05/joint-statement-on-u-s-china-economic-and-trade-meeting-in-geneva/ ，中國政府英文版 https://english.www.gov.cn/news/202505/12/content_WS6821a0bbc6d0868f4e8f2792.html 。(4) 6 月倫敦會談達成落實框架（稀土出貨恢復）；7 月斯德哥爾摩會談；8 月休戰延長到 11 月 10 日。(5) 9 月 29 日美國商務部 BIS 發布『關聯企業規則』（Affiliates Rule，被列管企業持股 50% 以上的子公司同受管制）；10 月 9 日中國擴大稀土出口管制（含域外適用）；10 月 10 日川普威脅再加 100%。(6) 2025-10-30 川普與習近平在南韓釜山會面，前一週在吉隆坡達成經貿安排：美方把芬太尼關稅從 20% 降到 10%（11 月 10 日生效）、10% 對等關稅維持且較高稅率暫停到 2026-11-10；中方暫停 10 月 9 日的稀土新管制一年並對稀土、鎵、鍺、銻、石墨發一般許可；美方暫停關聯企業規則一年；一手來源 https://www.whitehouse.gov/fact-sheets/2025/11/fact-sheet-president-donald-j-trump-strikes-deal-on-economic-and-trade-relations-with-china/ 。(7) 2026-02-20 美國最高法院 Learning Resources, Inc. v. Trump 判決 IEEPA 不授權總統課關稅（對等關稅與芬太尼關稅失效），一手來源 https://www.supremecourt.gov/opinions/25pdf/24-1287_4gcj.pdf ；美國貿易代表聲明 301、232 等其他關稅維持 https://ustr.gov/about/policy-offices/press-office/press-releases/2026/february/ambassador-greer-issues-statement-supreme-court-ieepa-decision 。川普隨即依 1974 年貿易法第 122 條對所有貿易夥伴課 10% 臨時關稅 150 天（2026-02-24 至 07-24）。(8) 2026-07-24 第 122 條關稅到期，美方改以第 301 條『強迫勞動』調查對 60 個經濟體加徵 10% 或 12.5%，中國為 12.5%，疊加原有 301 關稅；來源 https://www.honigman.com/alert-3462 。(9) 2026 年 5 月川普訪問北京與習近平會談，白宮事實清單稱中方承諾購買美國農產品（2026–2028 年每年至少 170 億美元）、波音飛機等，並處理稀土供應；來源 https://www.whitehouse.gov/fact-sheets/2026/05/fact-sheet-president-donald-j-trump-secures-historic-deals-with-china-delivering-for-american-workers-farmers-and-industry/ 。(10) 2026 年 9 月 20–23 日第八輪經貿磋商（紐約、華盛頓），同意成立美中貿易委員會（Board of Trade）與投資委員會、『30 對 30』互降約 300 億美元商品關稅（約九成降到最惠國稅率，待各自完成國內程序）、成立 AI 對話，並把吉隆坡安排延長到 2027-01-10；習近平 9 月下旬對美國進行國事訪問；來源 中國商務部 https://english.mofcom.gov.cn/News/SignificantNews/art/2026/art_c7903a2767d5475690e6e8d15839d817.html （9 月 28 日發布）與 Wilson Sonsini 分析 https://www.wsgr.com/en/insights/us-china-washington-summit-2026-key-outcomes-and-unfinished-business.html 。(11) 截至 2026 年 10 月，延長到 2027-01-10 的安排已宣布，但查到的分析指出美方尚未以聯邦公報正式延長關聯企業規則的暫停（否則 2026-11-10 恢復），寫成『仍待落實』。其他網址：英文維基百科條目已在 sources。C10 與 why_care 寫明：本卡更新到 2026 年 10 月，之後未知；休戰是暫時安排，結構性競爭（晶片管制、稀土、台灣）仍在。保留原卡 2018–2024 的內容與來源，只改寫 2025 之後、C6／C7／C10、story、misconceptions 中過時的句子。" }
- { id: event-american-founding-philosophy, type: event, track: west, name: 美國立國哲學：啟蒙思想、自然權利與共和主義, time: "1689–1788", civ: "美國（殖民地時期）, 美國（建國初期）, 英國, 法國", brief: "獨立的思想來源卡：洛克《政府論》下篇1689（自然權利：生命、自由、財產；同意統治；反抗權）、孟德斯鳩《論法的精神》1748（三權分立，參考英國憲政）、社會契約論（霍布斯、洛克、盧梭的差異）、蘇格蘭啟蒙、古典共和主義（羅馬共和、公民美德、反腐敗，Bernard Bailyn《美國革命的思想起源》、Gordon Wood）、英國輝格反對派傳統（Cato's Letters）、新教與普通法傳統；如何落到《獨立宣言》1776（『生命、自由與追求幸福』）與憲法1787、《聯邦黨人文集》1787–88（第10篇派系與大共和國、第51篇『野心對抗野心』、麥迪遜/漢彌爾頓/傑伊）。要寫爭議：洛克影響有多大（Bailyn/Wood 共和主義派 vs 洛克自由主義派）、啟蒙理念與奴隸制、原住民、女性被排除的矛盾。一手來源：avalon.law.yale.edu 的獨立宣言與聯邦黨人文集、founders.archives.gov、Project Gutenberg 的洛克《政府論》；學術：Stanford Encyclopedia of Philosophy（plato.stanford.edu）Locke 條目。links 要連 event-declaration-of-independence、event-us-constitution、event-thirteen-colonies、event-french-revolution（若存在）、event-magna-carta（若存在）。" }

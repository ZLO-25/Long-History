- { id: war-war-on-terror, type: war, track: west, name: 九一一事件與反恐戰爭, time: "2001–2021", civ: "美國（冷戰後）, 伊拉克, 阿富汗", brief: "2001九一一、阿富汗戰爭2001–2021、2003伊拉克戰爭（大規模毀滅性武器的錯誤情報）、戰費估計（布朗大學Costs of War）、2021撤出喀布爾；單極時刻的代價。" }

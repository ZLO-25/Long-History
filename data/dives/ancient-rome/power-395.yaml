title: 狄奧多西死後東西分治（395 年）
note: "395 年 1 月狄奧多西一世去世，帝國由兩個兒子分治：十歲的霍諾留得到西部（義大利、高盧、西班牙、不列顛、北非西半與伊利里亞西部），阿卡狄烏斯得到東部（巴爾幹東部、希臘、小亞細亞、敘利亞、埃及與昔蘭尼加）。分界大致沿今日波士尼亞與塞爾維亞之間（德里納河一帶）往南，再到利比亞中部的大敘利亞灣（的黎波里塔尼亞屬西，昔蘭尼加屬東）。當時的人並不把它看成永久分裂，之後東西兩邊還會再統一過幾次；西部在 476 年結束，東部延續到 1453 年（見拜占庭尾聲卡）。東邊的對手是薩珊波斯。以今日國界近似，邊界只是示意；切線理由見 docs/dive-rome.md。"

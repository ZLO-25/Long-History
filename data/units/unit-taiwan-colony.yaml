id: unit-taiwan-colony
title: 日本時代：殖民地的人怎麼爭取權利？
histories: [臺灣史, 日本史, 世界通史]
mystery: 1895 年臺灣成了日本的殖民地。沒有投票權、沒有自己議會的臺灣人，有哪幾種對統治者「說不」的方法？說了以後，各自付出什麼代價？
teaser: 一張請願書、一篇把臺灣當病人的「診斷書」、一場山上的襲擊，和一本猶豫要不要改姓的日記。
goals:
  - 能說出日治時期臺灣人「說不」的幾種方法：請願、文化啟蒙、武裝反抗，以及皇民化下的配合與無法選擇
  - 能用因果鏈說明從 1895 年割臺到 1937 年皇民化運動之間，殖民地政治運動怎麼起落
  - 能比較臺灣議會設置請願運動與霧社事件在手段、訴求、對象、結果上的差異
  - 能判讀蔣渭水〈臨床講義〉，說出他開的「處方」是什麼
  - 能指出拿文化協會比喻今天的公民連署時，哪裡不成立；並能說出霧社事件與皇民化運動的詮釋為什麼有爭議
minutes: 35
steps:
  - type: hook
    text: |
      想像你轉學到一所新學校，校規全部由校長一個人說了算，學生沒有班聯會，也不能投票。
      你不服氣，可以怎麼做？寫聯署信給校長的上級？辦讀書會讓同學搞懂規則？直接翻桌？還是乖乖照做，換取一點福利？
      一百年前的臺灣人，就站在這個選擇題前面。這個單元要看的，就是他們各自選了哪條路，以及每條路的代價。
  - type: card
    id: event-1895-cession
    depth: story
    prompt: 先看臺灣是怎麼變成日本的：一場在朝鮮打的戰爭，為什麼決定了臺灣的命運？讀故事時注意「臺灣民主國」只撐了多久，以及各地的抵抗最後怎麼結束。
  - type: card
    id: event-taiwan-cultural-association
    depth: understand
    prompt: 第一、二種「說不」：請願和文化啟蒙。讀「背景」時注意六三法讓總督可以做什麼；讀「經過」時注意林獻堂和蔣渭水各走哪條路，總督府又用哪一部法律來對付。
  - type: source
    card: event-taiwan-cultural-association
    idx: 0
    question: 蔣渭水在〈臨床講義〉裡把臺灣當成病人。照他的診斷，臺灣的「病因」和「處方」是什麼？
    options:
      - 病因是軍隊太弱，處方是買武器、練新軍
      - 病因是智識的營養不良，處方是大量辦學校、圖書館和讀報社
      - 病因是沒有議會，處方是向帝國議會請願
      - 病因是講漢語，處方是全家改講日語
    answer: 1
    explain: 原文寫「原因：智識的營養不良」，處方是「正規學校教育最大量……圖書館最大量、讀報社最大量」。也就是說，蔣渭水認為臺灣人的第一步是先「長知識」，所以文化協會後來到各地辦文化演講、開讀報社。請願是林獻堂領銜的另一條路，文協同時支持它，但〈臨床講義〉這段處方談的是教育。
    hints:
      - 先找「原因」兩個字後面接的是什麼。
      - 處方裡重複出現的「最大量」，前面都是哪一類東西？
      - 四個選項裡，只有一個全部在講學校、圖書館、讀報社。
    ref: event-taiwan-cultural-association#story
  - type: card
    id: event-wushe-incident
    depth: deep
    prompt: 第三種「說不」：武裝反抗。讀「背景」時注意族人累積了哪些不滿；讀「史家怎麼吵」時注意，毒氣的種類、死亡人數和事件的意義，各方說法都不一樣，卡片把它們並列而不下結論。
  - type: compare
    cards: [event-taiwan-cultural-association, event-wushe-incident]
    prompt: 比一比平地的請願運動與山地的武裝反抗。
    rows:
      - { aspect: 時間, a: 1921–1934 年，前後請願 15 次, b: 1930 年 10 月 27 日起事，到 12 月下旬日方宣告結束；1931 年還有第二次霧社事件 }
      - { aspect: 手段, a: 合法手段：請願書、簽名、文化演講、讀報社、報紙, b: 武裝襲擊：六社約 300 名壯丁攻擊駐在所與運動會會場 }
      - { aspect: 訴求或原因, a: 要求設立臺灣議會，讓臺灣人參與替臺灣立法, b: 長期勞役、獵場被收、習俗被禁，加上「敬酒事件」的導火線（吳密察提醒，原因主要只能從日方史料推測） }
      - { aspect: 對象, a: 東京的帝國議會；在臺灣面對的是總督府, b: 霧社當地的駐在所、日本官吏、警察與眷屬 }
      - { aspect: 統治者的回應, a: 1923 年治警事件全島大逮捕；1931 年禁止臺灣民眾黨結社, b: 出動約 2,000 至 2,800 名軍警（各來源數字不一），以飛機、山砲進攻並投下毒氣彈（種類與效果有爭議） }
      - { aspect: 結果, a: 治警事件最後 13 人有罪，刑度是禁錮三到四個月或罰金；臺灣議會始終沒設立，1934 年停止請願；1935 年半數地方議員改民選，有人視為部分成果, b: 起事六社估計 644 人死亡（各來源數字不一），倖存者被強制遷到川中島；總督與總務長官 1931 年 1 月辭職，理蕃政策被迫檢討 }
    question: 這兩條路在「對象」和「結果」上最大的差別是什麼？兩邊各自想要的東西，最後有沒有得到？
    model_answer: 請願運動用的是合法手段，對象是另一個國家的議會，付出的代價是幹部被逮捕、判刑（最後 13 人有罪），但陳偉智認為治警事件反而成了運動的「成年禮」，維基整理的研究也指出審判被報導後參與者再度增加。霧社事件是武裝襲擊，對象是當地的駐在所與日本人，統治者用軍隊、飛機、毒氣彈鎮壓，起事六社超過一半的人死亡，倖存者被遷離原居地。兩邊想要的東西都沒有直接得到：臺灣議會從未設立，霧社的族人也沒有拿回原來的生活；只是請願運動留下了結社、演講和選舉的練習，霧社事件則迫使總督辭職、理蕃政策被檢討。
    hints:
      - 先看「手段」那一列：哪一邊是法律允許的、哪一邊不是？
      - 再看「結果」那一列的數字：13 人有罪，對上估計 644 人死亡。
      - 最後問自己：臺灣議會設了嗎？霧社的族人回到原來的部落了嗎？
  - type: chain
    prompt: 把下列事件依照「因 → 果」排成一條鏈（最上面是最早的原因）。
    items:
      - 清日為了朝鮮開戰，清朝大敗，1895 年馬關條約把臺灣割讓給日本；臺灣民主國與各地義軍抵抗半年後失敗
      - 1896 年《六三法》讓臺灣總督可以自己立法，臺灣人沒有議會可以參與
      - 臺灣人從武裝抗日轉向合法的政治運動：1921 年林獻堂領銜請願設臺灣議會，蔣渭水成立臺灣文化協會
      - 1923 年總督府以治安警察法全島大逮捕（治警事件）；1927 年文協分裂
      - 1930 年霧社事件爆發，總督府以軍隊鎮壓，理蕃政策被迫檢討
      - 1937 年中日戰爭爆發，皇民化運動全面展開，臺灣人被要求「變成日本人」並被納入戰爭動員
    explain: 清朝在甲午戰爭大敗，1895 年馬關條約把臺灣割給日本，臺灣民主國和各地義軍的武裝抵抗也在半年內失敗；隔年六三法讓總督一個人說了算，才有後來「要一個臺灣議會」的請願；請願與文協是從武裝抗日轉向合法運動的起點，總督府用治安警察法壓制，運動自己也在 1927 年分裂。注意：霧社事件是山地原住民族另一條線上的反抗，不是文協分裂的結果，但它和平地的運動一樣，都遇到殖民政府的強硬回應。到了 1937 年戰爭爆發，總督府不再只是壓制「說不」的人，而是要求所有人「說是」。
    hints:
      - 最早的一件事要解釋「日本為什麼會拿到臺灣」，答案在 1895 年那張卡的故事裡。
      - 請願運動是為了改哪一部法律造成的局面？那部法律要排在請願前面。
      - 霧社在 1930 年，皇民化在 1937 年，是最後兩件。
    ref: event-taiwan-cultural-association#C1
  - type: card
    id: event-taiwan-kominka
    depth: deep
    prompt: 第四種處境：戰爭來了，「說不」的空間幾乎消失，剩下「配合」或「無法選擇」。讀故事時注意吳新榮的日記；讀「史家怎麼吵」時注意「改姓名是自願還是被迫」和「臺籍日本兵是犧牲者還是加害者」這些問題，學者並沒有一致答案。
  - type: decision
    role: 你是 1920 年底的林獻堂
    situation: |
      日本統治臺灣已經二十五年。1896 年的《六三法》讓總督可以自己立法，臺灣人沒有議會。
      東京的臺灣留學生從 1918 年起發起撤廢六三法運動；但林呈祿提醒你，撤廢六三法等於接受「內地延長主義」，也就是被同化成日本人。
      你是霧峰的地主，有名望、有人脈。你要把運動帶往哪個方向？
    options:
      - { label: 向帝國議會請願，要求設立臺灣議會, result: 這是林獻堂當年的選擇。1921 年 1 月第一次請願書送到帝國議會，之後一共請願 15 次；總督府 1923 年以治安警察法全島大逮捕，臺灣議會始終沒有設立，1934 年請願運動停止。1935 年總督府開放半數地方議員民選，有人視為部分成果，周婉窈則提醒運動的目標本身從未實現。 }
      - { label: 繼續要求撤廢六三法，接受內地延長, result: 推測：林呈祿認為這等於接受同化；總督府本來就在推內地延長主義，運動可能失去「臺灣人要自己的議會」這個目標。歷史沒有走這條路，所以後果只能推測。 }
      - { label: 放棄合法手段，走武裝反抗, result: 推測：卡片指出 1920 年代的運動正是從武裝抗日轉向合法政治運動的起點；1930 年山地的霧社事件則顯示武裝反抗會遭到軍隊鎮壓。平地的運動若走這條路會怎樣，歷史沒有走這條路，所以後果只能推測。 }
    actual: 林獻堂選擇請願。請願運動與文化協會讓臺灣人第一次大規模練習結社、演講、辦報，催生了第一個臺灣人政黨（臺灣民眾黨），但臺灣議會始終沒有成立。
    ref: event-taiwan-cultural-association#C1
    note: 「沒有發生的選項」的後果都是推測，標示清楚。
  - type: today
    card: event-taiwan-cultural-association
    question: 有人說「文化協會的演講和議會請願，就像今天的公民連署和社會運動」。這個比喻哪裡不成立？
    model_answer: 當年的臺灣人在殖民體制下沒有普選權，請願的對象是另一個國家的議會，而且總督府可以直接用治安警察法禁止結社、逮捕幹部；同一部法律在東京允許期成同盟會成立，在臺灣卻禁止。今天的公民連署發生在有普選和言論自由保障的制度裡，政府不能因為你簽名就把你抓起來。所以不能直接類比。可以借來想的是：一群沒有投票權的人，怎麼用演講、媒體和簽名向有權者施壓；以及「同一部法律在不同地方執行寬嚴不一」這件事，今天還看不看得到。
  - type: check
    items:
      - kind: choice
        q: 皇民化運動鼓勵臺灣人改日本姓名。到 1943 年底，實際改了姓名的人大約占人口多少？
        options: [幾乎全部, 約一半, 約 2%, 沒有人改]
        answer: 2
        explain: 改姓名採申請許可制，到 1943 年底約 12.6 萬人、約占人口 2%。所以「皇民化等於所有臺灣人都改了日本名字」是常見的誤解；但學者也指出，公職人員和社會菁英承受很大壓力，改了姓的人配給比較多，「自願還是被迫」仍有爭論。
        hints: [回去看皇民化卡的「常見誤解」。, 吳新榮認真設計過新姓，最後有沒有申請？這提醒你改姓不是全面強制的。]
        ref: event-taiwan-kominka#C2
      - kind: order
        q: 依時間先後排列：
        items: [臺灣被割讓給日本, 臺灣文化協會成立, 治警事件全島大逮捕, 霧社事件, 皇民化運動全面展開, 日本投降]
        explain: 1895 割臺 → 1921 文協成立 → 1923 治警事件 → 1930 霧社事件 → 1937 皇民化 → 1945 日本投降。
        hints: [割臺是 1895 年馬關條約；文協成立兩年後，總督府才用治安警察法大逮捕。, 霧社事件在 1930 年，皇民化是中日戰爭爆發後的 1937 年。]
        ref: event-taiwan-cultural-association#C2
      - kind: short
        q: 用一兩句話說明：霧社事件的詮釋為什麼有爭議？請至少說出兩種不同的看法。
        model: 戰後臺灣先把霧社事件寫成「抗日」英雄史；近年原住民族研究則更強調殖民法律的不法、族群內部的分裂與轉型正義。例如陳慧先指出倖存族人長期沉默，漢人中心的敘事把事件寫成「抗日」；賽德克族後裔 Bakan Bawan 強調口傳才是族人記憶的核心。另外，毒氣的種類和死亡人數，各來源的說法也不一樣。
        explain: 這些看法要並列，不要把其中一種當成定論。吳密察還提醒，起事的原因只能從鎮壓方（日本）的史料推測，這是研究上的根本困難。
        hints: [回去看霧社卡的「長期影響」和「史家怎麼吵」最後一段。, 想想「抗日英雄」和「轉型正義」這兩種講法，看事件的角度有什麼不同？]
        ref: event-wushe-incident#C7
  - type: recap
    model_answer: |
      被殖民的臺灣人至少有這幾種「說不」的方法。一是請願：林獻堂領銜向帝國議會請願 15 次，要求設臺灣議會，合法但沒有成功。二是文化啟蒙：蔣渭水的文化協會用演講、讀報社和報紙讓一般人接觸新知，總督府用治安警察法逮捕幹部，運動自己也在 1927 年分裂。三是武裝反抗：1930 年霧社的賽德克族六社襲擊駐在所與運動會，被軍隊、飛機與毒氣彈鎮壓，估計 644 人死亡（各來源數字不一），倖存者被遷到川中島。四是 1937 年以後，戰爭來了，「說不」的空間幾乎消失：改姓名、講日語、當志願兵或被徵兵，有人配合、有人像吳新榮一樣猶豫到最後，也有很多人根本無法選擇。
      最後提醒兩件事。霧社事件到底是「抗日」英雄史，還是要從殖民法律的不法、族群內部分裂與轉型正義來看，不同的人看法不同；毒氣和死亡人數的說法也不一致。皇民化運動裡的改姓名是自願還是被迫、臺籍日本兵是犧牲者還是加害者，學者也沒有一致答案。這些看法要並列，不要把任何一種當成定論。

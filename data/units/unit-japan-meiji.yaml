id: unit-japan-meiji
title: 黑船來了：日本和清朝為什麼走出不同的路？
histories: [日本史, 中國史, 世界通史]
mystery: 1850–60 年代，日本和清朝幾乎同時開始學西方。三十年後，日本打敗了清朝。差別到底在哪裡？
teaser: 四艘軍艦（其中兩艘冒著黑煙的蒸汽船），讓一個兩百年限制對外往來的國家開始大改造。
goals:
  - 能說出江戶日本「鎖國」的真實樣貌，以及為什麼 1853 年後必須開國
  - 能判讀美國總統國書與《五條御誓文》，說出各自想要什麼
  - 能比較明治維新與自強運動，說出至少兩個差異
  - 能指出「日本成功、中國失敗」這種說法太簡單的地方
minutes: 35
steps:
  - type: hook
    text: |
      兩個同學在同一年發現自己數學落後很多。一個請了家教、只練計算題；另一個乾脆把整個讀書方法、作息、時間表都改掉。
      三十年後兩人比賽，結果大家都知道了。可是，真的只是「誰比較努力」的問題嗎？
      19 世紀中葉的日本和清朝，就是這兩個同學。
  - type: card
    id: event-sakoku
    depth: story
    prompt: 先看日本「關門」的那兩百年。注意：門真的全關上了嗎？
  - type: card
    id: event-black-ships
    depth: story
    prompt: 1853 年，有人來敲門了。注意幕府怎麼回應，以及這個回應帶來什麼後果。
  - type: source
    card: event-black-ships
    idx: 0
    question: 從美國總統的國書可以看出，美國這次來日本最想得到什麼？
    options:
      - 占領日本的領土
      - 通商、船隻的煤炭和糧食補給，以及保護遇難船員
      - 要求日本改信基督教
      - 請日本幫忙攻打清朝
    answer: 1
    explain: 國書列出四件事：友好、通商、煤炭與糧食補給、保護遇難船員。當時美國的船要橫越太平洋，需要沿途有港口可以補給。但讀這份史料也要注意：國書寫得客氣，培理卻帶著軍艦來，而且他接到的命令允許在必要時動用武力；文字和行動要一起看。
    hints:
      - 直接找國書裡列出的名詞：friendship、commerce、coal、provisions……
      - 蒸汽船要靠什麼才能走？
      - 這份文件是寫給誰的？語氣是命令還是請求？
    ref: event-black-ships#C1
  - type: card
    id: event-meiji-restoration
    depth: understand
    prompt: 讀「經過」時注意：日本改掉了哪些「舊制度」（藩、武士俸祿、兵役），而不只是買了新武器？
  - type: chain
    prompt: 把下列事件依照「因 → 果」排成一條鏈（最上面是最早的原因）。
    items:
      - 培理率黑船來到浦賀，要求開國
      - 幕府徵詢大名意見卻得不到共識，顯得軟弱
      - 薩摩、長州等反幕府勢力抬頭
      - 1868 年王政復古，戊辰戰爭打敗舊幕府
      - 廢藩置縣、徵兵制、取消武士俸祿
    explain: 外部壓力 → 幕府威信下降 → 反對勢力壯大 → 政權更替 → 新政府全面改造制度。注意：這條鏈說明的是壓力怎麼一層層傳下去，不代表每一步都「必然」發生。
    hints:
      - 最早的一步是外國人來了。
      - 幕府「問大家意見」這件事，為什麼反而讓它更弱？
      - 要先換掉政府，才能大規模改制度。
    ref: event-meiji-restoration#C1
  - type: source
    card: event-meiji-restoration
    idx: 0
    question: 《五條御誓文》說「應向全世界求取知識，以鞏固皇國的基礎」。這句話透露了新政府的什麼想法？
    options:
      - 學西方是為了讓日本變成西方國家
      - 學全世界的知識，目的是讓天皇統治的國家更穩固
      - 日本要放棄天皇制度
      - 日本應該繼續鎖國
    answer: 1
    explain: 前半句是手段（向全世界學），後半句是目的（鞏固皇國）。明治政府學西方，不是為了變成西方，而是要讓以天皇為中心的新國家更強。讀史料時，一句話常常同時有「手段」和「目的」，要分開看。
    hints:
      - 把句子拆成兩半：「求取知識」和「鞏固皇國」，哪一個是手段、哪一個是目的？
      - 這是誰頒布的？他會想削弱自己嗎？
      - 頒布時間是 1868 年，剛推翻幕府不久。
    ref: event-meiji-restoration#C2
  - type: card
    id: event-self-strengthening
    depth: understand
    prompt: 同一時期的清朝也在學西方。讀完想想看：它改了什麼？沒改什麼？
  - type: compare
    cards: [event-meiji-restoration, event-self-strengthening]
    prompt: 比一比明治維新和自強運動。
    rows:
      - { aspect: 時間, a: 1868–1889 年, b: 約 1861–1895 年 }
      - { aspect: 誰推動, a: 推翻幕府後的中央新政府, b: 恭親王與曾國藩、李鴻章、左宗棠等地方大員 }
      - { aspect: 改了什麼, a: 廢藩置縣、徵兵制、取消武士特權、頒布憲法, b: 設總理衙門、辦兵工廠、造船廠、學堂 }
      - { aspect: 沒改什麼, a: 保留並強化天皇的地位, b: 科舉與朝廷體制大致不變 }
    question: 兩邊最大的差別是什麼？為什麼「日本成功、中國失敗」這個說法太簡單？
    model_answer: 最大的差別是改革的範圍：日本換掉了舊政府，從中央全面改造政治、軍事和社會制度；清朝主要由地方大員引進技術，朝廷體制大致不變。但「日本成功、中國失敗」太簡單，因為艾爾曼指出，1880 年代以前中國的兵工廠和造船廠還被認為比日本先進，1894 年北洋艦隊的實力也大約等於日本整支艦隊；是 1895 年的戰敗讓大家把結果「倒著讀」，好像勝負早就注定。
    hints:
      - 看「誰推動」和「改了什麼」兩列：一邊是中央、一邊是地方。
      - 回去看自強運動卡的「史家怎麼吵」，艾爾曼怎麼說？
      - 想想看：知道結局之後回頭看，會不會覺得一切都是注定的？
  - type: decision
    role: 你是 1854 年初的幕府老中阿部正弘
    situation: |
      培理帶著八艘軍艦回來了，要求簽約。你問過各地大名，贊成和反對的一樣多，唯一的共識是要加強海防，但海防不是一年半載就能建好的。
      清朝十多年前在鴉片戰爭中被英國打敗的消息，你也聽說了。你會怎麼做？
    options:
      - { label: 簽約，開放少數港口, result: 這是幕府當年的選擇。1854 年 3 月 31 日簽訂《神奈川條約》，開放下田、箱館。日本避免了戰爭，但幕府「被迫開國」的形象讓反對勢力壯大，十多年後幕府被推翻。 }
      - { label: 拒絕簽約，準備開戰, result: 推測：日本當時沒有能對抗蒸汽軍艦的海軍，開戰很可能失利，像清朝一樣被迫簽下更不利的條約。歷史沒有走這條路，所以後果只能推測。 }
    actual: 幕府選擇簽約。這避免了一場打不贏的戰爭，卻讓幕府威信大跌；1868 年明治新政府成立，開始全面改造國家。
    ref: event-black-ships#C2
    note: 「沒有發生的選項」的後果都是推測，標示清楚。
  - type: today
    card: event-meiji-restoration
    question: 有人說「國家要進步，就要學明治維新，全面西化」。這個說法哪裡不成立？
    model_answer: 明治維新靠的是推翻舊政權、內戰，以及一口氣廢除整個武士階級的特權，代價很大；它不是在既有民主制度下推動的政策改革。而且明治政府學西方是為了強化天皇的國家，後來也走向軍事擴張。今天談改革，可以參考「制度比技術重要」這一點，但不能把明治的做法直接套用到現代國家。
  - type: check
    items:
      - kind: choice
        q: 關於江戶日本的「鎖國」，下列哪一句正確？
        options: [日本完全不和任何外國往來, 日本只透過長崎、對馬、薩摩、松前四個窗口和外界往來, 「鎖國」是幕府當時的正式名稱, 荷蘭人和葡萄牙人都可以在長崎貿易]
        answer: 1
        explain: 江戶日本透過「四口」和中國、荷蘭、朝鮮、琉球、愛努往來；「鎖國」這個詞 1801 年才出現；葡萄牙人在 1630 年代被驅逐，只有荷蘭人可以留在出島。
        hints: [回去看鎖國卡的「迷思」。, 哪一個國家的人被趕走了？]
        ref: event-sakoku#C4
      - kind: order
        q: 依時間先後排列：
        items: [培理第一次來航, 總理衙門成立, 王政復古, 廢藩置縣, 甲午戰爭清朝戰敗]
        explain: 1853 培理來航 → 1861 總理衙門 → 1868 王政復古 → 1871 廢藩 → 1895 甲午戰敗。
        hints: [培理來航比清朝成立總理衙門早幾年。, 甲午戰爭是兩國改革的「期末考」。]
        ref: event-meiji-restoration#C2
      - kind: short
        q: 用一兩句話說明：為什麼培理來航會讓幕府的統治動搖？
        model: 因為幕府打不過蒸汽軍艦，只好簽約開國；它又破天荒地徵詢大名意見卻得不到共識，顯得軟弱猶豫，讓反幕府的薩摩、長州等勢力抬頭。
        explain: 外部壓力本身不會推翻政府，是政府應對的方式暴露了它的弱點。
        hints: [回去看黑船卡的「史家怎麼吵」。, 61 份回覆，贊成和反對各多少？]
        ref: event-black-ships#C7
  - type: recap
    model_answer: 一個重要差別是改革的深度：日本在黑船來航後推翻幕府，由新的中央政府全面改造政治、軍事、社會制度；清朝的自強運動主要由地方大員引進技術，朝廷制度大致不變。但「日本成功、中國失敗」不能只看結局倒著推：1880 年代以前，清朝的造船廠和艦隊並不比日本差。歷史的結果，常常是許多選擇和偶然一起造成的。

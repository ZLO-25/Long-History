  # ---------- 第 4 期：今日對照層用的海路（年份在時間軸範圍外，歷史地圖不會顯示） ----------
  - id: today-sea-black-sea-grain
    name: 今日黑海穀物海路（敖德薩—博斯普魯斯—達達尼爾—愛琴海）
    kind: sea
    start: 2023
    end: 2026
    precision: attested-ports

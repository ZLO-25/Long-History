id: unit-taiwan-democracy
title: 從戒嚴到投票：臺灣的民主是怎麼來的？
histories: [臺灣史, 世界通史]
mystery: 今天的臺灣人每四年投票選總統。但第一次總統直選是 1996 年，距離 1945 年戰爭結束已經過了半個世紀。中間這五十年，發生了什麼？
teaser: 一場查緝私菸的衝突、一紙用了 38 年的戒嚴令、一本雜誌、一個「違法」成立的政黨：投票權是一步一步拆出來的。
goals:
  - 能用「戰後通膨與管制 → 二二八 → 戒嚴與白色恐怖 → 黨外與美麗島 → 解嚴 → 直選」的因果鏈說明臺灣民主化的過程
  - 能判讀二二八處理委員會的一條要求，說出他們想要什麼
  - 能比較「土地改革」與「民主化」兩種改變：一個是政府主動給的，一個是人民爭來的
  - 能說出白色恐怖受害人數、民主化功勞這兩個爭議各有哪些說法，而不是只記一種答案
  - 能指出把今天的「限制」比作戒嚴時，哪裡不成立
minutes: 35
level: 國中
curriculum: ["歷 Fa-IV-1", "歷 Fa-IV-2", "歷 Db-V-2"]
steps:
  - type: hook
    text: |
      想像你的學校宣布「特殊狀況」：教官可以隨時搜書包、社團停止活動、校刊停刊；班長是小一那年選的，之後十幾年都不用重選。
      這個「特殊狀況」一宣布，就是 38 年。
      1949 年到 1987 年的臺灣，就是這樣：集會、辦報、組黨都受限制，國會不改選，總統由不改選的國民大會一再選出。
      為什麼會變成這樣？又是怎麼一步一步拆掉的？我們從戰爭剛結束的那幾年開始看。
    guess:
      q: "1947 年，各地仕紳組成處理委員會，向行政長官陳儀提出三十二條要求。你覺得陳儀最可能怎麼回應？（沒有對錯，先憑直覺選。）"
      options:
        - "接受大部分要求，答應制定省自治法"
        - "拒絕這些要求，並多次請南京派兵來"
        - "只答應撤銷專賣局，其他的都不談"
        - "先口頭答應，等風波過了再慢慢處理"
      reveal: "陳儀拒絕了這些要求。3 月 8 日起，增援部隊登陸，展開鎮壓與「清鄉」，許多地方菁英被捕或遇害。事件後行政長官公署改成省政府，但省自治法、民選縣市長等要求並沒有實現；死亡人數至今沒有定論，各種估計差距很大。"
  - type: card
    id: finance-taiwan-1949-currency
    depth: story
    prompt: 先看戰後的臺灣有多難過日子：注意「錢是從哪裡多出來的」，以及最後要用多少舊臺幣才能換一元新臺幣。這是二二八發生前的生活背景。
    focus: [F2]
    quick:
      - q: "戰後臺灣的鈔票為什麼越印越多？"
        a: "政府和公營事業缺錢，就叫臺灣銀行多印鈔票來付。臺灣銀行先是替公營事業放款，後來替中央墊付軍公經費；陳誠 1949 年說這筆墊款已達新臺幣發行總額的九成。"
      - q: "鈔票的面額越印越大，說明了什麼？"
        a: "說明錢越來越不值錢、物價不斷飛漲：舊臺幣最後出現一萬元面額，甚至印出一百萬元面額的鈔券（是否正式發行各來源說法不一）。到 1949 年 6 月，政府宣布四萬元舊臺幣換一元新臺幣。"
  - type: card
    id: event-228-incident
    depth: understand
    prompt: 讀「背景」時注意米糧統制和專賣局，想想為什麼一次查緝私菸會引爆全島。再看「經過」：處理委員會提出三十二條之後，陳儀怎麼回應？接著發生了什麼？
    focus: [C1, C2]
    quick:
      - q: "為什麼一次查緝私菸的衝突，會引爆全島？"
        a: "接收後，行政長官公署集行政、立法、司法、軍事大權於一身；沿用米糧統制，專賣局與貿易局獨占菸酒與進出口，物價失控、米荒、失業嚴重，加上軍紀、貪污與語言隔閡，不滿一路累積。查緝私菸的衝突與開槍，成了導火線。"
      - q: "處理委員會提出要求以後，陳儀怎麼回應？接著發生了什麼？"
        a: "陳儀拒絕了要求。3 月 8 日起增援部隊登陸，展開鎮壓，後來又有「清鄉」，許多地方菁英被捕或遇害；清鄉到 5 月中告一段落。"
  - type: source
    card: event-228-incident
    idx: 0
    question: 處理委員會向陳儀提出的三十二條要求，第一條要的是什麼？
    options:
      - 要求陳儀立刻下台，改由別人接任長官
      - 要求撤銷專賣局，不再獨占菸酒的買賣
      - 要求制定省自治法，作為最高規範
      - 要求軍隊全部退出臺灣，不再駐守各地
    answer: 2
    explain: 「provincial autonomy law」就是「省自治法」，「supreme norm」就是「最高規範」：處理委員會把「臺灣的事由臺灣人自己依法管」放在第一條。但讀史料要看後續：陳儀拒絕了這些要求，3 月 8 日增援部隊登陸鎮壓；事件後行政長官公署雖然改成省政府，省自治法、民選縣市長並沒有實現，1949 年反而進入戒嚴。
    hints:
      - 抓關鍵字：autonomy 是「自治」，這一條在談誰來管臺灣的事。
      - 「supreme norm for political affairs within this province」是說這部法在本省政治裡的地位。
      - 選項裡只有一個在講「訂一部法律」。
    ref: event-228-incident#C4
    why_wrong:
      - "三十二條的第一條談的是制定省自治法，不是要求陳儀下台。"
      - "撤銷專賣局在「經濟政策」部分，是第 4 條，不是第一條。"
      - null
      - "第一條談的是制定省自治法，不是軍隊退出。"
    critique:
      question: "這一條是處理委員會 1947 年 3 月 7 日提出的要求，英譯收在 Kerr 的書裡。關於這份史料，哪個判斷最穩妥？"
      options:
        - "它證明陳儀同意這項要求，所以省自治法很快就制定了"
        - "它是陳儀政府發布的政策文件，說明當局想怎麼治理臺灣"
        - "它證明事件後省自治法與民選縣市長很快就實現了"
        - "它能說明處理委員會想要什麼，但不能證明這些要求被接受"
      answer: 3
      explain: "這是處理委員會（由各地仕紳組成）提出的要求，反映的是他們的主張，不是政府的政策。它能說明他們想要「臺灣的事依法由臺灣人管」，但是不是被接受，要看後續：卡片寫到陳儀拒絕了這些要求，事件後省自治法、民選縣市長等也沒有實現。"
      why_wrong:
        - "卡片寫到，陳儀拒絕了這些要求，後來軍隊登陸、展開鎮壓。"
        - "這是處理委員會向陳儀提出的要求，不是政府發布的文件。"
        - "卡片寫到，事件後省自治法、民選縣市長等要求並沒有實現。"
        - null
  - type: card
    id: event-taiwan-martial-law
    depth: deep
    prompt: 這張卡橫跨 47 年。先看戒嚴令限制了什麼、白色恐怖怎麼運作；再看黨外人士用什麼方法集結。最後讀「史家怎麼吵」：白色恐怖的受害人數為什麼有好幾種數字？民主化的功勞，兩種說法各怎麼講？
    focus: [C1, C2, debate]
    quick:
      - q: "白色恐怖的受害人數，為什麼有好幾種數字？"
        a: "因為算法和定義不同。促轉會資料庫算的是「受裁判紀錄」，有一萬三千多筆，未經審判就被殺害或失蹤的人不在裡面；行政院引法務部統計，說受難者約 14 萬人；國家人權博物館的受難者名錄，到 2025 年約 1.2 萬人。哪個數字「對」，取決於怎麼定義受害。"
      - q: "關於民主化是誰的功勞，有哪兩種說法？"
        a: "一種強調蔣經國晚年主動放手，解嚴、開放黨禁報禁確實是他的決斷；另一種強調由下而上的壓力，黨外運動從雷震組黨、美麗島事件到民進黨成立，一步步逼政府讓步，國際壓力也讓判決較輕。兩種說法要並列著看。"
  - type: chain
    prompt: 把下列事件依先後排成一條鏈（最上面是最早的）。排的時候想一想：哪些是前一件促成後一件，哪些只是接著發生？
    items:
      - 戰後政府沿用米糧統制、專賣局獨占菸酒，物價飛漲、失業嚴重，不滿一路累積
      - 查緝私菸引爆二二八；處理委員會的要求被拒絕，軍隊登陸鎮壓，一代本土菁英消失
      - 陳誠宣布全臺戒嚴，政府以「叛亂」「匪諜」罪名審判大量平民（白色恐怖）
      - 戒嚴下不准組新政黨，反對者只能以「黨外」身分辦雜誌、參選；美麗島事件後八人被軍法審判
      - 民進黨「違法」成立，政府起初不承認、蔣經國隨後默許，沒有取締；隨後宣告解嚴
      - 終止動員戡亂、萬年國會退職，後來第一次總統直選
    explain: 通膨與管制讓不滿累積，一次小衝突引爆二二八；鎮壓之後社會噤聲，1949 年戒嚴把「非常狀態」變成長期統治。反對者在戒嚴下只能用雜誌和選舉集結，美麗島事件是衝突的高點；1986 年政府沒有抓組黨的人，隔年解嚴。但解嚴不等於馬上民主：動員戡亂 1991 年才終止，國會 1992 年才全面改選，總統 1996 年才直選。
    hints:
      - 最早的原因和「生活過不下去」有關：先找物價和米糧那一項。
      - 二二八之後，社會是變得更自由，還是更不自由？戒嚴應該排在二二八之後。
      - 民進黨成立在解嚴前一年；解嚴之後還要再等九年才直選總統。
    ref: event-taiwan-martial-law#C2
    followup:
      question: "鏈上「二二八 → 戒嚴」這一步，不是前一件直接造成後一件。依卡片，直接促成 1949 年戒嚴的是什麼？"
      options:
        - "二二八事件後的鎮壓，讓臺灣社會噤聲、不敢反對"
        - "內戰失利、大批軍民遷臺，臺灣被當成反攻基地"
        - "戰後物價飛漲、米荒與失業，民間的不滿一路累積"
        - "黨外人士辦雜誌、參選，反對的力量越集結越多"
      answer: 1
      explain: "卡片寫到：國共內戰失利、大批軍民遷臺，政府把臺灣視為「反攻基地」，用非常手段控制社會成為常態。二二八之後社會噤聲，卡片寫的是背景：政府實施戒嚴時，民間已難以反抗；卡片沒有說是二二八造成戒嚴。所以鏈上相鄰的兩件事，不一定是前一件造成後一件。"
      why_wrong:
        - "卡片把它寫成背景：社會噤聲讓民間難以反抗，但沒有寫成戒嚴的直接原因。"
        - null
        - "這是二二八事件的背景；卡片沒有把它寫成 1949 年戒嚴的原因。"
        - "黨外運動是戒嚴之後才出現的，時間在後面。"
  - type: card
    id: event-taiwan-land-reform
    depth: understand
    prompt: 同樣是 1949 年陳誠當省主席時開始的另一件大事。讀「背景」時注意：政府為什麼主動想推動土地改革？
    focus: [C1]
    quick:
      - q: "政府為什麼主動想推動土地改革？"
        a: "戰後七成以上的農戶是佃農或半自耕農，常把收成的一半以上交給地主。1949 年內戰失利、又碰上惡性通膨和缺糧，陳誠把減租當成穩定農村、爭取農民支持的第一步；學者也指出還有孫中山「平均地權」的理念，以及美國的壓力與協助。"
      - q: "「三七五減租」是什麼意思？"
        a: "佃農交給地主的地租，最多只能是收成的 37.5%，租約要寫成書面、至少六年。受益佃農約 29.6 萬戶，占全部農戶四成多。"
  - type: compare
    cards: [event-taiwan-land-reform, event-taiwan-martial-law]
    prompt: 比一比兩種「改變」：土地改革是政府主動給的，民主化是人民爭來的，但也沒有這麼簡單。
    rows:
      - aspect: 時間
        a: 1949 年減租、1951 年公地放領、1953 年耕者有其田，前後約五年
        b: 1949 年戒嚴到 1987 年解嚴共 38 年；1996 年才第一次總統直選
      - aspect: 誰推動
        a: 省主席陳誠主持省政府推動；美援支持的農復會提供經費與技術
        b: 黨外人士辦雜誌、參選、組黨（雷震、《美麗島》雜誌、民進黨）；1986 年蔣經國默許民進黨成立、1987 年宣告解嚴；1991 年李登輝終止動員戡亂
      - aspect: 政府為什麼做
        a: 穩定農村、爭取農民支持；廖彥豪與瞿宛文認為還有孫中山「平均地權」的理念、國共競爭下爭取農民，以及美國的壓力與協助
        b: 有爭議：一種說法強調蔣經國晚年主動放手；另一種強調黨外運動由下而上一步步逼政府讓步，國際壓力也讓判決較輕
      - aspect: 誰付出代價
        a: 中小地主拿到的債券與股票縮水、多半賤賣；農民同時被「肥料換穀」以不利比率換走稻穀
        b: 被處決、監禁、失蹤的政治受難者及其家屬，人數估計從約 1.2 萬到 14 萬，依定義不同
      - aspect: 結果
        a: 1953 年底完成徵收放領，近 19.5 萬戶佃農成為自耕農；自耕農比例各來源估計不一（一項統計是純自耕農戶從 1952 年的 38% 升到 1953 年的 55%，也有文獻說含半自耕農八成以上）；部分地主家族轉向工商業
        b: 解嚴、開放黨禁與報禁、國會全面改選、總統直選；所有公民取得組黨、選舉與言論自由
    question: 同樣在 1949 年開始，為什麼土地改革約五年就完成，民主化卻要將近五十年？請至少說出一個原因。
    model_answer: 土地改革是政府自己想做的事：它能穩定農村、爭取農民支持，美國也支持，所以政府可以用一紙命令推動，付出代價的是地主。民主化要拆的卻是執政者自己的權力（戒嚴、黨禁、萬年國會），政府沒有理由主動放手；戒嚴卡的「今日對照鉤子」提醒，這種以「非常狀態」為名的體制，往往要在外部壓力、內部運動與執政者計算三者交會下，才分好幾個階段拆掉。至於最後放手的功勞是蔣經國主動、還是黨外逼出來的，史家仍有不同看法。
    points:
      - "土地改革是政府自己想做的事：穩定農村、爭取農民支持，美國也支持，付出代價的是地主，所以可以用一紙命令推動"
      - "民主化要拆的是執政者自己的權力（戒嚴、黨禁、萬年國會），政府沒有理由主動放手"
      - "這類緊急體制往往要在外部壓力、內部運動與執政者計算三者交會下，分好幾個階段才拆掉"
      - "最後放手的功勞是蔣經國主動、還是黨外逼出來的，史家仍有不同看法"
    hints:
      - 先看「誰推動」和「政府為什麼做」兩列：哪一個改變是政府自己想要的？
      - 想想看：土地改革動的是地主的利益，民主化動的是誰的利益？
      - 戒嚴卡的「今日對照鉤子」說，拆除緊急體制通常需要哪三件事交會？
  - type: decision
    role: 你是 1986 年 9 月的蔣經國
    situation: |
      戒嚴已經實施 37 年。9 月 28 日，黨外人士在臺北圓山大飯店宣布成立民主進步黨，依當時的法律，這是違法的。
      過去政府的做法很清楚：1960 年雷震籌組反對黨，被軍法判刑十年；1979 年美麗島事件後八人被軍法審判。
      但美麗島審判時美國曾表達關切，黨外人士靠雜誌和選舉越集結越多。你會怎麼做？
    options:
      - label: 不取締，接著宣布解嚴
        result: 這接近蔣經國當年的做法：政府起初採「不承認」政策，他隨後默許、沒有抓人，並在國民黨中常會上說「時代在變，環境在變，潮流也在變」；1987 年 7 月 14 日發布總統令，15 日零時起解嚴，但解嚴前先通過《國家安全法》維持部分限制，報禁要到 1988 年才開放。
      - label: 比照雷震案與美麗島事件，逮捕組黨的人送軍法審判

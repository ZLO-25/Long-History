id: unit-aod-1
title: 兩種出海：鄭和的寶船和葡萄牙的小帆船
histories: [世界通史, 歐洲史, 中國史, 東南亞史, 美洲史]
mystery: 15 世紀，明朝的鄭和與葡萄牙的達伽馬，都是國家出資、橫渡印度洋，到了印度西南岸的古里。為什麼鄭和之後明朝收手，葡萄牙卻一路蓋堡壘、占港口？
teaser: 一支三百多艘船的龐大艦隊，一支只有四艘船的小船隊；一座被葡萄牙攻下的海峽港口，和一個沒有出兵的明朝。
goals:
  - 能比較鄭和與達伽馬船隊的規模、目的與後來的走向，說出兩者為什麼不同
  - 能判讀鄭和的碑文，說出它能證明什麼、不能證明什麼
  - 能在地圖上指出麻六甲的位置，並說明葡萄牙為什麼要占下這個海峽港口
  - 能說出明朝在麻六甲被攻下之後的回應，以及它和鄭和遠航停止的關係
minutes: 40
level: 皆可
curriculum: ["歷 Ob-IV-1", "歷 Ob-IV-3", "歷 Mb-V-1", "歷 Mb-V-2"]
steps:
  - type: hook
    text: |
      想像兩所學校各拿到一大筆預算。A 校派出幾百人的龐大隊伍，到各地交流，帶了很多禮物；回來後校長說：太花錢了，以後不辦了。B 校只派四個人的小隊，卻在沿路的港口一個個設據點，後來的人跟著走，據點越開越多。（這只是比喻。）
      15 世紀，明朝的鄭和與葡萄牙的達伽馬，都是國家出資，橫渡印度洋到了古里。一個收手，一個越走越遠。
      這個單元要看：兩種出海，差在哪裡？葡萄牙為什麼要占下一座海峽港口？
    guess:
      q: 1433 年第七次遠航之後，明朝再也沒有派出這樣的船隊。你猜最主要的原因是什麼？
      options:
        - 船隊在海外打了大敗仗，船都沉了
        - 花費太大、換回的收益不夠，北方又有蒙古的壓力
        - 沒有人會造這麼大的船了，造船技術失傳
        - 外國港口都不歡迎中國船，不准它們靠岸
      reveal: 卡片列出的原因不只一個：成本太高、朝貢換回的收益比不上成本、北方蒙古壓力增加；有學者還強調贊助者永樂帝過世，以及文官長期反對。另外，遠航停了，不等於中國人從此不出海：有研究指出之後民間海上貿易仍持續。
  - type: card
    id: event-zheng-he-voyages
    depth: understand
    prompt: 先看船隊多大、為什麼出海；再看「受益者與受損者」，想想誰付了這筆錢。
    focus: [C4, C5, C6]
    quick:
      - q: 鄭和船隊有多大？主要是去做什麼？
        a: 首航約有 317 艘船、2 萬多人（估計）。他們帶著絲綢、瓷器當禮物，邀請各國派使者來朝貢，向內外證明皇帝是正統的天子。
      - q: 鄭和船隊只是送禮的友好訪問嗎？
        a: 不只。船隊也動過武力：在麻六甲海峽擒獲海盜陳祖義，在錫蘭和當地國王作戰，還把他帶回中國。
  - type: source
    card: event-zheng-he-voyages
    idx: 1
    question: 鄭和等人在碑文裡寫：「每次都率領數萬名官兵和一百多艘遠洋船。」這句話最能支持哪個說法？
    options:
      - 船隊的目的是占領南洋的土地，並在那裡建立殖民地
      - 船隊從頭到尾沒有動用過武力，只是和平地送禮
      - 出航的是帶著大批官兵的艦隊，不只是少數使節
      - 朝廷後來停止遠航，是因為船隊實在太花錢了
    answer: 2
    why_wrong:
      - 碑文只說了人數和船數，沒有說要占領土地；船隊是不是在控制港口與航線，學者的看法也並列，不能直接說是殖民。
      - 碑文寫的是數萬名官兵；卡片還提到船隊在錫蘭作戰、擒獲海盜，所以不能說沒用過武力。
      - null
      - 這段碑文寫在出航前，沒有說為什麼停止；停止的原因要看卡片的其他段落。
    explain: 碑文是鄭和等人 1431 年出航前自己立的。他們說每次都率領數萬名官兵和一百多艘遠洋船，所以這是一支有大批兵力的艦隊，不只是帶著禮物的使節。但這段話只說了人數與船數，沒有說目的是占領，也沒有說遠航後來為什麼停止。
    hints:
      - 先抓兩個數字：「官兵」是幾萬人，「船」是一百多艘。
      - 官兵和使節有什麼不同？卡片的常見誤解，也提到碑文自己就寫了每次率領多少官兵。
      - 這段話只說了人數和船數，它有沒有說目的是什麼、為什麼停止？
    ref: event-zheng-he-voyages#story
    critique:
      question: 這塊石碑是鄭和等人自己立的。把它當作史料，下面哪個說法最合理？
      options:
        - 能證明所有明朝官員都支持遠航，因為這是刻在石碑上的官方文字
        - 能證明他們自己怎麼描述船隊規模；不能證明朝廷為何後來停止遠航
        - 能證明船隊只做和平外交，因為碑文裡沒有提到任何戰事，不可能打過仗
        - 能證明每次出航的人數和船數，都剛好等於碑文寫的數字，沒有任何誤差
      answer: 1
      explain: 碑文是船隊的人自己寫的，能看出他們想怎麼說自己的規模和航程，但立場是自己人的。它不能證明朝廷內部怎麼想：有學者指出文官長期反對遠航，認為那是浪費、由宦官主導的冒險。碑文也沒有談停止的原因，「數萬」「一百多」更是概略的說法。
      why_wrong:
        - 有學者指出文官長期反對遠航，認為是浪費、由宦官主導的冒險，所以不能用一塊碑代表所有官員。
        - null
        - 碑文沒寫戰事，不等於沒打過；卡片寫船隊在錫蘭作戰，也擒獲了海盜。
        - 碑文寫的是「數萬」與「一百多艘」這種概略的說法，不是精確的統計。
  - type: decision
    role: 你是 1433 年第七次遠航結束後，宣德帝身邊的大臣
    situation: |
      七次遠航，船隊最遠到了東非，帶回了長頸鹿和各國的使者；但國庫付出很大，朝貢換回的收益比不上成本。
      北方的蒙古威脅在增加，有學者指出，文官長期認為這是「浪費、由宦官主導的冒險」，而贊助這件事的永樂帝已經過世。
      現在朝廷要決定：還要不要再派下一支船隊？先別急著看選項：如果是你，你會怎麼做？
    options:
      - label: 再派下一支船隊，繼續維持朝貢關係和皇帝的聲望
        result: 推測：國庫要再付一次龐大的費用，而卡片說朝貢換回的收益比不上成本；北方蒙古的壓力也還在。歷史沒有走這條路，所以後果只能推測。
      - label: 停止遠航，把力氣轉去北方邊防，也不再造遠洋船
        result: 這就是歷史上的做法。1433 年第七次遠航之後，朝廷停止遠航；宣德帝禁止建造遠洋船隻；卡片說原因被認為是成本太高、朝貢收益比不上成本，加上北方蒙古的壓力。
      - label: 學葡萄牙那樣，在沿路的港口蓋堡壘、留兵駐守，靠貿易收入養船隊
        result: 推測：卡片沒有記載當時的明朝官員討論過這個辦法，也說鄭和船隊的目的是朝貢外交，不是殖民或商業公司。有學者（Wade）認為船隊在控制港口與航線，另一位學者（Tan Ta Sen）得出不同的結論，所以船隊的性質本身就有爭論。歷史沒有走這條路，所以後果只能推測。
    actual: 朝廷選擇停止。1424 年洪熙帝曾停止遠航，宣德帝 1430 年又下令第七次出航，1433 年之後不再派船，並禁止建造遠洋船隻。官方紀錄對鄭和著墨很少，有學者認為紀錄被刻意銷毀，也有人認為只是散失。
    ref: event-zheng-he-voyages#C6
    note: 停止遠航的原因，卡片並列兩種說法：成本太高、蒙古壓力；Wade 另外強調永樂帝過世與文官反對。第三個選項是本單元為了讓你比較而設計的。還要注意：遠航停止，不等於中國從此完全「閉關」，有研究指出之後民間海上貿易仍持續。
  - type: card
    id: event-portugal-africa-coast
    depth: understand
    prompt: 葡萄牙是怎麼一小段一小段把非洲西岸摸熟的？注意錢從哪裡來、教宗詔書給了葡萄牙什麼。
    focus: [C4]
    quick:
      - q: 亨利王子的航海計畫，錢從哪裡來？
        a: 靠王室與基督騎士團出資；1443 年起，他又取得博哈多爾角以南的壟斷權。
      - q: 1455 年的教宗詔書，給了葡萄牙什麼？
        a: 承認葡萄牙在博哈多爾角以南的獨占航行與貿易權，也准許把非基督徒「貶為永久奴隸」。
  - type: card
    id: event-portuguese-empire
    depth: understand
    prompt: 葡萄牙人口不多，卻把貿易網從里斯本拉到日本。注意他們靠什麼控制貿易，以及迪亞士和達伽馬各走到哪裡。
    focus: [C4, misc]
    quick:
      - q: 葡萄牙在亞洲怎麼控制貿易？
        a: 以果阿為中心，用沿岸堡壘、商館與艦隊控制航線，不占領內陸；還要求商船買「通行證」，沒買的可能被攻擊或沒收。
      - q: 迪亞士到過印度嗎？第一個從海路到印度的是誰？
        a: 沒有。迪亞士 1488 年繞過好望角後就折返；第一個從海路到印度的是 1498 年的達伽馬。
  - type: compare
    cards: [event-zheng-he-voyages, event-portuguese-empire]
    prompt: 兩邊都是 15 世紀國家出資、航向印度洋的船隊。把它們並排看。
    rows:
      - aspect: 規模
        a: 首航約 317 艘船、2 萬多人（估計）
        b: 達伽馬首航只有 4 艘船、約 170 人（數字見鄭和卡的對照）；葡萄牙是人口不多的小國
      - aspect: 目的
        a: 邀請各國朝貢、宣揚國威，帶絲綢瓷器當禮物
        b: 取得香料貿易，並壟斷印度洋的貿易
      - aspect: 怎麼控制
        a: 朝貢關係；船隊也在錫蘭作戰、擒獲海盜
        b: 沿岸堡壘、商館與艦隊，加上要商船買「通行證」，沒買的可能被攻擊或沒收
      - aspect: 之後
        a: 1433 年後停止遠航，宣德帝禁止建造遠洋船；朝貢換回的收益比不上成本
        b: 持續擴張了一百多年：1505 年設印度總督，1510 年占果阿，1511 年取麻六甲
    question: 兩邊都是國家出資、都到過古里，為什麼一邊停下來，另一邊卻一路蓋堡壘、占港口？請至少說出兩點。
    model_answer: 一個原因是目的和做法不同：鄭和船隊是為了朝貢外交與國威，花費很大、換回的收益比不上成本；葡萄牙則是為了取得並壟斷香料貿易，沿岸蓋堡壘、設商館、發通行證，用武力讓貿易變成有據點的控制，所以一再擴張。另外，明朝還面臨北方蒙古的壓力。不過停止的原因，學者並不只用一個說法來解釋，所以不能只用「中國人不愛海洋」來概括。
    hints:
      - 先看「目的」那一列：一邊想要的是什麼，另一邊想要的是什麼？
      - 再看「怎麼控制」那一列：哪一邊在沿岸留下了堡壘？
      - 回到鄭和卡的 C6：除了錢，北方還有什麼壓力？
    points:
      - 目的不同：鄭和是朝貢外交與宣揚國威，葡萄牙是取得並壟斷香料貿易
      - 做法不同：葡萄牙在沿岸蓋堡壘、設商館、發通行證，持續擴張；明朝則停止遠航
      - 鄭和的朝貢收益比不上成本，明朝還有北方蒙古的壓力
      - 停止的原因不只一個，不能只用「中國人不愛海洋」來概括
  - type: card
    id: event-malacca-1511
    depth: understand
    prompt: 麻六甲為什麼重要？注意明朝與它的關係，以及葡萄牙攻下它之後，明朝只做了什麼（讀故事就看得到）。
    focus: [C4]
    quick:
      - q: 葡萄牙攻下麻六甲之後，做了什麼？
        a: 他們在城邊蓋了 A Famosa 堡壘，駐軍約 500 人；其他商人則繞過麻六甲，轉往柔佛等港口。
      - q: 蘇丹向中國求援，明朝出兵了嗎？
        a: 沒有。蘇丹派使者去中國求援，沒有成功；1521 年御史上奏，稱麻六甲是進貢、受冊封的國家，禮部建議等麻六甲使者到達後再查問，實錄英譯沒有看到出兵的記載。
  - type: mapq
    card: event-malacca-1511
    mode: where
    question: 麻六甲是連接印度洋與中國之間貿易的海峽咽喉：鄭和船隊在這裡停靠六次，葡萄牙 1511 年攻下它。地圖上標了四個點，哪一點是麻六甲城？
    places:
      - { key: "古里", card: event-zheng-he-voyages, label: 古里, hint: 印度半島的西南岸 }
      - { key: "滿剌加（麻六甲）", label: 麻六甲, hint: 馬來半島的西南岸，在印度與中國之間 }
      - { key: "賓坦島", card: event-malacca-1511, label: 賓坦島, hint: 麻六甲海峽南口外的島，蘇丹逃走後的流亡據點 }
      - { key: "好望角（風暴角）", card: event-portuguese-empire, label: 好望角, hint: 非洲的最南端，在地圖的西南邊 }
    answer: 1
    explain: 麻六甲（今馬來西亞麻六甲市）在麻六甲海峽邊，控制著海上中國與印度之間貿易的海峽。明朝 1405 年起派使者與它往來，鄭和前後停靠六次；1511 年葡萄牙攻下它，蓋了堡壘。從葡萄牙看，這是掌握香料與中國貿易的關鍵一步；原來的貿易則分散到柔佛等別的港口。
    why_wrong:
      - 這是古里（今印度科澤科德），印度西南岸的大港，鄭和船隊多次停靠，1498 年達伽馬也到了這裡，但它不在海峽邊。
      - null
      - 這是賓坦島（今印尼廖內群島），麻六甲陷落後蘇丹流亡的據點，在海峽南口外，不是葡萄牙占下的那座港口。
      - 這是好望角，非洲的最南端，1488 年迪亞士繞過它。
    hints:
      - 麻六甲在「印度」和「中國」之間，想想海上貿易要從哪裡穿過去。
      - 它在一條海峽邊；四個點裡，哪一個在海峽北邊的馬來半島岸上，哪一個是海峽南口外的島？
  - type: chain
    prompt: 把下列事件依照先後排成一條鏈（最上面最早）。排完會追問你一個卡片裡寫到的因果。
    items:
      - 葡萄牙一小段一小段摸熟非洲西岸，開始運回黃金與奴隸
      - 迪亞士繞過好望角，證明印度洋與大西洋相通
      - 達伽馬沿著這條路線到達印度古里
      - 葡萄牙設印度總督，在沿岸蓋堡壘
      - 阿爾布克爾克攻下麻六甲
    explain: 葡萄牙先花了幾十年摸熟非洲西岸，1488 年迪亞士繞過好望角，1498 年達伽馬沿著這條路線到達古里；之後葡萄牙一面派艦隊、一面沿岸蓋堡壘，1505 年設印度總督；1510 年占果阿之後，又沿著貿易路線往東，1511 年攻下麻六甲。這題問先後，也問哪些是前一件讓後一件發生。
    hints:
      - 最早的是在非洲西岸一小段一小段的探航，最晚的是往東方推進的一步。
      - 迪亞士繞過好望角之後，達伽馬才沿著這條路線走到印度。
      - 設總督、蓋堡壘是在達伽馬到印度之後，攻下麻六甲則是占領果阿的下一步。
    ref: event-portuguese-empire#C2
    followup:
      question: 卡片說，葡萄牙為什麼會去攻下麻六甲？
      options:
        - 因為明朝請葡萄牙人幫忙管理這座受冊封的港口，雙方達成協議
        - 因為葡萄牙占了果阿之後，要控制連接印度洋與中國的海峽
        - 因為麻六甲的蘇丹先攻擊了葡萄牙的商船，葡萄牙才出兵報復
        - 因為教宗下令葡萄牙在 1511 年之前，占下所有的海峽港口
      answer: 1
      explain: 麻六甲卡的因果是：葡萄牙在印度設總督、占領果阿之後，繼續沿著貿易路線往東，要控制連接印度洋與中國的麻六甲海峽，1511 年由阿爾布克爾克攻下。明朝只在奏章裡抗議，沒有出兵；至於蘇丹先攻擊商船、教宗下令，卡片都沒有寫。
      why_wrong:
        - 明朝沒有參與，而且面對 1521 年的奏章，朝廷只建議等麻六甲使者到達後再查問。
        - null
        - 卡片沒有寫蘇丹先攻擊葡萄牙商船；卡片寫的是葡萄牙占領果阿之後繼續往東。
        - 1455 年的詔書談的是博哈多爾角以南的獨占權，卡片沒有寫教宗下令占海峽港口。

id: unit-three-kingdoms-2
title: 三國（下）：打了五十年，為什麼最後贏的是司馬家？
histories: [中國史]
mystery: 曹操、劉備、孫權打了半輩子，他們的子孫也繼續打；可是到了 280 年，統一天下的不是魏、蜀、吳任何一家，而是曹魏的臣子司馬家建立的晉朝。戰場上分不出勝負的事，是在哪裡決定的？
teaser: 一場燒掉四十多座營寨的大火、一篇寫給皇帝的〈出師表〉、一套替人打分數的制度、一次趁皇帝出城謁陵發動的政變。
goals:
  - 能說明夷陵之戰、諸葛亮北伐怎麼讓三國的國力差距固定下來
  - 能判讀〈出師表〉的一段原文，說出諸葛亮北伐的目標與他自己承認的困難
  - 能說明九品官人法怎麼讓世家大族掌握做官的機會，以及司馬家怎麼在朝廷裡奪權
  - 能比較諸葛亮和司馬懿兩人的選擇，並分辨《三國演義》與正史的說法
minutes: 40
steps:
  - type: hook
    text: |
      一場籃球比賽打到第四節，兩隊比分一直咬得很緊。最後決定勝負的，卻不是場上的球員，而是一個在場邊默默坐了很久、等主將犯滿離場的替補。
      三國也有點像這樣：曹、劉、孫三家在戰場上打了幾十年，誰也吃不掉誰；最後贏的，是一個在魏國朝廷裡等了很久的人。
      這一課，我們看三國的「下半場」：國力差距怎麼固定下來，權力又是怎麼悄悄換了手。
  - type: card
    id: event-three-kingdoms
    depth: understand
    prompt: 先看全局：220、221、229 年三家先後稱帝。讀到最後，注意三國結束時登記人口剩下多少。
  - type: card
    id: war-yiling
    depth: understand
    prompt: 219 年關羽丟了荊州，劉備兩年後親自伐吳報仇。注意陸遜為什麼一直不出戰？這一仗讓蜀漢失去了什麼？
  - type: decision
    role: 你是 227 年的諸葛亮，蜀漢的丞相
    situation: |
      劉備在夷陵大敗後病死，把兒子劉禪託付給你。你和吳國重新結了盟，也平定了南方的叛亂。
      蜀漢只有益州一地，人口和兵力都遠不如北方的魏；你自己也承認「益州疲弊」。但蜀漢以漢朝的繼承者自居，立國的理由就是要恢復漢朝、打回北方。
      先別急著看選項：如果你是他，只知道這些，你會怎麼做？
    options:
      - { label: 主動北伐，出兵攻魏, result: 這是諸葛亮的選擇。227 年他上〈出師表〉，228 年起多次出兵，一度讓三郡歸降，但街亭失利、糧草不繼，始終沒能拿下關中；234 年他病死在五丈原。 }
      - { label: 守住益州，休養生息, result: 推測：蜀漢可能累積更多糧食和人口，但國力和魏的差距未必縮小；「興復漢室」的口號失去行動，蜀漢立國的正當性也可能受到質疑。歷史沒有走這條路，所以後果只能推測。 }
      - { label: 和吳聯手，從長江一起攻魏, result: 推測：兩國同時出兵可以分散魏的兵力，但吳、蜀剛在荊州打過仗，互相不信任，協調不易。歷史沒有走這條路，所以後果只能推測。 }
    actual: 諸葛亮選擇北伐，從 228 到 234 年多次出兵，取得武都、陰平兩郡，但沒能改變魏強蜀弱的局面；他死後，姜維繼續北伐，蜀漢的國力持續消耗，263 年被魏所滅。
    ref: war-zhuge-northern-expeditions#A2
    note: 「沒有發生的選項」的後果都是推測，標示清楚。史家對北伐是「以攻為守」的必要之舉，還是耗盡國力，看法並不一致。
  - type: card
    id: war-zhuge-northern-expeditions
    depth: understand
    prompt: 看看北伐的經過：街亭為什麼失利？最後一次北伐，司馬懿用什麼方法對付諸葛亮？讀「戲劇 vs 史實」時，留意空城計和「死諸葛走生仲達」：哪一個是史書記下的，哪一個是後人編的？
  - type: source
    card: war-zhuge-northern-expeditions
    idx: 0
    question: 在這段〈出師表〉裡，諸葛亮說他北伐要達成什麼目標？
    options:
      - 在益州好好種田，讓百姓過好日子
      - 消滅壞人、恢復漢朝，回到漢朝的舊都
      - 投降魏國，換取和平
      - 自己當皇帝
    answer: 1
    explain: 「攘除姦凶，興復漢室，還於舊都」：趕走他眼中的「姦凶」（篡漢的魏），恢復漢朝，回到舊都。前面「臣本布衣，躬耕於南陽」說的是他本來只是個在南陽種田的平民。這篇是寫給劉禪看的，所以也是一篇說服皇帝支持北伐的文章，讀的時候要想到寫作的目的。
    hints:
      - 找三個並列的短句：「攘除……」「興復……」「還於……」。
      - 「漢室」指的是哪個朝代？
      - 「舊都」是漢朝的首都，還是蜀漢的首都成都？
    ref: war-zhuge-northern-expeditions#A2
  - type: card
    id: event-nine-rank-system
    depth: understand
    prompt: 換到朝廷裡面。看看九品官人法怎麼替人打分數、誰來打分數，以及為什麼後來變成「上品無寒門，下品無勢族」。
  - type: card
    id: event-gaopingling-incident
    depth: understand
    prompt: 249 年，皇帝出城謁陵，一場政變在幾天內決定了魏國的主人。注意：司馬懿動手前做了什麼準備？曹爽為什麼不反抗？
  - type: chain
    prompt: 把下列事件依照「因 → 果」排成一條鏈（最上面是最早的原因）。
    items:
      - 219 年關羽失荊州，蜀漢只剩益州
      - 222 年夷陵之戰，劉備大敗，蜀漢國力大損
      - 228–234 年諸葛亮多次北伐，司馬懿從 231 年起領兵抵擋，聲望與兵權日增
      - 249 年高平陵之變，司馬懿誅殺曹爽，魏國實權落入司馬家
      - 263 年魏滅蜀，266 年司馬炎取代曹魏建立晉朝
      - 280 年晉滅吳，三國結束
    explain: 荊州與夷陵兩次失敗，讓蜀漢只剩益州一地，國力和魏的差距固定下來；諸葛亮的北伐沒能改變這個差距，卻讓防守關中的司馬懿累積了兵權和聲望。249 年司馬懿趁曹爽陪皇帝出城時發動政變，從此魏國由司馬家掌握；司馬昭滅蜀、司馬炎篡魏建晉，最後滅吳統一。戰場上分不出的勝負，是在朝廷裡決定的。
    hints:
      - 最早的原因是蜀漢丟掉一塊很重要的地方。
      - 司馬懿的兵權和聲望，有一部分是在對抗諸葛亮時累積的。
      - 晉朝是先滅蜀、再建國、最後滅吳。
    ref: event-gaopingling-incident#C7
  - type: compare
    cards: [person-zhuge-liang, person-sima-yi]
    prompt: 比一比兩位在五丈原對峙的人：一個一直進攻，一個一直等。
    rows:
      - { aspect: 身分, a: 蜀漢丞相，受劉備託孤、輔佐劉禪, b: 曹魏重臣，歷仕曹操、曹丕、曹叡、曹芳 }
      - { aspect: 對峙時的做法, a: 多次北伐，主動出擊、設法解決運糧問題, b: 堅守不戰，等對方糧盡或撐不下去 }
      - { aspect: 結局, a: 234 年病死在五丈原軍中, b: 249 年發動高平陵之變掌握魏國實權，251 年去世；孫子司馬炎建立晉朝 }
      - { aspect: 後世形象, a: 《三國演義》把他寫成料事如神的智者；正史裡他以執法公平、賞罰分明著稱，北伐卻始終未能成功, b: 小說裡總被諸葛亮算計；唐太宗稱讚他用人求賢，但連東晉明帝聽了祖先奪權的經過，都說晉朝國運怎能長久 }
    question: 諸葛亮和司馬懿，一個主動、一個等待。請說說兩人的選擇各自有什麼道理，再說說為什麼兩人的「形象」和正史有落差。
    model_answer: 諸葛亮主動北伐，是因為「興復漢室」是蜀漢存在的理由，易中天也認為北伐有以攻為守、先發制人的用意；司馬懿堅守不戰，是因為魏國國力較強，蜀軍翻越秦嶺運糧，好幾次都因糧盡撤退，拖得越久對蜀越不利。兩人的選擇都和自己國家的處境有關。形象的落差，一部分來自《三國演義》偏向蜀漢、把諸葛亮寫得料事如神（例如空城計是裴松之當場就反駁過的軼事）；至於「死諸葛走生仲達」，倒是史書記下的當時俗語，可見對峙時兩人的名聲就已經不一樣；另一部分來自後世對司馬氏篡魏的批評，連晉朝自己的皇帝聽到祖先奪權的經過都感到羞愧。讀人物時，要把「小說的他」「正史的他」「後世評價的他」分開看。
    hints:
      - 先看「對峙時的做法」：一個國力弱、一個國力強，各自適合什麼打法？
      - 再看「後世形象」：這些形象是從哪本書來的？
      - 打開兩張人物卡的「評價怎麼變」與「戲劇 vs 史實」。
  - type: today
    card: event-nine-rank-system
    question: 有人說「九品官人法就像今天看家世背景的推甄」。這個類比哪裡不成立？
    model_answer: 先說不能類比的地方：九品官人法分配的是皇帝和士族之間的做官權力，一般百姓根本不在評選範圍內；評分的中正多半出身大族，西晉的劉毅就批評他們「高下任意，榮辱在手」。今天的入學與任用制度有公開考試、法律救濟和反歧視規範，不能直接畫上等號。可以借來想的是：一套原本想「選人才」的制度，如果評分的人和被評的人來自同一群人，又把家世算進分數裡，久了就可能變成讓少數家族一直佔住好位置的工具。
  - type: check
    items:
      - kind: choice
        q: 249 年高平陵之變後，魏國的實權落入誰的手中？
        options: [諸葛亮與蜀漢, 孫權與吳國, 司馬懿與他的兒子們, 曹爽與何晏]
        answer: 2
        explain: 司馬懿趁曹爽兄弟陪皇帝曹芳出城謁陵時發動政變，誅殺曹爽一黨；之後魏國由司馬懿和兒子司馬師、司馬昭掌握，266 年孫子司馬炎建立晉朝。
        hints: [政變的主角是哪一位曾經在五丈原對抗諸葛亮的人？, 被殺的是曹爽，所以掌權的是誰？]
        ref: event-gaopingling-incident#C6
      - kind: order
        q: 依時間先後排列：
        items: [關羽失荊州, 夷陵之戰, 諸葛亮病死五丈原, 高平陵之變, 魏滅蜀, 晉滅吳]
        explain: 219 年關羽失荊州 → 222 年夷陵之戰 → 234 年諸葛亮病死五丈原 → 249 年高平陵之變 → 263 年魏滅蜀 → 280 年晉滅吳。
        hints: [夷陵之戰是劉備為了荊州去打吳。, 司馬懿是在諸葛亮死後十五年才發動政變的。]
        ref: event-three-kingdoms#C2
      - kind: short
        q: 用一兩句話說明：為什麼說三國的結局「是在朝廷裡決定的」？
        model: 三家在戰場上打了幾十年都無法吃掉對方，國力差距固定之後，真正的轉折是 249 年司馬懿在魏國朝廷裡發動高平陵之變、掌握實權；之後司馬家用魏國的力量滅蜀、篡魏、滅吳，統一天下的是晉朝而不是三家任何一家。
        explain: 這是一種解讀：戰場決定了三國能不能互相吃掉，朝廷決定了最後誰來收割。也可以補充九品官人法讓世家大族壯大，司馬家正是這樣的大族。
        hints: [想想看，最後統一天下的是魏、蜀、吳中的哪一家？, 司馬家是怎麼拿到魏國的力量的？]
        ref: event-gaopingling-incident#C7
  - type: recap
    model_answer: 三國的下半場，國力的差距先在戰場上固定下來：219 年關羽丟了荊州、222 年劉備在夷陵大敗，蜀漢只剩益州一地；諸葛亮從 228 到 234 年多次北伐，展現了以弱攻強的決心，卻沒能改變魏強蜀弱的局面，最後病死在五丈原。真正的轉折發生在魏國朝廷裡：九品官人法讓做官的機會越來越集中在世家大族手上（到西晉時更明顯），出身大族、在對抗諸葛亮時累積了兵權與聲望的司馬懿，249 年趁曹爽陪皇帝出城時發動高平陵之變；之後司馬家滅蜀、篡魏、滅吳，280 年由晉朝統一。要記得兩個提醒：第一，空城計這類情節來自後來的軼事和小說，裴松之早就指出它不可能成立，但「死諸葛走生仲達」是史書記下的當時俗語，兩者要分開看；第二，對諸葛亮北伐的評價、對司馬懿的評價，從古到今都在改變，沒有一個標準答案。這是一種參考說法，不是標準答案。
reflect: 諸葛亮明知「益州疲弊」，還是選擇北伐；司馬懿則選擇等待。你做事的時候，比較像哪一種人？有沒有一次，你選擇「等一等」或「先出手」，事後覺得選對了或選錯了？

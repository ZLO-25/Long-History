title: 赤壁之戰前夕：曹操統一北方、南下荊州（208 年冬）
note: 207 年曹操北征烏桓，袁尚、袁熙逃到遼東被公孫康斬首，北方大致統一。208 年秋劉表病死，次子劉琮投降，曹操取得荊州北部與江陵；劉備退到夏口，和劉表長子劉琦會合，派諸葛亮出使孫權。這張圖是赤壁開戰前的局面：荊州南部四郡（長沙、武陵、零陵、桂陽）還在觀望，戰後才被劉備取得。關中與涼州的將領要到 211 年潼關之戰才被曹操擊敗。以今日省界近似，邊界只是示意。

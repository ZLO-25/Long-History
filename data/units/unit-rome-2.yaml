        a: 2 世紀末起軍隊在政治上的份量越來越大，每個新皇帝都要多發錢給軍隊，於是一再降低銀幣成色、在銀幣裡摻銅，錢越來越不值錢，物價飛漲。
      - q: 三世紀的「危機」，真的是全帝國一起崩潰嗎？
        a: 傳統說法這樣看，但近年研究強調地區差異：埃及、北非與西班牙部分地區仍然繁榮，小亞細亞也沒有普遍衰退。
  - type: decision
    role: 你是 284 年剛登基的戴克里先
    situation: |
      三世紀的羅馬皇帝，常被軍隊擁立，又被軍隊殺死：235 年之後的五十年間，換了二十多位。260 年皇帝瓦勒良被波斯俘虜，西邊自立出高盧帝國，後來東邊又有帕米拉帝國；274 年奧勒良才把帝國重新統一。
      現在你登基了。外敵、內戰和通膨一起來，一個人很難管全帝國。
      先別急著看選項：如果你是戴克里先，只知道這些，你會怎麼做？
    options:
      - label: 照舊一個人管，哪裡出事就趕去哪裡
        result: 推測：每個邊境出事，你都得親自處理，同一時間只能在一個地方。三世紀的皇帝多半在位很短、死於兵變或內戰，但那是不是因為一個人管不過來，卡片沒有這樣說，所以這只是推測的風險。歷史上戴克里先沒有選這條路，後果只能推測。
      - label: 只找一位同僚，一東一西分頭管，不另外預定接班人
        result: 這其實是戴克里先 286 年先走的一步：讓馬克西米安成為同等地位的正皇帝管西方，自己管東方。但他沒有停在這裡，293 年又加了兩位副皇帝。推測：如果只做到這一步，兩個人仍然顧不到所有邊境，誰來接班也沒有安排；歷史沒有停在這條路上，所以後果只能推測。
      - label: 分成四個人共治，其中兩位副皇帝是預定的接班人
        result: 這是戴克里先最後的做法。286 年他先讓馬克西米安成為同等地位的正皇帝管西方，自己管東方；293 年又各任命一位副皇帝，加萊里烏斯與君士坦提烏斯，副皇帝是預定的接班人。代價是，這個制度靠他個人的威望維持，他一退位就失靈。
    actual: 四個人的行政中心設在尼科米底亞、米蘭、錫爾米烏姆和特里爾，離邊境更近；稅制也被標準化。他放棄「元首」（第一公民）的稱號，進入「主宰」時期，奧古斯都留下的元首制至此結束。301 年他頒布限價敕令想壓住通膨，卻被認為適得其反，很快被無視；303 年起他發動對基督徒的大迫害。305 年 5 月 1 日，他成為第一位主動退位的羅馬皇帝，回到達爾馬提亞海岸的宮殿種菜（他為什麼退位，有「病後衰弱」和「被加萊里烏斯逼退」兩種說法，後者出自敵視他的作者）。他退位後，四帝的安排很快崩解，君士坦丁與馬克森提烏斯等人爭位，324 年君士坦丁成為唯一皇帝。
    ref: event-diocletian-tetrarchy#C2
    note: 沒有發生的選項，後果都是推測。前兩個選項是本單元為了讓你比較而設計的（卡片沒有記載戴克里先當時考慮過哪些方案）。這題沒有標準答案，當時的人也不知道這個制度會在他退位後崩解。卡片還提醒：常聽到的「戴克里先把帝國分成東西兩半」是過度簡化，學者一般把四帝共治看成一個皇帝團隊，而不是四個小帝國。

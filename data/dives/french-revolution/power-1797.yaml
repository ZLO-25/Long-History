year: 1797
basemap: europe_countries
title: 革命軍打出「姊妹共和國」（1797 年底，坎波福爾米奧條約之後）
note: 1792 年開戰後，法國先擋住奧普聯軍，再反攻出去。到 1797 年 10 月奧地利簽下坎波福爾米奧條約時，法國已併吞今日比利時、盧森堡、薩伏依與尼斯，並占領萊茵河左岸，條約另把威尼斯的愛奧尼亞群島給了法國；荷蘭變成巴達維亞共和國、北義大利變成奇薩爾皮尼共和國、熱那亞變成利古里亞共和國，都是聽法國的「姊妹共和國」。奧地利失去比利時與倫巴底，換到威尼斯共和國的大半土地（威尼斯就此消失）。另一邊，波蘭在 1793、1795 年被俄、普、奧第二、三次瓜分，從地圖上消失。以今日國界近似，邊界只是示意。
view: [[35, -11], [60, 33]]

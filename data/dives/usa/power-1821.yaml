# 領土擴張示意圖 1821 年（畫法同 power-1783.yaml）
year: 1821
basemap: us_states
title: 佛羅里達到手、墨西哥獨立、奧勒岡共管（1821 年）
note: 1819 年 2 月 22 日亞當斯—奧尼斯條約（1821 年 2 月 22 日生效，7 月正式移交東、西佛羅里達）：西班牙讓出佛羅里達，雙方以薩賓河—紅河—西經 100°—阿肯色河—北緯 42° 為界，美國放棄對德克薩斯的主張。1818 年英美條約把北界定在北緯 49°，奧勒岡地區英美共管。同年墨西哥獨立，接手新西班牙的西南領土。堪薩斯西南角與俄克拉荷馬狹長地（阿肯色河以南、西經 100° 以西）當時屬墨西哥，本圖未切。

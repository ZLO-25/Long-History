id: unit-where-from
title: 你家從哪裡來？說的話、認同和祖先，為什麼不一定一樣
histories: [臺灣史, 世界通史]
mystery: 如果有人問你「你是什麼人？」，你可能會說出你講的語言、你覺得自己屬於哪一群人，或你的祖先從哪裡來。這三個答案常常不一樣。為什麼？地圖上又為什麼不畫「人種」？
teaser: 一份荷蘭人寫的和約、一年 15 萬多張的鹿皮、一道廢除「不准民人渡臺」各項禁令的上諭、一條從臺灣划向太平洋的航線：臺灣的人，是一層一層來的。
goals:
  - 能說出「說什麼話、認為自己是誰、祖先從哪裡來」三種問法的差別，並舉出臺灣的例子
  - 能說明地圖上為什麼不畫「人種」，而改用語言族群與各國自己的族群統計
  - 能指出支持「南島語族從臺灣出發」的三種證據（語言、考古、基因），以及還在爭論的地方
  - 能判讀一段荷蘭時代的和約條款，說出它能證明什麼、它是誰寫的
  - 能比較清代渡臺移民與大西洋奴隸貿易：哪一個是自己選的，哪一個是被迫的
  - 能依先後排出臺灣幾波人群來到與改變的過程，並說明語言改變不等於祖先或認同消失
minutes: 45
steps:
  - type: hook
    text: |
      新學期第一堂課，老師請大家自我介紹「你是哪裡人」。
      有人說「我是臺灣人」，有人說「我家講客家話」，有人說「我阿嬤是阿美族」，也有人說「我爸爸是從越南來的」。
      大家講的其實是三件不同的事：你說什麼話、你覺得自己屬於哪一群人、你的祖先從哪裡來。這三件事常常對不上，而且會隨著時間改變。
      這個單元要用地圖上的「◎ 人群」圖層，加上幾張卡片，一層一層看：臺灣的人是怎麼來的？為什麼地圖上不畫「人種」？
  - type: peoples
    id: about
    prompt: 先讀「為什麼地圖上不畫人種」。注意兩個理由，以及表格裡的三種問法：說什麼話？認為自己是誰？祖先從哪裡來？各國怎麼分族群，舉了哪些例子？
  - type: peoples
    id: Taiwan
    prompt: 再看臺灣放大鏡。注意綠色方框「認同和語言不一樣」：自認客家人的比例，和主要說客語的比例差了多少？想一想，為什麼會差這麼多？也看官方承認的原住民族有幾個、最新的一族是誰、哪一年認定。
  - type: peoples
    id: mig-austronesian
    prompt: 臺灣原住民族的語言屬於南島語系。看這條遷徙：主流說法認為臺灣是這條航線的出發點（不是說全人類從臺灣來）。從臺灣出發後經過哪些地方？按地圖上的「▶ 播放」看站點怎麼長出來。再讀三種證據（語言、考古、基因），以及「學界還在爭的事」。
  - type: card
    id: social-siraya-deer
    depth: deep
    prompt: 17 世紀，荷蘭人來到臺南平原。注意西拉雅人和荷蘭人簽了什麼條件、鹿皮賣到哪裡、一年最多賣了多少張；也讀「常見誤解」：西拉雅人消失了嗎？
  - type: source
    card: social-siraya-deer
    idx: 0
    question: 1635 年荷蘭與麻豆社的和約寫著：「他們要把自己土地的主權交給我們」。這段條款最能說明什麼？
    options:
      - 這是麻豆社被荷蘭人打敗以後，被迫接受的條件
      - 西拉雅人很樂意把土地送給荷蘭人，雙方是平等的朋友
      - 西拉雅人在 1635 年就已經全部改說荷蘭語了
      - 這是西拉雅人自己用西拉雅語寫下的歷史紀錄，不會有偏見
    answer: 0
    explain: 卡片說，1635 年荷蘭人聯合新港社攻下麻豆社，和約要求交出土地主權、不得再攻擊荷蘭人和荷蘭的盟友。這是被征服後的條件，不是平等的交換。也要注意是誰寫的：我們對西拉雅人的了解大多來自荷蘭人的紀錄，西拉雅人自己留下的文字很少。
    hints:
      - 先看這份和約是在什麼情況下簽的：打仗之前，還是打輸之後？
      - 回去看卡片「他們面對的規則」，和約還要求了什麼？
      - 這段文字是誰記下來的？西拉雅人自己留下的紀錄多不多？
    ref: social-siraya-deer#E3
  - type: peoples
    id: mig-han-south
    prompt: 接下來要看清代渡海來臺的漢人。他們是更長的「漢人南移」的最後一段。看這條線怎麼從黃河一路到嶺南、江南、閩南、粵東，再渡海到臺灣。注意「學界還在爭的事」：南方原本的百越人是被同化，還是被取代？
  - type: card
    id: event-qing-taiwan-frontier
    depth: deep
    prompt: 1684 年以後，閩南和客家移民大量渡海來臺。注意清廷對渡臺設了哪些限制、為什麼還是擋不住，人口從多少變成多少；也讀「受益者與受損者」：平埔族的土地怎麼了？
  - type: decision
    role: 你是 18 世紀初，福建漳州一個家裡田不夠分的年輕人
    situation: |
      家鄉人多地少。聽說海峽對岸的臺灣有大片土地可以開墾。
      可是清廷規定：來臺灣要有官府核准的憑照，而且不准帶家眷。
      先想一想你會怎麼做、為什麼，再看選項。
    options:
      - label: 申請憑照，合法渡臺
        result: 依卡片的規定，你要先拿到官府核准的憑照才能走，而且家人不能一起來，只能自己先過去。
      - label: 找門路偷渡過去
        result: 卡片說實際管制鬆散、偷渡普遍，很多移民就是這樣來的。但到了臺灣，沒有田、沒有家的單身男性很多，被叫做「羅漢腳」；不同祖籍的人也常為了田地和水源械鬥。
      - label: 留在家鄉，不冒這個險
        result: 推測：留下來就不必冒偷渡和械鬥的風險，但家鄉人多地少的問題還在。卡片沒有記載留下來的人過得怎樣，所以後果只能推測。
    actual: 偷渡擋不住。1684 年島上漢人估計約 13 萬；到 1811 年，全臺戶口調查已近 200 萬人（估計）。移民向原住民租地、買地，合資開鑿八堡圳、瑠公圳，把荒地變成水田；平埔族的土地被租走、買走或侵墾。1875 年清廷正式宣布「所有從前不准民人渡臺各例禁，着悉與開除」。
    ref: event-qing-taiwan-frontier#C2
    note: 第三個選項是歷史沒有記載的路，結果寫的是推測。
  - type: compare
    cards: [event-qing-taiwan-frontier, event-atlantic-slave-trade]
    prompt: 同樣是「一大群人移到新的土地」，清代渡臺的移民和大西洋奴隸貿易的非洲人，處境完全不同。比一比。
    rows:
      - aspect: 誰在移動
        a: 福建漳州、泉州與廣東客家移民
        b: 在非洲被擄走、賣給奴隸販子的非洲人
      - aspect: 為什麼移動
        a: 家鄉人多地少，臺灣有地可以開墾
        b: 被押上奴隸船，多半被送到巴西和加勒比海的甘蔗園做工
      - aspect: 自己選的嗎
        a: 是自己決定來的；清廷雖然限制，很多人仍然偷渡
        b: 不是：被鐵鍊鎖上船，沒有選擇
      - aspect: 規模
        a: 1684 年島上漢人約 13 萬，1811 年全臺戶口近 200 萬（估計；這是人口總數，不是移民人數）
        b: 三百多年間約 1,250 萬人被押上船，約 1,070 萬人活著抵達美洲
      - aspect: 原本住在那裡的人
        a: 平埔族的土地被租走、買走或侵墾
        b: 加勒比海的原住民因疫病與強迫勞動大量死亡，殖民者才轉向從非洲運人來做工
      - aspect: 留下了什麼
        a: 今天臺灣西部聚落的祖籍分布、族群邊界與水圳網絡，大多在這段時期定型
        b: 今天美洲的人口組成，以及把人分「種族」並加以歧視的觀念，都和這段歷史分不開
    question: 兩者都讓一個地方的人口組成大大改變。最大的不同在哪裡？為什麼這個不同很重要？
    model_answer: 最大的不同是「有沒有選擇」。清代移民是自己決定渡海的，雖然清廷限制、到了臺灣還常有械鬥，他們來了以後可以租地、買地、開圳；被押上奴隸船的非洲人卻是被擄、被賣、被鐵鍊鎖住，到了美洲還要在甘蔗園被迫做工。這個不同很重要，因為看地圖上的人口分布時，不能只說「某群人搬到那裡」，還要問：他們是自己來的，還是被迫的？來了以後，原本住在那裡的人（例如臺灣的平埔族）又發生了什麼事？
    hints:
      - 先看「自己選的嗎」那一列。
      - 再看「為什麼移動」：一邊是為了找地，另一邊是誰決定的？
      - 想一想：如果只看「人口變多了」，會漏掉什麼？
  - type: chain
    prompt: 把臺灣這幾波人群的事依先後排好（最上面是最早的）。
    items:
      - 說南島語的人從臺灣出發，往南擴散到菲律賓（約前 3000–1500 年間）
      - 荷蘭人聯合新港社攻下麻豆社，要求交出土地主權（1635 年）
      - 一年有超過 15 萬張鹿皮從臺灣運往日本（1638 年）
      - 清廷把臺灣設為福建省下的一個府，島上漢人估計約 13 萬（1684 年）
      - 全臺戶口調查近 200 萬人（1811 年，估計）
      - 原住民族戶籍人口 62.9 萬人，約占 2.7%（2025 年底）
      - 西拉雅族獲行政院認定為第 17 個原住民族（2026 年）
    explain: 臺灣的人是一層一層來的：最早是說南島語的原住民族，一般認為他們的祖先有一支還從臺灣出海，散布到太平洋和印度洋；17 世紀荷蘭人來了，平原上的西拉雅人被捲進鹿皮貿易，也被要求交出土地主權；清代閩南、客家移民大量渡海，平埔族的土地流失，很多人慢慢改說閩南語或客語；直到 2026 年，西拉雅族才成為第一個依《平埔原住民族群身分法》被認定的平埔族群。要注意：這條鏈是依年代排的，前一件事不一定直接「造成」後一件事。
    hints:
      - 最早的一件事是幾千年前，不是幾百年前。
      - 荷蘭時代（1624–1662）早於清代（1684 年起）。
      - 鹿皮貿易是荷蘭人控制臺南平原以後才大起來的。
    ref: peoples:Taiwan
  - type: today
    card: event-qing-taiwan-frontier
    question: 有人說：「清代渡臺的人，跟今天來臺灣工作或結婚的新住民一樣，都是移民。」這個類比哪裡不成立？
    model_answer: 先說不能類比的地方：卡片提醒，清代的移民沒有國籍、簽證或現代法院可以用，土地糾紛常靠械鬥解決；原住民也沒有今天的法律身分和土地權保障。今天的移民有國籍、居留和工作的法律規定，也有法院和行政機關處理糾紛，條件完全不同。可以借來思考的結構是：一個地方的人口組成，常常是一波一波移民疊起來的；而政府想限制移動、經濟誘因又很強的時候，規定和實際情形可能差很多。這只是看結構，不是說兩個時代一樣。
  - type: check
    items:
      - kind: choice
        q: 臺灣自認是客家人的約 19.8%，但主要說客語的只有 1.5%。這最能說明什麼？
        options:
          - 兩份調查的方法不同，所以至少有一個數字算錯了
          - 客家人大多已經搬到國外，留在臺灣的才只有 1.5%
          - 依法律規定，平常不說客語的人就不能登記為客家人
          - 認同和語言是兩回事：有人認同客家，平常卻說別的語言
        answer: 3
        explain: 臺灣放大鏡的綠色方框寫著：很多人的祖先說客語、自己也認同客家，但平常說華語或閩南語。「認為自己是誰」和「說什麼話」是兩件事。
        hints:
          - 兩個數字問的是同一件事嗎？一個問認同，一個問什麼？
          - 回到臺灣放大鏡的綠色方框，看它怎麼解釋。
        ref: peoples:Taiwan
      - kind: choice
        q: 這張地圖為什麼不畫「人種」？
        options:
          - 因為各國的人種資料都還沒公開，等資料齊了就會畫上去
          - 因為人的樣子是漸變的，「種族」又是各個社會自己訂的分類
          - 因為科學家已經證明，世界上所有人的長相和膚色其實都一樣
          - 因為聯合國規定，所有國家都不准統計國民的族群和語言
        answer: 1
        explain: 說明頁的兩個理由：人的膚色、臉型是一點一點漸變的，遺傳差異大多在同一群人裡面；「種族」是社會建構，例如美國普查問種族、巴西最大的一群是混血、日本和德國只統計國籍。所以地圖改看說什麼話、認為自己是誰、祖先從哪裡來。
        hints:
          - 回到「為什麼不畫人種」的第 1、2 個理由。
          - 每個國家的統計方式一樣嗎？舉了哪幾個國家當例子？
        ref: peoples:about
      - kind: choice
        q: 下面哪一項是支持「南島語族從臺灣出發」的「基因（DNA）證據」？
        options:
          - 南島語系有 1,257 種語言，數量在全世界的語系中排第二
          - 和拉皮塔陶器類似的陶器，在臺灣、巴丹群島、呂宋都找得到
          - 萬那杜、東加出土的古人骨，祖先來自臺灣與菲律賓北部
          - 多數新研究認為，夏威夷約在 900–1200 年才有人定居
        answer: 2
        explain: 語言的數量是語言證據，陶器是考古證據，人骨裡的古 DNA 才是基因證據。「出臺灣說」是學界主流，但也有「出巽他說」等其他看法，還有人認為語言主要靠接觸傳開。
        hints:
          - 先把四個選項分類：哪個是語言？哪個是考古？
          - 基因證據要從人身上（或人骨裡）找。
        ref: peoples:mig-austronesian
      - kind: choice
        q: 清代以後，很多平埔族人和漢人通婚、改說閩南語或客語。這件事最能說明什麼？
        options:
          - 一群人的語言可以換，但祖先和認同不一定跟著消失
          - 平埔族已經完全消失，今天臺灣沒有人認同自己是平埔族
          - 改說閩南語的人，祖先也就變成了從福建來的漢人
          - 清代政府規定平埔族一律要改說閩南語，所以大家都改了
        answer: 0
        explain: 臺灣放大鏡寫著，平埔族群清代以後逐漸和漢人通婚、改說閩南語或客語；可是 2026 年西拉雅族仍被認定為第 17 個原住民族。語言換了，祖先不會跟著換，認同也可能延續或重建。資料沒有提到政府規定一律改說閩南語。
        hints:
          - 改說另一種話以後，阿公阿嬤的阿公阿嬤會變成別人嗎？
          - 回到臺灣放大鏡，看平埔族群那段說明，再看 2026 年發生了什麼事。
        ref: peoples:Taiwan
      - kind: short
        q: 西拉雅語在 20 世紀初就不再日常使用，西拉雅族卻在 2026 年被認定為原住民族。用一兩句話說明：這說明了「語言」和「認同」之間的什麼關係？
        model: 語言不再日常使用，不代表這群人和他們的認同就消失了；認同可以延續，也有人在重建語言、在學校教學，最後在 2026 年取得官方承認。說什麼話和認為自己是誰，是兩件不同的事。
        explain: 西拉雅卡的「常見誤解」提醒：「平埔族已經消失了」是誤解；臺灣放大鏡寫著西拉雅族是第一個依《平埔原住民族群身分法》認定的平埔族群。
        hints:
          - 回去看西拉雅卡的「常見誤解」：今天有人在做什麼？
          - 語言不說了，人還在嗎？他們怎麼看自己？
        ref: social-siraya-deer
  - type: recap
    model_answer: |
      回到一開始的問題：為什麼「說什麼話、認為自己是誰、祖先從哪裡來」常常不一樣？
      因為這三件事會各自改變。語言可以換：很多平埔族人清代以後改說閩南語或客語，很多客家人今天平常說華語。認同可以延續或重建：西拉雅語早就不再日常使用，西拉雅族卻在 2026 年被認定為原住民族。祖先則是一層一層疊起來的：臺灣有說南島語的原住民族，一般認為他們的祖先有一支還從臺灣出海到太平洋；17 世紀有荷蘭人和西拉雅人的鹿皮貿易；清代又有大量閩南、客家移民渡海而來；戰後還有來自中國各省的移民。
      所以地圖上不畫「人種」：人的樣子是漸變的，「種族」是各國社會自己訂的分類。比較好的看法是分開問三個問題，再加上第四個問題：這群人是自己選擇移動的，還是被迫的？例如大西洋奴隸貿易的非洲人，就是被迫的。
reflect: 用這個單元的三種問法回答自己：你平常說什麼話？你覺得自己屬於哪一群人？你知道祖先（例如阿公阿嬤的阿公阿嬤）從哪裡來嗎？三個答案一樣嗎？如果不一樣，是什麼時候、為什麼開始不一樣的？可以回家問問家人；如果不知道或不方便問，也可以選一位你認識的人，或課本裡的人物來回答。

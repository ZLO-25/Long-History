      - { id: s3, title: "Encuentra Bardina, Shipwrecks and Western Mediterranean trade networks (MA diss., Southampton, 2013)", url: 'https://www.ancientportsantiques.com/wp-content/uploads/Documents/AUTHORS/Encuentra%202013-WesternMedTrade.pdf', accessed: 2026-10-25 }
      - { id: s2, title: Pleiades 地名資料庫, url: 'https://pleiades.stoa.org/', accessed: 2026-10-24 }
      - { id: s9, title: "Natural Earth 1:10m 陸地（world-atlas，公有領域；用來算港間不穿過陸地的海路）", url: 'https://www.naturalearthdata.com/', accessed: 2026-10-25 }


      - kind: choice
        q: 有人說：「幾百個西班牙人靠槍炮打垮了阿茲特克帝國。」哪一個回應最穩妥？
        options:
          - 大致正確：西班牙人的槍炮和鋼刀遠勝對手，原住民盟軍只負責搬運補給
          - 不正確：阿茲特克人以為西班牙人是神，所以幾乎沒有抵抗就直接投降
          - 太簡化了：西班牙方面前後約兩三千人，身邊還有估計 8 萬到 20 萬的原住民盟軍，天花也重創阿茲特克
          - 不正確：西班牙人完全沒有武器上的優勢，勝利全靠天花疫情
        answer: 2
        explain: 這是一個要並列看法的問題。西班牙方面前後約兩三千人，原住民盟軍估計有 8 萬到 20 萬人（估計不精確），1520 年起天花也重創阿茲特克。傳統說法強調勇氣與武器；另一派學者認為這樣說太誇張：Hassig 認為武器優勢「並非壓倒性」，Restall 說西班牙武器只是讓他們撐到援軍來的「生存公式」，天花也常被低估。「阿茲特克人以為西班牙人是神」這個流行說法，歷史學者 Townsend 也提出質疑。
        hints:
          - 先看「戲劇 vs 史實」：西班牙方面和原住民盟軍各有多少人？
          - 1520 年，阿茲特克還遇上了什麼？
          - Hassig 和 Restall 怎麼看西班牙人的武器？
        ref: event-columbus-aztec#story

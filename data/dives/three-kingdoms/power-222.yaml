title: 夷陵之戰後：三分天下（222 年）
note: 219 年劉備奪下漢中，同年關羽北攻襄樊時被孫權偷襲，荊州落入吳手。220 年曹丕篡漢建魏，221 年劉備在成都稱帝，222 年夷陵之戰被陸遜打敗。之後魏、蜀、吳的邊界大致固定：魏與吳隔著淮河—長江之間的地帶對峙（合肥、襄陽在魏手），蜀守漢中與三峽；甘肅東南的武都一帶是魏蜀之間的空隙，圖上留白，229 年才被蜀取得。孫權 229 年稱帝。遼東公孫氏仍半獨立，到 238 年才被司馬懿消滅。以今日省界近似，邊界只是示意。

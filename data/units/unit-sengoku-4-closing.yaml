id: unit-sengoku-4-closing
title: 打贏了，為什麼還要管住大名、管住海？（1600–1639）
histories: [日本史, 中國史]
mystery: 1600 年德川家康在關原幾個小時內打贏，卻花了十五年才滅掉豐臣家；再過二十多年，幕府開始嚴格限制誰能出海、誰能來日本，這套管制一管就是兩百年。一個已經贏了的人，為什麼還需要這麼多道防線？
teaser: 一封說謊的信、一座山上的猶豫、一口鐘上的八個字、一張十三條的法度，和一座人工島：贏了之後的日本怎麼把自己關起來。
goals:
  - 能說出從秀吉之死、關原、大坂之陣到武家諸法度、島原之亂與「鎖國」的因果順序
  - 能判讀五奉行寫給朝鮮前線的信，說出它為什麼要說謊
  - 能比較江戶幕府的「鎖國」與明朝的海禁，說出兩者留了哪些門、結果有何不同
  - 能指出「小早川被大砲嚇到才倒戈」「鎖國就是完全不和外國往來」這些說法，哪些有史料爭議
  - 能從豐臣家、浪人、天主教徒的角度，說出德川的「太平」是誰付出的代價
minutes: 40
steps:
  - type: hook
    text: |
      想像一個社團換了社長。新社長在改選中大勝，可是前社長的兒子還住在最大的那間社辦裡，一群被開除的舊社員在外面等著翻盤，還有外面來的老師在社團裡招自己的學生。
      新社長贏了，但他睡得著嗎？他會先做什麼：把前社長的兒子請走？立一套社規？還是管住外面來的人、也管住自己人出海？
      1600 年以後的日本，德川家康和他的兒孫，三件事都做了。這個單元我們看他們怎麼做、付出什麼代價，也看是誰替這個「太平」買單。
  - type: decision
    role: 你是 1600 年 10 月 21 日早上，在松尾山上的小早川秀秋
    situation: |
      1598 年秀吉病死後，大名分成德川家康的東軍和石田三成的西軍。1600 年 10 月 21 日，你的部隊布陣在關原盆地一側的松尾山上，名義上屬於西軍。山下的盆地裡，東軍和西軍各約八萬人（估計）正在對決。
      兩邊都打著「為了秀賴」的旗號。戰前你和東軍的黑田長政有書信往來；山的另一頭，南宮山上的毛利軍到現在還沒有動。
      把你的想法寫下來。
    options:
      - label: 倒戈，從山上攻擊西軍
        result: 這是小早川當年的選擇。他一動手，毛利軍又按兵不動，西軍在幾個小時內崩潰；石田三成被捕，11 月 6 日在京都處刑。戰後家康沒收了約九十家大名的領地，重新分配數百萬石（數字各家不同，都是估計）。至於小早川「什麼時候」決定的，史料有不同說法，見下面的解析。
      - label: 照原計畫替西軍作戰
        result: 推測：吉川廣家在前一天就已經與東軍密約，讓南宮山的毛利秀元無法前進，西軍能不能靠松尾山的部隊扭轉戰局，無法知道。歷史沒有走這條路，所以後果只能推測。
      - label: 按兵不動，看誰贏再說
        result: 推測：毛利軍就是這樣沒有動；戰後毛利家從八國減到周防、長門兩國。「不選邊」在關原之後也要付代價，但小早川如果這麼做會怎樣，歷史沒有走這條路，所以後果只能推測。
    actual: 小早川倒戈，西軍崩潰。但他的「猶豫」本身就有爭議：江戶時代的軍記說他猶豫到中午，家康對松尾山開槍威嚇（「問鐵砲」）他才動手；白峰旬等學者依他戰前與黑田長政往來的書信，主張他開戰時就已經是東軍；Turnbull 則認為以東軍陣地與松尾山的距離，「開槍威嚇」極不可能發生。三種說法都還沒有定論。所以，回頭看你剛才寫下的想法：如果你替他設想了一場「山上的掙扎」，先問問這個掙扎有沒有史料支持，還是後人加上去的。
    ref: war-sekigahara#A1
    note: 他當時看得到的是：兩邊都說「為了秀賴」、毛利不動、自己和黑田的書信。他看不到的是：家康戰後會怎麼處理大名，更看不到十五年後豐臣家會被整個消滅。谷徹也提醒，當時大名多半「草隨風倒」，看誰勢頭強就跟誰；不要用結果倒推他「應該」怎麼選。「沒有發生的選項」的後果都是推測，標示清楚。
  - type: card
    id: war-sekigahara
    depth: deep
    prompt: 先看這場「天下分水嶺」。先對照你剛才替小早川寫下的想法。注意兩件事：誰在戰鬥中換邊、誰按兵不動；再讀「史家怎麼吵」：小早川秀秋到底什麼時候倒戈，有幾種說法？「家康開槍威嚇」這一段是哪裡來的？
  - type: source
    card: war-sekigahara
    idx: 0
    question: 這封信寫於秀吉死後一週，五位奉行卻說「太閤的病情已逐漸好轉」。他們最可能想做什麼？
    options:
      - 秀吉其實還活著，奉行說的是實話
      - 隱瞞死訊，怕朝鮮前線十幾萬大軍知道主君已死會動搖，先穩住撤軍
      - 向家康示好，讓他知道奉行站在他那邊
      - 要前線趁機加緊進攻明朝
    answer: 1
    explain: 收信的是在朝鮮前線的鍋島直茂。當時十幾萬日軍還在朝鮮，一旦知道主君已死，可能全線潰散或被明朝與朝鮮軍追擊；五奉行選擇隱瞞，同時安排撤軍。讀史料要先問：誰寫的、寫給誰、當時發生了什麼事。這個決定保住了撤軍秩序，但也讓前線將領日後更覺得自己被後方的官僚操縱，這筆帳後來算到了石田三成頭上。
    hints:
      - 看史料下面的說明：這封信的日期是秀吉死後一週。一個已經死了一週的人，病情怎麼會「好轉」？
      - 收信的人在哪裡？那裡還有多少日軍？
      - 如果你是前線的將軍，聽到主君死了，你會繼續打還是想回家？奉行最怕的就是這個。
    ref: war-sekigahara#A7
  - type: card
    id: person-ishida-mitsunari
    depth: understand
    prompt: 西軍的實際發起人不是武將，而是算帳、量田、管補給的官僚。讀「關鍵決定」：1598、1599、1600 年他各面對什麼選擇？「奸臣」這個標籤是誰貼的？
  - type: card
    id: person-tokugawa-ieyasu
    depth: understand
    prompt: 贏家的下一步。讀故事和「他改變了什麼」：他 1603 年當上將軍，為什麼 1605 年就讓位給兒子？再讀「關鍵決定」：1614 年他看到的選項有哪些，豐臣家本來有沒有活路？
  - type: card
    id: war-osaka-sieges
    depth: deep
    prompt: 關原之後十四年，豐臣秀賴還住在大坂城。讀「起因」：一口鐘上的八個字怎麼變成開戰理由？再讀「史家怎麼吵」：家康是不是故意找碴，有哪幾種看法？讀「交戰方」：投奔大坂城的是什麼人？最後看「戲劇 vs 史實」：「真田幸村」這個名字，他本人用過嗎？想從城裡面看，可以點「和誰有關係」裡的淀殿，讀她的「關鍵決定」：1614 年秋天她看得到的兩條路各要付什麼代價？
  - type: check
    items:
      - kind: choice
        q: 方廣寺鐘銘「國家安康」為什麼被德川方當成開戰理由？
        options: [因為鐘銘寫了要攻打江戶, 因為鐘是秀吉留下的遺物不准重鑄, 因為鐘是用德川家的銅鑄的, 因為「家康」兩個字被拆開，德川方說這是在詛咒家康]
        answer: 3
        explain: 「國家安康」把「家」「康」兩字拆開，德川方說這是詛咒；「君臣豐樂」又被說成以豐臣為君。但史家對這是不是家康故意找碴有不同看法：笠谷和比古、渡邊大門認為使用家康名諱確實犯了當時的忌諱，傳統說法則認為是刻意問題化。
        hints: [回去看大坂之陣卡的「起因」。, 想想哪兩個字被拆開了？]
        ref: war-osaka-sieges#A2
  - type: card
    id: event-buke-shohatto-sankin
    depth: story
    prompt: 滅掉豐臣家之後，幕府用什麼取代「再打一場仗」？只要看故事：1615 年的 13 條法度管什麼？1635 年又加了哪兩條？其中「禁造 500 石以上大船」，和下一步的「鎖國」有什麼關係？
  - type: card
    id: war-shimabara
    depth: understand
    prompt: 鎖國令前最後一場大亂。讀「起因」，把「重稅」和「禁教」分開看；幕府把這場亂定性為天主教徒叛亂，多數研究認為苛政引起的民怨是主因，但也有學者強調它同時帶有宗教一揆的性格（看「戲劇 vs 史實」第二條）。再讀「結果」：亂後隔年幕府做了什麼？
  - type: card
    id: event-sakoku
    depth: understand
    prompt: 最後看「鎖國」本身。日本到底關了門沒有？它留了哪四扇門？「鎖國」這個詞是哪一年、誰造出來的？
  - type: chain
    prompt: 把下列事件依照「因 → 果」排成一條鏈（最上面是最早的）。
    items:
      - 1598 年秀吉病死，五歲的秀賴由五大老、五奉行共治
      - 1600 年關原之戰，家康獲勝，沒收約九十家大名的領地
      - 1603 年家康任征夷大將軍；1605 年讓位給秀忠，確立世襲
      - 1614 年方廣寺鐘銘事件，大坂冬之陣
      - 1615 年大坂夏之陣，豐臣家滅亡；同年頒布一國一城令與武家諸法度
      - 1635 年寛永令加入參勤交代、禁造 500 石以上大船；同年禁止日本船出海
      - 1637–1638 年島原之亂
      - 1639 年禁止葡萄牙船來航
    explain: 秀吉死後的權力真空 → 關原決定誰最強 → 家康把將軍職變成世襲，但豐臣家還在 → 用鐘銘開戰、滅豐臣 → 不再打仗，改用成文法管大名 → 把大名和海外隔開（大船禁令、禁出海）→ 島原之亂被定性為天主教徒叛亂 → 趕走葡萄牙人。注意：卡片提醒，幕藩體制不是一戰造成的，要到 1630–1640 年代才定型；島原之亂後實際斷絕葡萄牙關係也花了約一年半。
    hints:
      - 先找「秀吉死」和「關原」，這是起點；再找「豐臣家滅亡」，中間隔了十五年。
      - 法度（1615）在滅豐臣的同一年；參勤交代與大船禁令（1635）在二十年後。
      - 島原之亂（1637–38）在禁葡萄牙船（1639）之前，幕府是拿亂事當理由的。
    ref: event-buke-shohatto-sankin#C6
  - type: compare
    cards: [event-sakoku, event-wokou-ningbo]
    prompt: 比一比兩次「管住海」：17 世紀江戶幕府的「鎖國」，和 14–16 世紀明朝的海禁。兩個政權都想管住海上往來，結果卻很不一樣。
    rows:
      - { aspect: 誰、什麼時候, a: 江戶幕府第三代將軍家光，1633–1639 年陸續發令；1853 年培理來航、1854 年簽約才結束, b: 明朝 1371 年起實行海禁，斷斷續續到 1567 年開放月港 }
      - { aspect: 禁什麼, a: 禁止日本船出海、日本人出國，在國外住過再回來的人要處死；趕走葡萄牙人、嚴禁天主教, b: 民間一律不准出海，對外往來只剩朝貢；日本只能憑「勘合」十年一次派船到寧波 }
      - { aspect: 留了哪些門, a: 「四口」：長崎（中國、荷蘭，荷蘭人限住出島）、對馬（朝鮮）、薩摩（琉球）、松前（愛努）, b: 市舶司：寧波管日本、泉州管琉球、廣州管東南亞；1567 年後月港准民間領文引去 43 港，但仍禁止去日本 }
      - { aspect: 主要理由, a: 把天主教與西班牙、葡萄牙看成真正的威脅；貿易集中到長崎也讓幕府靠稅收充實財庫、壓過其他大名, b: 切斷倭寇與沿海居民的聯繫 }
      - { aspect: 結果, a: 荷蘭人因為同意不傳教成為唯一能留下的歐洲人；政策一直到 1853 年培理艦隊來才結束, b: 中國缺銀、日本多銀，走私商人聚在雙嶼；1548 年雙嶼被攻毀後走私集團武裝化，1553 年王直「連艦數百」；最後靠 1567 年開放月港，倭患才真正平息 }
      - { aspect: 後人怎麼說, a: 「鎖國」一詞 1801 年才出現；1970 年代起日本學者指出四口一直開著，越來越多研究改用「海禁」, b: 《明史》承認「真倭十之三，從倭者十之七」；劉婷玉認為「嚴禁派 vs 開海派」的二分太簡化 }
    question: 同樣是管住海上往來，為什麼明朝的海禁製造了四十年的走私戰爭、最後靠開放收場，江戶的「鎖國」卻維持了兩百多年？請至少說出一個可能的原因，再說說這兩個「關門」其實哪裡像。
    model_answer: 一個可能的原因在「門」的設計：江戶幕府把對外往來集中到四個由自己或指定大名掌握的窗口，長崎的中國與荷蘭貿易一直進行，幕府還靠它收稅；明朝的海禁則讓民間沒有任何合法出口，而中日之間的絲銀差價太大，想做生意的人只能走私，走私被打擊就武裝起來。另一個差別是時間點：江戶關門是在國內已經沒有武裝對手、大名被法度管住之後；明朝的海禁則一直和沿海士紳的利益衝突，朱紈就是因此被彈劾自盡的。至於哪裡像：兩者都不是「完全不往來」，日本開著四口，明朝也留著朝貢和市舶司；兩者的名稱都是後人或外人貼上去的，「鎖國」1801 年才被造出來，近年學者乾脆用「海禁」稱呼江戶日本。兩邊的史家也都提醒不要二分：日本學者質疑「鎖國」這個說法，劉婷玉則認為明朝「嚴禁 vs 開海」的二分太簡化。這題沒有標準答案。
    hints:
      - 先看「留了哪些門」那一列：哪一邊的門是政權自己握著、還能收稅？
      - 再看「結果」那一列：明朝這邊，禁令之後出現了什麼？是靠什麼收場的？
      - 最後看「後人怎麼說」：兩邊的史家都在反對同一件事，是什麼？
  - type: today
    card: event-sakoku
    question: 有人說「江戶鎖國就像今天某些國家搞封鎖、打貿易戰，是一樣的事」。這個類比哪裡不成立？
    model_answer: 先說不能類比的地方：江戶幕府的海禁以宗教與政權安全為主要考量，出國的人會被處死；它不是今天國家用關稅、出口管制來調整貿易的做法。而且「鎖國」根本不是完全關門，四口一直開著，連「鎖國」這個詞都是 1801 年才出現的。可以借來想的，是「關門與開門的代價」：誰得利、誰付代價。得利的是掌握貿易的幕府和取得獨家地位的荷蘭人；付代價的是被驅逐的葡萄牙人，以及不能出海、在海外回不來的日本人。另一件可以想的是：一個政策的名字是後人取的，名字會不會改變我們對它的理解？「鎖國」聽起來像全部關上，「海禁」聽起來像管制，兩個詞描述的是同一段歷史。
  - type: check
    items:
      - kind: choice
        q: 滅掉豐臣家之後，德川幕府主要靠什麼管住全國大名兩百多年？
        options: [每隔幾年再打一場仗立威, 把所有大名的領地收歸幕府直轄, 13 條武家諸法度加上參勤交代等成文規矩, 請天皇下詔命令大名服從]
        answer: 2
        explain: 1615 年崇傳在伏見城宣讀 13 條法度：修城要報備、不准私下聯姻、不得窩藏罪犯；1635 年再加上參勤交代與大船禁令。違反者可被減封或改易，福島正則就是因為沒報備修廣島城而被改易。卡片提醒：法度的執行靠處分的威嚇，幕府並沒有常備的全國官僚體系。
        hints: [回想武家諸法度卡的「為什麼值得知道」：幕府靠的「不是」什麼？, 一張法度加上一套「每年來江戶報到」的制度。]
        ref: event-buke-shohatto-sankin#C4
      - kind: order
        q: 依時間先後排列：
        items: [關原之戰, 家康任征夷大將軍, 大坂夏之陣、豐臣家滅亡, 寛永令加入參勤交代, 島原之亂, 幕府禁止葡萄牙船來航]
        explain: 1600 關原 → 1603 將軍 → 1615 夏之陣 → 1635 寛永令 → 1637–38 島原之亂 → 1639 禁葡萄牙船。

# 深入專題：法國大革命。怎麼新增一個專題見 docs/dives.md；勢力圖的切線與來源見 docs/dive-french-revolution.md
id: dive-french-revolution
title: 法國大革命：從破產的王國到拿破崙帝國
question: 一個歐洲最富有的王國，為什麼會因為「繳不出利息」而推翻國王？「自由、平等、博愛」喊出來之後，為什麼走向斷頭台和恐怖統治，最後又換來一個皇帝？
blurb: 這個專題把 1774 年路易十六即位到 1815 年滑鐵盧放大來看：王室怎麼被債務壓垮、三級會議怎麼變成國民議會、人權宣言寫了誰的權利又漏了誰、紙幣指券怎麼失控、恐怖統治怎麼開始又怎麼結束，以及拿破崙留下的法典與公制，為什麼今天全世界還在用。每個人物都放上「從另一邊看他」：被處決的人、旺代的農民、被占領國的人民、海地的奴隸。
# 1774 路易十六即位（接手七年戰爭留下的債）；1815 滑鐵盧之戰，拿破崙時代結束
range: { start: 1774, end: 1815 }

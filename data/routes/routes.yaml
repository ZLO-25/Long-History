  - id: road-via-domitia
    name: 多米提亞大道（Via Domitia）
    kind: road
    start: -118
    end: 500
    precision: traced
    note: 前 122 年戰勝阿洛布羅基人後由多米提烏斯下令修築（常記為前 118 年），由阿爾卑斯山口經尼姆、納博訥到庇里牛斯山。
    method: awmc-road
    waypoints: ['167691', '167750', { lat: 44.56, lng: 6.08, name: Vapincum }, '157925', '147993', '148027', '148093', '148223', '148142', '147990', '148081', '148056', '246347', '246348', { lat: 42.47, lng: 2.87, name: Summum Pyrenaeum }]

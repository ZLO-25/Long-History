    question: 有人說：「今天網路和航空把全世界連得很緊，就像蒙古和平；連得越緊，疾病也一定跟著傳得越快。」這個類比哪裡不成立？
    model_answer: 先說不成立的地方：「蒙古和平」是後人造的詞，當時的人不用這個名稱，而且描述的是征服之後的狀態；蒙古的連線靠驛站的馬匹接力與軍隊管理，和今天的網路、航空是完全不同的條件。鼠疫是不是沿著蒙古商路西傳，學界仍有爭議，黑死病的發源地也有中國、中亞、西亞等不同說法，所以不能把「連線造成疾病」當成已證實的歷史結論。另外，旅行者的記錄有沒有誇大，要靠其他史料核對。可以借來想的是：「連線越多，風險也跟著流動」，同一條路能傳貨、傳消息，有學者主張也能傳疾病；而且一個時代被稱為「和平」，要問是誰的和平。
    points:
      - 「蒙古和平」是後人造的詞，描述的是征服之後的狀態；蒙古靠驛站馬匹接力與軍隊管理，條件和今天不同
      - 鼠疫是否沿商路西傳、黑死病發源地都仍有爭議，不能當成已證實的結論
      - 旅行者的記錄要靠其他史料核對
      - 可以借來想：連線越多，風險也跟著流動；「和平」要問是誰的和平

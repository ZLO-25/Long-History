id: unit-rome-2
title: 一個人說了算之後：帝國怎麼治理，又為什麼守不住
histories: [希臘羅馬史, 世界通史]
mystery: 奧古斯都沒有稱王，卻讓羅馬變成一個人說了算。這個帝國靠什麼管住這麼大的地方？為什麼到了三世紀差點散掉，後來西半部又沒撐住？
teaser: 一個自稱「只是第一公民」的人，一座被火山灰封存的城市，一位把帝國交給四個人管的皇帝，和一個曾經被迫害的宗教。
goals:
  - 能說出奧古斯都怎麼保留共和外殼、把實權集中到自己手上，並分辨他自己寫的說法和其他證據
  - 能說出「羅馬和平」「羅馬法」的兩面：它帶來什麼，又把誰擋在外面
  - 能說出戴克里先怎麼回應「一個人管不了全帝國」，以及這個做法的代價
  - 能依時間排出從奧古斯都到西羅馬皇帝被廢的幾個關鍵事件，並分辨國教是哪一年才定下的
minutes: 55
level: 高中
curriculum: []
companion: unit-rome-1
steps:
  - type: hook
    text: |
      想像班長選舉之後，贏的人說：「我不當班長，我只是大家公認最有威望的同學。」班會照開，幹部照選。
      可是班上的錢、值日表、誰能去比賽，最後都是他說了算。（這只是比喻。）
      羅馬的第一位皇帝奧古斯都，就是這樣。這個單元要看：一個人說了算的羅馬，怎麼管這麼大的地方、怎麼對待人和神，又為什麼在三世紀差點散掉。
    guess:
      q: 奧古斯都沒有稱王，他怎麼讓羅馬變成一個人說了算？
      options:
        - 修改法律，正式廢除元老院和官職
        - 保留元老院和官職的名稱，自己只稱「第一公民」，實權卻握在手上
        - 讓人民投票，選他當終身的國王
        - 靠外國軍隊支持，逼元老院聽話
      reveal: 他保留元老院、官職和公民大會，自稱「第一公民」，沒有稱王；但軍團向他個人宣誓，元老院失去外交、財政與戰爭的控制權。名稱沒變，實權變了。
  - type: card
    id: event-augustan-principate
    depth: understand
    prompt: 注意奧古斯都有沒有稱王，元老院、官職和公民大會還在不在，軍團向誰宣誓，以及元老院失去了哪三件事的控制權。
    focus: [C4]
    quick:
      - q: 奧古斯都沒有稱王，也沒有廢掉元老院，實權是怎麼到他手上的？
        a: 名稱不變、實權改變：元老院、官職、公民大會都還在，但元老院失去外交、財政與戰爭的控制權，士兵也向他個人宣誓效忠。
      - q: 奧古斯都說他把國家「交還」給人民，這句話可以直接相信嗎？
        a: 不能。《功業錄》是他自己寫的政治自述，目的在塑造形象；他說自己「權力不比同僚多」，也是他自己的說法，要和軍團、元老院的實際情況對照。
  - type: source
    card: event-augustan-principate
    idx: 0
    question: 奧古斯都寫：「我把國家從我個人的掌控，交還給元老院和羅馬人民的意志。」讀這句話時，最需要注意什麼？
    options:
      - 這是中立史家事後整理的紀錄，所以可以直接當成事實使用
      - 這句話證明共和在前 27 年就已經完全恢復，元老院重新掌權
      - 這是他死後元老院為了紀念他，特別替他寫下的一篇悼詞
      - 這是他自己寫的政治自述，要和其他證據對照
    answer: 3
    why_wrong:
      - 《功業錄》是奧古斯都自己寫的，不是中立史家整理的。
      - 前 27 年他接受十年的行省指揮權，仍握有大部分軍團，共和並沒有完全恢復。
      - 它是他自己寫的，不是他死後元老院替他寫的悼詞。
      - null
    explain: 《功業錄》是奧古斯都自己寫的，目的在塑造形象，不能當成中立紀錄。對照卡片的其他內容：前 27 年他接受十年的行省指揮權，仍握有大部分軍團；元老院失去外交、財政與戰爭的控制權；軍團向他個人宣誓。史家對這件事的看法也不同：蒙森看成皇帝與元老院共享權力，現代史家多半視為君主制的一種變體。
    hints:
      - 先看這份文件是誰寫的，他有沒有理由把自己寫得好看？
      - 回到卡片：前 27 年之後，誰握著大部分軍團？
      - 一個人說「我交出權力」，你還需要查什麼才能確認？
    ref: event-augustan-principate#C4
  - type: card
    id: person-augustus
    depth: understand
    prompt: 讀「另一面的記載」：蘇埃托尼烏斯怎麼寫他在前 43 年的公敵宣告？和《功業錄》裡的他有什麼不同？
    focus: [P3, debate]
    quick:
      - q: 蘇埃托尼烏斯怎麼寫奧古斯都在前 43 年的公敵宣告？
        a: 他寫奧古斯都一開始反對，但名單開始後，比兩位同伴更堅持不放過任何人，連自己的監護人托拉尼烏斯都放進名單。
      - q: 為什麼要把《功業錄》和蘇埃托尼烏斯的記載放在一起看？
        a: 《功業錄》是他自己寫的形象，說他赦免請求寬恕的公民；蘇埃托尼烏斯寫的是公敵宣告這另一面。兩邊並列來看，才不會只聽他自己的說法。
  - type: today
    card: event-augustan-principate
    question: 有人把某些現代政治說成「奧古斯都模式」：制度的名稱都還在，實權卻集中在一個人手上。這樣的類比哪裡不成立？
    model_answer: 先說不能類比的地方：羅馬沒有成文憲法、現代政黨與普選，「共和制度」在羅馬的意義和今天不同；奧古斯都靠的是軍團向他個人宣誓和龐大的恩庇網絡（埃及的財富與他的私人財產），這些條件今天沒有一一對應。而且史家對他也沒有共識：有人看成皇帝與元老院共享權力，多數現代史家視為君主制的變體。可以借來想的是：看一個制度時，不只看名稱，也看誰握有軍隊與錢、誰能否決誰。這裡只描述結構，不預測。
    hints:
      - 先想：羅馬有今天的憲法、政黨和普選嗎？
      - 奧古斯都的權力靠什麼維持？回想軍團宣誓和埃及的財富。
      - 看一個制度，除了名稱，還可以問哪兩件事？
    points:
      - 羅馬沒有成文憲法、現代政黨與普選，「共和制度」的意義和今天不同
      - 奧古斯都靠軍團向他個人宣誓和龐大的恩庇網絡（埃及財富與私人財產），這些條件今天沒有一一對應
      - 史家沒有共識：有人看成皇帝與元老院共享權力，多數現代史家視為君主制的變體
      - 可以借來想的是：看制度不只看名稱，也看誰握有軍隊與錢、誰能否決誰
  - type: card
    id: event-pax-romana
    depth: understand
    prompt: 「羅馬和平」是誰的和平？注意：它不是完全沒有戰爭，起訖年份各家說法不同，皇帝們也靠關神廟的門、鑄和平女神的錢幣來經營這個形象。
    focus: [C6, debate]
    quick:
      - q: 「羅馬和平」是說帝國完全沒有戰爭嗎？
        a: 不是。它指的是帝國內部沒有大規模內戰；邊疆和行省的戰爭、叛亂仍然不斷，例如西班牙、阿爾卑斯的戰事、猶太戰爭和對波斯的戰爭。
      - q: 皇帝們怎麼「經營」和平的形象？為什麼有學者說它是宣傳口號？
        a: 他們關上象徵和平的雅努斯神廟的門，鑄造印有和平女神的錢幣。莫米利亞諾說「羅馬和平」是「簡單的宣傳口號，卻是困難的研究題目」。
  - type: source
    card: event-pax-romana
    idx: 1
    question: 塔西佗記下奧古斯都遺留的帝國概要：建議「把帝國限制在現有的邊界之內」。關於羅馬為什麼停止向萊茵河以東擴張，卡片怎麼說？
    options:
      - 條頓堡慘敗常被提到，也有學者認為主因是那裡不值得占領，沒有定論
      - 只因為條頓堡慘敗，別無其他原因，這已是學界定論
      - 只因為哈德良的城牆完工了，羅馬人就不再往東邊打
      - 因為元老院投票通過了一部明文禁止擴張的法律
    answer: 0
    why_wrong:
      - null
      - 也有學者認為主因是日耳曼尼亞不值得占領，所以這個因果有爭議，不是定論。
      - 哈德良是在奧古斯都之後很久、約 117 年以後才停止擴張，用城牆固定北方邊界。

id: unit-rome-2
title: 一個人說了算之後：帝國怎麼治理，又為什麼守不住
histories: [希臘羅馬史, 世界通史]
mystery: 奧古斯都沒有稱王，卻讓羅馬變成一個人說了算。這個帝國靠什麼管住這麼大的地方？為什麼到了三世紀差點散掉，後來西半部又沒撐住？
teaser: 一個自稱「只是第一公民」的人，一座被火山灰封存的城市，一位把帝國交給四個人管的皇帝，和一個曾經被迫害的宗教。
goals:
  - 能說出奧古斯都怎麼保留共和外殼、把實權集中到自己手上，並分辨他自己寫的說法和其他證據
  - 能說出「羅馬和平」「羅馬法」的兩面：它帶來什麼，又把誰擋在外面
  - 能說出戴克里先怎麼回應「一個人管不了全帝國」，以及這個做法的代價
  - 能依時間排出從奧古斯都到西羅馬皇帝被廢的幾個關鍵事件，並分辨國教是哪一年才定下的
minutes: 55
companion: unit-rome-1
steps:
  - type: hook
    text: |
      想像班長選舉之後，贏的人說：「我不當班長，我只是大家公認最有威望的同學。」班會照開，幹部照選。
      可是班上的錢、值日表、誰能去比賽，最後都是他說了算。（這只是比喻。）
      羅馬的第一位皇帝奧古斯都，就是這樣。這個單元要看：一個人說了算的羅馬，怎麼管這麼大的地方、怎麼對待人和神，又為什麼在三世紀差點散掉。
  - type: card
    id: event-augustan-principate
    depth: understand
    prompt: 注意奧古斯都有沒有稱王，元老院、官職和公民大會還在不在，軍團向誰宣誓，以及元老院失去了哪三件事的控制權。
  - type: source
    card: event-augustan-principate
    idx: 0
    question: 奧古斯都寫：「我把國家從我個人的掌控，交還給元老院和羅馬人民的意志。」讀這句話時，最需要注意什麼？
    options:
      - 這是中立史家事後整理的紀錄，所以可以直接當成事實使用
      - 這句話證明共和在前 27 年就已經完全恢復，元老院重新掌權
      - 這是他死後元老院為了紀念他，特別替他寫下的一篇悼詞
      - 這是他自己寫的政治自述，要和其他證據對照
    answer: 3
    explain: 《功業錄》是奧古斯都自己寫的，目的在塑造形象，不能當成中立紀錄。對照卡片的其他內容：前 27 年他接受十年的行省指揮權，仍握有大部分軍團；元老院失去外交、財政與戰爭的控制權；軍團向他個人宣誓。史家對這件事的看法也不同：蒙森看成皇帝與元老院共享權力，現代史家多半視為君主制的一種變體。
    hints:
      - 先看這份文件是誰寫的，他有沒有理由把自己寫得好看？
      - 回到卡片：前 27 年之後，誰握著大部分軍團？
      - 一個人說「我交出權力」，你還需要查什麼才能確認？
    ref: event-augustan-principate#C4
  - type: card
    id: person-augustus
    depth: understand
    prompt: 讀「另一面的記載」：蘇埃托尼烏斯怎麼寫他在前 43 年的公敵宣告？和《功業錄》裡的他有什麼不同？
  - type: today
    card: event-augustan-principate
    question: 有人把某些現代政治說成「奧古斯都模式」：制度的名稱都還在，實權卻集中在一個人手上。這樣的類比哪裡不成立？
    model_answer: 先說不能類比的地方：羅馬沒有成文憲法、現代政黨與普選，「共和制度」在羅馬的意義和今天不同；奧古斯都靠的是軍團向他個人宣誓和龐大的恩庇網絡（埃及的財富與他的私人財產），這些條件今天沒有一一對應。而且史家對他也沒有共識：有人看成皇帝與元老院共享權力，多數現代史家視為君主制的變體。可以借來想的是：看一個制度時，不只看名稱，也看誰握有軍隊與錢、誰能否決誰。這裡只描述結構，不預測。
    hints:
      - 先想：羅馬有今天的憲法、政黨和普選嗎？
      - 奧古斯都的權力靠什麼維持？回想軍團宣誓和埃及的財富。
      - 看一個制度，除了名稱，還可以問哪兩件事？
  - type: card
    id: event-pax-romana
    depth: understand
    prompt: 「羅馬和平」是誰的和平？注意：它不是完全沒有戰爭，起訖年份各家說法不同，皇帝們也靠關神廟的門、鑄和平女神的錢幣來經營這個形象。
  - type: source
    card: event-pax-romana
    idx: 1
    question: 塔西佗記下奧古斯都遺留的帝國概要：建議「把帝國限制在現有的邊界之內」。關於羅馬為什麼停止向萊茵河以東擴張，卡片怎麼說？
    options:
      - 條頓堡慘敗常被提到，也有學者認為主因是那裡不值得占領，沒有定論
      - 只因為條頓堡慘敗，別無其他原因，這已是學界定論
      - 只因為哈德良的城牆完工了，羅馬人就不再往東邊打
      - 因為元老院投票通過了一部明文禁止擴張的法律
    answer: 0
    explain: 卡片寫的是：條頓堡慘敗之後羅馬停止向萊茵河以東擴張，奧古斯都也留下遺訓；但也有學者認為主因是日耳曼尼亞不值得占領，所以這個因果有爭議。別的方向還在擴張：帝國版圖要到 117 年圖拉真時才最大，之後哈德良才停止擴張，用城牆和要塞把北方邊界固定下來。這句話是塔西佗記下的，不是奧古斯都的親筆。（想看兩個邊疆故事的對照，可以再去讀「西羅馬為什麼會亡？」單元。）
    hints:
      - 這句遺訓是誰記下來的？記的是什麼時候的事？
      - 卡片這個因果標了「有爭議」，代表學者的意見一致嗎？
      - 哈德良是在奧古斯都之前還是之後固定邊界？
    ref: event-pax-romana
  - type: card
    id: event-pompeii-79
    depth: understand
    prompt: 龐貝不是帝國興衰的轉折，而是一扇窗：看麵包店、選舉題字、塗鴉。也注意那些「人形」是什麼，以及爆發的日期為什麼有爭議。小心：龐貝是城，龐培是人。
  - type: card
    id: social-roman-law
    depth: understand
    prompt: 同一套法律裡，一邊有「誰主張，誰舉證」，一邊把奴隸當財產。注意：一個人有什麼權利，要看他是什麼身分。
  - type: card
    id: event-early-christianity
    depth: understand
    prompt: 本單元只看歷史：羅馬官員怎麼對待這個團體，不討論基督徒相信的內容是否為真。注意迫害有多廣、250 年前後有什麼不同，以及塔西佗和小普林尼記下的是什麼。
  - type: source
    card: event-early-christianity
    idx: 1
    question: 圖拉真回覆小普林尼：「不必主動搜捕他們」，但被告發又證實的要處罰。這封信最能說明什麼？
    options:
      - 全帝國有統一的法令，各地官員都要挨家挨戶搜捕基督徒
      - 皇帝下令，從此不再處罰任何人，基督徒也不受任何限制
      - 官員不主動搜捕，被告發又證實的才處罰；這是皇帝給一位總督的答覆
      - 基督徒只因為信仰，就一律被判處死刑，沒有任何例外
    answer: 2
    explain: 小普林尼是當時在今日土耳其西北部的總督，他寫信問皇帝怎麼辦；圖拉真回信說不必主動搜捕，被告發並證實的要處罰，肯向諸神禱告的就赦免，匿名告發不受理。這是對一位總督的個別答覆，他自己也說定不出一體適用的規則。學者多半認為 250 年德西烏斯下令全帝國居民獻祭之前，迫害主要是地方性的，由總督而不是皇帝推動，結果從無罪釋放到處死都有。至於當時是依哪一條法律處罰，學者有三種解釋，沒有定論。
    hints:
      - 先看這句話的前半：官員要不要主動去找人？
      - 小普林尼是皇帝，還是向皇帝請示的總督？
      - 卡片說 250 年以前的迫害，主要是誰推動的？
    ref: event-early-christianity#C2
  - type: card
    id: event-crisis-third-century
    depth: understand
    prompt: 五十年換了二十多個皇帝。注意軍隊為什麼一再擁立皇帝、銀幣怎麼變、260 年瓦勒良發生什麼事，以及「史家怎麼吵」：這真的是全帝國的危機嗎？
  - type: decision
    role: 你是 284 年剛登基的戴克里先
    situation: |
      三世紀的羅馬皇帝，常被軍隊擁立，又被軍隊殺死：235 年之後的五十年間，換了二十多位。260 年皇帝瓦勒良被波斯俘虜，西邊自立出高盧帝國，後來東邊又有帕米拉帝國；274 年奧勒良才把帝國重新統一。
      現在你登基了。外敵、內戰和通膨一起來，一個人很難管全帝國。
      先別急著看選項：如果你是戴克里先，只知道這些，你會怎麼做？
    options:
      - label: 照舊一個人管，哪裡出事就趕去哪裡
        result: 推測：每個邊境出事，你都得親自處理，同一時間只能在一個地方。三世紀的皇帝多半在位很短、死於兵變或內戰，但那是不是因為一個人管不過來，卡片沒有這樣說，所以這只是推測的風險。歷史上戴克里先沒有選這條路，後果只能推測。
      - label: 只找一位同僚，一東一西分頭管，不另外預定接班人
        result: 這其實是戴克里先 286 年先走的一步：讓馬克西米安成為同等地位的正皇帝管西方，自己管東方。但他沒有停在這裡，293 年又加了兩位副皇帝。推測：如果只做到這一步，兩個人仍然顧不到所有邊境，誰來接班也沒有安排；歷史沒有停在這條路上，所以後果只能推測。
      - label: 分成四個人共治，其中兩位副皇帝是預定的接班人
        result: 這是戴克里先最後的做法。286 年他先讓馬克西米安成為同等地位的正皇帝管西方，自己管東方；293 年又各任命一位副皇帝，加萊里烏斯與君士坦提烏斯，副皇帝是預定的接班人。代價是，這個制度靠他個人的威望維持，他一退位就失靈。
    actual: 四個人的行政中心設在尼科米底亞、米蘭、錫爾米烏姆和特里爾，離邊境更近；稅制也被標準化。他放棄「元首」（第一公民）的稱號，進入「主宰」時期，奧古斯都留下的元首制至此結束。301 年他頒布限價敕令想壓住通膨，卻被認為適得其反，很快被無視；303 年起他發動對基督徒的大迫害。305 年 5 月 1 日，他成為第一位主動退位的羅馬皇帝，回到達爾馬提亞海岸的宮殿種菜（他為什麼退位，有「病後衰弱」和「被加萊里烏斯逼退」兩種說法，後者出自敵視他的作者）。他退位後，四帝的安排很快崩解，君士坦丁與馬克森提烏斯等人爭位，324 年君士坦丁成為唯一皇帝。
    ref: event-diocletian-tetrarchy#C2
    note: 沒有發生的選項，後果都是推測。前兩個選項是本單元為了讓你比較而設計的（卡片沒有記載戴克里先當時考慮過哪些方案）。這題沒有標準答案，當時的人也不知道這個制度會在他退位後崩解。卡片還提醒：常聽到的「戴克里先把帝國分成東西兩半」是過度簡化，學者一般把四帝共治看成一個皇帝團隊，而不是四個小帝國。
  - type: card
    id: event-diocletian-tetrarchy
    depth: understand
    prompt: 對照你剛才的想法：注意四個人怎麼分工、副皇帝的用意、301 年限價敕令，以及 305 年他做了什麼不尋常的事。限價敕令的批評者拉克坦提烏斯是敵視他的基督徒作者，他的話要當成批評者的說法看。
  - type: card
    id: event-christian-empire
    depth: understand
    prompt: 注意 311、313、325、380 四個年份各發生什麼事，哪一年基督教才被定為官方信仰。
  - type: card
    id: person-constantine
    depth: understand
    prompt: 他的故事有兩個「看見」的版本，一個沒有正式頒布的「敕令」，和一份偽造的獻土文件。注意每個說法是誰講的、什麼時候講的。
  - type: compare
    cards: [event-early-christianity, event-christian-empire]
    prompt: 比一比兩張卡：圖拉真時代怎麼處理基督徒，和 380 年之後國家怎麼對待基督教與其他信仰。
    rows:
      - aspect: 國家的態度
        a: 約 112 年圖拉真回信：不必主動搜捕，但被告發又證實的要處罰
        b: 380 年帖撒羅尼迦敕令：把尼西亞派基督教定為官方信仰，不同意的人被稱為「異端」，預告國家懲罰
      - aspect: 誰在推動
        a: 學者多半認為 250 年以前主要是地方性的，看總督怎麼做
        b: 皇帝出面定調：311 年加萊里烏斯（又譯伽列里烏斯）的寬容敕令、313 年君士坦丁與李錫尼的協議，到 380 年狄奧多西的敕令
      - aspect: 中間的轉折
        a: 250 年德西烏斯下令全帝國居民獻祭；303 年戴克里先的大迫害；311 年下令停止
        b: 313 年各宗教的信徒都能自由敬拜；325 年尼西亞會議；391 年關閉異教神廟
      - aspect: 常見的簡化說法
        a: 「兩百多年一直被迫害、殉道者數百萬」：學者多半認為 250 年前主要是地方性的；有學者估計被處死的是幾千人這個等級（估計，不是統計）
        b: 「君士坦丁把基督教定為國教」：313 年是讓各宗教都能自由敬拜，官方信仰要到 380 年才定下
    question: 這兩百多年之間，國家對基督教的態度怎麼走？有哪些簡化的說法要小心？
    model_answer: 從地方官處理被告發的人，到 303 年的大迫害，再到 311 年停止迫害、313 年各宗教都能自由敬拜，最後 380 年被定為官方信仰，391 年連異教敬拜也被禁止。要小心兩種簡化：一是「兩百多年一直被迫害」，學者多半認為 250 年前主要是地方性的；二是「君士坦丁定國教」，定為官方信仰是 380 年狄奧多西的事。另外，君士坦丁是否真心信仰，學者的看法也分歧。這題沒有標準答案。
    hints:
      - 先看第一列：兩個時期，國家的態度一個是「不主動搜捕」，一個是什麼？
      - 第三列：313 年和 380 年，差了幾十年，兩個年份各發生什麼？
      - 最後一列：卡片點名的兩個常見誤解各是什麼？
  - type: card
    id: event-fall-western-rome
    depth: understand
    prompt: 這張卡的原因，在「西羅馬為什麼會亡？」單元已經詳細討論過（那個單元專門談史家的各種答案），這裡只看時間線：376、378、410、約 439、476，以及 476 年發生的是不是一場大戰。
  - type: card
    id: event-byzantine-afterlife
    depth: understand
    prompt: 尾聲。476 年之後，東邊的人自稱什麼？「拜占庭」是誰取的名字？1453 年發生了什麼事？
  - type: chain
    prompt: 把下列事件依照時間順序排成一條鏈（最上面最早）。
    items:
      - 前 27 年起，奧古斯都以「第一公民」的名義建立元首制
      - 235 年皇帝被自己的士兵殺死，進入「軍營皇帝」時代
      - 293 年戴克里先正式建立四帝共治
      - 324 年君士坦丁成為唯一皇帝
      - 380 年狄奧多西一世頒布帖撒羅尼迦敕令
      - 476 年奧多亞塞廢掉年幼的皇帝
    explain: 前 27 年奧古斯都 → 235 年軍營皇帝 → 293 年四帝共治 → 324 年君士坦丁成為唯一皇帝 → 380 年帖撒羅尼迦敕令 → 476 年皇帝被廢。這題只問先後順序，排在前面不等於「造成」後面。前後的關係有強有弱：四帝共治是對三世紀危機的一種回應；但「三世紀留下的問題算不算西羅馬滅亡的原因之一」，學者看法不一。
    hints:
      - 最早的是共和與帝國的分界，最晚的是西邊皇位的結束。
      - 「軍營皇帝」是三世紀的事，四帝共治是為了回應它。
      - 君士坦丁成為唯一皇帝的 324 年，比狄奧多西的敕令早半個多世紀。
    ref: event-diocletian-tetrarchy#C7
  - type: check
    items:
      - kind: choice
        q: 313 年，君士坦丁與李錫尼達成了什麼共識？
        options:
          - 基督教成為帝國唯一合法的宗教，其他信仰一律禁止
          - 基督徒與各宗教的信徒都能自由敬拜
          - 所有異教神廟一律關閉，不准再舉行祭祀
          - 召開尼西亞會議，由皇帝統一基督教的教義
        answer: 1
        explain: 313 年的共識是讓基督徒與各宗教的信徒都能自由敬拜。君士坦丁人物卡引的百科條目還指出，兩人當時並沒有真的頒布一份敕令，「米蘭敕令」是後世通稱。尼西亞會議是 325 年；關閉異教神廟是 391 年；基督教被定為官方信仰，要到 380 年狄奧多西一世的敕令。
        hints:
          - 313 年的重點是「寬容」，還是「獨尊」？
          - 另外三個選項，年份分別是 325、380、391 年。
        ref: person-constantine#P3
      - kind: choice
        q: 龐貝遺址裡那些「人形」，是什麼？
        options:
          - 石膏灌進腐爛遺體留下的空洞，得到的人形
          - 被高溫在一瞬間變成石頭的居民遺體
          - 遇難者生前請工匠雕刻的自己的雕像
          - 被流動的熔岩包住、凝固之後留下的遺體
        answer: 0
        explain: 火山灰包住遺體，遺體腐爛後留下空洞，考古學家把石膏灌進去，得到人形的模型，不是遺體變成石頭。維蘇威的主要殺傷來自浮石與灰的落下，以及第二天的火山碎屑流，不是流動的熔岩。
        hints:
          - 回想卡片的「石膏灌模」：先有的是遺體，還是空洞？
          - 卡片提醒的常見誤解裡，有一個就是「被熔岩吞沒」。

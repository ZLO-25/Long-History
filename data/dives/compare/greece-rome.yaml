# 希臘 vs 羅馬對照表（docs/dives.md 第十節）。專題 yaml 用 compare: [greece-rome] 引用；檔名＝id 去掉前綴；資料只隨專題頁載入
id: greece-rome
title: 希臘 vs 羅馬
left: { label: 古希臘（以雅典為主）, dive: dive-ancient-greece }
right: { label: 古羅馬, dive: dive-ancient-rome }
rows:
  - aspect: 政治怎麼運作
    left: 雅典是直接民主：夠格的公民自己到公民大會表決；大部分官員和陪審員用抽籤決定，只有將軍等少數職位用選的。
    right: 羅馬共和是混合政體：每年選出兩位執政官互相牽制，終身任職的元老院是政府的中心，人民在公民大會投票，但少數有權勢的家族長期占著高位。
    left_card: social-athenian-democracy
    right_card: event-roman-republic-founding
    src: [C1, C2]
  - aspect: 誰算公民
    left: 成年男性才能投票；伯里克里斯時期規定要父母都是雅典人。女性、奴隸、獲釋奴隸、外邦人都被排除在外。
    right: 一開始也是封閉的，但羅馬在同盟戰爭後把公民權給了義大利的盟友，公民人數大增；西元 212 年卡拉卡拉讓帝國裡幾乎所有自由人都成為公民。
    left_card: social-athenian-democracy
    right_card: event-constitutio-antoniniana
    src: [C1, C2, C3]
  - aspect: 軍隊
    left: 城邦的軍隊是公民自己：重裝步兵自備盔甲和長矛，肩並肩排成密集的方陣作戰，所以「公民就是戰士」。
    right: 早期羅馬也靠公民當兵；共和晚期兵源放寬、戰事拉長，士兵越來越聽將軍的，到帝國時期變成效忠皇帝的常備軍。羅馬軍團分成小隊、比方陣靈活，在狗頭山和皮德納擊敗馬其頓方陣。
    left_card: event-greek-polis-colonization
    right_card: event-marian-reforms-sulla
    src: [C4, C5, C6]
  - aspect: 怎麼對待被征服的人
    left: 提洛同盟本來是共同防波斯，後來盟邦只能繳貢金；想退出的納克索斯、塔索斯被雅典出兵打到投降。
    right: 羅馬把征服的土地劃成行省，派總督、收稅；對希臘先宣布「自由」，五十年後毀了科林斯、馬其頓成行省。但公民權逐步開放：同盟者戰爭後給義大利人，212 年給帝國裡幾乎所有自由人。
    left_card: event-delian-league
    right_card: war-roman-conquest-greece
    src: [C7, C3, C8]
  - aspect: 宗教
    left: 多神信仰，每個城邦有自己的守護神和祭典；雅典在為酒神辦的節日裡舉行戲劇競賽，宗教和公民生活連在一起。
    right: 同樣信多神；帝國早期基督徒受迫害，313 年起可以公開敬拜，380 年狄奧多西一世把尼西亞派基督教定為官方信仰，391 年禁止異教敬拜。
    left_card: building-theatre-dionysus
    right_card: event-christian-empire
    src: [C9, C10]
  - aspect: 奴隸
    left: 奴隸是主人的財產，沒有政治權利；一般認為被釋放的奴隸也不能成為雅典公民，身分和外邦人差不多。
    right: 羅馬也把奴隸當財產，但被釋放的奴隸可以成為公民、可以投票，只是不能當高級官員，他們的兒子則沒有這些限制；這點和希臘多數城邦不同，但不能因此說羅馬比較人道。
    left_card: social-athenian-democracy
    right_card: social-roman-slavery-spartacus
    src: [C1, C11]
  - aspect: 留給今天什麼
    left: 民主、抽籤選陪審員、陶片放逐、劇場與悲劇、學院；英文的 democracy、politics、academy 都是從希臘文來的。
    right: 共和與元老院的名稱、羅馬法（歐洲大陸多數國家法典的基礎）、拉丁字母、道路與水道、基督教世界的形成；英文的 republic、senate 來自拉丁文。
    left_card: social-athenian-democracy
    right_card: social-roman-law
    src: [C12, C13]

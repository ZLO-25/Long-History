# 金融史：經濟中心的移轉（更早、安特衛普、阿姆斯特丹、之後）
- { id: finance-champagne-fairs, type: finance, track: west, name: 香檳市集與中世紀匯票, time: "1180–1320", civ: "法國", brief: "香檳伯爵保護下的六大市集（特魯瓦、普羅萬、拉尼、巴爾）、義大利商人結算、市集末的清算與匯票雛形、衰落原因（法王併吞、海路直航布魯日）。金融中心移轉的起點之一。" }

year: -338
basemap: aegean
title: 喀羅尼亞之後：馬其頓稱霸希臘（前 338 年）
note: "前 338 年八月，腓力二世在喀羅尼亞打敗雅典與底比斯聯軍。隔年（前 337 年）希臘各邦在科林斯開會，組成「科林斯同盟」：成員彼此保證不互相攻擊，並推腓力為盟主、對波斯作戰的統帥；這張圖畫的是戰後大局，同盟其實在前 337 年才正式成立。馬其頓直接控制馬其頓、色薩利與色雷斯；底比斯、科林斯衛城等要地駐有馬其頓守軍。斯巴達拒絕加入，克里特等地也不在同盟內。小亞細亞仍是波斯帝國的行省。以今日行政區近似，邊界只是示意；切線理由見 docs/dive-greece.md。"

id: unit-japan-meiji
title: 黑船來了：日本和清朝為什麼走出不同的路？
histories: [日本史, 中國史, 世界通史]
mystery: 1850–60 年代，日本和清朝幾乎同時開始學西方。三十年後，日本打敗了清朝。差別到底在哪裡？
teaser: 四艘軍艦（其中兩艘冒著黑煙的蒸汽船），讓一個兩百年限制對外往來的國家開始大改造。
goals:
  - 能說出江戶日本「鎖國」的真實樣貌，以及為什麼 1853 年後必須開國
  - 能判讀美國總統國書與《五條御誓文》，說出各自想要什麼
  - 能比較明治維新與自強運動，說出至少兩個差異
  - 能指出「日本成功、中國失敗」這種說法太簡單的地方
minutes: 35
level: 皆可
curriculum: ["歷 Ib-IV-1", "歷 Ia-V-2"]
steps:
  - type: hook
    text: |
      兩個同學在同一年發現自己數學落後很多。一個請了家教、只練計算題；另一個乾脆把整個讀書方法、作息、時間表都改掉。
      三十年後兩人比賽，結果大家都知道了。可是，真的只是「誰比較努力」的問題嗎？
      19 世紀中葉的日本和清朝，就是這兩個同學。
    guess:
      q: 三十年後日本打敗了清朝。先猜猜看：兩國學西方，最大的差別是什麼？
      options:
        - 日本買到的武器比清朝多，也比清朝新
        - 日本的官員比較認真，清朝的官員比較懶散
        - 日本不只學技術，連政府和制度都跟著大改
        - 日本找到了強國當靠山，清朝只能靠自己
      reveal: 日本推翻舊幕府，由新的中央政府全面改造政治、軍事、社會制度；清朝主要由地方大員引進技術，朝廷體制大致不變。不過 1880 年代以前，清朝的兵工廠和造船廠並不比日本差，所以也不能只看結果。
  - type: card
    id: event-sakoku
    depth: story
    prompt: 先看日本「關門」的那兩百年。注意：門真的全關上了嗎？
    focus: [C4]
    quick:
      - q: 很多人以為「鎖國」就是日本完全不和外國往來，其實呢？
        a: 日本一直開著四個窗口：長崎對中國和荷蘭、對馬對朝鮮、薩摩對琉球、松前對愛努。荷蘭人只能住在長崎的人工島出島。
      - q: 「鎖國」是幕府當時自己用的政策名稱嗎？
        a: 不是。這個詞是 1801 年志筑忠雄翻譯德國人坎普費爾的書時才造出來的，是後人的說法。
  - type: image
    card: event-sakoku
    question: 這是畫家川原慶賀約 1836 年畫的長崎港。畫裡扇形的人工島（出島）和港內的荷蘭船，最能說明鎖國時期的什麼情況？
    look:
      - 先找那個扇形的小島：圖說告訴你它叫什麼、上面是誰的商館。
      - 再看港內的船：圖說說它們是哪一國的？
    options:
      - 日本完全不和任何外國往來，連長崎港也禁止外國船靠近或停泊
      - 日本沒有完全關門：荷蘭商人被限制在出島，仍可在長崎通商
      - 歐洲各國的商人都能自由進出長崎，在城裡租房子、開店做生意
      - 荷蘭人在長崎建立自己的殖民地，派兵管理整個港口與周邊城鎮
    answer: 1
    explain: 圖說寫的是長崎的出島：扇形的人工島上是荷蘭商館，港內停著荷蘭船。卡片說鎖國不是完全關門，長崎可以和中國、荷蘭商人貿易，荷蘭人被限制在人工島「出島」，歐洲人中只剩荷蘭人能留駐。
    why_wrong:
      - 畫裡港內就停著荷蘭船，卡片也說長崎可以和中國、荷蘭商人貿易，並不是完全不往來
      - null
      - 卡片說歐洲人中只剩荷蘭人能留駐，而且荷蘭人被限制在出島，不能自由進出
      - 卡片寫的是荷蘭商人被限制在人工島出島，沒有說他們在長崎建殖民地或派兵
  - type: card
    id: event-black-ships
    depth: story
    prompt: 1853 年，有人來敲門了。注意幕府怎麼回應，以及這個回應帶來什麼後果。
    focus: [C7, debate]
    quick:
      - q: 幕府破天荒地問各地大名的意見，為什麼反而讓幕府顯得軟弱？
        a: 61 份已知回覆中，贊成和反對各 19 份，沒有共識，只同意加強海防。這場公開辯論讓人覺得幕府猶豫、沒有主意，反幕府勢力因此抬頭。
      - q: 日本是被大砲「打開」國門的嗎？
        a: 不完全是。培理的命令允許他在必要時動用武力，但最後雙方是談判簽約，並沒有開戰。
  - type: source
    card: event-black-ships
    idx: 0
    question: 從美國總統的國書可以看出，美國這次來日本最想得到什麼？
    options:
      - 占領日本的部分領土，把日本變成美國的殖民地
      - 要求日本出兵，和美國一起攻打清朝
      - 要求日本全國人民都改信基督教
      - 通商、補給煤炭和糧食、保護遇難船員
    answer: 3
    why_wrong:
      - 國書列的四件事是友好、通商、補給、保護船員，沒有要日本的領土。
      - 國書沒有要求日本出兵，美國要的是太平洋航線上的補給港。
      - 國書沒有提到宗教，內容都是通商和補給這類實際的事。
      - null
    explain: 國書列出四件事：友好、通商、煤炭與糧食補給、保護遇難船員。當時美國的船要橫越太平洋，需要沿途有港口可以補給。但讀這份史料也要注意：國書寫得客氣，培理卻帶著軍艦來，而且他接到的命令允許在必要時動用武力；文字和行動要一起看。
    hints:
      - 直接找國書裡列出的名詞：friendship、commerce、coal、provisions……
      - 蒸汽船要靠什麼才能走？
      - 這份文件是寫給誰的？語氣是命令還是請求？
    ref: event-black-ships#C1
    critique:
      question: 這份國書寫得很客氣，但培理卻帶著軍艦來。這份史料能證明什麼、不能證明什麼？
      options:
        - 能證明美國公開提出哪些要求；但不能單獨證明美國有沒有準備動武
        - 能證明美國完全沒有動武的打算，因為國書的文字很客氣
        - 能證明日本政府已經同意這些要求，因為國書是寫給天皇的
        - 能證明美國只在乎保護船員，通商和補給只是順便提一下
      answer: 0
      explain: 國書是美國總統寫給日本天皇的正式文件，只能告訴我們美國「公開說」想要什麼。培理接到的命令卻允許他在必要時動用武力；文字和行動要一起看。
      why_wrong:
        - null
        - 培理的命令允許在必要時動用武力，客氣的文字不能證明沒有這個打算。
        - 國書只是提出要求，簽約是隔年談判的結果，不是收到國書就同意。
        - 國書把友好、通商、補給、保護船員並列，看不出哪一項只是順便。
  - type: card
    id: event-meiji-restoration
    depth: understand
    prompt: 讀「經過」時注意：日本改掉了哪些「舊制度」（藩、武士俸祿、兵役），而不只是買了新武器？
    focus: [C4, C5]
    quick:
      - q: 明治政府除了練新軍，還改了哪些舊制度？
        a: 廢掉各藩、改設縣；實施徵兵制；取消武士世襲的俸祿。這些都是在改整個社會的規則，不只是換武器。
      - q: 失去俸祿和特權的武士，後來怎麼反應？
        a: 有一部分不滿的武士在 1877 年起兵，由西鄉隆盛領導，但被新式軍隊鎮壓。
  - type: chain
    prompt: 把下列事件依照「因 → 果」排成一條鏈（最上面是最早的原因）。
    items:
      - 培理率黑船來到浦賀，要求開國
      - 幕府徵詢大名意見卻得不到共識，顯得軟弱
      - 薩摩、長州等反幕府勢力抬頭
      - 薩摩、長州等勢力擁立天皇、宣布王政復古，並在戊辰戰爭打敗舊幕府
      - 廢藩置縣、徵兵制、取消武士俸祿
    explain: 外部壓力 → 幕府威信下降 → 反對勢力壯大 → 政權更替 → 新政府全面改造制度。注意：這條鏈說明的是壓力怎麼一層層傳下去，不代表每一步都「必然」發生。
    hints:
      - 最早的一步是外國人來了。
      - 幕府「問大家意見」這件事，為什麼反而讓它更弱？
      - 要先換掉政府，才能大規模改制度。
    ref: event-meiji-restoration#C1
    followup:
      question: 這條鏈的第一項「培理來航」，和最後一項「廢藩置縣、徵兵制、取消武士俸祿」是什麼關係？
      options:
        - 培理來航是遠因：它讓幕府威信下降，經過幾個環節才走到全面改制
        - 培理在條約裡要求日本廢藩、徵兵，所以日本照著做
        - 培理來航一發生，日本就必然會走向全面改制，沒有別的可能
        - 兩件事只是先後，中間沒有任何因果關係
      answer: 0
      explain: 外壓讓幕府威信大跌，反對勢力壯大，政權更替之後，新政府才有能力改制度。每一步都是前一步帶來的壓力，但不代表每一步都必然發生。
      why_wrong:
        - null
        - 《神奈川條約》只開放下田、箱館、救助船員和設領事，沒有要求日本改內部制度。
        - 這條鏈說明壓力怎麼傳下去，不代表一定會這樣發展；當時的人也不知道結局。
        - 中間隔著幕府威信下降、薩長抬頭、政權更替，是一環扣一環，不只是先後。
  - type: source
    card: event-meiji-restoration
    idx: 0
    question: 《五條御誓文》說「應向全世界求取知識，以鞏固皇國的基礎」。這句話透露了新政府的什麼想法？
    options:
      - 學習西方，是為了讓日本變成一個西方國家
      - 新政府要放棄天皇制度，改學西方的政治
      - 向世界學習，是為了讓天皇的國家更穩固
      - 日本應該繼續鎖國，不再向外國學習任何東西
    answer: 2
    why_wrong:
      - 句子後半說目的是「鞏固皇國」，學西方是手段，不是要變成西方。
      - 這是天皇頒布的誓文，目的是讓天皇的國家更穩固，不是放棄天皇制度。
      - null
      - 句子明說要「向全世界求取知識」，和繼續鎖國剛好相反。
    explain: 前半句是手段（向全世界學），後半句是目的（鞏固皇國）。明治政府學西方，不是為了變成西方，而是要讓以天皇為中心的新國家更強。讀史料時，一句話常常同時有「手段」和「目的」，要分開看。
    hints:
      - 把句子拆成兩半：「求取知識」和「鞏固皇國」，哪一個是手段、哪一個是目的？
      - 這是誰頒布的？他會想削弱自己嗎？
      - 頒布時間是 1868 年，剛推翻幕府不久。
    ref: event-meiji-restoration#C2
    critique:
      question: 《五條御誓文》是 1868 年新政府公開頒布的誓文。它能證明什麼、不能證明什麼？
      options:
        - 能證明新政府公開宣示的方向；實際改了什麼，要再看廢藩置縣、徵兵等制度
        - 只要有這句話，就證明日本在 1868 年已經完成所有的改革
        - 這句話是外國人寫的，所以只能代表西方人對日本的期待
        - 這是天皇個人的想法，不能代表新政府打算怎麼做
      answer: 0
      explain: 誓文是新政府成立後公開宣示的目標，看得出政府想要什麼；但宣示不等於做到。改革實際做了多少，要看之後的廢藩置縣、徵兵制、取消武士俸祿等制度變化。
      why_wrong:
        - null
        - 誓文只是宣示方向，廢藩置縣到 1871 年、憲法到 1889 年才出現，改革花了二十多年。
        - 誓文是 1868 年 4 月由天皇頒布的，英譯只是後來的翻譯，不是外國人寫的。
        - 誓文是新政府成立後頒布的公開宣示，代表的是政府的立場。
  - type: card
    id: event-self-strengthening
    depth: understand
    prompt: 同一時期的清朝也在學西方。讀完想想看：它改了什麼？沒改什麼？
    focus: [C4, debate]
    quick:
      - q: 自強運動改了什麼？有什麼大致沒有動？
        a: 設了專管外交的總理衙門，由地方大員開辦兵工廠、造船廠和新式學堂。但科舉和朝廷體制大致不變。
      - q: 很多人說清朝輸給日本是因為「技術落後」，艾爾曼怎麼看？
        a: 他指出直到 1880 年代，清朝的江南製造局和福州船政局還被認為比日本的造船所先進，1894 年北洋艦隊實力也約等於日本整支艦隊。是戰敗之後，大家才把結果倒著讀回去。
  - type: compare
    cards: [event-meiji-restoration, event-self-strengthening]
    prompt: 比一比明治維新和自強運動。
    rows:
      - { aspect: 時間, a: 1868–1889 年, b: 約 1861–1895 年 }
      - { aspect: 誰推動, a: 推翻幕府後的中央新政府, b: 恭親王與曾國藩、李鴻章、左宗棠等地方大員 }
      - { aspect: 改了什麼, a: 廢藩置縣、徵兵制、取消武士特權、頒布憲法, b: 設總理衙門、辦兵工廠、造船廠、學堂 }
      - { aspect: 沒改什麼, a: 保留並強化天皇的地位, b: 科舉與朝廷體制大致不變 }
    question: 兩邊最大的差別是什麼？為什麼「日本成功、中國失敗」這個說法太簡單？
    model_answer: 最大的差別是改革的範圍：日本換掉了舊政府，從中央全面改造政治、軍事和社會制度；清朝主要由地方大員引進技術，朝廷體制大致不變。但「日本成功、中國失敗」太簡單，因為艾爾曼指出，1880 年代以前中國的兵工廠和造船廠還被認為比日本先進，1894 年北洋艦隊的實力也大約等於日本整支艦隊；是 1895 年的戰敗讓大家把結果「倒著讀」，好像勝負早就注定。
    hints:
      - 看「誰推動」和「改了什麼」兩列：一邊是中央、一邊是地方。
      - 回去看自強運動卡的「史家怎麼吵」，艾爾曼怎麼說？
      - 想想看：知道結局之後回頭看，會不會覺得一切都是注定的？
    points:
      - 最大差別是改革範圍：日本換掉舊政府，從中央全面改造政治、軍事、社會制度
      - 清朝主要由地方大員引進技術，朝廷體制大致不變
      - 艾爾曼指出 1880 年代以前，中國的兵工廠和造船廠還被認為比日本先進
      - 1895 年戰敗後大家把結果倒著讀，好像勝負早就注定
  - type: decision
    role: 你是 1854 年初的幕府老中阿部正弘
    situation: |
      培理帶著八艘軍艦回來了，要求簽約。你問過各地大名，贊成和反對的一樣多，唯一的共識是要加強海防，但海防不是一年半載就能建好的。
      清朝十多年前在鴉片戰爭中被英國打敗的消息，你也聽說了。你會怎麼做？
    options:
      - { label: 簽約，開放少數港口, result: 這是幕府當年的選擇。1854 年 3 月 31 日簽訂《神奈川條約》，開放下田、箱館。日本避免了戰爭，但幕府「被迫開國」的形象讓反對勢力壯大，十多年後幕府被推翻。 }
      - { label: 拒絕簽約，準備開戰, result: 推測：日本當時沒有能對抗蒸汽軍艦的海軍，開戰很可能失利，像清朝一樣被迫簽下更不利的條約。歷史沒有走這條路，所以後果只能推測。 }
      - { label: "不簽也不開戰，請美方再等一段時間，先趕建海防", result: "推測：可以爭取一些準備時間，也不必立刻承受「被迫開國」的批評；但美國艦隊已經在眼前，對方是否肯等沒有把握，也可能被迫在更不利的處境下簽約。歷史沒有走這條路，所以後果只能推測。" }
    actual: 幕府選擇簽約。這避免了一場打不贏的戰爭，卻讓幕府威信大跌；1868 年明治新政府成立，開始全面改造國家。
    ref: event-black-ships#C2
    note: 「沒有發生的選項」的後果都是推測，標示清楚。
  - type: today
    card: event-meiji-restoration
    question: 有人說「國家要進步，就要學明治維新，全面西化」。這個說法哪裡不成立？

year: 200
basemap: china_provinces
title: 官渡之戰前夕：北方兩強對決（200 年）
note: 200 年曹操「挾天子」據兗、豫、徐與司隸，在官渡（今河南中牟）迎戰據有冀、青、幽、并四州的袁紹。孫策同年遇刺身亡，由弟弟孫權接手江東。荊州劉表、益州劉璋、漢中張魯、關中與涼州的馬騰、韓遂等將領各自觀望；遼東公孫度（189 年底起任遼東太守）、交州士燮名義上服從朝廷，實際自治；遼寧東北山區與北韓北部屬高句麗，圖上留白。以今日省界近似，邊界只是示意。

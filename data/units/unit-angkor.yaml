id: unit-angkor
title: 吳哥窟：柬埔寨最大的神廟，為什麼拜的是印度神？
histories: [柬埔寨史, 東南亞史, 印度史]
mystery: 柬埔寨國旗上畫著吳哥窟，可是吳哥窟原本供奉的是印度教的毗濕奴神。印度從來沒有派兵統治柬埔寨，印度的神是怎麼「住進」柬埔寨的？
teaser: 一千多年前，商船把印度的神、文字和王號帶到湄公河邊；本地國王把它們拿來用，蓋出了世界最大的宗教建築之一，最後又改信了從斯里蘭卡傳來的上座部佛教。
goals:
  - 能說出印度文化傳到東南亞，靠的是商人、僧侶和本地國王自己選用，而不是印度出兵
  - 能判讀《梁書》記載的扶南國王憍陳如，說出「用天竺法」是什麼意思
  - 能把扶南 → 真臘 → 吳哥王朝 → 南遷金邊的順序排出來
  - 能比較東南亞接受印度文化和越南北部接受中國文化的不同方式
  - 能說出至少兩種吳哥衰落的解釋，並指出史家之間有爭議
minutes: 35
steps:
  - type: hook
    text: |
      臺灣很多東西是從外地來的：珍珠奶茶的奶茶來自英國，粉圓的概念和日本有關，但它變成了臺灣自己的東西。
      一千多年前的柬埔寨也發生類似的事：印度的神、梵文和王號被拿來用，最後蓋出了吳哥窟。
      這個單元，我們要找出：印度的神，是被誰、用什麼方法「請」到柬埔寨的？
  - type: card
    id: event-indianization-sea
    depth: story
    prompt: 邊讀邊找：印度文化是跟著哪些人來到東南亞的？印度有沒有派軍隊來統治？
  - type: source
    card: event-indianization-sea
    idx: 0
    question: 《梁書》說憍陳如當上扶南國王後「復改制度，用天竺法」。這句話最接近哪個意思？
    options:
      - 扶南被天竺（印度）的軍隊打敗，只好聽印度的命令
      - 扶南國王禁止人民和印度商人做生意
      - 一位原本是印度婆羅門的國王，把扶南的制度改成印度的做法
      - 扶南派人到印度學習怎麼種稻
    answer: 2
    explain: 憍陳如「本天竺婆羅門也」，是扶南人「舉國欣戴，迎而立焉」，不是印度派兵打下來的。他當上國王以後，把制度改成「天竺法」，也就是印度的做法。卡片也說，印度並沒有派軍隊或官員來統治這些地方。
    hints:
      - 「天竺」是古代中國對哪個國家的稱呼？
      - 憍陳如是被打進來的，還是被扶南人「迎而立焉」？
      - 「改制度」改的是扶南自己的制度。
    ref: event-indianization-sea#story
  - type: card
    id: event-funan
    depth: story
    prompt: 扶南的大港俄厄挖出了什麼東西？這能看出扶南和多遠的地方有貿易往來？
  - type: card
    id: event-khmer-empire
    depth: story
    prompt: 802 年闍耶跋摩二世宣布自己是什麼「王」？想想看，國王為什麼要用印度神話裡的稱號？
  - type: card
    id: building-angkor-wat
    depth: story
    prompt: 讀的時候找：吳哥窟的五座塔和護城河，各自代表印度神話裡的什麼？
  - type: chain
    prompt: 把柬埔寨這一千多年的國家和大事依時間排好（最上面最早）。
    items:
      - 扶南的大港俄厄和羅馬世界有貿易往來
      - 扶南的屬國真臘強大起來，反過來併吞扶南
      - 闍耶跋摩二世在荔枝山登基，宣布自己是「宇宙之王」
      - 蘇利耶跋摩二世興建獻給毗濕奴的吳哥窟
      - 占婆水軍突襲吳哥都城，闍耶跋摩七世趕走占婆軍後重建吳哥城
      - 周達觀隨元朝使者來到吳哥，寫下《真臘風土記》
      - 國王放棄吳哥，南遷到今天金邊一帶
    explain: 扶南（2 世紀已和羅馬有貿易）→ 真臘在 6 世紀併吞扶南 → 802 年吳哥王朝開始 → 12 世紀初蓋吳哥窟 → 1177 年占婆攻陷都城、1181 年闍耶跋摩七世即位 → 1296–1297 年周達觀到吳哥 → 1431 年前後南遷。
    hints:
      - 先找「國家」的順序：扶南、真臘、吳哥王朝。
      - 吳哥窟是 12 世紀初蓋的，占婆的突襲是 1177 年。
      - 周達觀是 1296 年來的；南遷是 1431 年前後。
    ref: event-khmer-empire#C2
  - type: compare
    cards: [event-indianization-sea, event-vietnam-northern-rule]
    prompt: 差不多同一個時代，越南北部接受了中國文化，柬埔寨和越南中南部接受了印度文化。比一比兩種「接受」的方式。
    rows:
      - { aspect: 外來文化怎麼來的, a: 跟著商人、僧侶和婆羅門坐商船來, b: 漢武帝出兵滅南越，設郡派官治理 }
      - { aspect: 誰在當地做主, a: 本地國王自己選用印度的宗教和治理方法, b: 中國王朝派官治理，北屬時期一直延續到 938 年 }
      - { aspect: 帶來了什麼, a: 梵文、印度教和佛教、印度式的王號, b: 漢字、儒學和中國式的官制 }
      - { aspect: 當地人怎麼記住這段歷史, a: 吳哥窟成為柬埔寨的國家象徵，畫在國旗上, b: 越南人把這一千年叫做「北屬」，意思是「被北方統治」 }
    question: 同樣是受外來文化影響，為什麼柬埔寨人把吳哥窟當成驕傲，越南人卻把北屬時期記成「被統治」？
    model_answer: 印度文化是跟著商人和僧侶來的，印度沒有派兵或派官統治，是東南亞本地國王主動拿來用，所以蓋出來的吳哥窟是高棉人自己的成就。越南北部則是漢朝出兵、設郡派官統治了一千年，漢字和儒學是在被統治時期生根的，所以越南人記得的是「被北方統治」。一邊是自己選，一邊是被統治，留下來的記憶就不一樣。
    hints:
      - 看第一列：印度文化有沒有軍隊跟著來？
      - 看第二列：當地是誰在做主？
      - 想想看：自己選來用的東西和被逼著用的東西，你會怎麼記得它們？
  - type: card
    id: war-cham-khmer-1177
    depth: story
    prompt: 闍耶跋摩七世信的是哪一種宗教？這和過去吳哥以印度教為主有什麼不同？
  - type: card
    id: social-angkor-zhou-daguan
    depth: story
    prompt: 周達觀看到吳哥市場上做買賣的是誰？他用什麼中國的字眼來稱呼當地的宗教人物？
  - type: source
    card: social-angkor-zhou-daguan
    idx: 0
    question: 根據周達觀的記載，中國商人到了吳哥，為什麼常常先娶一位當地女子？
    options:
      - 吳哥法律規定外國商人一定要結婚
      - 吳哥做買賣的都是婦女，娶當地女子對做生意有幫助
      - 元朝皇帝命令商人和當地人通婚
      - 中國商人要在吳哥當官
    answer: 1
    explain: 周達觀說「國人交易皆婦人能之」，所以中國人到了那裡「必先納一婦人者，兼亦利其能買賣故也」，也就是看上她會做買賣。不過要記得，這是外國使者一年多的見聞，帶著中國人的觀點，要和碑文、考古資料對照。
    hints:
      - 先看第一句：吳哥做買賣的是誰？
      - 「利其能買賣」的「利」是「看重、得到好處」的意思。
    ref: social-angkor-zhou-daguan#story
  - type: card
    id: event-angkor-decline
    depth: story
    prompt: 這張卡列了好幾種吳哥衰落的原因。一邊讀，一邊數有幾種。
  - type: decision
    role: 你是 1431 年前後的高棉國王蓬黑亞・亞特
    situation: |
      西邊暹羅人的壓力越來越大，王族之間也爭鬥不斷，都城吳哥位在內陸、以農業為主，後來的研究者認為它在越來越重要的海上貿易中變得無足輕重。
      你可以留在祖先蓋了幾百年神廟的吳哥，也可以把都城搬到東南方約 200 公里外、靠近河流的四臂灣。你會怎麼做？
    options:
      - { label: 放棄吳哥，南遷到四臂灣, result: 這是歷史上的選擇。國王認為吳哥守不住，南遷到今天金邊一帶；高棉王國仍然存在，吳哥的神廟對柬埔寨人依然重要。 }
      - { label: 留在吳哥死守, result: 推測：留下來可能要繼續面對暹羅的進攻和內陸位置的不利，但也可能守住祖先的都城。歷史沒有走這條路，所以後果只能推測。 }
    actual: 國王蓬黑亞・亞特認為吳哥守不住，決定放棄它，南遷到四臂灣（今天金邊一帶）；但吳哥沒有完全荒廢，吳哥窟一直是佛教寺院。
    ref: event-angkor-decline#story
    note: 「沒有發生的選項」的後果都是推測，標示清楚。
  - type: today
    card: building-angkor-wat
    question: 柬埔寨把吳哥窟畫在國旗上，今天很多國家也會把代表性建築放上鈔票、國旗或國徽。這和蘇利耶跋摩二世蓋吳哥窟是同一回事嗎？
    model_answer: 不能直接類比。吳哥窟背後是「國王即神」的宗教信仰，動員的是王朝的勞役與信仰；今天的國家建築靠稅收和法律程序，放在國旗或鈔票上象徵的也不是神權。可以借來思考的是：不管古今，國家都喜歡用一座代表性的建築，告訴大家「我們是誰」。
  - type: check
    items:
      - kind: choice
        q: 印度的宗教和文字傳到東南亞，主要靠什麼？
        options: [商人、僧侶和婆羅門跟著商船來，本地國王主動選用, 印度孔雀王朝派大軍征服東南亞, 中國皇帝下令東南亞改信印度教, 東南亞的國王被抓到印度學習]
        answer: 0
        explain: 卡片說，印度並沒有派軍隊或官員來統治這些地方；是東南亞本地有野心的領袖看到印度宗教和治理方法的好處，才主動拿來用。
        hints: [印度有沒有在東南亞建立統治機構？, 回去看「印度化」卡的故事最後一句。]
        ref: event-indianization-sea#story
      - kind: choice
        q: 吳哥窟中央的五座高塔，代表的是什麼？
        options: [五位國王的陵墓, 佛陀的五位弟子, 柬埔寨的五個省, 印度神話中眾神居住的須彌山]
        answer: 3
        explain: 五座塔代表須彌山的五座山峰，外牆和護城河代表環繞的山脈和大海，整座建築是一個縮小的印度教宇宙。
        hints: [吳哥窟是獻給哪一位印度神的？, 須彌山是神話中位在世界中心、眾神居住的高山。]
        ref: building-angkor-wat#story
      - kind: choice
        q: 今天柬埔寨人大多信上座部佛教。根據卡片，這一派佛教主要是從哪裡傳來的？
        options: [從中國傳來, 從斯里蘭卡傳來, 從日本傳來, 從法國傳教士傳來]
        answer: 1
        explain: 大約 11 世紀起，斯里蘭卡系的上座部佛教，透過斯里蘭卡和孟族的僧侶在東南亞大陸傳開，連闍耶跋摩七世的兒子都曾到斯里蘭卡出家。
        hints: [卡片說，東南亞大陸的佛教後來不是直接從印度來的。, 闍耶跋摩七世的兒子到哪裡出家？]
        ref: event-angkor-decline#story
      - kind: short
        q: 用一兩句話說明：為什麼說吳哥是 1431 年「一夕滅亡」是一種誤解？
        model: 吳哥的衰落是戰爭、王族內鬥、乾旱、海上貿易等好幾方面逐漸變化的結果；南遷之後高棉王國仍然存在，吳哥窟也一直是佛教寺院，沒有完全荒廢。
        explain: 卡片的常見誤解說，衰落是一連串逐漸的變化，遷都之後高棉王國仍然存在，吳哥窟直到 1747 年還留下長篇碑文。
        hints: [南遷之後，高棉王國還在嗎？, 吳哥窟後來變成了什麼？有沒有荒廢？]
        ref: event-angkor-decline
  - type: recap
    model_answer: 印度的神不是被軍隊帶來的。大約從西元前 500 年起，海上貿易讓南亞和東南亞往來頻繁，印度的商人、僧侶和婆羅門跟著商船來到湄公河一帶；扶南人迎立婆羅門憍陳如為王，「用天竺法」。之後真臘併吞扶南，802 年起的吳哥王朝國王自稱「宇宙之王」，用印度神話來表現王權，12 世紀初蘇利耶跋摩二世蓋了獻給毗濕奴的吳哥窟。13 世紀末起，從斯里蘭卡傳來的上座部佛教取代了印度教，吳哥窟變成佛寺；1431 年前後國王南遷，但吳哥窟從沒有完全荒廢，今天還畫在柬埔寨國旗上。
reflect: 你生活中有沒有一樣東西，原本是從外國來的，後來卻變成了「我們自己的」？它是怎麼變成自己的？

  - id: sea-hellespont-grain
    name: 黑海—赫勒斯滂—雅典 糧食航線
    kind: sea
    start: -500
    end: -322
    precision: attested-ports
    note: 雅典的進口糧食有相當部分來自黑海北岸，經博斯普魯斯與赫勒斯滂（達達尼爾）海峽運到比雷埃夫斯；依賴程度學界有爭論。年份範圍為估計。
    method: sea
    waypoints: ['854743', '520985', '501609', '580108', '580062']
    sources:
      - { id: s1, title: "Keen, Grain for Athens: the Hellespontine route (Electronic Antiquity 1.6, 1993)", url: 'https://scholar.lib.vt.edu/ejournals/ElAnt/V1N6/keen.html', accessed: 2026-10-24 }
      - { id: s2, title: Pleiades 地名資料庫, url: 'https://pleiades.stoa.org/', accessed: 2026-10-24 }
      - { id: s9, title: "Natural Earth 1:10m 陸地（world-atlas，公有領域；用來算港間不穿過陸地的海路）", url: 'https://www.naturalearthdata.com/', accessed: 2026-10-25 }

  - id: sea-alexandria-rome
    name: 亞歷山卓—羅馬 運糧航線
    kind: sea
    start: -30
    end: 332
    precision: attested-ports
    note: 埃及糧食由政府雇用的私人船隻運到義大利（先到普特奧利，後以奧斯提亞／波爾圖斯為主），再走台伯河運進羅馬。航路為示意；約 332 年亞歷山卓運糧船隊改送君士坦丁堡（也有看法認為約 308 年已不再送羅馬）。
    method: sea
    waypoints: ['727070', '639005', '599575', '589834', { lat: 37.07, lng: 15.29, name: Syracusae }, '452416', '432815']
    sources:
      - { id: s1, title: Wikipedia「Cura Annonae」, url: 'https://en.wikipedia.org/wiki/Cura_Annonae', accessed: 2026-10-24 }
      - { id: s3, title: ostia-antica.org「The fourth century」, url: 'https://ostia-antica.org/dict/topics/fourth-century/fourth-century-4.htm', accessed: 2026-10-24 }
      - { id: s2, title: Pleiades 地名資料庫, url: 'https://pleiades.stoa.org/', accessed: 2026-10-24 }
      - { id: s9, title: "Natural Earth 1:10m 陸地（world-atlas，公有領域；用來算港間不穿過陸地的海路）", url: 'https://www.naturalearthdata.com/', accessed: 2026-10-25 }

  - id: sea-baetica-rome
    name: 貝提卡—羅馬 橄欖油航線
    kind: sea
    start: -27
    end: 260
    precision: attested-ports
    note: 貝提卡（瓜達幾維河流域）的 Dressel 20 雙耳瓶裝橄欖油運到羅馬，空瓶堆成泰斯塔丘；約 260 年代停止堆放。航路為示意。
    method: sea
    waypoints: [{ lat: 36.79, lng: -6.36, name: 瓜達幾維河口（Baetis 河口） }, { lat: 36.0, lng: -5.6, name: 直布羅陀海峽 }, { lat: 39.15, lng: 2.93, name: 卡布雷拉島（Cabrera，沉船所在） }, { lat: 41.33, lng: 9.3, name: 博尼法喬海峽（Lavezzi 沉船群） }, '423012']

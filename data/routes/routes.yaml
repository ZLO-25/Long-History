# 路線定義：waypoints 是依序經過的地點（Pleiades id 字串，或 {lat,lng,name}）。
# 執行 npm run routes 會把它們轉成真實線條（data/routes/routes.geojson）：
#   method: awmc-road  陸路沿 AWMC 古道網（巴林頓地圖集）找相鄰兩站間的最短路徑
#   method: awmc-wall  直接取 AWMC 城牆圖層
#   method: sea        經停港依史料（見 note 與 sources），港間海路在 Natural Earth 陸地格網上計算最短可行海路
# precision：traced＝沿地圖集描繪的古道；attested-ports＝經停港有史料，海上路徑為推算
# start/end 為地圖上顯示的年份範圍（時間軸上限 500 年，仍在使用的道路 end 寫 500）。
routes:
  - id: road-via-appia
    name: 阿庇亞大道（Via Appia）
    kind: road
    start: -312
    end: 500
    precision: traced
    note: 前 312 年由監察官阿庇烏斯修築羅馬至卡普阿段，之後延伸到貝內文托與布林迪西。
    method: awmc-road
    waypoints: ['423025', '422844', '422927', '433143', '432855', '432839', '432940', { lat: 41.15, lng: 13.83, name: Sinuessa }, '432754', '432773', '432721', '442451', '442847', { lat: 40.47, lng: 17.24, name: Tarentum }, '442509']
    sources:
      - { id: s1, title: Wikipedia「Appian Way」, url: 'https://en.wikipedia.org/wiki/Appian_Way', accessed: 2026-10-24 }
      - { id: s2, title: Pleiades 地名資料庫, url: 'https://pleiades.stoa.org/', accessed: 2026-10-24 }
      - { id: s9, title: "AWMC geodata：古代道路（依《巴林頓古典世界地圖集》數位化，ODbL）", url: 'https://github.com/AWMC/geodata', accessed: 2026-10-25 }

  - id: road-via-egnatia
    name: 艾格納提亞大道（Via Egnatia）
    kind: road
    start: -146
    end: 500
    precision: traced
    note: 前 2 世紀由馬其頓總督艾格納提烏斯主持修築，確切年份未知（地圖取前 146 年馬其頓設行省為起點，估計）；連接亞得里亞海岸與拜占庭。
    method: awmc-road
    waypoints: ['481818', '481900', '481861', '491585', '491687', '491741', '501347', '501564', '501523', '501649', '511357', '520985']
    sources:
      - { id: s1, title: Wikipedia「Via Egnatia」, url: 'https://en.wikipedia.org/wiki/Via_Egnatia', accessed: 2026-10-24 }
      - { id: s2, title: Pleiades 地名資料庫, url: 'https://pleiades.stoa.org/', accessed: 2026-10-24 }
      - { id: s9, title: "AWMC geodata：古代道路（依《巴林頓古典世界地圖集》數位化，ODbL）", url: 'https://github.com/AWMC/geodata', accessed: 2026-10-25 }

  - id: road-via-flaminia
    name: 弗拉米尼亞大道（Via Flaminia）
    kind: road
    start: -220
    end: 500
    precision: traced
    note: 約前 220 年監察官弗拉米尼烏斯修築，羅馬經翁布里亞到亞得里亞海岸的阿里米努姆。
    method: awmc-road
    waypoints: ['423025', '413231', '413225', '413065', '413147', '413227', '413058', '413149', '413129', '413256', '393379']

title: 迦太基與科林斯被毀（前 146 年）
note: "前 146 年，羅馬同時攻陷迦太基與科林斯。迦太基的核心成為『阿非利加』行省（只含突尼西亞北部，鄰近的努米底亞仍是盟友王國）；馬其頓在前 148 年成為行省，希臘各城邦處在羅馬的監督下，亞該亞同盟被解散。羅馬在西班牙握有東岸與南部（西班牙北、西部內陸仍在作戰，前 133 年才攻下努曼提亞）。義大利與西西里、薩丁尼亞與科西嘉原本就是羅馬的；波河平原此時也已有羅馬殖民地。帕加馬是羅馬的盟友；塞琉古與托勒密當背景，安息（帕提亞）正在伊朗崛起。以今日國界近似，邊界只是示意；切線理由見 docs/dive-rome.md。"

    card: event-austronesian-taiwan
    question: 有人說：「現在驗一下 DNA，就能知道一群人從哪裡來，不用再看語言、考古或傳說了。」這個想法哪裡不成立？
    model_answer: 不成立的地方有幾個。第一，要查一群人從哪裡來，會同時用家譜、語言、DNA 和考古遺物，任何一種單獨都不夠，而且各自會被不同的方法誤導。第二，遺傳研究看的是 56 個人群的資料，說的是人群整體的祖先成分，而且同時發現不只一個來源，歷史不是單向的。第三，語言與祖先是否完全對應，學界仍有爭論；「南島語族」是語言分類，不是種族。第四，起源傳說是各族對自己來歷的認同與知識，不是用來被考古或 DNA「證明」或「推翻」，也不能當成「錯誤的歷史」。可以借來想的是：證據要多種互相對照，並且先問每一種證據能說什麼、不能說什麼。
    points:
      - 不成立：查人群來源會同時用家譜、語言、DNA 和考古，任何一種單獨都不夠，各自會被不同方法誤導
      - 遺傳研究看的是人群整體的祖先成分，而且同時發現不只一個來源，歷史不是單向的
      - 「南島語族」是語言分類、不是種族；語言與祖先是否完全對應，學界仍有爭論
      - 起源傳說是各族的認同與知識，不是被 DNA 或考古「驗證」或「推翻」的對象

year: 1783
basemap: us_states
title: 獨立：巴黎條約承認的美國（1783 年 9 月）
note: 1783 年 9 月 3 日巴黎條約：英國承認美國獨立，疆域西到密西西比河、南到北緯 31°、北到五大湖；佛羅里達同年由英國還給西班牙（北界沒講清楚，1795 年才定在 31°），密西西比河以西是西屬路易斯安那（1762 年起）。英國到 1796 年才撤出五大湖一帶的 8 座堡壘；緬因與明尼蘇達的北界到 1842 年才定案；明尼蘇達西北角（紅河谷）1818 年才劃給美國，本圖以經線近似。條約是英國與美國簽的，沒有問過住在俄亥俄河谷與南方腹地的各原住民族。

id: dive-sapiens
title: 《人類大歷史》：用證據讀一本暢銷書
question: 一本說「人類靠虛構的故事稱霸地球」的暢銷書，它的大論點有哪些證據？哪些學者不同意？
blurb: 哈拉瑞的《人類大歷史》用四次「革命」講完 250 萬年。這個專題照書的 20 章排成 20 站：每站先讓你自己想一想，再看書裡怎麼說、網站上哪些卡片是證據、哪些學者有不同看法。目的不是背金句，而是練習判斷一本書的說法站不站得住。

title: 希臘化三大王國（前 275 年前後）
note: "亞歷山大死後，將領（繼業者）打了四十多年的仗。到前 275 年前後，帝國分成三大王國：馬其頓與希臘本土的安提柯王朝（安提柯二世「岡諾塔斯」前 277 年在呂西馬基亞打敗高盧人後坐穩王位）、從小亞細亞到中亞的塞琉古帝國、埃及為核心的托勒密王國（含賽普勒斯、昔蘭尼加與敘利亞南部）。印度河以東另有孔雀王朝，塞琉古一世約前 305 至前 302 年把阿富汗南部與東部、俾路支一帶讓給旃陀羅笈多；背景再標孔雀以外的小國（帕加馬、安納托利亞北部諸國）、羅馬與迦太基。小亞細亞的界線、孔雀王朝在德干的實際控制範圍都有學者質疑，只能示意。以今日國界近似，邊界只是示意；切線理由見 docs/dive-greece.md。"

# 12 世紀以前的金融史（金融中心鏈的前傳）
- { id: finance-mesopotamia-credit, type: finance, track: west, name: 美索不達米亞的神廟借貸與《漢摩拉比法典》, time: "前3000–前1595", civ: "美索不達米亞（蘇美）, 美索不達米亞（古巴比倫）", brief: "楔形文字泥板上的借據、神廟與宮廷倉庫放貸大麥與白銀、利率慣例（白銀約20%、大麥約33⅓%）、《漢摩拉比法典》約前1754的借貸條款（利率上限、債務奴役最多三年）、國王的債務免除詔令（mīšarum，例如安米薩杜卡詔令）；David Graeber《債》與 Michael Hudson 的觀點要標為一家之言。一手：avalon.law.yale.edu 漢摩拉比法典英譯。links 可連 commodity-laurion-silver、finance-lydian-coinage。" }
- { id: finance-lydian-coinage, type: finance, track: west, name: 呂底亞：最早的鑄幣, time: "前650–前546", civ: "安納托利亞（呂底亞）, 古希臘", brief: "以弗所阿提米絲神廟出土的琥珀金（electrum）鑄幣、約前7世紀晚期、獅頭紋、薩第斯（Sardis）、克羅伊斯（Croesus）約前550年代發行純金與純銀幣（雙金屬，可能）、希羅多德說呂底亞人最先鑄金銀幣並開零售店（Histories 1.94）、前546被波斯居魯士征服、鑄幣向希臘城邦擴散。同時代中國也有布幣刀幣（連 commodity-wuzhu-coin 作對照，note 要說兩地獨立發展）。links 連 commodity-laurion-silver、finance-athens-trapezitai、finance-mesopotamia-credit。注意年代有爭議（學界多估約前630–600年）。" }
- { id: finance-athens-trapezitai, type: finance, track: west, name: 雅典的銀行家（trapezitai）與海上借貸, time: "前5世紀–前4世紀", civ: "古希臘, 雅典", brief: "trapezitai（桌子＝trapeza）在雅典廣場與比雷埃夫斯港換錢、收存款、放款；帕西翁（Pasion）從奴隸成為銀行家與公民、德摩斯梯尼的訴訟演說是主要史料；海上借貸（bottomry/maritime loan，船沉不必還、利率高）；勞里昂銀礦與貓頭鷹銀幣支撐雅典（連 commodity-laurion-silver）。學術：Edward Cohen《Athenian Economy and Society: A Banking Perspective》1992（普林斯頓）與 Moses Finley 的較保守看法對立。links 連 commodity-laurion-silver、finance-lydian-coinage、finance-roman-argentarii、war-peloponnesian。" }
- { id: finance-roman-argentarii, type: finance, track: west, name: 羅馬的銀行家（argentarii）與第納里烏斯, time: "前211–260", civ: "古羅馬", brief: "前211左右第納里烏斯銀幣、argentarii（廣場上的銀行家：兌換、存款、拍賣融資）、nummularii 驗幣、包稅公司 publicani 的股份、西元33年信用危機（塔西佗《編年史》6.16–17，提比略以國庫無息放貸1億塞斯特斯救市）、第納里烏斯逐漸減銀（尼祿64年起、3世紀危機時含銀量崩落）。學術：William Harris、Peter Temin《The Roman Market Economy》。links 連 building-forum-romanum、event-constitutio-antoniniana（若存在）、event-fall-western-rome、finance-athens-trapezitai、finance-byzantine-solidus、commodity-wuzhu-coin（對照：同時代漢朝五銖錢）。" }
- { id: finance-byzantine-solidus, type: finance, track: west, name: 拜占庭金幣索利都斯：七百年的「中世紀美元」, time: "309–1092", civ: "古羅馬, 拜占庭帝國", brief: "君士坦丁大帝約309/312推出索利都斯（每羅馬磅72枚、約4.5克純金）、在地中海與絲路被廣泛接受（印度、中國出土仿品與真品，查證）、被稱為『中世紀的美元』（Robert Lopez 1951〈The Dollar of the Middle Ages〉，Journal of Economic History，學術）、11世紀中期開始減值、1092阿歷克塞一世改革以 hyperpyron 取代。阿拉伯第納爾（691/697阿卜杜勒-馬利克改革）是其繼承與競爭者。links 連 finance-roman-argentarii、finance-abbasid-sakk-hawala、commodity-silk、war-crusades、event-fall-western-rome、finance-venice-rialto（後繼：威尼斯杜卡特）。" }
- { id: finance-abbasid-sakk-hawala, type: finance, track: west, name: 阿拔斯巴格達：支票（sakk）、匯兌（hawala）與拉唐商人, time: "762–1050", civ: "伊斯蘭世界（阿拔斯王朝）", brief: "762年曼蘇爾建巴格達、金第納爾與銀迪拉姆、jahbadh（宮廷銀行家/兌換商）、sakk（英文 cheque 可能源於此，詞源有爭議）、suftaja 匯票與 hawala（債務移轉，伊斯蘭法學有討論；現代 hawala 網路另行說明）、拉唐猶太商人（Radhanites）依伊本·胡爾達茲貝《道里邦國志》約870描述往返法蘭克與中國的路線、伊斯蘭對利息（riba）的禁止與合夥契約（mudaraba/qirad 被認為影響義大利 commenda，有爭議）、開羅經冢文書（Cairo Geniza，Goitein）是主要史料。links 連 finance-byzantine-solidus、finance-jiaozi（同時代中國紙幣）、finance-champagne-fairs、finance-venice-rialto、commodity-silk、war-crusades。" }
# 熱那亞：金融中心鏈中安特衛普之後的一環
- { id: finance-casa-di-san-giorgio, type: finance, track: west, name: 熱那亞聖喬治銀行（Casa di San Giorgio）, time: "1407–1805", civ: "熱那亞共和國", brief: "1407年由熱那亞公債持有人（compere）合併成立、接管國家稅收以償債、兼營存款銀行（1408–1444、1530年代後再開）、管理科西嘉與黑海殖民地（卡法）、馬基維利《佛羅倫斯史》稱它是『國中之國』；1805年拿破崙併吞後解散。是政府債權人組織化管理國債的早期例子（可對照英格蘭銀行、阿姆斯特丹匯兌銀行）。學術：Carlos Marsilio、Giuseppe Felloni 的研究；Wikipedia Bank of Saint George。links 連 finance-venice-rialto、finance-medici-bank、finance-age-of-genoese、finance-bank-of-england、finance-amsterdam-wisselbank。" }
- { id: finance-age-of-genoese, type: finance, track: west, name: 「熱那亞人的世紀」：熱那亞銀行家與西班牙帝國, time: "1557–1627", civ: "熱那亞共和國, 伊比利半島/西班牙, 法蘭德斯與比利時（安特衛普）", brief: "1528多利亞與查理五世結盟、1557菲利普二世第一次停止付款後富格爾等南德銀行家退場、熱那亞銀行家（Grimaldi、Spinola、Doria、Centurione等）以 asiento 貸款把美洲白銀換成在法蘭德斯支付軍餉的金幣/匯票、皮亞琴察（Besançon）匯兌市集約1579起成為歐洲結算中心、1575、1596、1607、1627西班牙多次停付（Drelichman & Voth《Lending to the Borrower from Hell》2014，學術：違約是契約內的保險設計）、1627奧利瓦雷斯引入葡萄牙新基督徒銀行家，熱那亞時代結束。布勞岱爾『熱那亞人的世紀』（1557–1627）與阿瑞吉《漫長的20世紀》的第一個『積累體系週期』。links 連 finance-antwerp-bourse、war-fall-of-antwerp、commodity-silver-flow、finance-casa-di-san-giorgio、finance-amsterdam-wisselbank。" }
- { id: finance-champagne-fairs, type: finance, track: west, name: 香檳市集與中世紀匯票, time: "1180–1320", civ: "法國", brief: "香檳伯爵保護下的六大市集（特魯瓦、普羅萬、拉尼、巴爾）、義大利商人結算、市集末的清算與匯票雛形、衰落原因（法王併吞、海路直航布魯日）。金融中心移轉的起點之一。" }
- { id: finance-venice-rialto, type: finance, track: west, name: 威尼斯：里亞托與強制公債, time: "1171–1500", civ: "義大利/威尼斯共和國", brief: "1171/1262 Monte Vecchio 強制公債與可轉讓債券、里亞托的銀行家（banchi di scritta 轉帳銀行）、杜卡特金幣1284、東方貿易；被葡萄牙繞過好望角的衝擊（連 event-vasco-da-gama）。" }
- { id: finance-bruges-bourse, type: finance, track: west, name: 布魯日與「交易所（Bourse）」的誕生, time: "1300–1500", civ: "法蘭德斯與比利時（布魯日）", brief: "范德布爾斯家族旅館前廣場→『bourse』一詞由來、漢薩同盟商站、義大利商人群聚、茲溫河淤積與1488馬克西米利安事件後商人轉往安特衛普。" }
- { id: finance-antwerp-bourse, type: finance, track: west, name: 安特衛普的黃金時代與新交易所, time: "1501–1585", civ: "法蘭德斯與比利時（安特衛普）, 伊比利半島/葡萄牙, 伊比利半島/西班牙", brief: "葡萄牙香料集散、富格爾等南德銀行家、1531新交易所（第一棟專門興建的交易所）、哈布斯堡國債與1557西班牙破產（菲利普二世）、格雷欣在此替英王借款後回倫敦建皇家交易所。人口約10萬。" }
- { id: war-fall-of-antwerp, type: war, track: west, name: 安特衛普的陷落與斯海爾德河封鎖, time: "1576–1585", civ: "法蘭德斯與比利時（安特衛普）, 伊比利半島/西班牙, 荷蘭", brief: "1576西班牙之怒（士兵欠餉劫城）、八十年戰爭、帕爾馬公爵1584–85圍城（斯海爾德河上的浮橋）、陷落後新教徒限期離開、北方封鎖斯海爾德河（1648明斯特和約正式化，至1795/1863）、人口與商人資本大量北遷阿姆斯特丹。用『海峽封鎖』『金融中心轉移』。" }
- { id: finance-amsterdam-wisselbank, type: finance, track: west, name: 阿姆斯特丹匯兌銀行（Wisselbank）, time: "1609–1820", civ: "荷蘭", brief: "1609成立、解決劣幣混雜、銀行貨幣（bank guilder）與溢價agio、匯票必須經它結算、被稱為早期中央銀行原型（Quinn & Roberds研究）、1780年代對東印度公司放款後喪失信用、1795/1820關閉。" }
- { id: finance-mississippi-bubble, type: finance, track: west, name: 約翰·羅與密西西比泡沫, time: "1716–1720", civ: "法國", brief: "路易十四留下的債務、約翰·羅的通用銀行1716→皇家銀行、密西西比公司以國債換股、紙幣大發行、1720崩潰；法國因此長期不信任紙幣與銀行，相對英國金融落後（連南海泡沫同年）。" }
- { id: finance-amsterdam-decline, type: finance, track: west, name: 阿姆斯特丹金融中心的衰落, time: "1763–1795", civ: "荷蘭", brief: "1763信用危機（Neufville破產）、1772–73危機、第四次英荷戰爭1780–84、東印度公司1799解散、法軍入侵1795建巴達維亞共和國、荷普銀行等移往倫敦；荷蘭資本仍大量投資英國國債與美國。" }
- { id: finance-london-rise, type: finance, track: west, name: 倫敦取代阿姆斯特丹：拿破崙戰爭與羅斯柴爾德, time: "1793–1815", civ: "英國, 荷蘭, 法國", brief: "英國國債與財政軍事國家、1797停止兌換金、霸菱與內森·羅斯柴爾德、拿破崙戰爭融資與滑鐵盧後倫敦成為世界金融中心（駁斥滑鐵盧內線致富迷思）。" }
- { id: finance-gold-standard, type: finance, track: west, name: 古典金本位與英鎊時代, time: "1821–1914", civ: "英國, 日耳曼與法蘭克/德國, 美國（內戰與工業化）", brief: "英國1821恢復金兌換、1844銀行特許法、德國1871–73轉金本位、各國跟進、倫敦匯票與英鎊為國際結算中心、白銀貶值對中國與印度的衝擊；1914一戰中止。" }
- { id: finance-new-york-overtakes-london, type: finance, track: west, name: 紐約取代倫敦：一戰後英鎊退位, time: "1914–1931", civ: "美國（世界強權）, 英國", brief: "一戰英國向美國大舉借款（J.P.摩根代理）、美國從債務國變債權國、1913聯準會讓紐約承兌匯票市場出現、1925邱吉爾以戰前平價回歸金本位、1931英國放棄金本位；之後布列敦森林美元正式接班。" }
- { id: finance-eurodollar-big-bang, type: finance, track: west, name: 歐洲美元市場與倫敦金融城「大爆炸」, time: "1957–1986", civ: "英國, 美國（世界強權）", brief: "冷戰時蘇聯把美元存在歐洲、1957英鎊危機、Q條例與利息平衡稅推動美元離岸化、倫敦成為美元在海外的中心、1986柴契爾大爆炸金融自由化。中心不一定跟著貨幣走。" }
- { id: finance-japan-bubble, type: finance, track: east, name: 日本泡沫經濟與東京的興衰, time: "1986–1991", civ: "日本（近現代）", brief: "廣場協議後低利率、日經1989-12-29高點38915、東京皇居地價傳說、日本銀行升息與不動產融資總量管制、崩盤與失落的十年；東京曾被看好取代紐約。" }
- { id: finance-asian-financial-crisis, type: finance, track: east, name: 1997 亞洲金融風暴, time: "1997–1998", civ: "東南亞/泰國, 東南亞/印尼, 朝鮮（近現代）, 香港", brief: "1997-07-02泰銖放棄釘住美元、短期美元外債、IMF紓困與條件爭議、韓國、印尼蘇哈托下台、香港捍衛聯繫匯率；臺灣相對未受重創的原因（查證）。" }
- { id: finance-euro, type: finance, track: west, name: 歐元誕生與歐債危機, time: "1999–2012", civ: "日耳曼與法蘭克/德國, 法國, 義大利, 歐盟", brief: "馬斯垂克條約1992、1999歐元記帳/2002紙鈔、單一貨幣挑戰美元、2010希臘危機、2012德拉吉『不惜一切代價』；為何歐元沒取代美元。" }

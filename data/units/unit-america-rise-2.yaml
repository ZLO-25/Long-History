id: unit-america-rise-2
title: 美國崛起（下）：財政、土地、工業與美元
histories:
- 美國史
- 美洲史
- 錢的歷史
- 世界通史
mystery: 有了制度還不夠。美國怎麼建立信用、擴張土地、長出大企業，又怎麼讓美元成為世界的中心？每一步，誰得到好處、誰付出代價？
teaser: 從漢彌爾頓的財政計畫、西進與鍍金時代、馬歇爾計畫，到 1944 年被寫進國際貨幣規則的美元，美國變強有很多條線，而每一條線都有人付出代價。
goals:
- 能說出漢彌爾頓財政計畫、西進擴張、鍍金時代工業化與美元地位，各自替美國變強加了什麼
- 能判讀國際貨幣基金協定的原文，說出它實際寫了什麼、沒寫什麼
- 能比較西進擴張與鍍金時代：誰受益、誰付出代價
- 能指出「美國為什麼強」有制度、土地與資源、時機、美元等並列的解釋，而且沒有單一定論
- 能分辨後見之明與倖存者偏差，不把歷史當成投資建議
minutes: 35
steps:
- type: hook
  text: |
    上一課我們看了美國的制度和想法：殖民地自治、獨立宣言、憲法。但有了規則，國家還要有錢、有土地、有工廠。
    這一課要看五件事：漢彌爾頓怎麼讓新國家借得到錢，西進擴張和鍍金時代怎麼讓美國變大，二戰後的馬歇爾計畫做了什麼，美元又怎麼被放到世界貨幣體系的中心。
    我們不找「唯一的答案」，而是把幾種解釋並排，再看每一種解釋的代價。這一課接在上半場之後；整合題會用到上半的制度與立國思想，建議先做上半場。
- type: sim
  sim: debase
  prompt: 先動手玩玩看：如果政府偷偷減少銀幣的含銀量，大家對錢的信心會怎麼變？提醒：這個模擬玩的是金屬貨幣；1792 年美元被定義為約含 371.25 格令純銀，而今天的美元已不是金屬貨幣。道理相通，都是貨幣的價值要靠大家的信任，但運作方式不一樣。
- type: card
  id: finance-hamilton-financial-plan
  depth: understand
  prompt: 一個剛打完仗、欠一身債的新國家，怎麼讓人相信它會還錢？注意哪些事是 1790、1791、1792 年分幾次推動的，不是一次完成。
- type: chain
  prompt: 把漢彌爾頓建立信用的做法，依先後順序排成一條鏈（最上面最早）。
  items:
  - 獨立戰爭後聯邦與各州背了大量債務，政府借據的市價遠低於票面
  - 漢彌爾頓向國會提出《公共信用報告》，主張按票面價值還債並承擔各州債務
  - 國會通過法案，讓債權人以舊債換新發的聯邦公債
  - 國會設立特許期 20 年的美國第一銀行
  - 《鑄幣法》設立鑄幣局，並定義美元的金屬含量
  explain: 先有「信用很差」的問題，再提出辦法（1790 年 1 月），法案通過、舊債換新債（1790 年 8 月），接著設銀行（1791 年 2 月），最後以《鑄幣法》定義美元（1792 年 4 月）。這套計畫是 1790 到 1792 年間分幾次推動的，不是一次法案完成。
  hints:
  - 最早的是「問題」，而不是「解決辦法」。
  - 先處理舊債，再談設銀行。
  - 把美元定義清楚的《鑄幣法》是這幾件事裡最晚的。
  ref: finance-hamilton-financial-plan#F3
- type: decision
  role: 你是 1790 年的美國國會議員
  situation: |
    戰爭欠下的舊借據，市價遠低於票面。漢彌爾頓主張一律按票面價值償還，連後來才買進借據的人也一樣。
    麥迪遜則主張要區分「原始債權人」與「後來買進借據的投機者」。
    如果你手上有一票，你支持哪一邊？
  options:
  - label: 支持漢彌爾頓：按票面價值償還，不分原始持有人
    result: 這是歷史走的路。1790 年 8 月法案簽署，債權人以舊債換新發的聯邦公債。批評者擔心富人與投機者大賺，也擔心各州得失不均，但聯邦的信用逐漸建立起來。
  - label: 支持麥迪遜：區分原始債權人與後來買進借據的投機者
    result: 推測：麥迪遜確實提過這個主張，但被否決，歷史沒有走這條路，所以後果只能推測。投機者的獲利可能會少一些、爭議也許較小，但要分辨誰是原始債權人、誰是買家，執行起來可能更複雜。
  actual: 國會最後採用漢彌爾頓的辦法，但計畫在國會幾乎被擋下，要靠首都遷往波多馬克河一帶的政治交換才過關；1792 年又發生金融恐慌。事後看，美國公債的信用逐漸建立，但在 1790 年當時，結果並不確定。
  ref: finance-hamilton-financial-plan#F2
  note: 沒有發生的選項，後果都是推測，已標示清楚。這是歷史情境，不構成投資建議。
- type: card
  id: event-westward-expansion
  depth: deep
  prompt: 這是「土地與資源」的解釋，也是代價最清楚的一段。注意三件事：購地買下的是什麼？《印第安人遷移法》的條文寫了什麼、實際執行時又是什麼樣子？「史家怎麼吵」裡，邊疆論受到什麼批評？
- type: card
  id: event-gilded-age-industrialization
  depth: understand
  prompt: 鐵路、鋼鐵、石油：民間大公司讓美國的工業長大，國會也開始管壟斷。注意《謝爾曼法》通過之後，標準石油要到哪一年才被判決解散。
- type: compare
  cards:
  - event-westward-expansion
  - event-gilded-age-industrialization
  prompt: 比一比兩段讓美國「變大、變強」的時期。
  rows:
  - aspect: 時間
    a: 1803 年到 1890 年
    b: 1870 年到 1913 年（本卡為了涵蓋標準石油成立到聯準會前後所選的起訖，不是單一來源的定義）
  - aspect: 擴張的方式
    a: 購地、條約、戰爭與立法（例如宅地法）
    b: 鐵路、鋼鐵與石油等民間大公司推動，政府以事後規範為主（例如反托拉斯法）
  - aspect: 受益者
    a: 取得土地與出海口的美國政府、白人農場主、投機者與移民
    b: 握有鐵路、鋼鐵與石油的企業主與金融家
  - aspect: 付出代價者
    a: 被迫遷移的原住民族、墨西哥及割讓區內的墨西哥人
    b: 面對罷工與壓力的工人、被排華法案排除的華人勞工、被大公司擠壓的小企業
  - aspect: 史家的爭論
    a: 邊疆造就民主，還是征服與土地剝奪？遷移是「保護」還是掠奪？
    b: 大資本家是強盜大亨，還是產業領袖？
  question: 這兩段讓美國變強的過程，誰得到好處、誰付出代價？為什麼不能只看「變強」兩個字？
  model_answer: 兩段都讓美國的領土、產業與財富快速變大，所以常被放進「美國為什麼強」的答案；但受益的人和付出代價的人不是同一批。西進階段，政府以購地、條約與立法取得並分配土地，受益的是政府、農場主、投機者與移民，付出代價的是被迫遷移的原住民族與割讓土地的墨西哥；鍍金時代主要由民間大企業推動，受益的是鐵路、鋼鐵與石油的企業主與金融家，付出代價的包括面對罷工壓力的工人、被排華法案排除的華人勞工與被擠壓的小企業。史家對此也有不同看法：特納的邊疆論認為邊疆塑造了美國的民主，批評者則認為這套說法忽略原住民族、女性與墨西哥人的經驗；大資本家被批評者稱為強盜大亨，另一種看法強調他們降低成本、創造就業。本單元不替這些爭論下定論。
  hints:
  - 先看「受益者」和「付出代價者」兩列，哪些群體只出現在其中一列？
  - 再看「史家的爭論」那一列，同一件事為什麼會有兩種評價？
  - 回到卡片的「史家怎麼吵」，看看邊疆論和強盜大亨各自被怎麼批評或辯護。
- type: card
  id: event-marshall-plan
  depth: deep
  prompt: 這是「時機」的解釋。讀「史家怎麼吵」：馬歇爾計畫是善意重建，還是美國利益？又有學者怎麼質疑援助的貢獻？
- type: card
  id: finance-dollar-reserve-currency
  depth: deep
  prompt: 這是「美元」的解釋。注意 1971 年美元不再兌換黃金之後，為什麼仍是最主要的儲備貨幣；也請讀「後見之明與倖存者偏差」那一段。本單元不構成投資建議。
- type: source
  card: finance-dollar-reserve-currency
  idx: 0
  question: 1944 年國際貨幣基金協定寫「各會員國貨幣的平價，要以黃金或美元來表示」，最能說明什麼？
  options:
  - 在 1944 年的規則裡，美元被放在和黃金並列的位置，成為各國匯率的基準
  - 各國從此必須用美元支付所有貿易款項
  - 1944 年美元就已占各國外匯存底的 58%
  - 美元從 1944 年起不能再兌換黃金
  answer: 0
  explain: 這是 1944 年的制度規則，說明美元被放進國際貨幣體系的中心，並搭配每盎司 35 美元的黃金價格。「約 58%」是 IMF 統計中 2024 年前後美元占外匯存底的比例（估計），不是 1944 年的數字；美元要到 1971 年才停止兌換黃金。
  hints:
  - 先看原文把「黃金」和什麼並列。
  - 「平價」是用來決定各國貨幣之間的匯率基準，不是規定付款只能用哪一種貨幣。
  - 58% 和停止兌換黃金，分別是哪一個年代的事？
  ref: finance-dollar-reserve-currency#F2
- type: today
  card: finance-dollar-reserve-currency
  question: 常聽到「美元霸權就是美國強大的祕密」，或「美元遲早會像英鎊一樣退位」。拿 1944 到 1971 年的故事來類比今天，哪裡不成立？
  model_answer: 先說不能類比的地方：1944 年的美元背後有黃金作為最後的承諾，今天的美元是法定貨幣，靠制度與信任；戰後初期美國握有全世界約四分之三的官方黃金，經濟規模占世界的比重也遠高於今天；當時是政府談判決定的固定匯率，今天則是浮動匯率加上高度自由流動的資本市場；現在的競爭者（歐元、人民幣）所面對的局面，也和當年的英鎊不同。所以不能用 1971 年以前的結論直接套到今天，也不能說美元是美國強大的唯一原因。可以借來思考的是：一種貨幣被廣泛用來計價、結算與儲備時，網路效應會讓它的地位容易延續；這類地位的變化通常很慢，臨界點很難判斷；1971 年與 2008 年前後，當時的人也不確定美元能不能維持，結果事後看並沒有發生，這是後見之明。本單元不構成投資建議。
- type: check
  items:
  - kind: choice
    q: 關於 1830 年的《印第安人遷移法》，下列哪一項最符合卡片？
    options:
    - 條文直接下令把所有原住民強制遷走
    - 條文授權總統與部落「交換土地」，但實際執行時許多遷移是被迫的
    - 只有切羅基人被迫遷移
    - 遷移是原住民族自己提出的要求
    answer: 1
    explain: 條文的文字是授權交換土地，並未直接下令強制遷移，但部落承受極大壓力。「淚之路」不只有切羅基人：同一時期的喬克托、奇克索、克里克與塞米諾爾等部族也被迫遷往西方；切羅基人在 1838 至 39 年的遷徙中，估計約 4,000 人死亡（確切數字有爭議）。
    hints:
    - 先分清楚「條文怎麼寫」和「實際怎麼做」，兩者不一定一樣。
    - 同一時期被遷移的，只有切羅基人嗎？
    ref: event-westward-expansion#C4
  - kind: order
    q: 依時間先後排列：
    items:
    - 漢彌爾頓向國會提出《公共信用報告》（1790 年）
    - 法國把路易斯安那賣給美國（1803 年）
    - 《謝爾曼反托拉斯法》簽署（1890 年）
    - 杜魯門簽署《經濟合作法》，馬歇爾計畫展開（1948 年）
    explain: 《公共信用報告》在 1790 年，路易斯安那購地在 1803 年，《謝爾曼反托拉斯法》在 1890 年，馬歇爾計畫在 1948 年。
    hints:
    - 先分出十八世紀末、十九世紀初、十九世紀末與二戰後。
    - 建國初期的財政計畫在最前面。
    - 馬歇爾計畫是二戰後的事。
    ref: event-marshall-plan#C2
  - kind: short
    q: 用一兩句話說明：為什麼不能說「美國強大只是因為某一個原因」？
    model: 美國強大沒有單一定論：有人從制度與立國思想看（殖民地議會、同意統治與分權的想法、憲法分權、漢彌爾頓的信用），有人從土地與資源看（購地、鐵路、鋼鐵與石油），也有人看時機（二戰後美國經濟遠強於其他主要國家）和美元的地位；而且每一種解釋背後都有人付出代價，例如奴隸制、原住民被迫遷移，以及工人與被排除的華人勞工。
    explain: 單一原因會讓故事看起來太乾淨；把多種解釋並排，才看得出各自的重點與代價。
    hints:
    - 這題要整合多張卡，不是只看一張：請依序回看制度與立國思想（殖民地、立國哲學、獨立宣言、憲法、漢彌爾頓）、土地與資源（西進、鍍金時代）、時機（馬歇爾計畫）和美元這幾組卡，各自強調什麼力量？
    - 有沒有哪一張卡同時提到有人受益、有人付出代價？
    - 想想「史家怎麼吵」裡有哪些不同看法。
    ref: event-gilded-age-industrialization#C7
  - kind: short
    q: 現在我們看到美國成為強國，為什麼談「它為什麼強」時要小心後見之明與倖存者偏差？
    model: 1790 年漢彌爾頓的計畫差點在國會被擋下，1792 年又發生金融恐慌，當時結果並不確定；1971 年與 2008 年前後也有人預測美元會失去地位，但沒有發生。我們看到的是「撐下來」的美國與美元，容易以為成功是必然的，也容易忘記沒走成的路和被犧牲者的經驗。本單元不構成投資建議。
    explain: 事後看很清楚的事，當時並不清楚；留下來的成功案例也不等於所有案例。
    hints:
    - 回去看漢彌爾頓卡的「事後看」：1790 年當時的結果確定嗎？
    - 美元卡也有一段講 1971 與 2008 年前後的預測。
    - 誰的故事比較容易被留下來？
    ref: finance-hamilton-financial-plan
- type: recap
  model_answer: 這一課的問題是：美國有了制度之後，怎麼變得這麼強？漢彌爾頓的財政計畫讓新國家建立信用，不過當時就有人擔心富人與投機者獲利。從土地與資源看，購地使領土大約增加一倍，鐵路、鋼鐵與石油在鍍金時代長出巨型公司，但史家對邊疆論、對大資本家是「強盜大亨」還是「產業領袖」都有不同評價。從時機看，二戰剛結束時美國經濟遠強於其他主要國家，馬歇爾計畫提供超過 130 億美元援助，DeLong 與 Eichengreen 認為關鍵在它促成歐洲採取穩定財政與市場導向的政策，Milward 等學者則質疑援助的貢獻被誇大。從美元看，1944 年的規則把美元放在體系中心，1971 年之後它仍是最主要的儲備貨幣，但 IMF 統計中的占比會變化，今天也不能直接套用當年的情況。每一條解釋背後都有代價：被迫遷移的原住民族（切羅基人估計約 4,000 人死亡）、割讓土地的墨西哥、面對壓力的工人和被排華法案排除的華人勞工。最後提醒：事後看很清楚的事，當時並不清楚，我們看到的也是倖存下來的故事；歷史可以幫我們理解強國怎麼形成，但不能用來預測市場，本單元不構成投資建議。

id: unit-cold-war-1
title: 冷戰（上）：鐵幕落下、柏林與古巴
histories: [歐洲史, 美國史]
mystery: 二戰時，美國和蘇聯是一起作戰的盟友；戰爭一結束，兩邊卻成了對手。接下來幾十年，他們造出能把對方毀滅好幾次的核彈，卻一直避免在戰場上直接交手。柏林先被封鎖、再被一道牆切開；到了 1962 年 10 月，兩邊又在古巴走到核戰邊緣。這場「戰爭」為什麼一直是冷的？
teaser: 一道從波羅的海落到亞得里亞海的鐵幕、一座靠飛機餵了將近一年的城市、一個清晨冒出來的鐵絲網，還有十三天。
goals:
  - 能說明杜魯門主義、馬歇爾計畫和北約，怎麼組成美國「援助加聯盟」的圍堵做法
  - 能說出柏林封鎖與柏林圍牆的起因和結果，並解釋東德為什麼要築牆
  - 能說出 1962 年甘迺迪面對古巴飛彈時有哪些選項、他選了哪一個，以及危機最後怎麼收場
  - 能判讀古巴危機中赫魯雪夫一封來信的一段原文，說出他想傳達什麼
  - 能比較柏林封鎖和古巴飛彈危機：兩次危機怎麼都沒有變成熱戰
  - 能分辨冷戰時的防空演習、忠誠審查和今天的演練哪裡可以比、哪裡不能比
minutes: 50
steps:
  - type: hook
    text: |
      1946 年 3 月，英國的邱吉爾在美國密蘇里州的一所學院演講，說歐洲「一道鐵幕已經落下」。幾年後，美國學生開始練習看到閃光就躲到桌子底下、遮住頭和脖子；而在臺灣，從 1978 年起，每年「萬安演習」的警報一響，街上的人車就要淨空。
      躲桌子、拉警報，防的都是一場「還沒發生」的戰爭。美國和蘇聯對峙了四十多年，為什麼兩邊一直準備打仗，卻又一直避免直接開打？
      這一課我們從二戰剛結束的歐洲走起，經過一座被切成兩半的城市，最後走進 1962 年 10 月的白宮，替甘迺迪做一次決定。
  - type: card
    id: person-truman
    depth: understand
    prompt: 先認識美國這邊的第一位冷戰總統。注意：他是怎麼突然當上總統的？1947 年他向國會要錢援助哪兩個國家？他怎麼把一筆援助預算，講成一場「自由民族」的選擇？
  - type: card
    id: person-stalin
    depth: understand
    prompt: 再看另一邊。史達林靠什麼職位掌握全黨？在波茨坦，杜魯門暗示美國有新武器時，史達林其實早就知道什麼？1946 年他公開說戰爭是什麼的「必然結果」？
  - type: card
    id: event-containment-nato
    depth: understand
    prompt: 美國怎麼回應？依序找出長電報、杜魯門主義、北約第五條。注意：第五條真的等於「一國被打，大家自動參戰」嗎？「冷戰是誰開始的」，史家有哪幾派看法？
  - type: check
    items:
      - kind: choice
        q: 《北大西洋公約》第五條規定了什麼？
        options:
          - 只要一個成員被攻擊，所有成員必須立刻出兵參戰
          - 對一個成員的武裝攻擊視為對全體的攻擊，各成員自行決定採取它認為必要的行動
          - 成員國必須接受美國的經濟援助
          - 成員國不得和蘇聯有任何貿易
        answer: 1
        explain: 第五條說攻擊一國視同攻擊全體，但各國採取「它認為必要的行動，包括使用武力」，仍要依自己的憲法程序，所以不是「自動參戰」。
        hints:
          - 卡片的「常見誤解」特別提醒過第五條不是什麼。
          - 注意「它認為必要的行動」這幾個字：由誰決定？
        ref: event-containment-nato#C4
  - type: card
    id: event-marshall-plan
    depth: understand
    prompt: 除了結盟，美國還出錢。歐洲為什麼需要美元？馬歇爾說他的政策「不是針對任何國家」，那為什麼蘇聯和東歐最後沒有參加？這筆錢真的是歐洲復興的關鍵嗎？
  - type: card
    id: event-berlin-blockade-1948
    depth: understand
    prompt: 冷戰第一場大危機。注意：封鎖的導火線為什麼是「一種新的錢」？西方用什麼方法撐住西柏林，而不是開戰？封鎖結束後，德國變成什麼樣子？
  - type: card
    id: social-cold-war-daily-life
    depth: understand
    prompt: 大人物在對峙，一般人過什麼日子？比一比美國的教室和職場、東德的鄰居，以及臺灣的街頭。注意：躲在桌子底下主要是為了防什麼？東德的線民數字為什麼差這麼多？
  - type: card
    id: event-hungary-1956-prague-1968
    depth: understand
    prompt: 在蘇聯陣營裡，小國能改到什麼程度？注意：匈牙利 1956 年 11 月 1 日宣布了什麼，三天後發生什麼事？美國為什麼沒有出兵幫忙？
  - type: card
    id: event-berlin-wall-1961
    depth: understand
    prompt: 柏林第二次成為前線。1961 年以前有多少東德人逃往西方？東德領導人 6 月怎麼說，8 月 13 日又做了什麼？這道牆主要是擋外面的人進來，還是擋自己的人出去？（卡片後半寫到 1989 年，下一課會再回來。）
  - type: chain
    prompt: 把柏林這條線依照「因 → 果」排成一條鏈（最上面是最早的原因）。
    items:
      - 二戰後德國和柏林由戰勝國分區占領，西柏林位在蘇聯占領區裡面
      - 美國提出馬歇爾計畫，蘇聯退出巴黎會議，東西歐開始分成兩塊
      - 1948 年 6 月美英在西占領區和西柏林發行新的德國馬克，蘇聯隨即封鎖西柏林
      - 西方用飛機空運撐住西柏林，封鎖期間簽下《北大西洋公約》
      - 封鎖結束後東西德分別建國，西柏林成了東德人出走的缺口
      - 1961 年 8 月 13 日東德用鐵絲網封住邊界，築起柏林圍牆
    explain: 分區占領讓西柏林成為蘇聯占領區裡的一座「孤島」。馬歇爾計畫把東西歐分開；美英為了讓援助能運作，在西占領區發行新馬克，蘇聯就以封鎖西柏林回應。西方選擇空運而不是開戰，同時用北約把美國的安全承諾帶進歐洲。封鎖沒有逼走西方，德國卻正式一分為二；約 350 萬東德人陸續逃往西方，很多人經過西柏林，東德最後用一道牆把這個缺口關起來。
    hints:
      - 最早的原因是二戰後的占領安排。
      - 新馬克和馬歇爾計畫有關，所以馬歇爾計畫在封鎖之前。
      - 圍牆是要擋住「出走」，所以要先有兩個德國、先有人出走。
    ref: event-berlin-blockade-1948#C7
  - type: decision
    role: 你是 1962 年 10 月甘迺迪總統身邊的一位國家安全顧問
    situation: |
      1962 年 10 月 14 日，美國的 U-2 偵察機在古巴拍到正在興建的中程與中長程彈道飛彈基地，照片隔天送到白宮。
      你知道的背景是：1961 年 4 月，中央情報局訓練的古巴流亡者在豬玀灣登陸，兩天內就失敗；6 月甘迺迪在維也納和赫魯雪夫見面，對方覺得這位年輕總統軟弱。同一年，美國也在義大利和土耳其部署了射程可達莫斯科的朱比特飛彈。9 月 4 日，甘迺迪才公開警告：不准把攻擊性武器運進古巴。
      現在總統要你們提建議。會議裡超過三分之一的人主張不預警空襲。另一個辦法是派軍艦攔查開往古巴的船，但在國際法上，「封鎖」等於戰爭行為。
      先別急著看選項：如果你是這位顧問，只知道這些，你會建議總統怎麼做？
    options:
      - label: 不預警空襲，直接炸掉飛彈基地
        result: 推測：基地也許能被炸毀一部分，但當時美國並不知道，蘇聯已經把 162 枚核彈頭運進古巴（這是後來才知道的），一次空襲未必清得乾淨；炸死蘇聯人員也可能讓雙方直接交戰。歷史沒有走這條路，所以後果只能推測。
      - label: 用軍艦攔查開往古巴的船，但不叫它「封鎖」
        result: 這是甘迺迪最後的選擇。10 月 22 日他上電視宣布海上「隔離」，攔查運往古巴的武器，並寫信要赫魯雪夫撤走飛彈；刻意用「隔離」而不是「封鎖」，因為它不假定雙方已經在打仗。接下來的幾天非常危險，結果等一下的古巴卡會告訴你。
      - label: 派大軍全面入侵古巴
        result: 推測：規模比空襲更大，美軍會直接面對古巴軍隊，以及美國當時還不知道的核彈頭；豬玀灣才失敗一年多，入侵也可能拖成一場長期戰爭。歷史沒有走這條路，所以後果只能推測。
      - label: 先不理會，只在外交上抗議
        result: 推測：甘迺迪 9 月才公開警告過，不理會等於讓自己的警告失效；赫魯雪夫本來就覺得他優柔寡斷，可能更敢加碼。也可能雙方慢慢談出別的條件。歷史沒有走這條路，所以後果只能推測。
    actual: 甘迺迪沒有空襲，也沒有入侵，而是選擇海上「隔離」，給赫魯雪夫留下撤退的空間。10 月 27 日「黑色星期六」，一架 U-2 在古巴上空被擊落，一艘帶著核魚雷的蘇聯潛艇也差點發射；10 月 28 日赫魯雪夫宣布撤走飛彈。美國公開承諾不入侵古巴，並私下答應撤除土耳其的朱比特飛彈，1963 年 4 月撤除。當時沒有人知道這樣做一定會成功。
    ref: person-kennedy#P3
    note: 沒有發生的選項，後果都是推測，標示清楚。古巴卡、甘迺迪卡、赫魯雪夫卡和核武競賽卡都寫到危機的收場，所以全部放在這個決策之後；situation 只用豬玀灣、維也納、朱比特飛彈、9 月 4 日警告和 10 月 14–15 日照片這些「當時已經知道」的事。
  - type: card
    id: event-cuban-missile-crisis-1962
    depth: understand
    prompt: 對照你的建議，看看那十三天實際怎麼走。注意 10 月 26 日、27 日、28 日分別發生什麼；誰下令擊落 U-2？潛艇上的阿爾希波夫做了什麼？這場危機算是誰「贏」了？
  - type: source
    card: event-cuban-missile-crisis-1962
    idx: 1
    question: 赫魯雪夫在 10 月 26 日的信裡說「不只要放鬆拉扯繩子兩端的力量，還要解開那個結」，他想表達什麼？
    options:
      - 蘇聯準備把繩子拉得更緊，逼美國先退
      - 他宣布蘇聯退出一切談判
      - 他要求美國馬上拆掉所有核武
      - 雙方不只要停止互相施壓，還要想辦法解決讓雙方對峙的問題本身
    answer: 3
    explain: 「relax the forces pulling on the ends of the rope」是停止互相拉扯，「untie that knot」是把造成對峙的結解開。古巴卡寫到，這封信表示願意以撤除飛彈，換取美國不入侵古巴。讀的時候也要記得：這是危機中一方領袖寫給對手的信，用比喻替自己留談判空間；我們讀到的是美國國務院史家室轉引的英文版本，再由本站摘譯成中文。
    hints:
      - 先分開兩半：前半說「放鬆繩子兩端」，後半說「解開那個結」。
      - 兩個人拉同一條繩子，越拉，中間的結會怎樣？
      - 回去看古巴卡「經過」裡的 10 月 26 日：這封信提出了什麼交換？
    ref: event-cuban-missile-crisis-1962#C2
  - type: card
    id: person-kennedy
    depth: understand
    prompt: 認識做決定的人。他在就職演說裡說「永遠不要因恐懼而談判，但也永遠不要害怕談判」，古巴危機的結局符合這句話嗎？注意：這張卡和古巴卡都寫到美國私下撤除飛彈，甘迺迪卡多寫了哪一個國家？古巴卡對這一點怎麼說？
  - type: card
    id: person-khrushchev
    depth: understand
    prompt: 從另一邊看同一場危機。赫魯雪夫一手批判史達林、一手把飛彈送到古巴；危機之後，他在黨內的地位變強還是變弱？1964 年他怎麼下台？
  - type: card
    id: tech-nuclear-arms-race
    depth: understand
    prompt: 把鏡頭拉遠：危機背後是一場核武競賽。什麼叫「相互保證毀滅」？1963 年的條約禁止了哪些核試、沒禁止哪些？「轟炸機差距」告訴我們競賽有一部分是被什麼推著走的？
  - type: compare
    cards: [event-berlin-blockade-1948, event-cuban-missile-crisis-1962]
    prompt: 比一比冷戰兩場「切斷交通」的危機：一次是蘇聯切斷西柏林，一次是美國攔查開往古巴的船。
    rows:
      - aspect: 時間
        a: 1948 年 6 月 24 日封鎖，1949 年 5 月解除；空運持續到 1949 年 9 月 30 日
        b: 1962 年 10 月 14 日拍到飛彈基地，10 月 28 日赫魯雪夫宣布撤彈；隔離到 11 月 20 日才結束
      - aspect: 誰切斷交通
        a: 蘇聯切斷通往西柏林的公路、鐵路和運河
        b: 美國海軍「隔離」，攔查運往古巴的武器
      - aspect: 導火線
        a: 美英事先沒有告知蘇聯，就在西占領區和西柏林發行新的德國馬克
        b: 蘇聯和古巴秘密約定，在古巴部署核飛彈
      - aspect: 另一方怎麼回應
        a: 西方不用武力突破，改用飛機空運糧食和燃料
        b: 赫魯雪夫先來信說願意「解開那個結」，第二封信加上要美國撤除土耳其飛彈
      - aspect: 最危險的時刻
        a: 卡片沒有寫到雙方交火；西柏林居民在封鎖下生活艱苦將近一年
        b: 10 月 27 日 U-2 被擊落、駕駛員喪生；蘇聯潛艇 B-59 差點發射核魚雷
      - aspect: 怎麼收場
        a: 蘇聯沒有逼走西方，解除封鎖；德國分成東西兩國
        b: 蘇聯撤走飛彈；美國公開承諾不入侵古巴，私下撤除土耳其飛彈；美蘇建立熱線
    question: 兩次危機都沒有變成熱戰。各舉一個讓雙方「不必開第一槍」的做法；你覺得哪一次比較危險？為什麼？
    model_answer: 柏林那次，西方用空運繞過封鎖，不必用武力衝破，蘇聯也不必對飛機開火；最後蘇聯解除封鎖，沒有人開第一槍。古巴那次，美國選「隔離」而不是空襲，又刻意不用「封鎖」這個等於開戰的字眼；最後公開承諾不入侵古巴，把撤除土耳其飛彈放在私下交換，讓雙方都能說自己沒有輸。古巴那次比較危險：雙方都有核武，美國不知道島上已經有核彈頭，擊落 U-2 和潛艇差點發射核魚雷，都不是最高領導人直接下令的，局勢差點失控。這題沒有標準答案，重點是說出「留台階」的做法，以及危險來自哪裡。
    hints:
      - 先看「另一方怎麼回應」那一列：哪些做法是在避免開戰？
      - 再看「最危險的時刻」：哪些事不是領袖直接下令的？
      - 想想看：1948 年和 1962 年，蘇聯手上各有沒有核彈？（核武競賽卡寫了蘇聯第一次試爆是哪一年。）
  - type: today
    card: social-cold-war-daily-life
    question: 有人說「臺灣的萬安演習、美國冷戰時的臥倒掩護，跟今天的防災演練根本是同一回事」。這個說法哪裡不成立？又有哪些地方值得借來想？
    model_answer: 先說不能類比的地方：冷戰時的防空演習針對的是核戰，今天的演練多半同時針對地震、颱風等天災，情境不同；美國的忠誠審查發生在有國會、法院和新聞自由的體制裡，麥卡錫最後被參議院譴責，東德的史塔西卻是一黨體制下沒有外部制衡的秘密警察，兩者也不能直接畫上等號。萬安演習從 1978 年一路辦到 2024 年，2025 年才和民安演習合併成城鎮韌性演習，已經不是當年那個演習。可以借來想的是兩個結構：第一，「演練也是一種宣傳」，它既教人保命，也讓危險一直留在大家心裡，史家對冷戰演習到底是實用還是宣傳也有爭論；第二，「外面的威脅，容易變成檢查裡面的人」，被懷疑的人很難證明自己清白。至於躲桌子的動作，主要是防爆風震碎的玻璃，這點倒是和今天地震演練的道理一樣。
  - type: check
    items:
      - kind: order
        q: 依時間先後排列古巴飛彈危機前後的事件：
        items:
          - 古巴流亡者登陸豬玀灣失敗
          - U-2 偵察機拍到古巴的飛彈基地
          - 甘迺迪宣布海上「隔離」
          - 黑色星期六：U-2 在古巴上空被擊落
          - 赫魯雪夫宣布撤走古巴的飛彈
          - 美國撤除土耳其的朱比特飛彈
        explain: 1961 年 4 月豬玀灣 → 1962 年 10 月 14–15 日拍到基地 → 10 月 22 日宣布隔離 → 10 月 27 日黑色星期六 → 10 月 28 日宣布撤彈 → 1963 年 4 月撤除土耳其飛彈。
        hints:
          - 豬玀灣在 1961 年，比危機早一年多。
          - 撤除土耳其飛彈是私下交換，比公開撤彈晚了幾個月。
        ref: event-cuban-missile-crisis-1962#C2
      - kind: short
        q: 用一兩句話說明：東德為什麼要在 1961 年築起柏林圍牆？
        model: 因為 1961 年以前約有 350 萬東德人（大約五分之一人口）逃往西方，很多人經由西柏林離開，東德的人才和勞動力不斷流失；築牆就是要把這個出走的缺口關起來。
        explain: 東德官方說圍牆是「反法西斯」的防衛工事，但當時出走的主要是東德自己的人民，所以圍牆主要是擋自己人出去，不是擋外人進來。
        hints:
          - 回去看柏林圍牆卡的背景：築牆前有多少人逃走？
          - 這道牆擋的是想進來的人，還是想出去的人？
        ref: event-berlin-wall-1961#C1
  - type: recap
    model_answer: 二戰一結束，美蘇從盟友變成對手。美國先用杜魯門主義援助希臘和土耳其，再用馬歇爾計畫把錢送進西歐，1949 年又和西歐簽下北約，組成「援助加聯盟」的圍堵；蘇聯則守住東歐，1956 年匈牙利想退出華約，就被蘇軍鎮壓。柏林是最前線：1948 年蘇聯封鎖西柏林，西方用飛機撐了將近一年；封鎖結束後德國一分為二，1961 年東德為了擋住出走潮築起圍牆。1962 年 10 月，蘇聯在古巴部署飛彈，甘迺迪沒有空襲，而是選擇海上「隔離」；十三天後赫魯雪夫撤走飛彈，美國公開承諾不入侵古巴，私下撤走土耳其的飛彈，雙方隨後建立熱線、簽下禁止部分核試的條約。要記得兩個提醒：第一，冷戰「沒有變熱」不是理所當然，古巴那幾天靠的是留台階、秘密交換，還有不少運氣；第二，冷戰也不只是領袖的事，美國的教室、東德的鄰居、臺灣的街頭，一般人的生活都被它改變。這是一種參考說法，不是標準答案。
reflect: 甘迺迪在古巴危機裡選了一條「讓對方有台階下」的路，代價是要冒對方不讓步的風險。你有沒有和別人起衝突、想讓對方先低頭的經驗？如果當時你留一個台階給對方，事情會不會不一樣？留台階和「示弱」，差別在哪裡？

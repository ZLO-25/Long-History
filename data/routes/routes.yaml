  - id: wall-hadrian
    name: 哈德良長城（Hadrian's Wall）
    kind: wall
    start: 122
    end: 410
    precision: traced
    note: 122 年開始修築，東起沃爾森德（Segedunum），西到索爾韋灣的鮑內斯；約 410 年羅馬統治不列顛結束前仍為主要防線。
    method: awmc-wall
    waypoints: ['89288', '89239']
    sources:
      - { id: s1, title: Wikipedia「Hadrian's Wall」, url: "https://en.wikipedia.org/wiki/Hadrian%27s_Wall", accessed: 2026-10-24 }

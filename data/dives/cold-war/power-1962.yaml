year: 1962
basemap: world_countries
title: 古巴飛彈危機的那一年（1962 年 10 月）
note: 1959 年古巴革命後，卡斯楚政權倒向蘇聯；1962 年 10 月美國發現蘇聯在古巴部署飛彈，雙方一度逼近核戰。1961 年東德築起柏林圍牆。這時中國和蘇聯已經公開交惡，阿爾巴尼亞站在中國那一邊、不再參加華沙公約的活動（1968 年正式退出）。以今日國界近似，邊界只是示意。

id: unit-vietnam-china
title: 越南與中國：為什麼打贏了，還要去朝貢？
histories: [越南史, 中國史]
mystery: 越南一次又一次打退北方的大軍，可是打贏之後，往往很快又派使者去中國稱臣朝貢。打贏的一方為什麼還要低頭？
teaser: 一千年被統治，自主後又一直稱臣，越南用一套「對外稱王、對內稱帝」的辦法，和北方的大國相處。
goals:
  - 能說出北屬時期、938 年白藤江之戰、明朝佔領與黎利建國的先後順序
  - 能判讀〈南國山河〉與〈平吳大誥〉，說出越南怎麼表達「南北各有其主」
  - 能說明什麼是「外王內帝」，以及越南為什麼打贏後還要請封
  - 能比較越南與中國的史書，對同一場戰爭的記法有什麼不同
minutes: 30
steps:
  - type: hook
    text: |
      想像隔壁有一個比你們班大十倍的班級。你們打躲避球贏了他們，下課後你們班長卻拿著點心過去說：「以後還請多多指教。」
      這看起來很奇怪，但越南和中國相處了一千多年，常常就是這樣。
      這個單元，我們要找出越南「打贏還要低頭」的道理。
  - type: card
    id: event-vietnam-northern-rule
    depth: story
    prompt: 先看越南被北方統治的一千年。注意「安南」這個名字是誰取的。
  - type: card
    id: war-bach-dang-938
    depth: story
    prompt: 一千年的統治怎麼結束？注意吳權用了什麼地形和自然現象。
  - type: source
    card: war-bach-dang-938
    idx: 0
    question: 這段中國史書的記載，說明南漢水軍是怎麼輸的？
    options:
      - 南漢的船太少，被越南的大艦隊包圍
      - 南漢水軍在海上迷路，開到別的河口，錯過了戰機
      - 吳權的兵趁漲潮進攻，南漢水軍追上去；退潮時船撞上海裡的鐵木樁，紛紛翻覆
      - 南漢皇帝臨時下令撤退，水軍還沒交戰就掉頭回去
    answer: 2
    explain: 「植鐵橛海中」是在水底插下包鐵的木樁；「權兵乘潮而進，洪操逐之」是吳權的兵趁漲潮誘敵、南漢主帥追了上來；「潮退舟還，轢橛者皆覆」是退潮時船往回走，壓到木樁的全都翻了。有趣的是，這段記載出自中國的《新五代史》，是從南漢這一方記下越南的戰術。
    hints:
      - 「植鐵橛海中」是在海裡做了什麼？
      - 「乘潮而進」的「潮」是什麼？潮水會一直在嗎？
      - 「潮退」之後，船底下會露出什麼？
    ref: war-bach-dang-938#story
  - type: card
    id: war-song-dai-viet-1075
    depth: deep
    prompt: 自主之後，越南對宋朝稱臣，在國內卻稱皇帝。讀「史家怎麼吵」時，注意〈南國山河〉算不算獨立宣言。
  - type: source
    card: war-song-dai-viet-1075
    idx: 0
    question: 「南國山河南帝居」最想強調的是什麼？
    options:
      - 越南要向北方的皇帝投降
      - 南方的土地有南方自己的皇帝，北方不應來侵犯
      - 越南要攻打中國，統一天下
      - 南方的山河景色很美
    answer: 1
    explain: 詩的前兩句說南方的山河由「南帝」居住，界線是「天書」定好的；後兩句警告來犯的敵人會失敗。今天越南把它讀成「南帝」和「北帝」平起平坐。不過學者也提醒，這首詩的作者和年代至今仍有爭議。
    hints:
      - 詩裡的「南帝」對應的是誰？
      - 「截然定分在天書」說南北的界線是怎麼來的？
      - 後兩句是在對誰說話？
    ref: war-song-dai-viet-1075#story
  - type: card
    id: war-yuan-dai-viet
    depth: story
    prompt: 連蒙古大軍都被擋回去了。讀到最後一句時，注意陳朝打贏之後做了什麼。
  - type: card
    id: war-ming-dai-viet
    depth: understand
    prompt: 自主四百多年後，越南又被明朝改成一個省。注意黎利趕走明軍後，馬上做了哪一件事。
  - type: source
    card: war-ming-dai-viet
    idx: 0
    question: 〈平吳大誥〉說「惟我大越之國，實為文獻之邦」，作者用什麼標準證明大越是一個了不起的國家？
    options:
      - 大越的軍隊天下無敵，連明朝大軍都打不過
      - 大越的土地和人口都比北方的中國更大
      - 大越信仰的神明比中國更強
      - 大越是有典籍、有文化的「文獻之邦」，山川疆域和風俗也和北方不同
    answer: 3
    explain: 作者強調的是「文獻」（典籍與文化）和「山川之封域既殊，南北之風俗亦異」。學者凱利（Liam Kelley）提醒，「文獻」是當時東亞共同的文明理想，不是越南獨有的認同；「大誥」也是對國內臣民發布的文體，把它讀成近代的「獨立宣言」並不恰當。
    hints:
      - 「文獻」指的是什麼？
      - 後面兩句比較了南北哪兩件事？
      - 這些標準是軍事的，還是文化的？
    ref: war-ming-dai-viet
  - type: card
    id: event-nguyen-dynasty-vietnam-name
    depth: story
    prompt: 最後看「越南」這個國名是怎麼來的。注意阮朝原本想要的是哪兩個字，清朝又怎麼改。
  - type: chain
    prompt: 把越南和北方王朝的關係，依時間排成一條路（最上面最早）。
    items:
      - 漢武帝滅南越，越南北部進入北屬時期
      - 吳權在白藤江打敗南漢，越南開始自主
      - 李常傑攻入宋朝邊境，越南用〈南國山河〉宣示南北各有其主
      - 陳興道在白藤江打敗元朝水軍
      - 明朝把越南改成交趾布政使司，黎利起兵把明軍趕走
      - 阮朝向清朝請封，國號定為「越南」
    explain: 前 111 年 → 938 年 → 1075–1077 年 → 1288 年 → 1407–1428 年 → 1802–1804 年。每一次打完仗，越南都回到朝貢與冊封的關係。
    hints:
      - 北屬時期是一切的起點。
      - 白藤江打過兩次大勝仗，第一次是 938 年，第二次對手是蒙古人建立的元朝。
      - 國號「越南」出現得最晚，在 19 世紀初。
    ref: event-nguyen-dynasty-vietnam-name#story
  - type: compare
    cards: [war-yuan-dai-viet, war-greco-persian]
    prompt: 比一比兩個「小國擋住大帝國」的故事：13 世紀的越南陳朝對蒙古元朝，前 480 年的希臘城邦對波斯。
    rows:
      - { aspect: 入侵的大帝國, a: 橫掃歐亞的蒙古，忽必烈建立的元朝, b: 當時最大的帝國波斯，薛西斯國王親自帶兵 }
      - { aspect: 小國怎麼撐住, a: 放棄都城、退到鄉間打游擊，最後在白藤江用木樁陣大敗元朝水軍, b: 用勞里昂銀礦的錢造新艦隊，把波斯艦隊引進狹窄的薩拉米斯海峽 }
      - { aspect: 打贏之後, a: 馬上派使者向元朝謝罪朝貢、送回戰俘, b: 波斯撤出歐洲的希臘地區，愛奧尼亞城邦恢復獨立；雅典成立提洛同盟，成為反波斯陣營的領袖 }
    question: 兩邊都打贏了，為什麼越南打贏之後還要向元朝朝貢，希臘卻是組成同盟繼續對抗波斯？
    model_answer: 兩邊都利用地形，在水上打了決定性的一仗（白藤江的木樁陣、狹窄的薩拉米斯海峽）。不同的是，元朝三次打進越南，越南和元朝都承受不起無止境的戰爭，陳朝就用送回戰俘、遣使朝貢保住面子與和平，元朝在忽必烈死後也放棄再出兵；波斯則是跨海遠征，薩拉米斯戰敗後薛西斯擔心退路被切斷，帶大軍撤回亞洲，戰後波斯撤出希臘地區，雅典還成立提洛同盟繼續帶頭對抗波斯。這就是越南「打贏也稱臣」的道理：朝貢是換取和平的辦法。
    hints:
      - 先看「小國怎麼撐住」那一列：兩邊都用了什麼樣的地方打仗？
      - 再看「打贏之後」：越南做了什麼希臘沒做的事？
      - 波斯是跨海遠征來的；元朝卻三次打進越南。越南和元朝承受得起一直打下去嗎？
  - type: decision
    role: 你是 1428 年剛把明軍趕走的黎利
    situation: |
      你打了十年仗，終於讓明軍撤退，在國內稱帝，國號大越。
      北方的明朝還是一個大國。你可以從此不理明朝，也可以派使者去向明朝表示臣服，恢復朝貢。你會怎麼做？
    options:
      - { label: 派使者表示臣服，恢復朝貢, result: 這是黎利當年的選擇。1431 年明朝正式承認他的統治，雙方恢復朝貢關係，越南此後再也沒有被中國直接統治。 }
      - { label: 不理明朝，斷絕往來, result: 推測：明朝可能覺得面子掛不住，再找機會出兵；越南也得長期維持大軍防北方。歷史沒有走這條路，所以後果只能推測。 }
    actual: 黎利很快派使者向明朝表示臣服，恢復朝貢；在國內，他仍然是大越的皇帝。
    ref: war-ming-dai-viet#A8
    note: 「沒有發生的選項」的後果都是推測，標示清楚。
  - type: today
    card: event-joseon-dynasty
    question: 有人說「越南、朝鮮以前都向中國朝貢，所以它們本來就是中國的一部分」。這個說法哪裡不成立？
    model_answer: 朝貢是前現代東亞的禮儀秩序，不是今天國際法下的主權與領土關係；朝鮮在禮儀上稱臣，內政卻高度自主，越南的君主對中國稱國王、在國內稱皇帝，黎利以後也再沒有被中國直接統治。所以不能用「有沒有朝貢」來判斷一個地方屬不屬於中國。可以借來思考的是：小國夾在大國之間，常常靠禮儀關係換取安全與自主。
  - type: check
    items:
      - kind: choice
        q: 「外王內帝」是什麼意思？
        options: [對外稱皇帝、對內稱國王, 只在打仗時才稱皇帝, 對中國稱國王、接受冊封，在國內稱皇帝, 國王和皇帝是兩個不同的人]
        answer: 2
        explain: 越南的君主對中國的皇帝稱「國王」、接受冊封；在國內和對其他鄰國，則自稱皇帝。
        hints: [「外」指的是對誰？「內」呢？, 想想黎利在國內稱什麼，對明朝又怎麼表示。]
        ref: war-ming-dai-viet
      - kind: choice
        q: 「越南」這個國名是怎麼來的？
        options: [阮朝請封「南越」，清朝改成「越南」, 胡志明在 1945 年取的, 從漢朝就這樣叫, 法國人取的]
        answer: 0
        explain: 1802 年阮朝統一後，向清朝請求國號「南越」；清朝認為古代南越國包括廣東、廣西，名字不妥，把兩字倒過來改成「越南」。
        hints: [跟一次「請封」有關。, 原本想要的兩個字，被倒過來了。]
        ref: event-nguyen-dynasty-vietnam-name#story
      - kind: short
        q: 中國的史書和越南的史書，在記宋越熙寧戰爭時，各自強調了什麼？
        model: 越南史書強調宋軍被擋在如月江、無功而返；中國史書則記下宋軍拿下了廣源州等地，之後才在談判中歸還部分土地。兩邊都強調對自己有利的部分。
        explain: 同一場戰爭，雙方的記法常常不一樣；讀歷史時要問「這是誰寫的」。
        hints: [回去看宋越戰爭卡的「史家怎麼吵」。, 一邊強調「擋住」，一邊強調「拿下」。]
        ref: war-song-dai-viet-1075
  - type: recap
    model_answer: 因為打贏一場仗，不代表北方不會再來，雙方也都承受不起無止境的戰爭。派使者稱臣、接受冊封，比較像一種外交禮儀和換取和平的方法：中國的皇帝保住面子，越南換到和平。所以越南的君主「對外稱王、對內稱帝」：在中國面前是國王，在自己的國家是皇帝。從黎利到阮朝都是這樣做，連國名「越南」都是請封時由清朝定下來的。
reflect: 你有沒有遇過這種情況：明明自己有理、甚至贏了，還是選擇先低頭、讓對方有台階下？那樣做換到了什麼，又失去了什麼？

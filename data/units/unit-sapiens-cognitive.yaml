  - type: recap
    model_answer: |
      回到一開始的問題：一種普通的動物，怎麼遍布全球？卡片能確定的是：智人最早的化石之一約 31.5 萬年前出現在非洲（摩洛哥，也有學者質疑它該不該歸為智人），地球上還有尼安德塔人、丹尼索瓦人等其他人類；主要的一支約 7–5 萬年前走出非洲，之後抵達澳洲、再到美洲，其他人類陸續消失，只在我們身上留下一點 DNA。
      哈拉瑞認為，關鍵是約 7 萬年前的「認知革命」：智人學會相信共同的故事，才能和陌生人大規模合作。但卡片上的證據讓我們要小心：布隆伯斯洞穴的顏料、刻紋赭石和貝殼珠比 7 萬年前更早，漸進說認為這是慢慢累積的，不是一場突然的革命；「某個基因突變造成語言」也沒有被證實。抵達澳洲、美洲的年代還在吵，大型動物滅絕是不是人類造成的，學界也仍然分歧。
      比較穩妥的結論是：智人確實在幾萬年內走遍各大陸，也確實留下了象徵行為的痕跡；但「是說故事的能力讓智人稱霸」是一個很有啟發性的解釋，不是已經被證明的事實。讀一本暢銷書，可以欣賞它的大故事，也要記得回頭看證據。
reflect: 哈拉瑞說，人類靠相信同一個故事，才能和陌生人合作。想一想你所屬的一個團體（班級、社團、球隊、網路社群）：大家是靠什麼覺得「我們是一夥的」？那個東西是看得見的（制服、標誌），還是大家心裡共同相信的（目標、規則）？如果有一天大家不再相信它，這個團體會怎麼樣？

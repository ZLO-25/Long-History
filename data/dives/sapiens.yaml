        哈拉瑞認為，科學和過去傳統最大的不同，是願意承認「我們不知道」，並透過觀察和數學不斷修正理論，而不是相信答案早已寫在經典裡 [b14][b26][b22]。他也強調科學從來不中立：研究很花錢，誰出錢就決定研究什麼，國王和政府常為了征服和打仗資助研究 [b14][b26]。他把現代醫學追求延長壽命比喻成古代吉爾伽美什追求永生，但懷疑活得久就會更快樂 [b14]。
      cards:
        - event-scientific-revolution
        - tech-printing-press
        - event-enlightenment
      card_notes:
        event-scientific-revolution: 科學家研究的經費和動機從哪裡來
        tech-printing-press: 印刷讓錯誤能被公開檢驗和修正
        event-enlightenment: 延伸例子：相信理性與進步的思想潮流
      debate:
        - who: 李約瑟（Joseph Needham，科學史家）
          text: 許多發明中國比歐洲早。他在《中國的科學與文明》整理出鑄鐵、火藥、印刷、指南針等中國較早的發明，並提出「李約瑟問題」：現代科學為什麼在歐洲出現？合作者席文（Nathan Sivin）則認為這是在問沒有發生的事，很難回答 [b48]。
          src:
            - b48
          stance: 補充
        - who: 中世紀伊斯蘭世界的科學史研究
          text: 用觀察和實驗檢驗知識，不是歐洲獨有。約 8 到 13 世紀，伊本・海什木主張假說要用實驗或數學驗證，花剌子米讓代數成為獨立學科，這些知識後來傳進拉丁歐洲 [b49]。
          src:
            - b49
          stance: 補充
      think: 「科學革命（16–17世紀）」卡上的科學家，研究經費和動機從哪裡來？這支持「科學從不中立」嗎？「古騰堡印刷機」在「承認無知、不斷修正」的過程中扮演什麼角色？
      minutes: 5
    - no: 15
      part: 4
      title: 歐洲為何能稱霸世界？
      en: The Marriage of Science and Empire
      claim: |
        哈拉瑞以庫克船長的航行為例，主張科學考察和帝國擴張常常綁在一起 [b15]。他認為歐洲當時的技術不一定比中國、印度或中東強，但歐洲人更有探索和征服的衝勁，這套重視科學與資本的價值觀讓小國建起全球帝國 [b15][b26]。他拿鄭和下西洋做對照，認為鄭和不以征服為目的，並描述西班牙人征服阿茲特克和印加的過程 [b15]。
      cards:
        - event-zheng-he-voyages
        - event-vasco-da-gama
        - event-columbus-aztec
        - commodity-potosi
        - event-cook-voyages
      card_notes:
        event-zheng-he-voyages: 和歐洲船隊對照的中國遠航
        event-vasco-da-gama: 歐洲船隊的目的和手段，可和鄭和比較
        event-columbus-aztec: 征服阿茲特克、印加的經過與疾病角色
        commodity-potosi: 征服帶來的白銀，帝國和資本的連結
        event-cook-voyages: 書中「科學加帝國」的主要例子
      debate:
        - who: 彭慕蘭（Kenneth Pomeranz）與「加州學派」
          text: 差別不只在價值觀。他在《大分流》認為，18 世紀末英格蘭和長江三角洲發展差不多；英國後來領先，關鍵是煤礦就在附近，以及美洲殖民地的土地和原料。莫基爾（Joel Mokyr）則強調歐洲政治分裂讓新思想有處可逃 [b50]。
          src:
            - b50
          stance: 反對
        - who: 韋傑夫（Geoff Wade，歷史學家）
          text: 鄭和船隊也用武力控制航線。他 2004 年認為船隊主要由士兵組成，曾在錫蘭作戰、俘虜國王，並向爪哇索賠，稱之為「原始的海上殖民主義」：目的是控制港口和航線，不是占領土地；陳達生（Tan Ta Sen）則用中文史料回應，得出不同結論 [b66][b67]。
          src:
            - b66
            - b67
          stance: 反對
        - who: 羅斯・哈希格（Ross Hassig）、馬修・雷斯托（Matthew Restall）等歷史學者
          text: 征服美洲不只靠歐洲人的武器。他們認為西班牙的武器優勢並非壓倒性；特拉斯卡拉等原住民盟軍估計有 8 萬到 20 萬人，1520 年爆發的天花也重創阿茲特克，新皇帝可能就死於這場疫病 [b68]。
          src:
            - b68
          stance: 補充
      think: 角色扮演：你是 1405 年的明成祖，手上有當時世界上最大的船隊。你會派它去做什麼——送禮、貿易、探索，還是征服？再比較「鄭和下西洋」和「達伽馬開闢印度航路」兩張卡：兩支船隊的目的和後果有什麼不同？
      core: true

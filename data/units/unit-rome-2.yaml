    explain: 卡片寫的是：條頓堡慘敗之後羅馬停止向萊茵河以東擴張，奧古斯都也留下遺訓；但也有學者認為主因是日耳曼尼亞不值得占領，所以這個因果有爭議。別的方向還在擴張：帝國版圖要到 117 年圖拉真時才最大，之後哈德良才停止擴張，用城牆和要塞把北方邊界固定下來。這句話是塔西佗記下的，不是奧古斯都的親筆。（想看兩個邊疆故事的對照，可以再去讀「西羅馬為什麼會亡？」單元。）
    hints:
      - 這句遺訓是誰記下來的？記的是什麼時候的事？
      - 卡片這個因果標了「有爭議」，代表學者的意見一致嗎？
      - 哈德良是在奧古斯都之前還是之後固定邊界？
    ref: event-pax-romana
    critique:
      question: 這句話是塔西佗記下的，內容是奧古斯都遺留的建議。它能證明什麼、不能證明什麼？
      options:
        - 能證明塔西佗記下這樣一份建議；不能單獨證明羅馬為什麼停止擴張
        - 能證明奧古斯都親筆寫下這句話，而且羅馬此後再也沒有擴張
        - 能證明條頓堡慘敗是羅馬停止向萊茵河以東擴張的唯一原因
        - 能證明奧古斯都之後的每一位皇帝，都照著這個建議行事
      answer: 0
      explain: 這句話是塔西佗記下的，不是奧古斯都的親筆，它只告訴我們有這樣一份建議；至於羅馬為什麼停止向萊茵河以東擴張，卡片說條頓堡慘敗與「不值得占領」兩種說法都有，沒有定論。
      why_wrong:
        - null
        - 塔西佗記下的不是親筆；而且帝國版圖要到 117 年圖拉真時才最大，可見之後還擴張過。
        - 卡片說原因有爭議，也有學者認為主因是日耳曼尼亞不值得占領。
        - 圖拉真時帝國版圖達到最大，後來的哈德良才停止擴張，不是每位皇帝都照做。
  - type: card
    id: event-pompeii-79
    depth: understand
    prompt: 龐貝不是帝國興衰的轉折，而是一扇窗：看麵包店、選舉題字、塗鴉。也注意那些「人形」是什麼，以及爆發的日期為什麼有爭議。小心：龐貝是城，龐培是人。
    focus: [C7, C10, terms]
    quick:
      - q: 龐貝那些「人形」，是遺體在一瞬間變成石頭嗎？
        a: 不是。火山灰包住遺體，遺體腐爛後留下空洞；19 世紀的考古學家把石膏灌進空洞，得到人形的模型。
      - q: 龐貝能代表整個羅馬帝國的生活嗎？
        a: 不能。它只是一座中型城鎮，人口估計從 1.1 萬到 2 萬都有；爆發日期和死亡總數都沒有定論，小普林尼的信也是約 25 年後的追述。
  - type: card
    id: social-roman-law
    depth: understand
    prompt: 同一套法律裡，一邊有「誰主張，誰舉證」，一邊把奴隸當財產。注意：一個人有什麼權利，要看他是什麼身分。
    focus: [E3, debate]
    quick:
      - q: 「誰主張，誰舉證」是羅馬人發明了「無罪推定」嗎？
        a: 不能直接這樣說。《學說彙纂》22.3.2 只是一條舉證規則：證明的責任在主張的人。現代的「無罪推定」經過中世紀教會法才成形，兩者不要直接劃等號。
      - q: 羅馬法保護每一個人的權利嗎？
        a: 不是。權利依身分而定：公民或外國人、自由人或奴隸、家父或受家父權管轄的人；奴隸被當成財產，沒有法律人格。
  - type: card
    id: event-early-christianity
    depth: understand
    prompt: 本單元只看歷史：羅馬官員怎麼對待這個團體，不討論基督徒相信的內容是否為真。注意迫害有多廣、250 年前後有什麼不同，以及塔西佗和小普林尼記下的是什麼。
    focus: [C2, debate]
    quick:
      - q: 250 年以前，羅馬迫害基督徒是全帝國一起進行的嗎？
        a: 學者多半認為不是：主要是地方性的，由總督而不是皇帝推動，結果從無罪釋放到處死都有。250 年德西烏斯下令全帝國居民獻祭，才走向全帝國的命令。
      - q: 羅馬人為什麼把基督徒當成問題？
        a: 常見原因是他們拒絕向諸神或皇帝的守護神獻祭，羅馬人認為這是對城邦與政治認同的挑釁；私下、夜間的聚會又引來吃人、亂倫等謠言。
  - type: source
    card: event-early-christianity
    idx: 1
    question: 圖拉真回覆小普林尼：「不必主動搜捕他們」，但被告發又證實的要處罰。這封信最能說明什麼？
    options:
      - 全帝國有統一的法令，各地官員都要挨家挨戶搜捕基督徒
      - 皇帝下令，從此不再處罰任何人，基督徒也不受任何限制
      - 官員不主動搜捕，被告發又證實的才處罰；這是皇帝給一位總督的答覆
      - 基督徒只因為信仰，就一律被判處死刑，沒有任何例外
    answer: 2
    why_wrong:
      - 圖拉真回信說不必主動搜捕，也不是全帝國統一的法令。
      - 回信說被告發又證實的仍要處罰，並不是從此不再處罰任何人。
      - null
      - 肯向諸神禱告的人就赦免，結果從無罪釋放到處死都有，並非一律死刑。
    explain: 小普林尼是當時在今日土耳其西北部的總督，他寫信問皇帝怎麼辦；圖拉真回信說不必主動搜捕，被告發並證實的要處罰，肯向諸神禱告的就赦免，匿名告發不受理。這是對一位總督的個別答覆，他自己也說定不出一體適用的規則。學者多半認為 250 年德西烏斯下令全帝國居民獻祭之前，迫害主要是地方性的，由總督而不是皇帝推動，結果從無罪釋放到處死都有。至於當時是依哪一條法律處罰，學者有三種解釋，沒有定論。
    hints:
      - 先看這句話的前半：官員要不要主動去找人？
      - 小普林尼是皇帝，還是向皇帝請示的總督？
      - 卡片說 250 年以前的迫害，主要是誰推動的？
    ref: event-early-christianity#C2
    critique:
      question: 這是皇帝回覆一位總督的信，而不是一道公布給全帝國的法令。它能證明什麼、不能證明什麼？
      options:
        - 能證明一位皇帝對一位總督的個別答覆；不能證明全帝國都照這樣處理
        - 能證明基督教從此在全帝國都是合法的宗教
        - 能證明羅馬官員完全不在意基督徒，沒有任何人因此被處罰
        - 能證明基督徒相信的教義是真實的，因為皇帝與總督都認真處理
      answer: 0
      explain: 圖拉真只是回答小普林尼的疑問，他自己也說定不出一體適用的規則。學者多半認為 250 年以前的迫害主要是地方性的，由總督而不是皇帝推動；塔西佗和小普林尼也只記下基督徒的名稱與官員的看法，不談教義是否真實。
      why_wrong:
        - null
        - 回信只說不必主動搜捕、被告發證實的要處罰，並沒有承認它合法。
        - 回信明說被告發又證實的要處罰，不是沒有人受罰。
        - 塔西佗和小普林尼只是羅馬官員與史家，記下的是名稱、審問的情形與官員的看法，不談教義是否真實。

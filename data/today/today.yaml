    events:
      - { date: "2023-12", text: "乾旱限航開始，每天可通過船數從 36 艘降到 22 艘。", src: [t21] }
    counterparts:
      - { id: building-dujiangyan, note: "相似：一項大型水利工程的運作完全依賴水源與降雨，氣候這種「慢變結構」決定它每年能發揮多少功能。不同：都江堰是灌溉與防洪；巴拿馬運河是用淡水抬升船隻，乾旱直接減少可通過的船數。", src: [t21] }
    non_analogous: "巴拿馬運河的限航是氣候與水資源問題，不是戰爭封鎖；也有收費制度可以調節需求。"

chains:
  - id: today-chain-gulf-oil
    name: 波斯灣石油：拉斯坦努拉 → 霍爾木茲 → 麻六甲 → 東亞
    data_as_of: 2026-10-22

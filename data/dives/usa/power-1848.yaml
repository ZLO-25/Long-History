# 領土擴張示意圖 1848 年（畫法同 power-1783.yaml）
year: 1848
basemap: us_states
title: 德克薩斯、奧勒岡、墨西哥割讓：大陸擴張幾乎完成（1848 年）
note: 1845 年 12 月 29 日德克薩斯成為一州（德州主張以格蘭德河為界，墨西哥認為是努埃塞斯河，引發美墨戰爭）；1846 年 6 月 15 日奧勒岡條約以北緯 49° 分界；1848 年 2 月 2 日瓜達盧佩—伊達爾戈條約（5 月 30 日生效），墨西哥割讓加利福尼亞與新墨西哥。德州主張的科羅拉多南部算在德州色塊裡；新墨西哥格蘭德河以東也曾是德州主張，1850 年妥協案德州讓出、聯邦承接約 1,000 萬美元債務，本圖把它畫在墨西哥割讓內。希拉河以南的一條（今亞利桑那南部、新墨西哥西南角）要到 1853–54 年加茲登購地才取得。俄克拉荷馬是「印第安領地」的核心：1830 年遷移法把東南部各族（切羅基、喬克托等）強制遷到這裡，1907 年才成為州。

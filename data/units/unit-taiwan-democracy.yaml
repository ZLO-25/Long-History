id: unit-taiwan-democracy
title: 從戒嚴到投票：臺灣的民主是怎麼來的？
histories: [臺灣史, 世界通史]
mystery: 今天的臺灣人每四年投票選總統。但第一次總統直選是 1996 年，距離 1945 年戰爭結束已經過了半個世紀。中間這五十年，發生了什麼？
teaser: 一場查緝私菸的衝突、一紙用了 38 年的戒嚴令、一本雜誌、一個「違法」成立的政黨：投票權是一步一步拆出來的。
goals:
  - 能用「戰後通膨與管制 → 二二八 → 戒嚴與白色恐怖 → 黨外與美麗島 → 解嚴 → 直選」的因果鏈說明臺灣民主化的過程
  - 能判讀二二八處理委員會的一條要求，說出他們想要什麼
  - 能比較「土地改革」與「民主化」兩種改變：一個是政府主動給的，一個是人民爭來的
  - 能說出白色恐怖受害人數、民主化功勞這兩個爭議各有哪些說法，而不是只記一種答案
  - 能指出把今天的「限制」比作戒嚴時，哪裡不成立
minutes: 35
steps:
  - type: hook
    text: |
      想像你的學校宣布「特殊狀況」：教官可以隨時搜書包、社團停止活動、校刊停刊；班長是小一那年選的，之後十幾年都不用重選。
      這個「特殊狀況」一宣布，就是 38 年。
      1949 年到 1987 年的臺灣，就是這樣：集會、辦報、組黨都受限制，國會不改選，總統由不改選的國民大會一再選出。
      為什麼會變成這樣？又是怎麼一步一步拆掉的？我們從戰爭剛結束的那幾年開始看。
  - type: card
    id: finance-taiwan-1949-currency
    depth: story
    prompt: 先看戰後的臺灣有多難過日子：注意「錢是從哪裡多出來的」，以及最後要用多少舊臺幣才能換一元新臺幣。這是二二八發生前的生活背景。
  - type: card
    id: event-228-incident
    depth: understand
    prompt: 讀「背景」時注意米糧統制和專賣局，想想為什麼一次查緝私菸會引爆全島。再看「經過」：處理委員會提出三十二條之後，陳儀怎麼回應？接著發生了什麼？
  - type: source
    card: event-228-incident
    idx: 0
    question: 處理委員會向陳儀提出的三十二條要求，第一條要的是什麼？
    options:
      - 要求陳儀立刻下台
      - 要求制定一部省自治法，作為臺灣省政治的最高規範
      - 要求撤銷專賣局
      - 要求軍隊退出臺灣
    answer: 1
    explain: 「provincial autonomy law」就是「省自治法」，「supreme norm」就是「最高規範」：處理委員會把「臺灣的事由臺灣人自己依法管」放在第一條。但讀史料要看後續：陳儀拒絕了這些要求，3 月 8 日增援部隊登陸鎮壓；事件後行政長官公署雖然改成省政府，省自治法、民選縣市長並沒有實現，1949 年反而進入戒嚴。
    hints:
      - 抓關鍵字：autonomy 是「自治」，這一條在談誰來管臺灣的事。
      - 「supreme norm for political affairs within this province」是說這部法在本省政治裡的地位。
      - 選項裡只有一個在講「訂一部法律」。
    ref: event-228-incident#C4
  - type: card
    id: event-taiwan-martial-law
    depth: deep
    prompt: 這張卡橫跨 47 年。先看戒嚴令限制了什麼、白色恐怖怎麼運作；再看黨外人士用什麼方法集結。最後讀「史家怎麼吵」：白色恐怖的受害人數為什麼有好幾種數字？民主化的功勞，兩種說法各怎麼講？
  - type: chain
    prompt: 把下列事件依照「因 → 果」排成一條鏈（最上面是最早的原因）。
    items:
      - 戰後政府沿用米糧統制、專賣局獨占菸酒，物價飛漲、失業嚴重，不滿一路累積
      - 1947 年查緝私菸引爆二二八；處理委員會的要求被拒絕，軍隊登陸鎮壓，一代本土菁英消失
      - 1949 年陳誠宣布全臺戒嚴，政府以「叛亂」「匪諜」罪名審判大量平民（白色恐怖）
      - 戒嚴下不准組新政黨，反對者只能以「黨外」身分辦雜誌、參選；1979 年美麗島事件後八人被軍法審判
      - 1986 年民進黨「違法」成立，政府起初不承認、蔣經國隨後默許，沒有取締；1987 年 7 月 15 日零時起解嚴
      - 1991 年終止動員戡亂、萬年國會退職，1996 年第一次總統直選
    explain: 通膨與管制讓不滿累積，一次小衝突引爆二二八；鎮壓之後社會噤聲，1949 年戒嚴把「非常狀態」變成長期統治。反對者在戒嚴下只能用雜誌和選舉集結，美麗島事件是衝突的高點；1986 年政府沒有抓組黨的人，隔年解嚴。但解嚴不等於馬上民主：動員戡亂 1991 年才終止，國會 1992 年才全面改選，總統 1996 年才直選。
    hints:
      - 最早的原因和「生活過不下去」有關：先找物價和米糧那一項。
      - 二二八之後，社會是變得更自由，還是更不自由？戒嚴應該排在二二八之後。
      - 民進黨成立在解嚴前一年；解嚴之後還要再等九年才直選總統。
    ref: event-taiwan-martial-law#C2
  - type: card
    id: event-taiwan-land-reform
    depth: understand
    prompt: 同樣是 1949 年陳誠當省主席時開始的另一件大事。讀「背景」時注意：政府為什麼主動想推動土地改革？
  - type: compare
    cards: [event-taiwan-land-reform, event-taiwan-martial-law]
    prompt: 比一比兩種「改變」：土地改革是政府主動給的，民主化是人民爭來的，但也沒有這麼簡單。
    rows:
      - aspect: 時間
        a: 1949 年減租、1951 年公地放領、1953 年耕者有其田，前後約五年
        b: 1949 年戒嚴到 1987 年解嚴共 38 年；1996 年才第一次總統直選
      - aspect: 誰推動
        a: 省主席陳誠主持省政府推動；美援支持的農復會提供經費與技術
        b: 黨外人士辦雜誌、參選、組黨（雷震、《美麗島》雜誌、民進黨）；1986 年蔣經國默許民進黨成立、1987 年宣告解嚴；1991 年李登輝終止動員戡亂
      - aspect: 政府為什麼做
        a: 穩定農村、爭取農民支持；廖彥豪與瞿宛文認為還有孫中山「平均地權」的理念、國共競爭下爭取農民，以及美國的壓力與協助
        b: 有爭議：一種說法強調蔣經國晚年主動放手；另一種強調黨外運動由下而上一步步逼政府讓步，國際壓力也讓判決較輕
      - aspect: 誰付出代價
        a: 中小地主拿到的債券與股票縮水、多半賤賣；農民同時被「肥料換穀」以不利比率換走稻穀
        b: 被處決、監禁、失蹤的政治受難者及其家屬，人數估計從約 1.2 萬到 14 萬，依定義不同
      - aspect: 結果
        a: 1953 年底完成徵收放領，近 19.5 萬戶佃農成為自耕農；自耕農比例各來源估計不一（一項統計是純自耕農戶從 1952 年的 38% 升到 1953 年的 55%，也有文獻說含半自耕農八成以上）；部分地主家族轉向工商業
        b: 解嚴、開放黨禁與報禁、國會全面改選、總統直選；所有公民取得組黨、選舉與言論自由
    question: 同樣在 1949 年開始，為什麼土地改革約五年就完成，民主化卻要將近五十年？請至少說出一個原因。
    model_answer: 土地改革是政府自己想做的事：它能穩定農村、爭取農民支持，美國也支持，所以政府可以用一紙命令推動，付出代價的是地主。民主化要拆的卻是執政者自己的權力（戒嚴、黨禁、萬年國會），政府沒有理由主動放手；戒嚴卡的「今日對照鉤子」提醒，這種以「非常狀態」為名的體制，往往要在外部壓力、內部運動與執政者計算三者交會下，才分好幾個階段拆掉。至於最後放手的功勞是蔣經國主動、還是黨外逼出來的，史家仍有不同看法。
    hints:
      - 先看「誰推動」和「政府為什麼做」兩列：哪一個改變是政府自己想要的？
      - 想想看：土地改革動的是地主的利益，民主化動的是誰的利益？
      - 戒嚴卡的「今日對照鉤子」說，拆除緊急體制通常需要哪三件事交會？
  - type: decision
    role: 你是 1986 年 9 月的蔣經國
    situation: |
      戒嚴已經實施 37 年。9 月 28 日，黨外人士在臺北圓山大飯店宣布成立民主進步黨，依當時的法律，這是違法的。
      過去政府的做法很清楚：1960 年雷震籌組反對黨，被軍法判刑十年；1979 年美麗島事件後八人被軍法審判。
      但美麗島審判時美國曾表達關切，黨外人士靠雜誌和選舉越集結越多。你會怎麼做？
    options:
      - label: 不取締，接著宣布解嚴
        result: 這接近蔣經國當年的做法：政府起初採「不承認」政策，他隨後默許、沒有抓人，並在國民黨中常會上說「時代在變，環境在變，潮流也在變」；1987 年 7 月 14 日發布總統令，15 日零時起解嚴，但解嚴前先通過《國家安全法》維持部分限制，報禁要到 1988 年才開放。
      - label: 比照雷震案與美麗島事件，逮捕組黨的人送軍法審判
        result: 推測：黨外運動在美麗島事件後反而越集結越多，幾位辯護律師後來成了政治領袖；再抓一次是否壓得住，沒有人知道。歷史沒有走這條路，所以後果只能推測。
      - label: 不抓人，也不解嚴，維持現狀
        result: 推測：戒嚴卡提醒，沒有終止日期的緊急體制會變成長期的例行統治；黨外與國際壓力會不會持續升高，只能推測。歷史沒有走這條路，所以後果只能推測。
    actual: 蔣經國默許民進黨成立、沒有取締，1987 年 7 月 15 日零時起解嚴，戒嚴共 38 年。之後的幾步由李登輝完成：1991 年終止動員戡亂、廢止臨時條款，1991 年底萬年國會退職，1996 年第一次總統直選。對蔣經國的評價（威權統治者還是民主推手），至今仍是社會爭論的焦點。
    ref: event-taiwan-martial-law#C2
    note: 「沒有發生的選項」的後果都是推測，標示清楚。
  - type: today
    card: event-taiwan-martial-law
    question: 今天偶爾會聽到有人說「這根本跟戒嚴一樣」。拿戒嚴來比喻今天的某種限制，哪裡不成立？
    model_answer: 1949 年的臺灣面對的是剛打輸的內戰與真實的軍事威脅，而且當時全世界多數國家也還不是民主國家；戒嚴下軍事法庭可以審判平民、新政黨不准成立、國會不改選。今天的臺灣有憲法保障的基本權利、獨立司法與自由媒體，不能把任何一種「限制」直接比作戒嚴，也不能把當年的政治案件和今天的司法案件混為一談。這段歷史可以借來思考的是結構：以「非常狀態」為名建立的緊急體制，如果沒有終止日期，就會變成長期的例行統治；而拆除它往往要分好幾個階段。
  - type: check
    items:
      - kind: choice
        q: 1987 年已經解嚴，為什麼總統要到 1996 年才第一次直選？
        options:
          - 解嚴令規定九年後才能選總統
          - 解嚴只是第一步：動員戡亂 1991 年才終止，萬年國會 1991 年底才退職、1992 年才全面改選，制度是一條一條拆掉的
          - 因為沒有人想出來選總統
          - 因為二二八事件還沒有平反
        answer: 1
        explain: 解嚴不等於馬上民主。解嚴前先通過《國家安全法》延續許多限制；1991 年終止動員戡亂、廢止臨時條款，資深民代年底退職，1992 年立法院全面改選，1996 年才總統直選。
        hints:
          - 回想 hook 裡「班長是小一選的」那個比喻：國會什麼時候才重選？
          - 看戒嚴卡「常見誤解」的第一條。
        ref: event-taiwan-martial-law#C4
      - kind: order
        q: 依時間先後排列：
        items:
          - 二二八事件
          - 陳誠宣布全臺戒嚴
          - 雷震因籌組反對黨被軍法判刑
          - 美麗島事件
          - 解嚴
          - 第一次總統直選
        explain: 1947 二二八 → 1949 戒嚴 → 1960 雷震案 → 1979 美麗島事件 → 1987 解嚴 → 1996 總統直選。
        hints:
          - 二二八在戒嚴之前；戒嚴令是 1949 年陳誠發布的。
          - 雷震案在 1960 年，美麗島事件在 1979 年。
          - 解嚴之後還要九年才直選。
        ref: event-taiwan-martial-law#C2
      - kind: short
        q: 白色恐怖的受害人數，為什麼會從「約 1.2 萬」到「約 14 萬」差這麼多？用一兩句話說明。
        model: 因為算法和定義不同：促轉會的資料庫整理出 13,683 筆受裁判紀錄（約 13,270 人）、1,153 筆死刑判決，但蘇彥斌指出未經審判就被殺害或失蹤的人不在裡面；行政院 2007 年引法務部統計，則說軍事法庭受理政治案件 29,407 件、受難者約 14 萬人；國家人權博物館的受難者名錄到 2025 年是 12,060 人。哪個數字「對」，取決於怎麼定義受害。
        explain: 這類數字沒有單一正解，要並列各種說法、說清楚每個數字算的是什麼。二二八的死亡人數也一樣：行政院 1992 年研究報告的研究小組用人口統計推估約 18,000–28,000 人，但這個數字只放在附錄、沒有納入正式報告，總主筆本人認為應以千計；其他說法從一千多人到十幾萬都有。
        hints:
          - 回去看戒嚴卡「史家怎麼吵」的第一段。
          - 「受裁判紀錄」和「受難者約 14 萬人」算的是同一群人嗎？未經審判就被殺害或失蹤的人，算在哪一個數字裡？
        ref: event-taiwan-martial-law#C5
  - type: recap
    model_answer: |
      因為戰後臺灣先是通膨、缺糧、管制引爆了二二八，鎮壓之後社會噤聲；1949 年內戰失利的政府把臺灣當成反攻基地，用戒嚴加上動員戡亂臨時條款建立一整套「非常體制」：軍法審判平民、不准組黨、國會不改選，這套體制一用就是 38 年。
      拆掉它不是一天的事：反對者在戒嚴下只能以黨外身分辦雜誌、參選，1979 年美麗島事件是衝突的高點；1986 年民進黨成立政府沒有取締，1987 年解嚴，1991 年終止動員戡亂、萬年國會退職，1992 年國會全面改選，1996 年才第一次總統直選。
      最後提醒兩個至今仍有爭議的地方：白色恐怖的受害人數，估計從約 1.2 萬到 14 萬人，差別在怎麼定義受害；民主化的功勞，一種說法強調蔣經國主動放手，另一種強調黨外運動由下而上逼出來、加上國際壓力。這些說法要並列著看，不要只記一種。

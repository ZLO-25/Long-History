# 總結任務：專題的所有課都走完之後出現（points 來自五課的 goals 與 mystery）
capstone:
  question: 應仁之亂時，將軍還坐在京都，卻沒人聽他的；一百多年後，德川幕府連大名和海上往來都管得很嚴。請用這個專題的五課，寫一段話說明：日本是怎麼從「中央還在卻沒人聽」，走到「什麼都要管」？至少寫到亂世怎麼來、鐵砲與統一者做了什麼、太平由誰付出代價。
  min: 80
  points:
    - 應仁之亂沒有贏家：將軍家的繼承糾紛演變成內戰，中央還在、卻沒人聽，各地大名自立、互相消耗
    - 從鐵砲傳入、桶狹間、樂市到長篠、本能寺，信長在不到四十年間崛起；秀吉統一後做檢地、刀狩、身分統制令，兩年後就把大軍送去朝鮮
    - 壬辰戰爭在朝鮮、日本、中國有三種說法，要從不同角度看同一場戰爭
    - 德川家康關原（1600）之後花十五年滅豐臣家，再用武家諸法度與出海、來日的限制管住大名和海；太平的代價由豐臣家、浪人、天主教徒等人付出
  model_answer: 應仁之亂是將軍家的繼承糾紛，打成沒有贏家的內戰，將軍雖然還在，各地大名卻自立、互相消耗。後來鐵砲傳入，信長從桶狹間、樂市一路走到長篠與本能寺；秀吉統一日本後做檢地、刀狩與身分統制令，卻在兩年後把大軍送去朝鮮，這場壬辰戰爭在朝鮮、日本、中國有不同的名字與說法。家康在 1600 年關原之後花十五年才滅掉豐臣家，接著用武家諸法度管大名、限制出海與來日。這份太平不是白來的，代價由豐臣家、浪人與天主教徒等人付出。

power_ui:
  title: 歐洲勢力圖
  subtitle: 革命前和拿破崙最強時的歐洲
  caveat: 以今日歐洲各國國界近似當時的國家，一國跨兩個勢力時，用一條經線或緯線切開，所以邊界只是示意，不是當時確切的界線。今日德國、義大利、波蘭一帶當時分成好幾個國家，切線特別粗略；海外殖民地（例如海地）不在圖內。

# 主題標籤詞表（topics）
#
# 和「結構標籤」（docs/structure-tags.md）的分工：
#   結構標籤＝「發生了什麼樣的模式」，例如 債務擴張、臨界點，用來做跨時代的結構對照。
#   主題標籤＝「跟什麼東西有關」，例如 交易所、紙幣、運河，用來把同一件事物的歷史串成一條路徑。
#
# 卡片在 frontmatter 寫 `topics: [交易所, 股票與公司]`，只能用本檔列出的名稱（npm run validate 會檢查）。
# 每個主題至少要有 2 張卡才算一條「路徑」；只有 1 張卡時 validate 會警告。
#
# 欄位：
#   name   標籤名稱（畫面上顯示成「#交易所」）
#   plain  一句白話定義，國中生看得懂
#   path   這條路徑怎麼讀：2–3 句，點出起點、轉折和今天，只寫各卡內文查得到的事
#   see    （選填）相近的主題，畫面會列成「也看看」
layers:
  - name: 錢與金融
    icon: 💰
    topics:
      - name: 鑄幣
        plain: 用金、銀、銅等金屬做成、刻上記號的錢，重量和成色由發行者保證。
        path: 從呂底亞最早的鑄幣、雅典用勞里昂的銀打造銀幣，到秦漢的半兩與五銖、拜占庭的金幣索利都斯，可以看到「誰鑄幣、成色穩不穩」一直和國家信用綁在一起。羅馬第納里烏斯含銀量下降、王莽一再改幣，則是錢失去信任的例子。
        see: [紙幣, 通貨膨脹, 國際貨幣]
      - name: 紙幣
        plain: 用紙印成的錢，本身不值錢，價值來自發行者的信用。
        path: 北宋的交子是很早的紙幣，明朝的大明寶鈔因為濫發而崩壞。17、18 世紀英格蘭銀行的銀行券、約翰·羅在法國的紙幣，到美國獨立戰爭與南北戰爭時印的紙幣，再到 20 世紀威瑪德國、金圓券和戰後臺灣的惡性通膨，都在考驗同一個問題：大家還相不相信這張紙。
        see: [鑄幣, 通貨膨脹, 中央銀行]
      - name: 銀行與借貸
        plain: 收存款、放款、幫人付款的機構，以及借錢、還錢的各種做法。
        path: 美索不達米亞的神廟已有借貸紀錄，雅典與羅馬有坐在桌邊兌錢、放款的銀行家。中世紀的梅迪奇銀行、熱那亞的聖喬治銀行、阿姆斯特丹匯兌銀行，到清代的山西票號，各自發展出存款與匯款的方法；近代的英格蘭銀行、美國第一銀行、聯準會，以及大蕭條、十信案和 2008 年的銀行危機，則讓人看到銀行出事時整個社會都會受影響。
        see: [匯票與遠距付款, 中央銀行, 泡沫與金融危機]
      - name: 匯票與遠距付款
        plain: 不必搬運現金，用一張文件就能在遠方付款或收款。
        path: 阿拔斯時代的巴格達已有支票（sakk）與匯兌（hawala），中世紀香檳市集與梅迪奇銀行用匯票在各城之間結算。布魯日、安特衛普、熱那亞人的市集和阿姆斯特丹匯兌銀行讓這套方法更成熟，清代山西票號在中國做的也是匯兌生意；19 世紀國際貿易多用倫敦的匯票付款，一戰後紐約開始分走這個角色。
        see: [銀行與借貸, 交易所, 金融中心]
      - name: 交易所
        plain: 商人或投資人固定聚在一起買賣商品、匯票或股票的地方。
        path: 布魯日的商人常在范德布爾斯（Van der Beurze）家族的房子前聚會，「Bourse」這個字就從這裡來；安特衛普在 1531 年蓋了專門的交易所，阿姆斯特丹交易所開始大量買賣東印度公司的股票。之後有紐約證券交易所、1929 年的股災、倫敦交易所 1986 年的「大爆炸」改革，以及臺灣證券交易所和 1980 年代末的臺股狂潮。
        see: [股票與公司, 金融中心, 泡沫與金融危機]
      - name: 股票與公司
        plain: 很多人一起出錢成立公司，股票就是「擁有公司一小部分」的憑證，可以買賣。
        path: 荷蘭東印度公司把股份賣給一般人，股票在阿姆斯特丹交易所轉手，它也是統治大員（臺灣）的公司。1720 年密西西比與南海公司的股價暴起暴落，紐約、臺灣的證券交易所後來成為買賣股票的中心。臺灣土地改革時，政府用四大公營公司的股票補償地主，也是這條路徑上的一站。
        see: [交易所, 泡沫與金融危機, 東印度公司]
      - name: 國債與公債
        plain: 政府向人民或銀行家借錢，承諾以後還本付息；國債就是政府欠的債。
        path: 威尼斯向市民強制借款、熱那亞的聖喬治銀行替城邦管理債務，16 世紀的哈布斯堡君主在安特衛普、向熱那亞銀行家大量借錢，也一再暫停還款。英格蘭銀行把國債變成長期、可買賣的債券，南海與密西西比公司試圖用股票接手國債；漢彌爾頓替新生的美國整理債務，拿破崙戰爭、一戰的軍費和歐債危機，都是這條路徑後來的故事。
        see: [銀行與借貸, 中央銀行, 稅收]
      - name: 泡沫與金融危機
        plain: 價格被炒到遠超過實際價值、最後崩跌，或銀行、市場突然失靈的事件。
        path: 從 1630 年代的鬱金香狂熱、1720 年的密西西比與南海泡沫，到 1907 年大恐慌與 1929 年股災、1980 年代末日本與臺灣的股市房市泡沫，再到 1985 年十信擠兌、1997 年亞洲金融風暴、2008 年全球金融危機與歐債危機，可以比較每次「大家為什麼都相信會一直漲」，以及事後各國做了哪些補救。
        see: [交易所, 銀行與借貸, 中央銀行]
      - name: 通貨膨脹
        plain: 物價普遍、持續上漲，同樣的錢能買的東西變少。
        path: 羅馬銀幣的含銀量越來越低、明朝寶鈔越印越多，獨立戰爭與南北戰爭時印出的紙幣也不斷貶值。20 世紀的威瑪德國、中國的金圓券、戰後臺灣從舊臺幣四萬換一元，都是極端的惡性通膨；物價飛漲也是二二八事件前的社會背景之一。1970 年代石油危機後的通膨，則和石油美元體系有關。
        see: [紙幣, 鑄幣, 中央銀行]
      - name: 中央銀行
        plain: 替國家發行貨幣、管理利率、在危機時當「最後的借款人」的銀行。
        path: 英格蘭銀行原本是借錢給政府的私人銀行，後來才慢慢變成中央銀行；美國第一銀行在漢彌爾頓的計畫中出現，1907 年大恐慌之後美國成立聯準會。大蕭條和 2008 年危機時中央銀行怎麼做，歐元區由歐洲央行統一管理貨幣，戰後臺灣幣制改革由臺灣銀行發行新臺幣，都可以放在一起比較。
        see: [銀行與借貸, 紙幣, 國際貨幣]
      - name: 國際貨幣
        plain: 很多國家都願意收、拿來做國際貿易和存成準備的貨幣，以及各國貨幣之間的兌換規則。
        path: 拜占庭金幣曾在地中海世界通行七百年；19 世紀的金本位讓英鎊成為國際貿易的主角，一戰後紐約與美元開始取而代之。二戰後的布列敦森林體系、歐洲美元市場、石油美元、廣場協議、亞洲金融風暴和歐元誕生，都在改變「世界用哪一種錢」。
        see: [中央銀行, 金融中心, 白銀]
      - name: 金融中心
        plain: 很多銀行、交易所、商人聚集，資金在此借貸與流動的城市。
        path: 阿拔斯時代的巴格達、中世紀的威尼斯與布魯日，接著是 16 世紀的安特衛普與熱那亞銀行家；安特衛普陷落後重心北移到阿姆斯特丹，拿破崙戰爭前後倫敦取而代之，一戰後紐約崛起，1980 年代倫敦金融城改革、東京在泡沫時期也曾風光。可以一路追問：為什麼錢會從一座城市搬到另一座城市？
        see: [交易所, 匯票與遠距付款, 國際貨幣]
  - name: 貿易與物產
    icon: 🚢
    topics:
      - name: 白銀
        plain: 銀是很多時代的「錢」，也是長途貿易中最常被運送的貴重金屬。
        path: 古希臘雅典靠勞里昂銀礦打造艦隊與銀幣；16 世紀以後，日本石見銀山和美洲的白銀，透過馬尼拉大帆船、葡萄牙與中國海商流入明朝。大明寶鈔失去信用後，一條鞭法讓賦稅改用白銀繳納，熱那亞銀行家也靠西班牙的美洲白銀做生意；到了 19 世紀，白銀流出中國成為鴉片戰爭的背景之一。
        see: [鑄幣, 絲綢與絲路, 國際貨幣]
      - name: 絲綢與絲路
        plain: 中國生產的絲綢，以及連接中國與西方、運送絲綢等貨物的商路。
        path: 漢代的絲綢遠銷西方，張騫出使西域讓漢朝更認識中亞各國。到了 16、17 世紀，絲綢換白銀成為大生意：日本與美洲的白銀流進中國，馬尼拉大帆船把中國絲綢運到美洲，荷蘭人在大員（臺灣）轉運中國生絲到日本。
        see: [白銀, 海上貿易, 香料貿易]
      - name: 香料貿易
        plain: 胡椒、丁香、肉豆蔻等亞洲香料的買賣，曾是最賺錢的長途生意之一。
        path: 阿拔斯時代的商人在印度洋與地中海之間轉運香料，威尼斯在里亞托把香料賣到歐洲各地。達伽馬開闢繞過非洲的印度航路後，葡萄牙香料轉到安特衛普出售；荷蘭東印度公司為了香料募集股本，阿姆斯特丹交易所隨之興起。
        see: [東印度公司, 海上貿易, 航海]
      - name: 東印度公司
        plain: 歐洲國家特許成立、專做亞洲貿易的大公司，常常也擁有軍隊、可以統治殖民地。
        path: 荷蘭東印度公司在 1602 年成立，它的股票在阿姆斯特丹交易所買賣，也在 1624 年起統治大員（臺灣），西拉雅人的生活因而改變。鄭成功在 1662 年逐走荷蘭人，荷蘭的金融地位在 18 世紀後期衰落；英國東印度公司則捲入了 19 世紀的鴉片戰爭。
        see: [股票與公司, 殖民統治, 香料貿易]
      - name: 海上貿易
        plain: 用船隻在海上長途運送貨物買賣，以及支撐它的港口、借貸與保險。
        path: 古代地中海用雙耳瓶運葡萄酒與橄欖油，埃及的穀物每年運往羅馬，雅典的銀行家為遠航的船借錢。黑死病也沿著熱那亞人的貿易航線傳進歐洲。中世紀威尼斯、江戶日本在出島的對外貿易、16 世紀以後的馬尼拉大帆船和荷蘭人在大員的轉口貿易，再到開港後臺灣的茶、糖、樟腦，最後是 20 世紀讓運費大降的貨櫃運輸。
        see: [航海, 開港與鎖國, 香料貿易]
      - name: 糧食與農業
        plain: 種田、灌溉、運糧與分配糧食，是每個國家能不能撐下去的基礎。
        path: 秦國的商鞅變法鼓勵耕戰，都江堰讓成都平原成為糧倉，羅馬依賴埃及的穀物，隋唐大運河把南方的糧食運到北方。清代臺灣的移墾社會開田築圳，戰後的土地改革則改變了誰擁有農地。
        see: [土地制度, 運河與水利, 移民與移墾]
      - name: 國家專賣
        plain: 政府自己經營或壟斷某種商品（例如鹽、鐵、菸酒、樟腦），把利潤收歸國庫。
        path: 春秋時齊國的管仲已靠鹽鐵等資源增加國家收入；漢武帝實施鹽鐵官營，鹽鐵會議上官員和儒生為此激辯，王莽也擴大國家經營的範圍。清末臺灣的樟腦專賣、戰後專賣局查緝私菸引爆的二二八事件，讓這條路徑一路延伸到臺灣。
        see: [稅收, 變法與改革]
      - name: 開港與鎖國
        plain: 一個國家決定要不要、在哪些港口和外國人做生意。
        path: 江戶幕府限制對外往來兩百多年，只在長崎出島等少數地方和荷蘭、中國商人做生意，朝鮮後期也被稱為「隱士之國」；鴉片戰爭後清朝被迫五口通商，培理的黑船讓日本開國，臺灣在 1860 年代開港後接上世界市場。1978 年起中國的改革開放，則是主動重新對外開放的例子。
        see: [關稅與貿易戰, 海上貿易]
      - name: 關稅與貿易戰
        plain: 國家對進出口貨物收稅，或用關稅、制裁當作和他國角力的工具。
        path: 鴉片戰爭後的條約讓清朝失去自訂關稅的權力；漢彌爾頓用關稅支撐美國財政，大蕭條時各國提高關稅讓貿易更萎縮。臺灣的加工出口區用免稅吸引外資，1985 年廣場協議處理美日貿易失衡，2018 年起的美中貿易戰與科技戰則是今天的版本。
        see: [開港與鎖國, 出口區與科學園區]
      - name: 臺灣出口品
        plain: 不同時代臺灣賣給世界的主要商品。
        path: 荷蘭時代的鹿皮與糖，西拉雅人捕鹿的生活因而改變；1860 年代開港後的茶、糖、樟腦；1966 年高雄加工出口區讓電子、成衣等加工品大量出口；今天則是半導體晶片。可以問：每個時代是誰在賺錢，又是誰付出代價？
        see: [出口區與科學園區, 海上貿易]
      - name: 出口區與科學園區
        plain: 政府劃出一塊區域，用減稅、簡化手續吸引工廠或高科技公司進駐。
        path: 1966 年高雄設立加工出口區，1980 年新竹科學園區成立，台積電在 1987 年於園區內誕生，臺灣的半導體產業由此壯大。中國在改革開放時也設立了深圳等經濟特區。
        see: [半導體與網路, 臺灣出口品, 工業化]
  - name: 政治與制度
    icon: 🏛
    topics:
      - name: 變法與改革
        plain: 統治者或政府主動改變制度，想讓國家更強或解決危機。
        path: 中國這條線最長：管仲、商鞅、王莽、北魏孝文帝、王安石、張居正的一條鞭法、清末的自強運動，一直到改革開放；古希臘有克里斯提尼改革，日本有明治維新，臺灣有戰後土地改革。可以比較：誰主導改革、誰得利、誰反對，結果成功還是失敗。
        see: [統一與中央集權, 稅收, 土地制度]
      - name: 統一與中央集權
        plain: 把分裂的地方合成一個國家，並讓權力集中到中央政府。
        path: 商鞅變法推行縣制，秦統一六國後推行郡縣，漢朝大致承襲秦的制度；日本由豐臣秀吉結束戰國時代，明治維新又建立中央集權的近代政府。
        see: [諸侯爭霸, 變法與改革]
      - name: 民主與參政
        plain: 讓更多人有權參與決定公共事務，例如投票、選代表、參加議會。
        path: 雅典的克里斯提尼改革讓公民參與政治，蘇格拉底卻在民主雅典被判死刑。大憲章限制國王權力，北美殖民地有自己的議會，美國憲法建立選舉代表的共和制度，法國大革命的《人權宣言》主張人生而自由平等；日治時期臺灣人請願設立議會，戰後從戒嚴走到 1996 年總統直選。
        see: [法律與憲法, 啟蒙與人權, 革命]
      - name: 公民身分
        plain: 誰算是這個國家的「公民」，可以享有哪些權利、要負哪些義務。
        path: 雅典的克里斯提尼改革以居住地重新編組公民，羅馬的卡拉卡拉敕令在 212 年把公民權擴大到帝國內幾乎所有自由人；北美殖民地由有投票資格的少數居民選出議會，美國憲法則用「五分之三」條款妥協奴隸問題。可以追問：每個時代被排除在公民之外的是誰？
        see: [民主與參政, 奴隸制]
      - name: 法律與憲法
        plain: 把規則寫下來公布，並規定政府的權力從哪裡來、到哪裡為止。
        path: 《漢摩拉比法典》和羅馬的《十二銅表法》把規則刻下來給人看，商鞅以嚴法治國；1215 年大憲章限制英王，《獨立宣言》、美國憲法、法國的《人權宣言》與明治憲法，則各自回答「政府的權力從哪裡來」。
        see: [民主與參政, 啟蒙與人權]
      - name: 稅收
        plain: 政府向人民收錢或收實物，用來養軍隊、蓋工程、維持政府運作。
        path: 商鞅改變賦稅與戶籍，王安石變法、一條鞭法都在改革怎麼收稅；卡拉卡拉擴大公民權，可能也和增加稅收有關。英國的大憲章、北美殖民地「無代表不納稅」、法國大革命前的財政危機，都顯示收稅會引發政治衝突；漢彌爾頓則用關稅與國產稅撐起美國財政。
        see: [國債與公債, 國家專賣, 變法與改革]
      - name: 殖民統治
        plain: 一個國家到別的地方建立據點或統治當地人，主要為了資源、貿易或戰略。
        path: 17 世紀荷蘭在大員、西班牙在北臺灣建立據點，西拉雅等原住民的生活被改變；英國人在北美建立十三殖民地。1895 年臺灣割讓給日本後，有文化協會的議會請願、霧社事件，以及皇民化運動；美國也在美西戰爭後取得菲律賓等海外領土。
        see: [原住民族, 東印度公司, 對外擴張]
      - name: 革命
        plain: 在短時間內推翻舊政府或舊制度，建立新的政權。
        path: 美國獨立戰爭與《獨立宣言》、法國大革命，在 18 世紀末提出新的政治理念；1911 年辛亥革命結束中國兩千多年的帝制；1989 年東歐各國的革命與 1991 年蘇聯解體，結束了冷戰。
        see: [民主與參政, 公民身分, 民變與抗爭, 啟蒙與人權]
      - name: 民變與抗爭
        plain: 一般百姓、地方勢力或被統治者起來反抗政府，以及政府的鎮壓。
        path: 陳勝吳廣在大澤鄉起事、東漢末年的黃巾之亂，都動搖了當時的王朝。清代臺灣有「三年一小反、五年一大亂」之說，1895 年有乙未抗日，1930 年有霧社事件；1947 年的二二八事件則由查緝私菸的衝突擴大為全島抗爭，隨後遭到軍事鎮壓與清鄉。
        see: [革命, 帝國的衰亡]
      - name: 帝國的衰亡
        plain: 一個大帝國或王朝走向分裂、被取代或解體的過程。
        path: 西周在平王東遷後王室權威衰落，秦朝在陳勝吳廣起事後很快崩潰；西羅馬在 5 世紀滅亡，唐朝在安史之亂後由盛轉衰，北宋在靖康之變中滅亡；辛亥革命結束了清朝，蘇聯在 1991 年解體。史家常爭論：衰亡的原因是外來壓力還是內部問題？
        see: [民變與抗爭, 游牧民族與邊疆]
      - name: 諸侯爭霸
        plain: 中央的王室衰弱時，各地諸侯互相競爭、結盟和打仗，爭當霸主。
        path: 平王東遷後周王室衰弱，齊國的管仲輔佐齊桓公稱霸，晉楚在城濮決戰；三家分晉開啟戰國時代，商鞅變法讓秦國變強，長平之戰後秦國一路走向統一。
        see: [統一與中央集權, 軍事同盟]
      - name: 冷戰
        plain: 二戰後美國與蘇聯兩大陣營長期對抗，雙方沒有直接開戰，卻在各地競爭。
        path: 杜魯門主義、圍堵政策、北約與馬歇爾計畫在 1947 到 1949 年間成形；韓戰與越戰是冷戰中的熱戰，網際網路的前身阿帕網也誕生在這個時代。1970 年代尼克森訪華讓美中接近，1989 到 1991 年冷戰結束、蘇聯解體，「美國世紀」的說法也和這段歷史有關。
        see: [軍事同盟, 世界大戰]
      - name: 言論與思想管制
        plain: 政府限制人民能說什麼、讀什麼、相信什麼。
        path: 蘇格拉底在雅典以「不敬神、敗壞青年」被判死，秦朝焚書，漢武帝獨尊儒術讓一種思想成為官方正統；日治時期的皇民化運動、戰後長達 38 年的戒嚴，則是臺灣自己的經驗。
        see: [儒家, 宗教, 民主與參政]
  - name: 戰爭與軍事
    icon: ⚔
    topics:
      - name: 海戰與水戰
        plain: 在海上或江河上用船隊作戰。
        path: 薩拉米斯海戰中希臘擊退波斯，雅典的海軍是伯羅奔尼撒戰爭的關鍵，亞克興海戰決定了羅馬的主人；赤壁之戰在長江上打。壬辰戰爭中朝鮮的龜船出名，鄭成功率船隊攻打大員；鴉片戰爭、美西戰爭與二戰的太平洋戰場，則顯示近代艦隊的威力。
        see: [航海, 火藥與武器]
      - name: 游牧民族與邊疆
        plain: 農耕帝國和北方或西域邊境各族（游牧、部落、綠洲城邦）之間的戰爭、貿易與防線。
        path: 秦漢修長城和直道、漢武帝打匈奴，張騫出使西域，漢朝後來遠征大宛取得良馬，鹽鐵會議也在爭論對匈奴的政策；羅馬在條頓堡森林慘敗後不再往萊茵河以東擴張，後來又在不列顛修了哈德良長城，最後西羅馬在各族移入與戰爭中滅亡。淝水之戰、鮮卑人的北魏孝文帝改革、女真人滅北宋的靖康之變，則是中國這一側的後續故事。
        see: [對外擴張, 帝國的衰亡]
      - name: 對外擴張
        plain: 一個國家向外征服或擴大勢力範圍。
        path: 亞歷山大東征打到印度河，羅馬在第二次布匿戰爭後稱霸地中海西部，漢朝對匈奴的戰爭讓勢力深入西北；豐臣秀吉統一日本後出兵朝鮮，1874 年日本又出兵臺灣（牡丹社事件）。美國從路易斯安那購地、西進擴張、門羅主義，到美西戰爭取得海外領土，一路成為大國。
        see: [游牧民族與邊疆, 殖民統治]
      - name: 內戰
        plain: 同一個國家或政權內部的不同勢力互相打仗。
        path: 楚漢相爭決定由誰接替秦朝，凱撒渡過盧比孔河、亞克興海戰是羅馬共和末年的內戰；美國南北戰爭決定了奴隸制的存廢。1940 年代末的國共內戰是金圓券崩潰、臺灣幣制改革的背景，韓戰也有學者認為帶有內戰性質。
        see: [革命, 帝國的衰亡]
      - name: 火藥與武器
        plain: 武器的發明與改良，以及它們如何改變戰爭。
        path: 中國發明的火藥後來改變了世界的戰爭。壬辰戰爭中日軍大量使用火繩槍，朝鮮水軍則靠火砲與龜船；鴉片戰爭中英國艦隊的優勢，促使清朝在自強運動中造船造砲；一戰的機槍、大砲與壕溝，讓戰爭變成大規模消耗戰。
        see: [海戰與水戰, 工業化]
      - name: 軍事同盟
        plain: 國家或城邦約定一起作戰、互相防衛。
        path: 希臘城邦聯合對抗波斯，戰後雅典的提洛同盟與斯巴達的伯羅奔尼撒同盟對立；城濮之戰兩邊也各有盟國。兩次世界大戰是兩大同盟集團的對決，二戰後美國組成北約對抗蘇聯，韓戰由聯合國軍參戰，九一一事件後北約第一次援引集體防衛條款。
        see: [冷戰, 世界大戰, 諸侯爭霸]
      - name: 世界大戰
        plain: 20 世紀兩次把世界主要國家都捲進來的大戰（1914–1918、1939–1945）。
        path: 一戰讓美國從欠錢的國家變成各國的債主，紐約開始取代倫敦，戰敗的德國在戰後陷入惡性通膨。1937 年起的中日戰爭後來併入二戰，臺灣在皇民化運動下被動員；二戰後美國主導建立布列敦森林體系與馬歇爾計畫，開啟所謂的「美國世紀」。
        see: [軍事同盟, 冷戰, 國際貨幣]
  - name: 技術與工程
    icon: ⚙
    topics:
      - name: 道路與鐵路
        plain: 修路、鋪鐵軌，讓軍隊、貨物和人能更快移動。
        path: 羅馬的亞壁古道與秦直道，都是為了調動軍隊而修。19 世紀鐵路出現後，美國的鍍金時代工業化也靠鐵路，清末劉銘傳在臺灣修了鐵路；20 世紀汽車普及，十大建設蓋了中山高速公路並把鐵路電氣化。
        see: [運河與水利, 工業化]
      - name: 運河與水利
        plain: 挖運河、築堤壩、引水灌溉，用工程來控制水。
        path: 秦國的都江堰引水灌溉成都平原，靈渠接通長江與珠江水系，隋唐大運河把南北連起來；羅馬用水道把遠方的水送進城市。清代臺灣的移民也開圳引水，把荒地變成稻田。
        see: [糧食與農業, 道路與鐵路, 古代建築]
      - name: 航海
        plain: 在海上辨認方向、遠航的技術，以及開出新航線的探險。
        path: 宋代把指南針用在航海，明初鄭和七下西洋，達伽馬繞過非洲抵達印度，馬尼拉大帆船橫越太平洋。19 世紀培理的蒸汽船來到日本，20 世紀的貨櫃運輸讓全球運費大幅下降。
        see: [海上貿易, 海戰與水戰]
      - name: 印刷與通訊
        plain: 把文字、消息傳給很多人的技術：紙、印刷、電報、網路。
        path: 東漢改良造紙術，宋代有雕版與活字印刷，古騰堡印刷機讓宗教改革的小冊子快速流傳。19 世紀的電報讓消息幾分鐘就能傳到遠方，日治時期臺灣文化協會用報紙與演講啟蒙民眾，20 世紀末網際網路改變了一切。
        see: [宗教, 言論與思想管制]
      - name: 工業化
        plain: 用機器和工廠大量生產，經濟從農業為主轉向工業為主。
        path: 18 世紀英國的蒸汽機帶動工業革命，接著有鐵路、電力和內燃機；美國在鍍金時代成為工業大國。清朝的自強運動與日本的明治維新都想學西方建工廠，臺灣在 1960、70 年代靠加工出口區和十大建設走上工業化。
        see: [能源, 道路與鐵路, 出口區與科學園區]
      - name: 能源
        plain: 推動機器、照亮城市的動力來源，例如煤、石油、電。
        path: 蒸汽機燒煤，電網讓城市夜晚亮起來，內燃機讓石油成為最重要的燃料。1970 年代的石油危機帶出石油美元體系，十大建設也包括核能電廠。
        see: [工業化, 國際貨幣]
      - name: 半導體與網路
        plain: 晶片和電腦網路，是今天資訊社會的基礎。
        path: 網際網路從 1969 年的阿帕網發展而來；臺灣在 1970 年代引進積體電路技術，新竹科學園區與台積電讓臺灣成為晶片重鎮。今天的美中科技戰，爭的正是晶片與先進技術。
        see: [出口區與科學園區, 印刷與通訊]
      - name: 古代建築
        plain: 古代留下的大型建築與它們用的材料、技術。
        path: 雅典衛城與酒神劇場是希臘城邦的公共空間，羅馬的水道、競技場和萬神殿，靠的是羅馬混凝土與拱的技術，羅馬廣場則是城市的政治中心。秦漢長城、漢長安城、秦始皇陵兵馬俑與北魏的雲岡石窟，則是中國這一側的大工程。
        see: [運河與水利, 首都與都城, 宗教]
  - name: 社會與文化
    icon: 🧭
    topics:
      - name: 儒家
        plain: 孔子開創的思想，重視倫理、禮和教育，後來成為中國與東亞很多王朝的官方思想。
        path: 孔子在春秋時代授徒講學，學說靠弟子記錄流傳，秦朝焚書坑儒，漢武帝獨尊儒術讓儒家成為官學，鹽鐵會議上儒生與官員辯論經濟政策，王莽也以儒家經典為改制的依據。朝鮮王朝以儒學治國，清末自強運動則想「保留儒家倫理、學習西方技術」。
        see: [科舉與教育, 言論與思想管制]
      - name: 宗教
        plain: 人們對神明、信仰的崇拜，以及宗教組織對政治和社會的影響。
        path: 雅典衛城祭祀雅典娜，酒神劇場起源於祭神活動，萬神殿後來改成教堂；東漢的黃巾之亂和道教團體有關，北魏開鑿雲岡石窟供奉佛像。查理曼由教宗加冕，十字軍以宗教為號召，宗教改革讓歐洲基督教分裂；豐臣秀吉與江戶幕府禁止天主教，日治後期的皇民化運動推行神社參拜。
        see: [言論與思想管制, 儒家]
      - name: 啟蒙與人權
        plain: 17、18 世紀強調理性、自然權利，主張人生而有權利、政府要經人民同意的思想。
        path: 洛克等啟蒙思想家的自然權利觀念，影響了美國的立國哲學與《獨立宣言》，美國憲法與權利法案把它寫成制度；法國大革命的《人權宣言》則把這些理念帶到歐洲。
        see: [民主與參政, 法律與憲法, 革命]
      - name: 移民與移墾
        plain: 人們成群搬到新的地方生活，開墾土地、建立新社會。
        path: 荷蘭人招募漢人到大員種甘蔗，明鄭與清代又有大批閩粵移民渡海來臺開墾；英國移民在北美建立十三殖民地，美國西進與鍍金時代的移民潮塑造了今天的美國。西羅馬晚期各族移入帝國，也是羅馬衰亡的討論重點。
        see: [原住民族, 土地制度, 糧食與農業]
      - name: 原住民族
        plain: 在外來者到達之前就已經住在當地的族群。
        path: 荷蘭與西班牙時代的西拉雅人、北臺灣原住民，清代的「番界」與漢人移墾，1874 年的牡丹社事件，日治時期的霧社事件與高砂義勇隊。開港後的樟腦生意也深入原住民的山林。北美的原住民在殖民與西進擴張中失去土地，可以和臺灣的經驗對照。
        see: [移民與移墾, 殖民統治]
      - name: 土地制度
        plain: 土地歸誰所有、誰來耕種、怎麼分配與收租的規則。
        path: 商鞅重新劃分土地、以軍功授田（漢代董仲舒批評他廢了井田），王莽想把土地收歸國有（王田），北魏孝文帝推行均田制。清代臺灣有大租、小租的複雜關係，戰後臺灣的三七五減租、耕者有其田重新分配農地，改革開放初期的中國則讓農民承包土地。
        see: [糧食與農業, 變法與改革]
      - name: 奴隸制
        plain: 把人當成財產買賣、強迫勞動的制度。
        path: 雅典的勞里昂銀礦靠大量奴隸開採，雅典也有奴隸出身的銀行家；王莽曾下令禁止買賣奴婢。北美殖民地依賴奴隸勞動，《獨立宣言》說「人生而平等」，美國憲法卻妥協保留奴隸制，最後由南北戰爭終結。
        see: [啟蒙與人權, 內戰]
      - name: 疫病
        plain: 大規模的傳染病，常常改變戰爭、人口與社會。
        path: 伯羅奔尼撒戰爭初期雅典爆發瘟疫，東漢末年疫病與黃巾之亂交織，赤壁之戰時曹軍營中流行疫病；14 世紀的黑死病奪走歐洲大量人口，羅馬帝國晚期的瘟疫也常被列為衰亡的原因之一。
        see: [帝國的衰亡]
      - name: 首都與都城
        plain: 一個國家的政治中心所在的城市，以及遷都背後的原因。
        path: 羅馬廣場是羅馬城的政治中心，西周在平王東遷時把都城從鎬京遷到洛邑，漢長安城是西漢的都城，北魏孝文帝從平城遷都洛陽、推動漢化。
        see: [古代建築, 變法與改革]
      - name: 科舉與教育
        plain: 學校、考試與選拔官員的制度，以及國家想用教育培養什麼樣的人。
        path: 孔子授徒講學，漢武帝設太學、以儒家經典培養官員，明鄭在臺灣推動儒學與科舉式教育；清末自強運動開辦新式學堂，日治時期的皇民化運動則透過學校推行日語與國民教育。
        see: [儒家, 言論與思想管制]

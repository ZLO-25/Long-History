    role: 你是 1885 年 7 月法國國民議會的一位議員
    situation: |
      朱爾．費里正在議會替馬達加斯加遠征的特別經費辯護。他說，法國工業越來越缺銷售市場；他也說「優等民族」對「劣等民族」有一種權利和責任去「教化」。
      （「優等民族」「劣等民族」是 19 世紀的種族等級說法，今天已不被接受。）
      有人打斷他：克里蒙梭說「這很可疑」，Maigne 說「你竟敢在宣布人權的國家這樣說」。被殖民地的人沒有人在議場。
      輪到你決定怎麼表態。你會怎麼做？請先在心裡想好，再往下看。
    options:
      - { label: 支持經費，相信工業需要市場, result: 推測：你接受費里「工業缺市場」的說法，並相信殖民地能解決它。卡片沒有記下這場表決的結果，所以後果只能推測；卡片只寫，維基百科列的批評指出占領殖民地的軍事與行政花費常常高於收益。 }
      - { label: 反對經費，主張殖民違背 1789 與 1848 年的原則, result: 推測：你和 Fabre、Maigne 站在同一邊，認為殖民等於放棄人權原則。卡片沒有記下這場表決的結果，所以後果只能推測。 }
      - { label: 先要求說明：被殖民的人怎麼想？有沒有問過他們？, result: 推測：這個問題會讓議場注意到被殖民者不在場。卡片沒有記下有人這樣問，所以只能推測；不過 Pelletan 的批評（據費里轉述）就是「你們違背他們的意願去，用暴力對待他們」。 }
    actual: 卡片只記下：費里提出工業需要市場與「教化」兩種理由，現場有克里蒙梭、Fabre、Maigne 等人反對；沒有寫這場表決的結果，也沒有被殖民者的聲音。
    ref: event-new-imperialism#C2
    note: 卡片沒有記下表決結果，三個選項的後果都是推測，標示清楚。

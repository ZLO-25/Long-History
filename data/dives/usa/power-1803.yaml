# 領土擴張示意圖 1803 年（畫法同 power-1783.yaml）
year: 1803
basemap: us_states
title: 路易斯安那購地：國土加倍（1803 年 12 月）
note: 1803 年 4 月 30 日美法簽約，1,500 萬美元買下約 214 萬平方公里；12 月 20 日在紐奧良移交，上路易斯安那 1804 年 3 月在聖路易移交。購地的西界、南界當時都沒講清楚，1819 年亞當斯—奧尼斯條約才和西班牙定界；本圖依那條界線畫（分水嶺以東、阿肯色河以北），所以法國主張中的德州北部與新墨西哥東北角沒有畫進購地。路易斯安那州在密西西比河以東、龐恰特雷恩湖以北的一塊屬西佛羅里達，本圖未切。這片土地上住著奧塞奇、蘇、波尼等數十個部族，買賣雙方都沒有問過他們。

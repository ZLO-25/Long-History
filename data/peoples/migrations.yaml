- id: atlantic-slave
  name: 大西洋奴隸貿易：被迫的遷徙
  en: Transatlantic slave trade
  color: '#78350f'
  start: 1501
  end: 1867
  when: 約 1501–1867 年
  kind: 被迫遷徙
  summary: 這不是人自己選擇的移動。三百多年間，歐洲奴隸販子向非洲商人買下被擄的人，用船押送到美洲的甘蔗園、礦場和農場做工。約 1,250 萬人被押上船，約 1,070 萬人活著抵達，多數被送到巴西和加勒比海。
  stations:
    - { key: senegambia, name: '塞內甘比亞', en: 'Senegambia', lat: 13.5, lng: -16.0, year: 1501, when: '主要出發地區之一', est: true, src: [s2] }
    - { key: goldcoast, name: '黃金海岸（今迦納）', en: 'Gold Coast', lat: 5.5, lng: -1.5, year: 1501, when: '主要出發地區之一', est: true, src: [s2] }
    - { key: benin, name: '貝寧灣', en: 'Bight of Benin', lat: 6.4, lng: 2.1, year: 1501, when: '主要出發地區之一', est: true, src: [s2] }
    - { key: biafra, name: '比夫拉灣', en: 'Bight of Biafra', lat: 4.0, lng: 8.0, year: 1501, when: '主要出發地區之一', est: true, src: [s2] }
    - { key: angola, name: '中西非（安哥拉）', en: 'West Central Africa (Angola)', lat: -8.8, lng: 13.2, year: 1501, when: '17 世紀後期以前，送到美洲的人大多來自這裡', est: true, src: [s1, s2] }
    - { key: atlantic, name: '中途航道（大西洋）', en: 'Middle Passage', lat: 3.0, lng: -25.0, year: 1501, when: '航程 1–6 個月，19 世紀約 5–7 週；約 14% 的人死在船上', from: [senegambia, goldcoast, benin, biafra, angola], est: true, src: [s2] }
    - { key: brazil, name: '巴西', en: 'Brazil', lat: -13.0, lng: -38.5, year: 1501, when: '最主要的目的地之一', from: atlantic, est: true, src: [s1] }
    - { key: caribbean, name: '加勒比海', en: 'Caribbean', lat: 18.5, lng: -72.3, year: 1501, when: '最主要的目的地之一；1525 年起有船從聖多美直接運往伊斯帕尼奧拉島', from: atlantic, est: true, src: [s1] }
    - { key: spanam, name: '西屬美洲（卡塔赫納、維拉克魯斯等港口）', en: 'Spanish America', lat: 10.4, lng: -75.5, year: 1501, when: '卡塔赫納、維拉克魯斯、布宜諾斯艾利斯、伊斯帕尼奧拉島接收最多', from: atlantic, est: true, src: [s1] }
    - { key: northam, name: '北美（今美國一帶）', en: 'North America', lat: 32.8, lng: -79.9, year: 1501, when: '只占一小部分：約 38.8 萬人', from: atlantic, est: true, src: [s4] }
  evidence:
    records:
      - { text: '研究者把數萬次航行的船隻紀錄整理成資料庫：1501–1866 年約 1,252 萬人被押上船、約 1,070 萬人活著抵達美洲。', src: [s3, s4] }
      - { text: '每艘奴隸船通常載 350–450 人；約十分之一的船上發生過反抗。', src: [s2] }
      - { text: '更早的 1450–1521 年，研究者用葡萄牙王室的海關紀錄和商人帳本重建人數。', src: [s1] }
    dna:
      - { text: '2020 年一項基因研究找到非洲奴隸貿易地區和美洲上岸地區之間的基因連結。', src: [s5] }
  debates:
    - { text: '估計數字有好幾種：資料庫約 1,252 萬人上船；維基百科另一處寫約 1,275 萬；歷史學家的估計範圍是 940–1,260 萬。', src: [s1, s2, s3] }
    - { text: '英屬殖民地最早的非洲人被歸為契約僕役，到 17 世紀中期已變成依「種族」劃分、世代相傳的奴隸身分制度；「種族」在這裡是用來分等級的社會分類，不是生物學事實。', src: [s1] }
    - { text: '歐洲人多半向非洲商人購買俘虜，很少自己上岸劫掠；奴隸貿易對非洲經濟的傷害有多大，Rodney 和 Thornton 等學者看法相反。', src: [s1], disputed: true }
  today:
    - { text: '研究在美洲人的基因裡，找到對應非洲奴隸貿易出發地區的連結：被迫遷徙的歷史，留在今天美洲人的祖源裡。', src: [s5] }
  countries: [Brazil, Haiti, Jamaica, Cuba, Dominican Rep., United States of America, Colombia, Nigeria, Benin, Ghana, Angola, Senegal]
  cards: [event-atlantic-slave-trade, event-haitian-revolution, war-american-civil-war]
  sources:
    - { id: s1, title: 'Atlantic slave trade — Wikipedia', url: 'https://en.wikipedia.org/wiki/Atlantic_slave_trade', accessed: 2026-11-08 }
    - { id: s2, title: 'Middle Passage — Wikipedia', url: 'https://en.wikipedia.org/wiki/Middle_Passage', accessed: 2026-11-08 }
    - { id: s3, title: 'David Eltis, David Richardson 等編, Trans-Atlantic Slave Trade Database — Estimates（SlaveVoyages）', url: 'https://legacy.slavevoyages.org/assessment/estimates', accessed: 2026-11-07 }
    - { id: s4, title: 'Henry Louis Gates Jr., How Many Slaves Landed in the U.S.? — PBS（2013）', url: 'https://www.pbs.org/wnet/african-americans-many-rivers-to-cross/history/how-many-slaves-landed-in-the-us/', accessed: 2026-11-07 }
    - { id: s5, title: 'Micheletti, S. J. et al. (2020), Genetic Consequences of the Transatlantic Slave Trade in the Americas, American Journal of Human Genetics 107(2): 265–277', url: 'https://doi.org/10.1016/j.ajhg.2020.06.012', accessed: 2026-11-08 }

    model_answer: 從地方官處理被告發的人，到 303 年的大迫害，再到 311 年停止迫害、313 年各宗教都能自由敬拜，最後 380 年被定為官方信仰，391 年連異教敬拜也被禁止。要小心兩種簡化：一是「兩百多年一直被迫害」，學者多半認為 250 年前主要是地方性的；二是「君士坦丁定國教」，定為官方信仰是 380 年狄奧多西的事。另外，君士坦丁是否真心信仰，學者的看法也分歧。這題沒有標準答案。

id: unit-ming-silver
title: 白銀帝國：明朝的錢為什麼要從地球另一邊運來？
histories: [中國史, 錢的歷史, 世界通史]
mystery: 明朝是當時世界上人口最多的國家之一，可是它用的銀子，很多來自日本和美洲。為什麼一個大帝國的錢要靠別人供應？
teaser: 一張變成廢紙的鈔票，引來了橫越太平洋的白銀大帆船。
goals:
  - 能用因果鏈說明明朝為什麼從紙鈔轉向白銀
  - 能說出白銀從美洲和日本流進中國的路線
  - 能判讀一段明代史料，說出海外貿易帶回多少錢、對誰有利
  - 能比較「全球化從 1571 年開始」與「全球化從 19 世紀開始」兩種看法
minutes: 35
steps:
  - type: hook
    text: |
      假設學校福利社規定只能用「福利社點數」買東西，可是點數越印越多，最後一百點才買得到一包餅乾。
      同學們會怎麼辦？大概會偷偷改用真正的現金交易。
      明朝也發生了一樣的事，只是那個「現金」是白銀，而且很多銀子來自地球的另一邊。
  - type: card
    id: finance-ming-baochao
    depth: story
    prompt: 先看明朝的紙鈔怎麼失敗。注意：寶鈔能不能拿去換回金銀？
  - type: sim
    sim: debase
    prompt: 動手試試看：這個模擬用的是銀幣，但道理相通：政府用「不值那麼多」的錢付帳，付得越多，物價會怎樣？想一想，寶鈔的情況哪裡和模擬一樣、哪裡不一樣？
  - type: chain
    prompt: 把下列事件依照「因 → 果」排成一條鏈（最上面是最早的原因）。
    items:
      - 明朝發行寶鈔，不能兌換金銀，也不限制發行量
      - 寶鈔越印越多，民間不再信任
      - 民間私下改用白銀，朝廷後來也開始收白銀
      - 中國對白銀的需求大增，白銀在中國比在歐洲值錢得多
      - 日本和美洲的白銀經海路大量流進中國
    explain: 紙鈔失敗 → 改用白銀 → 中國需要大量白銀，銀價比別處高 → 外國白銀被吸引進來。這條鏈說明了明朝國內的貨幣問題，怎麼變成一場全球的貿易。
    hints:
      - 最早的原因是一種「紙做的錢」。
      - 先有人改用白銀，白銀才會變得搶手。
      - 銀子為什麼要千里迢迢運到中國？因為在那裡最值錢。
    ref: finance-ming-baochao#F5
  - type: card
    id: commodity-iwami-silver
    depth: story
    prompt: 白銀的第一個來源：日本。注意是誰把日本銀運進中國的。
  - type: card
    id: commodity-manila-galleon
    depth: story
    prompt: 白銀的第二個來源：美洲。看看這條橫越太平洋的航線有多危險。
  - type: card
    id: commodity-silver-flow
    depth: deep
    prompt: 把兩條路線合起來看。讀「史家怎麼吵」時注意：白銀是中國「吸」過去的，還是世界「推」過去的？
  - type: source
    card: commodity-silver-flow
    idx: 0
    question: 周起元說海外貿易「所貿金錢，歲無慮數十萬，公私並賴」，最能說明什麼？
    options:
      - 明朝禁止所有海外貿易
      - 海外貿易每年帶回大量錢財，官府和民間都依賴它
      - 海外貿易讓明朝虧損很多錢
      - 只有皇帝能從海外貿易賺錢
    answer: 1
    explain: 「歲無慮數十萬」是每年大約數十萬，「公私並賴」是官府和民間都靠它。這是 1567 年明朝開放民間出海之後的情況。讀這段史料也要注意：作者在替一本講海外貿易的書寫序，他有理由強調貿易的好處。
    hints:
      - 「歲」是每年，「公私」是官府和民間。
      - 這段話寫在明朝開放民間出海之後還是之前？
      - 作者在替什麼樣的書寫序？
    ref: commodity-silver-flow#B7
  - type: compare
    cards: [commodity-iwami-silver, commodity-manila-galleon]
    prompt: 比一比兩條白銀路線。
    rows:
      - { aspect: 產地, a: 日本石見銀山（1533 年起用灰吹法大量提煉）, b: 美洲的墨西哥、波托西（今玻利維亞）等銀山，從墨西哥阿卡普爾科出海 }
      - { aspect: 怎麼運到中國, a: 起初多由中國走私海商偷運，後來葡萄牙人經長崎、澳門轉運, b: 西班牙大帆船橫越太平洋到馬尼拉，再由福建商人帶回中國 }
      - { aspect: 換回什麼, a: 中國絲綢, b: 中國絲綢和瓷器 }
      - { aspect: 誰付出代價, a: 明朝禁止對日貿易，海商冒著違法的風險, b: 南美洲被強迫勞動的原住民礦工；航程中死去的船員；馬尼拉多次遭屠殺的華人 }
    question: 兩條路線有什麼共同點？為什麼它們最後都通往中國？
    model_answer: 共同點是：都把外國產的白銀運到中國，換走中國的絲綢和瓷器；而且都不是明朝官方主動去取，而是外國商人和中國海商把銀運進來。它們都通往中國，是因為明朝改用白銀後需求極大，自己又產銀不多，銀在中國比在歐洲值錢得多，運銀到中國最有賺頭。
    hints:
      - 看「換回什麼」那一列。
      - 回想因果鏈：銀子為什麼在中國特別值錢？
      - 看「誰付出代價」：這條財富之路，也有很多看不見的人。
  - type: decision
    role: 你是 1567 年的明朝官員
    situation: |
      朝廷一向禁止百姓出海貿易，可是沿海走私越來越猖獗，還有海盜作亂。另一方面，國內越來越需要白銀，而白銀大多是從海外來的。
      有人主張開放福建月港，讓百姓合法出海；也有人說開放會讓海盜更多、讓倭寇有機可乘。你會怎麼建議？
    options:
      - { label: 開放民間出海貿易（但仍禁止對日本貿易）, result: 這接近明朝當年的選擇，史稱「隆慶開海」。海外貿易每年帶回的錢據說有「數十萬」，大量白銀從馬尼拉流進中國；但對日貿易仍然被禁，日本銀主要還是靠走私和葡萄牙人轉運。 }
      - { label: 繼續全面禁止出海, result: 推測：國內對白銀的需求不會消失，走私可能更猖獗，朝廷也收不到這部分的稅。歷史沒有走這條路，所以後果只能推測。 }
    actual: 1567 年明朝開放民間從月港出海貿易，但仍禁止對日本貿易。白銀從此更大量流入中國，也讓明朝的經濟更依賴海外白銀。
    ref: commodity-silver-flow#B7
    note: 「沒有發生的選項」的後果都是推測，標示清楚。
  - type: today
    card: commodity-silver-flow
    question: 有人說「明朝依賴外國白銀，就像今天的國家依賴外國晶片或石油」。這個類比哪裡不成立？
    model_answer: 明朝的白銀是當作「錢」本身，國家的貨幣供應掌握在外國產地和商人手上；今天的國家有自己發行的貨幣，晶片和石油是商品，不是貨幣。而且當時的白銀靠帆船運送，速度和規模都和今天的國際貿易完全不同。這個類比可以幫我們想「依賴外部供應的風險」，但不能直接套用。
  - type: check
    items:
      - kind: choice
        q: 明朝的寶鈔為什麼會失去信用？
        options: [因為紙張品質太差容易破, 因為不能兌換金銀，政府又不限制發行量, 因為百姓看不懂上面的字, 因為外國人偽造太多]
        answer: 1
        explain: 寶鈔沒有準備金、不能兌換，政府需要錢就再印，越印越不值錢。萬志英還補充：明初改收實物稅，紙幣無法透過繳稅回流，信用因此崩潰。
        hints: [回去看寶鈔卡的故事。, 想想福利社點數的例子。]
        ref: finance-ming-baochao#F3
      - kind: order
        q: 依時間先後排列：
        items: [明朝發行大明寶鈔, 波托西發現大銀山, 明朝開放民間出海（隆慶開海）, 西班牙以馬尼拉為亞洲據點]
        explain: 1375 寶鈔 → 1545 波托西 → 1567 隆慶開海 → 1571 馬尼拉。
        hints: [寶鈔是明朝初年的事。, 隆慶開海和馬尼拉建城只差四年。]
        ref: commodity-silver-flow#B2
      - kind: short
        q: 用一兩句話說明：關於「全球化從什麼時候開始」，有哪兩種不同的看法？
        model: 弗林與吉拉德茲認為 1571 年馬尼拉建城後，各大洲第一次持續交換貨物，全球貿易就此誕生；歐羅克與威廉森則用價格資料檢驗，認為真正的全球市場整合要到 19 世紀才出現。
        explain: 兩派對「全球化」的定義不同：一派看有沒有持續的貿易連結，一派看各地價格有沒有被拉近。
        hints: [回去看馬尼拉大帆船卡的「史家怎麼吵」。, 一派看「貿易」，一派看「價格」。]
        ref: commodity-manila-galleon
  - type: recap
    model_answer: 因為明朝自己的紙鈔失敗了。寶鈔不能兌換、又越印越多，民間改用白銀，朝廷也跟著收白銀；中國對白銀的需求極大、自己又產得不多，白銀在中國最值錢，於是日本石見和美洲（墨西哥、波托西）的白銀，經走私海商、葡萄牙商船和西班牙大帆船源源不絕地流進中國。學者還在爭論：這是中國把白銀「吸」過去，還是世界把白銀「推」過來；全球化是不是從這時候開始。
next: [unit-imjin-war, unit-bubbles]

id: unit-bubbles
title: 泡沫：大家都在賺錢的時候，為什麼會突然崩盤？
histories: [錢的歷史, 臺灣史, 歐洲史]
mystery: 鬱金香、股票、房子：歷史上有好幾次，大家搶著買到價格衝上天，然後一夕之間崩落。為什麼聰明人也會被捲進去？
teaser: 連牛頓都在股票狂潮裡賠了錢；三百年後，臺灣股市也從 12,682 點摔到 2,485 點。
goals:
  - 能說出「泡沫」形成與破滅的幾個共同步驟
  - 能判讀當時人留下的文字，說出他們看到了什麼
  - 能比較荷蘭鬱金香狂熱與臺灣 1990 年股市崩盤的異同
  - 能分辨「後見之明」與「倖存者偏差」，不把歷史當成投資建議
minutes: 35
steps:
  - type: hook
    text: |
      班上開始流行一種球員卡。一開始一張 20 元，後來有人用 100 元收，再後來 500 元也有人搶。
      你其實不太在乎球員是誰，只是覺得「明天一定有人出更高價跟我買」。
      有一天，突然沒有人要買了。手上那疊卡，還值多少錢？
  - type: sim
    sim: bubble
    prompt: 先動手玩玩看：價格是怎麼被「大家都覺得會漲」推上去的？又是怎麼摔下來的？
  - type: card
    id: finance-tulip-mania
    depth: deep
    prompt: 最有名的泡沫故事。讀完特別注意「這個故事可能被誇大了」那一欄。
  - type: card
    id: finance-south-sea-bubble
    depth: story
    prompt: 一百年後的英國：這次被炒的是一家公司的股票，連牛頓也進場了。
  - type: source
    card: finance-south-sea-bubble
    idx: 0
    question: 斯圖克利在 1720 年 9 月寫下「成千上萬的家庭破產了」，這句話最能說明什麼？
    options:
      - 南海公司的貿易生意非常賺錢
      - 股價崩落後，受害的不只是少數大戶，很多普通家庭也賠光了
      - 英國政府在 1720 年宣布破產
      - 牛頓賠了一萬英鎊
    answer: 1
    explain: 這是當時人在崩盤當月寫下的感受，說明損失擴散到很多家庭。但讀這句話也要小心：「成千上萬」是寫信人的印象，不是統計數字；他沒有、也不可能一家一家去算。
    hints:
      - 先看寫信的時間：1720 年 9 月，股價發生了什麼事？
      - 「家庭」指的是大公司，還是一般人家？
      - 「成千上萬」是精確統計，還是當時人的印象？
    ref: finance-south-sea-bubble#F5
  - type: decision
    role: 你是 1720 年 6 月的倫敦投資人
    situation: |
      你在 4 月把南海公司股票賣掉，已經賺了一筆。可是到了 6 月，股價還在漲，從年初約 128 英鎊衝到快 1,000 英鎊。身邊的人都在說「還會再漲」。
      你要再買回來嗎？
    options:
      - { label: 再買回來，搭最後一段上漲, result: 這是牛頓當年的選擇。他 6 月又買回，9 月股價崩落；據奧德里茲科的研究，他最後不但賠光先前的獲利，還多賠了一些。 }
      - { label: 不再進場，守住已經賺到的錢, result: 推測：如果股價真的還有一段漲幅，你會少賺；但 9 月崩盤時，你也不會被套住。歷史上牛頓沒有走這條路，所以這只能推測。 }
    actual: 南海公司股價在 9 月崩落，年底只剩 100 多英鎊。重點不是「牛頓笨」，而是：在泡沫裡，連很聰明、已經獲利的人，也很難抗拒「別人都在賺」的壓力。
    ref: finance-south-sea-bubble#F4
    note: 「沒有發生的選項」的後果都是推測，標示清楚。這是歷史情境，不構成投資建議。
  - type: card
    id: finance-taiwan-stock-1990
    depth: understand
    prompt: 再往前快轉到我們熟悉的地方：1980 年代末的臺灣。注意錢從哪裡來。
  - type: chain
    prompt: 把臺灣 1980 年代末的泡沫，依照「因 → 果」排成一條鏈（最上面是最早的原因）。
    items:
      - 出口賺進大量美元，新臺幣大幅升值
      - 熱錢湧入、民間閒錢多又缺乏投資管道
      - 錢湧進股市和房市，加權指數衝上 12,682 點
      - 央行緊縮信用，地下投資公司接連倒閉
      - 1990 年 10 月指數跌到約 2,485 點
    explain: 順差與升值 → 錢太多 → 推高股價房價 → 信用收緊、資金斷鏈 → 崩盤。注意：泡沫往往不是因為某個壞消息才破，而是「推高價格的錢」停下來了。
    hints:
      - 最早的原因跟出口和匯率有關。
      - 股價要先漲上去，才會有「崩」。
      - 是什麼讓資金突然變少了？
    ref: finance-taiwan-stock-1990#F2
  - type: compare
    cards: [finance-tulip-mania, finance-taiwan-stock-1990]
    prompt: 比一比相隔三百五十年的兩次泡沫。
    rows:
      - { aspect: 時間, a: 1636 年冬天到 1637 年 2 月, b: 1986 年到 1990 年 }
      - { aspect: 被炒的東西, a: 鬱金香球根的「之後交貨」合約, b: 股票和房地產 }
      - { aspect: 錢從哪裡來, a: 私人之間簽約，很多球根根本沒有易手, b: 貿易順差、熱錢、地下投資公司吸收的民間存款 }
      - { aspect: 崩盤後, a: 很多合約沒有付錢、協商取消，研究認為對經濟傷害有限, b: 指數 8 個月跌掉八成，但 1990、1991 年經濟仍有成長 }
    question: 兩次泡沫有什麼共同點？為什麼兩次崩盤後，整體經濟都沒有像傳說中那樣崩潰？
    model_answer: 共同點是：大家買的理由越來越不是東西本身的用處，而是相信「之後會有人用更高價買走」；一旦沒人接手，價格就急跌。整體經濟沒有崩潰，鬱金香是因為很多合約最後沒有付錢、參與的人也不多；臺灣則是因為當時大多數人用儲蓄而不是借錢買股，損失沒有連鎖拖垮銀行。這也提醒我們：泡沫傷害有多大，要看錢是怎麼借、怎麼連在一起的。
    hints:
      - 看「被炒的東西」：大家真的需要那麼多球根或股票嗎？
      - 看「崩盤後」那一列，兩邊的經濟後來怎麼了？
      - 回去看臺灣股市卡的「史家怎麼吵」，許嘉棟怎麼說？
  - type: today
    card: finance-tulip-mania
    question: 每次有東西漲很快，就有人說「這是現代版鬱金香泡沫」。這個說法哪裡不成立？
    model_answer: 1637 年的鬱金香合約是私人之間簽的，參與的人不多，崩盤後多半靠協商取消，沒有銀行或股市跟著倒；今天的資產市場規模大得多，牽涉銀行借貸和全球資金。而且「鬱金香泡沫」這個故事本身就被誇大過。所以拿它來比喻可以提醒「價格可能脫離實際用途」，但不能證明今天某樣東西一定會崩。本單元不構成投資建議。
  - type: check
    items:
      - kind: choice
        q: 下列哪一個最符合「泡沫」的意思？
        options: [東西因為品質變好而漲價, 價格漲得遠遠超過東西本身的用處，靠「之後會有人用更高價買」撐著, 政府規定的價格, 因為缺貨所以暫時漲價]
        answer: 1
        explain: 泡沫的關鍵是買的人不是為了用，而是為了轉手賺差價；一旦沒人接手，價格就撐不住。
        hints: [回想 hook 裡的球員卡。, 大家買的理由是什麼？]
        ref: finance-tulip-mania#F1
      - kind: order
        q: 依時間先後排列：
        items: [荷蘭鬱金香價格崩落, 英國南海泡沫破滅, 臺灣加權指數衝上 12,682 點]
        explain: 1637 鬱金香 → 1720 南海泡沫 → 1990 臺灣股市高點。
        hints: [鬱金香發生在 17 世紀。, 南海泡沫發生在 18 世紀初。]
        ref: finance-south-sea-bubble#F2
      - kind: short
        q: 用一兩句話說明：「牛頓賠錢」的故事被大家記住，可能有什麼「倖存者偏差」？
        model: 我們記得牛頓賠錢，是因為他有名、留下了紀錄；成千上萬賠光積蓄的普通家庭沒有名字留下，而在高點賣出的贏家也很少被講成故事。所以流傳下來的例子不一定代表大多數人的經驗。
        explain: 被記住的故事，常常是最有名或最戲劇化的，不一定是最典型的。
        hints: [回去看南海泡沫卡的「事後看很清楚的陷阱」。, 誰的故事比較容易留下來？]
        ref: finance-south-sea-bubble#F5
  - type: recap
    model_answer: 泡沫通常有幾個共同步驟：先有一個好聽的故事或大量閒錢，價格開始上漲；越來越多人進場不是為了用，而是相信會有人用更高價買走；價格脫離實際價值後，只要推高價格的錢停下來，就會急跌。聰明人也會被捲進去，因為身在其中時，「大家都在賺」的壓力很大，而事後看很清楚的事，當時並不清楚。最後提醒：歷史可以幫我們理解泡沫，但不能拿來預測市場，本單元不構成投資建議。
next: [unit-taiwan-currency-1949, unit-chip-island]

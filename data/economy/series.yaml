  - id: boe-real-wage
    metric: uk_real
    name: 英國實質消費工資（1900 年＝100）
    kind: 估計
    verification: AI草稿
    note: 實質工資＝名目工資扣掉物價，代表「薪水買得到多少東西」。英格蘭銀行用全職工作的收入除以物價指數；1750 年以前用英格蘭日薪推算。1500 到 1600 年，英格蘭建築工人的名目日薪漲了一倍多（約 3.2 便士→7.1 便士），物價卻漲了約 4 倍，實質工資反而掉了約四成——物價上漲吃掉了加薪（歐洲「價格革命」）。每十年畫最低到最高。

  - type: recap
    model_answer: 因為「打贏」和「坐穩」是兩回事。關原只是幾個小時的會戰，大名多半是「草隨風倒」才站到家康這邊；秀吉的兒子還住在天下第一的大坂城裡，是家康名義上的舊主，八十幾家被改易的大名留下的浪人也都在等機會。所以家康先用 1603 年開幕、1605 年讓位把將軍職變成世襲，再在 1614 年以鐘上八個字為由開戰，1615 年把豐臣家連 8 歲的孩子一起消滅；這一步是不是故意找碴，史家到今天還並列兩種看法。滅了豐臣之後幕府不再打仗，改用武家諸法度與參勤交代管大名，1635 年又禁造大船、禁日本人出海，把大名和海外隔開。對外的那扇門則是另一條線：從秀吉 1587 年的追放令到家康 1614 年的禁教，天主教一直被當成政權的威脅；1637 年島原之亂爆發，幕府把一場多數研究認為由苛政引起、也帶有宗教一揆性格的亂事，一律定性為天主教徒叛亂，1639 年趕走葡萄牙人，只留下答應不傳教的荷蘭人。不過，「關門」並不是全關：四口一直開著，「鎖國」這個詞 1801 年才出現。也要記得 Hall 的提醒：幕藩體制不是一戰造成的，要到 1630–1640 年代才定型。最後從另一邊看：德川的兩百多年太平，是豐臣一家、大坂的浪人、原城裡的三萬人和被處死的天主教徒付的代價。這是一種參考說法，不是標準答案。
reflect: 小早川在松尾山上被兩邊開了條件，最後在戰場上選了邊；而史家說，他也許早就決定了，「猶豫」是後人加上去的。你有沒有在朋友吵架或分組時被兩邊拉攏過？你是早就決定了，還是看誰勢頭強？事後你怎麼跟自己、跟別人解釋那個選擇？

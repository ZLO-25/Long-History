      - kind: choice
        q: 下面哪一項最符合卡片對羅馬法的說明？
        options:
          - 羅馬法保障每一個人的權利，是現代人權法的直接祖先
          - 羅馬法由皇帝一個人寫成，完全沒有法學家參與其中
          - 十二銅表法（十二銅表法）就是羅馬法的全部，後來沒有再增補過
          - 權利依身分而定，奴隸被當成財產
        answer: 3
        explain: 卡片說，羅馬法的權利依身分而定：奴隸被當成財產，沒有法律人格，家父對家人有很大的權力。所以它不是人人平等的法律。十二銅表法只是起點，後來還有裁判官（又譯法務官）告示、法學家的意見和皇帝敕令；《民法大全》則是查士丁尼在 6 世紀的東羅馬編的。
        hints:
          - 想想：奴隸在羅馬法裡是「人」還是「物」？
          - 羅馬法是一次寫成的，還是幾百年慢慢補出來的？
        ref: social-roman-law#E1
      - kind: choice
        q: 關於戴克里先的四帝共治，學者一般怎麼看？
        options:
          - 它在 293 年正式把羅馬帝國分成東西兩個獨立的帝國
          - 一個皇帝團隊分區管理，不是四個小帝國
          - 它成功延續了一百年，四位皇帝順利接班
          - 它由元老院投票選出四位皇帝，輪流擔任
        answer: 1
        explain: 學者一般把四帝共治看成一個皇帝團隊，各有活動區，但管轄範圍並不精確劃分；東西分裂是後來狄奧多西一世之後的事，帝國也從未正式分成兩個。這個制度在戴克里先退位後很快就崩解，324 年君士坦丁成為唯一皇帝。
        hints:
          - 官方形象強調的是團結，還是分裂？
          - 四帝的安排，在他退位之後撐了多久？
        ref: event-diocletian-tetrarchy#C4
      - kind: short
        q: 用一兩句話說明：為什麼說奧古斯都「沒有廢掉共和，卻讓共和名存實亡」？
        model: 他保留元老院、官職和公民大會的名稱，自己只稱「第一公民」，沒有稱王；但軍團向他個人宣誓效忠，元老院失去外交、財政與戰爭的控制權，實權集中在他手上。他說自己把國家交還給人民，那是他自己寫的版本。
        explain: 卡片說，元首制是「名稱不變、實權改變」；共和不是在前 27 年的某一天被宣布廢除，而是實權慢慢集中。現代史家多半視為君主制的變體，但蒙森看成皇帝與元老院共治，所以這個評價也有爭論。
        hints:
          - 先列出「還在」的東西：元老院、官職、公民大會。
          - 再列出「改變」的東西：軍團向誰宣誓？元老院失去哪三件事的控制權？
          - 他自己說「交還給人民」，這是誰寫的？
        ref: event-augustan-principate#C4
  - type: recap
    model_answer: 奧古斯都保留元老院、官職和公民大會，自稱「第一公民」，實權卻集中在手上：軍團向他個人宣誓，元老院失去外交、財政與戰爭的控制權；他自己寫的《功業錄》說交還了國家，那是他自己的說法。之後約兩百年，帝國內部沒有大規模內戰，道路、貿易和法律把這麼大的地方連在一起，龐貝的麵包店和選舉標語就是這種日常的樣子；不過「和平」不是沒有戰爭，羅馬法也依身分決定誰受保護，奴隸只是財產。基督教從地方官處理的小團體，歷經 250 年之後的全帝國性迫害、311 年停止、313 年各宗教自由敬拜，到 380 年尼西亞派基督教被定為官方信仰。三世紀的軍隊擁立、貨幣貶值、瘟疫與外敵，讓帝國差點散掉；戴克里先用四帝共治回應，卻靠個人威望，他一退位就崩，324 年君士坦丁成為唯一皇帝。至於西羅馬為什麼沒撐住，卡片說有學者認為三世紀留下的問題是內部原因之一，但爭議很大，史家列出的原因有兩百多種，476 年也只是皇帝被廢，不是一場大戰；東邊的羅馬又活到 1453 年。這題沒有標準答案，你也可以挑一個你覺得最能解釋「守不住」的原因。

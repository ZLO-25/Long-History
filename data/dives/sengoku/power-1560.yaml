# 大名勢力示意圖：1560 年 5 月（桶狹間之戰前夕）
# 畫法同 power-1582.yaml：以令制國為單位、用今日都道府縣近似；一縣含兩國時用經度切開。邊界只是示意。
# 2026-11-03 查核：抽查 32 個勢力與該年史實大致相符；新增會津蘆名盛氏（福島縣以經度 140.05 切開，西為蘆名、東為伊達），兵庫縣的攝津部分（經度 135.05 以東）改歸三好；飛驒（岐阜北部，三木・姉小路）、能登畠山、若狹武田、北近江淺井、安房上總里見仍併入鄰近勢力示意並在 provinces 註明。
year: 1560
title: 桶狹間之戰前夕（1560 年 5 月）
note: 以令制國為單位、用今日縣界近似的示意圖。這時還沒有一個「全國最強」：今川義元（駿河・遠江・三河）正要西進，尾張的織田信長只是一個小大名；畿內由三好長慶掌握，將軍足利義輝在京都但沒有實權。許多縣裡有好幾個互相對抗的勢力，本圖只標當時最有力的一家，其餘寫在說明裡。
sources:
  - { title: "桶狭間の戦い — Wikipedia（日本語）：1560 年前後今川・織田的領國", url: "https://ja.wikipedia.org/wiki/%E6%A1%B6%E7%8B%AD%E9%96%93%E3%81%AE%E6%88%A6%E3%81%84", accessed: 2026-11-03, tier: 百科 }
  - { title: "戦国大名 — Wikipedia（日本語）：各地戰國大名一覽", url: "https://ja.wikipedia.org/wiki/%E6%88%A6%E5%9B%BD%E5%A4%A7%E5%90%8D", accessed: 2026-11-03, tier: 百科 }
  - { title: "Sengoku period — Wikipedia（英語）：主要大名分布", url: "https://en.wikipedia.org/wiki/Sengoku_period", accessed: 2026-11-03, tier: 百科 }
  - { title: "三好長慶 — Wikipedia（日本語）：畿內與四國東部的三好政權", url: "https://ja.wikipedia.org/wiki/%E4%B8%89%E5%A5%BD%E9%95%B7%E6%85%B6", accessed: 2026-11-03, tier: 百科 }

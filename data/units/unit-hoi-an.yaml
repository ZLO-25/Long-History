id: unit-hoi-an
title: 會安古鎮：越南的老街，為什麼滿是中國建築和漢字？
histories: [越南史, 東南亞史, 日本史]
mystery: 到越南會安玩，招牌、廟宇、會館寫的都是漢字，屋子看起來像臺南老街。這裡明明是越南，為什麼會這樣？
teaser: 一座河口小鎮，因為明朝的一道禁令，成了華人、日本人和越南人一起做生意的港口；又因為日本鎖國和明朝滅亡，變成滿街漢字的老街。
goals:
  - 能說出讓會安滿是漢字的三個外部原因：明朝不准日本船進中國、日本鎖國、明朝滅亡
  - 能判讀一段 17 世紀中國僧人對會安的記載，說出當時住在大唐街的是什麼人
  - 能說明會安的漢字為什麼不只屬於華人，也屬於越南人自己
  - 能比較明朝遺民去越南和去臺灣（鄭成功）的不同結局
minutes: 25
steps:
  - type: hook
    text: |
      走進臺南的老街，你會看到廟宇、老店和寫著漢字的匾額。
      到越南中部的會安，你會看到很像的東西：福建會館、供奉天后和關公的會館，還有一座「來遠橋」。
      這個單元，我們要像偵探一樣，找出這些漢字是怎麼「漂」到越南的。
  - type: card
    id: building-hoi-an
    depth: story
    prompt: 先讀會安的故事。邊讀邊數：故事裡提到哪幾群人住在會安？
  - type: card
    id: commodity-nanban-trade
    depth: story
    prompt: 讀這張卡時，注意「朱印船」是什麼船、去了哪些地方。
  - type: source
    card: building-hoi-an
    idx: 0
    question: 根據 1695–1696 年來到會安的中國僧人大汕的記載，住在大唐街開店的主要是什麼人？
    options:
      - 日本商人，穿著和服
      - 福建來的華人，還穿著明朝的服裝
      - 葡萄牙傳教士
      - 越南的官員
    answer: 1
    explain: 記載說店主「都是福建人」，而且「仍穿著前朝（明朝）的服裝」。大汕來的時候，明朝已經在 1644 年滅亡五十多年了，這些福建人還保留著明朝的穿著。這句話我們讀到的是越南文譯本的英譯、再摘譯成中文，讀史料時也要注意它經過了幾手翻譯。
    hints:
      - 記載裡說店主是從哪一個省來的？
      - 大汕來的時候是清朝；「前朝」是指哪一朝？
      - 日本人在 1630 年代鎖國後，還能留在會安嗎？
    ref: building-hoi-an#story
  - type: chain
    prompt: 把讓會安「滿是漢字」的事件依時間排好（最上面最早）。
    items:
      - 明朝不准日本船進中國港口，中日商人改到會安等第三地交易
      - 日本商人社群在會安蓋了一座廊橋（後來的來遠橋）
      - 日本鎖國，會安的日本町逐漸消失
      - 明朝滅亡，明朝遺民南下越南，成為明鄉人
      - 福建商人把會館重修成今天的福建會館
      - 河口淤積、港口移往峴港，老街原樣保存下來
    explain: 第三地貿易讓華人與日本人來到會安 → 1593 年起日本人蓋橋 → 1630 年代鎖國，日本町沒落 → 1644 年明亡，遺民南下 → 1757 年福建會館重修 → 19 世紀港口沒落，老街「停格」。
    hints:
      - 日本人要先來到會安，才會蓋橋，之後也才會因為鎖國而離開。
      - 明朝滅亡是 1644 年，比日本鎖國晚一點。
      - 老街能保存下來，是因為後來「沒落」了。
    ref: building-hoi-an#D1
  - type: card
    id: tech-vietnam-scripts
    depth: story
    prompt: 會安的漢字不全是華人寫的。讀這張卡，找出越南人自己用漢字用到什麼時候。
  - type: compare
    cards: [building-hoi-an, event-koxinga-taiwan]
    prompt: 1644 年明朝滅亡後，不願接受清朝統治的人，有的去了越南，有的跟著鄭成功來到臺灣。比一比兩條路。
    rows:
      - { aspect: 去了哪裡, a: 南下越南，阮主讓他們定居, b: 鄭成功 1661 年渡海攻打荷蘭人的熱蘭遮城，在臺灣建立政權 }
      - { aspect: 和當地統治者的關係, a: 在阮主允許下定居，在會安組成「明香社」, b: 自己當統治者，打敗了荷蘭人 }
      - { aspect: 後來的結局, a: 後代成為明鄉人，阮朝時被當成越南人, b: 1683 年鄭家向清朝投降，臺灣歸入清朝版圖 }
    question: 同樣是明朝遺民，為什麼一邊融入了越南，一邊卻被清朝收服？
    model_answer: 去越南的明朝遺民是在阮主允許下定居，組成明香社、蓋祠堂與會館，幾代之後被阮朝當成越南人。鄭成功則帶著約 25,000 人的大軍打敗荷蘭人，在臺灣自己建立政權，繼續用明朝的名義和清朝對抗，最後 1683 年清朝攻下澎湖，鄭家投降。一邊是「融入當地」，一邊是「另立政權」，結局就不一樣。
    hints:
      - 看「和當地統治者的關係」那一列：誰說了算？
      - 有自己軍隊、繼續反清的那一方，清朝會放過他嗎？
      - 明鄉人後來被當成哪一國人？
  - type: decision
    role: 你是 1640 年代住在會安的一位福建商人
    situation: |
      家鄉傳來消息：明朝滅亡了，清朝取代了明朝。
      你在會安做生意已經好幾年，越南的阮主也歡迎外國商人。你可以回福建老家，也可以留在會安。你會怎麼做？
    options:
      - { label: 留在會安，和同鄉一起生活, result: 這是許多華商與明朝遺民的選擇。他們組成「明香社」，蓋會館、拜家鄉的神明，後代成為明鄉人，阮朝時被當成越南人。 }
      - { label: 回福建老家, result: 推測：回到福建，可能碰上清朝和鄭成功等抗清勢力在沿海的戰爭，海外的生意也可能中斷。卡片只記下留下來的人，沒有記下回鄉的人後來怎樣，所以後果只能推測。 }
    actual: 很多人選擇留下或南下越南，成為明鄉人；福建商人也在 1757 年把會館重修成今天的福建會館。
    ref: building-hoi-an#story
    note: 「沒有發生的選項」的後果都是推測，標示清楚。
  - type: today
    card: building-hoi-an
    question: 有人說「會安就像今天的工廠搬到越南，因為美中不能直接做生意」。這個類比哪裡不成立？
    model_answer: 會安的「第三地貿易」發生在沒有國際法和自由貿易協定的時代，靠的是越南統治者的特許和商人自己的網絡；今天的工廠移動則牽涉關稅、跨國企業和各國法律。明鄉人被阮朝收編成越南人，也是王朝時代的身分安排，不能直接比作今天的國籍。可以借來思考的是：兩個國家不能直接往來時，中間的第三地常常會因此繁榮起來。
  - type: check
    items:
      - kind: choice
        q: 為什麼 17 世紀初日本商船和中國商船要到會安碰面，而不是直接去對方的港口？
        options: [會安的東西比較便宜, 明朝禁止日本船進入中國港口, 日本禁止中國船進入日本, 會安是中日兩國共同管理的港口]
        answer: 1
        explain: 明朝不准日本船進中國港口，日本的朱印船只好到東南亞的第三地，和中國商船交易。
        hints: [是哪一個國家下了禁令？, 想想「第三地貿易」的意思。]
        ref: building-hoi-an#story
      - kind: choice
        q: 「明鄉人」是指誰？
        options: [明朝派到越南的官員, 明朝滅亡後移居越南的華人與他們的後代, 從越南移民到明朝的人, 會安的日本商人]
        answer: 1
        explain: 明鄉人是明朝滅亡後南下越南的華人與後代，原寫「明香」，1827 年改為「明鄉」，阮朝時被當成越南人。
        hints: [名字裡有「明」，跟明朝有關。, 他們是往南走，不是往北走。]
        ref: building-hoi-an
      - kind: short
        q: 用一兩句話說明：為什麼說會安的漢字「不只屬於華人」？
        model: 因為越南自己長期用漢文當官方書面語，到 20 世紀才逐漸不用，越南人的匾額、寺廟也寫漢字，所以會安的漢字也是越南人自己的歷史。
        explain: 漢字不是只有華人在用；北屬時期以後，越南的官員和讀書人一直用漢文寫公文、考科舉、作詩。
        hints: [回去看越南文字卡：越南人用漢字用到什麼時候？, 會安卡的故事說「再加上越南自己長期用漢字」：寫匾額、寺廟漢字的，也可能是越南人。]
        ref: building-hoi-an
  - type: recap
    model_answer: 會安滿是中國建築和漢字，有好幾層原因。第一，明朝不准日本船進中國，中日商人就到會安碰面，華人和日本人各住一區；第二，日本 1630 年代鎖國，日本町消失，華商成了主角；第三，1644 年明朝滅亡，明朝遺民南下，成為明鄉人，華商也依家鄉組成福建、廣肇、潮州等會館；第四，越南自己長期用漢字。最後，河口淤積、港口移到峴港，會安沒落，老街反而原樣保存下來，1999 年成為世界遺產。
reflect: 你家附近有沒有一條老街、一座廟，是很久以前從外地來的人蓋的？試著查查看：他們為什麼來、後來又變成了什麼人？

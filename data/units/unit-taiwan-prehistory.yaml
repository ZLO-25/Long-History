    model_answer: |
      沒有文字的年代，是靠幾種不同的證據拼起來的，每一種都只回答一部分的問題。考古學者用遺址和遺物，排出長濱、大坌坑、圓山、卑南、十三行等文化的先後；用碳十四定年估計「距今多少年±誤差」，所以年代是估計，而且要看測的是哪一層。語言學者比較語言，看到南島語最早的幾個分支都在臺灣；遺傳研究發現南島語人群帶有和臺灣原住民族較近的祖先成分，也發現還有別的來源。各族自己的起源傳說，則是另一種性質的知識，說明他們怎麼理解自己的來歷，不是用來被考古「證明」或「推翻」的。
      年代各說不同，通常不是誰錯了：可能測的是不同層，說的是不同的事（出現鐵器、自己煉鐵、形成文化），或用了不同的方法；來源沒有說明原因的差異，就並列、不選邊。即使有了文字，像西拉雅人的例子，大部分記載也出自荷蘭人之手，要問「是誰寫的、為什麼寫」。另外，考古的「文化」是學者的分類，不等於族群；十三行人「很有可能」是凱達格蘭人的祖先，也只是推測。
      如果想看人群在臺灣怎麼一層一層來、語言和認同為什麼不一定一樣，可以接著讀「你家從哪裡來？」那一課。下一站，是文字紀錄開始變多的 17 世紀。
    points:
      - 沒有文字的年代靠多種證據：遺物與碳十四、語言、遺傳、口傳，各自只回答一部分的問題
      - 碳十四結果是「距今多少年±誤差」，是估計；要看測的是哪一層
      - 年代說法不同，可能是測的層、說的事或方法不同；來源沒說明原因的，就並列不選邊
      - 考古的「文化」不等於族群；起源傳說是各族的知識，不是被證明或推翻的對象；有文字也要問是誰寫的

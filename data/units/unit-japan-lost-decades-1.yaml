id: unit-japan-lost-decades-1
title: 日本失落 30 年（上）：泡沫怎麼吹起來、怎麼破掉
histories: [日本史, 錢的歷史]
mystery: 1989 年 12 月 29 日，日本股市的日經指數收在 38,915.87 點，當時還流傳「皇居的土地值整個加州」。幾年之內，股價和地價一路往下掉，日經指數要等到 2024 年 2 月才回到那個高點。錢是怎麼突然變得那麼多，又怎麼一下子不見的？
teaser: 一場在紐約飯店發表的聲明、一顆電腦記憶體晶片、一筆怎麼也收不回來的貸款。
goals:
  - 能說明 1985 年廣場協議讓日圓升值，以及它和日本低利率、泡沫的關係為什麼有爭議
  - 能說出泡沫時代「土地越貴、銀行越敢借」的循環，以及泡沫破掉後這個循環怎麼反過來
  - 能判讀廣場協議公報的一句原文，說出五國想讓什麼事發生
  - 能比較廣場協議與美日半導體協定這兩種「美國向日本施壓」的方式
  - 能說明「殭屍企業」是什麼，以及銀行拖延處理壞帳怎麼一路拖到 1997 年的倒閉潮
minutes: 40
steps:
  - type: hook
    text: |
      你借了一位同學 1,000 元，他拿一疊很熱門的球員卡給你當抵押，說：「這疊卡現在值 1,500 元，就算我還不出來，你也不會虧。」
      後來球員卡退流行，那疊卡只剩 300 元。同學說他下個月就能還，只要你再借他 200 元周轉一下。
      你會再借他，還是現在就認賠、把卡拿走？
      1990 年代日本的許多銀行，就碰上了這種選擇，只是金額大得多。我們先從錢為什麼會變得那麼「便宜」講起。
      這一課談到股價、地價和銀行，要先記得兩件事：事後看起來很清楚的事，當時的人不一定看得出來（後見之明）；我們讀到的多半是有名的大銀行、大公司留下的資料，許多小企業和一般家庭的經驗比較少被記下來（倖存者偏差）。本單元只是歷史學習，不構成投資建議。
  - type: card
    id: finance-plaza-accord
    depth: understand
    prompt: 1985 年 9 月，五個國家在紐約一家飯店發表一份聲明。注意：它想讓美元變貴還是變便宜？日圓後來怎麼了？「廣場協議害日本失落」這句話，史家怎麼吵？
  - type: source
    card: finance-plaza-accord
    idx: 0
    question: 這段 1985 年的五國公報，說他們希望發生什麼事？
    options:
      - 美元對其他主要貨幣升值
      - 日圓、馬克等主要的非美元貨幣，對美元有秩序地升值
      - 五個國家改用同一種貨幣
      - 日本必須把利率降到 2.5%
    answer: 1
    explain: 「main non-dollar currencies」是主要的非美元貨幣，「appreciation against the dollar」是對美元升值，也就是讓美元變便宜；「orderly」是有秩序、不要一下子暴衝；「desirable」是「可取的」，這是一種表態，不是有強制力的條約。讀的時候也要記得：這是五國政府共同發表的官方說法，只寫他們想要什麼，不會寫出日本國內後來的後果，更不能從這一句看出泡沫。
    hints:
      - 先讀括號裡的中文翻譯：是誰「升值」？（想挑戰的話，對照英文原文的 appreciation 這個字。）
      - 「非美元貨幣」是不是美元的錢，例如日圓、馬克；「對美元升值」是相對於美元變貴。
      - 選項裡有沒有哪一個，是這句話根本沒提到的事？
    ref: finance-plaza-accord#F3
  - type: card
    id: event-us-japan-semiconductor-1986
    depth: understand
    prompt: 一年後，美國又針對一個產業跟日本談判：電腦記憶體晶片（DRAM）。注意：1986 年時誰的市占率最高？協定要日本做哪兩件事？最後最大的受益者是誰？
  - type: compare
    cards: [finance-plaza-accord, event-us-japan-semiconductor-1986]
    prompt: 比一比兩次「美國向日本施壓」：一次談匯率，一次談晶片。
    rows:
      - aspect: 時間
        a: 1985 年 9 月 22 日發表；1987 年 2 月的羅浮宮協議改成讓匯率穩定在當時水準
        b: 1986 年 9 月 2 日簽署，1991 年續約五年，1996 年舊協定不再續約
      - aspect: 誰參加
        a: 美、日、西德、法、英五國的財政部長與央行總裁
        b: 美日兩國：美國貿易代表尤特與日本駐美大使松永信雄
      - aspect: 要處理什麼
        a: 美元太強、美國貿易赤字擴大、國會想用保護主義擋進口
        b: 美國 DRAM 市占率從約 70% 掉到 20%，美國業者指控日本市場封閉、日本晶片傾銷
      - aspect: 用什麼方法
        a: 宣示讓非美元貨幣有秩序地對美元升值，必要時一起干預匯市；不是有強制力的條約
        b: 日本開放市場（秘密附函提到外國晶片約占 20%）、通產省監控晶片價格；1987 年美國對價值 3 億美元的日本產品課關稅
      - aspect: 後來的結果
        a: 日圓兩年內約升值近一倍；日本放寬貨幣、擴大內需，被許多人連到後來的泡沫
        b: 日本 DRAM 份額從 1987 年的 75% 降到 2001 年的 20%，不受反傾銷措施約束的南韓在 1998 年超過日本
      - aspect: 學者怎麼看
        a: Frankel 指出美元在 1985 年初就已從高點回落，協議的角色可能被高估；利率怎麼調是日本自己的決定
        b: 研究多認為美國晶片業後來復甦主要靠自己的技術與設計，協定的功勞有限
    question: 這兩份協定常被說成「美國一手打垮了日本」。從表格來看，這個說法哪裡太簡單了？
    model_answer: 兩份協定確實都是美國在貿易赤字壓力下向日本施壓的結果，但都不是「美國一個人說了算」。廣場協議是五國共同發表，日本政府也同意，德國馬克同樣升值；之後利率要壓多低、壓多久，是日本自己的決定，學者對協議要負多少責任仍在吵。半導體協定之後，日本 DRAM 份額確實大跌，但最大的受益者是南韓，不是美國；日本晶片業衰退同時遇上泡沫破裂後的長期停滯，來源也沒有量化兩者的比重。所以比較好的說法是：外來壓力是背景之一，但日本國內怎麼回應，同樣重要。這題沒有標準答案，重點是不要把結果都歸給一個原因。
    hints:
      - 先看「誰參加」那一列：廣場協議只有美日兩國嗎？
      - 再看「後來的結果」：晶片市場最後是誰得利？
      - 看「學者怎麼看」：利率怎麼調，是誰決定的？
  - type: decision
    role: 你是 1990 年代一家日本大銀行的放款主管
    situation: |
      1980 年代後期利率很低，你的銀行和其他銀行一樣，大量借錢給企業投資土地和不動產，而且用土地當擔保品：土地越貴，就能借得越多。
      1990 年起股價大跌，地價隨後也一路往下掉。現在，一家向你們借了一大筆錢的公司已經付不出利息，它抵押的那塊地，也早就不值當初借出去的數字。
      如果現在承認這是收不回來的壞帳，銀行帳上會立刻出現一大筆虧損。可是全國的壞帳到底有多少，沒有人說得準；要政府拿稅金來救銀行，在政治上也很難說服民眾。
      先別急著看選項：如果你是這位主管，只知道這些，你會怎麼做？
    options:
      - label: 再借錢給這家公司，讓它先撐著，等地價回升
        result: 這是當年日本許多銀行的選擇。銀行和政府不願認賠，繼續借錢給已經資不抵債的企業，學者稱這些公司為「殭屍企業」；錢被困在沒有效率的公司裡，流不到有前途的公司。壞帳越拖越大，1997 年 11 月北海道拓殖銀行和山一證券相繼倒閉。
      - label: 現在就認賠，停止放款，讓這家公司倒閉或重整
        result: 推測：銀行帳上會立刻出現大筆虧損，自己的資本可能不夠，這家公司的員工和往來廠商也會先付出代價；但資金也許能比較早流向有生產力的公司。事後看「早點認賠」好像很明顯，但當時沒人知道壞帳有多少。歷史沒有走這條路，所以後果只能推測。
      - label: 請政府馬上拿稅金替銀行補資本，一次清掉壞帳
        result: 推測：要說服民眾拿稅金救銀行，在政治上很難，政府未必肯；就算肯，也不知道壞帳到底有多少、該補多少才夠。1990 年代前半的日本沒有走這條路，所以後果只能推測。
    actual: 日本許多銀行和政府選擇不認賠、繼續借錢給還不起的企業，壞帳的處理一路拖延。到了 1997 年 11 月，北海道拓殖銀行和山一證券相繼倒閉；政府在 1998 年和 1999 年兩度拿公共資金（1.8 兆日圓和約 7.5 兆日圓）替銀行補資本。學者認為問題一直拖到 2003 年經濟回升才好轉。
    ref: finance-japan-banking-crisis-1997#F3
    note: 「沒有發生的選項」的後果都是推測，標示清楚。泡沫卡的史家怎麼吵寫到「銀行不良債權的處理偏慢」、失落十年卡寫到殭屍企業，都會洩漏答案，所以三張日本國內的卡都放在決策之後；situation 只用泡沫卡 F3 的循環與金融危機卡 hindsight 的「沒人知道壞帳有多少、很難說服民眾」。
  - type: card
    id: finance-japan-bubble
    depth: understand
    prompt: 回頭看泡沫怎麼吹起來：日本銀行在 1987 年 2 月把利率降到多少？「利率低 → 借錢容易 → 地價上漲 → 擔保品變值錢」這個循環，後來為什麼會反過來轉？1990 年春天大藏省做了什麼？
  - type: card
    id: finance-japan-lost-decade
    depth: understand
    prompt: 泡沫破了以後：什麼叫「殭屍企業」？1991 到 2003 年日本經濟平均每年成長多少？學者對「為什麼停滯這麼久」有哪幾種解釋？
  - type: card
    id: finance-japan-banking-crisis-1997
    depth: understand
    prompt: 拖了七、八年的壞帳，終於在 1997 年 11 月爆開。注意：一家小券商倒閉，為什麼會讓一家大銀行周轉不過來？政府兩輪各補了多少錢？
  - type: chain
    prompt: 把下列事件依照「因 → 果」排成一條鏈（最上面是最早的原因）。
    items:
      - 1985 年廣場協議，日圓大幅升值
      - 日本擔心出口受傷，日本銀行在 1987 年 2 月把貼現率降到 2.5%
      - 便宜的錢流進股市和土地，銀行大量以土地為擔保放款
      - 1989 年 12 月 29 日，日經指數收在 38,915.87 點的高點
      - 日本銀行升息，大藏省在 1990 年春天限制銀行的不動產貸款（總量規制）
      - 股價、地價下跌，擔保品縮水，貸款變成收不回來的壞帳
      - 銀行繼續借錢給還不起的企業，壞帳一路拖延
      - 1997 年 11 月北海道拓殖銀行、山一證券相繼倒閉
    explain: 日圓升值後，日本怕出口受傷而把利率壓低（這一步的比重學者還在吵，不是唯一原因，金融自由化也很重要）。便宜的錢流進股市和土地，土地越貴、能借的錢越多，價格再往上推，1989 年底日經指數衝到最高點。日本銀行升息、大藏省限制不動產貸款後，循環反過來：股價先跌、地價跟著跌，擔保品縮水，貸款變成壞帳。銀行不願認賠，繼續借錢給還不起的企業，問題沒有消失只是拖長，到 1997 年 11 月一家券商倒閉引發骨牌，大銀行和大券商接連倒下。
    hints:
      - 最早的原因在國外：匯率。
      - 先「吹起來」（低利率、借錢、高點），再「轉過來」（升息、限制貸款）。
      - 倒閉潮是在壞帳拖了好幾年之後。
    ref: finance-japan-bubble#F3
  - type: today
    card: finance-japan-bubble
    question: 有人說：「只要一個地方的房價漲很多，就一定會像日本 1990 年那樣崩盤，然後失落三十年。」這個說法哪裡不成立？
    model_answer: 先說不能類比的地方：1980 年代的日本是出口導向、以銀行借錢為主的經濟體，主要銀行和企業關係很緊密，銀行又大量用土地當擔保放款；今天許多國家的金融體系更依賴資本市場，結構不一樣。日本泡沫破掉以後，又碰上人口老化和全球環境改變，這些條件別的地方未必有。所以不能把日本的經驗當成別的地方的預言。可以借來想的是一個結構：低利率和寬鬆的貸款推高「可以拿來當擔保品的資產」，資產變貴又讓大家借得更多；一旦政策轉向或信心改變，循環就會反過來。另外也可以注意：泡沫破掉以後，銀行是早點認列損失，還是繼續借錢給還不起的人，會影響問題拖多久。
  - type: check
    items:
      - kind: choice
        q: 學者說的「殭屍企業」是什麼意思？
        options: [本來應該倒閉、只靠銀行一直借新錢還舊債才活著的公司, 專門做恐怖片的電影公司, 被政府收歸國有的銀行, 在泡沫時代買下美國大樓的日本公司]
        answer: 0
        explain: 泡沫破掉後，受傷的銀行為了不在帳上認列損失，繼續借錢給還不起的企業，這些公司就像「死了卻還在走路」；錢被困在裡面，排擠了有生產力的公司。
        hints: [殭屍是「已經死了，卻還在走動」。, 想想決策題裡那家付不出利息的公司。]
        ref: finance-japan-banking-crisis-1997#F3
      - kind: order
        q: 依時間先後排列：
        items: [廣場協議發表, 美日半導體協定簽署, 日本銀行把貼現率降到 2.5%, 日經指數創下泡沫時代高點, 大藏省實施不動產貸款「總量規制」, 北海道拓殖銀行宣布放棄經營]
        explain: 1985 年 9 月 22 日廣場協議 → 1986 年 9 月 2 日半導體協定 → 1987 年 2 月貼現率降到 2.5% → 1989 年 12 月 29 日日經指數高點 → 1990 年春天（3 月通達、4 月實施）總量規制 → 1997 年 11 月 17 日拓銀宣布放棄經營。
        hints: [廣場協議和半導體協定都在 1987 年以前。, 總量規制是在日經指數高點之後，泡沫開始破的時候。]
        ref: finance-japan-bubble#F3
      - kind: short
        q: 用一兩句話說明：為什麼泡沫時代「土地越貴，銀行越敢借」，到了泡沫破掉卻變成大麻煩？
        model: 因為銀行用土地當擔保品放款，土地越貴就能借越多；泡沫破掉後地價下跌，擔保品不值當初借出去的錢，借款人又還不出來，貸款就變成收不回來的壞帳，銀行也更不敢放款。
        explain: 同一個循環可以往上推，也可以往下拉：推高價格的「擔保品變值錢」，反過來就變成「擔保品縮水」。
        hints: [回去看泡沫卡「怎麼運作」那一段的「正向循環」和「反向循環」。, 擔保品是借錢時抵押給銀行的財產。]
        ref: finance-japan-bubble#F3
  - type: recap
    model_answer: 1985 年廣場協議讓日圓大幅升值，日本擔心出口受傷，日本銀行在 1987 年把利率降到 2.5%，並維持低利率到 1989 年。便宜的錢流進股市和土地，銀行用土地當擔保大量放款，土地越貴借得越多，1989 年 12 月 29 日日經指數衝到 38,915.87 點。同一時期，美國也用半導體協定在晶片上向日本施壓。日本銀行升息、大藏省限制不動產貸款後，循環反轉：股價、地價下跌，擔保品縮水，貸款變成壞帳。銀行和政府不願認賠，繼續借錢給「殭屍企業」，問題一路拖到 1997 年 11 月拓銀和山一證券倒閉，政府才兩度拿公共資金救銀行。要記得兩個提醒：第一，「廣場協議害了日本」只是說法之一，利率怎麼調、壞帳怎麼處理，都是日本自己的選擇；第二，事後看「早點認賠」很明顯，但當時沒人知道壞帳到底有多少。這是一種參考說法，不是標準答案。
reflect: 日本的銀行面對一筆收不回來的錢，選擇「再等等看，也許會好轉」。你有沒有遇過一件已經出問題的事（一次考壞的科目、一段卡住的關係、一個做不下去的計畫），你是早點承認、重新來過，還是一直拖著希望它自己變好？拖延的代價，是誰在付？

id: unit-athens-sparta
title: 雅典與斯巴達：強權為什麼會開戰？
histories: [希臘羅馬史, 世界通史]
mystery: 一個國家變強，鄰國一定會害怕，最後一定會開戰嗎？
teaser: 兩千四百年前的一句話，今天還被拿來預測大國會不會打仗。
goals:
  - 能分清楚戰爭的「長期結構原因」和「直接導火線」
  - 能判讀一段修昔底德的敘述，說出它是誰的觀點
  - 能比較希臘和中國春秋時代兩場「盟主之戰」的異同
  - 能指出把古代戰爭類比今天時，哪裡不成立
minutes: 30
level: 皆可
curriculum: []
steps:
  - type: hook
    text: |
      想像你們學校有兩個很強的社團：一個人數最多、最會比賽；另一個本來很小，這幾年突然變得很有錢、很多人加入。
      老社團的社長開始緊張：「他們會不會搶走我們的地位？」
      兩千四百年前的希臘，就發生了很像的事，只是社團換成了兩個城邦，結局是一場打了 27 年的戰爭。
    guess:
      q: "雅典越變越強、斯巴達越來越怕。你猜：這場戰爭是不是「注定」會發生？"
      options:
        - "一定會。只要一個國家變強，鄰國就會害怕，最後非打不可"
        - "不一定。只要雙方領導人肯讓步，就有機會避免"
        - "不一定。只要沒有第三方出錢出力，雙方就打不起來"
        - "一定會。因為兩個城邦的制度不同，本來就是死對頭"
      reveal: "史家看法不同。修昔底德認為雅典變強、斯巴達害怕，讓戰爭「無可避免」；但耶魯史家卡根認為雙方其實都不想打，只是都不肯讓步，是人的選擇把雙方推進戰爭。"
  - type: card
    id: war-greco-persian
    depth: story
    prompt: 先看雅典是怎麼變強的：注意那筆「意外的錢」。
    focus: [A6]
    quick:
      - q: 雅典挖到意外的銀礦收入，為什麼沒有把錢分給大家？
        a: 地米斯托克利說服大家，把錢拿去造戰船、擴建艦隊（名義上是對付鄰近的埃伊納島）。這支新艦隊後來成為薩拉米斯海戰打敗波斯的主力。
      - q: 薩拉米斯海戰裡，波斯船比較多，為什麼反而輸了？
        a: 希臘人把波斯艦隊引進狹窄的薩拉米斯海峽。船多的一方擠在一起，反而施展不開。
  - type: card
    id: commodity-laurion-silver
    depth: story
    prompt: 雅典的錢從哪裡來？誰在礦坑裡工作？
    focus: [B3]
    quick:
      - q: 勞里昂的礦坑裡是誰在工作？承租礦場的老闆怎麼取得人手？
        a: 勞力幾乎都是奴隸。承租礦場的人多半向奴隸主「租」奴隸，約每天每人 1 歐布爾；奴隸死了或逃跑，承租者還要補人。
      - q: 約前 483 年挖到的那條豐富礦脈，後來變成了什麼力量？
        a: 錢拿去造約 200 艘戰船（另一說 100 艘），這支艦隊打贏波斯，雅典從此成為海上霸主。
  - type: card
    id: war-peloponnesian
    depth: understand
    prompt: 讀「起因：結構與導火線」時，試著把原因分成兩堆：很久以前就存在的，和最後點燃戰爭的。
    focus: [A2]
    quick:
      - q: 墨伽拉法令為什麼被算成「導火線」，而不是長期原因？
        a: 它是戰前不久發生的一件具體事件：前 433/432 年雅典對墨伽拉實施貿易禁令。修昔底德說的深層原因則是雅典變強、斯巴達害怕。不過也有部分史家把這道法令看成主因。
      - q: 斯巴達原本沒有錢造艦隊，最後怎麼在海上贏過雅典？
        a: 斯巴達拿波斯給的錢建艦隊，在羊河摧毀雅典艦隊，掐斷雅典的糧道。前 404 年，雅典投降。
  - type: source
    card: war-peloponnesian
    idx: 0
    question: 修昔底德這句話，最能說明下列哪一件事？
    options:
      - 戰爭只是因為墨伽拉法令這件小事引起的，沒有任何更深的原因
      - 斯巴達的領袖親口承認，他們害怕雅典變得太強
      - 修昔底德認為表面爭端底下，有更深的原因：權力消長和恐懼
      - 這是雅典和斯巴達在戰前簽訂的和約中寫下的內容
    answer: 2
    explain: 這句話是修昔底德自己的判斷，不是斯巴達人說的話，也不是條約。他把「雅典變強＋斯巴達害怕」當成真正的原因，把科西拉、波提狄亞等爭端看成表面的導火線（墨伽拉法令他只是順帶一提）。讀史料時先問：「這是誰說的？他想說服誰？」
    hints:
      - 先看句子的主詞：誰變強了？誰感到害怕？
      - 這句話是寫歷史的人（修昔底德）的判斷，還是當事人的原話？
      - 「made war inevitable」的意思是「讓戰爭無法避免」，它在講的是原因的深淺。
    why_wrong:
      - 墨伽拉法令只是表面的導火線之一；修昔底德要說的，是表面爭端底下更深的原因。
      - 這是修昔底德自己寫在書裡的判斷，不是斯巴達人親口說的話。
      - null
      - 這是史書裡的一句話，不是雅典和斯巴達簽的條約。
    critique:
      question: 修昔底德寫「戰爭無可避免」。這句話能證明什麼、不能證明什麼？
      options:
        - 能證明他這樣解釋戰爭的原因，但不能證明戰爭真的無法避免
        - 能證明戰爭真的無法避免，因為他是當時的人，寫下的就是事實
        - 能證明斯巴達的領袖私下承認過害怕雅典，所以斯巴達是被迫出兵
        - 什麼都不能證明，因為這句話是翻譯來的，和他原本的想法沒有關係
      answer: 0
      explain: 這句話是修昔底德自己的判斷，能讓我們知道「他怎麼看」。但「無可避免」是一種詮釋：卡根認為雙方其實都不想打，只是都不肯讓步。所以它是重要的證據，卻不能直接當成「戰爭一定會發生」的證明。
      why_wrong:
        - null
        - 他是當時的人沒錯，但這是他的判斷；卡根就提出不同看法，所以不能直接當成事實。
        - 這句話是修昔底德自己的看法，卡片沒有記載斯巴達領袖私下承認過什麼。
        - 這句話是中文摘譯自英譯本，但意思是清楚的；它能告訴我們他怎麼看，只是不能當成定論。
    ref: war-peloponnesian#A2
  - type: chain
    prompt: 把下列事件依照「因 → 果」排成一條鏈（最上面是最早的原因）。
    items:
      - 雅典在勞里昂挖到豐富銀礦，拿錢造艦隊
      - 雅典艦隊在薩拉米斯打敗波斯
      - 雅典成為提洛同盟的盟主，收取盟邦貢金
      - 斯巴達對雅典的擴張感到警戒
      - 伯羅奔尼撒戰爭爆發
    followup:
      question: 這條鏈的最後一步，從「斯巴達警戒」走到「戰爭爆發」，卡根和修昔底德的看法有什麼不同？
      options:
        - 卡根認為中間還有人的選擇：雙方都不肯讓步，才走到開戰
        - 卡根認為斯巴達其實不警戒，戰爭完全是雅典單方面發動的
        - 卡根認為只要壓力累積得夠久，戰爭就一定會發生，和修昔底德一樣
        - 卡根認為真正的原因是兩個城邦的文化不同，和雅典變強沒有關係
      answer: 0
      explain: 修昔底德認為雅典變強加上斯巴達的恐懼，讓戰爭無可避免。卡根不同意：他認為雙方其實都不想打，但都不肯讓步，伯里克里斯也低估了斯巴達的憤怒與恐懼。所以這條鏈說明的是「壓力怎麼累積」，不是「一定會打」。
      why_wrong:
        - null
        - 卡根沒有說斯巴達不警戒；他說的是伯里克里斯低估了斯巴達的憤怒與恐懼。
        - 這是修昔底德的說法；卡根正是不同意「注定」。
        - 卡片裡卡根談的是雙方領導人的判斷與讓步，不是文化差異。
    explain: 銀礦 → 艦隊 → 打敗波斯 → 成為同盟盟主並收錢 → 引起斯巴達警戒 → 開戰。每一步都讓雅典更強，也讓斯巴達更不安。注意：這條鏈說明「壓力怎麼累積」，但不代表每一步都「必然」導向下一步。
    hints:
      - 先找出最早發生、而且跟「錢」有關的事件。
      - 雅典要先有艦隊，才可能打贏海戰；打贏海戰之後，其他城邦才會找它當盟主。
      - 最後兩步：先有「害怕」，才有「開戰」。
    ref: war-peloponnesian#A2
  - type: card
    id: war-chengpu
    depth: story
    prompt: 同一個時代的中國也有「兩大集團」對決。讀完想想看：哪裡像？哪裡不像？
  - type: compare
    cards: [war-peloponnesian, war-chengpu]
    prompt: 比一比兩場「盟主之戰」。
    rows:
      - { aspect: 時間, a: 前 431–404 年（打了 27 年）, b: 前 632 年（一天決勝的會戰） }
      - { aspect: 對手, a: 雅典帶提洛同盟 vs 斯巴達帶伯羅奔尼撒同盟, b: 晉國帶齊、秦、宋 vs 楚國帶陳、蔡 }
      - { aspect: 結果, a: 雅典投降，艦隊只剩 12 艘, b: 晉文公成為霸主，楚國沒有因此衰落 }
      - { aspect: 誰寫的歷史, a: 雅典人修昔底德（他自己參過戰）, b: 《左傳》等後代整理的書，不同古書說法不一 }
    question: 兩場戰爭最大的相同點和最大的不同點各是什麼？
    model_answer: 相同點：都是兩大集團各帶一批盟友，爭奪「誰當老大」。不同點：伯羅奔尼撒戰爭是長期消耗戰，最後靠瘟疫、遠征失敗和波斯的錢分出勝負；城濮是一場會戰就定勝負，而且春秋霸主名義上還要尊周天子。另外，兩邊留下的史料性質也不一樣，要小心比較。
    points:
      - 相同點：都是兩大集團各帶一批盟友，爭奪「誰當老大」
      - 伯羅奔尼撒戰爭是長期消耗戰，靠瘟疫、遠征失敗和波斯的錢分出勝負
      - 城濮是一場會戰就定勝負，春秋霸主名義上還要尊周天子
      - 兩邊留下的史料性質不同，比較時要小心
    hints:
      - 先看表格裡的「對手」那一列，兩邊的結構像不像？
      - 再看「時間」和「結果」：打多久、輸的一方怎麼了？
      - 最後想想「誰寫的歷史」會不會影響我們看到的版本。
  - type: decision
    role: 你是前 415 年的雅典將軍
    situation: |
      戰爭打到一半，雙方簽了和約，但都沒有真正遵守。西西里島上的盟邦塞傑斯塔來求救，請雅典幫忙對付鄰城塞利努斯，還答應出錢。
      公民大會上，年輕的阿爾西比亞德斯熱烈主張：趁機出兵，說不定能拿下整個西西里，連富庶的敘拉古都是雅典的；老將尼西阿斯警告：西西里太遠了，斯巴達還在旁邊虎視眈眈。你要怎麼投票？
    options:
      - { label: 支持大規模遠征西西里, result: "這正是雅典當年的選擇。兩批共約 200 艘船、上萬名士兵出發，前 413 年全軍覆沒，約 7,000 名俘虜被關進採石場，很多人病死、餓死；雅典人和西西里、義大利的希臘人被繼續關押，其餘俘虜則被賣為奴隸。" }
      - { label: 反對遠征，守住本土和海上糧道, result: 推測：雅典可以保住艦隊和兵力，但西西里的資源也拿不到；戰爭可能拖得更久。歷史沒有走這條路，所以後果只能推測。 }
    actual: 雅典選擇了遠征，結果慘敗。同一時間斯巴達在阿提卡築堡常駐，上萬名奴隸逃走，銀礦受損；波斯又開始出錢幫斯巴達建艦隊。遠征的失敗成為雅典最後投降的重要原因之一。
    ref: war-peloponnesian#A7
    note: 「沒有發生的選項」的後果都是推測，標示清楚。
  - type: today
    card: war-peloponnesian
    question: 有人說「今天的大國競爭就是現代版的雅典與斯巴達」。這個類比哪裡不成立？
    model_answer: 至少三點：一、古代沒有核武，今天大國開戰的代價完全不同；二、今天各國經濟互相依賴得多，雅典和斯巴達沒有這種程度的貿易網絡；三、雅典輸掉的關鍵包括瘟疫和西西里遠征這些自己的決定，不能只用「崛起對老大」來解釋。所以類比可以幫我們提問，但不能拿來預測結果。
    points:
      - 古代沒有核武，今天大國開戰的代價完全不同
      - 今天各國經濟互相依賴，雅典和斯巴達沒有這種程度的貿易網絡
      - 雅典輸掉有瘟疫和西西里遠征等自己的決定，不能只用「崛起對老大」解釋
      - 類比可以幫我們提問，但不能拿來預測結果
  - type: check
    items:
      - kind: choice
        q: 下列哪一個是伯羅奔尼撒戰爭的「導火線」，而不是長期結構原因？
        options: [雅典對墨伽拉實施貿易禁令, 斯巴達對雅典的勢力越來越害怕, 雅典重建保護港口的那兩道長牆, 雅典以盟邦的貢金擴建艦隊]
        answer: 0
        explain: 墨伽拉法令是戰前發生的具體事件，屬於導火線；雅典變強、斯巴達害怕、用貢金建艦隊，則是長期累積的結構。
        hints: [導火線通常是一件「具體、時間很近」的事。, 哪一個選項有明確的命令或決定？]
        why_wrong:

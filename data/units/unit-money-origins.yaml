id: unit-money-origins
title: 錢是怎麼發明的？從神廟借據、第一枚硬幣到巴格達的支票
histories: [錢的歷史, 世界通史, 歐洲史, 中國史]
mystery: 我們習慣把「錢」想成一枚枚硬幣。可是歷史上，是先有硬幣，還是先有「我欠你」的借據？從泥板、金屬塊、硬幣到書面付款命令，錢是怎麼一步步變成今天這樣的？
teaser: 在第一枚硬幣出現之前，泥板上就已經在寫利息、債務奴役和「歉收就免還」；後來有的錢穩定了幾百年，有的被一點一點減值。
goals:
  - 能說出「信用（借貸記錄）比硬幣更早」這個說法有哪些證據，以及要小心哪些地方
  - 能判讀一手史料的一句話，說出它能證明什麼、不能證明什麼
  - 能比較呂底亞鑄幣與漢朝五銖錢這兩個各自發展的貨幣
  - 能比較索利都斯與第納里烏斯，說出卡片能支持哪些「穩定或減值」的說法
  - 能分辨後見之明與倖存者偏差，不把歷史當成投資建議
minutes: 50
steps:
  - type: hook
    text: |
      你有沒有幫同學先墊過午餐錢，然後說「下次還我」？
      那一刻沒有人拿出硬幣，只有一句「我欠你」。
      這個單元要問：歷史上，是先有硬幣，還是先有「我欠你」？
      一路走下來，我們會看到泥板、金屬塊、硬幣和書面付款命令。
      談錢的單元要特別小心：我們看到的多半是留下來的故事，而且事後看起來很清楚的事，當時的人並不清楚。本單元只是歷史學習，不構成投資建議。
  - type: card
    id: finance-mesopotamia-credit
    depth: deep
    prompt: 先回到沒有硬幣的時代。注意泥板上記了什麼、還不起債時有什麼規定；也讀「史家怎麼吵」：法典的條文，等於當時每個人都照做嗎？
  - type: source
    card: finance-mesopotamia-credit
    idx: 0
    question: 《漢摩拉比法典》第 117 條寫著「第四年就要被釋放為自由人」。這句話最能說明什麼？
    options:
      - 還不起債的人，一輩子都要當債主的奴隸
      - 因債務賣身的人只要做三年，第四年就要放自由，債務奴役有期限
      - 國王會把所有人的債務一筆勾銷
      - 這條法律證明當時每個人都照著做
    answer: 1
    explain: 這一條的前半是：因為還不起債而賣掉自己、妻子或兒女（或交出去做工）的人，要在買主家工作三年，第四年放自由。它說明當時已經有「還不起怎麼辦」的規則，也說明借貸早在鑄幣出現之前就是大問題。但要小心：有學者質疑法典是否真的被當作法規逐條執行，所以條文不能直接當成當時的日常現實。
    hints:
      - 先看這句話前面的條件：是什麼樣的人會被「釋放」？
      - 注意「第四年」，前面還有一段「做幾年」？
      - 這是一條法律條文，條文寫了，就代表每個人都照做嗎？回去看「史家怎麼吵」。
    ref: finance-mesopotamia-credit#F3
  - type: card
    id: finance-lydian-coinage
    depth: deep
    prompt: 現在才輪到硬幣。注意最早的鑄幣是用什麼材料做的；再讀「史家怎麼吵」：最早的鑄幣是誰的、什麼時候？
  - type: source
    card: finance-lydian-coinage
    idx: 0
    question: 希羅多德寫道，呂底亞人是「就我們所知」最早鑄用金銀幣、也最早開零售店的人。怎麼讀這句話最穩妥？
    options:
      - 這句話證明呂底亞一定是世界上最早鑄幣的地方
      - 這是一位古代作者「就他所知」的說法；現代研究多把最早的琥珀金幣定在前 7 世紀晚期，但確切年代不易確定，愛奧尼亞也很早發行
      - 這句話證明克羅伊斯是鑄幣的發明人
      - 這句話說明最早的鑄幣是純金幣
    answer: 1
    explain: 希羅多德自己加了「就我們所知」，不是肯定地說一定最早。而且出土的最早鑄幣是天然合金琥珀金打成的，不是純金或純銀；克羅伊斯被聯繫到的是後來的純金幣與純銀幣。
    hints:
      - 先看句子裡的限制語：「就我們所知」。
      - 回想卡片：最早的幣是用什麼材料做的？是希羅多德說的「金銀幣」嗎？
      - 卡片的「史家怎麼吵」提到「呂底亞獨自發明」與「呂底亞與愛奧尼亞共同發展」兩種說法，這句話能不能分出勝負？
    ref: finance-lydian-coinage#F2
  - type: card
    id: commodity-wuzhu-coin
    depth: story
    prompt: 換到東方。注意「五銖」的「銖」是什麼意思，以及鑄幣權後來由誰掌握。
  - type: compare
    cards: [finance-lydian-coinage, commodity-wuzhu-coin]
    prompt: 西亞的呂底亞和東亞的漢朝，各自做出了金屬貨幣。比一比它們。
    rows:
      - aspect: 大約什麼時候
        a: 最早的琥珀金幣約在前 7 世紀晚期（年代有爭議）；克羅伊斯約前 560–546 年在位時改發純金幣與純銀幣
        b: 前 118 年漢武帝發行五銖錢，前 113 年鑄幣權收歸中央
      - aspect: 材料與樣子
        a: 起初是天然金銀合金（琥珀金），金、銀比例不固定，壓上獅頭等圖案；後來有純金幣與純銀幣
        b: 銅鑄的圓形方孔錢，面文「五銖」，一枚約 4 公克
      - aspect: 價值怎麼來
        a: 價值主要來自金屬本身，發行者的印記保證重量與成色
        b: 鑄幣權由上林三官掌握，官定一斤黃金兌一萬枚五銖錢
      - aspect: 彼此有沒有關係
        a: 卡片未查到與中國直接傳播的證據
        b: 中國在春秋至戰國時期就有自己的布幣、刀幣（起源年代有討論），五銖是後來的發展
    question: 兩地都出現了金屬鑄幣，能不能因此說中國是從呂底亞學來的？
    model_answer: 不能這樣說。呂底亞卡明說未查到兩者直接傳播的證據，一般視為各自獨立發展；中國又有自己的布幣、刀幣傳統，五銖錢是這個傳統之後的產物，材料（銅對金銀合金）和時間也不同。兩邊相似的地方，是都把金屬做成規格固定的錢，並由發行者（君主或朝廷）來保證，可以推測這是不同社會面對類似的交易問題時，想出的類似辦法。但要注意：「卡片來源沒查到交流」不等於「證明沒有交流」，只能說目前的證據傾向獨立發展。
    hints:
      - 看最後一列「彼此有沒有關係」，兩張卡各怎麼說？
      - 中國在五銖之前，已經有什麼樣的錢？
      - 相似不等於傳播。想想：兩個地方都需要「不用每次秤重」，會不會各自想出辦法？
  - type: card
    id: commodity-laurion-silver
    depth: story
    prompt: 鑄幣傳到希臘後，雅典用的銀從哪裡來？注意貓頭鷹銀幣。
  - type: card
    id: finance-athens-trapezitai
    depth: deep
    prompt: 有了銀幣，就有人專門「經手錢」。注意 trapezitai 做哪幾件事，還有那種「船沉了就不用還」的貸款；也讀一讀這些生意是靠什麼史料才被我們知道的。
  - type: decision
    role: 你是雅典的放款人
    situation: |
      有位商人想出海運貨，可是手上的錢不夠。他請你借錢給他，並用船和貨物作抵押。
      你不知道這趟航程會不會順利：船要是沉了，貨全毀，他就不必還錢。
      你要借嗎？
    options:
      - label: 借，但利息要收得比一般借貸高
        result: 這就是海上借貸的做法。航程順利，借款人還本付息；如果船貨全毀，放款人承擔損失，所以利率要比一般借貸高，作為風險的補償。
      - label: 不借，等商人自己湊到錢再說
        result: 推測：雅典有人真的做了海上借貸，沒有走這條路的人，史料不會替他留下紀錄，所以後果只能推測。你不必承擔船沉的損失，但也賺不到高利息；而沒有足夠資金的商人，也就少了一條出海的路。
    actual: 雅典的 trapezitai 換錢、收存款、放款，海上借貸讓沒有足夠資金的商人也能出海。這些生意留在德摩斯梯尼等人的訴訟演說裡，是我們了解它的主要史料。但演說是訴訟一方的說法，而且留下紀錄的多半是出了糾紛的案例，不能直接當成所有借貸的樣子。
    ref: finance-athens-trapezitai#F3
    note: 這是歷史情境。沒有發生的選項後果都是推測，也不構成投資建議。
  - type: card
    id: finance-roman-argentarii
    depth: deep
    prompt: 往羅馬走。注意 argentarii 做什麼、西元 33 年發生了什麼事，以及第納里烏斯的含銀量後來怎麼了。
  - type: chain
    prompt: 把西元 33 年的羅馬信用危機，依發生順序排成一條鏈（最上面是最早的）。
    items:
      - 告發者指控放貸人違反舊的放貸與土地持有規定
      - 元老院給債務人一段寬限期
      - 債主急著收回貸款，市面現金短缺，土地價格下跌
      - 提比略從國庫拿出一億塞斯特斯，分配給各家銀行
      - 有田產擔保的人可無息借三年，信貸才逐漸恢復
    explain: 導火線是告發與寬限期，讓債主急著收錢，現金一短缺，田價就下跌；最後是皇帝出手提供流動性。這筆錢是借款，不是白送：三年無息，借款人要用雙倍價值的田產擔保。另外，這段故事主要來自塔西佗一位作者，而且他寫的時候離事件約八十年，我們讀到的是「撐過去」的版本，不要因此高估當時救市的把握。
    hints:
      - 先找事情的導火線：是誰指控了誰？回到卡片的 F5 找這一段。
      - 債主為什麼突然急著收回貸款？收回貸款之後，市面上的現金會怎樣？告發之後、債主收錢之前，元老院還做了一件事。
      - 皇帝出手是最後一步，錢要借給有什麼條件的人？
    ref: finance-roman-argentarii#F5
  - type: sim
    sim: debase
    prompt: 動手玩玩看：把銀幣的含銀量減少，政府短期好像多出了錢，之後會發生什麼事？想一想第納里烏斯從尼祿時代起含銀量降低，和這個模擬有什麼相通的地方。
  - type: card
    id: finance-byzantine-solidus
    depth: deep
    prompt: 再看一種穩定很久的金幣。注意它被叫做「中世紀美元」，也讀「常被誇大」的地方：它真的七百年從不貶值嗎？
  - type: source
    card: finance-byzantine-solidus
    idx: 0
    question: 6 世紀的商人科斯馬斯寫道，羅馬金幣「從地球的這一頭到那一頭，處處都肯收」。讀這句話要特別注意什麼？
    options:
      - 它證明索利都斯在世界每個角落都通行
      - 這是一位遠航商人對它信用的稱讚，「處處通行」是形容；實際範圍以地中海、西亞與周邊地區為主
      - 它證明索利都斯從來沒有被減值過
      - 它說明索利都斯是 1092 年才推出的
    answer: 1
    explain: 科斯馬斯是 6 世紀、曾遠航到印度洋一帶的商人，他的話說明這種金幣在當時很受信任。但「全世界都用」是比喻性的說法；中國、印度一帶有沒有出土真品或仿品，卡片來源不足，不能直接寫成事實。
    hints:
      - 先看寫這句話的人是誰、什麼時候寫的。
      - 「從這一頭到那一頭」是精確的統計，還是誇張的形容？
      - 回去看卡片「常被誇大」那一段：實際範圍以哪裡為主？
    ref: finance-byzantine-solidus#F3
  - type: compare
    cards: [finance-byzantine-solidus, finance-roman-argentarii]
    prompt: 一個是羅馬帝國後來延續的金幣，一個是羅馬的銀幣。比一比它們。
    rows:
      - aspect: 什麼時候推出
        a: 約 309–312 年（卡片依一份來源寫約 312 年，309 年的說法來自其他文獻）
        b: 約前 211 年，第二次布匿戰爭期間
      - aspect: 標準
        a: 金幣，約 4.5 克，是一羅馬磅黃金的七十二分之一
        b: 銀幣，起初約 4.5 公克（估計），之後各時期重量與含銀量不同
      - aspect: 成色後來怎麼了
        a: 11 世紀 1030 年代起逐步減值，中期以後加速；1092 年被新金幣 hyperpyron 取代
        b: 尼祿在 64 年降低重量與含銀量；215 年的安敦尼尼安幣面額是 2 第納里烏斯、銀含量卻只約 1.5 倍；三世紀中期含銀量只剩百分之幾（估計）
      - aspect: 卡片提到的壓力
        a: 1071 年曼齊克特之戰後失去安納托利亞大片土地，財政與軍事壓力加重
        b: 常見說法連到軍隊、重建等支出需求，但動機與各階段的程度學界仍有討論
    question: 為什麼索利都斯被說成「穩定很久」，第納里烏斯卻成了「減銀」的例子？卡片能支持哪些說法？
    model_answer: 先要提醒：卡片並沒有給出完整的原因，不能說某一個政權比較聰明。卡片能支持的是：索利都斯固定重量、固定成色，帝國又用金幣收稅、發薪與支付對外款項，西羅馬滅亡後東方也持續鑄造，從 4 世紀到 11 世紀初維持了相對穩定，到 1030 年代才逐步減值，1071 年之後壓力更大。第納里烏斯則是從尼祿時代起降低重量與含銀量，到三世紀大幅下滑，常見說法把它連到國家的支出需求。兩者的共同點，是減值都和國家的財政或軍事壓力連在一起。而且「七百年從不貶值」並不精確，當時的人也不知道哪一次減值會變成不可逆的轉折，這是後見之明要小心的地方。
    hints:
      - 先看「成色後來怎麼了」那一列，兩種錢各自什麼時候開始減值？
      - 兩張卡各自提到什麼壓力？
      - 回去看拜占庭卡「常被誇大」的那一段：「七百年從不貶值」精確嗎？
  - type: card
    id: finance-abbasid-sakk-hawala
    depth: deep
    prompt: 商人不想扛著金銀幣長途旅行，怎麼辦？注意 sakk、hawala，也讀「史家怎麼吵」：sakk 真的是「最早的支票」嗎？
  - type: today
    card: finance-byzantine-solidus
    question: 羅培茲把索利都斯稱為「中世紀的美元」。有人因此想用它的故事，推測今天的美元會不會失去地位。這樣類比哪裡不成立？
    model_answer: 不能這樣類比。索利都斯是實體金幣，價值直接來自黃金的重量，沒有今天的央行、紙鈔、利率政策或浮動匯率；它的信用建立在皇帝對成色的維持，不是今天的金融市場與國際機構；它流通的世界規模也遠小於今天的全球金融體系，「中世紀美元」只是一個比喻。而且我們今天記得的是「七百年金幣」這個成功故事，容易有倖存者偏差。可以借來思考的只有：一種貨幣的信任，靠固定的成色與國家的財政一起維持，一旦減值，這份信任可能慢慢被消耗。這只是看結構，不是預測。本單元不構成投資建議。
  - type: check
    items:
      - kind: choice
        q: 下列哪一項最能支持「信用（借貸記錄）比硬幣更早」？
        options:
          - 呂底亞發行了最早的琥珀金幣
          - 美索不達米亞的泥板記下借大麥、借白銀的約定，法典也規定了債務與利息，而當時還沒有鑄幣，白銀是稱重付款
          - 雅典的 trapezitai 替人換錢
          - 阿拔斯的巴格達出現 sakk
        answer: 1
        explain: 美索不達米亞的泥板與法典年代約前 3000 年到前 1595 年，那時白銀是稱重付款；鑄幣要到約千年後的呂底亞才出現。但要記得：留下來的泥板是零散保存的樣本，不能推算當時借貸的總量。
        hints:
          - 想想哪個例子發生在「還沒有硬幣」的時代。
          - 白銀在那時是怎麼付款的？
        ref: finance-mesopotamia-credit#F1
      - kind: order
        q: 依時間先後排列：
        items:
          - 呂底亞打出最早的琥珀金幣（約前 7 世紀晚期）
          - 羅馬開始鑄造第納里烏斯（約前 211 年）
          - 漢武帝發行五銖錢（前 118 年）
          - 君士坦丁推出索利都斯（約 309–312 年）
          - 巴格達建城（762 年）

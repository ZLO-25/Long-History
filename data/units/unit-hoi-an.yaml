id: unit-hoi-an
title: 會安古鎮：越南的老街，為什麼滿是中國建築和漢字？
histories: [越南史, 東南亞史, 日本史]
mystery: 到越南會安玩，招牌、廟宇、會館寫的都是漢字，屋子看起來像臺南老街。這裡明明是越南，為什麼會這樣？
teaser: 一座河口小鎮，因為明朝的一道禁令，成了華人、日本人和越南人一起做生意的港口；又因為日本鎖國和明朝滅亡，變成滿街漢字的老街。
goals:
  - 能說出讓會安滿是漢字的三個外部原因：明朝不准日本船進中國、日本鎖國、明朝滅亡
  - 能判讀一段 17 世紀中國僧人對會安的記載，說出當時住在大唐街的是什麼人
  - 能說明會安的漢字為什麼不只屬於華人，也屬於越南人自己
  - 能比較明朝遺民去越南和去臺灣（鄭成功）的不同結局
minutes: 25
steps:
  - type: hook
    text: |
      走進臺南的老街，你會看到廟宇、老店和寫著漢字的匾額。
      到越南中部的會安，你會看到很像的東西：福建會館、供奉天后和關公的會館，還有一座「來遠橋」。
      這個單元，我們要像偵探一樣，找出這些漢字是怎麼「漂」到越南的。
    guess:
      q: 越南中部的會安滿街漢字和中式會館。你猜最主要是為什麼？
      options:
        - 這條老街是近幾十年為了觀光，才照中國的樣子蓋出來的
        - 越南人原本就說中文，所以到處寫漢字
        - 古代中國曾經統治這裡，漢字和建築都是那時留下的
        - 一道禁令、一場鎖國和一個王朝的滅亡，讓不同國家的人先後來到這裡
      reveal: "歷史上比較接近第四個。明朝不准日本船進中國，中日商人就到會安交易；日本 1630 年代鎖國後華商成了主角；1644 年明朝滅亡，遺民又南下，越南自己也長期用漢字。後來港口沒落，老街反而原樣保存。"
  - type: card
    id: building-hoi-an
    depth: story
    prompt: 先讀會安的故事。邊讀邊數：故事裡提到哪幾群人住在會安？
    focus: [story]
    quick:
      - q: "故事裡的會安住過哪幾群人？他們為什麼會來？"
        a: "日本商人和華商，是因為明朝不准日本船進中國港口，才約在會安交易；明朝滅亡後，遺民南下成為明鄉人。這裡本來就是阮氏統治的越南港口，所以也有越南人。"
      - q: "會安後來為什麼沒落，老街卻反而保存下來？"
        a: "河口淤積，港口移到峴港，會安的生意被帶走了。老街沒有跟著改變，反而原樣保存下來，1999 年列入世界遺產。"
  - type: card
    id: commodity-nanban-trade
    depth: story
    prompt: 讀這張卡時，注意「朱印船」是什麼船、去了哪些地方。
    focus: [terms, B6]
    quick:
      - q: "朱印船是什麼船？它們為什麼要出海？"
        a: "是拿到幕府蓋紅印許可狀才能出海的日本商船，1604 到 1635 年間超過 350 艘，去越南、暹羅、呂宋和臺灣。這個制度讓日本船自己到東南亞買生絲。"
      - q: "很多人以為南蠻貿易是「日本賣東西給歐洲」，其實呢？"
        a: "主要是中國生絲換日本白銀。明朝禁止和日本直接貿易，葡萄牙人正好當中間人，賺的是中日之間的差價。"
  - type: source
    card: building-hoi-an
    idx: 0
    question: 根據 1695–1696 年來到會安的中國僧人大汕的記載，住在大唐街開店的主要是什麼人？
    options:
      - 日本來的商人，仍穿著日本的和服
      - 福建來的華人，仍穿著明朝的服裝
      - 葡萄牙來的商人，穿著歐洲的服裝
      - 越南本地的商人，穿著越南的服裝
    answer: 1
    explain: 記載說店主「都是福建人」，而且「仍穿著前朝（明朝）的服裝」。大汕來的時候，明朝已經在 1644 年滅亡五十多年了，這些福建人還保留著明朝的穿著。這句話我們讀到的是越南文譯本的英譯、再摘譯成中文，讀史料時也要注意它經過了幾手翻譯。
    hints:
      - 記載裡說店主是從哪一個省來的？
      - 大汕來的時候是清朝；「前朝」是指哪一朝？
      - 日本人在 1630 年代鎖國後，還能留在會安嗎？
    ref: building-hoi-an#story
    why_wrong:
      - "記載說店主都是福建人；日本人在 1630 年代鎖國後，日本町就慢慢消失了。"
      - null
      - "記載裡說的是福建人，沒有提到葡萄牙人。"
      - "記載裡說店主都是福建人，不是越南本地人。"
    critique:
      question: "大汕是來訪的中國僧人，這段話只寫了大唐街。這段史料最能證明什麼？"
      options:
        - "能證明會安從頭到尾都是一座中國人的城，沒有其他文化"
        - "能證明明朝在 1695 年還統治著會安，所以店主才穿明朝服裝"
        - "能證明越南人完全不用漢字，招牌都是華人寫的"
        - "能證明當時大唐街上開店的多是福建人，但不能代表整個會安"
      answer: 3
      explain: "這段話只記了大唐街店主的來歷。聯合國教科文組織強調，會安是越南本地文化與中國、日本，後來還有歐洲文化融合的結果；在越南人之前，這裡也是占婆人的港口。所以它能證明大唐街有福建人，不能證明整個會安只有華人。另外，明朝在 1644 年已經滅亡，穿明朝服裝只是店主保留的習慣。"
      why_wrong:
        - "教科文組織指出會安是多種文化融合的結果，一段記載不能推出沒有其他文化。"
        - "明朝在 1644 年已滅亡，店主穿明朝服裝是保留舊習慣，不是明朝還在統治。"
        - "越南長期用漢文當官方書面語，會安的漢字同時屬於華人和越南人。"
        - null
  - type: chain
    prompt: 把讓會安「滿是漢字」的事件排成一條鏈（最上面最早）。排完想一想：哪些前後之間是「前一件促成後一件」，哪些只是先後？
    items:
      - 明朝不准日本船進中國港口，中日商人改到會安等第三地交易
      - 日本商人社群在會安蓋了一座廊橋（後來的來遠橋）
      - 日本鎖國，會安的日本町逐漸消失
      - 明朝滅亡，明朝遺民南下越南，成為明鄉人
      - 福建商人把會館重修成今天的福建會館
      - 河口淤積、港口移往峴港，老街原樣保存下來
    explain: 第三地貿易讓華人與日本人來到會安 → 1593 年起日本人蓋橋 → 1630 年代鎖國，日本町沒落 → 1644 年明亡，遺民南下 → 1757 年福建會館重修 → 19 世紀港口沒落，老街「停格」。
    hints:
      - 日本人要先來到會安，才會蓋橋，之後也才會因為鎖國而離開。
      - 明朝滅亡是 1644 年，比日本鎖國晚一點。
      - 老街能保存下來，是因為後來「沒落」了。
    ref: building-hoi-an#D1
    followup:
      question: "這幾件事裡，哪兩件之間只是先後，卡片並沒有說前一件促成後一件？"
      options:
        - "明朝不准日本船進中國港口，到中日商人改在會安交易"
        - "日本鎖國，到明朝滅亡"
        - "河口淤積、港口移往峴港，到老街原樣保存"
        - "日本商人聚居會安，到他們蓋了一座廊橋"
      answer: 1
      explain: "卡片裡沒有證據顯示日本鎖國促成了明朝滅亡。卡片把它們並列成兩個不同的原因：前者讓日本町消失，後者讓遺民南下。其他三組卡片都有前因後果：禁令讓商人去第三地；港口沒落讓會安沒有大規模改建；日本商人聚居，才會蓋橋。"
      why_wrong:
        - "卡片說，因為明朝禁止日本船進中國，兩國商人才到第三地會安交易，這是因果。"
        - null
        - "卡片說港口移走後會安沒有大規模改建，老街才原樣保存，這是因果。"
        - "日本商人社群先住在會安，才蓋了這座廊橋，這是前後相連的事。"
  - type: card
    id: tech-vietnam-scripts
    depth: story
    prompt: 會安的漢字不全是華人寫的。讀這張卡，找出越南人自己用漢字用到什麼時候。
    focus: [T3, T5]
    quick:
      - q: "越南人為什麼要造「喃字」？"
        a: "越南話和中文不一樣，漢文只能「看」，不能直接寫出越南人說的話。所以越南人借用漢字的部件，把表意和表音的部分拼在一起，造出新字。"
      - q: "會安老街上的漢字，今天的越南年輕人為什麼常常看不懂？"
        a: "拉丁字母的「國語字」好學，1945 年後成為全國通用的文字。改字之後，漢文和喃字的文獻變得難讀，寺廟、會館、老街上的漢字，對許多年輕人來說是「看不懂的字」。"
  - type: compare
    cards: [building-hoi-an, event-koxinga-taiwan]
    prompt: 1644 年明朝滅亡後，不願接受清朝統治的人，有的去了越南，有的跟著鄭成功來到臺灣。比一比兩條路。
    rows:
      - { aspect: 去了哪裡, a: 南下越南，阮主讓他們定居, b: 鄭成功 1661 年渡海攻打荷蘭人的熱蘭遮城，在臺灣建立政權 }
      - { aspect: 和當地統治者的關係, a: 在阮主允許下定居，在會安組成「明香社」, b: 自己當統治者，打敗了荷蘭人 }
      - { aspect: 後來的結局, a: 後代成為明鄉人，阮朝時被當成越南人, b: 1683 年鄭家向清朝投降，臺灣歸入清朝版圖 }
    question: 同樣是明朝遺民，為什麼一邊融入了越南，一邊卻被清朝收服？
    model_answer: 去越南的明朝遺民是在阮主允許下定居，組成明香社、蓋祠堂與會館，幾代之後被阮朝當成越南人。鄭成功則帶著約 25,000 人的大軍打敗荷蘭人，在臺灣自己建立政權，繼續用明朝的名義和清朝對抗，最後 1683 年清朝攻下澎湖，鄭家投降。一邊是「融入當地」，一邊是「另立政權」，結局就不一樣。
    hints:
      - 看「和當地統治者的關係」那一列：誰說了算？
      - 有自己軍隊、繼續反清的那一方，清朝會放過他嗎？
      - 明鄉人後來被當成哪一國人？
    points:
      - 去越南的遺民在阮主允許下定居，組成明香社，後代成為明鄉人、被阮朝當成越南人
      - 鄭成功帶約 25,000 人打敗荷蘭人，在臺灣自己建立政權，繼續用明朝名義對抗清朝
      - 1683 年清朝攻下澎湖，鄭家投降
      - 一邊融入當地、一邊另立政權，結局就不一樣
  - type: decision
    role: 你是 1640 年代住在會安的一位福建商人
    situation: |
      家鄉傳來消息：明朝滅亡了，清朝取代了明朝。
      你在會安做生意已經好幾年，越南的阮主也歡迎外國商人。你可以回福建老家，也可以留在會安。你會怎麼做？
    options:
      - { label: 留在會安，和同鄉一起生活, result: 這是許多華商與明朝遺民的選擇。他們組成「明香社」，蓋會館、拜家鄉的神明，後代成為明鄉人，阮朝時被當成越南人。 }
      - { label: 回福建老家, result: 推測：回到福建，可能碰上清朝和鄭成功等抗清勢力在沿海的戰爭，海外的生意也可能中斷。卡片只記下留下來的人，沒有記下回鄉的人後來怎樣，所以後果只能推測。 }
    actual: 很多人選擇留下或南下越南，成為明鄉人；福建商人也在 1757 年把會館重修成今天的福建會館。
    ref: building-hoi-an#story
    note: 「沒有發生的選項」的後果都是推測，標示清楚。
  - type: today
    card: building-hoi-an
    question: 有人說「會安就像今天的工廠搬到越南，因為美中不能直接做生意」。這個類比哪裡不成立？
    model_answer: 會安的「第三地貿易」發生在沒有國際法和自由貿易協定的時代，靠的是越南統治者的特許和商人自己的網絡；今天的工廠移動則牽涉關稅、跨國企業和各國法律。明鄉人被阮朝收編成越南人，也是王朝時代的身分安排，不能直接比作今天的國籍。可以借來思考的是：兩個國家不能直接往來時，中間的第三地常常會因此繁榮起來。
    points:
      - 會安的第三地貿易靠越南統治者的特許和商人的網絡，沒有國際法和貿易協定；今天的工廠移動牽涉關稅、跨國企業和各國法律
      - 明鄉人被阮朝收編成越南人，是王朝時代的身分安排，不能直接比作今天的國籍
      - 可以借來思考：兩國不能直接往來時，中間的第三地常會因此繁榮
  - type: check
    items:
      - kind: choice
        q: 為什麼 17 世紀初日本商船和中國商船要到會安碰面，而不是直接去對方的港口？
        options: [會安的絲和白銀都比兩國國內便宜很多, 會安是中日兩國共同管理的貿易港口, 日本禁止中國船進入日本的所有港口, 明朝禁止日本船進入中國的港口]
        answer: 3
        explain: 明朝不准日本船進中國港口，日本的朱印船只好到東南亞的第三地，和中國商船交易。
        hints: [是哪一個國家下了禁令？, 想想「第三地貿易」的意思。]
        ref: building-hoi-an#story
        why_wrong:
          - "卡片沒有說會安的東西比較便宜；原因是明朝的禁令。"
          - "會安由越南的阮氏統治，不是中日共同管理。"
          - "被禁止進中國港口的是日本船，不是中國船進日本。"
          - null
      - kind: choice
        q: 「明鄉人」是指誰？
        options: [明朝派到越南管理貿易的官員和家人, 從越南往北移民到明朝的越南人與後代, 明朝滅亡後移居越南的華人與他們的後代, 住在會安日本町的日本商人與他們的後代]
        answer: 2
        explain: 明鄉人是明朝滅亡後南下越南的華人與後代，原寫「明香」，1827 年改為「明鄉」，阮朝時被當成越南人。
        hints: [名字裡有「明」，跟明朝有關。, 他們是往南走，不是往北走。]
        ref: building-hoi-an
        why_wrong:
          - "明鄉人是明朝滅亡後才南下的遺民，不是明朝派來的官員。"
          - "他們是往南走到越南，不是從越南往北走。"
          - null
          - "日本商人是另一群人，日本町在鎖國後逐漸消失；明鄉人是南下的華人與後代。"
      - kind: short
        q: 用一兩句話說明：為什麼說會安的漢字「不只屬於華人」？
        model: 因為越南自己長期用漢文當官方書面語，到 20 世紀才逐漸不用，越南人的匾額、寺廟也寫漢字，所以會安的漢字也是越南人自己的歷史。
        explain: 漢字不是只有華人在用；北屬時期以後，越南的官員和讀書人一直用漢文寫公文、考科舉、作詩。
        hints: [回去看越南文字卡：越南人用漢字用到什麼時候？, 會安卡的故事說「再加上越南自己長期用漢字」：寫匾額、寺廟漢字的，也可能是越南人。]
        ref: building-hoi-an
        points:
          - 越南自己長期用漢文當官方書面語，到 20 世紀才逐漸不用
          - 越南人的匾額、寺廟也寫漢字
          - 所以會安的漢字，也是越南人自己的歷史
  - type: recap
    model_answer: 會安滿是中國建築和漢字，有好幾層原因。第一，明朝不准日本船進中國，中日商人就到會安碰面，華人和日本人各住一區；第二，日本 1630 年代鎖國，日本町消失，華商成了主角；第三，1644 年明朝滅亡，明朝遺民南下，成為明鄉人，華商也依家鄉組成福建、廣肇、潮州等會館；第四，越南自己長期用漢字。最後，河口淤積、港口移到峴港，會安沒落，老街反而原樣保存下來，1999 年成為世界遺產。
    points:
      - 明朝不准日本船進中國，中日商人到會安碰面，華人和日本人各住一區
      - 日本 1630 年代鎖國，華商成為主角；1644 年明朝滅亡，遺民南下成為明鄉人
      - 華商依家鄉組成會館，越南自己也長期用漢字

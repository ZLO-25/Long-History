id: unit-industry-empire
title: 工業革命與帝國主義：工廠裡的機器，怎麼會變成非洲地圖上的線？
histories: [世界通史, 歐洲史, 中國史, 臺灣史]
mystery: 十九世紀英國工廠裡的機器，和後來歐洲人在非洲取得土地，到底有什麼關係？哪些只是「先後發生」，哪些是學者認為有因果，又為什麼吵到今天？
teaser: 一個八歲進工廠的孩子、一場議會演說裡的反對聲、一份只談「海岸」的議定書：從這三份史料，看機器和地圖之間，哪些線是真的、哪些是我們想像的。
goals:
  - 能判讀童工的國會證詞，說出它能證明什麼、不能證明什麼
  - 能並列學者解釋「列強為什麼擴張」的幾種說法（經濟、競爭、轉移國內不滿），並說出為什麼難有定論
  - 能判讀費里的議會演說與《總議定書》第 34、35 條，說出誰說的、在什麼場合、能證明什麼
  - 能指出「柏林會議上畫好了非洲地圖」為什麼是誤解
  - 能用「誰上桌、誰不在場」比較柏林會議與馬關條約
minutes: 50
level: 皆可
curriculum: ["歷 Qa-IV-2", "歷 Qb-IV-1", "歷 Qb-IV-2", "歷 Mb-V-2"]
steps:
  - type: hook
    text: |
      想像你家附近開了一間大工廠。幾十年後，你住的城市人口變成原來的好幾倍，街上擠滿了新來的人。
      又過了幾十年，歐洲的政治家坐在桌邊，討論在遠方的另一塊大陸上「誰要在哪裡、怎麼取得土地」。
      這兩件事只隔幾十年。你很容易想把它們連成一條線：機器造出力量，力量就跑去占領別人的土地。
      但歷史學要多問一句：先後發生，不等於一個造成另一個。這一課要一條一條檢查，哪些線有證據，哪些線學者還在吵。
    guess:
      q: "十九世紀後期，歐洲列強加速在非洲取得殖民地。你覺得學者會怎麼解釋？（沒有對錯，先憑直覺選。）"
      options:
        - "工廠需要新市場和投資出路，是資本家推動的"
        - "列強彼此競爭，怕被別人搶先"
        - "政府想把國內的不滿轉移到國外"
        - "各說各的，到今天沒有一個大家都同意的答案"
      reveal: "前三種說法都有學者提出：Hobson 認為是資本家要找投資出路；也有人強調列強互相競爭；德國史家 Wehler 提出擴張是把國內的緊張轉移到國外（據維基百科轉述）。批評的人則指出，占領殖民地的軍事與行政花費常常高於收益。所以動機的解釋至今仍在爭論，沒有定論。"
  - type: card
    id: event-industrial-revolution
    depth: understand
    prompt: 先看「機器」這一頭。讀故事和「受益者與受損者」時注意：最先用機器的是哪個行業？城市怎麼變？讀「史家怎麼吵」時注意：為什麼先發生在英國，學者有哪幾種說法？卡片有沒有給定論？
    focus: [story, C5, debate]
    quick:
      - q: 工業革命最先用機器代替手工的是哪個行業？曼徹斯特這樣的城市出現什麼變化？
        a: 最先用機器代替手工的是紡織業。曼徹斯特的人口 1771 到 1831 年成長為約六倍，新居民擠進過度擁擠、衛生不佳的城市貧民區，霍亂與傷寒很常見。
      - q: 學者怎麼解釋工業革命為什麼先發生在英國？卡片有給定論嗎？
        a: 沒有定論。Allen 認為關鍵是英國工資高、煤便宜，企業才願意發明用資本和能源代替人力的機器，而這個條件又來自英國在國際貿易上的成功，靠的是重商主義與帝國擴張（卡片只讀到他論文的摘要）。Mokyr 則強調相信進步的文化與知識，稱為「工業啟蒙」（據百科條目轉述）。看法不一。
  - type: source
    card: event-industrial-revolution
    idx: 0
    question: 馬修．克拉布特里在 1831–32 年向國會的薩德勒委員會作證，回答他剛進工廠時的工時：「From 6 in the morning to 8 at night.」照這句話，他剛進工廠時，一天大約要做多久？
    options:
      - 約 8 小時，早上六點上工，下午兩點就可以下工回家
      - 約 10 小時，早上六點上工，傍晚四點左右下工回家
      - 約 12 小時，早上六點上工，傍晚六點左右下工回家
      - 約 14 小時，早上六點到晚上八點
    answer: 3
    explain: 早上六點到晚上八點是 14 小時。卡片故事寫，這位 22 歲的工人說他八歲進工廠，一天要做十四小時，遲到還會挨打。
    why_wrong:
      - 從早上六點算到晚上八點，不是下午兩點；那樣只有 8 小時。
      - 從早上六點算到晚上八點，不是傍晚四點；那樣只有 10 小時。
      - 從早上六點算到晚上八點，不是傍晚六點；那樣只有 12 小時。
      - null
    hints:
      - 先把「6 in the morning」和「8 at night」換成幾點到幾點。
      - 從早上六點數到晚上八點，一共經過幾個小時？
    ref: event-industrial-revolution#story
    critique:
      question: 這份證詞是工人在國會的委員會裡說的。卡片也寫到，國會議員批評這份報告「片面」：只聽了薩德勒一方的證人，證人也沒有宣誓。哪個判斷最穩妥？
      options:
        - 這證明了 1830 年代英國所有工廠的孩子，每天都做十四小時、遲到都會挨打
        - 這是重要史料，但只聽一方證人，不能直接當成「所有工廠都這樣」
        - 證人沒有宣誓，所以整份證詞都是編造的，完全不能拿來當作研究的材料
        - 這證明 1833 年工廠法一通過，英國的工廠就馬上不再雇用任何童工了
      answer: 1
      explain: 證詞是克拉布特里在薩德勒委員會（國會下議院）說的，是看見當時工廠生活的重要史料。但卡片據維基百科整理：報告只聽了一方的證人，議員批評它片面；後來另設的工廠委員會調查，不支持最聳動的說法，仍認定孩子工時過長、有害健康與教育。所以它能證明「有這樣的情況」，不能證明「到處都是這樣」。
      why_wrong:
        - 卡片提醒：證詞是重要史料，但不能當成「當時所有工廠都是這樣」。
        - null
        - 後來的調查雖然不支持最聳動的說法，仍認定孩子工時過長，所以不是整份都不能用。
        - 國家檔案館提醒，這部法律起初執行的力量有限，虐待童工並沒有一夜之間消失。
  - type: card
    id: event-new-imperialism
    depth: deep
    prompt: 再看「帝國」這一頭。讀「史家怎麼吵」時注意：學者用哪幾種說法解釋列強為什麼擴張？每一種說法，有誰反對？
    focus: [story, debate]
    quick:
      - q: 1870 到 1910 年，英國、美國、德國在世界製造業的占比各怎麼變？
        a: 英國從 31.8% 降到 14.7%；美國從 23.3% 升到 35.3%；德國從 13.2% 升到 15.9%。也就是英國的優勢下降，美國與德國快速追上。
      - q: 學者用哪幾種說法解釋列強為什麼擴張？有沒有定論？
        a: 沒有定論。Hobson 說是資本家要為過剩的資本找出路；列寧說是壟斷資本的緣故；Schumpeter 反駁，認為帝國主義是舊時代尚武心態留下來的東西；Wehler 提出「社會帝國主義」，擴張是把國內緊張轉移到國外（據維基百科轉述）。批評的人還指出，占領殖民地的花費常常高於收益。
  - type: card
    id: event-berlin-conference-1884
    depth: deep
    prompt: 最後看「地圖」這一頭：1884–85 年的柏林會議。讀故事和「制度或機制變化」時注意：議定書第 34、35 條到底規定了什麼？讀「史家怎麼吵」時注意：會議有沒有「瓜分非洲」？
    focus: [story, C2, C4, debate]
    quick:
      - q: 柏林會議有哪些國家參加？非洲有沒有國家受邀？
        a: 有 14 個國家的代表出席（包括歐洲各國、美國和鄂圖曼），瑞典與挪威當時共戴一位國王，算成一個，所以有些地方寫 15 國。沒有任何非洲國家受邀；桑吉巴蘇丹巴爾加什要求派代表，被拒絕。
      - q: 第 34、35 條規定了什麼？為什麼說會議沒有「把地圖畫好」？
        a: 第 34 條規定：列強今後在非洲海岸取得新土地，要通知其他簽約國；第 35 條規定：占領者有義務建立足以保護既有權利的統治。兩條都只談「海岸」。多數邊界是會議之後二十多年，靠列強之間的雙邊談判和與非洲統治者簽的條約慢慢定下來。不過史家看法不完全一樣：據維基百科整理，Louis 與 Gifford 認為議定書對後來的瓜分仍有關係。
  - type: mapq
    card: event-berlin-conference-1884
    question: 柏林會議最關心剛果河一帶：議定書宣布當地貿易與航行自由、禁止奴隸貿易。會議本身在柏林舉行。地圖上有三個點，哪一個是剛果河流域？
    places:
      - { key: "剛果河流域", label: 剛果河流域, hint: 非洲大陸中部，靠近赤道 }
      - { key: "桑吉巴（蘇丹國）", label: 桑吉巴, hint: 非洲東岸外海的島，在印度洋上 }
      - { key: "柏林（威廉街，德國首相府一帶）", label: 柏林, hint: 歐洲中部偏北 }
    answer: 0
    explain: 剛果盆地（中非）是會議最關心的地區，議定書宣布當地貿易與航行自由、禁止奴隸貿易，後來成為利奧波德二世的剛果自由邦。桑吉巴是蘇丹巴爾加什要求派代表、卻被拒絕的地方；柏林則是開會的地方，由俾斯麥主持。開會的人坐在歐洲，被談論的土地在非洲，沒有任何非洲國家受邀。
    why_wrong:
      - null
      - 桑吉巴蘇丹曾要求派代表出席，但被拒絕；它不是會議最關心的貿易與航行自由地區。
      - 柏林是開會的地點，不是議定書宣布貿易與航行自由的地區。
    hints:
      - 先分清楚：哪一個點在歐洲，哪兩個在非洲？
      - 剛果河流域在非洲大陸的內陸，不是外海的島。
    ref: event-berlin-conference-1884#C2
  - type: sources2
    a: { card: event-new-imperialism, idx: 1 }
    b: { card: event-berlin-conference-1884, idx: 0 }
    question: A 是法國政治家費里 1885 年在議會演說的一句話（法文原文，本站翻譯）；B 是柏林會議《總議定書》第 35 條的一句話（英文譯本）。把兩份放在一起讀，哪個說法最合理？
    options:
      - A 證明工業需要市場是列強擴張唯一的原因；B 證明柏林會議已經把整個非洲劃分給各國
      - A 是說服議會的演說，B 是列強之間的規則；兩份都看不到非洲人的聲音
      - 兩份都是被殖民者寫下的抗議文件，目的是反對歐洲人占領非洲的土地和海岸
      - A 是柏林會議的議事紀錄，B 是費里的議會演說，兩份寫的是同一天發生的同一件事
    answer: 1
    explain: A 是費里在法國國民議會替馬達加斯加遠征經費辯護時說的，目的是說服議員，內容之一是工業缺市場；B 是列強簽字同意的規則，談的是占領海岸土地後要建立統治，不是在畫地圖。兩份都沒有非洲人的聲音。費里同場演說還提到「優等民族」「劣等民族」，那是 19 世紀的種族等級說法，今天已不被接受；當場也有議員反對。
    why_wrong:
      - 一個人的一句話不能證明「唯一原因」，學者對動機也各有解釋；第 35 條談的是占領後的義務，卡片也說會議沒有把非洲分好。
      - null
      - A 是法國議員的演說，B 是列強簽署的議定書條文，作者都不是被殖民者。
      - 兩份的作者、時間和場合都不同：演說是 1885 年 7 月在法國議會，議定書是 1885 年 2 月 26 日簽的。
    hints:
      - 先分別找出兩份文字是誰說的、在什麼場合說的。
      - 一份在說「為什麼要做」，另一份在說「做的時候要守什麼規則」。
      - 兩份文字裡，有沒有出現任何非洲人的話？
    ref: event-new-imperialism#C2
    open:
      question: 費里在議會演說時，現場有人反對：克里蒙梭插話「這很可疑」（回應費里說英國統治印度帶來更多正義與秩序），議員 Maigne 說「你竟敢在宣布人權的國家這樣說！」。請說說：這些反對聲，加上議定書第 35 條，各告訴我們什麼？又各自不能證明什麼？
      points:
        - 費里是在議會替遠征經費辯護，目的是說服議員，不是中立的紀錄
        - 當場有議員反對（克里蒙梭、Fabre、Maigne 等），所以不能說「當時所有人都支持殖民」
        - 議定書條文只談列強之間的通知與建立統治（而且只談海岸），不是畫好非洲地圖
        - 兩份都沒有非洲人的聲音，不能證明被殖民者怎麼想，也不能單靠它們決定擴張的真正動機
      model_answer: 費里是政治人物，在議會替馬達加斯加遠征經費辯護，說出「工業缺市場」是為了說服議員，所以能看出當時有人用這種理由，但不能證明這就是擴張的真正原因。現場克里蒙梭、Fabre、Maigne 等人反對，說明當時並不是人人支持殖民。議定書第 35 條則是列強之間約定：占領海岸土地要建立統治，它是規則，不是地圖，也不能說明非洲人怎麼想，因為兩份史料裡都沒有非洲人的聲音。
  - type: chain
    prompt: 把下列事件依先後排成一條鏈（最上面是最早的）。排的時候想一想：哪些是前一件促成後一件，哪些只是接著發生？
    items:
      - 英國棉紡織先用機器生產，工廠與城市快速成長（工業革命）
      - 英國製造業優勢下降，美國與德國追上；列強加速在非洲、亞洲與太平洋取得殖民地（新帝國主義）
      - 列強在非洲海岸互相競爭，需要互相通知、避免衝突的規則，俾斯麥召開柏林會議
      - 議定書規定占領海岸新土地要通知、要建立統治；之後列強靠與非洲統治者簽的條約主張內陸土地
      - 二十多年間邊界陸續談定，最後非洲只剩賴比瑞亞和衣索比亞沒被歐洲控制
    explain: 工業革命先在英國發生，擴散到歐洲大陸與美國；到了十九世紀後期，英國優勢下降、列強加速取得殖民地；列強在非洲海岸互相競爭，才需要柏林會議訂規則；議定書之後，列強主要靠條約主張內陸，邊界花了二十多年才談定。注意：卡片只把「工業革命是新帝國主義的背景」寫成學者之一的說法，並沒有寫成確定的因果。
    hints:
      - 最早的事是在英國工廠裡發生的。
      - 列強先在非洲海岸互相競爭，才會有人召開會議訂規則。
      - 邊界不是會議上畫好的，是會議之後二十多年才陸續談定的。
    ref: event-berlin-conference-1884#C4
    followup:
      question: 這條鏈大致依先後排列。哪一組的關係，卡片特別標明「學者看法不一」，不能當成確定的因果？
      options:
        - 列強加速取得殖民地 → 列強在非洲海岸互相競爭，需要互相通知的規則
        - 召開柏林會議 → 議定書規定占領海岸新土地要通知、要建立統治
        - 英國棉紡織機械化、城市快速成長 → 列強加速取得殖民地
        - 議定書之後列強簽條約 → 邊界花了二十多年陸續談定
      answer: 2
      explain: 工業革命卡把工業化寫成新帝國主義的「背景」，並標明這是 Hobson 等人的說法，Schumpeter 反駁、批評者也說殖民地花費常高於收益，所以看法不一。另外 Allen 認為（卡片只讀到他論文的摘要），英國能先工業化，條件之一來自更早的重商主義與帝國擴張；也就是說，帝國擴張在工廠出現之前就有了。其他三組，卡片是寫成「所以需要規則」「議定書規定了這些」「主要靠條約，過程拖了二十多年」。這不代表機器和帝國沒有關係，只是學者沒有一致答案。
      why_wrong:
        - 柏林會議卡寫到，列強互相競爭，都想搶先取得據點和土地，所以需要互相通知、避免衝突的規則。
        - 這兩項是會議與它的條文，卡片明白寫出第 34、35 條的內容。

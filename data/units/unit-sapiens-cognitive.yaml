id: unit-sapiens-cognitive
title: 認知革命：一種普通的動物，怎麼遍布全球？
histories: [世界通史]
mystery: 幾十萬年前，智人只是非洲的一種普通動物，地球上還住著尼安德塔人、丹尼索瓦人等好幾種人。後來智人卻走到澳洲、美洲，其他人類都消失了。哈拉瑞認為，關鍵是約 7 萬年前的一場「認知革命」。這個說法，卡片上的證據撐得住嗎？
teaser: 一塊刻了格子紋的紅石頭、一串小貝殼珠、一排兩萬多年前的腳印：它們能證明「人類靠說故事稱霸地球」嗎？
goals:
  - 能說出哈拉瑞「認知革命」的說法，以及突變說與漸進說兩派的主要證據
  - 能判讀一件考古遺物（布隆伯斯洞穴的刻紋赭石），說出它能支持什麼、不能證明什麼
  - 能依年代排出智人出現、走出非洲、抵達澳洲與美洲的順序，並指出哪些年代還在爭論
  - 能比較人類抵達澳洲與抵達美洲兩件事的證據，說出定年爭議怎麼影響我們的結論
  - 能指出「人類是大型動物滅絕的兇手」這個說法，目前證據支持到哪裡、還缺什麼
minutes: 40
steps:
  - type: hook
    text: |
      開學第一天，全校一千多個學生，大部分彼此都不認識。可是升旗時大家站在同一面旗子下、穿同一套制服、唱同一首校歌，就會覺得「我們是同一所學校的人」。
      哈拉瑞在《人類大歷史》裡認為，智人能稱霸地球，靠的就是類似的能力：相信神、國家、公司這些「虛構的故事」，讓互不認識的人也能大規模合作。他把這種能力的出現叫做「認知革命」，時間放在約 7 萬年前。
      這個單元不是要背這句話，而是要當一次偵探：拿網站上的證據卡，看看這個說法哪些地方站得住、哪些地方還在吵。
  - type: card
    id: event-homo-species
    depth: deep
    prompt: 先看看「人」原來不只一種。注意：智人最早的化石之一在哪裡、多久以前？同時還有哪些人類？也讀「史家怎麼吵」：智人是「取代」還是「混血」其他人類？
  - type: card
    id: event-cognitive-revolution
    depth: deep
    prompt: 這張卡就是哈拉瑞說的「認知革命」。先把布隆伯斯洞穴裡各種東西的年代記下來（顏料、刻紋赭石、貝殼珠），再讀「史家怎麼吵」：突變說和漸進說各怎麼看這些東西？
  - type: source
    card: event-cognitive-revolution
    idx: 0
    question: 布隆伯斯洞穴出土一塊紅色赭石，表面被磨平，再刻上交叉的格子紋，年代約 7.7 萬年前。這件遺物最能支持哪一個說法？
    options:
      - 它證明約 7 萬年前，一次基因突變讓智人突然學會了說話
      - 它顯示約 7.7 萬年前，非洲已經有人刻意刻出幾何圖案，可能代表象徵思考；但圖案到底代表什麼，只能推論
      - 它證明最早的藝術出現在歐洲
      - 它證明當時的人已經相信神和國家
    answer: 1
    explain: 這塊赭石是被刻意磨平再刻線的，研究團隊用它來論證：現代人行為在非洲出現，比歐洲舊石器時代晚期至少早 3.5 萬年。但它沒有說話，也看不出是不是基因突變造成的；史前沒有文字，一塊刻紋赭石到底「代表什麼」，學者也只能推論。
    hints:
      - 先看年代：約 7.7 萬年前，和哈拉瑞說的「約 7 萬年前」比，哪個早？
      - 遺物上看得到的是什麼？是圖案，還是說話的聲音、信仰的內容？
      - 回去看卡片「不可類比的差異」：一塊刻紋赭石代表什麼，學者能確定嗎？
    ref: event-cognitive-revolution#C10
  - type: decision
    role: 你是在布隆伯斯洞穴工作的考古學家
    situation: |
      你在洞穴的中石器時代地層裡，挖到一塊刻有交叉格子紋的紅色赭石，年代約 7.7 萬年前。同一個洞穴裡，還有約 10 萬年前裝在鮑魚殼裡的顏料，以及約 7.5 萬年前鑽了孔的小貝殼珠。
      現在你要寫研究報告。先別急著看選項：只知道這些，你會下什麼結論？
    options:
      - label: 這證明約 7 萬年前發生了一場突然的「認知革命」
        result: 評估（依卡片推論，不是史實）：這個結論跳得太遠。赭石約 7.7 萬年前，比「約 7 萬年前」還早；同一個洞穴約 10 萬年前就有顏料工具組，看起來更像慢慢累積，不像一夜之間出現。而且一塊石頭看不出大腦或基因有沒有突變。卡片記載的研究團隊論點，也不是這一個。
      - label: 這顯示現代人行為在非洲出現得比歐洲早
        result: 這是研究團隊實際提出的論點：他們用這塊刻紋赭石論證，現代人行為在非洲出現，比歐洲舊石器時代晚期至少早 3.5 萬年。這個結論只說「何時、何地已經出現」，沒有說「為什麼出現」。
      - label: 先不下結論，等更多證據
        result: 評估（依卡片推論，不是史實）：謹慎有它的道理，卡片也提醒，赭石代表什麼只能推論，洞穴部分地層的定年也有學者從方法上質疑。但這塊赭石是被刻意磨平再刻線的，加上同一洞穴的顏料與貝殼珠，已經足以提出「這裡有象徵行為」的假說，再讓其他學者檢驗。
    actual: 自 1990 年代起主持布隆伯斯洞穴發掘的 Henshilwood，和同事在 2002 年發表的研究中，用這塊刻紋赭石論證：現代人行為在非洲出現，比歐洲舊石器時代晚期至少早 3.5 萬年。漸進說的學者把這類發現當成「非洲早就慢慢累積」的證據；突變說則認為現代人行為約 5–4 萬年前才突然出現。所以同一塊石頭，兩派可以讀出不同的意思。
    ref: event-cognitive-revolution#C2
    note: 這一題問的是「怎麼解讀證據」，不是歷史走了哪條路。除了研究團隊實際提出的論點以外，其他選項的「評估」是依卡片內容所作的推論，不是史實。
  - type: card
    id: event-out-of-africa
    depth: deep
    prompt: 智人怎麼走出非洲、走到澳洲？注意主要擴散的年代，以及「史家怎麼吵」：人類到底多早抵達澳洲，兩派各根據什麼？
  - type: card
    id: event-peopling-americas
    depth: deep
    prompt: 再往另一頭走：美洲。注意白令陸橋、白沙足跡、蒙特維德、克洛維斯各是多久以前；也讀「史家怎麼吵」：年代被挑戰時，研究者怎麼回應？
  - type: compare
    cards: [event-out-of-africa, event-peopling-americas]
    prompt: 人類抵達澳洲和抵達美洲，是智人「遍布全球」最遠的兩站。比一比兩邊的證據。
    rows:
      - aspect: 大約什麼時候到
        a: 估計約 6.5–5 萬年前，年代有爭議
        b: 白沙足跡約 2.3–2.1 萬年前（有爭議）；蒙特維德一般認為約 1.45 萬年前（2026 年有研究挑戰）；克洛維斯文化約 1.3 萬年前
      - aspect: 怎麼過去
        a: 冰期時澳洲與新幾內亞連成「莎湖大陸」；一般認為從東南亞島嶼過去要渡海，但卡片的學術來源摘要沒有直接討論渡海方式（估計）
        b: 冰期海平面下降，西伯利亞和阿拉斯加之間露出白令陸橋；之後是沿太平洋海岸南下，還是走冰原之間的「無冰走廊」，仍在爭論
      - aspect: 年代怎麼吵
        a: 2017 年 Clarkson 等人在馬傑德貝貝測出約 6.5 萬年前；2018 年 O'Connell 等人認為超過 5 萬年的年代不太可能成立；2021 年有研究認為可能是白蟻擾動地層造成的
        b: 白沙足跡原本用水生植物種子定年，批評者擔心「老碳」讓年代顯得太老；2023 年改用花粉和石英兩種方法重測，結果一致，但年代仍有爭議
      - aspect: 哈拉瑞怎麼說
        a: 認知革命之後，智人造了船，從東亞擴散到澳洲
        b: 依公開摘要，書中把智人到美洲放在約 1.6 萬年前；白沙足跡是書出版後的新發現
    question: 兩邊的抵達年代都還在吵。這對哈拉瑞「認知革命（約 7 萬年前）之後，智人才遍布全球」的說法有什麼影響？
    model_answer: 如果澳洲的年代是約 6.5 萬年前，智人很早就到了澳洲，和「約 7 萬年前開始擴散」的說法大致對得上；如果比較晚，就有更多時間差要解釋。美洲那邊，白沙足跡如果成立，人類到美洲的時間比書裡用的約 1.6 萬年前早了好幾千年。不過，這些年代不管怎麼改，都只告訴我們「什麼時候到」，沒有直接告訴我們「為什麼能到」。從抵達年代推不出「是認知革命讓人類能擴散」，卡片也指出，有學者認為新的行為與擴散時間對不上，兩者未必有因果。比較穩妥的說法是：智人確實在幾萬年內走遍各大陸，但它和「認知革命」之間的關係，還是一個要用更多證據檢驗的假說。
    hints:
      - 先看「大約什麼時候到」那一列，兩邊各有幾種年代？
      - 哈拉瑞用的美洲年代，和白沙足跡比，哪個早？
      - 「什麼時候到」和「為什麼到得了」是同一個問題嗎？回去看「走出非洲」卡上，認知革命和擴散之間的因果有沒有爭議。
  - type: card
    id: event-megafauna-extinction
    depth: deep
    prompt: 哈拉瑞認為，智人每到一個新大陸，大型動物就跟著滅絕。注意各大陸滅絕的比例和時間，也讀「史家怎麼吵」：人類獵殺說、氣候說和綜合說各有什麼證據？
  - type: chain
    prompt: 把智人「遍布全球」的過程，依年代排成一條鏈（最上面是最早的）。
    items:
      - 智人最早的化石之一出現在摩洛哥傑貝爾依羅（約 31.5 萬年前）
      - 布隆伯斯洞穴出現刻紋赭石（約 7.7 萬年前）
      - 主要的一支智人走出非洲（約 7–5 萬年前）
      - 人類抵達澳洲（估計約 6.5–5 萬年前，有爭議）
      - 尼安德塔人在歐洲的考古痕跡消失（約 4 萬年前之後）
      - 人類在美洲新墨西哥州白沙留下腳印（約 2.3–2.1 萬年前，有爭議）
      - 美洲的大型動物大量消失（集中在約 1.3–1.1 萬年前）
    explain: 智人在非洲出現了二十多萬年，才有主要的一支走出非洲；象徵行為的證據（刻紋赭石）也比走出非洲更早。接著是澳洲，之後尼安德塔人在歐洲消失，再來才是美洲，美洲大型動物的滅絕又在人類抵達之後。要注意：走出非洲和抵達澳洲的年代範圍有重疊，澳洲和美洲的年代都還在爭論，所以這條鏈的「順序」比較可靠，每一站的確切年份就不那麼確定。
    hints:
      - 最早的是智人「出現」，不是智人「走出去」。
      - 先離開非洲，才能抵達澳洲；美洲是離非洲最遠的一站。
      - 尼安德塔人約 4 萬年前消失，比白沙腳印早還是晚？
    ref: event-out-of-africa#C2
  - type: today
    card: event-cognitive-revolution
    question: 有人說：「7 萬多年前的貝殼珠，就跟今天的校徽、國旗、品牌標誌一樣，都是讓陌生人覺得是同一群人的符號。」這個類比哪裡不成立？
    model_answer: 先說不能類比的地方：今天的校徽、國旗，我們知道是誰設計、代表什麼意思；史前沒有文字，貝殼珠、刻紋赭石到底代表身分、裝飾還是別的意思，學者只能推論。而且考古遺物保存有偶然性，「沒挖到」不代表當時沒有這種行為。可以借來思考的是：今天的品牌標誌、國旗、校徽都是「大家約定意思的符號」，能讓互不認識的人覺得屬於同一群；這可以幫我們想像符號為什麼重要，但不能反過來證明史前的人一定是這樣用的。
  - type: check
    items:
      - kind: choice
        q: 哈拉瑞把認知革命放在約 7 萬年前。卡片上哪一項證據，讓「突然發生」的說法受到挑戰？
        options:
          - 德國洞穴約 4 萬年前的「獅子人」雕像
          - 布隆伯斯洞穴約 10 萬年前的顏料工具組、約 7.7 萬年前的刻紋赭石和約 7.5 萬年前的貝殼珠，都比 7 萬年前更早
          - 美洲白沙約 2.3 萬年前的腳印
          - 摩洛哥約 31.5 萬年前的智人化石
        answer: 1
        explain: 布隆伯斯洞穴的東西一件比一件早，一路往前推到約 10 萬年前，漸進說因此認為現代人行為是在非洲慢慢累積出來的，不是一次突然出現。獅子人比 7 萬年前晚，反而是突變說常引用的歐洲證據。
        hints:
          - 要挑戰「7 萬年前突然出現」，證據應該比 7 萬年前早，還是晚？
          - 回去看認知革命卡「經過」的年代表，哪一個洞穴出現了好幾件早於 7 萬年前的東西？
        ref: event-cognitive-revolution#C2
      - kind: choice
        q: 關於「人類是大型動物滅絕的兇手」，哪一個說法最符合卡片？
        options:
          - 已經證實人類是唯一的兇手
          - 已經證實氣候才是主因，和人類無關
          - 學界仍然分歧；2004 年的重要回顧認為人類在某些大陸有影響，但單靠打獵解釋不了全世界的模式
          - 非洲的大型動物損失最嚴重
        answer: 2
        explain: 卡片並列了獵殺說、氣候說與綜合說。2025 年的回顧指出學界仍嚴重分歧，不過 2020–2024 年的文獻中，主張「只有氣候」的作者，比主張「只有人類」或「人類加氣候」的作者都少。非洲的損失反而相對很少。
        hints:
          - 卡片的「常見誤解」裡，對「人類是兇手」這句話怎麼說？
          - 哪個大陸的損失「相對很少」？
        ref: event-megafauna-extinction#C2
      - kind: choice
        q: 哈拉瑞認為，智人抵達澳洲後「數千年內」大型動物就滅絕了。卡片上哪一項研究，讓這個說法需要再想一想？
        options:
          - Saltré 等人估計，大型動物約在人類抵達後 1.35 萬年才全面消失；Wroe 等人也指出，能確定和人類共存的只有 8–14 種
          - 拉布雷亞瀝青坑挖到猛獁象骨架
          - 紐西蘭在人類登島後失去大量鳥類
          - 弗蘭格爾島上的猛獁象比大陸多活了約 6,000 年
        answer: 0
        explain: 如果人類和大型動物共存了上萬年，就不像「數千年內」那麼快；Wroe 等人更指出澳洲 88 種大型動物中有 50 種，在約 13 萬年前之後就沒有年代紀錄，能確定和人類共存的只有 8–14 種。但要注意：Saltré 的研究同時也認為氣候不是主因，所以這些研究挑戰的是「多快」和「多少種」，不一定是在替人類脫罪。
        hints:
          - 題目在問「多快」：找一個說人類和大型動物共存了很久的研究。
          - 回去看大型動物滅絕卡的「常見誤解」和「史家怎麼吵」。
          - 共存的時間是「約 1.35 萬年」，比「數千年」長還是短？
        ref: event-megafauna-extinction#C2
      - kind: order
        q: 依時間先後排列人類抵達美洲的線索：
        items:
          - 冰期海平面下降，白令陸橋露出（約 3 萬年前起）
          - 白沙的人類腳印（約 2.3–2.1 萬年前，有爭議）
          - 蒙特維德的營地（一般認為約 1.45 萬年前，2026 年有研究挑戰）
          - 克洛維斯文化的石矛頭（約 1.3 萬年前）
        explain: 白令陸橋最早露出；白沙腳印比蒙特維德早，蒙特維德又比克洛維斯早，所以「克洛維斯人是最早的美洲人」這個 20 世紀的舊說，2000 年代以後多數研究者已經放棄。
        hints:
          - 先要有路，人才走得過去。
          - 「克洛維斯優先說」被推翻，代表克洛維斯是最早還是比較晚？
        ref: event-peopling-americas#C2
      - kind: short
        q: 今天非洲以外的人，基因裡大約有 2% 來自尼安德塔人。用一兩句話說明：這對「智人取代了其他人類」的說法有什麼影響？
        model: 這表示智人走出非洲後曾和尼安德塔人混血，所以不是完全的「取代」；但比例只有約 2%，所以學界普遍接受「以取代為主、但有少量混血」。哈拉瑞在書裡也介紹了取代說與混血說兩派，並強調這些多半是根據稀少資料拼湊的推測。
        explain: 混血的證據來自 2010 年公布的尼安德塔人基因組；它讓兩派的爭論有了新的答案，但尼安德塔人為什麼消失，確切原因仍然不知道。
        hints:
          - 2% 很少，但不是 0；「不是 0」代表發生過什麼事？
          - 回去看「人屬的多個物種」卡的「史家怎麼吵」：2010 年之後，學界普遍接受哪一種說法？

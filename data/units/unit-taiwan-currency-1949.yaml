id: unit-taiwan-currency-1949
title: 四萬換一塊：錢為什麼會變成廢紙？
histories: [臺灣史, 錢的歷史, 中國史]
mystery: 1949 年，四萬塊舊臺幣只換得到一塊新臺幣。錢怎麼會一下子變得這麼不值錢？
teaser: 你錢包裡的新臺幣，是為了救一場「錢變廢紙」的災難才誕生的。
goals:
  - 能用「政府缺錢 → 印鈔 → 物價飛漲」的因果鏈說明惡性通膨
  - 能判讀一段 1949 年官員的書信，說出他擔心什麼
  - 能比較臺灣舊臺幣、大陸金圓券、德國紙馬克三次通膨的異同
  - 能指出把 1949 年的通膨拿來比喻今天的物價上漲時，哪裡不成立
minutes: 35
level: 皆可
curriculum: ["歷 Fa-IV-1", "歷 Fb-IV-1"]
steps:
  - type: hook
    text: |
      想像你早上拿 50 元買一碗麵，晚上同一碗麵變 80 元，下禮拜變 200 元。
      你領到零用錢的第一件事，會是趕快花掉，因為明天它就更薄了。
      1945 到 1949 年的臺灣，大家每天都在過這種日子。最後政府乾脆宣布：四萬元舊臺幣，換一元新臺幣。
    guess:
      q: "1949 年 6 月，政府宣布「四萬元舊臺幣換一元新臺幣」。你覺得宣布之後，物價會怎麼樣？（沒有對錯，先憑直覺選。）"
      options:
        - "物價馬上穩住，因為舊錢拿掉了四個零"
        - "物價沒有馬上停，過了一年又漲了好幾倍"
        - "物價立刻大跌，因為市面上的錢變少了"
        - "物價回到 1945 年以前的水準"
      reveal: "換了新貨幣，物價並沒有馬上停住。改革後政府的赤字還在，物價一年內又漲了數倍，要到 1950 年代初美援進來、赤字縮小後才慢慢穩定。換新貨幣只是把數字的零拿掉，真正的關鍵是不能再用印鈔補洞。"
  - type: card
    id: finance-taiwan-1949-currency
    depth: story
    prompt: 先看臺灣發生了什麼：注意「錢是從哪裡多出來的」。
    focus: [F2]
    quick:
      - q: "舊臺幣的鈔票為什麼越印越多？"
        a: "政府和公營事業缺錢，就叫臺灣銀行多印鈔票來付。臺灣銀行先是替公營事業放款，後來替中央墊付軍公經費；陳誠 1949 年說這筆墊款已達新臺幣發行總額的九成。另外，大陸內戰和上海金融危機，也讓熱錢與物價壓力湧進臺灣。"
      - q: "換成新臺幣以後，物價馬上穩住了嗎？"
        a: "沒有。物價沒有馬上停住，要等到 1950 年代初美援進來、政府赤字縮小，才慢慢穩定。"
  - type: sim
    sim: debase
    prompt: 動手試試看：這個模擬用的是古代銀幣，但道理和印鈔相通：政府用「不值那麼多」的錢付帳，付得越多，物價會怎樣？想一想，舊臺幣的情況哪裡和模擬一樣、哪裡不一樣？
  - type: chain
    prompt: 把下列事件依照「因 → 果」排成一條鏈（最上面是最早的原因）。
    items:
      - 政府和公營事業花的錢比收入多
      - 臺灣銀行替政府墊錢、多印鈔票
      - 市面上的鈔票越來越多，物價越漲越快
      - 鈔票面額越印越大，大家不再相信舊臺幣
      - 政府改發新臺幣，四萬元舊臺幣換一元新臺幣
    explain: 缺錢 → 印鈔 → 物價上漲 → 失去信任 → 換新貨幣。注意最後一步並沒有立刻解決問題：物價要到 1950 年代初美援進來、赤字縮小後才穩定。
    hints:
      - 最早的原因跟「政府的帳」有關。
      - 鈔票變多，跟物價變高，哪一個先發生？
      - 換新貨幣是在大家已經不信任舊錢之後。
    ref: finance-taiwan-1949-currency#F2
    followup:
      question: "這條鏈講的是臺灣自己「缺錢 → 印鈔」的過程。卡片還提到一個從外面來、讓物價壓力更大的背景，是哪一個？"
      options:
        - "颱風與稻米歉收，讓糧食價格一路上漲"
        - "大陸內戰與上海金融崩潰，熱錢湧進臺灣"
        - "1950 年代初美援進來，政府的赤字變大了"
        - "新臺幣發行得太少，市面上的錢不夠用"
      answer: 1
      explain: "卡片寫到，政府和公營事業缺錢、叫臺灣銀行多印鈔，這是鏈上的環節；此外，大陸內戰和上海金融崩潰，使熱錢與物價壓力一起湧進臺灣。這是外來的背景壓力，不是鏈上「缺錢 → 印鈔」的一環，但讓物價漲得更快。"
      why_wrong:
        - "卡片沒有把糧食歉收列為原因；吳聰敏等人的資料顯示，物價跟著鈔票的數量走。"
        - null
        - "美援是 1950 年代初進來、讓赤字縮小、物價才穩定的，不是造成通膨的原因。"
        - "問題是鈔票太多，不是太少；陳誠說墊款已占發行總額九成。"
  - type: source
    card: finance-taiwan-1949-currency
    idx: 1
    question: 陳誠在 1949 年的信裡，最擔心的是什麼？
    options:
      - 臺灣的稻米產量不夠，老百姓會吃不飽、鬧饑荒
      - 替中央墊付的軍公經費太多，臺灣會垮
      - 美國不願意給臺灣任何援助，臺灣會撐不下去
      - 新臺幣印得太少，市面上的錢不夠用，生意做不了
    answer: 1
    explain: 他說墊款已經「合新臺幣發行總額百分之九十」，再這樣下去「臺省勢必非至崩潰不可」。也就是說，臺灣發出去的錢，大部分是替中央付軍費和公務開支；這是鈔票越印越多的重要來源之一（學者對其他原因，例如管制政策的影響，也有討論）。讀這段史料也要注意：這是當時主政者自己的說法，他有立場，但他點出的問題和學者用資料算出來的結果一致。
    hints:
      - 先找數字：「百分之九十」指的是什麼佔了發行總額的九成？
      - 「長此以往」後面接的是什麼結果？
      - 想想看：墊付經費的錢是從哪裡來的？
    ref: finance-taiwan-1949-currency#F2
    why_wrong:
      - "信裡擔心的是替中央墊付的軍公經費太多，不是稻米產量。"
      - null
      - "引文裡沒有提到美援；說的是墊款已占發行總額的九成。"
      - "問題是鈔票太多、墊款占了發行總額九成，不是印得太少。"
    critique:
      question: "這是陳誠 1949 年的書信，轉引自吳聰敏的講義。這段話能證明什麼、不能證明什麼？"
      options:
        - "能證明通膨的唯一原因，就是臺灣銀行替中央墊付了太多款項"
        - "能證明這是一份沒有任何立場、只列出數字的統計報告"
        - "能證明 1949 年 6 月的幣制改革從一開始就失敗了"
        - "能證明主政者擔心墊款太多會拖垮臺灣，但不能證明全部原因"
      answer: 3
      explain: "這是當時主政者自己寫的信，有他的立場，也是在表達擔心。它能證明的是：他認為墊款已達發行總額九成，而且擔心臺灣會崩潰。但通膨的原因，學者還討論全面管制等因素，不能只靠這一封信下結論。"
      why_wrong:
        - "學者的研究另外還討論管制政策等原因；一封信不足以說明「唯一」。"
        - "這是主政者寫的信，帶有他的立場和擔心，不是中立的統計。"
        - "信裡談的是墊款太多的擔心，沒有評斷幣制改革成不成功。"
        - null
  - type: card
    id: finance-gold-yuan-1948
    depth: story
    prompt: 同一時間，大陸也在換新貨幣。讀完想想看：金圓券和新臺幣的命運為什麼不一樣？
    focus: [F3, F5]
    quick:
      - q: "金圓券是怎麼運作的？為什麼不到一年就崩潰？"
        a: "政府發行金圓券，要人民限期把黃金、白銀、外幣換成金圓券，還把物價凍結在 8 月 19 日的水準。但軍費照付、鈔票照印，到 10 月中金圓券對美元已跌掉八成，11 月政府放棄限價，1949 年中發行量已是上限的好幾萬倍，形同廢紙。"
      - q: "金圓券的崩潰，怎麼影響到臺灣？"
        a: "金圓券初期與舊臺幣維持固定匯率，大陸的避險資金湧入臺灣，加速了臺灣的通膨；1949 年 6 月臺灣改發新臺幣。"
  - type: card
    id: finance-weimar-hyperinflation
    depth: story
    prompt: 再往前二十多年，德國也發生過一樣的事。注意德國的錢最後是怎麼「止血」的。
    focus: [F3, terms]
    quick:
      - q: "1923 年德國的鈔票為什麼印得更兇了？"
        a: "法國和比利時軍隊占領魯爾區後，德國政府號召工人罷工抵抗，還替罷工的人發薪水，錢仍然靠印鈔支付。"
      - q: "德國最後是怎麼止住通膨的？"
        a: "1923 年 11 月中發行新的「地租馬克」，1 地租馬克換 1 兆紙馬克。它以全國的土地和工商業資產擔保，並和黃金價格掛鉤，通膨才止住。"
  - type: compare
    cards: [finance-taiwan-1949-currency, finance-weimar-hyperinflation]
    prompt: 比一比臺灣和德國的兩次換新貨幣。
    rows:
      - { aspect: 時間, a: 1945–1949 年通膨，1949 年 6 月換新臺幣, b: 1921–1923 年通膨，1923 年 11 月換地租馬克 }
      - { aspect: 錢為什麼印太多, a: 替中央墊付內戰軍費與公務開支, b: 戰爭債務、賠款，加上 1923 年替魯爾罷工工人發薪水 }
      - { aspect: 換算比例, a: 四萬元舊臺幣換一元新臺幣, b: 一兆紙馬克換一地租馬克 }
      - { aspect: 怎麼重建信用, a: 限量發行、80 萬兩黃金準備，後來還要靠美援, b: 以全國土地與工商業資產擔保、和黃金價格掛鉤 }
    question: 兩次換新貨幣最大的相同點和最大的不同點各是什麼？
    model_answer: 相同點：都是政府靠印鈔撐財政，最後鈔票失去信用，只好換一種有擔保、限量發行的新貨幣。不同點：德國換成地租馬克後物價很快穩定；臺灣換成新臺幣後，因為赤字還在，物價又漲了好幾倍，要到美援進來才真正穩定。同一時期的大陸金圓券則是反例：換了新貨幣卻繼續濫印，不到一年就崩潰。
    points:
      - "相同點：都是政府靠印鈔撐財政，最後鈔票失去信用，只好換成有擔保、限量發行的新貨幣"
      - "不同點一：德國換成地租馬克後，物價很快穩定"
      - "不同點二：臺灣換成新臺幣後赤字還在，物價又漲了好幾倍，要到美援進來才真正穩定"
      - "金圓券是反例：換了新貨幣卻繼續濫印，不到一年就崩潰"
    hints:
      - 先看「錢為什麼印太多」那一列：兩邊的共同點是什麼？
      - 再看兩張卡的故事最後一段：換新貨幣之後，物價有沒有馬上停？
      - 想想金圓券：換新貨幣一定有用嗎？
  - type: decision
    role: 你是 1949 年 6 月的臺灣省政府官員
    situation: |
      舊臺幣已經印到一萬元面額，物價天天漲。大陸的金圓券正在崩潰，熱錢一直流進臺灣。
      中央撥來 80 萬兩黃金當準備。你可以換新貨幣，但手上的黃金有限，政府每個月還是要付軍費。你會怎麼設計？
    options:
      - { label: 發行新臺幣，嚴格限量並以黃金為準備, result: 這接近當年的選擇：新臺幣發行以 2 億元為限，5 元換 1 美元，並切斷和金圓券的兌換。但赤字仍在，物價一年內又漲了數倍，直到 1950 年代初美援進來才穩定。 }
      - { label: 不換貨幣，繼續發行舊臺幣、用管制壓物價, result: 推測：金圓券的經驗顯示，只靠限價、不停止印鈔，物價管制撐不了多久。歷史沒有在臺灣走這條路，所以後果只能推測。 }
      - { label: "不換貨幣，推出以黃金計價的儲蓄存款，收回市面上的錢", result: "推測：卡片記載，黃金儲蓄存款是新臺幣改革時另外推出的輔助辦法，不是替代品；只靠它、不換貨幣，能不能壓住物價，歷史沒有走這條路，所以後果只能推測。" }
    actual: 1949 年 6 月 15 日臺灣實施幣制改革，四萬元舊臺幣換一元新臺幣；新臺幣一直用到今天，但穩定物價花了好幾年。
    ref: finance-taiwan-1949-currency#F3
    note: 「沒有發生的選項」的後果都是推測，標示清楚。
  - type: today
    card: finance-taiwan-1949-currency
    question: 最近物價上漲，有人說「臺灣會不會又要四萬換一塊？」這個類比哪裡不成立？
    model_answer: 1949 年的臺灣處在內戰和大量移民湧入的非常時期，發鈔的是省級銀行，政府直接叫它印錢付軍費；今天臺灣有獨立的中央銀行、龐大的外匯存底和完整的物價統計，一般的物價上漲和當年每年漲好幾倍的惡性通膨，規模完全不同。這個類比可以提醒我們「印太多錢會出事」，但不能拿來預測今天會發生同樣的事。
    points:
      - "1949 年是內戰和大量移民湧入的非常時期，省級銀行被政府直接叫去印錢付軍費"
      - "今天有獨立的中央銀行、龐大的外匯存底和完整的物價統計"
      - "一般的物價上漲，和當年每年漲好幾倍的惡性通膨，規模完全不同"
      - "這個類比只能提醒「印太多錢會出事」，不能拿來預測今天會發生同樣的事"

id: unit-imjin-war
title: 壬辰戰爭：同一場戰爭，為什麼有三個名字？
histories: [朝鮮半島史, 日本史, 中國史]
mystery: 韓國叫它「壬辰倭亂」，日本叫「文祿・慶長之役」，中國叫「萬曆朝鮮之役」。同一場戰爭，為什麼三國說法不同？
teaser: 一位剛統一日本的武將，想借道朝鮮打明朝，結果把東亞三國都捲進七年大戰。
goals:
  - 能說出壬辰戰爭的起因、主要參戰方與結果
  - 能判讀李舜臣的一句上書，說出它的寫作情境
  - 能比較鳴梁海戰與薩拉米斯海戰，說出「以少勝多」的條件
  - 能從朝鮮、日本、中國三個角度說明同一場戰爭
minutes: 30
steps:
  - type: hook
    text: |
      同一場球賽，兩隊的球迷回家講的故事一定不一樣：贏的說「我們實力強」，輸的說「裁判有問題」，旁邊的觀眾可能又有第三種說法。
      1592 年開始的一場戰爭，在韓國、日本、中國的課本裡，連名字都不一樣。
      這個單元，我們要用三雙眼睛看同一場戰爭。
    guess:
      q: 同一場戰爭，韓國、日本、中國叫的名字都不一樣。你猜最主要是為什麼？
      options:
        - 三個國家的語言不同，其實只是同一個名字的翻譯
        - 三個國家記載的年代不一樣，所以叫成三場不同的戰爭
        - 三個國家站的位置不同：被侵略、對外出兵、出兵保護屬國，記得的重點就不同
        - 各國只想把戰爭的責任推給別人，所以故意取不同的名字
      reveal: "歷史上比較接近第三個。韓國稱「壬辰倭亂」，強調被侵略和李舜臣的英雄事蹟；日本稱「文祿・慶長之役」；中國稱「萬曆朝鮮之役」或「抗倭援朝」。名字不同，反映的是各自記得的重點不同。"
  - type: card
    id: event-toyotomi-unification
    depth: story
    prompt: 先認識發動戰爭的人：他統一日本之後，下一步想做什麼？
    focus: [C6, debate]
    quick:
      - q: "秀吉出兵朝鮮，公開說的目標是什麼？學者怎麼看他的真正動機？"
        a: "公開的目標是征服朝鮮、再征服明朝。學者對他的真正動機有不同解釋，例如擴張野心，或安置統一後無仗可打的武士。"
      - q: "秀吉是怎麼接手統一日本的事業的？"
        a: "1582 年織田信長在本能寺之變身亡，部將秀吉很快打敗叛將明智光秀，接手信長已經打下的大半基礎，1590 年小田原之戰勝利，日本完成統一。"
  - type: card
    id: event-joseon-dynasty
    depth: story
    prompt: 被攻打的朝鮮是什麼樣的國家？注意它和明朝的關係。
    focus: [C4, debate]
    quick:
      - q: "朝鮮是明朝的「附庸」嗎？"
        a: "在禮儀上，朝鮮對明朝稱臣朝貢，1401 年起正式加入朝貢體系；但內政保有高度獨立。三方對這層關係的理解也不一樣。"
      - q: "朝鮮王朝靠什麼治國？誰是統治階層？"
        a: "以理學（新儒學）治國，由讀書人與武官組成的「兩班」統治，佛教被壓抑。"
  - type: decision
    role: 你是 1592 年的朝鮮國王宣祖
    situation: |
      日軍在釜山登陸，一路北上，首都漢城眼看守不住。朝鮮的陸軍節節敗退。
      你可以留在漢城和城池共存亡，也可以往北撤退、向明朝求救，讓水軍和各地義兵繼續抵抗。你會怎麼做？
    options:
      - { label: 往北撤退，向明朝求救, result: 這是宣祖當年的選擇。他在漢城失守前一天出逃；明朝先後派出約 16 萬 6 千名士兵和大量白銀，戰局陷入僵持。這個選擇保住了王室，但朝鮮國土遭到七年戰火蹂躪。 }
      - { label: 死守漢城, result: 推測：日軍在一個月內就攻下漢城，死守可能讓國王被俘，朝鮮失去號召抵抗與求援的中心。歷史沒有走這條路，所以後果只能推測。 }
    actual: 宣祖北逃並向明朝求援。朝鮮靠水軍、各地義兵與明軍撐了七年，1598 年秀吉死後日軍撤退。估計朝鮮軍民死傷超過一百萬人。
    ref: war-imjin#A7
    note: 「沒有發生的選項」的後果都是推測，標示清楚。
  - type: card
    id: war-imjin
    depth: understand
    prompt: 讀「起因」時，把原因分成兩堆：長期的結構，和直接的導火線。
    focus: [A1, A2, A5]
    quick:
      - q: "為什麼說壬辰戰爭不只是「日本對朝鮮」？"
        a: "朝鮮名義上是明朝的屬國，所以向明朝求援。明朝先後派兵約 16 萬 6 千人，是三個國家都捲入的東亞大戰。"
      - q: "朝鮮陸軍節節敗退，為什麼戰爭還能打七年？"
        a: "李舜臣的水軍攻擊日軍的運輸船隊，讓日軍很難從海上補給北方前線；明朝派兵之後，戰局陷入僵持。"
  - type: chain
    prompt: 把下列事件依照「因 → 果」排成一條鏈（最上面是最早的原因）。
    items:
      - 豐臣秀吉統一日本
      - 秀吉要求借道朝鮮去征服明朝，遭到拒絕
      - 日軍在釜山登陸，不到一個月攻下漢城
      - 朝鮮向宗主國明朝求救，明朝派兵援助
      - 秀吉病死，日軍撤退
    explain: 統一 → 對外擴張的目標 → 出兵朝鮮 → 朝鮮求援、明朝參戰、戰局僵持 → 秀吉死後撤軍。注意最後一步：戰爭結束的直接原因是秀吉病死，而不是某一方徹底打贏。
    hints:
      - 先找出讓秀吉「有餘力」對外出兵的那件事。
      - 朝鮮要先被攻打，才會向明朝求救。
      - 戰爭是怎麼結束的？跟誰的生死有關？
    ref: war-imjin#A2
    followup:
      question: "這五件事裡，哪兩件之間只是先後，卡片並沒有說前一件促成後一件？"
      options:
        - "秀吉統一日本、手握大軍，到他要求借道朝鮮"
        - "秀吉要求借道被拒，到日軍在釜山登陸"
        - "日軍攻下漢城、國王北逃，到朝鮮向明朝求救"
        - "明朝派兵援助，到秀吉病死、日軍撤退"
      answer: 3
      explain: "明朝參戰之後，戰局陷入僵持；卡片寫日軍是在秀吉病死後才撤退，沒有證據顯示是明朝派兵直接促成撤軍。所以依卡片，這兩件只能說是一前一後。其他三組都有因果：統一讓秀吉手握大軍、以征服明朝為目標；借道被拒，他隨即出兵；漢城失守、國王北逃，朝鮮才向宗主國求救。"
      why_wrong:
        - "卡片把統一後手握大軍列為結構、借道被拒列為導火線，兩者是連在一起的起因。"
        - "卡片說秀吉要求借道遭拒，1592 年就出兵，這是因果。"
        - "漢城失守、國王北逃，朝鮮才向名義上的宗主國明朝求救，這是因果。"
        - null
  - type: card
    id: tech-turtle-ship
    depth: story
    prompt: 海上的明星是龜船。但讀完你會發現：關於它，我們不知道的比知道的多。
    focus: [T1, debate]
    quick:
      - q: "龜船有沒有包鐵甲？「潛水艇」的說法從哪裡來？"
        a: "史料沒有寫有沒有包鐵甲，學者還在爭論。「潛水艇」是 1919 年一份史料集把英文的 iron clad（鐵甲船）翻成「鐵甲潛航艇」，後來報紙和兒童書一再轉述，才變成神話。"
      - q: "龜船的設計是為了對付日軍的什麼戰法？"
        a: "日本武士擅長跳上敵船近身肉搏。龜船加蓋頂蓋、背上插滿鐵釘，讓敵人無法跳上來，還能衝進敵陣、衝撞敵船。"
  - type: source
    card: war-imjin
    idx: 0
    question: 李舜臣寫「今臣戰船，尚有十二」，最可能想說服國王什麼？
    options:
      - 雖然大敗，還有十二艘船，海戰還能打
      - 朝鮮水軍已經全滅，應該放棄海戰、改守陸地
      - 朝鮮應該趁早向日本求和，保住剩下的船
      - 他要求國王撥款，替他建造十二艘新的戰船
    answer: 0
    explain: 這句話寫在 1597 年朝鮮艦隊大敗之後，國王宣祖下令解散水軍、改到陸上作戰。李舜臣用「尚有」（還有）強調：船雖然少，仍然能戰。讀史料要先知道寫作情境：誰寫的、寫給誰、當時發生了什麼事。後來他實際帶 13 艘船在鳴梁擊退一百多艘日艦。
    hints:
      - 「尚有」是什麼意思？是「只剩」還是「還有」的語氣？
      - 這封上書寫在一場大敗之後，朝廷可能在討論什麼？
      - 他後來真的用這些船打了一場勝仗。
    ref: war-imjin#A7
    why_wrong:
      - null
      - "「尚有」是「還有」的語氣，他是反對放棄海戰，不是說水軍已經全滅。"
      - "上書主張繼續海戰，沒有求和；他後來真的在鳴梁擊退日艦。"
      - "十二是他手上現有的船數，不是要國王撥款新造的數量。"
    critique:
      question: "這句話收在李舜臣給國王的狀啟裡，上書時說 12 艘，到鳴梁海戰時是 13 艘。讀這句話時，下面哪個提醒最合理？"
      options:
        - "是日本人事後寫的紀錄，所以十二艘是日軍自己數出來的"
        - "是李舜臣自己寫給國王的，所以可以證明鳴梁一定打贏，不必再查"
        - "是寫給國王的上書，要說服國王，船數要和別的記載對照"
        - "是後人編出來的傳說，不是當時的文件，所以不能當史料"
      answer: 2
      explain: "這是李舜臣在大敗之後寫給國王的狀啟，目的是說服國王別放棄海戰，所以會強調「還有」。他上書時寫 12 艘，海戰時是 13 艘，可見船數要和其他記載對照。這句話能證明他的主張，不能單獨證明戰果；鳴梁的勝利還要看他利用潮流等記載。"
      why_wrong:
        - "出處是李舜臣上給國王的狀啟，不是日本人的紀錄。"
        - "這句話只顯示他的主張；鳴梁的結果要看戰役的其他記載，例如他利用潮流擊退一百多艘日艦。"
        - null
        - "它收在《壬辰狀草》，是當時上給國王的文件，不是後人編的傳說。"
  - type: compare
    cards: [war-imjin, war-greco-persian]
    prompt: 比一比東西方兩場「以少勝多」的海戰：1597 年鳴梁、前 480 年薩拉米斯。
    rows:
      - { aspect: 入侵者, a: 豐臣政權的日本艦隊, b: 薛西斯率領的波斯艦隊 }
      - { aspect: 防守方的處境, a: 朝鮮艦隊剛在漆川梁大敗，李舜臣只剩 13 艘船, b: 雅典剛靠勞里昂銀礦的錢造好新艦隊，和其他希臘城邦聯合作戰 }
      - { aspect: 地形, a: 鳴梁海峽潮流湍急, b: 薩拉米斯海峽狹窄，船多的一方施展不開 }
      - { aspect: 結果, a: 擊退一百多艘日艦，但戰爭又打了一年，直到秀吉病死, b: 希臘獲勝，波斯主力撤退 }
    question: 兩場海戰能「以少勝多」，共同的關鍵是什麼？最大的不同又是什麼？
    model_answer: 共同關鍵是地形：都把數量較多的敵艦引進狹窄、難以展開的海峽，讓對方的數量優勢發揮不出來。不同點：薩拉米斯是波希戰爭的轉折點，波斯艦隊隨後撤退（波斯留下的陸軍隔年在普拉提亞戰敗才退出希臘）；鳴梁雖然穩住了朝鮮的海上防線，但戰爭並沒有因此結束，日軍是在秀吉病死後才撤退的。
    hints:
      - 看「地形」那一列：兩邊的海峽有什麼共同點？
      - 看「結果」：海戰打贏之後，戰爭馬上結束了嗎？
      - 想想看：數量多的艦隊，在什麼地方最吃虧？
    points:
      - 共同關鍵是地形：把數量較多的敵艦引進狹窄、難以展開的海峽，讓對方的數量優勢發揮不出來
      - 薩拉米斯是波希戰爭的轉折點，波斯艦隊隨後撤退（陸軍隔年在普拉提亞戰敗才退出希臘）
      - 鳴梁穩住了朝鮮的海上防線，但戰爭沒有結束，日軍是秀吉病死後才撤退
  - type: today
    card: war-imjin
    question: 有人說「壬辰戰爭證明朝鮮半島永遠是大國角力場，今天也一樣」。這個說法哪裡不成立？
    model_answer: 16 世紀的「宗主國—屬國」關係和今天的主權國家、同盟條約完全不同；當時也沒有國際法和戰爭法的約束。今天的朝鮮半島分成兩個國家，周邊國家的關係也由條約、聯合國等機制規範。壬辰戰爭可以提醒我們「地理位置會讓周邊強國捲入」，但不能拿來預測今天的局勢。
    points:
      - 16 世紀的「宗主國—屬國」關係，和今天的主權國家、同盟條約完全不同
      - 當時沒有國際法和戰爭法的約束；今天有條約、聯合國等機制規範
      - 可以借來想的是「地理位置會讓周邊強國捲入」，但不能拿來預測今天的局勢
  - type: check
    items:
      - kind: choice
        q: 下列哪一個是壬辰戰爭的「直接導火線」？
        options: [秀吉統一日本，手下有大批武士, 朝鮮以理學治國，佛教受到壓抑, 朝鮮在禮儀上向明朝稱臣朝貢, 秀吉要求借道朝鮮征服明朝遭拒]
        answer: 3
        explain: 秀吉統一日本、手握大軍是結構；他要求借道朝鮮被拒、隨即出兵，是直接導火線。
        hints: [導火線通常是一件「具體、時間很近」的事。, 哪一個選項有明確的要求和拒絕？]
        ref: war-imjin#A2
        why_wrong:
          - "這是結構（背景），不是導火線；統一後手握大軍，還需要一件具體的事才會出兵。"
          - "這是朝鮮長期的治國方式，卡片沒有把它列為戰爭的起因。"
          - "這是長期的關係，解釋了朝鮮為什麼能向明朝求援，不是引發出兵的那件事。"
          - null
      - kind: order
        q: 依時間先後排列：
        items: [豐臣秀吉統一日本, 日軍在釜山登陸, 鳴梁海戰, 秀吉病死、日軍撤退, 德川家康贏得關原之戰]
        explain: 1590 統一 → 1592 登陸 → 1597 鳴梁 → 1598 秀吉死、撤軍 → 1600 關原之戰。
        hints: [鳴梁發生在日本第二次出兵之後。, 關原之戰是秀吉死後日本國內的權力之爭。]
        ref: war-imjin#A9
      - kind: short
        q: 用一兩句話說明：為什麼說龜船「不是李舜臣發明的」？
        model: 因為朝鮮王朝的官方紀錄早在 1413 年就提到龜船；李舜臣是在 1592 年戰爭爆發前改良並建造了新的龜船。
        explain: 名人常常被記成「發明者」，但很多技術是在前人的基礎上改良的。
        hints: [回去看龜船卡的故事第一句。, 1413 年和 1592 年差了多少年？]
        ref: tech-turtle-ship#T2
        points:
          - 朝鮮王朝的官方紀錄早在 1413 年就提到龜船
          - 李舜臣是在 1592 年戰爭爆發前，改良並建造了新的龜船
          - 所以他是改良者，不是發明者
  - type: recap
    model_answer: 因為每個國家站的位置不同。對韓國來說，這是被侵略、國土殘破、靠李舜臣和義兵守住國家的「倭亂」；對日本來說，這是秀吉統一後的對外出兵，以撤軍收場；對中國來說，這是萬曆皇帝出兵保護屬國的戰爭，花了大量白銀。名字不同，反映的是各自記得的重點不同；讀歷史時，最好三種說法都聽聽看。
    points:
      - 韓國：被侵略、國土殘破、靠李舜臣和義兵守住國家的「倭亂」
      - 日本：秀吉統一後的對外出兵，以撤軍收場
      - 中國：萬曆皇帝出兵保護屬國，花了大量白銀
      - 名字不同，反映各自記得的重點不同
reflect: 同一場戰爭，三個國家用三個名字記住它。想一件你和別人記得不一樣的事：如果從對方的角度重講一次，故事會變成什麼樣子？

  chapters:
    - no: 1
      part: 1
      title: 地球上曾經不只一種人？
      en: An Animal of No Significance
      claim: |
        哈拉瑞提醒我們：人類本來只是一種普通的動物，大約 200 萬年前到 1 萬年前，地球上同時住著尼安德塔人、直立人、弗洛勒斯人等好幾種「人」，智人只是其中之一 [b1][b23]。人類腦袋大、很耗能，長期只在食物鏈中段，直到大約 10 萬年前才突然爬到頂端 [b1][b23]。其他人種為什麼消失？書裡並列「取代說」和「混血說」，並指出 DNA 研究發現現代歐亞人身上帶有少量尼安德塔人基因 [b1]。
      cards:
        - event-homo-species
        - event-out-of-africa
      debate:
        - who: 莎莉・麥克布里蒂與艾莉森・布魯克斯（Sally McBrearty & Alison S. Brooks）
          text: 她們整理非洲化石紀錄後認為，非洲的人類化石大致連續、可能有好幾個候選祖先；若把被歸為 H. helmei 的化石也算進智人，智人的起源可推到約 25 萬到 30 萬年前，比一般說法更早也更漸進 [b31]。
          src:
            - b31
        - who: 較新的化石發現（摩洛哥傑貝爾依羅，2017 年發表）
          text: 摩洛哥的化石用熱釋光法測得約 31.5 萬年前，被許多學者看成最早的智人之一，所以智人出現的時間和地點可能比過去以為的更早、範圍也不只東非；不過也有學者質疑這些化石該不該算智人，因為化石抽不到 DNA，人屬物種的界線本來就模糊 [b38]。
          src:
            - b38
      think: 書上說智人約 10 萬年前「突然」登上食物鏈頂端。看看「地球上的多種人類」和「走出非洲」兩張卡的年代，你覺得這是突然發生，還是花了很久？證據夠讓我們下結論嗎？
    - no: 2
      part: 1
      title: 會說故事，為什麼能稱霸？
      en: The Tree of Knowledge
      claim: |
        哈拉瑞認為，大約 7 萬年前智人的思考和溝通方式出現大躍進（他稱為「認知革命」），可能來自偶然的基因突變；之後才出現船、油燈、弓箭等新東西 [b2]。語言讓人能講八卦、判斷誰可信，更關鍵的是能談「不存在的東西」，例如神、國家、公司 [b2][b22]。哈拉瑞認為，只要大家相信同一個故事，成千上萬互不認識的人也能合作；黑猩猩靠彼此熟識維持群體，群體大到一定程度就會分裂；人類光靠八卦和私交，能互相信任的人數也有限，但靠共同的想像突破了這個限制 [b2]。
      cards:
        - event-cognitive-revolution
        - event-out-of-africa
        - event-french-revolution
      debate:
        - who: 莎莉・麥克布里蒂與艾莉森・布魯克斯（Sally McBrearty & Alison S. Brooks）
          text: 〈沒有發生的革命〉一文主張：所謂 4 到 5 萬年前「突然出現」的現代行為，如骨器、顏料加工、遠距交易、裝飾品，其實在非洲中石器時代早了好幾萬年就零星出現，是慢慢累積而成，不是一次突變 [b31][b32]。
          src:
            - b31
            - b32
        - who: 南非布隆伯斯洞穴（Blombos Cave）的考古發現（維基百科整理）
          text: 洞穴裡有約 10 萬年前的顏料作坊、約 7 萬 7 千年前刻有幾何紋的赭石、約 7 萬 5 千年前的貝殼珠；曾被拿來解釋「認知革命」的 FOXP2 基因說法，後來也受到質疑 [b32]。
          src:
            - b32
        - who: 達珊娜・納拉亞南（Darshana Narayanan，神經科學家）
          text: 她和幾位生物學家一起查核《人類大歷史》，認為書裡的錯誤「又多又重大」。例如本章說「所有猿類和猴子都有口語語言」，她認為照語言學的定義，有規則的符號語言是人類獨有；本章又說黑猩猩會並肩對抗狒狒和獵豹，但生物學家指出黑猩猩和獵豹在非洲的分布範圍並不重疊，作者可能把獵豹和花豹搞混了 [b29]。
          src:
            - b29
      think: 「認知革命」如果是 7 萬年前一次突變，考古上應該看到什麼？如果是慢慢累積，又應該看到什麼？對照「認知革命」卡上的出土證據，你比較相信哪一種？
    - no: 3
      part: 1
      title: 採集時代的人過得比較好？
      en: A Day in the Life of Adam and Eve
      claim: |
        哈拉瑞拿採集者和後來的農民比較，認為採集者吃得更多樣、傳染病較少、每週工作時間也較短：就連住在喀拉哈里沙漠這類嚴苛環境的現代採集者，平均每週也只工作約 35 到 45 小時，比不少現代人少 [b3][b37]。但他也承認採集生活有嬰兒死亡率高、意外多、跟不上的人可能被拋下等艱苦面 [b3]。他一再提醒：這段時期留下的證據很少，現代的採集部落又差異很大，我們對當時的信仰、階層和暴力程度所知有限 [b3]。
      cards:
        - event-out-of-africa
        - event-peopling-americas
        - building-gobekli-tepe
      debate:
        - who: 賈德・戴蒙（Jared Diamond，演化生物學家、地理學家）
          text: 他 1987 年的文章〈人類史上最大的錯誤〉早就提出類似看法：骨骸顯示採集者比後來的農民高、較少營養不良；喀拉哈里沙漠的採集者每週只花約 12 到 19 小時找食物——這個數字和哈拉瑞書中的說法並不一樣 [b30]。
          src:
            - b30
        - who: 大衛・格雷伯與大衛・溫格羅（David Graeber & David Wengrow）
          text: 《萬物的黎明》認為史前人類的社會組織比想像中多樣，有些群體一年中會在階層嚴明和平等共治之間季節性地切換，所以不能用單一的「採集者生活」來概括 [b35]。
          src:
            - b35
      think: 哈拉瑞自己也說證據很少。如果要判斷「採集者比較快樂」，你會想要哪些證據（骨骸？工具？遺址規模？）？「哥貝克力石陣」這張卡能告訴我們採集者的什麼事？
    - no: 4
      part: 1
      title: 巨獸滅絕，人類是兇手？
      en: The Flood
      claim: |
        哈拉瑞認為，智人坐船抵達澳洲後幾千年內，巨型有袋動物等大型動物大量消失；美洲大約 1 萬 6 千年前人類到達時也出現同樣的情況，紐西蘭的動物撐過了 4 萬 5 千年的氣候變化，卻在約 800 年前人類登島之後，失去大約六成鳥種 [b4]。他認為這些動物撐過了以前的冰期，而且同期海洋生物變化不大，所以主因是人類而非氣候 [b4]。他把人類比喻成吞沒其他物種的「大洪水」，並警告大型動物的滅絕還沒結束 [b4]。
      cards:
        - event-megafauna-extinction
        - event-peopling-americas
        - event-out-of-africa
      debate:
        - who: 第四紀滅絕事件研究的另一派（維基百科整理）
          text: 澳洲的大型動物化石稀少、年代也難以精準測定；2010 年代後的研究發現不少物種其實和人類共存了一段時間，部分學者仍主張氣候變遷才是主因；2025 年的文獻回顧指出學界仍深度分裂 [b33]。
          src:
            - b33
        - who: 托比亞斯・安德曼（Tobias Andermann）等人 2020 年研究
          text: 他們分析 12 萬 6 千年來的哺乳動物滅絕，認為約 96% 主要是人類活動造成，滅絕常在人類初抵各大陸時成批發生——比較支持哈拉瑞；也有不少學者主張「人類狩獵加上氣候壓力」共同作用 [b33]。
          src:
            - b33
      think: 要證明「人類是兇手」，至少需要哪兩件事在時間上對得上？對照「大型動物滅絕」和「人類抵達美洲」兩張卡的年代，你覺得目前的證據足夠定罪嗎？還缺什麼？
    - no: 5
      part: 2
      title: 種田是一場大騙局？
      en: History's Biggest Fraud
      claim: |
        哈拉瑞指出，大約 1 萬 2 千到 1 萬年前，中東、中美洲和中國各自獨立開始農業 [b5]。他認為農業讓人口變多，卻讓多數人更辛苦：工作更久、飲食變單調、更容易生病和鬧饑荒，所以稱之為「史上最大騙局」（第 5 章）；甚至可以說是小麥馴化了人類 [b5][b24][b22]。他也拿哥貝克力石陣為例，認為可能是先有大型宗教建築，人們才為了供應建造者而開始耕作 [b5]。
      cards:
        - event-fertile-crescent-agriculture
        - building-gobekli-tepe
        - event-east-asia-agriculture
      debate:
        - who: 賈德・戴蒙（Jared Diamond）
          text: 他用骨骸證據支持類似看法：伊利諾州、俄亥俄州出土的玉米農民骨骸顯示更多營養不良、貧血和傳染病；農業讓少數菁英能拿走別人的糧食，也加重了女性的負擔 [b30]。
          src:
            - b30
        - who: 詹姆斯・斯科特（James C. Scott，《反穀》作者）
          text: 他認為定居早於農業，常發生在資源豐富的濕地；從馴化作物到美索不達米亞出現國家，中間隔了四千多年；穀物同時成熟、容易被看見和收稅，所以特別適合國家控制人民 [b34]。
          src:
            - b34
        - who: 哥貝克力石陣的新考古發現（維基百科整理）
          text: 2019 年起發現住屋、蓄水池和日常工具，學者已大致放下「只是神廟、沒人住」的看法，認為儀式和日常生活並存；遺址有大量磨石，但還無法確定加工的是野生還是栽培穀物 [b36]。
          src:
            - b36
      think: 「哥貝克力石陣」卡上的新發現（有住屋、有水池）會讓「先有神廟才有農業」的說法更強還是更弱？再看「肥沃月彎」和「東亞農業」兩張卡，各地開始農業的過程一樣嗎？
    - no: 6
      part: 2
      title: 人人平等也是想像出來的？
      en: Building Pyramids
      claim: |
        哈拉瑞認為農業時代的人口太多，已經回不去採集生活；剩餘糧食養活了菁英，一般人反而更焦慮、更辛苦 [b6]。他把約 3,800 年前的《漢摩拉比法典》和美國《獨立宣言》並列，指出前者說神定下了貴賤高低，後者說造物主讓人人平等 [b6]。哈拉瑞認為這兩者都是「想像的秩序」：人權不是生物學上的事實，而是讓陌生人能合作的共同信念；只要夠多人一起改變想法，秩序就會改變 [b6][b24]。
      cards:
        - finance-mesopotamia-credit
        - event-declaration-of-independence
        - event-american-founding-philosophy
      debate:
        - who: 大衛・格雷伯與大衛・溫格羅（David Graeber & David Wengrow）
          text: 他們指出有些早期城市幾乎看不到宮殿、神廟或中央倉庫，例如特奧蒂瓦坎後來轉向多數居民住平等的住宅；所以農業與城市不一定帶來由上而下的階層，人類其實一直在選擇不同的社會安排 [b35]。
          src:
            - b35
        - who: 詹姆斯・斯科特（James C. Scott）
          text: 他強調早期國家要把人「固定」在土地上才能收稅、徵兵，城牆可能是為了把納稅人關在裡面；換句話說，維持秩序的不只是共同的信念，還有強制力 [b34]。
          src:
            - b34
      think: 哈拉瑞認為「人權是想像的秩序」。讀「美索不達米亞神廟借貸與漢摩拉比法典」和「獨立宣言」兩張卡：兩種秩序各靠什麼讓人遵守——信念、法律，還是武力？「想像出來的」是否就等於「不重要」或「可以不遵守」？
    - no: 7
      part: 2
      title: 文字是為了記帳而發明？
      en: Memory Overload
      claim: |
        哈拉瑞指出，人類的大腦不擅長記大量數字和帳目，而大型社會偏偏需要記錄稅收、財產和交易 [b7][b24]。蘇美人約在西元前 3500 年發展出文字，最初用來記帳收稅，後來才慢慢能寫法令、書信和詩 [b7]。他也談到印加人用結繩記錄、阿拉伯數字源自印度，並認為今天電腦用的二進位是更具革命性的「文字」 [b7][b24]。
      cards:
        - tech-cuneiform
        - finance-mesopotamia-credit
        - tech-internet
      debate:
        - who: 丹妮絲・施曼特－貝瑟拉（Denise Schmandt-Besserat，考古學家）
          text: 她研究兩河流域出土的小陶土「籌碼」，認為這些籌碼原本用來點算農產品，後來演變成最早楔形文字裡的數字和符號；「文字從記帳而來」的看法大致被學界接受，和書的說法相合。不過也有學者質疑：她收集的籌碼樣本可能有偏差，有些籌碼也許和喪葬或社會用途有關，形狀也不夠一致，未必是一套完整的記帳系統 [b39]。
          src:
            - b39
        - who: 中國甲骨文與馬雅文字（維基百科整理）
          text: 不是每種文字一開始都拿來記帳。商朝晚期（約前 1250–前 1050 年）的甲骨文，大多是王室占卜的紀錄，內容是戰爭、祭祀、農事和王室生老病死，條目裡沒有提到記帳 [b40]。最早的馬雅文字約在前 3 世紀，主要刻在石碑、牆壁和陶器上，記錄王朝歷史、曆法和祭祀，條目整理的內容以王朝、政治和祭祀為主，沒有提到經濟帳目 [b41]。這兩個例子說明，文字的起源可能不只一種動機。
          src:
            - b40
            - b41

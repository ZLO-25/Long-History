id: unit-ming-silver
title: 白銀帝國：明朝的錢為什麼要從地球另一邊運來？
histories: [中國史, 錢的歷史, 世界通史]
mystery: 明朝是當時世界上人口最多的國家之一，可是它用的銀子，很多來自日本和美洲。為什麼一個大帝國的錢要靠別人供應？
teaser: 一張變成廢紙的鈔票，引來了橫越太平洋的白銀大帆船。
goals:
  - 能用因果鏈說明明朝為什麼從紙鈔轉向白銀
  - 能說出白銀從美洲和日本流進中國的路線
  - 能判讀一段明代史料，說出海外貿易帶回多少錢、對誰有利
  - 能比較「全球化從 1571 年開始」與「全球化從 19 世紀開始」兩種看法
minutes: 35
level: 皆可
curriculum: ["歷 Ia-IV-2"]
steps:
  - type: hook
    text: |
      假設學校福利社規定只能用「福利社點數」買東西，可是點數越印越多，最後一百點才買得到一包餅乾。
      同學們會怎麼辦？大概會偷偷改用真正的現金交易。
      明朝也發生了一樣的事，只是那個「現金」是白銀，而且很多銀子來自地球的另一邊。
    guess:
      q: 明朝為什麼會缺銀，要靠日本和美洲的銀子？
      options:
        - 外國為了讓明朝臣服，把白銀當禮物大量送來
        - 明朝改用白銀交易繳稅，需求極大，自己又產得不多
        - 歐洲人強迫明朝用他們的銀幣來繳稅和做生意
        - 明朝的銀礦被挖光了，皇帝下令向外國買銀
      reveal: 明朝的紙鈔失敗後，民間和朝廷都改用白銀，中國對銀的需求變得很大；可是中國自己產銀不多，銀在中國比在歐洲值錢約兩倍，所以日本和美洲的銀子就被「吸」進來，換走絲綢和瓷器。
  - type: card
    id: finance-ming-baochao
    depth: story
    prompt: 先看明朝的紙鈔怎麼失敗。注意：寶鈔能不能拿去換回金銀？
    focus: [F3]
    quick:
      - q: 寶鈔為什麼越印越不值錢？
        a: 因為寶鈔不能拿去換回金銀，政府也沒有限制印多少。打仗、發薪水需要錢就再印，民間越來越不信任，到 1436 年已經要上千貫寶鈔才換得到一兩白銀。
      - q: 很多人以為明朝一開始就用白銀繳稅，其實呢？
        a: 其實朝廷原本禁止民間用金銀交易。是寶鈔失敗後，民間先私下改用白銀，朝廷才一步步承認：1436 年起北京用銀發軍官俸祿，1567 年正式允許「銀錢兼使」。
  - type: sim
    sim: debase
    prompt: 動手試試看：這個模擬用的是銀幣，但道理相通：政府用「不值那麼多」的錢付帳，付得越多，物價會怎樣？想一想，寶鈔的情況哪裡和模擬一樣、哪裡不一樣？
  - type: chain
    prompt: 把下列事件依照「因 → 果」排成一條鏈（最上面是最早的原因）。
    items:
      - 明朝發行寶鈔，不能兌換金銀，也不限制發行量
      - 寶鈔越印越多，民間不再信任
      - 民間私下改用白銀，朝廷後來也開始收白銀
      - 中國對白銀的需求大增，白銀在中國比在歐洲值錢得多
      - 日本和美洲的白銀經海路大量流進中國
    followup:
      question: 這條鏈裡，哪一項最直接說明「外國的白銀為什麼會流進中國」？
      options:
        - 明朝發行寶鈔，不能兌換金銀，也不限制發行量
        - 寶鈔越印越多，民間不再信任，私下改用白銀
        - 中國需要大量白銀，銀在中國比歐洲值錢
        - 民間改用白銀後，朝廷後來也開始收白銀
      answer: 2
      explain: 銀子會千里迢迢運到中國，是因為銀在中國比別處值錢得多，商人運來最有賺頭。其他三項都是前面的步驟：它們讓中國變得需要白銀，但「銀在哪裡最值錢」才是把外國銀吸進來的直接原因。
      why_wrong:
        - 這是整條鏈的起點：它讓寶鈔失敗，但還沒有解釋外國白銀為什麼要來中國。
        - 這讓民間開始用白銀，但外國商人運銀，是看銀在中國能賣到多高的價錢。
        - null
        - 朝廷收銀讓白銀更被需要，但這仍是中國國內的改變；外國銀的流入，要看銀在中國比別處值錢。
    explain: 紙鈔失敗 → 改用白銀 → 中國需要大量白銀，銀價比別處高 → 外國白銀被吸引進來。這條鏈說明了明朝國內的貨幣問題，怎麼變成一場全球的貿易。
    hints:
      - 最早的原因是一種「紙做的錢」。
      - 先有人改用白銀，白銀才會變得搶手。
      - 銀子為什麼要千里迢迢運到中國？因為在那裡最值錢。
    ref: finance-ming-baochao#F5
  - type: card
    id: commodity-iwami-silver
    depth: story
    prompt: 白銀的第一個來源：日本。注意是誰把日本銀運進中國的。
    focus: [B4]
    quick:
      - q: 明朝禁止和日本貿易，日本的銀子怎麼還是流進中國？
        a: 起初多由中國走私海商（倭寇）偷偷運進東南沿海。1557 年葡萄牙人在澳門落腳後，也用中國絲綢到長崎換日本的白銀，再轉運進中國。
  - type: card
    id: commodity-manila-galleon
    depth: story
    prompt: 白銀的第二個來源：美洲。看看這條橫越太平洋的航線有多危險。
    focus: [B4, B5]
    quick:
      - q: 為什麼要千里迢迢把美洲的銀子送到馬尼拉？
        a: 因為明朝改用白銀後，銀在中國比在別處值錢得多。福建商人把絲綢和瓷器運到馬尼拉，換走大帆船載來的白銀。
      - q: 這條航線有多危險？用卡片裡的數字說說看。
        a: 回美洲的航程要四到八個月，一趟常有幾十到一百多人死亡。250 年間至少有 30 艘船沉沒。
  - type: card
    id: commodity-silver-flow
    depth: deep
    prompt: 把兩條路線合起來看。讀「史家怎麼吵」時注意：白銀是中國「吸」過去的，還是世界「推」過去的？
    focus: [debate]
    quick:
      - q: 白銀為什麼會流進中國？弗林與吉拉德茲和丸橋充拓的看法差在哪？
        a: 弗林與吉拉德茲認為，中國對白銀的需求是推動全球白銀貿易的主力。丸橋充拓則從明朝財政看，認為北方邊防軍需改用白銀，才是把白銀拉進中國的關鍵。
      - q: 有人說白銀變少讓明朝滅亡了，學者都同意嗎？
        a: 不同意。有一說認為 1630–40 年代白銀減少造成通貨緊縮，加速明朝在 1644 年滅亡；但萬志英認為白銀存量最多只降約 4%，不足以造成危機，弗蘭克則不同意他的看法。
  - type: source
    card: commodity-silver-flow
    idx: 0
    question: 周起元說海外貿易「所貿金錢，歲無慮數十萬，公私並賴」，最能說明什麼？
    options:
      - 明朝全面禁止海外貿易，所以沒有人從中賺錢
      - 只有皇帝能從海外貿易賺錢，官府和民間都沒份
      - 海外貿易讓明朝虧損很多錢，官府只好禁止
      - 海外貿易每年帶回大量錢財，官民都依賴
    answer: 3
    why_wrong:
      - 這句話在講海外貿易帶回很多錢；而且 1567 年明朝已經開放民間出海，不是全面禁止。
      - 「公私並賴」是官府和民間都靠它，不是只有皇帝賺錢。
      - 「所貿金錢」是貿易帶回的錢財，不是虧損。
      - null
    critique:
      question: 周起元這段話寫在《東西洋考》的序裡。關於這段史料，哪個判斷最穩妥？
      options:
        - 這是官府的稅收統計，「數十萬」是精確的數字，可以直接拿來計算金額
        - 這是替書寫的序，可能強調好處；能看出當時的評價，不能當精確統計
        - 周起元反對海外貿易，這段話是在批評貿易帶來的壞處和官府的損失
        - 這段話寫在 1567 年開放出海之前，證明禁令時期海外貿易已經很興盛
      answer: 1
      explain: 這段話出自周起元替張燮《東西洋考》（1617 年成書）寫的序，談的是隆慶開海之後的情況。作者在替一本講海外貿易的書寫序，有理由強調貿易的好處，「無慮數十萬」也只是大概的說法。所以它能證明「當時有人認為海外貿易帶回很多錢、官民都依賴它」，卻不能證明精確的金額。
      why_wrong:
        - 這不是稅收統計，而是序文裡的一句話；「無慮數十萬」只是大概的說法。
        - null
        - 他是在稱讚海外貿易「公私並賴」，不是批評。
        - 這段話談的是 1567 年隆慶開海之後的情況，不是之前。
    explain: 「歲無慮數十萬」是每年大約數十萬，「公私並賴」是官府和民間都靠它。這是 1567 年明朝開放民間出海之後的情況。讀這段史料也要注意：作者在替一本講海外貿易的書寫序，他有理由強調貿易的好處。
    hints:
      - 「歲」是每年，「公私」是官府和民間。
      - 這段話寫在明朝開放民間出海之後還是之前？
      - 作者在替什麼樣的書寫序？
    ref: commodity-silver-flow#B7
  - type: compare
    cards: [commodity-iwami-silver, commodity-manila-galleon]
    prompt: 比一比兩條白銀路線。
    rows:
      - { aspect: 產地, a: 日本石見銀山（1533 年起用灰吹法大量提煉）, b: 美洲的墨西哥、波托西（今玻利維亞）等銀山，從墨西哥阿卡普爾科出海 }
      - { aspect: 怎麼運到中國, a: 起初多由中國走私海商偷運，後來葡萄牙人經長崎、澳門轉運, b: 西班牙大帆船橫越太平洋到馬尼拉，再由福建商人帶回中國 }
      - { aspect: 換回什麼, a: 中國絲綢, b: 中國絲綢和瓷器 }
      - { aspect: 誰付出代價, a: 明朝禁止對日貿易，海商冒著違法的風險, b: 南美洲被強迫勞動的原住民礦工；航程中死去的船員；馬尼拉多次遭屠殺的華人 }
    question: 兩條路線有什麼共同點？為什麼它們最後都通往中國？
    points:
      - 兩條路線都把外國產的白銀運到中國，換走中國的絲綢（和瓷器）
      - 都不是明朝官方主動去取，而是外國商人和中國海商把銀運進來
      - 都通往中國，是因為明朝改用白銀後需求極大、自己產銀不多，銀在中國比在歐洲值錢得多
    model_answer: 共同點是：都把外國產的白銀運到中國，換走中國的絲綢和瓷器；而且都不是明朝官方主動去取，而是外國商人和中國海商把銀運進來。它們都通往中國，是因為明朝改用白銀後需求極大，自己又產銀不多，銀在中國比在歐洲值錢得多，運銀到中國最有賺頭。
    hints:
      - 看「換回什麼」那一列。
      - 回想因果鏈：銀子為什麼在中國特別值錢？
      - 看「誰付出代價」：這條財富之路，也有很多看不見的人。
  - type: decision
    role: 你是 1567 年的明朝官員
    situation: |
      朝廷一向禁止百姓出海貿易，可是沿海走私越來越猖獗，還有海盜作亂。另一方面，國內越來越需要白銀，而白銀大多是從海外來的。
      有人主張開放福建月港，讓百姓合法出海；也有人說開放會讓海盜更多、讓倭寇有機可乘。你會怎麼建議？
    options:
      - { label: 開放民間出海貿易（但仍禁止對日本貿易）, result: 這接近明朝當年的選擇，史稱「隆慶開海」。海外貿易每年帶回的錢據說有「數十萬」，大量白銀從馬尼拉流進中國；但對日貿易仍然被禁，日本銀主要還是靠走私和葡萄牙人轉運。 }
      - { label: 繼續全面禁止出海, result: 推測：國內對白銀的需求不會消失，走私可能更猖獗，朝廷也收不到這部分的稅。歷史沒有走這條路，所以後果只能推測。 }
    actual: 1567 年明朝開放民間從月港出海貿易，但仍禁止對日本貿易。白銀從此更大量流入中國，也讓明朝的經濟更依賴海外白銀。
    ref: commodity-silver-flow#B7
    note: 「沒有發生的選項」的後果都是推測，標示清楚。
  - type: today
    card: commodity-silver-flow
    question: 有人說「明朝依賴外國白銀，就像今天的國家依賴外國晶片或石油」。這個類比哪裡不成立？
    points:
      - 明朝的白銀就是「錢」本身，貨幣供應掌握在外國產地和商人手上；今天的國家有自己發行的貨幣，晶片和石油是商品
      - 當時白銀靠帆船運送，速度和規模都和今天的國際貿易完全不同
      - 這個類比只能幫我們想「依賴外部供應的風險」，不能直接套用
    model_answer: 明朝的白銀是當作「錢」本身，國家的貨幣供應掌握在外國產地和商人手上；今天的國家有自己發行的貨幣，晶片和石油是商品，不是貨幣。而且當時的白銀靠帆船運送，速度和規模都和今天的國際貿易完全不同。這個類比可以幫我們想「依賴外部供應的風險」，但不能直接套用。
  - type: check
    items:
      - kind: choice

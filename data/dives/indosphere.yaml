power_ui:
  title: 南進與吳哥示意圖
  subtitle: 大越往南、吳哥興衰：一千年間中南半島的版圖怎麼變
  caveat: 以今日越南、柬埔寨的省界（Natural Earth 10m 舊省界）近似當時各國的範圍；寮國、泰國只用經緯線切出受吳哥影響的一部分。古代東南亞的國家常常是「中心很清楚、邊界很模糊」，很多地方是向好幾個國家進貢，所以這些顏色只是示意，不是當時真正畫在地上的國界。長山山脈的高地各族大多不受任何王朝直接統治，另用一色表示。

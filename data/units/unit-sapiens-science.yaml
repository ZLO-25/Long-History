id: unit-sapiens-science
title: 科學革命：承認「我們不知道」，為什麼會和帝國、資本綁在一起？
histories: [世界通史, 歐洲史, 美洲史, 錢的歷史]
mystery: 1768 年，一艘英國海軍的船載著天文學家和植物學家出發，公開的任務是去大溪地「看金星」；兩年後，船長卻在澳洲宣布整條東岸屬於英國。哈拉瑞認為，現代科學的起點是願意承認「我們不知道」，而這股找答案的衝勁，和帝國、資本一路綁在一起。歐洲人為什麼願意承認無知？這又為什麼和征服、賺錢分不開？卡片上的證據，支持這個說法到哪裡？
teaser: 一趟去看金星的航行、一句「五十個人就能征服他們」的日誌、一張寫著「十年後可以退出」的公司特許狀、一艘船艙裡滿是尖叫聲的奴隸船：知識、槍砲和錢，怎麼一起出海？
goals:
  - 能說出哈拉瑞「科學、帝國與資本互相推動」的說法，並用卡片各舉一個支持和一個需要保留的例子
  - 能判讀哥倫布 1492 年的航海日誌，分辨「他相信什麼」和「後來實際怎麼發生」
  - 能比較鄭和與庫克的航行，說出兩支船隊的目的、出資者與後果有什麼不同，以及「價值觀不同」之外還有哪些解釋
  - 能依先後排出從美洲殖民到大西洋奴隸貿易興起、再到禁止的過程
  - 能指出「西班牙人靠技術優勢以少勝多」和「核武帶來長和平」這兩個說法，卡片支持到哪裡、還有哪些學者不同意
minutes: 50
steps:
  - type: hook
    text: |
      想像學校辦一趟出國參訪，經費由一家公司贊助。公司說：參訪內容你們自己決定，但回來要幫我們拍廣告、替我們說話。這還算單純的參訪嗎？
      1768 年 8 月，英國的奮進號從普利茅斯出發，船長是庫克。船上除了水手，還有皇家學會派的天文學家格林，以及自費帶了 7 人同行的植物學家班克斯。公開的任務是到大溪地觀測金星凌日，藉此算出地球和太陽的距離；可是這趟由海軍和皇家學會合辦的航行，還有一份秘密命令。
      哈拉瑞在《人類大歷史》第四部認為，科學和過去的傳統最大的不同，是願意承認「我們不知道」，再用觀察和數學不斷修正（第 14 章）；但他也認為科學從來不中立，研究要花錢，國王和政府常為了征服和打仗出錢。他用庫克的航行說明科學和帝國是一枚硬幣的兩面（第 15 章），又認為「相信未來會更好」的信用，讓資本也加入了這個組合（第 16 章）。
      這個單元要拿證據卡檢查這個說法。其中有兩件事要先提醒：談到大西洋奴隸貿易時，卡片上的每一個數字都是被奪走自由和生命的人，請慢慢讀；談到荷蘭東印度公司的股票和股利時，要記得我們看到的多半是撐下來、被記住的部分（倖存者偏差），事後看起來很清楚的事，當時的人不一定清楚（後見之明）。本單元只是歷史學習，不構成投資建議。
      （提醒：這一課的卡片和題目偏高中程度。國中生可以先讀每張卡的故事和提示問到的那一段，比較題、簡答題挑一兩題做就好。）
  - type: card
    id: event-cook-voyages
    depth: deep
    prompt: 先看這趟航行的兩個任務：公開的是什麼？秘密命令又要庫克做什麼？船上有哪些科學家，大溪地的圖帕伊亞又幫了什麼忙？也讀「史家怎麼吵」：這是科學考察，還是帝國擴張？
  - type: card
    id: event-zheng-he-voyages
    depth: deep
    prompt: 比庫克早三百多年，明朝也派過龐大的船隊出海。注意船隊的規模、目的、是誰派出的，以及後來為什麼停下來；也讀「史家怎麼吵」：這是和平外交，還是武力控制？
  - type: compare
    cards: [event-zheng-he-voyages, event-cook-voyages]
    prompt: 兩支由國家派出的遠洋船隊，相隔三百多年。比一比。
    rows:
      - aspect: 什麼時候、誰派出
        a: 1405–1433 年共七次遠航（第一次出航也有寫 1404 年的），永樂帝派宦官鄭和率領
        b: 1768–1779 年三次航行；英國海軍部選中庫克帶隊，第一次航行由皇家海軍和皇家學會共同贊助
      - aspect: 規模
        a: 首航約 317 艘船、2 萬多人（估計，各說不一）
        b: 第一次航行乘奮進號出發，船上共 94 人
      - aspect: 目的
        a: 帶絲綢、瓷器當禮物，邀請各國派使者來朝貢；永樂帝靠內戰奪位，需要證明自己是正統的天子
        b: 公開目的是觀測金星凌日；秘密命令要他尋找南方大陸、與當地人交好，並替英國宣布占領土地
      - aspect: 有沒有動武
        a: 擒獲麻六甲海峽的海盜陳祖義，在錫蘭和當地國王作戰並把他帶回中國；Wade 稱之為「原始的海上殖民主義」，Tan Ta Sen 用中文史料回應、得出不同結論
        b: 在植物學灣開槍打傷上前阻擋的加迪加爾男子；三次航行中至少 45 名原住民被船員殺死
      - aspect: 後來怎樣
        a: 1433 年後停止遠航，宣德帝禁止建造遠洋船隻；原因有成本太高、北方蒙古壓力增加、永樂帝過世與文官反對等說法
        b: 1770 年宣布澳洲東岸屬於英國；後來的航海者一直沿用他的地圖與做法
    question: 哈拉瑞認為，鄭和不像歐洲航海者那樣試圖征服所到之處，因為中國等社會缺少推動征服與擴張的價值觀和社會結構。這兩張卡支持這個說法嗎？有什麼要補充？
    model_answer: 部分支持，但要補充三件事。支持的地方：鄭和船隊的目的是朝貢外交和宣揚國威，連批評者 Wade 也說它要控制的是港口與航線，而不是占領土地；庫克的秘密命令則明白要他替英國占領土地，天文觀測、採集植物和測繪海岸都放在同一艘船上。要補充的第一件事：鄭和船隊不是只有送禮，碑文自己寫每次率領數萬名官兵，也在錫蘭打過仗，「和平還是武力」本身就有爭議。第二件事：停航的原因除了價值觀，還有成本太高、北方蒙古壓力這些很現實的因素。第三件事：本站專題第 15 章整理的爭議裡，「加州學派」的彭慕蘭認為，到 18 世紀末英格蘭和長江三角洲的發展程度差不多，英國後來能領先，關鍵是附近的煤礦和美洲殖民地提供的土地與原料，而不只是價值觀不同；莫基爾則強調歐洲政治分裂，讓新思想有處可逃；也有學者用新的薪資資料，認為兩地在 1700 年前後就拉開差距。所以比較穩妥的說法是：兩支船隊的目的確實不同，但「為什麼不同、為什麼後來歐洲領先」，價值觀只是其中一種解釋。
    hints:
      - 先看「目的」那一列：哪一支船隊被要求替國家占領土地？
      - 再看「有沒有動武」：鄭和船隊只是送禮嗎？
      - 看「後來怎樣」：明朝停航只有一種原因嗎？除了價值觀，還可能和什麼有關？
  - type: card
    id: event-columbus-aztec
    depth: deep
    prompt: 到美洲。注意哥倫布以為自己到了哪裡；1519 年科爾特斯帶了多少人、和誰結盟；1520 年爆發了什麼疫病。也讀「史家怎麼吵」：到底是誰打敗了阿茲特克？再看「戲劇 vs 史實」：西班牙方面和原住民盟軍各有多少人？
  - type: source
    card: event-columbus-aztec
    idx: 0
    question: 哥倫布在 1492 年 10 月 14 日、登陸兩天後的日誌裡寫道：「只要五十個人，就能把他們全部征服，叫他們做什麼就做什麼。」怎麼讀這句話最穩妥？
    options:
      - 這證明西班牙人後來只靠五十個人就征服了美洲
      - 這證明島上的居民自願替西班牙人工作
      - 這是哥倫布自己的日誌，能看出他一開始就把島上的居民看成可以征服、使喚的人；但這是他當時的想法，不是後來征服的實際經過
      - 這是阿茲特克人留下的紀錄
    answer: 2
    explain: 日誌讓我們看到哥倫布怎麼看待剛遇見的人：他估計的是要多少人才能征服他們。後來他在伊斯帕尼奧拉島強迫泰諾人繳納黃金，1495 年一次擄走 1,500 多人。但「五十個人就夠」只是他的判斷：1519 年科爾特斯帶約 630 人登陸墨西哥，加上後來的援軍，西班牙方面前後約兩三千人，原住民盟軍估計有 8 萬到 20 萬人（這個估計不精確），天花疫情也重創阿茲特克。另外，我們讀到的是 1893 年的英譯再摘譯成中文，細部用字要小心。
    hints:
      - 先看是誰寫的、什麼時候寫的：那時他已經征服了誰嗎？
      - 「他相信要多少人」和「後來實際用了多少人」，是同一件事嗎？
      - 回去看卡片的「戲劇 vs 史實」：西班牙方面和原住民盟軍各有多少人？
    ref: event-columbus-aztec#C2
  - type: decision
    role: 你是 1519 年特拉斯卡拉城邦的領袖
    situation: |
      你的城邦長期和阿茲特克帝國敵對；阿茲特克向周圍的城邦收貢、俘人。這一年，一群從海上來的陌生人在今天韋拉克魯斯附近登陸，大約 630 人，帶著槍、鋼刀和馬匹，首領叫科爾特斯。他們想和你們結盟，一起對付阿茲特克。
      你要怎麼做？先寫下你的想法，再看選項。
    options:
      - label: 和西班牙人結盟，一起對付阿茲特克
        result: 這是特拉斯卡拉實際的選擇。1519 年 9 月雙方結盟，特拉斯卡拉成為出兵最多的原住民城邦；1521 年 5 月到 8 月，西班牙人和原住民盟軍圍城，8 月 13 日特諾奇提特蘭陷落。
      - label: 拒絕結盟，甚至聯合阿茲特克把外來者趕走
        result: 推測：西班牙人少了最大的盟友，可能失去地理知識和大量兵力，征服也許會更難；但 1520 年起天花在當地爆發，疫病會怎麼影響各方，卡片沒有資料可以推算。歷史沒有走這條路，所以後果只能推測。
      - label: 保持中立，先看雙方怎麼打
        result: 推測：特拉斯卡拉也許能暫時避開戰爭的損失，但卡片沒有資料告訴我們，西班牙人或阿茲特克之後會怎麼對待一個中立的城邦。歷史沒有走這條路，所以後果只能推測。
    actual: 特拉斯卡拉和科爾特斯結盟。另一派學者指出，特拉斯卡拉等原住民盟軍估計有 8 萬到 20 萬人，提供了地理知識與戰術。哈拉瑞認為，阿茲特克人對西班牙殖民者在加勒比海犯下的暴行毫不知情；那些和西班牙人合作的原住民以為會得到解放，結果落入更嚴厲的西班牙統治。卡片「從美洲史看」也寫：不少原住民城邦想藉西班牙人擺脫阿茲特克，結果換來更嚴厲的統治。
    ref: event-columbus-aztec#C8
    note: 沒有發生的選項，後果都是推測。這一題也在練習「後見之明」：我們知道後來發生的事，1519 年的人不知道。至於西班牙人是不是靠武器「以少勝多」，Hassig 認為幾百名士兵的武器優勢並非壓倒性，Restall 認為武器只是讓他們撐到援軍來的「生存公式」，傳統說法則強調科爾特斯的勇氣和槍、鋼刀、馬匹；這些看法要並列，不要只取一種。
  - type: card
    id: event-atlantic-slave-trade
    depth: deep
    prompt: 這一步請慢慢讀。注意：被押上船的有多少人、活著抵達的有多少人、多數被送去哪裡、做什麼工作；讀艾奎亞諾的回憶時，記得這些數字背後是一個個被鎖在船艙裡的人。也讀「史家怎麼吵」：奴隸貿易養大了英國工業革命嗎？廢奴是為了道德還是利益？還有「常見誤解」：非洲人只是被動的受害者嗎？
  - type: chain
    prompt: 把大西洋奴隸貿易從興起到被禁止的過程，依先後排成一條鏈（最上面是最早的）。
    items:
      - 1492 年後，歐洲人在美洲建立殖民地，需要大量勞力開礦、種植
      - 加勒比海的原住民在強迫勞動與疫病下迅速減少
      - 1525 年，一艘船從聖多美直接把被擄的非洲人運到伊斯帕尼奧拉島
      - 1526 年，剛果國王阿方索一世寫信給葡萄牙國王，抗議葡萄牙商人非法擄人
      - 18 世紀，葡萄牙、英國、法國的船載走了在非洲被擄者的九成
      - 1807–1808 年，英國和美國先後禁止奴隸貿易
      - 1867 年，已知最後一艘奴隸船抵達古巴
    explain: 這條鏈的前半段，是一門生意怎麼形成的：殖民地需要勞力，原住民在強迫勞動與疫病下大量死亡，殖民者轉向從非洲運人來做工。研究者依船隻紀錄估計，約 1,250 萬名非洲人被押上船，約 1,070 萬人活著抵達美洲，兩數相減，航程中約有 180 萬人死去（維基百科說最多可能約 200 萬人）；在非洲被俘、押往海岸途中死去的人更多（皆為粗估）。被擄的人也不是只能被動受苦：1526 年剛果國王就寫信抗議，被奴役者也多次起義。最後要注意：禁止奴隸貿易不等於廢除奴隸制，英國 1807 年就禁止奴隸貿易，最後一艘奴隸船卻到 1867 年才抵達古巴，巴西的奴隸制更延續到 1888 年。
    hints:
      - 最早的一步，是美洲的殖民地「缺什麼」。
      - 原住民大量減少在先，還是從非洲直接運人在先？
      - 英國禁止奴隸貿易以後，奴隸船就馬上消失了嗎？
    ref: event-atlantic-slave-trade#C2
  - type: card
    id: finance-voc
    depth: deep
    prompt: 回到歐洲，看資本怎麼加入。注意 VOC 怎麼募股、特許狀給了它哪些權力，它在班達群島和臺灣的小琉球做了什麼；也讀「史家怎麼吵」和「事後看很清楚的陷阱」：1602 年買股份的人，知道自己買的是什麼嗎？
  - type: source
    card: finance-voc
    idx: 0
    question: 1602 年 VOC 的特許狀寫著：「十年之後，任何人都可以退出公司，把他的資本帶走。」這句話給「VOC 是現代公司的起點」這個說法什麼提醒？
    options:
      - 這證明 VOC 一開始就設計好「資本永久不退」，是一家完美的現代公司
      - 原始特許狀寫的是十年後可以退出、帶走資本，和後來「資本永久不退、想退出只能把股份賣給別人」的做法不一樣；1602 年的認購者買的，其實是一場以十年為期的冒險
      - 這證明 VOC 十年後就解散了
      - 這證明 VOC 是荷蘭政府的一個部門
    answer: 1
    explain: 特許狀原本寫十年後可以退出、帶走資本，和後來的做法並不一樣。經濟史學者 Gelderblom、de Jong 與 Jonker 認為，VOC 的公司形式不是事先設計好的，而是一路「零碎修補設計缺陷」而來，連董事的有限責任都是後來才慢慢出現的。事後看，VOC 好像註定成功兩百年，這是後見之明。也要小心倖存者偏差：我們記得平均每年約 18% 的股利（這是平均數，各年差很多），比較少記得 1602–1795 年約一百萬人從荷蘭出發、只有約 34 萬人回來，也比較少記得班達群島原本約 1 萬 5 千名居民，估計最後只剩約 1 千人。本單元不構成投資建議。
    hints:
      - 先看「十年之後」：這是永久，還是有期限？
      - 回去看「史家怎麼吵」：學者怎麼形容 VOC 的公司形式是怎麼來的？
      - 再看「事後看很清楚的陷阱」：1602 年的人，知道這家公司會撐到 1799 年嗎？
    ref: finance-voc#F2
  - type: card
    id: event-nuclear-long-peace
    depth: deep
    prompt: 跳到 20 世紀：國家出錢、由軍方主持的科學研究，造出了什麼？注意曼哈頓計畫由誰主持，1945 年 7 月和 8 月發生了什麼，廣島的死者有多少是平民；也讀「史家怎麼吵」：「長和平」是核嚇阻的功勞，還是統計上的幸運？
  - type: today
    card: finance-voc
    question: 有人說：「VOC 就是今天上市公司的祖先，買 VOC 的股票，就像今天買一家大公司的股票。」這個類比哪裡不成立？
    model_answer: 先說不能類比的地方：VOC 有國家給的亞洲貿易獨占權，還能開戰、處決犯人、和外國訂約、鑄造錢幣、建立殖民地；今天的上市公司沒有這些權力，也不能用軍隊壟斷原料。它的獲利有一部分建立在壟斷與暴力上，從班達群島的征服到 1636 年討伐小琉球，這些代價不能當成一般的「商業模式」來比較。當時的股東、董事和監督制度也和今天完全不同，連董事有限責任都是邊做邊修出來的，原始特許狀甚至寫十年後可以帶走資本。可以借來思考的結構是：一家公司向很多陌生人募資，股份可以在市場上轉手，公司本身長期存在、由董事會經營；還有，高股利未必代表本業真的賺錢，VOC 在 1730 年後盈餘下降、股利卻照發。這只是看結構，不是預測；本單元不構成投資建議。

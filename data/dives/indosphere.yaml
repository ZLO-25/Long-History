# 深入專題：印度化的東南亞——占婆、扶南、真臘、吳哥（2026-11-10）
# 怎麼新增一個專題見 docs/dives.md；南進示意圖的畫法見 docs/indosphere-report.md
id: dive-indosphere
title: 占婆與吳哥：拜印度神的東南亞
question: 越南和柬埔寨的古代王國，為什麼拜的是印度的濕婆和毗濕奴、寫的是從印度來的文字？這些王國後來去了哪裡——占婆為什麼從地圖上消失，吳哥又為什麼被放棄？
blurb: 這個專題把「中國之外」的另一條文明線放大來看：印度的宗教和文字坐著商船來到湄公河口與越南中部海岸，長出扶南、占婆、真臘、吳哥這些王國；它們彼此打仗，也和北方學中國的大越打了七百年。看到最後，你會發現今天越南長長的 S 形國土、柬埔寨人對「下高棉」的心結、占族還在越南過的卡特節，都是從這裡來的。
# 約 1 世紀扶南出現；1847 年越南從柬埔寨撤軍，越南與柬埔寨的國土大致定型（之後就是法屬印度支那，見越南史的其他卡片）
range: { start: 1, end: 1847 }
histories: [東南亞史, 柬埔寨史, 占婆史, 越南史, 印度史]

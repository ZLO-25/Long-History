      - { aspect: 誰坐在桌邊, a: 14 個國家的代表，包括歐洲各國、美國和鄂圖曼；沒有任何非洲國家受邀, b: 清朝全權李鴻章、李經方與日本全權伊藤博文、陸奧宗光；臺灣人沒有被問 }
      - { aspect: 談的是什麼, a: 列強之間的規則：剛果盆地貿易與航行自由、禁止奴隸貿易、占領海岸土地要通知並建立統治, b: 條約第二條直接寫明清國把臺灣全島及附屬島嶼、澎湖列島「永遠割與日本」 }
      - { aspect: 當地人怎麼回應, a: 桑吉巴蘇丹要求派代表被拒；之後的邊界與統治，也有非洲統治者參與、反抗與談判, b: 臺灣官民成立臺灣民主國，希望列強出面干涉，但沒有國家承認；日軍從北打到南才接收 }
      - { aspect: 結果, a: 地圖不是一次畫好，邊界花二十多年陸續談定；到 1914 年非洲約 90% 的土地受歐洲控制, b: 臺灣被日本統治 50 年，直到 1945 年 }
    question: 兩場談判都是「當地人沒有被問」。但它們談的東西有什麼不同？為什麼不能說柏林會議就像馬關條約一樣，直接把土地交了出去？
    model_answer: 相似的是：兩件事都是大國在談判桌上談土地的事，當地人沒有被問。不同的是：馬關條約是戰敗的清朝把臺灣、澎湖「永遠割與」戰勝的日本，條文直接把土地交出去；柏林會議是列強彼此訂規則，談的是占領要通知、要建立統治，並沒有把整個非洲劃成各國的地盤，邊界是之後二十多年靠雙邊談判與條約陸續談定。不過兩邊的當地人都不在桌邊，臺灣官民還成立民主國，撐了約五個月。
    points:
      - 相似：都是大國在談判桌上談土地，當地人沒有被問（柏林沒有非洲國家受邀，馬關條約也沒有臺灣人）
      - 不同：馬關條約第二條直接把臺灣、澎湖割給日本；柏林會議談的是列強之間的規則，不是直接劃分地圖
      - 柏林之後，邊界花了二十多年靠雙邊談判與條約陸續談定；臺灣則在 1895 年被日軍從北打到南接收
      - 當地人不是沒有反應：桑吉巴蘇丹要求派代表被拒，臺灣官民成立民主國，撐了約五個月
    hints:
      - 先看「談的是什麼」那一列：一邊是規則，一邊是什麼？
      - 再看「誰坐在桌邊」：兩邊當地人在不在？
      - 最後比「結果」：非洲的邊界是一次畫好的嗎？

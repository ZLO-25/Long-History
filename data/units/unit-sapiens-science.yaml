        q: 哈拉瑞認為，科學和帝國是一枚硬幣的兩面。用庫克航行卡，舉一個支持這個說法的例子，再舉一個要小心的地方。
        model: 支持的例子：這趟航行由皇家海軍和皇家學會合辦，同一艘船既觀測金星凌日、採集植物、測繪海岸，也依秘密命令替英國宣布占領土地；1770 年庫克宣布澳洲東岸屬於英國，當地居民沒有被詢問。要小心的地方：第一，這些新知識不全是歐洲人自己找到的，大溪地的圖帕伊亞就用玻里尼西亞的航海知識，幫忙畫南太平洋的地圖。第二，我們對當地人怎麼看庫克，大多依賴庫克和船員自己寫的日誌，Obeyesekere 和 Sahlins 就在爭論能不能從這些紀錄讀出夏威夷人的想法。第三，一個例子不足以證明所有科學研究都是帝國的工具。

  - 安特衛普是軍事打擊與河口封鎖，人與資金真的搬家；倫敦輸給紐約沒有城市被攻陷
  - 「香檳→…→紐約」只是簡化：熱那亞時期互有重疊、舊中心不會消失、史家對轉捩點有不同看法；回頭看像必然，是後見之明與倖存者偏差
reflect: 這一課看到，金融中心靠的不只是錢，也靠信用和大家對制度的信任；阿姆斯特丹的銀行信用被耗損，就是它走下坡的原因之一。你身邊的人信任你，是因為什麼？有什麼事會讓這份信任慢慢減少？

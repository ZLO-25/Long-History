id: unit-formosa-wanted
title: 大航海時代：為什麼大家都搶著要臺灣？
histories: [臺灣史, 世界通史]
mystery: 四百年前，荷蘭、西班牙、鄭成功接連來到臺灣。臺灣到底有什麼，讓大家都想要？
teaser: 一家荷蘭公司、一座西班牙城堡、一位國姓爺：臺灣第一次被畫進世界地圖。
goals:
  - 能說出 17 世紀臺灣被爭奪的主要原因：位在中國、日本、東南亞貿易路線的交會處
  - 能比較荷蘭與西班牙在臺灣的據點，說出異同
  - 能判讀一段降約或書信，說出是誰寫給誰、想達成什麼
  - 能指出拿「荷蘭東印度公司」比喻今天跨國企業時，哪裡不成立
minutes: 30
steps:
  - type: hook
    text: |
      想像你家巷口剛好是三條公車路線的交會站。開便利商店的、賣早餐的、送快遞的，都搶著要在這個路口租店面。
      17 世紀的臺灣，就像東亞海上的這個路口：北邊是日本，西邊是中國，南邊是菲律賓和東南亞。
      於是一家荷蘭公司、一個西班牙殖民地、一支明朝遺臣的軍隊，先後來到這裡。
  - type: card
    id: event-dutch-formosa
    depth: story
    prompt: 先看荷蘭人為什麼來：注意他們本來想去的地方，其實不是臺灣。
  - type: card
    id: event-spanish-north-taiwan
    depth: story
    prompt: 荷蘭人來了以後，住在馬尼拉的西班牙人為什麼緊張？
  - type: card
    id: social-siraya-deer
    depth: story
    prompt: 外來者忙著做生意，那住在這裡的西拉雅人呢？
  - type: chain
    prompt: 把下列事件依照「因 → 果」排成一條鏈（最上面是最早的原因）。
    items:
      - 荷蘭人被明朝軍隊趕出澎湖
      - 荷蘭東印度公司在大員蓋熱蘭遮城
      - 西班牙人擔心從福建開往馬尼拉的商船被攔截
      - 西班牙人在雞籠（基隆）和淡水築城
      - 荷蘭艦隊北上，趕走西班牙人
    explain: 荷蘭人離開澎湖才轉到大員；荷蘭人在大員落腳，西班牙人才擔心商路被截，於是北上築城；兩個對手在同一座島上，最後由荷蘭人在 1642 年趕走西班牙人。
    hints:
      - 先找出「荷蘭人為什麼會來臺灣」的那一件事。
      - 西班牙人是因為誰來了才緊張？
      - 最後一步是兩個對手之間的戰爭。
    ref: event-spanish-north-taiwan#C1
  - type: compare
    cards: [event-dutch-formosa, event-spanish-north-taiwan]
    prompt: 比一比南北兩個歐洲據點。
    rows:
      - { aspect: 時間, a: 1624–1662 年（約 38 年）, b: 1626–1642 年（約 16 年） }
      - { aspect: 位置, a: 西南部的大員（今臺南安平）, b: 北部的雞籠（今基隆和平島）與淡水 }
      - { aspect: 主要目的, a: 公司做生意：生絲、鹿皮、蔗糖，招漢人來開墾, b: 保護馬尼拉的對華商路，並作為前往日本、中國傳教的據點 }
      - { aspect: 怎麼結束, a: 1662 年被鄭成功圍城九個月後投降, b: 1642 年被荷蘭艦隊攻下 }
    question: 為什麼荷蘭人待得比西班牙人久？請至少說出一個原因。
    model_answer: 荷蘭人在臺灣有賺錢的生意（鹿皮、蔗糖、轉口貿易），還招募大批漢人移民來開墾，據點越經營越大；西班牙人的北臺灣據點主要是為了保護商路和傳教，戰略價值下降後，馬尼拉不願再投入兵力，最後被荷蘭人攻下。
    hints:
      - 看「主要目的」那一列：哪一邊有穩定的收入？
      - 西班牙卡片的「史家怎麼吵」提到馬尼拉後來的態度。
      - 想想看：一個據點如果一直花錢卻不賺錢，母國會怎麼做？
  - type: source
    card: event-spanish-north-taiwan
    idx: 0
    question: 西班牙長官寫這封回信，最主要想表達什麼？
    options:
      - 他願意把城堡交給荷蘭人，只要求保住性命
      - 他拒絕荷蘭人的勸降要求
      - 他請求馬尼拉立刻派兵支援
      - 他在和荷蘭人談貿易條件
    answer: 1
    explain: 「I cannot and will not surrender」就是「我不能、也不會投降交城」。這是回覆荷蘭人勸降信的拒絕。但讀史料也要知道後續：隔年荷蘭艦隊北上，西班牙守軍打了大約一週就投降了，嘴上的強硬和實際的兵力是兩回事。
    hints:
      - 抓關鍵動詞：surrender 是什麼意思？
      - 句子前面有 cannot 和 will not，是肯定還是否定？
      - 這是誰寫給誰的？荷蘭人先寫信要求了什麼？
    ref: event-spanish-north-taiwan#story
  - type: card
    id: event-koxinga-taiwan
    depth: understand
    prompt: 第三個來的人不是歐洲人。讀「背景」時注意：鄭成功為什麼在 1661 年決定渡海？
  - type: decision
    role: 你是 1661 年初的鄭成功
    situation: |
      兩年前你率軍北攻南京失敗。清朝封鎖沿海，想切斷你在廈門、金門的補給和貿易。
      你手下有好幾萬軍隊要吃飯。海峽對岸，荷蘭東印度公司占著大員，那裡有平原、有漢人農民、有糖和鹿皮的生意。你要怎麼做？
    options:
      - { label: 渡海攻打荷蘭人，把臺灣當新根據地, result: 這是鄭成功當年的選擇。1661 年 4 月他率約 25,000 人登陸、包圍熱蘭遮城，九個月後荷蘭人在 1662 年 2 月投降離開。但鄭成功同年 6 月就病逝了。 }
      - { label: 留在廈門、金門，繼續沿海抗清, result: 推測：遷界令會讓補給和貿易越來越困難，軍隊可能難以維持。歷史沒有走這條路，所以後果只能推測。 }
    actual: 鄭成功選擇攻臺，建立了臺灣第一個以臺灣為中心的漢人政權；他死後由兒子鄭經接手，靠屯田和海上貿易又撐了二十多年，直到 1683 年才由年僅 13 歲的鄭克塽向清朝投降。
    ref: event-koxinga-taiwan#C1
    note: 「沒有發生的選項」的後果都是推測，標示清楚。
  - type: today
    card: event-dutch-formosa
    question: 有人說「荷蘭東印度公司就像今天到臺灣投資的跨國企業」。這個比喻哪裡不成立？
    model_answer: 當年的荷蘭東印度公司可以養軍隊、對原住民宣戰、向漢人收人頭稅，等於同時是公司又是政府；今天的跨國企業沒有軍隊，也不能對人民課稅，要遵守當地法律。另外，當時的原住民和漢人移民沒有今天的公民權和國際法保障。所以這個比喻只能幫我們想「公司追求利潤」這一點，不能拿來比較權力。
  - type: check
    items:
      - kind: choice
        q: 17 世紀荷蘭人、西班牙人都想在臺灣設據點，最主要的原因是什麼？
        options: [臺灣有很多金礦, 臺灣位在中國、日本、東南亞的貿易路線上, 臺灣是當時人口最多的島, 明朝邀請他們來臺灣]
        answer: 1
        explain: 荷蘭人要把中國生絲轉賣到日本，西班牙人要保護福建到馬尼拉的商路，臺灣剛好位在這些航線的交會處。
        hints: [回想 hook 裡「巷口三條公車路線」的比喻。, 兩張卡片都提到了哪些地方之間的貿易？]
        ref: event-dutch-formosa#C1
      - kind: order
        q: 依時間先後排列：
        items: [荷蘭人在大員落腳, 西班牙人在雞籠築城, 荷蘭人趕走北部的西班牙人, 鄭成功攻下熱蘭遮城, 清朝取得臺灣]
        explain: 1624 大員 → 1626 雞籠 → 1642 荷蘭攻下北部 → 1662 鄭成功逼荷蘭投降 → 1683 清朝取得臺灣。
        hints: [西班牙人是在荷蘭人之後兩年來的。, 明鄭撐了二十多年才投降。]
        ref: event-koxinga-taiwan#C2
      - kind: short
        q: 用一兩句話說明：荷蘭人自己人手不夠，他們用什麼方法讓臺灣西南部的田地被開墾起來？
        model: 他們從福建招募漢人移民，提供免費船運、工具、耕牛和種子，再向移民收人頭稅和農產稅。歐陽泰把這種荷蘭人和漢人合作的方式稱為「共構殖民」。
        explain: 這也是臺灣漢人移民社會開始成形的關鍵。
        hints: [回去看荷蘭卡的「制度或機制變化」。, 誰從對岸被找來種田？]
        ref: event-dutch-formosa#C4
  - type: recap
    model_answer: 因為臺灣剛好位在中國、日本、東南亞之間的海上貿易路線交會處。荷蘭人想用它轉賣中國生絲到日本、出口鹿皮和蔗糖；西班牙人想保護馬尼拉的商路；鄭成功則在大陸沿海打不下去，需要一個能養活軍隊的新根據地。但別忘了：在這些外來者搶奪臺灣的同時，原本住在這裡的西拉雅等原住民，生活也被徹底改變了。

id: unit-taiwan-prehistory
title: 沒有文字的臺灣史：我們怎麼知道幾千年前的事？
histories: [臺灣史, 世界通史]
mystery: 臺灣的史前時代沒有任何人留下文字。我們怎麼知道幾千年前這裡住過什麼人？而且為什麼同一件事，各種說法給的年代常常不一樣？
teaser: 一把碳十四的尺、一塊石板棺、一棵語言樹，加上各族自己講的起源故事：沒有文字的年代，是怎麼被一點一點拼起來的？
goals:
  - 能說出遺物與遺址、碳十四定年、語言比較、遺傳和口傳，各自能說明什麼、不能說明什麼
  - 能依先後說出臺灣史前的主要文化（長濱、大坌坑、圓山、卑南、十三行），並說明考古的「文化」是學者的分類，不等於族群
  - 能舉例說明：同一件事的年代說法不一樣，可能是測的對象、說的事情或使用的方法不同
  - 能判讀一段研究者的定年原句與一段原民會記載的起源傳說，說出它是什麼性質的資料
  - 能指出「只靠一種證據就能知道人群從哪裡來」這類想法哪裡不成立
minutes: 35
level: 皆可
curriculum: ["歷 Ba-IV-1", "歷 Ba-IV-2", "歷 Ba-V-1"]
steps:
  - type: hook
    text: |
      想像你走進一間很久沒人住的老房子，沒有日記、沒有照片，只剩下碗盤、一堆垃圾和牆上的刮痕。你要怎麼猜出誰住過、住了多久？
      臺灣的史前時代就是這樣。1624 年荷蘭人來到臺灣之前，這裡已經有人生活了很久很久，但他們沒有留下文字。
      這一課的重點不是背文化的名字，而是學會看「證據」：遺物、定年、語言、遺傳、各族自己的口傳，每一種都只能回答一部分的問題。
    guess:
      q: 臺灣的史前時代沒有文字。你猜，學者怎麼估計一處遺址有多老？（沒有對錯，先憑直覺選。）
      options:
        - 看遺物上有沒有刻著年份
        - 量遺物裡碳十四剩多少，推算出「距今多少年，加減多少誤差」
        - 拿荷蘭人留下的紀錄，往回倒推幾千年
        - 全靠學者憑經驗，用眼睛看石器的樣子猜
      reveal: 常用的方法是碳十四定年：生物死後不再吸收碳十四，體內的碳十四會以固定速率減少，量出剩下多少，就能估計它死了多久。結果通常寫成「距今多少年±誤差」，所以年代是估計，不是精準的某一年。
  - type: card
    id: event-taiwan-prehistory
    depth: deep
    prompt: 先看考古學者排出的順序，再看「沒有文字，我們怎麼知道？」。注意碳十四是怎麼估年代的，以及為什麼一組數字要看「測的是哪一層」；也讀「史家怎麼吵」，看同一件事有哪些年代說法被並列。
    focus: [C2, C4, debate]
    quick:
      - q: 碳十四定年的原理是什麼？結果為什麼要寫成「±40」這樣的誤差？
        a: 生物活著時會吸收碳十四，死後不再吸收，體內的碳十四以固定速率衰變，量出剩下多少，就能估計它死了多久。「±40」是測量誤差，所以結果是估計，不是精準的某一年。
      - q: 卑南遺址某處測得 8 個碳十四數據（2310±40 到 1980±40 B.P.）。為什麼這組數字不能直接當成卑南文化的年代？
        a: 因為作者寫，這個地點屬於三和文化層（比卑南文化晚的鐵器時代文化）分布的範圍，所以這組數字不是卑南文化的年代。年代數字要看「測的是哪一層」。
  - type: source
    card: event-taiwan-prehistory
    idx: 0
    question: 研究者李坤修寫：「卑南文化大約3,500年前至3,000年前之間出現在卑南遺址，並延續到距今2300年前後……」這段話的年代是怎麼來的？
    options:
      - 這是卑南人當時留下的紀錄，所以年代一定準確
      - 這是現代考古研究者根據發掘與定年寫下的判斷，所以年代是估計
      - 這是碳十四測出來的一個精確數字，所以完全沒有任何誤差
      - 這是 1945 年首次發掘時就確定的年代，一百年來從來沒有人修改過
    answer: 1
    explain: 這段話是史前館研究人員李坤修在 2017 年的電子報文章裡寫的，是現代研究者根據發掘與定年做的判斷。你看用字：「大約」「之間」「前後」，都在提醒這是估計。卑南文化沒有留下文字，所以這不是「當時的史料」，而是研究者替我們讀遺物之後的結論。
    hints:
      - 先看這段話是誰寫的、什麼時候寫的。卑南文化的人有文字嗎？
      - 注意句子裡的「大約」「之間」「前後」，這些字在告訴你什麼？
      - 卡片還說，史前館的另一篇說法是卑南文化極盛在 3,500 到 2,000 年前，和這句的下限不完全一樣。
    ref: event-taiwan-prehistory#C2
    why_wrong:
      - 卑南文化沒有留下文字，這是現代研究者寫的判斷，不是卑南人當時的紀錄
      - null
      - 句子用的是「大約」「前後」，是估計；碳十四數據本身也要寫誤差（例如 ±40）
      - 卡片只說 1945 年是首次發掘；而且史前館另一篇寫極盛年代到約 2,000 年前，下限和這句不完全一樣，可見說法並非固定不變
    critique:
      question: 這段話出自史前館研究人員之手，登在電子報上。關於這段話，下面哪一個判斷最穩妥？
      options:
        - 它能證明卑南文化的人當時講的是哪一種語言，屬於哪一個語系
        - 它能證明所有學者對卑南文化的年代說法都完全一致，不再有爭議
        - 它能證明卑南人自己就把這段時間和這群人稱為「卑南文化」
        - 它能說明研究者怎麼判斷年代，但數字可能被新測定修改
      answer: 3
      explain: 這是現代研究者根據發掘與定年寫下的判斷，能告訴我們目前學者怎麼估計卑南文化的年代。但考古的年代是估計，新的測定可能改變數字；「文化」也是學者替遺址取的分類名，不是當時人的自稱，更不能直接告訴我們他們說什麼話。
      why_wrong:
        - 石器、陶器和石板棺不會說話，不能證明他們講哪一種語言
        - 卡片寫，史前館另一篇說卑南文化極盛在 3,500 到 2,000 年前，下限和這句的約 2,300 年前不完全一樣
        - 考古的「文化」是學者把相似的遺址歸成一類、通常用最早研究的遺址命名，不是當時人的自稱
        - null
  - type: card
    id: event-austronesian-taiwan
    depth: deep
    prompt: 接著看一個更大的問題：臺灣原住民族說的語言屬於南島語系，這和臺灣的史前有什麼關係？注意「出臺灣」是學者重建的故事；讀表格時，四種證據各能說什麼、不能說什麼。
    focus: [C2, C4]
    quick:
      - q: 語言證據為什麼讓一些學者認為南島語的故鄉在臺灣？這個證據有什麼限制？
        a: 語言學者 Blust 指出，臺灣的南島語彼此關係很遠，最早的幾個分支都在臺灣，暗示南島語在臺灣待得最久。限制是：說同一個語系不等於一定有共同祖先，有些學者因此不贊成把「南島」直接拿來指人群。
      - q: 2014 年 Lipson 等人的遺傳研究發現了什麼？為什麼這不等於「所有祖先都來自臺灣」？
        a: 他們發現所有取樣的南島語人群，都帶有和臺灣原住民族較相近的祖先成分。但同時還有來自和南亞語系人群相近的來源，所以歷史不是單向的。
  - type: source
    card: event-austronesian-taiwan
    idx: 0
    question: 原住民族委員會記載：「泰雅族人起源傳說是在遠古時代，由大石頭分裂爆開後走出男、女性的祖先，之後遷徙到各地建立部落。」這是什麼性質的資料？
    options:
      - 泰雅族口傳的起源傳說，由原民會記載
      - 考古學者根據遺址出土的遺物，用碳十四定出來的一個年代結果
      - 語言學者比較了許多種語言的詞彙，再推算出來的一棵語言樹
      - 早期學者蒐集後，已被考古研究證明是錯誤的起源說法
    answer: 0
    explain: 這是官方機構記載的口傳內容，是泰雅族代代傳下來、說明他們怎麼理解自己從哪裡來的故事。它不是考古定年，也不是語言樹；更不能說成「被證明是錯的」，因為傳說和考古是不同性質的知識，傳說不是為了回答考古問題才存在的。
    hints:
      - 先看這段文字在講什麼：是年代數字，還是一個關於祖先的故事？
      - 「原民會記載」是什麼意思？是泰雅族當時寫下來的，還是後來的機構記載口傳內容？
      - 卡片說，起源傳說是各族對自己來歷的理解，不是用來「證明」或「推翻」考古的。
    ref: event-austronesian-taiwan#C3
    why_wrong:
      - null
      - 這段文字沒有任何年代數字，也不是考古測定；碳十四定年要測的是遺址出土的遺物
      - 這段文字是一個祖先故事，不是詞彙比較；語言樹是 Gray 等人另外用約 400 種語言推算的
      - 卡片說起源傳說是各族的認同與知識，不是「錯誤的歷史」，也不是為了回答考古問題而存在
    critique:
      question: 這段話是原民會記載的泰雅族口傳起源傳說。關於它能證明什麼、不能證明什麼，下面哪一個說法最恰當？
      options:
        - 它能證明泰雅族的祖先真的從石頭裡出現，所以考古學者應該修改年代
        - 它能證明臺灣各原住民族的起源傳說其實都是同一個故事，只是講法不同
        - 它能說明泰雅族怎麼看自己的來歷，但沒有年份，不能用來證明或推翻考古
        - 因為它沒有年份、不能對照考古，所以這段傳說沒有價值，研究時可以不理它
      answer: 2
      explain: 起源傳說說明的是一個群體怎麼理解自己的來歷，是認同與知識。它通常沒有年份，也不是遷徙路線的記錄，所以不能拿來「證明」或「推翻」考古年代；反過來，考古也不能把它當成「錯誤的歷史」。連泰雅族自己都有兩種起源地的說法，阿美族、排灣族的傳說又不一樣。
      why_wrong:
        - 傳說是族群的認同與知識，不是用來修改考古年代的證據，也不是拿來「證明」考古
        - 卡片寫泰雅族有兩種起源地說法，阿美族說祖先由神降生或由石頭誕生，排灣族說古陶壺是祖先誕生的來源，版本並不一致
        - null
        - 卡片說口傳說明一個群體怎麼理解自己的來歷，是各族的認同與知識，不是沒有價值，也不能硬塞進年表
  - type: card
    id: social-siraya-deer
    depth: deep
    prompt: 前面的證據都來自沒有文字的年代。那麼，只要有了文字，事情是不是就清楚了？讀「他們留下的證據」，注意文字是誰寫的；也讀「史家怎麼吵」的第一段。
    focus: [E5, debate]
    quick:
      - q: 「新港文書」是什麼？現在的研究者能讀懂多少？
        a: 新港文書是 17 到 18 世紀用羅馬字書寫的文件，有些是西拉雅語與漢文對照；2006 年中研院研究人員宣布已能解讀其中多達八成。
      - q: 有了文字之後，為什麼我們對西拉雅人的了解還是有限制？
        a: 因為西拉雅人自己留下的文字很少，大部分描述出自荷蘭傳教士與東印度公司之手，寫的人帶著傳教與統治的眼光，所以有些記載需要小心解讀。
  - type: chain
    prompt: 把下列事情依「因 → 果」排成一條鏈（最上面是最早的）。排的時候想一想：哪些是前一件促成後一件，哪些只是接著發生？
    items:
      - 長濱文化的人在舊石器時代就生活在臺灣，打製石器、狩獵採集
      - 稻與小米農業在大陸發展起來，大坌坑文化的人把這套生活帶到臺灣沿海
      - 多數學者認為大坌坑文化的人講早期南島語，這是「出臺灣」說的起點
      - 說南島語的一批人移到呂宋與菲律賓，南島語分成臺灣與臺灣以外的兩大支
      - 南島語系的語言後來分布到東南亞島嶼、太平洋島嶼與馬達加斯加
    explain: 舊石器時代的人最早；大陸先有稻與小米農業，大坌坑文化的人才能把它帶到臺灣沿海；多數學者視這群人為早期南島語使用者，「出臺灣」說才從這裡接續；說南島語的一批人移到呂宋，語言才分成兩大支；最後語言分布到更遠的島嶼。注意：這是學者重建的故事，各步年代都是估計，也有學者主張起點不只臺灣。
    hints:
      - 先找最早、而且不需要其他事件就能成立的那一項。
      - 大坌坑文化的人種稻與小米，這套農業是先在哪裡發展起來的？
      - 語言分成兩大支，是發生在「移到呂宋」之前還是之後？
    ref: event-austronesian-taiwan#C2
    followup:
      question: 這條鏈大致依先後排列。下面哪一組，卡片沒有寫前者是後者的原因或背景，只是時間上一先一後？
      options:
        - 一批人從臺灣移到呂宋與菲律賓 → 南島語後來分布到更遠的島嶼
        - 長濱文化的人 → 大坌坑文化
        - 大陸的農業發展 → 大坌坑文化帶來稻與小米
        - 大坌坑文化的人 → 「出臺灣」說討論的起點
      answer: 1
      explain: 卡片沒有寫長濱文化的人變成了大坌坑文化的人，也沒有寫前者促成後者；卡片寫的是大坌坑文化帶著繩紋陶、稻與小米「突然出現」在海岸，所以依卡片，這兩項只能算一先一後（卡片沒寫，不等於已經證明兩者毫無關係）。其他三組，卡片都寫了關聯：東亞的農業先在大陸發展，是大坌坑文化的背景；多數學者視大坌坑文化的人為早期南島語使用者，是「出臺灣」討論的起點（有爭議）；「出臺灣」說主張說南島語的人從臺灣出發，先到呂宋與菲律賓，再往外擴散。這些都是學者重建的故事。
      why_wrong:
        - 卡片寫「出臺灣」說的主張是：說南島語的人從臺灣出發，先到呂宋與菲律賓，再往外擴散；前一步是後一步的起點
        - null
        - 卡片把東亞的稻與小米農業列為大坌坑文化的背景：農業先在大陸發展，才傳到臺灣
        - 卡片寫，多數學者視大坌坑文化的人為早期南島語使用者，這是「出臺灣」討論的起點（但有爭議）
  - type: compare
    cards: [event-taiwan-prehistory, event-austronesian-taiwan]
    prompt: 兩張卡都在「沒有文字的年代」裡找答案，但用的證據和問的問題不同。比一比，特別注意：年代各說並列時，是為什麼不一樣？

# 平埔族群：多數沒有中央政府的原住民族身分；語言多已不再日常使用，但有人在復振
plains:
  - { zh: 巴宰, en: Pazeh, glotto: kulo1237 }
  - { zh: 巴布薩, en: Babuza, glotto: babu1240 }
  - { zh: 凱達格蘭, en: Ketangalan, glotto: keta1243 }
  - { zh: 巴賽, en: Basay, glotto: basa1287 }
plains_note: 平埔族群（如西拉雅、巴宰、凱達格蘭）曾分布在西部平原與北部，清代以後逐漸和漢人通婚、改說閩南語或客語。2025 年 10 月立法院通過《平埔原住民族群身分法》，2026 年 7 月 30 日行政院認定西拉雅族為第 17 個原住民族，是第一個依這部法認定的平埔族群（以上資料截至 2026-07-31 的新聞）。
plains_src: [s7, s8]

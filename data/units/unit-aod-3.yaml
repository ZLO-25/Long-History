id: unit-aod-3
title: 哥倫布、天花與番薯：美洲被捲進來之後
histories: [世界通史, 美洲史, 歐洲史, 中國史, 臺灣史]
mystery: 1492 年哥倫布往西航行，以為自己到了亞洲，其實到了美洲。為什麼只帶幾百人的西班牙人，能在 1519 到 1533 年的十幾年間，先後打垮阿茲特克和印加兩個大帝國？同一場「交換」，為什麼一面是餐桌上的番薯，另一面是美洲原住民人口大崩潰？
teaser: 一本哥倫布的航海日誌，一場讓原住民人口大減的疫病，一個為原住民說話卻也提過非洲奴隸的人，和一塊今天臺灣人愛吃的烤番薯。
goals:
  - 能說出科爾特斯攻下阿茲特克，不只靠幾百人：還有原住民盟軍與天花
  - 能判讀哥倫布的日誌，說出它能證明什麼、不能證明什麼
  - 能比較哥倫布與拉斯卡薩斯對原住民的作法與後世評價
  - 能說出哥倫布大交換的兩面：餐桌上的新作物，和美洲原住民人口的大崩潰
minutes: 30
level: 皆可
curriculum: ["歷 Ob-IV-1", "歷 Ob-IV-3", "歷 Mb-V-1", "歷 Mb-V-2"]
companion: unit-aod-2
steps:
  - type: hook
    text: |
      1519 年，一個叫科爾特斯的西班牙人，帶著約 630 人登陸墨西哥。兩年後，統治墨西哥中部的阿茲特克帝國，首都陷落了。
      可是不到三十年前（1492 年），哥倫布才剛往西航行，以為自己到了亞洲的「印度」。他到的其實是美洲。
      這個單元要看：美洲是怎麼被捲進世界的？得到好處的人是誰，付出代價的人又是誰？
    guess:
      q: 科爾特斯只有約 630 人，卻在 1521 年讓阿茲特克的首都陷落。你猜最主要的原因是什麼？
      options:
        - 阿茲特克人以為西班牙人是神，所以不敢抵抗
        - 西班牙國王從歐洲派來好幾萬名士兵，人數其實不少
        - 有很多痛恨阿茲特克的原住民當盟友，加上天花爆發
        - 阿茲特克人沒有任何武器，也從來沒有打過仗，一碰就垮
      reveal: 卡片說，科爾特斯聯合痛恨阿茲特克的特拉斯卡拉人，原住民盟軍估計有好幾萬；1520 年天花又爆發。「阿茲特克人以為西班牙人是神」這個流行說法，有學者質疑；西班牙方面前後也只有約兩三千人。
  - type: card
    id: event-columbus-aztec
    depth: understand
    prompt: 西班牙往西航行。注意哥倫布以為自己到了哪裡，也看科爾特斯不是只靠幾百人，以及原住民人口為什麼崩潰。
    focus: [C4, C5]
    quick:
      - q: 科爾特斯只有約 630 人，為什麼能攻下阿茲特克？
        a: 不只靠幾百人：他聯合痛恨阿茲特克的特拉斯卡拉人，盟軍人數可能有好幾萬；1520 年又爆發天花，1521 年首都特諾奇提特蘭陷落。
      - q: 委託監護制是什麼？
        a: 西班牙國王把一批原住民「託付」給殖民者，原住民要納貢、做工，名義上換取保護與傳教，實際上常等同農奴與奴隸制。
  - type: source
    card: event-columbus-aztec
    idx: 0
    question: 哥倫布在第一次航行日誌裡寫：「只要五十個人，就能把他們全部征服，叫他們做什麼就做什麼。」這句話最能支持哪個說法？
    options:
      - 泰諾人自己同意接受西班牙人的統治和管理
      - 哥倫布知道自己到了一塊沒有人住的新大陸
      - 哥倫布把當地人看成可以支配的人
      - 這句話證明後來原住民的死亡人數有多少
    answer: 2
    why_wrong:
      - 這是哥倫布自己的想法，不是泰諾人說的；哥倫布人物卡寫，泰諾人當時的書面紀錄沒有查到。
      - 卡片說，哥倫布以為自己到了亞洲的「印度」；美洲也不是無人的新大陸，那裡早就住著人。
      - null
      - 這句話寫在 1492 年 10 月，是登陸第三天的想法，沒有講到後來死了多少人。
    explain: 這是哥倫布 1492 年 10 月 14 日在日誌裡寫的話，他看到當地人，想的是只要五十個人就能征服他們、叫他們做事。所以它能看出哥倫布一開始怎麼看原住民；但它是哥倫布一個人的說法，不能代表泰諾人怎麼想，也沒有說後來死了多少人。
    hints:
      - 先看這句話是誰寫的、寫在哪一天。
      - 「叫他們做什麼就做什麼」，是站在誰的位置說的？
    ref: event-columbus-aztec#story
    critique:
      question: 這本日誌是哥倫布自己寫的。把它當作史料，下面哪個說法最合理？
      options:
        - 能證明泰諾人願意被西班牙人統治，因為日誌裡就是這樣寫
        - 能看出哥倫布當時怎麼看原住民；不能代表泰諾人自己的想法
        - 能證明當時所有的西班牙人，想法都和哥倫布完全一樣
        - 能證明西班牙人到美洲只是為了傳教，沒有別的目的
      answer: 1
      explain: 日誌是哥倫布的一面之詞，能看出他怎麼打量眼前的人。但哥倫布人物卡說，泰諾人當時的書面紀錄沒有查到；我們讀到的多半是西班牙人寫的，所以不能用它代表泰諾人的想法，也不能代表所有西班牙人。
      why_wrong:
        - 「叫他們做什麼就做什麼」是哥倫布自己的想法，不是泰諾人的意願。
        - null
        - 一份日誌只是一個人的記錄，卡片沒有說所有西班牙人都這樣想；後來還有人批評殖民暴行，例如拉斯卡薩斯。
        - 卡片沒有寫這份日誌證明西班牙人只為傳教；日誌裡寫的是征服與讓當地人做事。
  - type: card
    id: person-las-casas
    depth: understand
    prompt: 同樣是西班牙人，拉斯卡薩斯一開始也擁有原住民勞力。注意他在 1514 年做了什麼決定。
    focus: []
    quick:
      - q: 拉斯卡薩斯一開始是什麼身分？
        a: 他 1502 年到伊斯帕尼奧拉島，分得土地與原住民勞力，也參加對原住民的軍事行動。
      - q: 1514 年之後他做了什麼？
        a: 他放棄自己的奴隸與委託監護地，勸別的殖民者也這樣做；後來把所見寫成《西印度毀滅述略》，報告與書促成 1542 年的《新法》。
  - type: decision
    role: 你是 1514 年的拉斯卡薩斯，一位擁有土地和原住民勞力的殖民者
    situation: |
      你住在伊斯帕尼奧拉島，分得了土地與原住民勞力，也曾參加對原住民的軍事行動。
      這一年你準備五旬節的講道，讀了聖經，開始覺得：西班牙人在新世界的作為不合法。
      先別急著看選項：如果是你，你會怎麼做？
    options:
      - label: 繼續經營土地與原住民勞力，什麼都不改變
        result: 推測：卡片沒有記載他若繼續下去會怎樣；這是拉斯卡薩斯沒有走的路，所以後果只能推測。
      - label: 放棄自己的奴隸與委託監護地，並勸別的殖民者也這樣做
        result: 這就是歷史上的做法。他放棄奴隸與委託監護地，開始勸別人也放棄；卡片說，這個決定讓他和一般殖民者的利益衝突，後來他的報告與書促成 1542 年的《新法》。
      - label: 只把自己的土地還給原住民，不去勸別人
        result: 推測：卡片沒有記載他考慮過這個辦法；這是本單元為了讓你比較而設計的，後果只能推測。
    actual: 他 1514 年放棄奴隸與委託監護地，並勸別人也放棄。後來他成為道明會士，寫下《西印度毀滅述略》；1542 年《新法》想逐步廢除委託監護制（持有人死後歸還王室）、禁止奴役原住民，但在殖民地引起騷動，他也受到生命威脅。他不是一路都站在原住民那一邊：1516 年他曾建議引進非洲奴隸來減輕原住民的苦難，後來寫自己「很快就後悔了」。
    ref: person-las-casas#P3
    note: 第一與第三個選項是本單元為了讓你比較而設計的，卡片沒有記載。還要注意：他的人口數字被現代史家認為誇大，書也被敵對國家拿去宣傳（黑色傳說），不能把他看成沒有爭議的英雄。
  - type: compare
    cards: [person-columbus, person-las-casas]
    prompt: 同一場「新世界」的故事，兩個人的做法與後世評價很不一樣。把它們並排看。
    rows:
      - aspect: 他怎麼看原住民
        a: 日記寫島民「應該會是好僕人」，也寫「只要五十個人，就能把他們全部征服」
        b: 《述略》把西班牙人比喻成闖進溫馴羊群的狼、老虎與獅子
      - aspect: 他做了什麼
        a: 1495 年圍捕約 1,500 名阿拉瓦克人，約 500 人被送往西班牙為奴；也在伊斯帕尼奧拉島實施委託監護制
        b: 1514 年放棄奴隸與委託監護地並勸別人，後來的報告與書促成 1542 年《新法》
      - aspect: 留下的缺口
        a: 泰諾人自己的書面紀錄卡片沒有查到，我們讀到的多半是西班牙人寫的
        b: 1516 年建議引進非洲奴隸，後來後悔；他寫的人口數字被認為誇大
      - aspect: 後世怎麼評價
        a: 美國有哥倫布日，也有地方改成原住民日，例如柏克萊市 1992 年起
        b: 敵對國家拿他的書攻擊西班牙（黑色傳說），西班牙民族主義史家則反駁（白色傳說）
    question: 哥倫布與拉斯卡薩斯，一個先講「征服」、一個講「不義」。為什麼後世對兩人的評價都很有爭議？請至少說出兩點。
    model_answer: 兩人的評價都有爭議，是因為兩個人都不是單純的英雄或壞人，而且留下的紀錄多半來自歐洲人的手。哥倫布一邊被當成發現者，一邊因圍捕、奴役原住民而被批評，所以有人慶祝哥倫布日，也有地方改成原住民日。拉斯卡薩斯為原住民說話，卻也在 1516 年建議引進非洲奴隸，後來後悔；他的數字被認為誇大，書又被敵對國家拿去宣傳。泰諾人自己的書面紀錄卡片沒有查到，所以我們很難聽到被影響的人自己怎麼說。
    hints:
      - 先看「做了什麼」那一列：兩個人各自對原住民做了什麼？
      - 再看「留下的缺口」那一列：誰的聲音比較少被留下來？
    points:
      - 哥倫布圍捕、奴役原住民，今天有人慶祝、有人改成原住民日
      - 拉斯卡薩斯為原住民說話，但曾建議引進非洲奴隸，後來後悔
      - 兩人留下的紀錄多是歐洲人寫的，原住民自己的聲音很少
  - type: card
    id: event-columbian-exchange
    depth: understand
    prompt: 這張卡先讓你看「交換」的清單：哪些東西往哪個方向走？再想：這場交換公平嗎？
    focus: [C5, C10, misc]
    quick:
      - q: 哪些作物從美洲傳到舊世界？哪些從舊世界傳到美洲？
        a: 玉米、馬鈴薯、番薯、辣椒、可可、菸草傳到舊世界；小麥、甘蔗、馬、牛、豬傳到美洲。
      - q: 為什麼說這場「交換」不是公平的雙向交易？
        a: 疾病主要是舊世界傳給美洲，天花等病讓美洲原住民人口大量死亡；英文維基估計 100 到 150 年間，80% 到 95% 的原住民死亡。
  - type: transfer
    card: event-columbian-exchange
    case: |
      在臺灣，番薯是很有代表性的食物，細長的外形常被拿來比喻臺灣島。《臺北時報》專題報導寫，西班牙人在 16 世紀末把番薯帶到菲律賓，番薯「大概是」隨著從福建來的許多移民傳到臺灣。但番薯在臺灣也長期被視為窮人的食物，「從沒完全擺脫貧窮與饑荒的聯想」。英文維基則寫，番薯約 1594 年因福建一次嚴重的作物歉收，從呂宋傳到福建，巡撫金學曾鼓勵種植。
    question: 這一課看到，哥倫布大交換有「餐桌的革命」和「人口的災難」兩面。請用這個想法看今天的番薯：你吃到一塊烤番薯時，這個故事至少有哪兩面？還有哪些地方，不能只講番薯的好處？
    hint: 先想番薯在福建和臺灣的角色（救荒、窮人食物、認同象徵）；再想同一場交換對美洲原住民、被奴役的非洲人做了什麼。
    points:
      - 好的一面：番薯耐貧瘠，福建歉收時被當成救荒作物；它也成為臺灣的象徵之一
      - 另一面：番薯在臺灣長期被視為窮人食物，沒完全擺脫貧窮與饑荒的聯想
      - 同一場交換也帶來災難：疾病與強迫勞動讓美洲原住民人口大減，甘蔗等作物需要大量勞力，被奴役的非洲人被運到美洲
      - 不能把番薯講成「一個人偷渡就改變全中國」：它能推廣，是因為有糧荒、官員支持，傳入的細節又只見於較晚的記載
    model_answer: 一面是餐桌的好處：番薯耐貧瘠，福建歉收時被當成救荒作物，後來成為臺灣最有代表性的食物之一，細長的外形還被拿來比喻臺灣島。另一面是，番薯在臺灣長期被視為窮人的食物，沒完全擺脫貧窮與饑荒的聯想。再往後退一步：它是因為哥倫布大交換才跨過大洋的，而同一場交換讓疾病主要從舊世界傳到美洲，美洲原住民人口大量死亡；甘蔗這類作物需要大量勞力，也有被奴役的非洲人被運到美洲。另外也要小心簡化：番薯不是一個人偷渡就改變全中國，它能推廣，是因為有糧荒與官員支持，傳入的細節又只見於較晚的記載。
    ref: event-columbian-exchange#C5
  - type: check
    items:
      - kind: choice
        q: 關於科爾特斯攻下阿茲特克，下面哪個說法最符合卡片？
        options:
          - 幾百個西班牙人靠槍炮就打垮了帝國，沒有別人幫忙
          - 盟軍可能有好幾萬人，天花也重創阿茲特克
          - 西班牙從歐洲送來好幾萬名援軍，才攻下阿茲特克的首都
          - 阿茲特克人以為西班牙人是神，所以放下武器
        answer: 1
        why_wrong:
          - 卡片說這個說法太簡化：有學者認為幾百名士兵的武器優勢「並非壓倒性」，原住民盟友與天花常被低估。
          - null
          - 卡片寫的是西班牙方面前後約兩三千人，原住民盟軍估計有 8 萬到 20 萬人，不是歐洲來了幾萬人。
          - 卡片寫，歷史學者 Camilla Townsend 質疑「以為西班牙人是神」這個流行說法。
        explain: 卡片說科爾特斯約 630 人登陸，聯合痛恨阿茲特克的特拉斯卡拉人，原住民盟軍估計有好幾萬；1520 年天花爆發，1521 年首都陷落。所以不能只說幾百人靠槍炮，盟友與天花都要算。
        hints:
          - 回想「為什麼只有 630 人還能成功」的小題。
          - 卡片的「常見誤解」提到哪一個流行說法被質疑？
        ref: event-columbus-aztec#C2
      - kind: choice
        q: 下面哪個說法，最符合卡片對「哥倫布大交換」的說明？
        options:
          - 這是公平的雙向交易：兩邊各拿到新作物，也各得到新疾病
          - 辣椒、番茄自古就是亞洲的作物，哥倫布只是把它們帶去美洲
          - 玉米傳入後，清代人口增加，人民的收入和生活也因此明顯變好
          - 疾病主要由舊世界傳給美洲，美洲原住民人口因此大量死亡
        answer: 3
        why_wrong:
          - 卡片說「交換」不是公平的雙向交易：疾病主要是舊世界傳給美洲，只列「可能是梅毒」從美洲傳到歐洲。
          - 辣椒、番茄、玉米、馬鈴薯原產美洲，1492 年後才傳到舊世界。
          - 有研究認為玉米與約 19% 的人口增加有關，但對人均收入、都市化與實質工資的影響不明顯，符合「人變多、日子沒變好」。
          - null

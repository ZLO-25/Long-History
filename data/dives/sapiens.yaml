    - no: 17
      part: 4
      title: 工業革命讓人更快樂？
      en: The Wheels of Industry
      claim: |
        哈拉瑞說明，工業革命以前，人類搬運貨物、灌溉作物主要靠人力和獸力；後來人學會用燃料燒水產生蒸汽推動活塞，再用蒸汽轉動線圈發電，把煤、石油等能源轉成動力，也做出塑膠、鋁等新材料 [b17]。他主張工業革命和農業革命一樣是向環境索取資源，甚至可以叫做「第二次農業革命」：雞、豬、牛被當成生產機器關在狹小空間；書中說每年約有 500 億隻動物被屠宰，依聯合國糧農組織資料，2021 年全球屠宰的陸地動物約 800 億隻，其中九成以上是雞 [b17][b69]。他也認為，過去社會推崇節儉，如今消費主義告訴人「寵愛自己才會快樂」，這套想像的秩序有助於合作，卻不一定讓人更快樂 [b17]。
      cards:
        - tech-steam-engine
        - tech-railway
        - tech-electric-grid
        - tech-internal-combustion
      card_notes:
        tech-steam-engine: 新能源怎麼取代人力和獸力
        tech-railway: 鐵路讓人和貨物的移動大幅加快
        tech-electric-grid: 把能源轉成電力送到每一戶
        tech-internal-combustion: 石油動力進入日常生活
      debate:
        - who: 羅伯特・艾倫（Robert C. Allen，經濟史家）
          text: 工業化初期，工人沒有跟著變好。他把英國 1790 到 1840 年稱為「恩格斯停頓」（產出成長、工資卻停滯的時期）：實質工資（扣掉物價上漲後真正買得到的東西）幾乎沒漲，財富多流向資本家；克拉克（Gregory Clark）則認為工資成長被低估 [b51]。
          src:
            - b51
          stance: 支持
        - who: 克拉克・納迪內利（Clark Nardinelli，經濟史家）
          text: 長期看生活水準是變好的。樂觀派估計 1819 到 1851 年工人實質工資約增加一倍；悲觀派認為，換一種物價指數（衡量一籃子商品價格變化的數字）來算，工資成長慢得多。他的結論是「溫和的樂觀」 [b52]。
          src:
            - b52
          stance: 補充
      think: 排排看：把「蒸汽機」「鐵路」「電力與電網」「內燃機與汽車」照出現的先後排好。每一項讓人更輕鬆，還是更忙？「生活更方便」和「更快樂」是同一件事嗎？
      minutes: 5
    - no: 18
      part: 4
      title: 現代真的比較和平嗎？
      en: A Permanent Revolution
      claim: |
        哈拉瑞認為，過去照顧人的是家族和村落；現代國家和市場接手了這些工作，讓人變成「個人」，但他懷疑這是否讓人更快樂 [b18]。他借用班納迪克・安德森（Benedict Anderson）的「想像的共同體」概念（一群彼此大多不認識、卻相信同屬一體的人）來稱呼國家，主張國家靠國旗、神話和象徵把陌生人連在一起 [b18][b70]。他也主張核武讓大戰形同集體自殺，而貿易比戰爭更有利可圖，所以國際大戰變少、多數人活在相對和平中，但未來仍可能逆轉 [b18][b26]。
      cards:
        - war-world-war-one
        - war-world-war-two
        - event-end-of-cold-war
        - event-nuclear-long-peace
      card_notes:
        war-world-war-one: 沒有核武時，大國如何走向大戰
        war-world-war-two: 核武登場的大戰，也是長和平的起點
        event-end-of-cold-war: 美蘇沒有直接開戰就結束對峙
        event-nuclear-long-peace: 核武是否帶來長和平的正反證據
      debate:
        - who: 史迪芬・平克（Steven Pinker，心理學家）
          text: 長和平是暴力長期下降的一部分。他 2011 年的《人性中的良善天使》主張暴力自有紀錄以來一直在下降；不過他列的主因是國家、貿易、理性等，而不是核武 [b71][b58]。
          src:
            - b71
            - b58
          stance: 支持
        - who: 布勞莫勒（Bear Braumoeller，政治學家）與奇里洛、塔雷伯（Pasquale Cirillo & Nassim Taleb）
          text: 統計上還看不出和平的趨勢。布勞莫勒 2019 年的《Only the Dead》檢驗國家間戰爭的爆發和致死程度，找不到一致的升降趨勢；奇里洛與塔雷伯 2016 年重新分析兩千年的戰爭資料，也沒發現戰爭致死程度下降，提醒大戰是罕見的極端事件 [b58][b72]。
          src:
            - b58
            - b72
          stance: 反對
        - who: 平克等學者（2022 年俄烏戰爭後）
          text: 長和平可能被打斷了。俄羅斯 2022 年入侵烏克蘭後，包括平克在內的學者都承認，長和平的部分趨勢已被打斷 [b71]。
          src:
            - b71
          stance: 補充
        - who: 達珊娜・納拉亞南（Darshana Narayanan，神經科學家）
          text: 書裡「沒有國家就比較暴力」的例子用得不妥。書把暴力減少主要歸功於國家，並拿沒有軍隊、警察的厄瓜多瓦奧拉尼人當例子；她認為瓦奧拉尼人自 1970 年代初以來大致過著和平生活 [b29]。
          src:
            - b29
          stance: 反對
      think: 預測看看：如果 1914 年的歐洲列強都有核武，第一次世界大戰還會爆發嗎？寫下理由，再看「第一次世界大戰」和〈核武與「長和平」〉兩張卡：美蘇沒有直接開戰，靠的是核武、貿易，還是運氣？
      minutes: 10
    - no: 19
      part: 4
      title: 我們比祖先更快樂嗎？
      en: And They Lived Happily Ever After
      claim: |
        哈拉瑞認為，歷史學很少問「人類有沒有變快樂」，而他主張答案可能是沒有，甚至採集者還更快樂 [b19][b22]。他主張快樂主要取決於期望，而不是客觀條件：生活一改善，期望就跟著膨脹 [b19]。他也討論快樂的生化基礎、宗教給人的意義感，並介紹佛教「放下對感受的追逐」的觀點 [b19][b26]。
      cards: []
      debate:
        - who: 理查・伊斯特林（Richard Easterlin，經濟學家）
          text: 收入長期成長，快樂卻沒跟著上升。他 1974 年提出「伊斯特林悖論」：同一時間，收入較高的人和國家比較快樂；但長期來看國家變有錢，快樂卻沒增加，和書裡「期望會膨脹」的說法相近 [b53]。
          src:
            - b53
          stance: 支持
        - who: 貝琪・史蒂文森與賈斯汀・沃爾弗斯（Betsey Stevenson & Justin Wolfers，經濟學家）
          text: 收入和快樂其實有正相關。他們 2008 年認為，伊斯特林的結論來自統計上不顯著（資料太少，無法確定差異不是巧合）的資料；用更多國家的長期資料，可看到明顯正相關。伊斯特林 2017 年回應說，這些研究只反映短期起伏 [b53]。
          src:
            - b53
          stance: 反對
      think: 你會怎麼選：A 工作月薪 4 萬、同事都領 3 萬；B 工作月薪 5 萬、同事都領 6 萬。你選哪一個？為什麼？這和「快樂取決於期望」有什麼關係？歷史學家能用什麼證據比較古人和今人的快樂？
      core: true
      minutes: 15
    - no: 20
      part: 4
      title: 智人會被自己取代嗎？
      en: The End of Homo Sapiens
      claim: |
        哈拉瑞認為，生命靠天擇演化了約 40 億年，而人類正開始用基因工程、人機結合（生化人）和人工智慧，自己設計下一步 [b20][b26][b22]。他舉出被植入水母基因而會發光的兔子、裝了晶片的昆蟲等例子，並擔心政府或企業可能打造出「超人菁英」 [b20]。他承認這些多屬推測，但呼籲大眾趁早參與決定科學研究的方向 [b20][b26]。
      cards: []
      debate:
        - who: 達珊娜・納拉亞南（Darshana Narayanan，神經科學家）
          text: 基因沒有那麼有決定性。她批評書的最後一章把基因看得太重，舉 MAO-A 基因說明基因和攻擊性並非一對一；發育和環境都會影響基因的表現，所以「改幾個基因就能設計人」太過簡化 [b29]。
          src:
            - b29
          stance: 反對
        - who: 克里斯多福・哈派克（Christopher R. Hallpike，人類學家）
          text: 這本書比較像娛樂，不是嚴肅知識。他認為書以人類會被智慧機器取代等驚悚預言作結，不該當成嚴肅的知識貢獻，而是「資訊娛樂」（infotainment）[b28][b22]。
          src:
            - b28
            - b22
          stance: 反對
      think: （討論題）如果有一天能用基因工程讓孩子更聰明，誰應該決定能不能做？列出支持和反對的理由各一個，再想想：你的理由是根據證據，還是根據價值觀？
      minutes: 10

  - type: recap
    model_answer: |
      回到最初的問題：工廠裡的機器，怎麼會變成非洲地圖上的線？先說「線」本身：柏林會議並沒有在地圖上畫好非洲。議定書第 34、35 條只談列強占領海岸土地要通知、要建立統治；多數邊界是之後二十多年，靠列強之間的雙邊談判和與非洲統治者簽的條約慢慢定下來，而且沒有任何非洲國家受邀。不過也有史家認為，議定書對後來的瓜分仍有關係。
      再說「機器和帝國」的關係：工業革命讓英國更有錢，也讓工業國需要市場、原料與投資出路，但卡片只把它寫成新帝國主義的「背景」之一。Hobson 說是資本家找出路，Schumpeter 反駁，也有人強調列強競爭或轉移國內不滿，批評者指出占領殖民地的花費常常高於收益；Allen 還認為英國工業化的條件之一來自更早的貿易與帝國擴張。這些說法並列，沒有定論。
      最後是怎麼讀史料：克拉布特里的證詞出自只聽一方證人的報告，能證明「有這樣的童工」，不能證明「到處都是」；費里的演說是為了說服議員，現場就有人反對，他說的「優等民族」是今天不被接受的種族等級說法。同一個時代，清朝被迫簽下不平等條約，日本改革後取得殖民地，臺灣在 1895 年沒有被問就被割讓。
    points:
      - "柏林會議沒有畫好非洲地圖：第 34、35 條只談海岸的通知與建立統治，邊界花二十多年陸續談定，沒有非洲國家受邀"
      - "工業化與帝國擴張：卡片只把工業化寫成「背景」之一；Hobson、Schumpeter、競爭說、Wehler 各有說法，批評者指出占領殖民地的花費常高於收益，沒有定論"
      - "讀史料要問誰說的、在什麼場合：童工證詞出自只聽一方證人的報告，費里演說是為了說服議員，且現場有人反對"
      - "同一時代的東亞：清朝被迫簽不平等條約，日本改革後取得殖民地，臺灣在 1895 年沒有被問就被割讓"

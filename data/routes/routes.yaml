  - id: road-via-aurelia
    name: 奧雷利亞大道（Via Aurelia）
    kind: road
    start: -241
    end: 500
    precision: traced
    note: 約前 241 年修築，原本終點在比薩；前 109 年的 Via Aemilia Scauri 再延伸到熱那亞。此線把兩段畫在一起。
    method: awmc-road
    waypoints: ['423025', '422831', '413076', { lat: 42.41, lng: 11.29, name: Cosa }, '403253']
    sources:

id: unit-japan-lost-decades-2
title: 日本失落 30 年（下）：零利率、安倍經濟學與一個變老的社會
histories: [日本史, 錢的歷史]
mystery: 泡沫破掉以後，日本銀行把利率壓到接近零，後來甚至讓一部分利率變成負的；政府喊改革、喊「三支箭」。可是物價長期不漲，社會還越來越老。2024 年，日經指數終於超越 1989 年的高點，日本銀行也結束了負利率。失落的三十年，真的結束了嗎？
teaser: 一個降到零還不夠用的利率、一屆找不到正職的畢業生、一場讓核電幾乎停擺的地震。
goals:
  - 能說明日本銀行從零利率（1999）、量化寬鬆（2001）到量化質化寬鬆（2013）一步步加碼的原因
  - 能說出小泉改革處理銀行壞帳、郵政民營化與派遣放寬的內容，以及好處和代價落在誰身上
  - 能說明「就職冰河期」為什麼讓晚幾年畢業的人很難再進入正職
  - 能判讀日本銀行 2016 年負利率決定的一句原文，說出它針對的是誰的錢
  - 能說出「畢業碰上不景氣」的日本經驗，哪裡可以拿來想別的地方、哪裡不能直接類比
  - 能說出日本少子高齡化的幾個關鍵數字，以及和臺灣對照時哪裡相似、哪裡不能直接比
minutes: 50
steps:
  - type: hook
    text: |
      想像你想買一支新手機。這個月 2 萬元，你聽說下個月會降到 1 萬 9 千，再下個月 1 萬 8 千。你會現在買，還是再等等？
      如果每個人都這樣想，店家賣不出去，只好減薪、少請人；大家錢變少，又更不想買東西。
      這就是「通貨緊縮」。泡沫破掉以後，日本就卡在這種「東西不漲、薪水不漲、大家都不想花錢」的狀態裡。這一課看日本怎麼想辦法走出來，又在路上碰到了什麼。
  - type: card
    id: finance-boj-zero-rate-qe
    depth: understand
    prompt: 利率降到零之後，央行還能做什麼？注意：1999 年 2 月日本銀行做了什麼？2000 年 8 月為什麼被學者批評？2001 年 3 月的「量化寬鬆」把目標從什麼改成什麼？
  - type: card
    id: event-koizumi-reforms
    depth: understand
    prompt: 2001 年上臺的小泉純一郎喊出「沒有結構改革，日本就沒有重生」。這張卡寫了哪三件事？郵政民營化法案被否決後，他怎麼讓它過關？
  - type: card
    id: social-japan-employment-ice-age
    depth: understand
    prompt: 同一段時間，一整代年輕人找不到工作。注意：2000 年大學畢業生的就業率是多少？為什麼「錯過畢業那一年」在日本特別難補回來？
  - type: card
    id: event-tohoku-fukushima-2011
    depth: understand
    prompt: 2011 年 3 月 11 日的地震、海嘯和核災。注意：核電停機以後，日本的能源和貿易出了什麼變化？國會的調查委員會怎麼形容這場事故？
  - type: card
    id: social-japan-aging
    depth: understand
    prompt: 在這些事件背後，日本的人口一直在變老。注意：日本總人口在哪一年見頂？2024 年 65 歲以上的人占多少？臺灣 2024 年是多少、預計哪一年進入超高齡社會？兩地哪裡相似、哪裡不能直接比？
  - type: decision
    role: 你是 2013 年底安倍內閣裡負責財政的官員
    situation: |
      2012 年底安倍晉三再度上臺，提出「三支箭」：大膽的貨幣寬鬆、靈活的財政支出、促進成長的結構改革。2013 年 4 月，日本銀行開始大規模寬鬆，股市大漲、日圓大貶，失業率也下降了。可是 2% 的物價上漲目標還沒達到。
      另一方面，政府的公債非常龐大，勞動人口在減少，退休金、醫療等社會保障支出持續上升。政府正在考慮：2014 年 4 月要不要把消費稅從 5% 調到 8%？有幾位知名經濟學家警告，現在增稅會傷害經濟。
      先別急著看選項：如果你是這位官員，只知道這些，你會怎麼做？
    options:
      - label: 在 2014 年 4 月把消費稅從 5% 調到 8%
        result: 這是當年日本政府的選擇。2014 年 4 月消費稅調到 8%，經濟隨即萎縮：2014 年第二季實質 GDP 年化下跌 6.8%；2015 年 1 月核心物價只上漲 0.7%，沒達到 2% 目標。日本銀行只好再加碼寬鬆。
      - label: 先延後增稅，等物價和薪水穩定上漲再說
        result: 推測：大家買東西暫時不用多付稅，經濟也許比較不會一下子變冷；但公債和社會保障支出的壓力不會消失，之後還是得面對，而且延後能不能讓物價達標也說不準。歷史沒有走這條路，所以後果只能推測。
      - label: 不加稅，改成大幅刪減政府支出
        result: 推測：砍支出同樣會讓經濟變冷，和「靈活的財政支出」這支箭互相打架；社會保障支出持續上升，退休金和醫療也很難砍。歷史沒有走這條路，所以後果只能推測。
    actual: 日本在 2014 年 4 月把消費稅從 5% 調到 8%，經濟隨即萎縮，物價也沒達到 2% 目標；克魯曼甚至主張把稅率降回 5%。後來消費稅又再調到 10%。日本銀行則在 2016 年 1 月加上負利率、9 月再直接控制長短期利率。
    ref: finance-abenomics#F3
    note: 「沒有發生的選項」的後果都是推測，標示清楚。安倍經濟學卡的 story 與 F3、F4 寫到增稅後經濟萎縮，所以把它放在決策之後；situation 只用該卡的三支箭、2013 年的股市與失業率，以及 hindsight 與 causes 的「龐大公債、勞動人口減少、社會保障支出上升」（這些也見於放在決策前的少子高齡化卡 E4，該卡沒有寫到 2014 年增稅與其後果）。沒有選 2000 年 8 月升息當決策，因為上一單元的失落十年卡已經寫出那次升息的結果。
  - type: card
    id: finance-abenomics
    depth: understand
    prompt: 看看安倍經濟學的全貌：「異次元寬鬆」到底買了什麼？2014 年增稅之後發生什麼事？股市大漲的同時，一般人的薪水跟上了嗎？
  - type: source
    card: finance-abenomics
    idx: 0
    question: 日本銀行 2016 年 1 月 29 日的這個決定，負 0.1% 的利率是用在誰的錢上？
    options:
      - 金融機構存在日本銀行的一部分活期存款
      - 一般民眾存在銀行裡的所有存款
      - 銀行借錢給民眾買房子的貸款
      - 日本政府發行的 10 年期公債
    answer: 0
    explain: 原文是「apply a negative interest rate of minus 0.1 percent to a part of current account balances」：對「current account balances」（金融機構在日本銀行的活期存款）的「a part」（一部分）適用負 0.1%。也就是說，銀行把多餘的錢存在央行，不但拿不到利息，還要被扣錢，目的是逼銀行把錢借出去。這是日本銀行自己公布的決定，寫的是「要怎麼做」，不會告訴我們效果好不好；效果要回到卡片的史家怎麼吵去看。
    hints:
      - 先找「to」後面那一段：負利率用在哪裡？
      - 「current account」在這裡指的是金融機構在日本銀行開的帳戶，不是一般人的帳戶。
      - 「a part of」是全部，還是一部分？
    ref: finance-abenomics#F3
  - type: compare
    cards: [finance-boj-zero-rate-qe, finance-abenomics]
    prompt: 比一比日本銀行的兩次「放錢」實驗：2001 年的量化寬鬆和 2013 年的量化質化寬鬆。
    rows:
      - aspect: 時間
        a: 1999 年 2 月零利率；2001 年 3 月到 2006 年 3 月量化寬鬆（中間 2000 年 8 月曾升息）
        b: 2013 年 4 月量化質化寬鬆，2016 年加上負利率與殖利率曲線控制，2024 年 3 月才結束
      - aspect: 背景
        a: 1997–98 年銀行接連倒閉，經濟停滯、物價開始下跌，全世界沒有前例可學
        b: 已經寬鬆了十多年物價仍低迷，又碰上 2008 年金融危機與 2011 年東日本大震災
      - aspect: 操作目標
        a: 金融機構在日本銀行的活期存款餘額，先約 5 兆日圓，四年內提高到 35 兆日圓
        b: 基礎貨幣，大量買進公債和股票基金（ETF）；後來再加上負 0.1% 利率、直接控制長期利率
      - aspect: 物價目標
        a: 承諾做到消費者物價穩定地不再下跌
        b: 2% 的物價上漲目標
      - aspect: 搭配什麼
        a: 經濟回升同時受到銀行壞帳清理、出口等多種因素影響，很難只歸功給一種政策
        b: 「三支箭」：貨幣寬鬆加上財政支出與結構改革；2014 年消費稅從 5% 調到 8%
      - aspect: 爭議
        a: 伊藤隆敏與 Mishkin 批評 2000 年 8 月在物價仍下跌時結束零利率，是嚴重失誤
        b: 股市大漲、失業率下降，但薪資變化有限；2015 年 1 月核心物價只漲 0.7%，沒達到目標
    question: 2013 年的寬鬆，比 2001 年的「更大膽」在哪裡？兩次都碰到了什麼共同的難題？
    model_answer: 更大膽在三個地方：目標從「物價不再下跌」提高到「漲 2%」；買的東西從主要供應銀行資金，擴大到大量買公債、股票基金；後來還加上負利率和直接控制長期利率，幾乎把非傳統工具都用上了。共同的難題是：利率已經接近零，央行只能改用「放多少錢」和「對未來的承諾」來影響大家；什麼時候退場、會不會太早收手，是最大的爭論（2000 年那次就被批評太早升息）。另外，兩次都很難說清楚效果有多少是央行的功勞，因為同時還有銀行壞帳、出口、增稅等其他因素。這題沒有標準答案，重點是看到央行的工具一次比一次多，難題卻很像。
    hints:
      - 先看「操作目標」和「物價目標」兩列：哪一邊的目標比較高、買的東西比較多？
      - 再看「爭議」那一列：兩邊被批評的地方，有沒有共同點？
      - 想想看：利率已經是零的時候，央行還剩下什麼工具？
  - type: card
    id: finance-japan-2024-negative-rate-end
    depth: understand
    prompt: 2024 年的兩件大事：日經指數超越 1989 年高點、日本銀行結束負利率。注意：日本銀行用什麼理由說「可以退場了」？為什麼也有人說「失落的三十年還沒結束」？
  - type: chain
    prompt: 把下列事件依照「因 → 果」排成一條鏈（最上面是最早的原因）。
    items:
      - 泡沫破掉後經濟停滯，1997–98 年銀行接連倒閉，物價開始下跌
      - 1999 年 2 月日本銀行讓短期利率盡可能走低（零利率）
      - 利率已經不能再降，2001 年 3 月改以「資金量」為目標（量化寬鬆）
      - 寬鬆了十多年物價仍低迷，2013 年 4 月推出規模更大的量化質化寬鬆
      - 2014 年增稅後經濟萎縮、物價沒達標，2016 年再加上負利率與殖利率曲線控制
      - 2024 年春季勞資談判顯示薪資可望上升，日本銀行判斷 2% 目標可望達成，結束負利率
    explain: 每一步都是上一步「還不夠」逼出來的。銀行倒閉、物價下跌，日本銀行先把利率壓到零；利率不能再低，只好改成直接放錢；放了十多年物價還是起不來，2013 年安倍和黑田把規模拉大；2014 年增稅後經濟又變冷、物價沒達標，2016 年再加上負利率和控制長期利率。一直到 2024 年，日本銀行認為薪資和物價可望穩定上升，才結束這套框架，但它也說寬鬆的環境暫時還會維持。
    hints:
      - 最早的原因是泡沫破掉後的停滯和物價下跌。
      - 先有「零利率」，才有「零利率之後怎麼辦」。
      - 負利率是在安倍經濟學開始之後才加上的。
    ref: finance-abenomics#F3
  - type: today
    card: social-japan-employment-ice-age
    question: 有人說：「只要畢業那年碰上不景氣，就一定會像日本的冰河期世代一樣，一輩子翻不了身。」這個說法哪裡不成立？
    model_answer: 先說不能類比的地方：日本的冰河期和「新卒一次招募」、終身雇用、年功序列這些日本特有的雇用習慣緊緊綁在一起：企業每年只集中錄用應屆畢業生，又不容易解雇老員工，錯過那一年就很難再以新人身分進大公司。研究也發現，同樣是畢業碰上不景氣，美國男性受到的影響多半是暫時的。其他地方的年輕人即使也遇到不景氣，轉職、再進修、到別的國家工作的管道和社會制度都不一樣，所以不能把日本的經驗直接套用，說「一定翻不了身」。可以借來想的是一個結構：如果一個社會的工作機會主要在「畢業那一刻」分配，之後又很難轉換，那麼剛好在不景氣時畢業的那一屆，影響就可能延續很多年。所以要看的不只是景氣好不好，還有錯過第一次機會的人，有沒有第二次、第三次機會。
  - type: check
    items:
      - kind: choice
        q: 2001 年 3 月日本銀行開始的「量化寬鬆」，主要的操作目標是什麼？
        options: [短期利率, 金融機構存在日本銀行的活期存款餘額, 日經指數的點數, 日圓對美元的匯率]
        answer: 1
        explain: 利率已經接近零，再降也沒用，所以日本銀行改看「放多少錢」：以金融機構在日本銀行的活期存款餘額約 5 兆日圓為目標，四年內提高到 35 兆日圓。
        hints: [「量化」的「量」，指的是什麼的量？, 利率已經是零了，還能用利率當目標嗎？]
        ref: finance-boj-zero-rate-qe#F3
      - kind: order
        q: 依時間先後排列：
        items: [日本銀行開始零利率政策, 日本銀行改採量化寬鬆, 製造業開放派遣, 東日本大震災, 日本銀行推出量化質化寬鬆, 日經指數超越 1989 年高點, 日本銀行結束負利率]
        explain: 1999 年 2 月 12 日零利率 → 2001 年 3 月 19 日量化寬鬆 → 2004 年 3 月 1 日製造業開放派遣 → 2011 年 3 月 11 日東日本大震災 → 2013 年 4 月 4 日量化質化寬鬆 → 2024 年 2 月 22 日日經指數收盤超越 1989 年高點 → 2024 年 3 月 19 日結束負利率。
        hints: [零利率和量化寬鬆都在 2001 年以前或當年。, 2024 年的兩件事，日經指數比日本銀行早一個月。]
        ref: finance-japan-2024-negative-rate-end#F1
      - kind: short
        q: 用一兩句話說明：為什麼就職冰河期的年輕人，晚幾年畢業就可能很難再進入正職？
        model: 因為日本企業習慣每年只集中錄用應屆畢業生（新卒一次招募），又不容易解雇既有的正職員工，不景氣時就先砍新人；錯過畢業那一年的人很難再以「新人」身分進大公司，只好長期做派遣、約聘或打工。
        explain: 研究也發現，學歷較低的日本男性畢業時碰上不景氣，影響會延續很多年，美國男性則多半是暫時的；差別就在雇用制度。
        hints: [回去看冰河期卡 E3：他們面對哪兩條規則？, 企業不景氣時，是先解雇老員工，還是先少請新人？]
        ref: social-japan-employment-ice-age#E3
  - type: recap
    model_answer: 泡沫破掉以後，日本陷入物價下跌、大家不想花錢的通縮。1997–98 年銀行接連倒閉，日本銀行在 1999 年把利率壓到接近零，2000 年 8 月提早升息被學者批評，2001 年改用「放多少錢」當目標的量化寬鬆。同一年上臺的小泉純一郎逼銀行加速打銷壞帳、推動郵政民營化；他執政期間的 2004 年，工廠也開放使用派遣；而在 1993 到 2005 年畢業的「冰河期世代」，沒能在畢業那年進入正職的人，很多只能做派遣、約聘或打工。2011 年東日本大震災讓核電幾乎停擺，日本得大量進口燃料。2013 年起安倍經濟學把寬鬆推到更大的規模，但 2014 年增稅後經濟萎縮、物價沒達標，日本銀行又加上負利率和控制長期利率。在這背後，日本人口從 2008 年見頂後一路減少，2024 年 65 歲以上已占 29.3%，勞動人口減少、社會保障支出持續上升，政府的公債也越來越重；臺灣預計 2025 年進入超高齡社會，可以對照，但兩地所處的階段不同。2024 年日經指數超越 1989 年高點、日本銀行結束負利率，但股價是名目數字、薪資變化有限，「失落的三十年結束了沒」仍沒有定論。要記得：事後看「別太早升息」「別在那時候增稅」都很容易，當時的人每個選項都有代價。這是一種參考說法，不是標準答案。
reflect: 冰河期世代的遭遇，有一部分只是「剛好在那一年畢業」。你覺得一個人的生活過得好不好，有多少來自自己的努力、有多少來自碰上的時機？如果你是政府，會怎麼幫那些「時機不好」的人？

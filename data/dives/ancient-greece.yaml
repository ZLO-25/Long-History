# 深入專題：古希臘（檔名 ancient-greece.yaml 是 validate 規定：檔名＝id 去掉 dive-）。規劃書 docs/dive-greece-rome-plan.md；底圖 code 與切線見 docs/dive-greece.md
id: dive-ancient-greece
title: 古希臘：從城邦到亞歷山大
question: 幾百個吵個不停的小城邦，怎麼發明了「人民自己管自己」？打贏波斯之後，為什麼又自己打垮自己，最後被北邊的馬其頓和西邊的羅馬收走？
blurb: 這個專題把前 800 年到前 146 年的希臘世界放大來看：城邦怎麼長出來、雅典民主怎麼運作又排除了誰、波希戰爭與伯羅奔尼撒戰爭怎麼把盟友變成敵人、馬其頓與亞歷山大怎麼改寫整個局面。每個人物都放上「從另一邊看他」，最後一區「今日影子」帶你找找：這些兩千多年前的東西，今天哪裡還看得到。
range: { start: -800, end: -146 }
histories: [希臘羅馬史]
visual: power
power_ui:
  title: 希臘世界勢力圖
  subtitle: 誰和誰結盟、誰在什麼時候最強
  caveat: 古希臘的城邦很小，同盟的成員又零散；這裡只能用今日的行政區（希臘各大區、土耳其各省，或今日國界）近似，所以只看得出大勢，看不出哪一座城邦站在哪一邊。一個行政區跨兩個勢力時，用一條經線或緯線切開，邊界只是示意，不是當時確切的界線。
  legend: 今日行政區

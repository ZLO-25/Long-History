# 第 6 期：學習模式的「XX史」清單
# 卡片屬於哪些史 = 卡片 learn.histories 明寫的 ∪ 依 civilization 自動推算的（civs 對應 data/civilizations.yaml 的文明名）
#                  ∪ 專題史依卡片類型（theme）∪ 世界通史（全部）
# track：學習模式三軌時間軸的主軌（臺灣｜東亞｜世界）；專題史的主軌是自己的專題軌
# 這個分類是人為的：同一件事常常同時屬於好幾個史，從不同史看，重點也不同
histories:
  - { id: taiwan, name: 臺灣史, track: 臺灣, civs: [臺灣], blurb: 一座島，被好幾個帝國和移民浪潮改寫，又自己長出民主和晶片產業。 }
  - { id: japan, name: 日本史, track: 東亞, civs: [日本], blurb: 從學中國到關起門，再打開門變成列強。 }
  - { id: korea, name: 朝鮮半島史, track: 東亞, civs: [朝鮮], blurb: 夾在大國之間的半島，怎麼守住自己。 }
  - { id: china, name: 中國史, track: 東亞, civs: [中國, 北方草原], blurb: 一個大帝國反覆統一、分裂，又和草原、海洋打交道。 }
  - { id: sea, name: 東南亞史, track: 東亞, civs: [東南亞], blurb: 季風和海峽讓這裡成為全世界商人的十字路口。 }
  - { id: greco-roman, name: 希臘羅馬史, track: 世界, civs: [古希臘, 古羅馬, 迦太基, 埃及], blurb: 民主、共和、帝國，很多今天的政治詞彙從這裡來。 }
  - { id: europe, name: 歐洲史, track: 世界, civs: [日耳曼與法蘭克, 拜占庭帝國, 英國, 法國, 伊比利半島, 奧地利與哈布斯堡, 荷蘭, 義大利, 俄羅斯與蘇聯], blurb: 一群互相競爭的小國，怎麼走向全世界。 }
  - { id: islam, name: 伊斯蘭世界史, track: 世界, civs: [伊斯蘭世界, 波斯], blurb: 連接歐洲、非洲、亞洲的帝國與商路。 }
  - { id: india, name: 印度史, track: 世界, civs: [印度], blurb: 宗教、香料與棉布的大國。 }
  - { id: americas, name: 美洲史, track: 世界, civs: [美國, 拉丁美洲], blurb: 原住民文明、白銀，以及後來的超級強權。 }
  - { id: world, name: 世界通史, track: 全部, all: true, blurb: 不分地區，看全世界同一時間發生了什麼。 }
  # 專題史（跨地區）
  - { id: money, name: 錢的歷史, track: 專題, theme: [finance, commodity], blurb: 錢、白銀、銀行和泡沫：錢怎麼改變歷史。 }
  - { id: tech, name: 科技史, track: 專題, theme: [tech], blurb: 從造紙到晶片：技術怎麼改變人的生活。 }

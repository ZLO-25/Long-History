id: unit-imjin-war
title: 壬辰戰爭：同一場戰爭，為什麼有三個名字？
histories: [朝鮮半島史, 日本史, 中國史]
mystery: 韓國叫它「壬辰倭亂」，日本叫「文祿・慶長之役」，中國叫「萬曆朝鮮之役」。同一場戰爭，為什麼三國說法不同？
teaser: 一位剛統一日本的武將，想借道朝鮮打明朝，結果把東亞三國都捲進七年大戰。
goals:
  - 能說出壬辰戰爭的起因、主要參戰方與結果
  - 能判讀李舜臣的一句上書，說出它的寫作情境
  - 能比較鳴梁海戰與薩拉米斯海戰，說出「以少勝多」的條件
  - 能從朝鮮、日本、中國三個角度說明同一場戰爭
minutes: 30
steps:
  - type: hook
    text: |
      同一場球賽，兩隊的球迷回家講的故事一定不一樣：贏的說「我們實力強」，輸的說「裁判有問題」，旁邊的觀眾可能又有第三種說法。
      1592 年開始的一場戰爭，在韓國、日本、中國的課本裡，連名字都不一樣。
      這個單元，我們要用三雙眼睛看同一場戰爭。
  - type: card
    id: event-toyotomi-unification
    depth: story
    prompt: 先認識發動戰爭的人：他統一日本之後，下一步想做什麼？
  - type: card
    id: event-joseon-dynasty
    depth: story
    prompt: 被攻打的朝鮮是什麼樣的國家？注意它和明朝的關係。
  - type: card
    id: war-imjin
    depth: understand
    prompt: 讀「起因」時，把原因分成兩堆：長期的結構，和直接的導火線。
  - type: chain
    prompt: 把下列事件依照「因 → 果」排成一條鏈（最上面是最早的原因）。
    items:
      - 豐臣秀吉 1590 年統一日本
      - 秀吉要求借道朝鮮去征服明朝，遭到拒絕
      - 1592 年日軍在釜山登陸，不到一個月攻下漢城
      - 朝鮮向宗主國明朝求救，明朝派兵援助
      - 1598 年秀吉病死，日軍撤退
    explain: 統一 → 對外擴張的目標 → 出兵朝鮮 → 朝鮮求援、明朝參戰、戰局僵持 → 秀吉死後撤軍。注意最後一步：戰爭結束的直接原因是秀吉病死，而不是某一方徹底打贏。
    hints:
      - 先找出讓秀吉「有餘力」對外出兵的那件事。
      - 朝鮮要先被攻打，才會向明朝求救。
      - 戰爭是怎麼結束的？跟誰的生死有關？
    ref: war-imjin#A2
  - type: card
    id: tech-turtle-ship
    depth: story
    prompt: 海上的明星是龜船。但讀完你會發現：關於它，我們不知道的比知道的多。
  - type: source
    card: war-imjin
    idx: 0
    question: 李舜臣寫「今臣戰船，尚有十二」，最可能想說服國王什麼？
    options:
      - 朝鮮水軍已經全滅，應該放棄海戰
      - 雖然大敗，他手上還有十二艘戰船，海戰還能打
      - 朝鮮應該向日本求和
      - 他要求國王撥款建造十二艘新船
    answer: 1
    explain: 這句話寫在 1597 年朝鮮艦隊大敗之後，國王宣祖下令解散水軍、改到陸上作戰。李舜臣用「尚有」（還有）強調：船雖然少，仍然能戰。讀史料要先知道寫作情境：誰寫的、寫給誰、當時發生了什麼事。後來他實際帶 13 艘船在鳴梁擊退一百多艘日艦。
    hints:
      - 「尚有」是什麼意思？是「只剩」還是「還有」的語氣？
      - 這封上書寫在一場大敗之後，朝廷可能在討論什麼？
      - 他後來真的用這些船打了一場勝仗。
    ref: war-imjin#A7
  - type: compare
    cards: [war-imjin, war-greco-persian]
    prompt: 比一比東西方兩場「以少勝多」的海戰：1597 年鳴梁、前 480 年薩拉米斯。
    rows:
      - { aspect: 入侵者, a: 豐臣政權的日本艦隊, b: 薛西斯率領的波斯艦隊 }
      - { aspect: 防守方的處境, a: 朝鮮艦隊剛在漆川梁大敗，李舜臣只剩 13 艘船, b: 雅典剛靠勞里昂銀礦的錢造好新艦隊，和其他希臘城邦聯合作戰 }
      - { aspect: 地形, a: 鳴梁海峽潮流湍急, b: 薩拉米斯海峽狹窄，船多的一方施展不開 }
      - { aspect: 結果, a: 擊退一百多艘日艦，但戰爭又打了一年，直到秀吉病死, b: 希臘獲勝，波斯主力撤退 }
    question: 兩場海戰能「以少勝多」，共同的關鍵是什麼？最大的不同又是什麼？
    model_answer: 共同關鍵是地形：都把數量較多的敵艦引進狹窄、難以展開的海峽，讓對方的數量優勢發揮不出來。不同點：薩拉米斯是波希戰爭的轉折點，波斯艦隊隨後撤退（波斯留下的陸軍隔年在普拉提亞戰敗才退出希臘）；鳴梁雖然穩住了朝鮮的海上防線，但戰爭並沒有因此結束，日軍是在秀吉病死後才撤退的。
    hints:
      - 看「地形」那一列：兩邊的海峽有什麼共同點？
      - 看「結果」：海戰打贏之後，戰爭馬上結束了嗎？
      - 想想看：數量多的艦隊，在什麼地方最吃虧？
  - type: decision
    role: 你是 1592 年的朝鮮國王宣祖
    situation: |
      日軍在釜山登陸，一路北上，首都漢城眼看守不住。朝鮮的陸軍節節敗退。
      你可以留在漢城和城池共存亡，也可以往北撤退、向明朝求救，讓水軍和各地義兵繼續抵抗。你會怎麼做？
    options:
      - { label: 往北撤退，向明朝求救, result: 這是宣祖當年的選擇。他在漢城失守前一天出逃；明朝先後派出約 16 萬 6 千名士兵和大量白銀，戰局陷入僵持。這個選擇保住了王室，但朝鮮國土遭到七年戰火蹂躪。 }
      - { label: 死守漢城, result: 推測：日軍在一個月內就攻下漢城，死守可能讓國王被俘，朝鮮失去號召抵抗與求援的中心。歷史沒有走這條路，所以後果只能推測。 }
    actual: 宣祖北逃並向明朝求援。朝鮮靠水軍、各地義兵與明軍撐了七年，1598 年秀吉死後日軍撤退。估計朝鮮軍民死傷超過一百萬人。
    ref: war-imjin#A7
    note: 「沒有發生的選項」的後果都是推測，標示清楚。
  - type: today
    card: war-imjin
    question: 有人說「壬辰戰爭證明朝鮮半島永遠是大國角力場，今天也一樣」。這個說法哪裡不成立？
    model_answer: 16 世紀的「宗主國—屬國」關係和今天的主權國家、同盟條約完全不同；當時也沒有國際法和戰爭法的約束。今天的朝鮮半島分成兩個國家，周邊國家的關係也由條約、聯合國等機制規範。壬辰戰爭可以提醒我們「地理位置會讓周邊強國捲入」，但不能拿來預測今天的局勢。
  - type: check
    items:
      - kind: choice
        q: 下列哪一個是壬辰戰爭的「直接導火線」？
        options: [朝鮮以理學治國, 秀吉要求借道朝鮮征服明朝遭拒, 明朝和日本的貿易糾紛, 朝鮮國王想攻打日本]
        answer: 1
        explain: 秀吉統一日本、手握大軍是結構；他要求借道朝鮮被拒、隨即出兵，是直接導火線。
        hints: [導火線通常是一件「具體、時間很近」的事。, 哪一個選項有明確的要求和拒絕？]
        ref: war-imjin#A2
      - kind: order
        q: 依時間先後排列：
        items: [豐臣秀吉統一日本, 日軍在釜山登陸, 鳴梁海戰, 秀吉病死、日軍撤退, 德川家康贏得關原之戰]
        explain: 1590 統一 → 1592 登陸 → 1597 鳴梁 → 1598 秀吉死、撤軍 → 1600 關原之戰。
        hints: [鳴梁發生在日本第二次出兵之後。, 關原之戰是秀吉死後日本國內的權力之爭。]
        ref: war-imjin#A9
      - kind: short
        q: 用一兩句話說明：為什麼說龜船「不是李舜臣發明的」？
        model: 因為朝鮮王朝的官方紀錄早在 1413 年就提到龜船；李舜臣是在 1592 年戰爭爆發前改良並建造了新的龜船。
        explain: 名人常常被記成「發明者」，但很多技術是在前人的基礎上改良的。
        hints: [回去看龜船卡的故事第一句。, 1413 年和 1592 年差了多少年？]
        ref: tech-turtle-ship#T2
  - type: recap
    model_answer: 因為每個國家站的位置不同。對韓國來說，這是被侵略、國土殘破、靠李舜臣和義兵守住國家的「倭亂」；對日本來說，這是秀吉統一後的對外出兵，以撤軍收場；對中國來說，這是萬曆皇帝出兵保護屬國的戰爭，花了大量白銀。名字不同，反映的是各自記得的重點不同；讀歷史時，最好三種說法都聽聽看。
next: [unit-japan-meiji, unit-ming-silver]
crosscheck: { date: 2026-10-25, by: 獨立查核 agent（未參與寫作）, result: 通過, notes: "小建議：1) source 的 explain「朝廷有人主張放棄水軍」：維基寫的是國王宣祖本人下令解散水軍、讓將士併入陸軍。可改成「國王宣祖認為水軍已經不行了，下令解散水軍、改到陸上作戰」，比較精確。2) compare 的 model_answer 說薩拉米斯之後「波斯主力隨後撤退」，跟鳴梁後「戰爭並沒有因此結束」對比，容易讓學生以為波希戰爭在薩拉米斯就結束了。可加一句「（不過波斯還留下馬鐸尼斯的陸軍，隔年在普拉提亞戰敗才真正退出希臘）」。3) 選擇題干擾項「明朝和日本的貿易糾紛」：秀吉在 1593 年和談時要求恢復勘合貿易，少數說法把貿易列為動機之一。作為「直接導火線」仍然明顯不對，可接受" }

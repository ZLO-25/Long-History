# 深入專題：日本失落 30 年。怎麼新增一個專題見 docs/dives.md（第八節：曲線主視覺）；資料來源與限制見 docs/dive-japan-lost-decades.md
id: dive-japan-lost-decades
title: 日本失落 30 年：泡沫破了以後
question: 1989 年底，日本的股價和地價高到「賣掉東京就能買下整個美國」。泡沫破掉以後，為什麼日本花了三十年都走不出低成長、物價不漲、薪水不漲？這些年裡，政府、銀行、公司和年輕人各做了什麼選擇？
blurb: 這個專題把 1985 年廣場協議到 2024 年日本銀行結束負利率的四十年放大來看：泡沫怎麼吹起來、怎麼破掉，銀行壞帳為什麼拖了快十年才處理，零利率、量化寬鬆、安倍經濟學一次比一次大膽，卻遇上人口老化、地震與核災。主視覺不是地圖，而是三條曲線：每人平均產值、物價漲幅、人口。
# 1985 年廣場協議：日圓大升值、泡沫的起點；2024 年 3 月日銀結束負利率

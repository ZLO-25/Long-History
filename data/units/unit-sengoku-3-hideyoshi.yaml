id: unit-sengoku-3-hideyoshi
title: 平民當上關白之後，為什麼要打明朝？（1582–1598）
histories: [日本史, 中國史]
mystery: 1590 年豐臣秀吉統一日本，才過兩年就把大軍送去朝鮮，說要征服明朝。一個從最底層爬上來的人，好不容易坐到最高位，為什麼不守著天下好好過，反而要去打一場從沒有人打過的仗？「統一之後，武士沒仗可打」會是答案嗎？
teaser: 一把被收走的刀、一碗讓天下人低頭的茶、一座流到中國的銀山、一封沒送出去的信：統一日本之後的八年，秀吉到底在做什麼。
goals:
  - 能說出秀吉從本能寺之變到統一日本的大事順序，以及檢地、刀狩、身分統制令各在做什麼
  - 能判讀刀狩令第一條，說出它禁止的是哪一群人、為什麼
  - 能比較豐臣政權與秦統一後的制度，說出「統一之後先登記、再標準化」的共同點與不同處
  - 能指出「刀狩之後農民手無寸鐵」「秀吉出兵是為了安置武士」這些說法，哪些有史料爭議
  - 能從明朝、朝鮮、臺灣的角度，說出秀吉統一後的日本對周邊意味著什麼
minutes: 40
steps:
  - type: hook
    text: |
      想像一間公司，靠一支超強的業務團隊打敗了所有對手，整個市場都是它的了。
      問題來了：這支團隊還在，薪水還是要發，而他們只會做一件事，就是搶地盤。
      老闆會怎麼辦？解散他們？讓他們去種田？還是找一個新的市場讓他們繼續搶？
      1590 年的日本，就有一個剛統一全國的老闆面對這個問題。
      不過先別急著下結論：他為什麼出兵，史家到今天都還沒有定論。這個單元我們一邊讀他統一後做的每一件事，一邊自己想。
  - type: decision
    role: 你是 1587 年夏天剛平定九州的豐臣秀吉
    situation: |
      你從織田信長的部將起家，1585 年當上關白，正一步步讓各地大名臣服；現在你剛把九州打下來。眼前的情況是：九州有好幾位大名集體改信天主教，長崎這個港口甚至被交給了耶穌會。
      但你也知道，和葡萄牙人的貿易離不開傳教士，連翻譯都要靠他們；而這條貿易線，是中國絲綢和日本白銀交換的管道。
      你會怎麼處理傳教士？把你的想法寫下來。
    options:
      - label: 下令神父二十天內離境，但信仰隨個人良心，而且不認真執行
        result: 這是秀吉當年的選擇。1587 年 7 月 24 日（天正 15 年 6 月 19 日）他頒布伴天連追放令，說日本是神國、神父須在二十天內準備離境；但法令並沒有嚴格執行，因為要維持和葡萄牙的貿易，也需要耶穌會士當通譯。代價是問題沒有解決：十年後他仍要面對西班牙船員「傳教是征服前奏」的說法，1597 年在長崎處死了 26 人。
      - label: 全面禁教，趕走所有傳教士，必要時連南蠻貿易一起斷
        result: 推測：石見銀卡說，1557 年以後葡萄牙人用中國絲綢到長崎換日本白銀，是日本白銀進入中國的主要管道之一；斷掉傳教士很可能等於斷掉這條線，剛統一的政權也要同時面對九州改宗大名的反彈。歷史沒有走這條路，所以後果只能推測。
      - label: 什麼都不做，信什麼教讓各地大名自己決定
        result: 推測：長崎已經被交給教會、大名集體改宗，一個剛把全國大名收編進來的政權，能不能容忍一個港口和一批大名「聽別人的」？卡片沒有寫這條路會怎樣。歷史沒有走這條路，所以後果只能推測。
    actual: 秀吉選的是「下令、但不認真執行」。這條法令本身沒有讓天主教消失，真正的流血是 1597 年的二十六聖人事件；而「限制天主教」這條路線後來被德川幕府延續並加強，一路通往後來的「鎖國」。
    ref: person-toyotomi-hideyoshi#P3
    note: 他當時看得到的是：九州大名改宗、長崎被交給教會、貿易和翻譯離不開神父。他看不到的是：十年後會有西班牙船員說出那句話，更看不到德川幕府會把這條路線推到禁教與鎖國。「沒有發生的選項」的後果都是推測，標示清楚；也別用後來的結果，倒推他當時「應該」怎麼做。
  - type: card
    id: person-toyotomi-hideyoshi
    depth: understand
    prompt: 先認識這個人。注意兩件事：讀「出身與時代」，他父親的身分有幾種說法？所以「農民之子」只是簡化。讀「關鍵決定」時留意前兩個：1584 年朝廷勸他當將軍，他為什麼拒絕、改走關白路線？第三個「1587 年怎麼處理天主教」就是你剛才做的決定，對照一下秀吉當時看到的選項和代價。
  - type: card
    id: event-toyotomi-unification
    depth: story
    prompt: 看統一的時間表：從 1582 年本能寺之變到 1590 年統一，花了幾年？他哪一年驅逐傳教士、哪一年下令刀狩？這兩件事都發生在統一「完成」之前。
  - type: card
    id: social-taiko-kenchi-katanagari
    depth: deep
    prompt: 這張卡是統一的「內部工程」：量田、收刀、定身分。請讀到「史家怎麼吵」：藤木久志認為刀狩有沒有真的把武器收光？畑中敏之又怎麼反駁？
  - type: source
    card: social-taiko-kenchi-katanagari
    idx: 0
    question: 依照刀狩令第一條，被禁止持有刀、弓、槍、鐵砲的是哪一群人？
    options:
      - 日本所有的人，包括武士
      - 各國的百姓（農民）
      - 只有寺院的僧兵
      - 外國來的傳教士
    answer: 1
    explain: 原文一開頭就是「諸国百姓等」：禁的是各地的百姓，不是武士。這條法令真正要做的不是「讓日本沒有武器」，而是劃一條線：能拿武器的是武士，拿農具的是農民。令文第三條說得很直白，怕百姓有武器就會不繳年貢、發動一揆；卡片也提醒，前一年肥後的農民起事可能就是直接刺激。
    hints:
      - 看原文最前面四個字：「諸国」後面接的是哪兩個字？
      - 這條法令發給各地的大名去執行，大名和他們的武士自己有沒有被禁？
      - 「百姓」在這裡指的是農民；被禁的就是他們。
    ref: social-taiko-kenchi-katanagari#E3
  - type: card
    id: person-sen-no-rikyu
    depth: understand
    prompt: 統一之後，秀吉身邊最有影響力的人之一不是武將，而是一個堺商人出身的茶人。注意 1587 年北野大茶湯寫明武士、町人、百姓都能來，這和刀狩差不多同一時候；再讀「關鍵決定」：1591 年他被逐回堺時，有哪些選擇？他為什麼死，史料沒有定論（想看有哪些說法，可以切到「深入」）。
  - type: card
    id: commodity-iwami-silver
    depth: understand
    prompt: 統一的日本很有錢，錢的來源之一是石見銀山。讀故事：明朝禁止和日本貿易，那日本的銀是怎麼進到中國的？1557 年以後是誰在中間經手？
  - type: card
    id: event-wokou-ningbo
    depth: understand
    prompt: 換到明朝那一邊看。讀「背景」：明朝為什麼海禁？中日之間的「絲銀差價」讓什麼人下海？再看故事的最後一句：1567 年明朝開放月港以後，中國商人可不可以合法去日本做生意？
  - type: card
    id: event-takasago-koku-arima
    depth: understand
    prompt: 秀吉的「要求四方來朝」清單上，也有臺灣。1593 年那封給「高山國王」的信寫了什麼？有沒有送到？為什麼送不到？切到「理解」看「背景」：秀吉還寫信給哪些地方？
  - type: chain
    prompt: 把下列事件依照時間順序排成一條鏈（最上面是最早的）。排的時候注意：哪些是「固定國內秩序」的事，哪些是「向外」的事。
    items:
      - 1582 年本能寺之變，秀吉在山崎擊敗明智光秀，接手信長的事業
      - 1585 年秀吉當上關白
      - 1587 年平定九州，同年頒布伴天連追放令，要神父二十天內離境
      - 1588 年刀狩令：各國百姓不准持有刀、弓、槍、鐵砲
      - 1590 年小田原之戰獲勝，日本統一
      - 1591 年身分統制令：武家奉公人不得變成町人或農民，農民不得離開田地
      - 1592 年要求借道朝鮮征服明朝遭拒，出兵朝鮮
      - 1598 年秀吉病死，日軍撤退
    explain: 從 1582 到 1590 年，秀吉一邊打仗、一邊每征服一地就派人量田登記；統一前兩年就下令收走百姓的武器，統一後一年再用身分統制令禁止武家奉公人變成町人或農民、禁止農民離開田地。卡片指出，1591 年身分統制令的目的之一，就是為即將出兵朝鮮確保兵源與年貢。也就是說，「把國內的人釘在身分上」和「把軍隊送出國」是接連發生的。至於他為什麼出兵，記得史家還有不同解釋。
    hints:
      - 最早的是信長死的那一年；最晚的是秀吉自己死的那一年。
      - 伴天連追放令（1587）和刀狩令（1588）都在統一（1590）之前；身分統制令（1591）在統一之後、出兵（1592）之前。
      - 順序是：山崎 → 關白 → 追放令 → 刀狩 → 小田原 → 身分統制令 → 出兵 → 病死。
    ref: event-toyotomi-unification#C2
  - type: compare
    cards: [social-taiko-kenchi-katanagari, event-qin-unification]
    prompt: 比一比兩個「統一之後」：16 世紀末的豐臣政權，和前 221 年的秦。兩者相隔一千八百年，做的事卻有點像。
    rows:
      - { aspect: 統一花了多久, a: 1582 年本能寺之變後，秀吉每征服一地就派人丈量土地、登記耕作者；1590 年統一, b: 前 230 年起出兵，依序滅韓、趙、魏、楚、燕、齊，前 221 年統一 }
      - { aspect: 統一前後先做什麼, a: 檢地：統一量尺（六尺三寸為一間）和量米的「京枡」，把田分等、算石高、登記「實際耕種的那個人」；1588 年刀狩、1591 年身分統制令, b: 廢除分封、全國分三十六郡由中央派官；統一度量衡、車軸寬度、貨幣與文字 }
      - { aspect: 統一之後有沒有停下來, a: 身分統制令的目的之一是為即將出兵朝鮮確保兵源與年貢；1592 年出兵, b: 前 215 年蒙恬率 30 多萬人北擊匈奴，修築的防線成為長城的一部分 }
      - { aspect: 制度活了多久, a: 檢地與刀狩把「會打仗的村子」改造成「只繳年貢的村子」，是江戶時代近世身分制度的地基, b: 秦朝只維持了十五年，但郡縣、文字、度量衡被漢朝接收，延續的是制度而不是王朝 }
      - { aspect: 史家怎麼吵, a: 刀狩是武裝解除還是身分劃界（藤木久志 vs 畑中敏之）；檢地是革命還是妥協（安良城盛昭 vs 宮川滿）, b: 暴君還是奠基者（漢代賈誼認為秦亡於自身失誤；馬非百稱他是「中國史上的大英雄之一」；魯惟一認為他開啟了到 1911 年才結束的時代） }
    question: 兩個統一者都在統一前後立刻做「登記」和「標準化」的事，為什麼？又為什麼兩者統一後都沒有停止用兵？請各說出一個可能的原因，並說明這是不是唯一解釋。
    model_answer: 一個可能的原因是：打贏只代表沒有對手，不代表能收到稅、能指揮人。秀吉用檢地登記「誰種哪塊田、該繳多少」，用刀狩和身分統制令決定「誰能拿武器、誰不能離開田地」；秦用郡縣、統一文字和度量衡讓中央的命令能傳到每個地方。沒有這些，統一只是地圖上的顏色。至於統一後繼續用兵，豐臣這邊卡片給的線索是：身分統制令的目的之一就是為出兵確保兵源與年貢，但「安置無仗可打的武士」只是學者對出兵動機的解釋之一，還有擴張野心等其他說法；秦這邊卡片只寫了蒙恬北擊匈奴的事實，沒有解釋原因。所以這題沒有標準答案，兩邊的「為什麼」都還在爭論中。要注意的差別：秦朝十五年就亡，制度被漢朝接走；豐臣政權也在秀吉死後不久被德川取代，但檢地與刀狩打下的身分秩序延續到江戶時代。
    hints:
      - 先看「統一前後先做什麼」那一列：兩邊都在「量」和「登記」什麼？登記之後政府能做到什麼？
      - 再看「統一之後有沒有停下來」：豐臣這邊，卡片說身分統制令和出兵有什麼關係？
      - 點上方按鈕打開卡片、切到「深入」，兩張卡的「史家怎麼吵」都提醒：不要把一種解釋當成定論。
  - type: today
    card: social-taiko-kenchi-katanagari
    question: 有人說「刀狩就是日本最早的槍枝管制，和今天各國管制槍枝是一回事」。這個類比哪裡不成立？
    model_answer: 先說不能類比的地方：刀狩的目標是固定封建身分、保障領主的年貢，農民沒有任何參與或申訴的管道；今天的武器管制建立在法律、議會與司法審查之上，而且管的是所有人，不是某一個身分。而且刀狩也沒有真的把武器收光，藤木久志指出江戶時代很多地方農民持有的鐵砲比武士還多，德川幕府到 1683 年以前也沒有禁止農民、町人佩刀。可以借來想的，是另一個結構：一個長期內戰結束後的新政權，怎麼處理「會打仗的人」？秀吉的答案是先普查（檢地）、再把稅和身分綁在登記資料上（刀狩、身分統制令），然後把軍隊送出國。今天很多戰爭結束後的社會也要面對「軍人要去哪裡」的問題，但答案和手段，不能照抄 16 世紀。
  - type: check
    items:
      - kind: choice
        q: 秀吉公開說的出兵目標是什麼？
        options: [占領朝鮮，長期統治朝鮮半島, 經由朝鮮去征服明朝, 奪回被明朝沒收的白銀, 把葡萄牙人趕出東亞]
        answer: 1
        explain: 秀吉公開的目標是借道朝鮮、征服明朝，要求借道被拒後 1592 年出兵。注意「公開說的目標」和「真正的動機」是兩回事：學者對他的真正動機（擴張野心、安置統一後無仗可打的武士等）還有不同解釋。
        hints: [回想統一卡故事的最後一句：他把軍隊送往朝鮮，想進一步做什麼？, 朝鮮只是「借道」的對象，真正的目標在朝鮮後面。]
        ref: event-toyotomi-unification#story
      - kind: order
        q: 依時間先後排列：
        items: [山崎之戰擊敗明智光秀, 秀吉當上關白, 頒布伴天連追放令, 頒布刀狩令, 小田原之戰獲勝、統一日本, 出兵朝鮮, 秀吉病死]
        explain: 1582 山崎 → 1585 關白 → 1587 追放令 → 1588 刀狩 → 1590 小田原 → 1592 出兵 → 1598 病死。
        hints: [追放令和刀狩都在統一之前；出兵在統一之後。, 關白（1585）比追放令（1587）早兩年。]
        ref: person-toyotomi-hideyoshi#P2
      - kind: short
        q: 用一兩句話說明：為什麼「刀狩之後日本農民就手無寸鐵」這個說法不準確？
        model: 因為刀狩沒有真的把村裡的武器收光：藤木久志指出很多地方只是象徵性地交一把，江戶時代不少藩農民持有的鐵砲比武士還多；德川幕府也沒有沒收農民與町人的刀，他們到 1683 年前仍可佩帶長短兩刀，文政年間幕府調查關東農家仍發現槍、刀、長脇差。刀狩更像是剝奪百姓「佩刀的權利」、劃清身分界線。
        explain: 不過畑中敏之也提醒：沒收不徹底不代表沒有沒收，稱之為武裝解除仍然可以；兩種看法並列才完整。
        hints: [回去看刀狩卡的「常見誤解」第一條。, 1683 年和文政年間的調查，說明了什麼？]
        ref: social-taiko-kenchi-katanagari#E6
  - type: recap
    model_answer: 老實說，「為什麼要打明朝」沒有標準答案。能確定的是秀吉公開說的目標：經朝鮮征服明朝；學者對真正的動機仍有不同解釋，「安置統一後無仗可打的武士」只是其中一種。這個單元看到的線索是：統一前後他做的事幾乎都在「固定」，檢地登記誰種哪塊田、刀狩收走百姓的武器、身分統制令禁止武家奉公人變成町人或農民、禁止農民離開田地，而卡片指出身分統制令的目的之一正是為出兵確保兵源與年貢。另一條線索是他把國內「要求大名臣服」的邏輯推向海外：朝鮮、琉球、呂宋、臺灣的「高山國」都收到了要求來朝的文書，臺灣那封連國王都找不到可以收。還要記得明朝那一邊的背景：明朝海禁、1567 年開海仍禁日本，日本的白銀只能靠走私商人和葡萄牙人進中國，嘉靖倭寇的記憶也影響了明朝對秀吉的判斷。Mary Elizabeth Berry 則提醒，秀吉真正重要的也許不是征戰而是治理：他把約兩百個領國納入中央權威，德川幕府繼承了這套體制。最後別忘了從另一邊看：對朝鮮人而言，他是造成百萬人傷亡的侵略者；對被收走武器的農民和 1597 年被處死的 26 人而言，「統一」的代價是他們付的。這是一種參考說法，不是標準答案。

    model_answer: 我們沒有單一答案。擴張這麼快，卡片並列了好幾個因素：穆罕默德在麥地那把信徒結成以共同信仰界定的社群（烏瑪），逝世後由哈里發領導，成為向外擴張的組織基礎；拜占庭與薩珊剛打完長期戰爭，雙方都已疲憊。據英文維基轉述，Donner 強調內部的凝聚與動員，Hoyland 強調對手的弱點，各說不同。對被征服的人，歐麥爾不要求改信，居民可保留宗教與習俗，但非穆斯林要繳吉茲亞；「一手拿劍、一手拿經」過度簡化，但也不能說沒有壓力。至於為什麼翻譯希臘人的書：阿拔斯革命與遷都巴格達，使更多受希臘文化影響的人口與各地學問被納入同一個帝國；哈里發與菁英出資贊助，譯者很多是敘利亞基督徒，材料也包括波斯文、梵文，不只是希臘文。英文維基還整理了薩珊式帝國意識形態、識字提高、造紙術傳入等因素。也要記得三個提醒：「智慧宮」的實際形態沒有定論；「阿拉伯數字」其實是花拉子密介紹的印度記數法；「怛羅斯戰俘傳造紙」出自 11 世紀記載，並不可靠。這是一種參考說法，不是標準答案。
    points:
      - 擴張：以共同信仰結合的社群，加上哈里發領導，以及兩個舊帝國疲憊；學者各強調不同因素（據維基轉述）
      - 對被征服者：不要求改信，居民多半可保留宗教，但非穆斯林要繳吉茲亞；「劍與經」過度簡化，也不能說沒有壓力
      - 翻譯：阿拔斯革命與遷都巴格達，納入更多受希臘文化影響的人口；哈里發與菁英贊助，材料不只希臘文
      - 三個提醒：智慧宮的形態沒有定論、「阿拉伯數字」來自印度記數法、怛羅斯傳造紙的故事證據薄弱

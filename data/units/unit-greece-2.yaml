id: unit-greece-2
title: 贏了之後：從雅典帝國到亞歷山大
histories: [希臘羅馬史, 世界通史]
mystery: 雅典打贏波斯之後成了希臘最強的城邦，為什麼不到八十年就投降？後來整個希臘，又為什麼先被北邊的馬其頓、再被西邊的羅馬收走？
teaser: 一個「共同防衛」的同盟，怎麼變成盟主的錢包；一場投票，怎麼把一整支遠征軍送上回不來的路。
goals:
  - 能說出提洛同盟怎麼從共同防衛變成「雅典帝國」，並分辨政敵的指控與官方說法
  - 能說出西西里遠征當時看得到的選項與各自的代價，並說明阿爾西比亞德斯為什麼讓人又愛又恨
  - 能依時間排出蘇格拉底之死、馬其頓崛起、亞歷山大東征到羅馬征服希臘的順序
  - 能比較雅典與羅馬兩次「保護者變統治者」的故事，並指出類比的限制
minutes: 45
companion: unit-greece-1
steps:
  - type: hook
    text: |
      想像你們班靠大家出錢、出力，組成聯隊打贏了一場很難的比賽。贏了之後，班長說：「班費放在我這邊比較安全，怎麼用，我說了算。」
      一開始你覺得有道理；後來發現，班費被拿去裝飾班長自己的教室。你想退出聯隊，卻被攔下來。
      大約兩千五百年前的雅典，就像這個班長。這個單元要看：贏了之後會發生什麼事。
    guess:
      q: 雅典打贏波斯後成了希臘最強的城邦，不到八十年就投降了。你猜最主要是為什麼？
      options:
        - 波斯帝國捲土重來，直接把雅典打敗
        - 窮人造反，雅典的民主從內部垮掉
        - 盟邦的錢、自己的決定、瘟疫和敵人拿到的外援，一件件累積起來
        - 北邊的馬其頓大軍南下，把雅典占領
      reveal: "歷史上比較接近第三個。雅典把同盟的貢金當成自己的錢，斯巴達越來越警戒，前 431 年開戰；之後瘟疫奪走領袖、西西里遠征慘敗，斯巴達又拿到波斯的錢建艦隊，前 404 年雅典投降。馬其頓和羅馬是更晚的事。"
  - type: card
    id: event-delian-league
    depth: understand
    prompt: 同盟一開始是為了什麼？注意盟邦用什麼方式出力（出錢還是出船），想退出的城邦下場如何，以及前 454 年金庫搬去了哪裡。
    focus: [C2, C6]
    quick:
      - q: "很多人以為提洛同盟一開始就是雅典的帝國，其實呢？"
        a: "前 478 年成立時，是愛琴海東岸的希臘城邦怕波斯捲土重來，才推雅典當盟主。後來想退出的納克索斯、塔索斯被打到投降，前 454 年金庫搬到雅典，到前 5 世紀中葉盟邦失去自主，才被稱為「雅典帝國」。"
      - q: "想退出的城邦下場如何？這說明同盟變成了什麼？"
        a: "納克索斯、塔索斯想退出，都被雅典打到投降，城牆被拆、船被沒收，或改繳貢金。盟邦不能退出，就表示同盟已經不是平等的聯盟，而是雅典說了算。"
  - type: source
    card: event-delian-league
    idx: 0
    question: 這句話「雅典把希臘人的公款從提洛島搬來自己保管」，最適合怎麼理解？
    options:
      - 雅典官方向盟邦說明，搬遷金庫是為了防波斯的理由
      - 伯里克里斯的政敵批評雅典拿盟邦的錢美化自己的城市
      - 盟邦代表在提洛島的會議上，投票同意搬遷金庫的結果
      - 波斯國王看到雅典同盟越來越強，對雅典發出的警告
    answer: 1
    explain: 這是普魯塔克記下的當時政敵的指控。雅典公開的說法是金庫放在提洛島不安全，搬到雅典是為了防波斯；伯里克里斯的回應則是，只要雅典替盟邦擋住波斯，就不必向盟邦交代錢怎麼用。同一件事，雅典、政敵和盟邦會講得不一樣，讀史料時要先問：這是誰說的？
    hints:
      - 先看句子的主詞：誰「搬」、誰在「保管」？語氣是在說明，還是在指責？
      - 卡片的「史家怎麼吵」寫了雅典公開說的理由，和政敵的批評，兩者語氣一樣嗎？
      - 這句話的作者是普魯塔克，他是引用誰的話？
    ref: event-delian-league#C6
    why_wrong:
      - "官方的說法是金庫放在提洛島不安全、為了防波斯；這句話的語氣是指責，不是說明。"
      - null
      - "卡片沒有記載盟邦投票；這句話是普魯塔克記下的政敵的批評。"
      - "這句話是雅典的政敵在批評伯里克里斯，和波斯國王無關。"
  - type: decision
    role: 你是前 415 年雅典公民大會裡的一位公民
    situation: |
      雅典和斯巴達已經打了十幾年：前 431 年開戰，前 430 年起城裡爆發瘟疫，領袖伯里克里斯也病死；前 421 年雙方簽了和約，大致恢復戰前狀態，但雙方的盟邦與將領並沒有全部遵守。
      現在公民大會要投票：要不要派艦隊遠征西西里？主張出兵的是阿爾西比亞德斯，名門出身、很會說話，由伯里克里斯照顧長大；原本反對的是尼西阿斯。
      先別急著看選項：如果你是台下的一位公民，只知道這些，你會怎麼舉手？你信不信那個說得最動聽的人？
    options:
      - label: 大規模遠征西西里
        result: 這是雅典當年的選擇。首批派出超過 100 艘船、約 5,000 名步兵與輕裝兵，前 413 年又增援約 73 艘。結果全軍覆沒，約 7,000 名俘虜被關進敘拉古的採石場，許多雅典人病死、餓死，非雅典籍的俘虜被賣為奴隸（數字都是古代記載的估計）。
      - label: 不出兵，守住本土和海上糧道
        result: 推測：艦隊和兵力可以留在身邊，不必賭一場遠在海外的仗；但西西里的好處也拿不到，戰爭可能拖得更久。歷史沒有走這條路，所以後果只能推測。
      - label: 只派小規模兵力
        result: 推測：損失可能比較小，但也可能兵力不夠、白白冒險，兩邊都不討好。歷史沒有走這條路，所以後果只能推測。
    actual: 雅典投票出兵，阿爾西比亞德斯與尼西阿斯等三位將軍帶兵出航。出發前，雅典城裡的赫爾墨斯像被人破壞，阿爾西比亞德斯成為主要嫌疑人；被召回受審時，他逃到敵國斯巴達；普魯塔克記載，他勸斯巴達派將軍去西西里對付雅典軍，又勸他們在雅典附近的狄凱里亞築堡駐軍。遠征最後全軍覆沒，推動出兵的人自己卻中途逃走，在西西里送命的士兵與家屬怎麼看他，卡片沒有記載。前 413 年起斯巴達在狄凱里亞築堡常駐，約 2 萬名雅典奴隸逃走、銀礦受損，波斯也開始出錢幫斯巴達建艦隊。
    ref: person-alcibiades#P3
    note: 沒有發生的選項，後果都是推測，標示清楚。這題沒有標準答案。「雅典與斯巴達」單元也有一題西西里的決策，那裡看的是戰略；這裡換個角度，問的是「你信不信那個說服你的人」。
  - type: card
    id: war-peloponnesian
    depth: understand
    prompt: 看雅典輸在哪裡。注意瘟疫、西西里遠征、波斯的錢，各自在戰爭的哪一個階段出現。
    focus: [A5, A7]
    quick:
      - q: "雅典為什麼撐得過斯巴達每年入侵？"
        a: "斯巴達每年入侵阿提卡、燒田，雅典人就躲進城牆，靠海運吃飯。只要海路暢通，城裡就不會被餓死。"
      - q: "斯巴達本來缺建艦隊的錢，後來怎麼辦到？"
        a: "前 413 年起，波斯開始出錢資助斯巴達。斯巴達用這筆錢建艦隊，在羊河摧毀雅典艦隊、掐斷糧道，前 404 年雅典就投降了。"
  - type: card
    id: person-alcibiades
    depth: understand
    prompt: 他一生換邊三次。注意阿里斯托芬形容雅典人對他的心情，以及「從另一邊看他」。
    focus: [P2, P5]
    quick:
      - q: "阿爾西比亞德斯為什麼逃到斯巴達？到了那裡做了什麼？"
        a: "出發去西西里前，赫爾墨斯像被破壞，他是主要嫌疑人，被召回受審時就逃走了。普魯塔克記載，他勸斯巴達派吉利普斯去西西里對付雅典軍，又勸他們在狄凱里亞築堡。"
      - q: "很多人以為他叛逃後，雅典人就再也不要他了，其實呢？"
        a: "前 407 年他風光回到雅典，舊罪被撤銷，還被選為擁有陸海軍全權的將軍。阿里斯托芬形容雅典人對他是「渴望他、恨他、又想要他回來」。"
  - type: chain
    prompt: 把下列事件排成一條鏈（最上面最早）。排完之後想一想：哪些前後之間是「前一件促成後一件」，哪些只是先後？
    items:
      - 雅典靠盟邦貢金擴建艦隊，斯巴達越來越警戒，戰爭開始
      - 雅典城內爆發瘟疫，伯里克里斯也病死
      - 雅典遠征西西里，慘敗
      - 斯巴達在狄凱里亞築堡，波斯開始出錢支持斯巴達建艦隊
      - 羊河之役，雅典艦隊覆滅，雅典投降
    explain: 貢金養大的雅典艦隊讓斯巴達不安，戰爭在前 431 年爆發；瘟疫奪走領袖，西西里遠征又賠掉一大批船與人，斯巴達築堡、拿到波斯的錢之後有了艦隊，羊河之役掐斷雅典的糧道。開戰之後的每一步都削弱雅典，但卡片提醒：不能只用「崛起對老大」解釋，雅典自己的決定也很重要。
    hints:
      - 最早的是開戰的背景：雅典變強、斯巴達害怕。
      - 瘟疫發生在戰爭初期，西西里在戰爭中段。
      - 最後兩步是雅典失去海上優勢，然後投降。
    ref: war-peloponnesian#A7
    followup:
      question: "這五件事裡，哪兩件之間只是先後，卡片並沒有說前一件促成後一件？"
      options:
        - "貢金養大艦隊，到斯巴達警戒、開戰"
        - "瘟疫奪走領袖，到遠征西西里"
        - "波斯出錢建艦隊，到羊河之役"
        - "羊河之役掐斷糧道，到雅典投降"
      answer: 1
      explain: "卡片沒有說瘟疫促成了西西里遠征：遠征是公民大會投票決定的，說服大家出兵的是阿爾西比亞德斯。其他三組卡片都有連起來：貢金養大的艦隊讓斯巴達警戒；斯巴達靠波斯的錢才有艦隊，在羊河摧毀雅典艦隊；掐斷糧道之後雅典投降。"
      why_wrong:
        - "卡片寫斯巴達對雅典以貢金擴建艦隊感到警戒，這是因果。"
        - null
        - "卡片說斯巴達靠波斯的錢補上建艦隊的財力，戰爭的天平因此轉向，這是因果。"
        - "卡片說羊河之役等於掐住雅典的糧道，接著雅典投降，這是因果。"
  - type: card
    id: event-death-of-socrates
    depth: understand
    prompt: 看戰敗後的雅典。注意前 403 年民主恢復時的大赦、審判的陪審團怎麼產生，以及史家對「這是政治審判還是宗教審判」怎麼吵。
    focus: [C1, C2, debate]
    quick:
      - q: "為什麼有人認為蘇格拉底的審判是政治審判？"
        a: "前 403 年民主剛恢復時有大赦，不准追究三十僭主時期的事。有人認為控方用「不敬神」的罪名繞過大赦；而蘇格拉底的往來對象裡，有三十僭主中最被痛恨的克里提亞斯。"
      - q: "審判的陪審團怎麼產生？投票有多接近？"
        a: "陪審團由抽籤選出，標準人數是 501 人。依柏拉圖的記載，只要 30 人改投就會無罪，學者推算約 280 票有罪、220 或 221 票無罪。"
  - type: card
    id: event-macedon-rise
    depth: understand
    prompt: 雅典和斯巴達互相消耗的時候，北邊有人在準備。注意腓力二世用什麼打造軍隊、錢從哪裡來、前 338 年之後發生了什麼。
    focus: [C2]
    quick:
      - q: "腓力二世靠什麼把小小的馬其頓變強？"
        a: "他讓步兵改拿很長的長槍，組成密集方陣，騎兵也大幅擴充。他又奪下潘加翁山一帶的金銀礦，用礦產支付軍費。"
      - q: "亞歷山大東征時，哪些東西是父親先準備好的？"
        a: "方陣軍隊、前 337 年成立的科林斯同盟（承認腓力是盟主與對波斯作戰的統帥），還有前 336 年已經渡海的先遣軍。亞歷山大接手的是現成的軍隊、同盟和已經開始的戰爭。"
  - type: card
    id: event-alexander-campaign
    depth: understand
    prompt: 先看十年的路線，再看「受益者與受損者」：同一場戰爭，對底比斯、推羅、加薩和波斯來說是什麼？
    focus: [C2, C5]
    quick:
      - q: "同一場戰爭，為什麼對不同的人意義不一樣？"
        a: "馬其頓軍隊與將領取得巨額戰利品；但對底比斯、推羅、加薩和波斯王室來說，是被毀或失去帝國。阿里安記載，推羅約 8,000 人被殺、約 3 萬人被賣為奴。"
      - q: "亞歷山大的東征為什麼在印度停下來？"
        a: "前 326 年他在印度擊敗波魯斯，但軍隊在希發西斯河拒絕再往東走，東征就此止步。"
  - type: card
    id: person-alexander
    depth: understand
    prompt: 讀「從另一邊看他」，想想看：埃及人、波斯人自己的看法，為什麼卡片說來源不足？
    focus: [P5]
    quick:
      - q: "為什麼卡片說埃及人、波斯人的看法「來源不足」？"
        a: "我們讀到的故事多半出自希臘與羅馬作者，是征服者一方留下的紀錄。說埃及人把他當解放者迎接，也是這些作者的說法；波斯人自己怎麼評價，所查來源沒有記載。"
      - q: "從馬其頓老兵與同伴那邊看，他的統治出現了什麼裂縫？"
        a: "酒宴上，克雷圖斯當面指責他，還說自己救過他的命。後來馬其頓軍隊在印度、在俄庇斯先後拒絕前進或譁變。"
  - type: card
    id: event-hellenistic-kingdoms
    depth: understand
    prompt: 亞歷山大一死，帝國怎麼了？注意他有沒有安排繼承人，以及後來希臘語為什麼反而傳得更遠。
    focus: [C1, C2, C6]
    quick:
      - q: "亞歷山大死後，帝國為什麼很快被分掉？"
        a: "帝國靠的是他個人的威望和部將指揮的軍隊，他又沒有清楚的繼承人。部將先瓜分各省，接著互相打了約五十年。"
      - q: "帝國分裂了，希臘語為什麼反而傳得更遠？"
        a: "分出來的王國（托勒密埃及、塞琉古、安提柯馬其頓）都由說希臘語的王室統治，希臘語的通用語成了東地中海與中東的共同語言，亞歷山卓也成為學術中心。"
  - type: card
    id: war-roman-conquest-greece
    depth: understand
    prompt: 西邊的羅馬登場了。注意前 196 年宣布了什麼、之後又留下了什麼，還有前 146 年科林斯發生了什麼事。
    focus: [A7, A8]
    quick:
      - q: "羅馬宣布希臘人「自由」的同時，還做了什麼？"
        a: "羅馬仍在科林斯、卡爾基斯和德米特里亞斯三個要塞留下駐軍，前 194 年才全部撤出。同時，和約也限制腓力五世的艦隊與軍隊。"
      - q: "很多人以為羅馬征服希臘是一場戰爭就結束，其實呢？"
        a: "是前 200 到前 146 年前後五十多年的一連串戰爭，中間還夾著「宣布自由」和撤軍。前 146 年科林斯被毀之後，希臘才歸羅馬的馬其頓總督管。"

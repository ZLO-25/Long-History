    model_answer: 明朝改用白銀繳稅，銀在中國比別處值錢；美洲的銀經馬尼拉大帆船運到亞洲，福建的月港商人（隆慶開海只開了這一個口岸）把絲綢瓷器運去，換回白銀。荷蘭東印度公司想打進中國貿易，1622 年占澎湖築城、抓漢人當勞工，明朝官員先要他們退到臺灣通商，後來 1624 年用軍隊逼他們撤出，荷蘭人轉到大員，蓋起熱蘭遮城。他們招募福建漢人來開墾、收人頭稅，向西拉雅人要求交出土地主權，鹿皮貿易讓梅花鹿與原住民社會都受到衝擊；漢人農民則因稅與勒索，1652 年起事，被荷蘭與西拉雅聯軍鎮壓。西班牙人怕馬尼拉商路被截，一度北上占領雞籠；1661 年鄭成功在大陸沿海打不下去，渡海圍攻熱蘭遮城，1662 年初荷蘭人投降。各方的看法不同，而西拉雅人的聲音，多半經過荷蘭人的手才留下來。這題沒有標準答案。
    points:
      - 明朝改用白銀繳稅，美洲白銀經馬尼拉流向福建，月港商人換走絲綢瓷器
      - 荷蘭人想打進中國貿易，1622 年占澎湖、1624 年被明軍逼退，轉到大員
      - 原住民與漢人農民付出代價：西拉雅人交出土地主權、鹿群減少；漢人農民被收稅勒索，1652 年起事被鎮壓
      - 1661 年鄭成功渡海，1662 年荷蘭人投降；各方的看法不同，西拉雅人的聲音多半經過荷蘭人的手

id: unit-angkor
title: 吳哥窟：柬埔寨最大的神廟，為什麼拜的是印度神？
histories: [柬埔寨史, 東南亞史, 印度史]
mystery: 柬埔寨國旗上畫著吳哥窟，可是吳哥窟原本供奉的是印度教的毗濕奴神。印度從來沒有派兵統治柬埔寨，印度的神是怎麼「住進」柬埔寨的？
teaser: 一千多年前，商船把印度的神、文字和王號帶到湄公河邊；本地國王把它們拿來用，蓋出了世界最大的宗教建築之一，最後又改信了從斯里蘭卡傳來的上座部佛教。
goals:
  - 能說出印度文化傳到東南亞，靠的是商人、僧侶和本地國王自己選用，而不是印度出兵
  - 能判讀《梁書》記載的扶南國王憍陳如，說出「用天竺法」是什麼意思
  - 能把扶南 → 真臘 → 吳哥王朝 → 南遷金邊的順序排出來
  - 能比較東南亞接受印度文化和越南北部接受中國文化的不同方式
  - 能說出至少兩種吳哥衰落的解釋，並指出史家之間有爭議
minutes: 35
steps:
  - type: hook
    text: |
      你生活裡很多東西是從外地傳來的：咖哩飯、聖誕節、每天寫的阿拉伯數字。大家覺得好用、好吃、好玩，就留了下來，還改成自己的樣子。
      一千多年前的柬埔寨也發生類似的事：印度的神、梵文和王號被拿來用，最後蓋出了吳哥窟。
      先猜猜看，再往下讀：印度的神，是被誰、用什麼方法「請」到柬埔寨的？是軍隊、商人，還是本地的國王自己？
    guess:
      q: ��印度的神、文字和王號，是怎麼來到柬埔寨的？
      options:
        - 印度派軍隊和官員渡海來統治，把自己的宗教帶來
        - 印度商人、僧侶和婆羅門坐商船來，本地國王看到好處，自己選來用
        - 柬埔寨的國王派人到印度學習，回國後下令全國改用
        - 印度的難民逃到柬埔寨，用印度的宗教取代了本地信仰
      reveal: 印度並沒有派軍隊或官員來統治。南印度的商人、僧侶和婆羅門跟著商船來，帶來梵文、印度教和佛教；東南亞本地有野心的領袖看到好處，才主動拿來用。
  - type: card
    id: event-indianization-sea
    depth: story
    prompt: 邊讀邊找：印度文化是跟著哪些人來到東南亞的？印度有沒有派軍隊來統治？
    focus: [C1]
    quick:
      - q: 印度的宗教和文字傳到東南亞，為什麼說不是「印度征服」？
        a: 因為印度並沒有派軍隊或官員來統治這些地方。是東南亞本地有野心的領袖，看到印度宗教和治理方法的好處，才主動拿來用。
  - type: source
    card: event-indianization-sea
    idx: 0
    question: 《梁書》說憍陳如當上扶南國王後「復改制度，用天竺法」。這句話最接近哪個意思？
    options:
      - 扶南被天竺（印度）的軍隊打敗，只好照印度的命令改制度
      - 扶南國王訂下新制度，禁止人民和天竺商人做生意
      - 原本是印度婆羅門的國王，把扶南的制度改成印度的做法
      - 扶南派使者到天竺，把那裡的曆法和種稻方法學回來
    answer: 2
    why_wrong:
      - 憍陳如是被扶南人「舉國欣戴，迎而立焉」，不是印度軍隊打進來的。
      - 原文沒有說禁止做生意；扶南的財富本來就很依賴海上貿易。
      - null
      - 憍陳如本來就是天竺婆羅門，不是扶南派人去學回來的。
    critique:
      question: 《梁書》是 7 世紀初編成的中國史書，記的是 4–5 世紀的事。讀這段記載時，最需要注意什麼？
      options:
        - 它是扶南人自己留下的紀錄，所以最能代表扶南人當時的想法
        - 它是中國人寫的外國事，時間晚於事件；細節要對照其他證據
        - 它是憍陳如本人口述的，所以裡面的每一句話都一定是事實
        - 它是印度婆羅門寫的，目的是向各國替印度的宗教做宣傳
      answer: 1
      explain: 「扶南」這個名字只出現在中國史書裡，當地同時代的文獻並沒有；《梁書》是 7 世紀初編成、記 4–5 世紀的事，是中國人寫的外國事。所以它能告訴我們「中國人記下扶南迎立了一位婆羅門國王」，但細節和動機，要靠碑文、考古等其他證據對照。
      why_wrong:
        - 「扶南」只出現在中國史書，當地同時代的文獻並沒有這個名字。
        - null
        - 《梁書》是 7 世紀初才編成的中國史書，不是憍陳如口述的。
        - 《梁書》是中國人寫的史書，不是印度婆羅門寫的。
    explain: 憍陳如「本天竺婆羅門也」，是扶南人「舉國欣戴，迎而立焉」，不是印度派兵打下來的。他當上國王以後，把制度改成「天竺法」，也就是印度的做法。卡片也說，印度並沒有派軍隊或官員來統治這些地方。
    hints:
      - 「天竺」是古代中國對哪個國家的稱呼？
      - 憍陳如是被打進來的，還是被扶南人「迎而立焉」？
      - 「改制度」改的是扶南自己的制度。
    ref: event-indianization-sea#story
  - type: card
    id: event-funan
    depth: story
    prompt: 扶南的大港俄厄挖出了什麼東西？這能看出扶南和多遠的地方有貿易往來？
    focus: [C2]
    quick:
      - q: 扶南的大港俄厄為什麼會有羅馬皇帝時代的金質獎章？這說明什麼？
        a: 俄厄是扶南的大港，出土了 2 世紀羅馬皇帝時代的金質獎章。這說明扶南和遙遠的地中海有間接的貿易往來，海上貿易讓它接觸到很遠的世界。
      - q: 扶南後來是怎麼被取代的？
        a: 到了 6 世紀，扶南的屬國真臘強大起來，反過來把扶南併吞。
  - type: card
    id: event-khmer-empire
    depth: story
    prompt: 802 年闍耶跋摩二世宣布自己是什麼「王」？想想看，國王為什麼要用印度神話裡的稱號？
    focus: [debate]
    quick:
      - q: 國王自稱「宇宙之王」、神王，對他的統治有什麼幫助？
        a: 一種看法認為，這是把王權和宗教結合：國王自稱神王、蓋神廟，讓人民相信效忠國王就是效忠神。
      - q: 關於 802 年的建國故事，史家為什麼吵了很久？
        a: 這段故事記在兩百多年後的碑文裡，說他擺脫了「爪哇」的控制。但「爪哇」指哪裡，有人說是印尼的爪哇島，有人說是占婆，也有人說是馬來半島北部。
  - type: card
    id: building-angkor-wat
    depth: story
    prompt: 讀的時候找：吳哥窟的五座塔和護城河，各自代表印度神話裡的什麼？
    focus: [D1, debate]
    quick:
      - q: 為什麼說吳哥窟是一個「縮小的印度教宇宙」？
        a: 它是獻給毗濕奴的國家神廟：五座塔代表須彌山的五座山峰，外牆和護城河代表環繞的山脈和大海。國王藉此把自己的權力和神的世界連在一起。
      - q: 大多數高棉神廟朝東，吳哥窟卻朝西，有學者怎麼推測？
        a: 有學者推測，蘇利耶跋摩二世除了把它當成國家神廟，也想把它當成自己的陵廟。
  - type: chain
    prompt: 把柬埔寨這一千多年的國家和大事依時間排好（最上面最早）。
    items:
      - 扶南的大港俄厄和羅馬世界有貿易往來
      - 扶南的屬國真臘強大起來，反過來併吞扶南
      - 闍耶跋摩二世在荔枝山登基，宣布自己是「宇宙之王」
      - 蘇利耶跋摩二世興建獻給毗濕奴的吳哥窟
      - 占婆水軍突襲吳哥都城，闍耶跋摩七世趕走占婆軍後重建吳哥城
      - 周達觀隨元朝使者來到吳哥，寫下《真臘風土記》
      - 國王放棄吳哥，南遷到今天金邊一帶
    followup:
      question: 這條線是依時間排的。下面哪一組，只是「先後」，卡片沒有說前一件促成了後一件？
      options:
        - 扶南的屬國真臘強大起來 → 真臘反過來併吞扶南
        - 吳哥王朝統一後人力財力龐大 → 蘇利耶跋摩二世能動工興建吳哥窟
        - 占婆水軍突襲吳哥都城 → 闍耶跋摩七世趕走占婆軍、重建吳哥城
        - 周達觀隨元朝使者來到吳哥 → 國王放棄吳哥南遷
      answer: 3
      explain: 周達觀把他看到的吳哥寫了下來，卡片裡沒有證據顯示他的到訪促成了南遷；卡片寫的是 1431 年前後，在暹羅壓力下國王認為吳哥守不住才南遷。這兩件事在卡片裡只是時間先後。其他三組，卡片都有寫到前因後果。
      why_wrong:
        - 卡片寫到，屬國真臘強大之後，反過來併吞了扶南。
        - 卡片說，王朝統一後龐大的人力和財力，是吳哥窟能動工的基礎。
        - 卡片說，闍耶跋摩七世是在占婆突襲、都城被攻破之後，趕走占婆軍並重建吳哥城。
        - null
    explain: 扶南（2 世紀已和羅馬有貿易）→ 真臘在 6 到 7 世紀併吞扶南（中國史書兩種記載差了幾十年） → 802 年吳哥王朝開始 → 12 世紀初蓋吳哥窟 → 1177 年占婆攻陷都城、1181 年闍耶跋摩七世即位 → 1296–1297 年周達觀到吳哥 → 1431 年前後南遷。
    hints:
      - 先找「國家」的順序：扶南、真臘、吳哥王朝。
      - 吳哥窟是 12 世紀初蓋的，占婆的突襲是 1177 年。
      - 周達觀是 1296 年來的；南遷是 1431 年前後。
    ref: event-khmer-empire#C2
  - type: compare
    cards: [event-indianization-sea, event-vietnam-northern-rule]
    prompt: 差不多同一個時代，越南北部接受了中國文化，柬埔寨和越南中南部接受了印度文化。比一比兩種「接受」的方式。
    rows:
      - { aspect: 外來文化怎麼來的, a: 跟著商人、僧侶和婆羅門坐商船來, b: 漢武帝出兵滅南越，設郡派官治理 }
      - { aspect: 誰在當地做主, a: 本地國王自己選用印度的宗教和治理方法, b: 中國王朝派官治理，北屬時期一直延續到 938 年 }
      - { aspect: 帶來了什麼, a: 梵文、印度教和佛教、印度式的王號, b: 漢字、儒學和中國式的官制 }
      - { aspect: 當地人怎麼記住這段歷史, a: 吳哥窟成為柬埔寨的國家象徵，畫在國旗上, b: 越南人把這一千年叫做「北屬」，意思是「被北方統治」 }
    question: 同樣是受外來文化影響，為什麼柬埔寨人把吳哥窟當成驕傲，越南人卻把北屬時期記成「被統治」？
    points:
      - 印度文化是跟著商人和僧侶來的，印度沒有派兵或派官統治，是東南亞本地國王主動拿來用，所以吳哥窟是高棉人自己的成就
      - 越南北部是漢朝出兵、設郡派官統治了一千年，漢字和儒學是在被統治時期生根的，所以越南人記得的是「被北方統治」
      - 一邊是自己選、一邊是被統治，留下來的記憶就不一樣
    model_answer: 印度文化是跟著商人和僧侶來的，印度沒有派兵或派官統治，是東南亞本地國王主動拿來用，所以蓋出來的吳哥窟是高棉人自己的成就。越南北部則是漢朝出兵、設郡派官統治了一千年，漢字和儒學是在被統治時期生根的，所以越南人記得的是「被北方統治」。一邊是自己選，一邊是被統治，留下來的記憶就不一樣。
    hints:
      - 看第一列：印度文化有沒有軍隊跟著來？
      - 看第二列：當地是誰在做主？
      - 想想看：自己選來用的東西和被逼著用的東西，你會怎麼記得它們？
  - type: card
    id: war-cham-khmer-1177
    depth: story
    prompt: 闍耶跋摩七世信的是哪一種宗教？這和過去吳哥以印度教為主有什麼不同？
    focus: [A9]
    quick:
      - q: 闍耶跋摩七世為什麼要重建吳哥城、蓋巴戎寺？
        a: 1177 年占婆軍洗劫吳哥都城、處死高棉國王，占領約四年。闍耶跋摩七世是趕走占婆軍、在 1181 年即位的王子，他在都城被攻破之後，重建了新都吳哥城，中心就是巴戎寺。
      - q: 闍耶跋摩七世的信仰，和過去吳哥的傳統有什麼不同？
        a: 他是大乘佛教徒，以減輕人民痛苦為號召（蓋了 102 所醫院和許多旅舍），改變了吳哥以印度教為主的傳統。
  - type: card
    id: social-angkor-zhou-daguan
    depth: story
    prompt: 周達觀看到吳哥市場上做買賣的是誰？他用什麼中國的字眼來稱呼當地的宗教人物？
    focus: [E3, E5, debate]
    quick:
      - q: 周達觀用「儒」「僧」「道」稱呼當地的宗教人物，這會帶來什麼問題？
        a: 研究者指出，他把當地的印度教信徒誤用中國的「儒」「道」來稱呼。這本書是外國人的眼光，所以讀的時候要小心。
      - q: 《真臘風土記》為什麼對今天的人這麼重要？
        a: 吳哥人自己幾乎只在石碑上留下國王和神明的事。這本書是吳哥日常生活唯一保存下來的當時人親眼紀錄，史家非常依賴它，但它是外國人的眼光。
  - type: source
    card: social-angkor-zhou-daguan
    idx: 0
    question: 根據周達觀的記載，中國商人到了吳哥，為什麼常常先娶一位當地女子？
    options:
      - 吳哥的法律規定，外國商人一定要先結婚才能做買賣
      - 當地做買賣的都是婦女，娶了她對做生意有幫助
      - 元朝皇帝命令商人和當地人通婚，好長期留在吳哥
      - 中國商人想在吳哥當官，必須先有當地的家人
    answer: 1
    why_wrong:
      - 周達觀寫的是中國商人「常常」這樣做，不是吳哥的法律規定。
      - null
      - 周達觀沒有寫元朝皇帝下過這種命令；他說的原因是「利其能買賣」。
      - 原文的理由是看重當地婦女會做買賣，不是為了當官。
    critique:
      question: 《真臘風土記》是吳哥日常生活唯一保存下來的當時人紀錄。使用它時，最需要注意什麼？
      options:
        - 作者是柬埔寨宮廷的史官，所以書裡寫的都是官方的正式說法
        - 作者是外國人，只住了將近一年，要和碑文與考古資料對照
        - 這本書完整保存到今天，裡面每個細節都已經過查證，可以直接使用
        - 作者一輩子都住在吳哥，所以他比任何當地人都更了解吳哥
      answer: 1
      explain: 周達觀是 1296 年隨元朝使者來的浙江溫州人，在吳哥住了將近一年。他帶著中國人的觀點，也會誤用中國的字眼；現存版本可能只有原書約三分之一。所以這本書很珍貴，但必須和碑文、考古資料互相對照。
      why_wrong:
        - 周達觀是中國人，隨元朝使者來訪，不是柬埔寨宮廷的史官。
        - null
        - 現存版本可能只有原書約三分之一，而且他的用字和距離常常不精確，需要對照其他證據。
        - 他只在吳哥住了將近一年，而且是外國人的眼光。
    explain: 周達觀說「國人交易皆婦人能之」，所以中國人到了那裡「必先納一婦人者，兼亦利其能買賣故也」，也就是看上她會做買賣。不過要記得，這是外國使者一年多的見聞，帶著中國人的觀點，要和碑文、考古資料對照。
    hints:
      - 先看第一句：吳哥做買賣的是誰？
      - 「利其能買賣」的「利」是「看重、得到好處」的意思。
    ref: social-angkor-zhou-daguan#story
  - type: card
    id: event-angkor-decline
    depth: story
    prompt: 這張卡列了好幾種吳哥衰落的原因。一邊讀，一邊數有幾種。
    focus: [debate]
    quick:
      - q: 吳哥為什麼衰落？至少有哪幾種解釋？
        a: 至少四種：戰爭（暹羅反覆入侵）、內部問題（王族內鬥與屬國反叛）、環境（乾旱和灌溉系統過度使用）、貿易（內陸的吳哥在海上貿易中越來越不重要）。研究者多半認為是好幾方面逐漸變化一起作用。
      - q: 改信上座部佛教，是吳哥衰落的原因嗎？
        a: 學者看法不同。很多人認為它讓國王不再被當成神、也不再蓋大型神廟，使吳哥停止發展；但也可以反過來看，宗教重心轉到以村莊為中心的寺院，寺院成了一般人學習和互助的地方。

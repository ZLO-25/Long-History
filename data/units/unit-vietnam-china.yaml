id: unit-vietnam-china
title: 越南與中國：為什麼打贏了，還要去朝貢？
histories: [越南史, 中國史]
mystery: 越南一次又一次打退北方的大軍，可是打贏之後，往往很快又派使者去中國稱臣朝貢。打贏的一方為什麼還要低頭？
teaser: 一千年被統治，自主後又一直稱臣，越南用一套「對外稱王、對內稱帝」的辦法，和北方的大國相處。
goals:
  - 能說出北屬時期、938 年白藤江之戰、明朝佔領與黎利建國的先後順序
  - 能判讀〈南國山河〉與〈平吳大誥〉，說出越南怎麼表達「南北各有其主」
  - 能說明什麼是「外王內帝」，以及越南為什麼打贏後還要請封
  - 能比較越南與中國的史書，對同一場戰爭的記法有什麼不同
minutes: 30
level: 高中
curriculum: ["歷 Ia-IV-1"]
steps:
  - type: hook
    text: |
      想像隔壁有一個比你們班大十倍的班級。你們打躲避球贏了他們，下課後你們班長卻拿著點心過去說：「以後還請多多指教。」
      這看起來很奇怪，但越南和中國相處了一千多年，常常就是這樣。
      這個單元，我們要找出越南「打贏還要低頭」的道理。
    guess:
      q: 越南打退了來自北方的大軍。你猜：打贏之後，越南通常會怎麼做？
      options:
        - 乘勝追擊，派兵攻進對方的首都
        - 很快派使者去向對方稱臣朝貢，換取和平
        - 斷絕往來，從此不再理會北方
        - 找其他國家結盟，準備下一次對抗北方
      reveal: 往往是很快派使者稱臣朝貢。陳朝打退元軍後，馬上遣使謝罪朝貢、送回戰俘；黎利趕走明軍後，也很快向明朝表示臣服。但在國內，越南的君主仍然稱皇帝。
  - type: card
    id: event-vietnam-northern-rule
    depth: story
    prompt: 先看越南被北方統治的一千年。注意「安南」這個名字是誰取的。
    focus: [terms]
    quick:
      - q: 「安南」這個名字是誰取的？是什麼意思？
        a: 唐朝在越南北部設了「安南都護府」，意思是「安定南方」。後來中國長期用「安南」稱呼越南，像是別人替你取的綽號。
      - q: 被統治的一千年裡，越南北部只有被統治而已嗎？
        a: 不只。一方面漢字、儒學和中國式官制慢慢在當地生根；另一方面當地也一再反抗，例如 40 年徵側、徵貳姐妹起兵。
  - type: card
    id: war-bach-dang-938
    depth: story
    prompt: 一千年的統治怎麼結束？注意吳權用了什麼地形和自然現象。
    focus: [A2]
    quick:
      - q: 938 年南漢為什麼會出兵越南？
        a: 越南北部的首領楊廷藝被部下矯公羨殺害，女婿吳權起兵報仇，矯公羨向南漢求援。南漢本來就想把這塊地收回來，就以此為理由出兵。
      - q: 吳權怎麼用潮水打贏南漢的水軍？
        a: 他在白藤江底插下包鐵的木樁，漲潮時樁被蓋住，引敵船開進來；退潮時木樁露出，南漢的船卡在樁上，主帥劉弘操戰死。
  - type: source
    card: war-bach-dang-938
    idx: 0
    question: 這段中國史書的記載，說明南漢水軍是怎麼輸的？
    options:
      - 南漢的船比越南少很多，被越南大艦隊團團包圍，在江面上無法突圍
      - 南漢水軍在海上遇到風暴，船被吹到別的河口，錯過了作戰的時機
      - 吳權的兵趁漲潮誘敵，退潮時南漢的船撞上鐵木樁翻覆
      - 南漢皇帝臨時下令撤退，水軍還沒交戰就掉頭回去，主帥平安返航
    answer: 2
    why_wrong:
      - 原文沒有寫越南大艦隊包圍南漢；寫的是水中的木樁和潮水。
      - 原文寫的是在「海口」迎戰，南漢水軍追了上來，沒有迷路或遇風暴。
      - null
      - 原文最後寫「洪操戰死」，雙方真的打了，主帥也沒有平安回去。
    critique:
      question: 這段出自中國的《新五代史》，是 11 世紀的中國史家寫的。它能證明什麼、不能證明什麼？
      options:
        - 能證明 938 年有這場木樁戰、南漢大敗；不能證明越南從此就是穩定的獨立國家
        - 能證明越南從 938 年起完全斷絕和中國的關係，不再向中國稱臣朝貢
        - 能證明被打敗的是唐朝或宋朝的大軍，所以中國王朝從此永遠放棄越南
        - 能證明這場戰爭只是越南人後來編出來的故事，因為中國史書根本沒有記載
      answer: 0
      explain: 這段是從南漢這一方記下越南的戰術，越南後來的史書也有類似記載，兩邊立場不同，描述卻大致一致，所以戰術可信。但 938 年吳權只稱「王」，他死後又陷入「十二使君」混戰，要到 968 年丁部領稱帝才有穩定的王朝；而且丁朝以後的王朝大多仍向中國稱臣朝貢。
      why_wrong:
        - null
        - 卡片說自主以後的越南並沒有和中國斷絕關係，丁朝以後的王朝大多向中國稱臣朝貢。
        - 被打敗的是五代十國時占據廣州的南漢，不是唐朝或宋朝。
        - 這段正是中國史書《新五代史》寫的，越南史書也有類似記載。
    explain: 「植鐵橛海中」是在水底插下包鐵的木樁；「權兵乘潮而進，洪操逐之」是吳權的兵趁漲潮誘敵、南漢主帥追了上來；「潮退舟還，轢橛者皆覆」是退潮時船往回走，壓到木樁的全都翻了。有趣的是，這段記載出自中國的《新五代史》，是從南漢這一方記下越南的戰術。
    hints:
      - 「植鐵橛海中」是在海裡做了什麼？
      - 「乘潮而進」的「潮」是什麼？潮水會一直在嗎？
      - 「潮退」之後，船底下會露出什麼？
    ref: war-bach-dang-938#story
  - type: card
    id: war-song-dai-viet-1075
    depth: deep
    prompt: 自主之後，越南對宋朝稱臣，在國內卻稱皇帝。讀「史家怎麼吵」時，注意〈南國山河〉算不算獨立宣言。
    focus: [A2, debate]
    quick:
      - q: 宋越戰爭是誰先動手的？為什麼？
        a: 是李朝先動手。宋朝認為交趾被占城削弱、是出兵的好機會，還下令禁止和交趾貿易；李朝決定先發制人，1075 年底由李常傑攻入廣西。
      - q: 為什麼說〈南國山河〉算不算「獨立宣言」還有爭議？
        a: 今天越南把它稱作第一篇獨立宣言，強調「南帝」和「北帝」平起平坐。但學者提醒，詩的作者和年代都有爭議，最早的記載出自 14 世紀的書，也可能是事後才寫的。
  - type: source
    card: war-song-dai-viet-1075
    idx: 0
    question: 「南國山河南帝居」最想強調的是什麼？
    options:
      - 南方要承認北方皇帝的地位，向他稱臣投降
      - 南方的土地有南方自己的皇帝，不容北方來犯
      - 南方要主動出兵攻入北方，奪回被北方占走的土地
      - 南方的皇帝是北方皇帝派來的，替北方管理這塊土地
    answer: 1
    why_wrong:
      - 詩的前兩句說南方有「南帝」居住，後兩句還警告來犯的敵人會失敗，沒有投降的意思。
      - null
      - 詩的重點是南方有自己的皇帝和界線，並警告來犯者；詩本身沒有說要攻入北方。
      - 詩說「南帝」居住南方、界線是天書定好的，沒有說他是北方派來的。
    critique:
      question: 傳說這首詩是李常傑所作，但學者提醒：作者和年代都有爭議，最早的記載出自 14 世紀的書。這對我們使用這首詩有什麼影響？
      options:
        - 能用它看後人怎麼讀「南北各有其主」，但不能直接證明 1075 年戰爭時就有這首詩
        - 能證明 1075 年李常傑在戰場上親口念出這首詩，鼓舞了全軍的士氣
        - 能證明越南在 1075 年已經完全不向宋朝稱臣，是個沒有往來的獨立國家
        - 什麼也不能說，因為詩是文學作品，和歷史完全沒有關係
      answer: 0
      explain: 今天越南把這首詩稱作第一篇獨立宣言，但卡片提醒它的作者和年代有爭議，記載出自較晚的書，也可能是事後才寫的。所以它是看「後來的人怎麼想」的好材料，卻不能直接當成 1075 年當時的證據。而且戰後越南仍繼續向宋朝稱臣朝貢。
      why_wrong:
        - null
        - 卡片說作者與年代都有爭議，最早的記載較晚，不能確定是李常傑當場念的。
        - 卡片說戰後越南仍繼續向宋朝稱臣朝貢，並沒有斷絕關係。
        - 詩雖然是文學，仍然能看出後人怎麼讀它；只是不能當成 1075 年的直接證據。
    explain: 詩的前兩句說南方的山河由「南帝」居住，界線是「天書」定好的；後兩句警告來犯的敵人會失敗。今天越南把它讀成「南帝」和「北帝」平起平坐。不過學者也提醒，這首詩的作者和年代至今仍有爭議。
    hints:
      - 詩裡的「南帝」對應的是誰？
      - 「截然定分在天書」說南北的界線是怎麼來的？
      - 後兩句是在對誰說話？
    ref: war-song-dai-viet-1075#story
  - type: card
    id: war-yuan-dai-viet
    depth: story
    prompt: 連蒙古大軍都被擋回去了。讀到最後一句時，注意陳朝打贏之後做了什麼。
    focus: [debate]
    quick:
      - q: 元軍三次進攻越南，為什麼都撤退了？
        a: 陳朝放棄都城、退到鄉間打游擊，元軍因炎熱、疾病和缺糧撤退；1288 年陳興道又在白藤江底插木樁，大敗元朝水軍。
      - q: 打贏之後，陳朝為什麼還要向元朝朝貢？
        a: 越南與元朝都承受不起無止境的戰爭。陳朝用送回戰俘、遣使朝貢保住面子與和平，元朝也在忽必烈死後放棄第四次出兵。
  - type: card
    id: war-ming-dai-viet
    depth: understand
    prompt: 自主四百多年後，越南又被明朝改成一個省。注意黎利趕走明軍後，馬上做了哪一件事。
    focus: [A2, A8]
    quick:
      - q: 明成祖為什麼出兵越南？結果怎麼處理越南？
        a: 他剛靠內戰奪得皇位，需要展現天子的權威，就以「恢復陳朝」為名出兵。結果沒有立陳氏後人，而是把越南改成明朝的「交趾布政使司」，直接統治。
      - q: 黎利趕走明軍後，馬上做了什麼？他在國內是什麼身分？
        a: 他很快派使者向明朝表示臣服，1431 年明朝正式承認他，雙方恢復朝貢。但在國內，他仍然是大越的皇帝。
  - type: source
    card: war-ming-dai-viet
    idx: 0
    question: 〈平吳大誥〉說「惟我大越之國，實為文獻之邦」，作者用什麼標準證明大越是一個了不起的國家？
    options:
      - 大越的軍隊天下無敵，連強大的明朝大軍都打不過
      - 大越的土地和人口都比北方的中國更多，所以國力最強
      - 大越的皇帝是天命所歸，有神明保佑才打敗了明軍
      - 大越是有典籍文化的「文獻之邦」，風俗也和北方不同
    answer: 3
    why_wrong:
      - 這段文字用的標準不是軍事力量，而是文獻（典籍與文化）和風俗。
      - 原文比的是「山川之封域既殊，南北之風俗亦異」，不是比誰的土地和人口多。
      - 原文提的是文獻之邦、疆域和風俗不同，沒有拿神明保佑當標準。
      - null
    critique:
      question: 〈平吳大誥〉是 1428 年以黎利名義、對國內臣民發布的文告，作者是阮廌。這篇文告能證明什麼、不能證明什麼？
      options:
        - 能證明黎利一方當時怎麼向國內臣民說明大越的立場，但不能直接說它就是近代意義的「獨立宣言」
        - 能證明明朝官員已經承認大越是和中國完全平等的國家，所以雙方不必再往來
        - 能證明越南全國百姓都讀過這篇文告，而且人人一致支持黎利，沒有任何人反對
        - 能證明黎利打贏之後不再向明朝稱臣，也沒有再派使者去明朝
      answer: 0
      explain: 「大誥」是對國內臣民發布的文體，所以它主要反映黎利一方怎麼說自己。學者凱利提醒，「文獻」是當時東亞共同的文明理想，不是越南獨有的認同，把它讀成近代的「獨立宣言」並不恰當。而且黎利打贏後很快派使者向明朝表示臣服，1431 年獲得明朝承認。
      why_wrong:
        - null
        - 卡片沒有說明朝承認大越平等；黎利戰後反而很快向明朝表示臣服，1431 年才獲得承認。
        - 這是以黎利名義發的文告，是他一方的說法；卡片沒有百姓都支持的證據。
        - 卡片說黎利很快派使者向明朝表示臣服，恢復朝貢。
    explain: 作者強調的是「文獻」（典籍與文化）和「山川之封域既殊，南北之風俗亦異」。學者凱利（Liam Kelley）提醒，「文獻」是當時東亞共同的文明理想，不是越南獨有的認同；「大誥」也是對國內臣民發布的文體，把它讀成近代的「獨立宣言」並不恰當。
    hints:
      - 「文獻」指的是什麼？
      - 後面兩句比較了南北哪兩件事？
      - 這些標準是軍事的，還是文化的？
    ref: war-ming-dai-viet
  - type: card
    id: event-nguyen-dynasty-vietnam-name
    depth: story
    prompt: 最後看「越南」這個國名是怎麼來的。注意阮朝原本想要的是哪兩個字，清朝又怎麼改。
    focus: [debate]
    quick:
      - q: 阮朝向清朝請封時想要什麼國號？清朝為什麼要改？
        a: 阮朝想要「南越」。清朝大臣認為古代的南越國包括廣東、廣西，名字不妥，就把兩個字倒過來，定名「越南」。
      - q: 阮朝請清朝冊封，在國內也等於是清朝的臣子嗎？
        a: 不是。阮朝在國內仍稱皇帝，國內文書稱自己是「南朝」。請封比較像一種外交禮儀，用來換取和平。
  - type: chain
    prompt: 把越南和北方王朝的關係，依時間排成一條路（最上面最早）。
    items:
      - 漢武帝滅南越，越南北部進入北屬時期
      - 吳權在白藤江打敗南漢，越南開始自主
      - 李常傑攻入宋朝邊境，越南用〈南國山河〉宣示南北各有其主
      - 陳興道在白藤江打敗元朝水軍
      - 明朝把越南改成交趾布政使司，黎利起兵把明軍趕走
      - 阮朝向清朝請封，國號定為「越南」
    followup:
      question: 這條路是時間順序，不是一件造成下一件的因果鏈。把六項合起來看，卡片反覆寫到的是哪一個模式？
      options:
        - 越南每打贏北方一次，就和北方王朝斷絕往來，直到下一次戰爭
        - 越南打退北方大軍後，往往又回到稱臣朝貢、接受冊封的關係
        - 北方王朝每次戰敗後，都反過來向越南稱臣、送上貢品
        - 越南每次都先被北方直接統治幾百年，才起兵把對方趕走
      answer: 1
      explain: 卡片一再寫到同一件事：丁朝以後的王朝大多向中國稱臣朝貢；宋越戰爭後越南仍向宋朝朝貢；陳朝打退元軍後很快遣使；黎利趕走明軍後很快表示臣服；阮朝也依例請封。至於前後兩件事，卡片多半只寫成「背景」，不是因果：例如蒙古第一次南下是為了包抄南宋，卡片沒有說是宋越戰爭造成的。
      why_wrong:
        - 卡片說自主以後的越南並沒有和中國斷絕關係，打贏之後也很快遣使朝貢。
        - null
        - 卡片沒有這樣的記載；稱臣、接受冊封的一直是越南這一方。
        - 被直接統治的只有北屬時期和明朝佔領的約 20 年；宋朝、元朝都沒有統治過越南。
    explain: 前 111 年 → 938 年 → 1075–1077 年 → 1288 年 → 1407–1428 年 → 1802–1804 年。每一次打完仗，越南都回到朝貢與冊封的關係。

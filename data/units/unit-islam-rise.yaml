id: unit-islam-rise
title: 伊斯蘭世界的興起：一個從商業城市出發的新社群，為什麼一百多年就建起大帝國，還要去翻譯希臘人的書？
histories: [伊斯蘭世界史, 世界通史]
mystery: 一個從阿拉伯半島商業城市出發的新信仰社群，為什麼一百多年內就統治了西起庇里牛斯山、東至印度河下游的大帝國？這個帝國又為什麼出錢，把各地的書譯成阿拉伯文？
teaser: 一個「社團」、兩個疲憊的老帝國、一座圓形的新首都，還有一個名字比證據更有名的「智慧宮」。
goals:
  - 能說出穆斯林社群怎麼從麥加、麥地那出發，用共同信仰（而不只是部落）結合成「烏瑪」，並在哈里發領導下向外擴張
  - 能比較學者解釋阿拉伯帝國擴張這麼快的不同說法，並說明「一手拿劍、一手拿經」為什麼過度簡化
  - 能判讀一句古蘭經經文，分清楚「文本寫了什麼」和「實際發生了什麼」
  - 能用一條因果鏈說明從穆斯林社群、阿拔斯革命到巴格達翻譯運動的過程
  - 能指出「智慧宮」「阿拉伯數字」「怛羅斯戰俘傳造紙」這些說法，哪些有證據、哪些有爭議
minutes: 40
level: 皆可
curriculum: ["歷 Nb-IV-3", "歷 Ma-V-1"]
steps:
  - type: hook
    text: |
      想像一個新社團：加入的人不看你是哪一班，只看你有沒有加入同一個社團；創辦人離開以後，大家選出會長，繼續帶著社團往外發展。
      一百多年後，這個社團的勢力，從一座商業城市一路擴到半個世界。更奇怪的是，它的會長後來還出錢，請人把別人的課本翻成自己的語言。
      這一課要問：一個從阿拉伯半島商業城市出發的社群，怎麼做到這件事？我們又該怎麼讀那些很響亮、但證據比口號複雜的說法？（信仰內容，本課用「穆斯林相信……」來寫；我們只討論歷史上發生了什麼，不替信仰下判斷。）
    guess:
      q: 阿拉伯軍隊占領新地區以後，當地居民通常被怎麼對待？（沒有對錯，先憑直覺選。）
      options:
        - 一律被強迫改信，不改信就處死
        - 多數可保留原本的宗教與習俗，但非穆斯林要繳人頭稅
        - 全部被趕走，由阿拉伯人遷入
        - 和阿拉伯人完全平等，稅負沒有差別
      reveal: 第二種比較接近卡片寫的。第二任哈里發歐麥爾不要求被征服地改信，居民保留宗教、語言與習俗；但非穆斯林有經濟能力的男子要繳吉茲亞（人頭稅），繳納者的生命、財產受保護。據英文維基轉述，學者 Lapidus 說強迫改信不是沒有，但其實很少見。
  - type: card
    id: event-rise-of-islam
    depth: deep
    prompt: 先看這個社群怎麼開始。注意麥地那的盟約，是用什麼來界定「誰屬於同一群人」。也讀「史家怎麼吵」：我們是靠哪些材料知道穆罕默德的生平？
    focus: [C4, debate]
    quick:
      - q: 麥地那的盟約用什麼來界定「誰屬於同一群人」？這和原本的部落社會有什麼不同？
        a: 用共同信仰，而不是只靠血緣與部落。盟約文字稱信徒是「一個有別於其他人的聯合體（烏瑪）」。這個社群也包含不同信仰的人，不是只有穆斯林。
      - q: 我們靠什麼材料知道穆罕默德的生平？這些材料有什麼要小心？
        a: 古蘭經幾乎不提生平細節；詳細傳記主要來自後來的「西拉」文獻，最早保存下來的是 8 世紀伊本·易斯哈格的傳記。大英百科提醒，標準年表主要是後來編者定下的，也有傳說成分；不過約 640 年的敘利亞文編年史等非穆斯林文獻也提到他。
  - type: card
    id: event-arab-caliphates
    depth: deep
    prompt: 社群在穆罕默德逝世後由哈里發領導，接著向外擴張。注意「背景」：兩個舊帝國當時是什麼狀況？也讀「怎麼對待被征服者」和「史家怎麼吵」，看學者怎麼解釋擴張，以及「一手拿劍、一手拿經」成不成立。
    focus: [C1, C4, debate, misc]
    quick:
      - q: 拜占庭與薩珊為什麼這麼快就被擊敗？卡片寫了哪些背景，學者又強調什麼？
        a: 兩國在 602–628 年長期交戰，都已疲憊，加上瘟疫與薩珊 628–632 年的內戰，難以恢復。據英文維基轉述，Donner 強調穆罕默德建立的國家與共同信念帶來的凝聚與動員，Hoyland 強調對手的弱點；各說不同，沒有單一定論。
      - q: 「一手拿劍、一手拿經」說被征服者只能在「改信或死亡」二選一。卡片怎麼看這句話？
        a: 據英文維基轉述，Lapidus 說強迫改信不是沒有、其實很少見，征服者要的與其說是改信，不如說是臣服。但這不表示沒有壓力：非穆斯林要繳吉茲亞，有些史家認為伍麥亞的制度有意多收稅、不鼓勵改信。
  - type: source
    card: event-arab-caliphates
    idx: 0
    question: 這句古蘭經經文的字面意思是什麼？
    options:
      - 要求被征服的人民在期限內全部改信
      - 宗教裡沒有強迫，正道已與迷誤分明
      - 規定非穆斯林必須繳納吉茲亞
      - 規定改信者和原本的穆斯林享有同樣的稅負
    answer: 1
    why_wrong:
      - 經文寫的正好相反：宗教裡沒有強迫。
      - null
      - 經文裡沒有提到稅；吉茲亞是卡片「怎麼對待被征服者」那一段寫的稅制。
      - 經文沒有談稅負；穆斯林之間是否一律平等對待，是卡片寫歐麥爾二世財政改革那一段的事。
    explain: 經文「لا اكراه في الدين قد تبين الرشد من الغي」意思是「宗教裡沒有強迫，正道已與迷誤分明」（本站翻譯）。穆斯林相信古蘭經是真主透過穆罕默德啟示的經典，這句話是經典的文字。它在說什麼，和被征服地區後來實際發生了什麼，是兩個要分開問的問題。
    hints:
      - 先看中文翻譯的第一句，不用管阿拉伯文。
      - 注意經文裡有沒有出現「稅」「期限」這些字。
    ref: event-arab-caliphates#C4
    critique:
      question: 這是經典的文字，不是早期征服的紀錄。如果想用它回答「早期征服時，有沒有人被逼改信」，怎麼做比較穩妥？
      options:
        - 先把它當成「經典怎麼寫」，再和稅制、改信比例等證據一起看
        - 既然經典這樣寫，早期征服時就完全不可能有人被強迫過，不必再查別的證據
        - 這是宗教經典，不是歷史紀錄，歷史學者可以完全不理會，直接拿軍事紀錄回答
        - 既然非穆斯林要繳吉茲亞，就證明這句經文從來沒有被遵守
      answer: 0
      explain: 經文能證明的是：這個社群的經典寫了「宗教裡沒有強迫」。它不能單獨證明實際上沒有任何人被強迫，也不能證明實際上一定沒有壓力。卡片的做法是並列證據：強迫改信不是沒有但很少見（據維基轉述 Lapidus），而非穆斯林要繳吉茲亞，有些史家認為伍麥亞的制度有意不鼓勵改信。
      why_wrong:
        - null
        - 經文是文本，不是統計；卡片說強迫改信「不是沒有，只是很少見」，所以不能說完全不可能。
        - 經典是這個社群的重要文字，歷史學者可以討論它寫了什麼、後人怎麼用；只是不能單靠它回答「實際發生了什麼」。
        - 吉茲亞繳納者的生命、財產受保護，並可繼續信奉自己的宗教；繳稅不等於被強迫改信，兩件事不能這樣直接連。
  - type: card
    id: event-abbasid-translation
    depth: deep
    prompt: 帝國的重心後來從大馬士革移到巴格達。注意：被翻譯的書不只來自希臘；也讀「史家怎麼吵」，看「智慧宮」到底是什麼，還有一個常見的造紙故事哪裡有問題。
    focus: [C1, C2, debate, exaggerated, misc]
    quick:
      - q: 巴格達的翻譯運動只翻希臘文的書嗎？是誰在翻？
        a: 不是。材料也包括波斯文（巴列維文）、梵文和敘利亞文，敘利亞文常是中介語言。當時兩大翻譯團隊由金迪與胡奈因·伊本·伊斯哈格帶領，許多譯者是敘利亞基督徒。
      - q: 有人說「智慧宮是古代的大學」。卡片怎麼看這句話？
        a: 這句話過頭了。大英百科說智慧宮是哈里發的王室圖書館，沒有多少證據顯示它是巴格達翻譯與研究的中心。據英文維基轉述，Gutas 認為它只是「藏書庫」；但也有人說他的理論仍可爭論。它實際的形態沒有定論。
  - type: card
    id: finance-abbasid-sakk-hawala
    depth: deep
    prompt: 巴格達不只是學者的城市，也是商人的城市。注意商人為了什麼需要 sakk，也看「可能被誇大」的那一段：sakk 真的是「最早的支票」嗎？
    focus: [F1, F3, exaggerated]
    quick:
      - q: 巴格達的商人為什麼會用 sakk 這類書面付款命令？
        a: 金屬貨幣時代，帶大量金銀幣長途旅行既沉重又容易被搶，各地錢幣的成色也不同。書面命令讓人不必每次都搬運錢幣。不過它的使用範圍、跨城市流通和法律保障，現有來源不足以下結論。
      - q: 「sakk 是最早的支票，再傳到歐洲」可以當定論嗎？
        a: 不行。英文 cheque 的詞源是否來自 sakk 有爭議，維基百科的一般說法並不採取這個解釋；它的流通規模和法律效力也缺少完整史料。
  - type: chain
    prompt: 把下列事件依照「因 → 果」排成一條鏈（最上面是最早的原因）。
    items:
      - 麥地那的盟約把信徒結成以共同信仰界定的社群（烏瑪）
      - 穆罕默德逝世後由哈里發領導社群，先重新統一阿拉伯半島
      - 阿拉伯軍擊敗拜占庭與薩珊波斯，薩珊垮臺，埃及也被占領
      - 伍麥亞時期，改信的非阿拉伯人（麥瓦利）不滿，轉向哈希米派
      - 哈希米派推翻伍麥亞，阿拔斯王朝建立並興建巴格達
      - 阿拔斯革命與遷都之後，更多受希臘文化影響的人口與各地學問被納入同一個帝國
      - 哈里發與菁英出資贊助，把各地著作譯成阿拉伯文
    explain: 先有以共同信仰結合的社群，穆罕默德逝世後由哈里發領導，成為向外擴張的組織基礎；擴張之後，帝國的版圖與人口大了很多。伍麥亞時期，改信的非阿拉伯人（麥瓦利）不滿，轉向否認伍麥亞合法性的哈希米派；阿拔斯革命與遷都巴格達，使更多受希臘文化影響的人口與各地學問被納入同一個帝國，翻譯運動隨之展開。注意：翻譯運動為什麼發生，英文維基還列了其他因素（薩珊式的帝國意識形態、識字提高、敘利亞基督徒社群、造紙術傳入），這裡只排出卡片直接寫出因果的那一條線。
    hints:
      - 最早的是「社群怎麼形成」，再來才是帝國擴大。
      - 阿拔斯推翻伍麥亞，靠的是對伍麥亞不滿的人；巴格達是阿拔斯建的。
      - 最後一步發生在巴格達，是這個帝國對「別人的書」做的事。
    ref: event-abbasid-translation#C1
    followup:
      question: 常見的說法把「怛羅斯之戰 → 唐軍戰俘傳出造紙術 → 翻譯運動」連成一條線。依兩張卡，這條線的哪一環最站不住腳？
      options:
        - 「戰俘傳出造紙術」這一環：這個說法出自 11 世紀的記載
        - 「怛羅斯之戰」這一環：阿拔斯軍與唐軍的這場戰役其實沒有發生過
        - 「紙幫助翻譯」這一環：紙和大規模的抄寫、翻譯其實毫無關係
        - 「翻譯運動」這一環：巴格達其實沒有把外來著作大量譯成阿拉伯文
      answer: 0
      explain: 怛羅斯之戰本身有記載（751 年阿拔斯軍擊敗高仙芝率領的唐軍）；紙也被卡片列為翻譯的物質條件之一（紙何時、怎麼傳入有爭議）。站不住腳的是中間那一環：戰俘傳出造紙術的說法出自 11 世紀的記載（歷史學者薩阿利比），英文維基說不太可能是事實；學者 Jonathan Bloom 認為撒馬爾罕在戰前數十年已在用紙，很可能也已造紙。所以「先發生」不等於「造成」。
      why_wrong:
        - null
        - 戰役是有記載的；卡片寫 751 年阿拔斯軍擊敗唐軍。有問題的是「戰俘傳造紙」那一環。
        - 卡片把紙列為翻譯的物質條件之一（紙何時、怎麼傳入有爭議），並沒有說它們毫無關係。
        - 卡片寫翻譯運動約在 8 世紀中到 10 世紀末進行，把希臘文、波斯文、梵文和敘利亞文的著作譯成阿拉伯文。
  - type: decision
    role: 你是伍麥亞哈里發歐麥爾二世
    situation: |
      帝國的版圖已經很大，國庫靠稅收運作。改信伊斯蘭的非阿拉伯人（麥瓦利），長期受到不平等的對待。有人說，伍麥亞時期形成的制度，目的之一是對非穆斯林增稅並減少改信；總督也反對放寬改信，因為會減少稅收。
      先別急著看選項：如果你是他，只知道這些，你會怎麼做？
    options:
      - { label: 讓所有穆斯林一律平等對待, result: 這是歐麥爾二世的財政改革。卡片寫它「卻造成財政危機」。卡片接著寫，非阿拉伯穆斯林（麥瓦利）的不滿使他們轉向否認伍麥亞合法性的哈希米派；卡片沒有說這份不滿是改革造成的。 }
      - { label: 維持現狀，保住稅收, result: 推測：稅收短期可能保住，但麥瓦利的不平等會繼續累積。歷史上歐麥爾二世沒有走這條路，所以後果只能推測。 }
      - { label: 要求境內非穆斯林在期限內改信, result: 推測：這會放棄第二任哈里發歐麥爾以來「不要求被征服地改信」的做法，也會讓吉茲亞收入減少（總督擔心的正是稅收減少）。歷史沒有走這條路，所以後果只能推測。 }
    actual: 歷史上歐麥爾二世選了第一條：財政改革讓所有穆斯林一律平等對待。卡片寫它造成財政危機；非阿拉伯穆斯林的不滿使他們轉向哈希米派，749–750 年哈希米派推翻了伍麥亞，建立阿拔斯王朝。
    ref: event-arab-caliphates#C4
    note: 「沒有發生的選項」的後果都是推測，標示清楚。卡片沒有詳細寫這項改革的內容與之後的過程，所以不要把「改革失敗導致伍麥亞滅亡」當成定論；卡片只寫了兩件事先後發生並彼此相關。
  - type: compare
    cards: [event-arab-caliphates, event-abbasid-translation]
    prompt: 比一比伍麥亞時期與阿拔斯的巴格達，兩個王朝把力氣放在哪裡。
    rows:
      - { aspect: 政治中心, a: 661 年起，穆阿維葉把哈里發的權力集中在大馬士革, b: 762 年哈里發曼蘇爾下令在底格里斯河畔興建巴格達；核心是直徑約 2 公里的圓城 }
      - { aspect: 這段時期最顯眼的事, a: 往西北非與西班牙、往東中亞與信德擴張；阿拉伯語成為官方語言, b: 翻譯運動：把希臘文、波斯文、梵文和敘利亞文的著作譯成阿拉伯文 }
      - { aspect: 非阿拉伯人的位置, a: 阿拉伯人取代波斯與希臘官員；改信的非阿拉伯人（麥瓦利）受不平等對待，不滿轉向哈希米派, b: 巴格達由伊朗裔的巴爾馬克家族指導興建；許多譯者是敘利亞基督徒 }
      - { aspect: 語言、錢幣與學問上的做法, a: 用阿拉伯文錢幣取代舊幣，用阿拉伯語與阿拉伯官員管理財政, b: 贊助翻譯；曼蘇爾把翻譯與帝國的合法性連到薩珊傳統 }
    question: 伍麥亞和阿拔斯都是哈里發國家，但重心不同。請說出兩個差別，再說說：阿拔斯的哈里發為什麼願意出資翻譯各地的書？
    model_answer: 差別有幾個：伍麥亞的政治中心在大馬士革，重點放在向外擴張與阿拉伯化（阿拉伯語成官方語言、阿拉伯文錢幣、阿拉伯人取代波斯與希臘官員）；阿拔斯推翻伍麥亞後，在巴格達建都，帝國裡有更多受希臘文化影響的人口，學問也成為威望的來源。為什麼出資翻譯，英文維基整理了幾個因素：阿拔斯革命與遷都帶來更多受希臘文化影響的人口、阿拔斯菁英採用薩珊式的帝國意識形態、伍麥亞時期的穩定提高了識字與教育、敘利亞語基督徒社群被納入帝國，以及造紙術的傳入（紙何時、怎麼傳入有爭議）。卡片也寫，贊助翻譯的哈里發與菁英藉此鞏固政權的威望。這題沒有標準答案，各說法的權重學者看法不同。
    hints:
      - 看「政治中心」和「這段時期最顯眼的事」兩列：伍麥亞做的事，阿拔斯有繼續做同樣的事嗎？
      - 「非阿拉伯人的位置」那一列：伍麥亞時期誰受到不平等對待？阿拔斯的巴格達是誰指導興建的？
      - 打開翻譯卡的「史家怎麼吵」，英文維基整理了好幾個促成翻譯運動的因素。
    points:
      - 伍麥亞：政治中心在大馬士革，重點是擴張與阿拉伯化（阿拉伯語、阿拉伯文錢幣、阿拉伯官員）
      - 阿拔斯：在巴格達建都，納入更多受希臘文化影響的人口，贊助翻譯來自多種語言的著作
      - 英文維基整理的因素：更多受希臘文化影響的人口、薩珊式帝國意識形態、識字提高、敘利亞基督徒社群、造紙術（紙的傳入時間與方式有爭議）
      - 贊助翻譯也能鞏固哈里發與菁英的威望；這題沒有標準答案

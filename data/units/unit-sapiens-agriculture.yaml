id: unit-sapiens-agriculture
title: 農業革命：種田讓人過得更好了嗎？
histories: [世界通史, 中國史]
mystery: 課本常說，人類學會種田以後，有了穩定的糧食、村落和城市，文明就開始了。哈拉瑞卻認為農業革命是「史上最大的騙局」：人變多了，多數人卻過得更辛苦。種田到底讓人過得更好，還是更糟？卡片上的證據能回答到哪裡？
teaser: 一個上千粒野生大麥的穀倉、一堆被挑過的山羊骨頭、一座獵人蓋的巨石圈、一塊記帳的泥板：從採集到記帳，人類的日子怎麼變了？
goals:
  - 能說出哈拉瑞「農業是史上最大的騙局」的說法，以及卡片上支持和需要保留的證據
  - 能判讀一件考古遺物（甘吉達雷的山羊骨頭），說出它能證明什麼、不能證明什麼
  - 能比較肥沃月彎與東亞的農業起源，說出兩地的作物、速度與健康線索有什麼不同
  - 能指出哥貝克力石陣的新發現，怎麼影響「先有神廟才有農業」這個說法
  - 能依先後排出從開始種田到出現文字、記帳和債務規則的過程
minutes: 45
steps:
  - type: hook
    text: |
      想像你家第一次買了洗衣機，本來以為從此可以輕鬆很多；結果衣服越洗越多、越換越勤，生活沒有比較閒，可是也回不去用手洗了。
      哈拉瑞在《人類大歷史》裡，用類似的眼光看農業：他認為農業讓人口變多，卻讓多數人工作更久、吃得更單調、更容易生病，所以稱它為「史上最大的騙局」，甚至說不是人馴化了小麥，而是小麥馴化了人。
      這個說法很有衝擊力。這個單元要做的，是拿證據卡一張一張檢查：它說對了什麼？哪些地方的證據還不夠？
  - type: card
    id: event-fertile-crescent-agriculture
    depth: deep
    prompt: 先到西亞的「肥沃月彎」。注意：從人類栽培野生大麥，到大麥外形改變，中間隔了多久？也讀「常見誤解」：改吃穀物以後，人的身高和健康怎麼了？
  - type: source
    card: event-fertile-crescent-agriculture
    idx: 0
    question: 伊朗甘吉達雷遺址最古老的地層裡，成年公羊的骨頭很少，母羊和年輕公羊的骨頭很多。這些骨頭最能說明什麼？
    options:
      - 人們已經在有選擇地管理山羊：留下能生小羊的母羊，先宰殺年輕公羊
      - 牧羊讓當地人比打獵的人過得更健康、更快樂
      - 山羊是在一夕之間被人馴化的
      - 當時的人已經有國家，由官員統一分配羊肉
    answer: 0
    explain: 骨頭的比例顯示，人們有選擇地宰殺未成年公羊、保留能生育的母羊，這是牧養的證據，學者據此把札格洛斯山區的山羊馴化放在約 1 萬年前。但骨頭只能告訴我們「人怎麼對待羊」，不能告訴我們牧人過得好不好、快不快樂；當時也還沒有國家。
    hints:
      - 先比較：哪一種羊的骨頭特別少？哪一種特別多？
      - 如果你是牧人，想讓羊越養越多，你會留下母羊還是公羊？
      - 這些骨頭有沒有告訴我們「人的」健康和心情？
    ref: event-fertile-crescent-agriculture#C4
  - type: card
    id: event-east-asia-agriculture
    depth: deep
    prompt: 再到東亞。注意上山、磁山、賈湖、河姆渡各是多久以前、種的是什麼；也讀「史家怎麼吵」：「栽培」和「馴化」有什麼不一樣？還有「受益者與受損者」：賈湖的墓葬透露了什麼？
  - type: compare
    cards: [event-fertile-crescent-agriculture, event-east-asia-agriculture]
    prompt: 西亞和東亞，是兩個各自開始種田的地方。比一比它們。
    rows:
      - aspect: 主要作物與動物
        a: 小麥、大麥、豆類、亞麻；山羊、綿羊、豬、牛
        b: 南方以稻為主，北方以小米（黍、粟）為主；河姆渡可能已馴養豬
      - aspect: 大約什麼時候
        a: 人類管理日後的馴化物種至少可追溯到約 1.15 萬年前；奠基作物約 1.07–0.97 萬年前成為主食
        b: 上山約 1 萬年前已在陶土裡摻稻殼稻葉；磁山最早只裝黍的窖穴約 1.03 萬年前；賈湖約前 7000–前 5700 年同時種稻與粟
      - aspect: 花了多久
        a: 吉爾加一號的野生大麥顯示，馴化前的栽培至少持續了一千年
        b: 到約 7 千年前的河姆渡時期，田螺山的稻子仍在發生馴化變化，從照顧野生稻到完全馴化花了好幾千年
      - aspect: 健康線索
        a: 改吃穀物後平均身高下降，嬰兒死亡率與傳染病增加，和家畜接觸也帶來人畜共通疾病
        b: 賈湖不同時期的墓葬顯示壽命增加、兒童死亡率下降，但這只是一個遺址的情形
      - aspect: 彼此有沒有關係
        a: 農業不只在肥沃月彎出現，中國、中美洲、新幾內亞等地也各自發展
        b: 「農業從西亞傳到中國」不正確，稻與小米是在東亞自己發展出來的
    question: 兩地「種田以後過得好不好」的證據一樣嗎？能不能用一句話回答所有地方？
    model_answer: 不一樣。肥沃月彎卡整理的證據顯示，改吃穀物後平均身高下降、傳染病、蛀牙和貧血變多，比較支持哈拉瑞「多數人更辛苦」的說法；但東亞的賈湖遺址，墓葬卻顯示壽命增加、兒童死亡率下降。要注意，賈湖只是一個遺址，不能代表整個東亞，肥沃月彎的健康證據也是整體的趨勢。兩地的共同點是：農業都不是某天突然發明的，從照顧野生植物到植物完全馴化，都花了上千年。所以比較穩妥的說法是：種田對健康和生活的影響，可能因地方、時期和群體而不同，「農業讓人過得更糟」可以當成一個要檢驗的說法，不宜當成每個地方都一樣的定論。
    hints:
      - 先看「健康線索」那一列，兩張卡的方向一樣嗎？
      - 東亞那一格最後一句提醒了什麼？
      - 一個遺址的證據，能不能代表一整個地區？
  - type: card
    id: building-gobekli-tepe
    depth: deep
    prompt: 一群還沒開始種田的獵人，竟然搬動了好幾公尺高的石柱。注意它的年代、石柱上刻了什麼，再讀「史家怎麼吵」：它是神廟，還是住家？先有神廟，還是先有農業？
  - type: decision
    role: 你是 1995 年開始挖掘哥貝克力丘的考古學家
    situation: |
      你在土耳其東南部的山丘下，挖出一圈圈圓形石牆，牆裡立著 T 字形的石灰岩柱，最高約 5.5 公尺，上面刻著狐狸、野豬、蛇、禿鷲等野生動物。年代約 1.15 萬到 1 萬年前，蓋它的人還是狩獵採集者。
      現在記者來問：「這到底是什麼地方？」先想一想你會怎麼回答，再看選項。
    options:
      - label: 這是各地獵人聚會、舉行儀式的地方
        result: 這是主持發掘的施密特實際提出的解釋：他認為這裡是游動的狩獵採集者聚集、蓋建築與辦宴會的儀式中心，媒體因此稱它「世界最早的神廟」。
      - label: 這也可能是人們居住的大型共居屋
        result: 這是多倫多大學的 Banning 在 2011 年提出的看法：他指出遺址有打製石器、準備食物等日常活動的痕跡，認為「沒有理由事先假定」這些建築不是住家，同時也可能舉行宴會、葬禮等儀式。
      - label: 才挖了一小部分，先不下結論
        result: 評估（依卡片推論，不是史實）：這樣回答比較保守，但也符合後來的情況：到 2021 年遺址約只發掘了 10%，後來的發現（住屋、儲水槽）確實改變了解釋。不過在新發現出現之前，「世界最早的神廟」這個說法已經被媒體採用。
    actual: 施密特把它解讀為儀式中心，「世界最早的神廟」的說法流傳開來；哈拉瑞在書中也採用「神廟」的說法，推論是狩獵採集者先開始蓋神廟，為了完成它才需要農業。但後來的研究找到住屋和至少 150 立方公尺的雨水儲水槽，德國考古研究院的 Clare 表示，新研究正在修正「世界最早神廟」的舊解釋。至今沒有任何用途被確認。
    ref: building-gobekli-tepe#D1
    note: 這一題問的是「怎麼解讀證據」。前兩個選項都是學者實際提出的看法，第三個選項的「評估」是依卡片內容所作的推論，不是史實。
  - type: card
    id: tech-cuneiform
    depth: deep
    prompt: 種田幾千年後，兩河流域出現了大城和文字。注意：最早的泥板大多在記什麼？誰需要記這些東西？
  - type: source
    card: tech-cuneiform
    idx: 0
    question: 蘇美史詩〈恩美卡與阿拉塔之主〉說：「庫拉巴之主拍平泥土，把信寫在上面。」這句話能不能當成「文字最早是用來寫信的」證據？
    options:
      - 能，史詩清楚記下了文字發明的過程
      - 不能，這是史詩裡的傳說情節，是後人對文字由來的想像；考古上最早的泥板大多是神廟的帳目
      - 能，因為史詩比泥板更早
      - 不能，因為蘇美人根本沒有文字
    answer: 1
    explain: 「庫拉巴之主在泥上寫信」是史詩的情節，不能當成真實的發明紀錄。考古出土的最早泥板（約前 3300 年的烏魯克）大多是糧食、牲畜和人力的帳目。這也是讀史料的基本功：一份文獻在「說什麼」，和它能「證明什麼」，要分開看。
    hints:
      - 先看這句話出自哪一種文獻：帳本、法律，還是史詩？
      - 回去看卡片的「常見誤解」：這個情節被怎麼看待？
      - 考古挖到的最早泥板，上面記的是什麼？
    ref: tech-cuneiform#T1
  - type: card
    id: finance-mesopotamia-credit
    depth: deep
    prompt: 有了文字，借大麥、借白銀的約定也寫進泥板了。注意：歉收還不起時，法典怎麼規定？也讀「史家怎麼吵」：法典的條文，等於當時每個人都照做嗎？
  - type: chain
    prompt: 從開始種田到出現記帳和債務規則，依先後排成一條鏈（最上面是最早的）。
    items:
      - 最後一次冰期結束，氣候變得較溫暖穩定（約 1.17 萬年前）
      - 西亞的人開始管理日後的馴化動植物（至少約 1.15 萬年前）
      - 小麥、大麥、豆類等奠基作物成為主食（約 1.07–0.97 萬年前）
      - 烏魯克成為大城，神廟要收支大量的糧食、魚和牲畜（前 4 千紀後半）
      - 最早的文字泥板出現，大多是帳目（約前 3300 年）
      - 《漢摩拉比法典》規定債務奴役三年就要放人、歉收可免當年利息（約前 1753 年前後）
    explain: 氣候穩定後，人們先長期照顧野生動植物，過了上千年，作物才成為主食。再過好幾千年，兩河流域出現了大城，神廟要管理大量物資，光靠記憶不夠，於是出現了記帳的泥板；後來借貸約定也寫進泥板，法典再訂出「還不起怎麼辦」的規則。要注意：這條鏈是依年代排的，卡片並沒有直接說「種田一定會帶來城市和文字」；從種田到出現文字，中間隔了好幾千年。
    hints:
      - 最早的一步是環境的變化，不是人的發明。
      - 先「管理」動植物，還是先「成為主食」？
      - 文字最早用來記什麼？法典比最早的泥板早還是晚？
    ref: tech-cuneiform#T1
  - type: today
    card: event-fertile-crescent-agriculture
    question: 有人說：「農業就像智慧型手機，一開始只是多一點方便，後來大家都離不開，也沒人記得當初是誰決定要用的。」這個類比哪裡不成立？
    model_answer: 先說不能類比的地方：智慧型手機是有人有計畫地研發、推出的產品；史前的馴化花了上千年，靠的是一代代無意識或半有意識的選擇，不是實驗室裡有計畫的育種。而且當時沒有國家、市場或文字，「誰決定開始種田」這種問題，根本不能用今天的企業或政策決定來理解。可以借來思考的結構是：一項新做法剛開始時看起來只多一點點好處，等大家都依賴它、人口也增加之後，就很難再回頭。這只是看結構，不是預測。
  - type: check
    items:
      - kind: choice
        q: 哪一項證據最能支持哈拉瑞「農業讓多數人過得更辛苦」的說法？
        options:
          - 哥貝克力的石柱上刻著狐狸、野豬和蛇
          - 改吃穀物之後，人的平均身高下降，傳染病、蛀牙和貧血也變多
          - 賈湖的墓葬顯示壽命增加、兒童死亡率下降
          - 最早的泥板大多是帳目
        answer: 1
        explain: 肥沃月彎卡整理的健康證據，和哈拉瑞的說法方向一致；卡片還說，歐洲人的平均身高要到 20 世紀才恢復。賈湖的證據方向相反，是需要一起考慮的反例。
        hints:
          - 題目問的是「過得辛苦」，要找和健康、身體有關的證據。
          - 哪一個選項的方向，反而和哈拉瑞的說法相反？
        ref: event-fertile-crescent-agriculture#C5
      - kind: choice
        q: 有人看到賈湖的墓葬顯示壽命增加，就說「哈拉瑞錯了，種田讓人過得更好」。這個推論哪裡要小心？
        options:
          - 賈湖根本沒有種田
          - 這只是一個遺址的情形，不能代表所有早期農民；不同地方的證據可能方向不同
          - 墓葬不能當作證據
          - 賈湖比肥沃月彎早了好幾萬年
        answer: 1
        explain: 東亞農業卡在「受益者與受損者」裡特別提醒，賈湖的證據只是一個遺址的情形。用一個反例可以提醒我們「不一定都一樣」，但不能直接推翻或證明一個關於全人類的大說法。
        hints:
          - 回去看東亞農業卡的「受益者與受損者」，最後一句寫了什麼？
          - 一個村子的情形，能不能代表全世界的農民？
        ref: event-east-asia-agriculture#C5
      - kind: order
        q: 依時間先後排列：
        items:
          - 歐哈洛二號有人採收野生大麥（約 2.3 萬年前）
          - 磁山最早只裝黍的窖穴（約 1.03 萬年前）
          - 賈湖的村民同時種稻與粟（約前 7000 年起）
          - 河姆渡人住在架高的長屋裡種稻（約前 5500 年起）
          - 烏魯克出現最早的文字泥板（約前 3300 年）
        explain: 採收野生穀物比開始種田早很多；約 1.03 萬年前約等於前 8300 年，所以磁山比賈湖早，賈湖又比河姆渡早，最後才是烏魯克的泥板。
        hints:
          - 「約 2.3 萬年前」是採收野生的，還沒開始種。
          - 約 1.03 萬年前大約是西元前多少年？（距今年數減去約 2000）
          - 文字泥板是這裡面最晚的。
        ref: event-east-asia-agriculture#C2
      - kind: short
        q: 哈拉瑞用哥貝克力石陣推論「先有神廟，才有農業」。用一兩句話說明：後來的發現讓這個說法變強還是變弱？
        model: 變弱，至少變得不確定。後來找到住屋和雨水儲水槽，「只是神廟、沒人住」的舊解釋已被修正；遺址雖然有超過 7,000 件磨石，但還不確定處理的是野生還是栽培的穀物，所以「為了蓋神廟才開始種田」目前缺少直接證據。
        explain: 哈拉瑞採用的是施密特當時「神廟」的解釋；遺址到 2021 年約只發掘了 10%，很多結論還會再變。
        hints:
          - 「先有神廟才有農業」需要兩個條件：它是神廟，而且附近有栽培穀物的證據。
          - 回去看哥貝克力卡的「史家怎麼吵」：這兩個條件，新的研究各怎麼說？
        ref: building-gobekli-tepe#D6
  - type: recap
    model_answer: |
      回到一開始的問題：種田讓人過得更好了嗎？卡片能確定的是：農業不是某一天被發明的。在西亞，人們先長期照顧野生的大麥、小麥和山羊，至少過了一千年，作物外形才改變；在東亞，人們各自馴化了稻和小米，稻子花了好幾千年才完全馴化。再過好幾千年，兩河流域出現了大城、記帳的泥板，以及處理債務的法律。
      哈拉瑞認為農業是「史上最大的騙局」：人口變多，多數人卻更辛苦。卡片上有支持他的證據，例如改吃穀物後平均身高下降、傳染病和貧血變多；也有需要保留的地方，例如賈湖的墓葬顯示壽命增加，雖然只是一個遺址。他用哥貝克力石陣推論「先有神廟才有農業」，但新的發現找到了住屋和儲水槽，也還沒有直接的栽培證據。
      比較穩妥的答案是：種田讓同一塊地能養活更多人，但對個人過得好不好，各地、各時期的證據不一樣。哈拉瑞的說法是一個好問題，但要用一個遺址、一個地區的證據去回答全人類，還不夠。
reflect: 哈拉瑞認為，人類一開始只是想多一點穩定的糧食，結果卻被農業「綁住」，再也回不去。你的生活裡，有沒有一個一開始覺得「多一點方便」、後來卻離不開的習慣或工具？如果現在要你暫停它一週，你會失去什麼、得到什麼？

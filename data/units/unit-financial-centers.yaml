  date: 2026-10-31
  by: 拆分自已通過獨立查核的單元；拆分時新寫的部分另經獨立查核，並依建議修正
  result: 通過
  notes: 上半原有步驟（香檳、布魯日、安特衛普、熱那亞、聖喬治之家）與 3 題選擇題沿用已查核的內容；導入結尾、排序題（含 1585 年投降）與總結為拆分時新寫。

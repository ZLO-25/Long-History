legacy:
  title: 今日影子
  items:
    - then: 雅典人在陶片上刻下太有權勢的人的名字，投票把他送出城十年。
      now: 英文 ostracize（排擠、孤立）就是從希臘文「用陶片投票放逐」來的，今天用來說把某個人排除在小圈圈之外。
      tag: 制度
      card: event-cleisthenes-reform
      src: [L1, L2]
    - then: 希臘人向腓尼基人學了字母，加上母音；前兩個字母叫 alpha 和 beta。
      now: 英文 alphabet（字母表）這個字，就是 alpha 加 beta。
      tag: 語言文字
      card: event-greek-polis-colonization
      src: [L3]
  sources:
    - { id: L1, title: "Etymonline：ostracism", url: "https://www.etymonline.com/word/ostracism", accessed: 2026-11-12, tier: 通論 }
    - { id: L2, title: "Etymonline：ostracize", url: "https://www.etymonline.com/word/ostracize", accessed: 2026-11-12, tier: 通論 }
    - { id: L3, title: "Etymonline：alphabet", url: "https://www.etymonline.com/word/alphabet", accessed: 2026-11-12, tier: 通論 }

id: unit-cold-war-1
title: 冷戰（上）：鐵幕落下、柏林與古巴
histories: [歐洲史, 美國史]
mystery: 二戰時，美國和蘇聯是一起作戰的盟友；戰爭一結束，兩邊卻成了對手。接下來幾十年，他們造出能把對方毀滅好幾次的核彈，卻一直避免在戰場上直接交手。柏林先被封鎖、再被一道牆切開；到了 1962 年 10 月，兩邊又在古巴走到核戰邊緣。這場「戰爭」為什麼一直是冷的？
teaser: 一道從波羅的海落到亞得里亞海的鐵幕、一座靠飛機餵了將近一年的城市、一個清晨冒出來的鐵絲網，還有十三天。
goals:
  - 能說明杜魯門主義、馬歇爾計畫和北約，怎麼組成美國「援助加聯盟」的圍堵做法
  - 能說出柏林封鎖與柏林圍牆的起因和結果，並解釋東德為什麼要築牆
  - 能說出 1962 年甘迺迪面對古巴飛彈時有哪些選項、他選了哪一個，以及危機最後怎麼收場
  - 能判讀古巴危機中赫魯雪夫一封來信的一段原文，說出他想傳達什麼
  - 能比較柏林封鎖和古巴飛彈危機：兩次危機怎麼都沒有變成熱戰
  - 能分辨冷戰時的防空演習、忠誠審查和今天的演練哪裡可以比、哪裡不能比
minutes: 50
steps:
  - type: hook
    text: |
      1946 年 3 月，英國的邱吉爾在美國密蘇里州的一所學院演講，說歐洲「一道鐵幕已經落下」。幾年後，美國學生開始練習看到閃光就躲到桌子底下、遮住頭和脖子；而在臺灣，從 1978 年起，每年「萬安演習」的警報一響，街上的人車就要淨空。
      躲桌子、拉警報，防的都是一場「還沒發生」的戰爭。美國和蘇聯對峙了四十多年，為什麼兩邊一直準備打仗，卻又一直避免直接開打？
      這一課我們從二戰剛結束的歐洲走起，經過一座被切成兩半的城市，最後走進 1962 年 10 月的白宮，替甘迺迪做一次決定。
    guess:
      q: 美國和蘇聯都造出能毀滅對方好幾次的核彈，卻四十多年沒有直接開戰。你猜最主要的原因是什麼？
      options:
        - 雙方都有挨打之後還能反擊的武器，誰先動手，自己也會被毀滅
        - 雙方早就簽了條約，保證永遠不會對彼此使用任何武器
        - 聯合國派出軍隊駐守在兩國之間，只要一開火就會出面阻止
        - 蘇聯的軍力比美國弱很多，所以從來不敢真的和美國對抗
      reveal: 卡片說，雙方後來都有挨打之後還能反擊的潛艦與飛彈，形成「相互保證毀滅」：任何一方先動手，都會招來毀滅性的報復。不過古巴危機那幾天，也靠了留台階、秘密交換，還有不少運氣。
  - type: card
    id: person-truman
    depth: understand
    prompt: 先認識美國這邊的第一位冷戰總統。注意：他是怎麼突然當上總統的？1947 年他向國會要錢援助哪兩個國家？他怎麼把一筆援助預算，講成一場「自由民族」的選擇？
    focus: [P3]
    quick:
      - q: 1947 年杜魯門為什麼要向國會要錢，援助希臘和土耳其？他是怎麼說服國會的？
        a: 英國表示 3 月 31 日以後無法再援助希臘，美國要決定接不接手。他選擇向國會要錢，並把理由講成一場「自由民族」對抗外來壓力的選擇。
      - q: 杜魯門是經過選舉才第一次當上總統的嗎？
        a: 不是。他 1945 年 1 月才當上副總統，4 月 12 日羅斯福去世，他以副總統身分突然接任總統。
  - type: card
    id: person-stalin
    depth: understand
    prompt: 再看另一邊。史達林靠什麼職位掌握全黨？在波茨坦，杜魯門暗示美國有新武器時，史達林其實早就知道什麼？1946 年他公開說戰爭是什麼的「必然結果」？
    focus: [P2, P3]
    quick:
      - q: 史達林是靠什麼職位掌握全黨的？為什麼這個職位這麼有用？
        a: 1922 年列寧提名他當總書記。這是一個管人事的位置，讓他能把自己人安插到各處，慢慢掌握全黨。
      - q: 1946 年史達林公開說戰爭是資本主義的「必然結果」，這等於告訴蘇聯人民什麼？
        a: 等於告訴國民：和資本主義國家的對立不會結束。這場演說也把美蘇的制度差異擺上了檯面。
  - type: card
    id: event-containment-nato
    depth: understand
    prompt: 美國怎麼回應？依序找出長電報、杜魯門主義、北約第五條。注意：第五條真的等於「一國被打，大家自動參戰」嗎？「冷戰是誰開始的」，史家有哪幾派看法？
    focus: [C4, debate]
    quick:
      - q: 「援助加聯盟」是什麼意思？
        a: 一方面用援助幫盟友：杜魯門主義援助希臘、土耳其，馬歇爾計畫援助西歐。另一方面用北約簽下和平時期的軍事同盟，把美國的安全承諾帶進歐洲。
      - q: 關於「冷戰是誰開始的」，史家有哪幾派看法？
        a: 傳統派認為責任在蘇聯的擴張，美國是回應；修正派強調美國也有自己的經濟與戰略利益；後修正派想綜合兩者，並用更多檔案。
  - type: check
    items:
      - kind: choice
        q: 《北大西洋公約》第五條規定了什麼？
        options:
          - 只要一個成員被攻擊，所有成員就必須自動出兵參戰，沒有商量的餘地
          - 攻擊一個成員視同攻擊全體，各國自行決定採取它認為必要的行動
          - 各成員要把自己的軍隊交給美國統一指揮，由美國決定要不要出兵
          - 只有美國本土被攻擊時才適用，歐洲成員被攻擊時，美國可以不管
        answer: 1
        explain: 第五條說攻擊一國視同攻擊全體，但各國採取「它認為必要的行動，包括使用武力」，仍要依自己的憲法程序，所以不是「自動參戰」。
        hints:
          - 卡片的「常見誤解」特別提醒過第五條不是什麼。
          - 注意「它認為必要的行動」這幾個字：由誰決定？
        why_wrong:
          - 條文寫的是各成員採取「它認為必要的行動」，由各國自行判斷，不是自動參戰。
          - null
          - 第五條沒有把軍隊交給美國指揮；各國自行判斷，並依自己的憲法程序行動。
          - 條文寫的是在歐洲或北美的武裝攻擊，都視為對全體的攻擊，歐洲成員被攻擊時也適用。
        ref: event-containment-nato#C4
  - type: card
    id: event-marshall-plan
    depth: understand
    prompt: 除了結盟，美國還出錢。歐洲為什麼需要美元？馬歇爾說他的政策「不是針對任何國家」，那為什麼蘇聯和東歐最後沒有參加？這筆錢真的是歐洲復興的關鍵嗎？
    focus: [C1, debate]
    quick:
      - q: 二戰後的歐洲，為什麼特別需要美元？
        a: 歐洲生產受損、貿易中斷，各國想向美國買糧食、燃料和機器，卻沒有足夠的外匯（美元）。
      - q: 有學者質疑馬歇爾計畫的功勞被誇大了，理由是什麼？
        a: 因為西歐在計畫開始以前，經濟就已經在復甦。另一種看法則說，計畫成功的關鍵不只是錢，還促使各國採取穩定財政、市場導向的政策。
  - type: card
    id: event-berlin-blockade-1948
    depth: understand
    prompt: 冷戰第一場大危機。注意：封鎖的導火線為什麼是「一種新的錢」？西方用什麼方法撐住西柏林，而不是開戰？封鎖結束後，德國變成什麼樣子？
    focus: [C1, C4]
    quick:
      - q: 為什麼一種「新的錢」會引發封鎖？
        a: 美英沒有事先告訴蘇聯，就在西占領區和西柏林發行新的德國馬克，想掌握這座城市的經濟控制權、讓馬歇爾計畫的援助能運作。蘇聯隨即封鎖西柏林回應。
      - q: 西方怎麼撐住西柏林？封鎖結束後，德國變成什麼樣子？
        a: 西方選擇用飛機空運，而不是用武力衝破封鎖，所以沒有開戰。封鎖結束兩週後西德建國，東德隨後成立，德國一分為二。
  - type: card
    id: social-cold-war-daily-life
    depth: understand
    prompt: 大人物在對峙，一般人過什麼日子？比一比美國的教室和職場、東德的鄰居，以及臺灣的街頭。注意：躲在桌子底下主要是為了防什麼？東德的線民數字為什麼差這麼多？
    focus: [E2, E6]
    quick:
      - q: 「外面的威脅」怎麼影響美國和東德的一般人？
        a: 美國從 1947 年起審查公務員的「忠誠」，麥卡錫的紅色恐慌讓估計 1 萬多人丟了工作。東德的秘密警察史塔西滲透到生活各處，約每 63 人就有一人與它合作。
      - q: 東德的線民數字，為什麼從 17 萬到 200 萬差這麼多？
        a: 差別在於怎麼算：「偶爾說過一次話的人」算不算線民。登記在冊的線民約 17 萬 3 千，放寬標準，估計就會多出好幾倍。
  - type: card
    id: event-hungary-1956-prague-1968
    depth: understand
    prompt: 在蘇聯陣營裡，小國能改到什麼程度？注意：匈牙利 1956 年 11 月 1 日宣布了什麼，三天後發生什麼事？美國為什麼沒有出兵幫忙？
    focus: [C2, C4]
    quick:
      - q: 匈牙利 1956 年 11 月 1 日宣布了什麼？三天後蘇聯怎麼回應？
        a: 納吉政府宣布退出華沙公約、保持中立。11 月 4 日，蘇軍發動「旋風行動」攻入布達佩斯，起義被鎮壓。
      - q: 1956 年的匈牙利和 1968 年的捷克斯洛伐克，被鎮壓之後劃出了什麼界線？
        a: 東歐國家不能退出蘇聯陣營，改革也不能威脅共產黨的統治。
  - type: card
    id: event-berlin-wall-1961
    depth: understand
    prompt: 柏林第二次成為前線。1961 年以前有多少東德人逃往西方？東德領導人 6 月怎麼說，8 月 13 日又做了什麼？這道牆主要是擋外面的人進來，還是擋自己的人出去？（卡片後半寫到 1989 年，下一課會再回來。）
    focus: [C1, C4]
    quick:
      - q: 東德領導人 6 月說「沒有人打算建一道牆」，兩個月後發生了什麼事？
        a: 8 月 13 日清晨，東德開始用鐵絲網封住邊界。公開說的話和後來做的事不一樣，讀官方說法時要小心。
      - q: 這道牆主要是擋外面的人進來，還是擋自己的人出去？怎麼看得出來？
        a: 擋自己的人出去。築牆前約有 350 萬東德人逃往西方，圍牆讓東德人民幾乎無法自由前往西方，政府還下達了開槍命令。
  - type: chain
    prompt: 把柏林這條線依照「因 → 果」排成一條鏈（最上面是最早的原因）。
    items:
      - 二戰後德國和柏林由戰勝國分區占領，西柏林位在蘇聯占領區裡面
      - 美國提出馬歇爾計畫，蘇聯退出巴黎會議，東西歐開始分成兩塊
      - 美英在西占領區和西柏林發行新的德國馬克，蘇聯隨即封鎖西柏林
      - 西方用飛機空運撐住西柏林，封鎖期間簽下《北大西洋公約》
      - 封鎖結束後東西德分別建國，西柏林成了東德人出走的缺口
      - 東德用鐵絲網封住邊界，築起柏林圍牆
    followup:
      question: 第四項有兩件事：西方用空運撐住西柏林，封鎖期間簽下《北大西洋公約》。依卡片，這兩件事是什麼關係？
      options:
        - 兩件都是西方對封鎖的回應，卡片沒有說是空運造成了北約
        - 北約是為了替空運出錢、出飛機，才由十二個國家特地簽下的
        - 要先簽下北約，西方才有辦法開始空運物資到西柏林去
        - 蘇聯是因為北約簽成了，才決定要封鎖西柏林來報復的
      answer: 0
      explain: 空運從 1948 年 6 月開始，《北大西洋公約》1949 年 4 月才簽，是在封鎖還在進行時簽的。卡片說，封鎖讓西歐更需要美國的安全承諾，促成了北約；空運則是用來撐住西柏林。兩件事都是在回應封鎖。卡片裡沒有證據顯示是空運造成了北約，所以這兩件事是並行的。
      why_wrong:
        - null
        - 卡片沒有說北約是為了空運而簽的；北約是用條約把美國的安全承諾帶進歐洲。
        - 順序顛倒了：空運 1948 年 6 月就開始，北約 1949 年 4 月才簽。
        - 順序顛倒了：封鎖在 1948 年 6 月，比 1949 年 4 月簽北約早得多。
    explain: 分區占領讓西柏林成為蘇聯占領區裡的一座「孤島」。馬歇爾計畫把東西歐分開；美英為了讓援助能運作，在西占領區發行新馬克，蘇聯就以封鎖西柏林回應。西方選擇空運而不是開戰，同時用北約把美國的安全承諾帶進歐洲。封鎖沒有逼走西方，德國卻正式一分為二；約 350 萬東德人陸續逃往西方，很多人經過西柏林，東德最後用一道牆把這個缺口關起來。
    hints:
      - 最早的原因是二戰後的占領安排。
      - 新馬克和馬歇爾計畫有關，所以馬歇爾計畫在封鎖之前。
      - 圍牆是要擋住「出走」，所以要先有兩個德國、先有人出走。
    ref: event-berlin-blockade-1948#C7
  - type: decision
    role: 你是 1962 年 10 月甘迺迪總統身邊的一位國家安全顧問
    situation: |
      1962 年 10 月 14 日，美國的 U-2 偵察機在古巴拍到正在興建的中程與中長程彈道飛彈基地，照片隔天送到白宮。
      你知道的背景是：1961 年 4 月，中央情報局訓練的古巴流亡者在豬玀灣登陸，兩天內就失敗；6 月甘迺迪在維也納和赫魯雪夫見面，對方覺得這位年輕總統軟弱。同一年，美國也在義大利和土耳其部署了射程可達莫斯科的朱比特飛彈。9 月 4 日，甘迺迪才公開警告：不准把攻擊性武器運進古巴。
      現在總統要你們提建議。會議裡超過三分之一的人主張不預警空襲。另一個辦法是派軍艦攔查開往古巴的船，但在國際法上，「封鎖」等於戰爭行為。
      先別急著看選項：如果你是這位顧問，只知道這些，你會建議總統怎麼做？
    options:
      - label: 不預警空襲，直接炸掉飛彈基地
        result: 推測：基地也許能被炸毀一部分，但當時美國並不知道，蘇聯已經把 162 枚核彈頭運進古巴（這是後來才知道的），一次空襲未必清得乾淨；炸死蘇聯人員也可能讓雙方直接交戰。歷史沒有走這條路，所以後果只能推測。
      - label: 用軍艦攔查開往古巴的船，但不叫它「封鎖」
        result: 這是甘迺迪最後的選擇。10 月 22 日他上電視宣布海上「隔離」，攔查運往古巴的武器，並寫信要赫魯雪夫撤走飛彈；刻意用「隔離」而不是「封鎖」，因為它不假定雙方已經在打仗。接下來的幾天非常危險，結果等一下的古巴卡會告訴你。
      - label: 派大軍全面入侵古巴
        result: 推測：規模比空襲更大，美軍會直接面對古巴軍隊，以及美國當時還不知道的核彈頭；豬玀灣才失敗一年多，入侵也可能拖成一場長期戰爭。歷史沒有走這條路，所以後果只能推測。
      - label: 先不理會，只在外交上抗議
        result: 推測：甘迺迪 9 月才公開警告過，不理會等於讓自己的警告失效；赫魯雪夫本來就覺得他優柔寡斷，可能更敢加碼。也可能雙方慢慢談出別的條件。歷史沒有走這條路，所以後果只能推測。

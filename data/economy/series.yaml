# 經濟曲線資料：只放有來源的點，不補線、不內插。
# 欄位：start/end（年，前為負；單一年份可只寫 start）、value 或 low/high（範圍）、kind（估計｜登記｜實測）、verification、src、note
# metric：population（人）｜gdp_pc（人均 GDP，2011 年國際元）｜silver（銀幣含銀率 %）｜real_wage（一天工資買得到幾籃生活必需品）
#         eng_wage（英格蘭名目日薪，便士）｜uk_cpi（英國物價指數）｜uk_real（英國實質工資指數）
# 名目（錢的面額）與實質（買得到多少東西）一定分開放，不畫在同一條軸上。
# 第 6 期延伸的 1000–2022 年資料由 3 份下載檔產生：每十年取「最低到最高」，不平均、不內插。

# 深入專題：冷戰。怎麼新增一個專題見 docs/dives.md；陣營圖的切線與來源見 docs/dive-cold-war.md
id: dive-cold-war
title: 冷戰：沒有正面開打的四十年
question: 1945 年一起打敗德國和日本的美國與蘇聯，為什麼不到幾年就變成敵人？兩個都握有核子武器的超級強權，四十多年沒有直接開戰，卻在柏林、古巴、朝鮮、越南、阿富汗一次次逼近邊緣。最後為什麼是蘇聯先撐不下去？
blurb: 這個專題把 1945 年到 1991 年放大來看：歐洲怎麼被一道「鐵幕」切成兩半，柏林怎麼變成冷戰的前線，古巴飛彈危機怎麼讓世界離核戰只差一步，太空與核武競賽怎麼變成另一種戰場，以及戈巴契夫的改革怎麼讓整個東歐陣營在兩年內崩解。六位領導人都放上「從另一邊看他」；臺灣在這四十年裡的位置，也在卡片裡。
# 1945 年第二次世界大戰結束；1991 年 12 月蘇聯解體

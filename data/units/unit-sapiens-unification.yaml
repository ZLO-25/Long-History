id: unit-sapiens-unification
title: 人類的統一：互不認識的人，靠什麼願意合作？
histories: [世界通史, 錢的歷史, 中國史, 希臘羅馬史]
mystery: 你會把錢付給一個從沒見過面的網路賣家，也會遵守一個你從沒見過的總統或部長訂的法律。幾千年前的人，也要和越來越多互不認識的人一起生活。哈拉瑞認為，讓人類慢慢連成一個世界的，是金錢、帝國和普世宗教三種力量。卡片上的證據，支持這個說法到哪裡？
teaser: 一塊寫著「第四年就要放自由」的石碑、一枚印著獅頭的金屬塊、一道讓所有自由人變成「羅馬人」的命令、一部把不同意的人叫做「異端」的法律：它們把人連在一起，也把人分開。
goals:
  - 能說出哈拉瑞「金錢、帝國、宗教統一人類」的說法，並用卡片各舉一個支持和一個需要保留的例子
  - 能判讀一段古代作者的說法（狄奧談卡拉卡拉敕令），分辨「他說了什麼」和「這能證明什麼」
  - 能比較秦統一與卡拉卡拉敕令，說出兩個帝國怎麼把不同的人變成「同一國的人」，以及統一後還留下哪些不平等
  - 能依先後排出基督教從被迫害到成為羅馬官方信仰的過程
  - 能指出「一神教比多神教更不寬容」這個說法，卡片能支持哪些、不能支持哪些
minutes: 45
steps:
  - type: hook
    text: |
      你在網路上跟一個從沒見過的人買二手球鞋，先把錢轉過去，對方再寄貨。你們不認識，也不會再見面，為什麼你敢先付錢？
      哈拉瑞在《人類大歷史》裡認為，大約從西元前 1000 年起，有三種力量讓原本互不相識的人越來越能合作：金錢、帝國和普世宗教。他認為金錢的價值建立在大家的信任上，帝國把多種文化放在同一個統治之下，普世宗教則能團結比地方信仰更多的人。
      這個單元要拿證據卡檢查這三個說法。談到錢的部分也要記得：我們看到的多半是碰巧留下來的資料（倖存者偏差），事後看起來很清楚的事，當時的人不一定清楚（後見之明）。本單元只是歷史學習，不構成投資建議。
  - type: card
    id: finance-mesopotamia-credit
    depth: deep
    prompt: 先看「錢」還沒變成硬幣以前，人們怎麼借貸。注意：泥板上記了什麼、那時候白銀怎麼付款、還不起時法典怎麼規定；也讀「史家怎麼吵」：法典的條文，等於當時每個人都照做嗎？
  - type: card
    id: finance-lydian-coinage
    depth: deep
    prompt: 再看最早的硬幣之一。注意：硬幣上的印記是用來保證什麼？最早的琥珀金幣，這個保證可靠嗎？
  - type: card
    id: event-qin-unification
    depth: deep
    prompt: 換到帝國。注意秦統一六國用了哪些手段，統一後又把哪些東西「統一」了；也讀「雙軌解讀」：哈拉瑞怎麼看秦始皇的帝國？
  - type: card
    id: event-constitutio-antoniniana
    depth: deep
    prompt: 羅馬帝國用另一種方式把人變成「一家」。注意 212 年的敕令給了誰什麼身分，也讀「史家怎麼吵」：卡拉卡拉為什麼這樣做？
  - type: source
    card: event-constitutio-antoniniana
    idx: 0
    question: 和卡拉卡拉同時代的元老狄奧寫道：皇帝「名義上是給他們榮耀，真正目的是藉此增加收入」。怎麼讀這句話最穩妥？
    options:
      - 這證明卡拉卡拉唯一的動機就是增加稅收
      - 這是同時代人的說法，值得重視；但狄奧本人很不喜歡這道命令，現代學者指出他的增稅說法有不少問題，動機至今仍有增稅、宣傳、擴大兵源等說法並列
      - 這證明敕令讓帝國裡所有人都平等了
      - 這句話就是敕令的原文
    answer: 1
    explain: 狄奧說，非公民不必繳大部分的稅，而卡拉卡拉還把奴隸解放稅、遺產稅從 5% 提高到 10%。但研究狄奧的學者 Rantala 指出，狄奧本人對這道命令很不以為然，他的增稅說法已受到現代研究挑戰；《世界歷史百科》認為增稅和宣傳都是動機，也有人認為皇帝想擴大可以當軍團兵的人數。敕令原文只剩一張莎草紙殘片，狄奧的話是他的評論，不是原文。
    hints:
      - 先看是誰寫的：他對這道命令是什麼態度？
      - 一個不喜歡某件事的人寫下的「真正目的」，可以直接當成事實嗎？
      - 回去看卡片的「史家怎麼吵」：動機有幾種說法？
    ref: event-constitutio-antoniniana#C5
  - type: compare
    cards: [event-qin-unification, event-constitutio-antoniniana]
    prompt: 兩個帝國，用兩種方式把不同的人變成「同一國的人」。比一比。
    rows:
      - aspect: 什麼時候、用什麼方式
        a: 前 230 年起出兵，十年間依序滅掉韓、趙、魏、楚、燕、齊，前 221 年統一；也派人收買他國大臣
        b: 212 年卡拉卡拉頒布一道敕令
      - aspect: 統一了什麼
        a: 廢除分封，全國初分 36 郡（後增至 40），由中央派官治理；統一度量衡、車軸寬度、貨幣（半兩錢）和文字（小篆）
        b: 帝國境內所有自由男性成為羅馬公民，自由女性也得到和羅馬女性相同的權利
      - aspect: 統一後還有的區分
        a: 六國王室與貴族、戰爭中的士兵和平民是受損者；前 213 年起下令焚書
        b: 「降服者」被排除（確切意思有爭議）；之後又出現「上等人」和「下等人」的不同待遇；地方原有的法律仍繼續使用
      - aspect: 後來怎樣
        a: 秦朝前 206 年滅亡，只維持了十五年；但秦的制度成為後來各朝的基礎，魯惟一認為它開啟了一個到 1911 年才結束的時代
        b: 瑪麗．畢爾德形容 212 年之後的羅馬是「沿用舊名的新國家」；卡爾德利斯認為帝國從此變成一個「世界」，也為後來強制的宗教統一鋪路
    question: 哈拉瑞認為，帝國常靠戰爭和暴力建立，卻也留下共同的語言、文化等長遠影響，讓不同的人慢慢融在一起。這兩張卡支持這個說法嗎？有什麼要補充的？
    model_answer: 大致支持，但要補充兩件事。支持的地方：秦用統一的文字、度量衡和郡縣，讓原本分屬六國的人生活在同一套標準下，王朝雖然很短，制度卻延續下來；羅馬的敕令讓「羅馬人」從少數人的身分，變成全帝國自由人的共同身分。要補充的第一件事是代價：秦統一靠的是十年戰爭，六國王室、士兵和平民都付出代價，統一後還有焚書。第二件事是「統一」不等於「平等」：羅馬有了共同的公民身分，馬上又分出上等人和下等人，地方法也還在用；而且卡拉卡拉的動機至今仍有爭議，不一定是為了融合。所以比較穩妥的說法是：帝國確實能把不同的人放進同一套制度，但它同時也在製造新的區分。
    hints:
      - 先看「統一了什麼」那一列：兩個帝國各讓人共用了什麼？
      - 再看「統一後還有的區分」：統一以後，大家就平等了嗎？
      - 秦用了什麼手段統一？這個代價要不要算進去？
  - type: card
    id: event-christian-empire
    depth: deep
    prompt: 第三種力量是宗教。注意基督教從被迫害到成為官方信仰，中間經過哪幾步；也讀「史家怎麼吵」：君士坦丁真的信了嗎？國教從哪一刻開始？
  - type: chain
    prompt: 把基督教從被迫害到成為羅馬官方信仰的過程，依先後排成一條鏈（最上面是最早的）。
    items:
      - 3 世紀末戴克里先時期，帝國大規模迫害基督徒
      - 311 年伽列里烏斯頒布寬容敕令，結束迫害
      - 313 年君士坦丁頒布米蘭敕令，基督徒和其他人都可以公開敬拜
      - 325 年尼西亞會議確立「同質論」，君士坦丁支持尼西亞信經
      - 380 年狄奧多西一世等人頒布帖撒羅尼迦敕令，把尼西亞派定為官方信仰
      - 391 年狄奧多西關閉異教神廟、正式禁止異教敬拜
    explain: 先是迫害，再是停止迫害；313 年的米蘭敕令是讓各種信仰都能公開敬拜，還不是國教。君士坦丁支持教會、召開尼西亞會議，但依法律來看，要到 380 年的帖撒羅尼迦敕令，才第一次在法律裡定義正統信仰；391 年更關閉了異教神廟。帝國在不到一百年內，從迫害基督徒轉為以基督教壓制其他信仰與異端。
    hints:
      - 最早的一步是「迫害」，接著是誰下令停止迫害？
      - 米蘭敕令是讓「基督教成為唯一」，還是讓「大家都能公開敬拜」？
      - 定為官方信仰在先，還是關閉神廟在先？
    ref: event-christian-empire#C2
  - type: decision
    role: 你是 380 年的羅馬皇帝狄奧多西一世
    situation: |
      帝國裡有基督徒，也有信奉傳統多神信仰的人；基督徒內部對教義也有不同派別。六十多年前的米蘭敕令讓各種信仰都能公開敬拜，325 年的尼西亞會議定下了一套教義；之前的皇帝朱利安曾想恢復傳統多神信仰，但沒有成功。
      你要怎麼處理帝國的宗教？先寫下你的想法，再看選項。
    options:
      - label: 把尼西亞派基督教定為官方信仰，不同意的人當作異端
        result: 這是狄奧多西實際的選擇。380 年 2 月 27 日，他和格拉提安、瓦倫提尼安二世共同頒布帖撒羅尼迦敕令，把不從的人稱為「異端」，並預告他們會受到皇帝權威的懲罰；391 年他又關閉異教神廟、正式禁止異教敬拜。
      - label: 維持米蘭敕令的做法，各種信仰都能公開敬拜
        result: 推測：帝國也許能少一些因宗教而起的懲罰，但卡片沒有足夠資料告訴我們，這樣做能不能讓帝國更穩定，或基督教內部的爭論會怎麼發展。歷史沒有走這條路，所以後果只能推測。
      - label: 恢復傳統的多神信仰
        result: 推測：朱利安試過恢復希臘羅馬傳統宗教，但沒能持久；到 380 年，皇帝們已經支持教會好幾十年，再走回頭路可能更難。歷史沒有走這條路，所以後果只能推測。
    actual: 狄奧多西頒布帖撒羅尼迦敕令。它被認為是第一部在序文裡定義宗教正統的世俗法律，也是第一次把承認三位一體當成國家承認的條件；這道敕令原本是寫給君士坦丁堡人民的，後來才收入法典、適用全帝國。宗教從私人選擇，變成國家可以用法律強制的事。
    ref: event-christian-empire#C4
    note: 沒有發生的選項，後果都是推測。卡片也沒有說明狄奧多西做這個決定的動機，所以不要把「他為什麼這樣選」寫成確定的事。
  - type: card
    id: event-buddhism-china
    depth: deep
    prompt: 另一個普世宗教走了另一條路。注意佛教怎麼從印度傳到中國，東漢的人一開始把佛陀和誰一起祭拜；也讀「史家怎麼吵」：明帝夢金人的故事可信嗎？
  - type: today
    card: event-constitutio-antoniniana
    question: 有人說：「卡拉卡拉讓帝國裡的自由人都變成羅馬公民，就像今天一個國家讓外國人歸化、拿到國籍一樣。」這個類比哪裡不成立？
    model_answer: 先說不能類比的地方：羅馬公民權和今天的國籍不同，它主要是一組法律身分和稅務義務，不是投票、參政這類政治參與權；而且敕令的原文只剩殘片，卡拉卡拉的動機至今還有爭議，不能直接當成「為了讓大家平等」的政策。另外，敕令之後很快又出現上等人和下等人的區分。可以借來思考的結構是：「擴大公民身分（或戶籍、國籍），同時達成整合與增稅」，以及「形式上的平等之下，新的階層劃分隨之出現」。這只是看結構，不是預測。
  - type: check
    items:
      - kind: choice
        q: 下列哪一項最能說明「人們在有硬幣之前，就已經靠信用合作」？
        options:
          - 卡拉卡拉把公民權給了帝國裡的自由人
          - 美索不達米亞的泥板記下借大麥、借白銀的約定，那時白銀是稱重付款，還沒有鑄幣
          - 秦朝統一了貨幣
          - 鳩摩羅什到長安翻譯佛經
        answer: 1
        explain: 美索不達米亞的借貸約定記在泥板上，當時沒有鑄幣，白銀用重量付款；鑄幣要到約千年後的呂底亞才出現。但要記得，留下來的泥板是零散保存的樣本，不能推算當時借貸的總量。
        hints:
          - 找一個「還沒有硬幣」的時代。
          - 那時候白銀是怎麼付款的？
        ref: finance-mesopotamia-credit#F8
      - kind: choice
        q: 哈拉瑞認為，金錢的價值完全建立在大家的信任上。對照呂底亞鑄幣卡，哪一個說法最穩妥？
        options:
          - 最早的硬幣和金屬無關，價值全靠信任
          - 最早的鑄幣價值主要來自金屬本身，印記是發行者用信用保證重量與成色；但琥珀金的金銀比例不固定，這個保證的程度有限
          - 最早的硬幣是純金打成的，所以不需要信任
          - 呂底亞的硬幣是從中國學來的
        answer: 1
        explain: 呂底亞卡指出，鑄幣是把金屬打上印記，用發行者的信用保證重量與成色，讓人不必每次都重新檢驗；所以信任確實有作用。但早期鑄幣的價值主要還是來自金屬本身，而且琥珀金的比例不固定，同樣重量的幣實際價值不一定相同。「完全建立在信任上」用在這裡，說得太滿了。
        hints:
          - 回去看呂底亞卡的「不可類比的差異」：早期鑄幣的價值主要來自哪裡？
          - 印記保證的是什麼？為什麼說保證的程度有限？
          - 最早的幣是用純金，還是用什麼材料打成的？
        ref: finance-lydian-coinage#F3
      - kind: choice
        q: 佛教剛傳進中國時，東漢人是怎麼看待它的？
        options:
          - 一傳進來就被當成和中國信仰完全不同的獨立宗教
          - 常把佛陀和黃帝、老子一起祭拜，佛教僧人也借用道家觀念來傳教
          - 皇帝下令全國只能信佛教
          - 佛教是從呂底亞傳過來的
        answer: 1
        explain: 楚王劉英「誦黃老之微言，尚浮屠之仁祠」，把佛陀和黃老放在一起祭拜；佛教也借用道家概念傳教，兩者互相影響。一個外來的宗教，是先和當地的信仰混在一起，才慢慢變成中國文化的一部分。
        hints:
          - 回去看佛教傳入中國卡的史料：楚王劉英「誦」什麼、「尚」什麼？
          - 「黃老」指的是誰？
        ref: event-buddhism-china#C6
      - kind: order
        q: 依時間先後排列：
        items:
          - 《漢摩拉比法典》刻上石碑（約前 1753 年前後）
          - 呂底亞打出最早的琥珀金幣（約前 7 世紀晚期）
          - 呂底亞被波斯的居魯士征服（前 546 年左右）
          - 秦統一六國（前 221 年）
          - 安世高在洛陽翻譯佛經（148 年）
          - 卡拉卡拉頒布敕令（212 年）
          - 帖撒羅尼迦敕令（380 年）
        explain: 借貸的法律規則比鑄幣早了約千年；呂底亞的鑄幣在前 7 世紀晚期出現，前 546 年左右王國被波斯征服；接著是前 221 年的秦統一，進入西元後才有安世高譯經、卡拉卡拉敕令和帖撒羅尼迦敕令。
        hints:
          - 先找最早的：是法典，還是硬幣？
          - 前 7 世紀晚期和前 546 年，哪個早？
          - 148 年、212 年、380 年，照數字排。
        ref: finance-lydian-coinage#F5
      - kind: short
        q: 哈拉瑞認為，一神教比多神教更不寬容。用基督教成為羅馬國教的卡片，舉一個支持這個說法的例子，再舉一個要小心的地方。
        model: 支持的例子：380 年的帖撒羅尼迦敕令把不從的人稱為「異端」並預告懲罰，391 年又關閉異教神廟、禁止異教敬拜，帝國在不到一百年內改成以基督教壓制其他信仰。要小心的地方：在這之前，還沒改信基督教的羅馬帝國也大規模迫害過基督徒；君士坦丁也迫害過同為基督徒、不肯讓步的多納圖派，可見迫害也會發生在同一個宗教內部，不能只用「一神或多神」來解釋（卡片沒有說明君士坦丁這樣做的動機）。而且這只是一個帝國的例子，不足以證明所有一神教和多神教都是如此。
        explain: 一個大說法，最好同時找支持和反對的證據；只找支持的例子，很容易變成「先有結論再找證據」。
        hints:
          - 先看 380 年和 391 年發生了什麼。
          - 再往前看：3 世紀末是誰在迫害誰？
          - 313–314 年，君士坦丁對哪一群基督徒動手？
        ref: event-christian-empire#C2
  - type: recap
    model_answer: |
      回到一開始的問題：互不認識的人，靠什麼願意合作？卡片顯示，人們很早就靠寫下來的約定合作：美索不達米亞的泥板記下借大麥、借白銀，法典規定還不起怎麼辦；後來呂底亞用印記保證金屬的重量與成色，讓人不必每次都重新秤重。帝國把不同的人放進同一套制度：秦統一文字、度量衡和郡縣，羅馬讓自由人都成為公民。宗教也能把人連在一起：佛教沿著絲路傳進中國，和當地信仰混在一起；基督教從被迫害，變成羅馬的官方信仰。
      哈拉瑞認為，金錢、帝國和普世宗教是統一人類的三種力量。卡片支持「它們能讓陌生人合作」，但也提醒我們三件事：早期的錢不只靠信任，也靠金屬本身；帝國的統一常靠戰爭，而且統一之後馬上又分出新的高低；宗教可以團結人，也可以被國家用法律拿來壓制不同意的人。
      所以比較穩妥的答案是：把陌生人連在一起的力量，同時也常在畫新的界線。另外要記得，我們讀到的多半是王室和皇帝留下的法典、詔令與敕令，一般人怎麼想，史料並不完整。本單元不構成投資建議。
reflect: 這一課看到，讓陌生人合作的東西（錢、規則、共同的身分、共同的信仰），也常常同時把人分成「自己人」和「外人」。想一想你參加的一個團體：讓大家團結在一起的東西是什麼？它有沒有在不知不覺中，把某些人排除在外？如果要讓它包容更多人，可以改哪一點？

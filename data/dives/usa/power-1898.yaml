# 領土擴張示意圖 1898 年（畫法同 power-1783.yaml）
year: 1898
basemap: us_states
title: 跳出大陸：阿拉斯加、夏威夷與美西戰爭（1898 年）
note: 1853 年 12 月 30 日加茲登購地（1,000 萬美元，1854 年生效）補上希拉河以南。1867 年 3 月 30 日向俄國買下阿拉斯加（720 萬美元，10 月 18 日移交）。1898 年 7 月 7 日紐蘭茲決議併吞夏威夷共和國（8 月 12 日儀式）；同年美西戰爭，12 月 10 日巴黎條約西班牙讓出波多黎各、關島、菲律賓（1899 年 4 月 11 日生效），古巴由美軍佔領。這些海外領地不在本圖底圖上（只畫今日美國各州），請看「美西戰爭」卡的地圖。此時大陸上的原住民族多數已被遷入保留地；1890 年傷膝事件、人口普查宣布「邊疆關閉」。俄克拉荷馬東半仍是印第安領地，1907 年才和西半合併成州。

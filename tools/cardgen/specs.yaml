- { id: finance-antwerp-bourse, type: finance, track: west, name: 安特衛普的黃金時代與新交易所, time: "1501–1585", civ: "法蘭德斯與比利時（安特衛普）, 伊比利半島/葡萄牙, 伊比利半島/西班牙", brief: "葡萄牙香料集散、富格爾等南德銀行家、1531新交易所（第一棟專門興建的交易所）、哈布斯堡國債與1557西班牙破產（菲利普二世）、格雷欣在此替英王借款後回倫敦建皇家交易所。人口約10萬。" }

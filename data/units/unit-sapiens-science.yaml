  - type: recap
    model_answer: |
      回到一開始的問題：歐洲人為什麼願意承認「我們不知道」？又為什麼這和帝國、資本綁在一起？哈拉瑞認為，科學的新意在於承認無知、再去觀察和修正；可是研究要花錢，出錢的常是想要征服和獲利的國王、政府與商人。卡片上有支持的例子：庫克的第二次航行就是去確認「南方大陸」到底存不存在，可是同一批航行也替英國宣布占領澳洲東岸；VOC 的特許狀讓一家向大眾募股的公司可以開戰、建堡壘、殖民；20 世紀美國陸軍接手、格羅夫斯主持的曼哈頓計畫造出了原子彈。
      但卡片也提醒我們幾件事。第一，「歐洲比較願意探索和征服」只是一種解釋：鄭和船隊也動過武，停航有成本和北方壓力的原因；彭慕蘭等「加州學派」學者則強調煤礦和美洲殖民地的土地與原料，莫基爾等學者又有不同的解釋。第二，征服不只是技術優勢：科爾特斯身邊有好幾萬原住民盟軍，阿茲特克還遭遇天花；Hassig、Restall 都認為武器優勢不像傳統說法那麼大。第三，新知識也來自被征服的一方，例如幫庫克畫地圖的圖帕伊亞。
      這一切也有沉重的代價：美洲原住民在一百年內可能死了九成（原本人口多少爭議很大）；約 1,250 萬名非洲人被押上奴隸船，活著抵達的人多數被送往巴西和加勒比海的甘蔗園；班達群島原本約 1 萬 5 千名居民，估計只剩約 1 千人。奴隸貿易的利潤對英國經濟有多重要、廢奴是為了道德還是利益，學者至今還在爭論，但被奴役者付出的代價，不是可以拿來抵銷的數字。
      所以比較穩妥的答案是：承認無知讓人願意出發去找答案，但「誰出錢、為了什麼出錢」，決定了找到的知識被拿去做什麼。也要記得，我們讀到的大多是歐洲人自己留下的日誌、命令和帳簿，被征服者的聲音並不完整。本單元不構成投資建議。
reflect: 這一課看到，一趟「去找答案」的航行，也可能同時是「去占領」；誰出錢，常常決定了要找什麼答案、答案拿去做什麼。想一想你做過的一份報告或專題：是誰決定你要研究什麼？如果出題或打分數的人換了，你的題目和結論會不會跟著改變？

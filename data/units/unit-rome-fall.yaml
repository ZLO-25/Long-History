id: unit-rome-fall
title: 西羅馬為什麼會亡？一個問題，兩百多種答案
histories: [希臘羅馬史, 世界通史]
mystery: 羅馬曾經統治整個地中海，最後西半部卻在 5 世紀瓦解了。它到底是怎麼亡的？還是說，它其實沒有「亡」？
teaser: 一場森林裡的埋伏、一道橫越不列顛的牆、一船船埃及小麥，和一位被廢掉的少年皇帝。
goals:
  - 能依時間說出西羅馬瓦解前後的幾個關鍵事件
  - 能判讀一段耶柔米的書信，說出寫信的情境和它的限制
  - 能比較條頓堡森林戰役和哈德良長城，說出羅馬邊疆政策的變化
  - 能說明「衰亡」和「轉型」兩種看法，以及為什麼史家會吵這麼久
minutes: 35
level: 高中
curriculum: ["歷 Na-IV-2", "歷 A-V-1"]
steps:
  - type: hook
    text: |
      如果有人問：「你們班的籃球隊為什麼輸了？」答案可能有很多：對手太強、主將受傷、教練換人、練習太少、那天下雨……
      很難只挑一個原因，對吧？
      羅馬帝國西半部的瓦解，也是這樣。有一位德國史家統計過，光是「羅馬為什麼亡」的理論，就有 210 種。
    guess:
      q: 史家研究了兩百多年，對「羅馬為什麼會亡」得到什麼結論？
      options:
        - 早有共識：主要是蠻族大舉入侵，羅馬軍隊打不贏
        - 早有共識：主要是羅馬內部腐敗、人民奢侈
        - 沒有共識：有兩百多種理論，沒有一個能說服所有人
        - 一致認為羅馬根本沒有亡，只是改了名字
      reveal: 德國史家 Demandt 統計出 210 種理論，到今天沒有一個說法能說服所有人。有人強調外來的壓力，有人強調內部的問題，連「算不算滅亡」都有人認為更適合叫「轉型」。
  - type: card
    id: war-teutoburg
    depth: story
    prompt: 先回到帝國最強盛的時候。注意：打敗羅馬的阿米尼烏斯，原本是什麼身分？
    focus: [A1]
    quick:
      - q: 為什麼說羅馬最危險的對手，是最熟悉羅馬的人？
        a: 阿米尼烏斯在羅馬長大、有羅馬公民身分，還是瓦魯斯手下的輔助部隊軍官。他利用這份信任，暗中聯合各個日耳曼部落，把羅馬軍引進預設的埋伏。
      - q: 三個軍團為什麼會全軍覆沒？
        a: 羅馬隊伍在森林裡拉長到 15–20 公里，又在山丘和沼澤之間的窄路上遇到大雨和伏擊，沒辦法展開陣形反擊。
  - type: card
    id: building-hadrians-wall
    depth: story
    prompt: 一百多年後，羅馬在不列顛北部蓋了一道牆。注意牆上有很多城門，以及守牆的是哪些士兵。
    focus: [D1, terms]
    quick:
      - q: 牆上每一羅馬里就有一座有守衛的城門，這道牆是想把外面的人完全擋住嗎？
        a: 不是。城門讓人和貨物可以在監控下通過。古代傳記說牆是為了把蠻族和羅馬人分開，但也有學者認為它更像關卡，用來監控往來的人、向他們課稅。
      - q: 守牆的士兵是什麼人？這和阿米尼烏斯的身分有什麼相似？
        a: 守牆的是近一萬名來自帝國各地的輔助部隊士兵，他們不是羅馬公民。阿米尼烏斯也是輔助部隊軍官，可見「羅馬人」和「蠻族」的界線沒有那麼清楚。
  - type: compare
    cards: [war-teutoburg, building-hadrians-wall]
    prompt: 比一比兩個羅馬邊疆的故事。
    rows:
      - { aspect: 時間地點, a: 西元 9 年，日耳曼尼亞（萊茵河以東）, b: 約西元 122 年起，不列顛北部 }
      - { aspect: 發生什麼, a: 三個軍團在森林中被伏擊，全軍覆沒, b: 築起約 117 公里長的牆，每一羅馬里有一座有守衛的城門 }
      - { aspect: 和「蠻族」的關係, a: 帶頭的阿米尼烏斯是在羅馬長大、替羅馬效力的輔助部隊軍官, b: 守牆的主要是來自帝國各地的輔助部隊士兵 }
      - { aspect: 後來, a: 羅馬停在萊茵河一線，沒有再征服這片土地, b: 堡壘一直用到 5 世紀初，羅馬統治不列顛結束才廢棄 }
    question: 從這兩個故事看，羅馬對邊疆的做法有什麼變化？「羅馬人」和「蠻族」真的分得很清楚嗎？
    points:
      - 條頓堡之後羅馬停止往日耳曼尼亞擴張；到哈德良時代，用一道固定的牆來標示和管理邊界
      - 這條界線不是密不透風：牆上有很多城門，讓人和貨物在監控下通過
      - 雙方的人常常混在一起：打敗羅馬的阿米尼烏斯曾替羅馬效力，守牆的也多是來自各地的輔助部隊
    model_answer: 條頓堡之後羅馬停止往日耳曼尼亞擴張；到了哈德良時代，更進一步用一道固定的牆來標示和管理邊界，有人把它看成帝國停止擴張的象徵。但這條界線並不是密不透風：牆上有很多城門讓人和貨物在監控下通過，而且雙方的人常常混在一起，打敗羅馬的阿米尼烏斯本身就替羅馬效力過，守牆的也多是來自各地的輔助部隊。
    hints:
      - 看「後來」那一列：羅馬還繼續往外打嗎？
      - 看「和蠻族的關係」那一列：兩邊的主角是什麼身分？
      - 長城的城門是做什麼用的？
  - type: card
    id: event-constitutio-antoniniana
    depth: story
    prompt: 「誰算羅馬人」這個問題，在 212 年有了大轉變。注意：同時代的人和現代學者，對皇帝的動機看法一樣嗎？
    focus: [debate]
    quick:
      - q: 212 年的命令，讓「誰算羅馬人」有什麼改變？
        a: 以前多數行省居民不是公民，輔助部隊的士兵要等退伍才拿得到公民權。這一年起，帝國境內所有自由男性都成為羅馬公民，自由女性也得到和羅馬女性一樣的權利。
      - q: 同時代的狄奧怎麼說皇帝的動機？現代學者為什麼不全信？
        a: 狄奧說皇帝表面是給大家榮耀，真正目的是增加收入，因為非公民不必繳大部分的稅。但研究狄奧的學者指出，狄奧本人不喜歡這道命令，他的增稅說法有不少問題；另一種看法則是皇帝想擴大可以當軍團兵的人數。
  - type: card
    id: commodity-egypt-grain
    depth: story
    prompt: 羅馬城住了幾十萬人，大家吃的麵包從哪裡來？記住「北非」這個地名，等一下會再出現。
    focus: [B2]
    quick:
      - q: 羅馬城的小麥為什麼要從海外運來？來源有什麼變化？
        a: 因為羅馬城人口很多，本地種的小麥不夠吃。共和時期主要靠西西里，帝國時期越來越靠北非和埃及。
      - q: 糧食如果大多來自遠方的同一個地方，會有什麼風險？
        a: 那個地方一旦失守，糧食就斷了。約 439 年汪達爾人奪下北非，西羅馬失去大部分糧源，羅馬城人口估計從 400 年的 70–80 萬降到 452 年的 40–50 萬。
  - type: decision
    role: 你是羅馬第一位皇帝奧古斯都
    situation: |
      國家把糧食便宜賣、甚至免費發給登記的羅馬公民，大約有 20 萬人。這要花很多錢，也讓很多人習慣靠國家吃飯。
      你可以把這項配給永遠廢除，也可以把它留下來。你會怎麼做？
    options:
      - { label: 永遠廢除糧食配給, result: 奧古斯都自己寫過，他非常想這麼做，但他擔心以後會有政客為了討好人民又把它恢復，所以沒有廢除。真的廢除會怎樣，只能推測：可能省下開支，也可能讓首都民心不穩。 }
      - { label: 保留配給，由國家管理, result: 這是奧古斯都當年的選擇。配給繼續作為常設制度，國家也設了專門管糧食的官員；糧食從此和首都的秩序、皇帝的聲望綁在一起。 }
      - { label: "保留配給，但像凱撒那樣把領取人數再減少", result: "推測：凱撒曾把配給人數減為 15 萬，所以這條路有先例；但奧古斯都沒有這麼做，他把人數定在約 20 萬。減少之後首都的民心與秩序會怎樣，卡片沒有記載，所以後果只能推測。" }
    actual: 奧古斯都保留了配給，並把領取人數固定在約 20 萬人。幾百年後，約 439 年汪達爾人奪下北非，西羅馬失去大部分糧源；羅馬城人口從 400 年的 70–80 萬人，降到 452 年的 40–50 萬人（估計）。
    ref: commodity-egypt-grain#story
    note: 「沒有發生的選項」的後果都是推測，標示清楚。
  - type: card
    id: event-fall-western-rome
    depth: deep
    prompt: 最後來看 5 世紀。讀「史家怎麼吵」時，注意兩個問題：羅馬到底有沒有「亡」？原因是外面的壓力，還是內部的問題？
    focus: [debate]
    quick:
      - q: 有人說原因在外面的壓力，有人說在內部。兩邊各舉出什麼？
        a: 強調外面的，看的是移民和入侵的壓力。強調內部的，看的是軍隊依賴蠻族兵、財政吃緊與重稅、內戰和繼承不穩、富裕元老不肯出錢出兵。
      - q: 「衰亡」和「轉型」這兩種看法，差在哪裡？
        a: 「衰亡」強調崩潰與損失，沃德－帕金斯就認為「5 世紀和平多於暴力」不符合事實。「轉型」強調羅馬的文化與政治正統在 476 年後仍延續，所以有學者主張叫「複雜的文化轉型」。
  - type: chain
    prompt: 把下列事件依照時間排成一條鏈（最上面是最早的）。
    items:
      - 被匈人追趕的哥德人大批進入羅馬帝國
      - 羅馬皇帝在阿德里安堡戰死
      - 西哥德人攻進羅馬城搶劫
      - 汪達爾人奪下北非，西羅馬失去大部分糧食和稅收
      - 奧多亞塞廢掉年幼的皇帝，皇帝徽章被送到君士坦丁堡
    followup:
      question: 這條鏈是依時間排的。下面哪一組，卡片寫的是「前一件促成後一件」，而不只是先後？
      options:
        - 西哥德人攻進羅馬城 → 汪達爾人奪下北非
        - 哥德人大批入境 → 皇帝在阿德里安堡戰死
        - 羅馬皇帝在阿德里安堡戰死 → 西哥德人攻進羅馬城
        - 西哥德人攻進羅馬城 → 奧多亞塞廢掉年幼的皇帝
      answer: 1
      explain: 卡片說，被匈人逼迫的哥德人大批入境，羅馬既無法驅逐也無法收服，才有 378 年皇帝戰死。另外三組卡片只寫了它們先後發生，沒有寫成前一件促成後一件。（卡片另外把「失去北非」列為促成西羅馬崩潰的原因之一。）
      why_wrong:
        - 卡片只寫這兩件事先後發生，沒有說羅馬城被劫促成了北非失守。
        - null
        - 卡片只寫這兩件事先後發生，沒有說皇帝戰死直接造成羅馬城被劫。
        - 卡片只寫這兩件事先後發生；直接列為促成原因的，是失去北非。
    explain: 376 哥德人入境 → 378 阿德里安堡 → 410 羅馬城被劫 → 約 439 失去北非 → 476 皇帝被廢。注意：這是一連串壓力一層層疊上去，不是一個原因就造成一切；還記得埃及和北非的小麥嗎？失去北非，等於同時失去糧食和錢。史家對哪一個原因最重要，到今天還沒有共識。
    hints:
      - 最早的一步是一群人被別人追趕、逃進帝國。
      - 羅馬城被劫比失去北非早大約三十年。
      - 最後一步不是大戰，而是一個皇帝被廢。
    ref: event-fall-western-rome#story
  - type: source
    card: event-fall-western-rome
    idx: 0
    question: 耶柔米在 412 年寫下「那座曾經征服全世界的城市，自己被攻陷了」。讀這句話時，最需要注意什麼？
    options:
      - 這證明西羅馬帝國在 410 年就已經完全滅亡了
      - 它寫出當時人的震驚，但城被劫不是帝國結束
      - 耶柔米是蠻族，所以他很高興看到羅馬被攻陷
      - 這句話是現代史家寫的，不是古代留下的史料
    answer: 1
    why_wrong:
      - 西方的皇帝在 410 年之後還繼續存在了六十多年，到 476 年才被廢；城市被攻陷不等於國家滅亡。
      - null
      - 耶柔米是寫信的學者，他還痛罵過拿羅馬的錢武裝敵人的人，他不是蠻族。
      - 這是 412 年寫的書信，是當時的人留下的古代史料，不是現代史家寫的。
    critique:
      question: 耶柔米罵一個「半蠻族的叛徒」拿羅馬的錢武裝了敵人；阿米阿努斯則責怪羅馬的富人奢侈輕浮。兩人都是當時的人，卻把責任推給不同的人。這最能提醒我們什麼？
      options:
        - 兩個人一定有一個在說謊，只要查出是誰，就能知道羅馬為什麼亡
        - 兩個人都是現代史家，說法已經查證過，可以直接當成真正的原因
        - 當時的人各有立場，這些是「當時人的解釋」，不能直接當答案
        - 兩個人說法不同，代表當時根本沒有人注意到羅馬出了問題
      answer: 2
      explain: 耶柔米是寫信的學者，阿米阿努斯是寫歷史的人，兩人責怪的對象並不一樣。這些話能讓我們看到當時的人怎麼想、怎麼責怪別人，但不能直接當成「真正的原因」；現代史家統計出 210 種理論，也還沒有定論。
      why_wrong:
        - 兩個人可以各有立場、都有一部分道理，不是非得有一個說謊。
        - 他們是古代的作者，不是現代史家；他們的說法也沒有被查證成定論。
        - null
        - 兩個人都很在意羅馬出了問題，只是把責任推給不同的人。
    explain: 410 年羅馬城被西哥德人劫掠，對當時的人是極大的震撼，耶柔米的話寫出了這種情緒。但西方的皇帝在那之後還繼續存在了六十多年，東羅馬更延續到 1453 年。讀史料時，要分清楚「當時的人有什麼感受」和「事情實際上的結果」。
    hints:
      - 這句話寫在哪一年？西羅馬最後一位皇帝是哪一年被廢的？
      - 「城市被攻陷」和「國家滅亡」是同一件事嗎？
      - 這是一封信，信裡常常帶著寫信人的情緒。
    ref: event-fall-western-rome#story
  - type: today
    card: event-fall-western-rome
    question: 常有人說「某某大國就像晚期的羅馬，快要滅亡了」。這個比喻哪裡不成立？
    points:
      - 羅馬「滅亡」的日期和意義本身就有爭議：東半部又延續了近千年，西半部是約一百年間多重壓力疊加才瓦解
      - 古代晚期的人口、氣候、軍事技術和國家運作方式，和今天的國家差異極大
      - 這個比喻只能提醒我們「慢慢累積的壓力會一起造成危機」，不能拿來預測哪個國家會滅亡
    model_answer: 羅馬「滅亡」的日期和意義本身就有爭議：東半部又延續了近千年，西半部也是在大約一百年裡多重壓力疊加才瓦解。古代晚期的人口、氣候、軍事技術和國家運作方式，和今天的國家差異極大。拿羅馬來比喻，可以提醒我們「很多慢慢累積的壓力會一起造成危機」，但不能拿來預測哪個國家會不會滅亡。
  - type: check
    items:
      - kind: choice
        q: 關於西元 476 年，下列哪一句正確？
        options:
          - 奧多亞塞廢掉年幼皇帝，徽章被送到君士坦丁堡
          - 君士坦丁堡的東羅馬也在這一年跟著一起滅亡
          - 皇帝在一場決定命運的大戰中戰死，軍隊潰敗
          - 西哥德人第一次攻進羅馬城，把整座城市搶劫一空
        answer: 0
        why_wrong:
          - null
          - 東羅馬以君士坦丁堡為中心，一直延續到 1453 年。
          - 476 年不是一場大戰，而是一位將領廢掉皇帝；皇帝在阿德里安堡戰死是 378 年的事。
          - 西哥德人攻進羅馬城是 410 年，不是 476 年。
        explain: 476 年不是一場大戰，而是一位將領廢掉皇帝；東羅馬還延續到 1453 年。把 476 年當成終點，是後來許多史家的習慣。
        hints: [回去看西羅馬卡的「常見誤解」。, 東邊的君士坦丁堡後來怎麼了？]
        ref: event-fall-western-rome#C6

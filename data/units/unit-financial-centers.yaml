id: unit-financial-centers
title: 金融中心為什麼會搬家？（上）從香檳市集、布魯日、安特衛普到熱那亞銀行家
histories:
- 錢的歷史
- 歐洲史
- 美國史
- 世界通史
mystery: 中世紀的市集上，商人為什麼會一次次離開一座繁榮的城市？河口淤積、一場圍城、一次國王停付，各自改變了什麼？
teaser: 這一課先追前半段的接力：香檳市集、布魯日、安特衛普，再到替西班牙王室轉錢的熱那亞銀行家。下一課再接阿姆斯特丹、倫敦和紐約。
goals:
- 能說出香檳市集、布魯日、安特衛普、熱那亞銀行家在金融中心接力中的位置，以及各自衰落或轉移的原因
- 能判讀當時人留下的文字，分清「寫信人的說法」和「實際發生的事」
- 能說明熱那亞銀行家家族如何替西班牙王室轉移資金，以及聖喬治之家如何由債權人管理公債
minutes: 30
steps:
- type: hook
  text: |
    想像班上有一群人，固定在某個地方交換卡片、互相借點數。大家會去那裡，是因為路好走、有人幫你評理、大家都放心。
    如果有一天，通往那裡的路被堵住了，或是管場地的人和別人吵起來，或是最大的借方賴帳不還，你會怎麼辦？
    多半會約去別的地方。歷史上的「金融中心」，也一次又一次這樣搬家。
    這一課追的接力順序是：香檳→布魯日→安特衛普→熱那亞→阿姆斯特丹→倫敦→紐約。其中熱那亞這一環和別的城市不太一樣，走到那一步再細看。
    這一課是上半場：先走到熱那亞。阿姆斯特丹、倫敦、紐約留給下一課。
- type: card
  id: finance-champagne-fairs
  depth: story
  prompt: 先看起點。注意伯爵做了什麼來保護前來的商人，也注意市集最後衰落時，卡片列了不只一個原因。
- type: card
  id: finance-bruges-bourse
  depth: story
  prompt: 接著到布魯日。注意商人在這裡做哪些事（買賣、換錢、匯票），也注意它衰落的兩種常見解釋，一種是自然條件，一種是政治衝突。
- type: card
  id: finance-antwerp-bourse
  depth: understand
  prompt: 商人轉去的新地方是安特衛普。注意它靠什麼興起，以及 1557 年的暫停還債為什麼不等於它馬上沒落。
- type: source
  card: finance-antwerp-bourse
  idx: 0
  question: 雅各布·富格爾在 1523 年寫信給查理五世，說「沒有我，陛下無法取得羅馬皇冠」。這句話最能說明什麼？
  options:
  - 富格爾自己認為，他借給查理五世的錢對皇帝取得皇位很關鍵
  - 查理五世已經把所有借款都還清了
  - 富格爾家族在安特衛普蓋了第一棟專門興建的交易所
  - 這句話證明皇帝選舉的結果完全由富格爾一個人決定
  answer: 0
  explain: 這是寫信人自己的說法。卡片記載，富格爾在 1519 年為皇帝選舉大筆放款，估計約 54 萬弗羅林，是當時總額約 85 萬中的大宗，所以他確實出了大部分的錢。但「沒有我就不行」是他自己的表述，不能直接當成他一人決定了結果。另外，這段文字是英文條目所引的英譯，各譯本措辭略有差異。
  hints:
  - 先看是誰寫給誰：是銀行家寫給皇帝，還是史家的研究結論？
  - 回到卡片「起源與背景」，找 1519 年那筆放款的數字。
  - 「出了大部分的錢」和「一個人決定了結果」，是同一件事嗎？
  ref: finance-antwerp-bourse#F2
- type: card
  id: war-fall-of-antwerp
  depth: deep
  prompt: 讀完請特別看「史家怎麼吵」：1576 年的洗劫與 1585 年的陷落，是衰落的轉捩點，還是長期趨勢的一部分？也看「常見誤解」，分清這兩件事相隔幾年。
- type: chain
  prompt: 把安特衛普興起、衰落到阿姆斯特丹接手的過程，依時間先後排成一條鏈（最上面最早）。
  items:
  - 布魯日的河口逐漸淤積，外國商人逐步轉向安特衛普
  - 1531 年安特衛普新交易所落成
  - 1557 年腓力二世的政府暫停還債，借錢給他的銀行家大受打擊
  - 1576 年欠餉的西班牙士兵洗劫安特衛普（西班牙之怒）
  - 1585 年安特衛普投降，北方持續控制河口、封鎖斯海爾德河
  - 不少商人與工匠北遷，阿姆斯特丹成為重要去向
  explain: 這是時間順序，不代表每一步都是下一步的唯一原因。前面幾項（布魯日河口淤積、1531 年交易所、1557 年違約）出自安特衛普卡，1576 到 1585 年的細節也可在安特衛普陷落卡的關鍵轉折中對照。卡片提醒，安特衛普的興衰同時牽涉商路、君主借款與戰爭，各自的分量不下定論。對阿姆斯特丹的崛起來說，安特衛普的陷落與人才資金北遷也只是原因之一，不是唯一原因。
  hints:
  - 最早的一步和「舊中心布魯日」有關。
  - 1531 年的交易所代表繁榮期，1557 和 1576 都是在它之後發生的壞消息。
  - 最後兩項是：城市投降之後，人和錢往哪裡走？
  ref: finance-antwerp-bourse#F5
- type: decision
  role: 你是 1585 年夏天安特衛普的新教徒商人
  situation: |
    8 月 17 日，安特衛普向帕爾馬公爵投降。依投降條件，新教徒有四年時間處理財產後離開（維基百科寫四年，其他來源或有不同說法）。
    你的城市沒有被摧毀，但出海的斯海爾德河口握在北方手裡，船很難進來。北方的阿姆斯特丹正在接納人和資金。
    你要把生意搬到北方，還是留在安特衛普？
  options:
  - label: 帶著家當和生意往北遷，去阿姆斯特丹
    result: 歷史上不少商人和工匠走了這條路。安特衛普人口從圍城前約 10 萬降到約 4 萬，阿姆斯特丹是重要去向。但卡片沒有記載個別商人後來過得好不好，所以不能說北遷一定成功。
  - label: 留在安特衛普，等河口很快重新開放
    result: 推測：你很可能等不到。卡片只記載，河口到 1792 年才重新開放，荷蘭徵收通行稅到 1863 年才免除。留下的人實際過得如何，卡片沒有寫，所以這條路的後果只能推測。
  actual: 不少人北遷，許多技術工匠與新教徒的去向以阿姆斯特丹為重要一站。多數論述認為，這是阿姆斯特丹在 17 世紀成為金融與貿易中心的原因之一，但不是唯一原因。
  ref: war-fall-of-antwerp#A9
  note: 這是歷史情境，不構成投資建議。要小心後見之明：當時的人並不知道河口會被封鎖那麼久。
- type: card
  id: finance-age-of-genoese
  depth: deep
  prompt: 把時間往回看一點，安特衛普的故事裡還有一條線：西班牙王室要在法蘭德斯養軍隊，錢卻在西班牙與美洲，是誰把錢送過去的？讀完請看「史家怎麼吵」：國王停止付款，是失信，還是合約裡預先設想的保險？也看「常見誤解」，分清借錢的是銀行家家族，還是熱那亞這個國家。
- type: chain
  prompt: 把熱那亞銀行家與西班牙王室這條線，依時間先後排成一條鏈（最上面最早）。
  items:
  - 1557 年菲利普二世第一次停止付款，南德的富格爾等銀行家受到重創
  - 熱那亞銀行家逐漸成為主要放款人，用匯票在法蘭德斯支付軍餉
  - 約 1579 年起，熱那亞人主持的市集固定在皮亞琴察舉行（年份為估計）
  - 1627 年西班牙再度停止付款，奧利瓦雷斯開始改找其他銀行家
  explain: 1557 年的停付讓南德銀行家受創，熱那亞銀行家的角色隨後變得更重要，他們與王室簽貸款合約，在法蘭德斯用匯票付軍餉，再向王室收回白銀。皮亞琴察市集的年份，卡片標示為估計，是依布勞岱爾的通行敘述，來源不足，不能當成確定年份。1627 年的再度停付是布勞岱爾「熱那亞人的世紀」分期的終點。注意：停付不代表放款人一定血本無歸，Drelichman 與 Voth 的研究主張，停付大致像合約裡預先設想的保險，銀行家整體仍有報酬。按鈕連到的 F2 是 1557 年停付與熱那亞銀行家崛起的段落；皮亞琴察市集在 F3，1627 年的結束在 F5。
  hints:
  - 先找「第一次停止付款」發生在哪一年，那是這條線的起點。
  - 南德銀行家受創之後，誰成為主要放款人？他們用什麼工具把錢送到法蘭德斯？
  - 最後一項是布勞岱爾「熱那亞人的世紀」的終點年份，國王又停付了一次。
  ref: finance-age-of-genoese#F2
- type: card
  id: finance-casa-di-san-giorgio
  depth: understand
  prompt: 熱那亞還有另一個常被提到的機構。注意它是怎麼處理政府欠下的錢，也注意它和「銀行家家族借錢給西班牙王室」是不同的兩件事。
- type: check
  items:
  - kind: choice
    q: 布魯日的 bourse 最接近下列哪一種東西？
    options:
    - 商人聚會、換錢、交換匯票的場所
    - 公開買賣公司股票的證券交易所
    - 由市政府設立的帳簿貨幣銀行
    - 每年輪流舉辦六次的定期市集
    answer: 0
    explain: 布魯日的 bourse 是商人聚會與匯兌之處，並不是買賣股票的現代證券交易所；現代意義的股票交易要到 17 世紀初的阿姆斯特丹才出現。把它說成「世界第一個證券交易所」有些誇大。
    hints:
    - 回想布魯日卡的故事：商人在這裡做哪幾件事？
    - 買賣、換錢、匯票這幾件事裡，有沒有「公開買賣公司股份」？
    ref: finance-bruges-bourse#F1
  - kind: choice
    q: 關於「借錢給西班牙王室的熱那亞」，哪個說法最符合卡片的內容？
    options:
    - 熱那亞共和國這個國家，把國庫的錢借給西班牙王室
    - 借錢的是熱那亞的私人銀行家家族，他們與王室簽 asiento 貸款合約，在法蘭德斯用匯票付軍餉
    - 借錢的是聖喬治之家，它專門替西班牙王室籌軍費
    - 借錢的是阿姆斯特丹匯兌銀行
    answer: 1
    explain: 卡片的「常見誤解」明確寫到，熱那亞共和國這個國家並沒有借錢給西班牙，借錢的是熱那亞的私人銀行家家族；聖喬治之家是另一件事。銀行家與王室簽 asiento，先在遠方支付，再向王室收回白銀。按鈕連到整張卡，請在卡片的「常見誤解」欄找這一條。
    hints:
    - 回到熱那亞人的世紀卡，看「常見誤解」的第一條。
    - 問問自己：借錢的是「一個國家」，還是「幾個家族」？
    - 想一想 asiento 是什麼：它是銀行家和王室簽的貸款合約。
    ref: finance-age-of-genoese
  - kind: choice
    q: 1407 年成立的聖喬治之家，是怎麼處理熱那亞政府欠下的公債的？
    options:
    - 由債權人的代表管理，接手一部分稅收（特別是關稅）的收益權，再按持有份額分給債權人
    - 由政府單方面決定每年還多少，債主不能過問
    - 發行銀行券，像中央銀行一樣穩定貨幣
    - 把所有債務一筆勾銷
    answer: 0
    explain: 聖喬治之家由債權人代表管理，取得一部分稅收的收益權，用這些收入付息，讓債主可以監督稅收與分配。它不是發行貨幣的中央銀行，與後來的英格蘭銀行、阿姆斯特丹匯兌銀行只是可對照，不是直線演進。
    hints:
    - 回到卡片「怎麼運作」，看「接管稅收」與「債權人治理」。
    - 債主是各自去追討，還是集體管理？
    - 它有沒有壟斷發行貨幣？卡片「改變了什麼」有說明。
    ref: finance-casa-di-san-giorgio#F3
  - kind: order
    q: 依時間先後排列這些事件：
    items:
    - 香檳市集興盛（約 1180–1320 年）
    - 安特衛普新交易所落成（1531 年）
    - 西班牙王室第一次停止付款（1557 年）
    - 安特衛普向帕爾馬公爵投降（1585 年）
    explain: 香檳市集在中世紀；安特衛普新交易所 1531 年落成；西班牙王室第一次停付在 1557 年；安特衛普在 1585 年 8 月投降。四件事都在安特衛普興衰的前後，注意 1531 與 1557 都在 16 世紀。
    hints:
    - 先分出中世紀和 16 世紀。
    - 1531 年的交易所落成在先，國王停付在後。
    - 安特衛普投降是這四件事裡最晚的。
    ref: war-fall-of-antwerp#A9
- type: recap
  model_answer: 金融中心會搬家，不是因為單一原因。商人和資金會去「最方便又最放心」的地方：香檳市集靠伯爵的保護與定期結算，後來因海路直航與王室影響增強而衰落；布魯日靠近海，但河口淤積，又與統治者發生衝突；安特衛普靠香料、銀行家與君主借款興盛，卻受 1557 年違約、1576 年洗劫、1585 年陷落與河口封鎖打擊，人與資金北移到阿姆斯特丹。熱那亞這一環比較特別：1557 年西班牙王室停付、南德銀行家受創後，熱那亞的私人銀行家家族逐漸成為主要放款人，用貸款合約與匯票把美洲白銀與法蘭德斯的軍餉接起來；聖喬治之家則是另一件事，由債權人管理公債與稅收，不是銀行家家族借錢給西班牙。下一課接著看阿姆斯特丹、倫敦與紐約。本單元只談歷史，不構成投資建議。

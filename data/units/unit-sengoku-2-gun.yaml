  - type: recap
    model_answer: 槍、錢、人三樣都有，而且缺一不可，只是「槍」的故事被後世放得最大。槍：1543 年前後火繩槍傳到種子島，刀匠幾年內吃透技術，堺、國友、根來量產，三十年後信長能一次集中千挺以上。但武田也有鐵砲，桶狹間時決定勝負的仍是長槍與組織，Conlan 甚至認為火器要到 1600 年前後才取代弓。人：桶狹間靠的是地形與集結速度，之後是與家康的同盟、擁立將軍借用幕府名義、以及 Conlan 所說把足輕動員、訓練、補給起來的「組織技術」。錢：1567 年起的樂市把商人和稅基吸到城下町，掌握堺與國友讓他比對手更快組織鐵砲隊，連鉛和火藥都比武田充足；不過研究者提醒，樂市是「招商＋統制」而非自由市場，而且樂市也不是信長首創。最後，1582 年本能寺之變一個早上就結束了這個政權：它高度依附在信長一個人身上，接手的不是織田家的兒子，而是趕回來復仇的秀吉。兩個提醒：「三千挺三段擊」出自江戶時代的書與明治的戰史，當時人只寫「千挺計」；把樂市樂座說成「自由經濟先驅」，是把 20 世紀的觀念套回 16 世紀的後見之明，寫進課本的是成功的安土，失敗的城下町沒人替它寫傳。本單元談到城下町經濟，但不構成投資建議。這是一種參考說法，不是標準答案。
reflect: 長篠前夕的信長要決定把有限的資源押多少在一種「貴、慢、下雨會失靈」的新工具上。你有沒有碰過類似的選擇，例如一套新的學習方法、一個新軟體、一項新技能？你怎麼決定投入多少？是看工具本身厲不厲害，還是看自己有沒有能把它用起來的條件？

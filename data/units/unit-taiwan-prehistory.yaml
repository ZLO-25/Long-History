    question: 請從兩張卡各舉一個「年代說法不同」的例子，並說明：為什麼同一件事的年代，各說會不一樣？
    model_answer: 例如十三行有多老：十三行博物館寫 1,800 到 500 年前，史前館寫「大約二千年前」興起，維基百科整理的說法是約西元 400 年已自己煉鐵。差別可能來自「出現鐵器」「自己煉鐵」「形成文化」說的不一定是同一件事。又如卑南遺址的碳十四數據，要看測的是哪一層，不能直接當成卑南文化的年代。南島語的起點年代，考古推算和語言樹推算是不同的方法，數字不必相同。長濱文化上限的三種寫法，卡片讀到的來源沒有說明原因，所以只能並列、不選邊。共同的道理是：年代都是估計，測的對象、說的事情和方法不同，數字就會不同。
    hints:
      - 先看「年代怎麼來」那一列：碳十四和語言樹是同一種方法嗎？
      - 再看十三行的例子：「出現鐵器」「自己煉鐵」「形成文化」，是同一件事嗎？
      - 如果來源沒有說明差異的原因，我們可以替它編一個理由嗎？
    points:
      - 年代都是估計，常寫成「約」和誤差（例如 ±40），新的測定可能改變數字
      - 測的對象不同：碳十四數據要看測的是哪一層（卑南遺址的例子）
      - 說的事情不同：「出現鐵器」「自己煉鐵」「形成文化」不一定是同一件事（十三行的例子）
      - 方法不同，數字不必相同；來源沒有說明原因的差異（長濱文化上限），就並列、不選邊

id: unit-taiwan-colony-economy
title: 日本時代的建設，是為了誰？
histories: [臺灣史, 日本史]
mystery: 日本時代的臺灣蓋了水圳、糖廠、鐵路和百貨公司。同一條水圳、同一座糖廠、同一家百貨公司，對總督府、製糖會社、農民與蔗農、都市裡的人和鄉下人，是不是同一樣東西？各自得到什麼、付出什麼？
teaser: 一張請願書的第十項、一句二林人說的俚語，和一段寫臺北夜景的小說：三份史料，三個不同的位置。
goals:
  - 能說出同一項建設（嘉南大圳、糖廠、百貨與廣播）對總督府、製糖會社、農民與蔗農、都市居民和鄉下人，各得到什麼、付出什麼
  - 能判讀請願書、二林俚語和小說片段，說出它們是誰寫的、能證明什麼、看不到誰
  - 能並列學者對「這座大圳是為了誰」的不同說法，並分清楚哪些是轉述、本站沒讀到原書
  - 能用因果鏈說明糖業保護、原料採取區、水利建設與二林蔗農事件之間哪些是卡片明說的關係
  - 能指出把日治糖廠與今天的契約農業、平台類比時，哪裡不成立
minutes: 38
level: 皆可
curriculum: ["歷 Ea-IV-2", "歷 Eb-IV-2", "歷 Eb-IV-3", "歷 Da-V-3", "歷 Db-V-1"]
steps:
  - type: hook
    text: |
      想像學校花了一大筆錢，蓋好一座新體育館。校隊說「終於有地方練球了」；一般同學說「要收場地費，我們好像用不太到」；附近的住戶說「晚上比賽太吵」；出錢的人說「這是為了學校的名聲」。
      同一座體育館，每個人看到的不一樣。
      日本時代的臺灣也蓋了很多東西：水圳、糖廠、鐵路、百貨公司。上一課看的是臺灣人怎麼用請願、演講和武裝向統治者「說不」；這一課換個角度，看這些建設本身：它們對不同位置的人，各是什麼？
    guess:
      q: "1930 年嘉南大圳完工，灌溉嘉義、臺南一帶約 15 萬甲的農田。你覺得這座大圳「主要是為了誰」蓋的？（沒有對錯，先憑直覺選。）"
      options:
        - "為了當地的農民，讓他們有水種田"
        - "為了日本帝國，讓臺灣生產更多米和糖"
        - "為了大地主和糖廠，讓有錢人賺更多"
        - "不同的人看到的不一樣，很難只選一個"
      reveal: "學者各有說法。郭雲萍寫到受惠農民尊稱八田與一為「嘉南大圳之父」；風傳媒專欄則轉述矢內原忠雄等人，認為它偏向殖民母國和大地主（本站沒讀到原書）。請願書的連署裡既有農民代表，也有製糖會社的代表。卡片把幾種說法並排，不替讀者選邊。這一課要練習的，就是看清楚「同一項建設，每個位置的人得到什麼、付出什麼」。"
  - type: card
    id: building-chianan-canal
    depth: deep
    prompt: 先看水圳。讀「建造者與資金」時注意：請願書是誰連署的、農民每年要繳什麼；讀「史家怎麼吵」時注意，三種說法裡哪些出自郭雲萍的文章，哪些是專欄轉述、本站沒讀到原書。
    focus: [D2, debate]
    quick:
      - q: "嘉南大圳的請願書是誰連署的？農民從 1921 年起要繳什麼，欠繳會怎樣？"
        a: "請願書由利害關係者總代表 119 人連署，除了農民代表，也有鹽水港、大日本、東洋、新高等製糖會社的代表。農民從 1921 年起繳「水租」（維持經營費）和「特別水租」（還建圳借款），欠繳的人，不動產可以被法院查封。"
      - q: "「大圳主要服務殖民母國和大地主」這個說法，卡片能確認到什麼程度？"
        a: "這是風傳媒專欄作者賈忠偉轉述矢內原忠雄等人的說法（註明引自周憲文譯本），本站沒有讀到矢內原、周憲文的原書。能另外確認的只有：郭雲萍的文章提到矢內原等人認為米糖相剋「被水流失掉了」，而郭雲萍對這個說法表示懷疑。所以只能寫「某某認為」，不能當定論。"
  - type: source
    card: building-chianan-canal
    idx: 0
    question: 這句請願書條文說，這條埤圳要由誰「共同經營」？
    options:
      - 總督府的技師與官員，農民只負責用水和繳費
      - 業主、典權人、佃戶，以及供應原料的製糖業者
      - 只有擁有土地的大地主，佃戶和糖廠都不能參與
      - 受益地的農民；製糖會社只在一旁看，不負責經營
    answer: 1
    explain: 原文寫「土地業主、典權人、佃戶及由該地供給原料的製糖業者共同經營」，四種人都在名單裡，包括佃戶，也包括製糖業者。注意這是請願書裡「申請的人想怎麼設計」的寫法；卡片另寫，實際經營由農民組成的「公共埤圳嘉南大圳組合」負責。
    hints:
      - 找句子裡「共同經營」前面列了幾種人。
      - 名單裡有沒有「佃戶」？有沒有「製糖業者」？
      - 四個選項裡，只有一個把名單裡的幾種人都列出來。
    ref: building-chianan-canal#D2
    why_wrong:
      - 規劃、設計、監造是技師團隊做的事；這句條文談的是誰「共同經營」，名單裡是業主、佃戶和製糖業者。
      - null
      - 條文明明白白寫了「佃戶」和「製糖業者」，沒有把他們排除在外。
      - 條文把製糖業者列進共同經營的名單，不是旁觀者。
    critique:
      question: "這句話出自請願書，卡片說明它是郭雲萍文章註腳的中文譯引，本站沒讀到原件。讀這句話，哪個判斷最穩妥？"
      options:
        - 這是總督府寫給上級的內部命令，詳細記錄大圳完工後每年實際怎麼運作
        - 它證明佃戶在大圳的決策裡，和大地主有一樣大的發言權與決定權
        - 它證明製糖會社只是在一旁旁觀，完全沒有從大圳得到任何好處
        - 這是請願書的寫法，看得出申請者的構想，但不能證明各方聲音一樣大
      answer: 3
      explain: 請願書是「申請興建」的文件，寫的是申請的人想怎麼管理，能讓我們看到製糖業者也在經營名單上；但它不能證明開會、分水、收費的時候，業主、佃戶和糖廠的聲音一樣大。卡片還記錄佃農因租約不穩，不願照輪作規定耕種，欠繳水租也可能被查封，可見實際的處境不一定像條文寫的那樣平等。而且這句是轉引的中文譯文，不是原件。
      why_wrong:
        - 它是請願書，是申請人寫給官方的文件，不是總督府的命令，也不是完工後的運作紀錄。
        - 條文只說「共同經營」，沒有說每一方的決定權一樣大；卡片還寫到佃農租約不穩、欠繳水租可被查封。
        - 製糖會社的代表在請願名單裡，還要求配合修排水路、提供補助，可見會社有自己的利益。
        - null
  - type: card
    id: commodity-taiwan-sugar
    depth: deep
    prompt: 再看糖廠。讀「產地與控制權」時注意「原料採取區」讓蔗農只能賣給誰；讀「史家怎麼吵」與「常見誤解」時注意，柯志明和吳聰敏說的不是同一個層面，不要把任何一人的話當成定論。
    focus: [B2, debate, misc]
    quick:
      - q: "「原料採取區」是什麼？柯志明說它讓糖廠成為什麼？"
        a: "政府替糖廠劃好區域，區內的甘蔗只能賣給指定的那一家廠，不能越區外賣。柯志明指出，這讓每家糖廠在自己的區內成為「唯一的買主」。"
      - q: "「蔗農全部都被強迫種甘蔗」這句話對不對？柯志明和吳聰敏各說了什麼？"
        a: "吳聰敏寫道，新式糖廠的甘蔗大部分來自契約蔗農，種植季前先公告價格，農民自己決定要不要種；柯志明指出，原料採取區讓糖廠成為區內唯一買主，農民能不能賣到好價錢，並不是自己決定的。兩人說的是不同層面，所以不能簡單說對或錯。"
  - type: source
    card: commodity-taiwan-sugar
    idx: 0
    question: "二林一帶流行的俚語說「第三戇，插甘蔗給會社磅」。「給會社磅」這句，在抱怨什麼？"
    options:
      - 甘蔗的種植工作太辛苦，而且收成還要看天氣好壞
      - 會社把甘蔗的價格訂得太高，所以農民根本買不起
      - 甘蔗由會社來秤重算錢，農民只能照著拿
      - 農民不應該種甘蔗，而是應該全部改種稻米才對
    answer: 2
    explain: 「磅」是把甘蔗放在磅秤上秤重，重量決定能領多少錢；「給會社磅」就是由會社秤、會社算。這句話在說，秤子在買方手上，賣方只能看買方報重量。卡片也提醒，這句俚語有不同版本：謝四海記的是三句，種甘蔗排第三戇；王燈岸記的是一句「第一憨，種甘蔗隨人磅」，俚語是口頭流傳，沒有固定的原文。
    hints:
      - 「磅」是什麼動作？想想賣東西時，秤子放在誰手上。
      - 「戇」是「傻」的意思：這句話是在說，做這件事的人有點傻。傻在哪裡？
      - 「給會社磅」就是由會社秤重、會社算錢。
    ref: commodity-taiwan-sugar#story
    why_wrong:
      - 俚語裡的「傻」，是指秤重和算錢都由會社決定，不是在說天氣或收成。
      - 農民是賣甘蔗的人，不是買的人；俚語在說他們賣的時候沒有主導權。
      - null
      - 俚語沒有說該改種什麼；它抱怨的是秤重、算錢都由會社決定。
    critique:
      question: "這句俚語是口耳相傳的話，兩位作者記下的版本不同。讀它，哪個判斷最穩妥？"
      options:
        - 二林一帶有人這樣抱怨，但不能證明每個蔗農都同意，也不能證明價差多少
        - 它證明所有蔗農都是被強迫種甘蔗的，沒有任何人是自己決定要種的
        - 它證明糖廠一定每次都少算重量，被當場抓到作假
        - 它是總督府公布的調查，正確記錄了每個農家的收入
      answer: 0
      explain: 俚語是民間口頭流傳的話，能讓我們聽到蔗農的不滿，也看出「誰秤重、誰算錢」是他們在意的事；但它不是統計，不能證明每個蔗農都這樣想，也不能證明少算了多少。吳聰敏寫的是農民可以自己決定要不要種，柯志明寫的是賣給誰、賣多少錢不是農民決定的；蕭喬尹還提到農民的不滿有一部分來自和別家糖廠比價。這幾種說法要並列。它也看不到沒有開口說話的人，例如不在二林的蔗農和糖廠的人。
      why_wrong:
        - null
        - 吳聰敏寫農民自己決定要不要種；俚語只能說明賣的時候有不滿，不能證明人人被強迫。
        - 俚語在說誰有權秤重，沒有說會社作假；卡片的價格數字也各來源不同。
        - 俚語是民間流傳的話，不是官方調查，也沒有記錄農家收入。
  - type: chain
    prompt: 把下列事情排成一條線（最上面是最早的）。排的時候想一想：哪些是前一件促成後一件，哪些只是接著發生？
    items:
      - 日本對臺灣糖免進口關稅，總督府也補貼，新式糖廠在保護下成長
      - 政府替糖廠劃定原料採取區，區內蔗農只能把甘蔗賣給指定的那一家廠
      - 製糖會社的代表加入嘉南大圳的請願連署，總督府開始興建大圳
      - 大圳開工後，組合開始向農民收水租，欠繳者的不動產可被查封
      - 二林蔗農發現價錢比鄰近糖廠低，組成蔗農組合要求公開價格，後來發生衝突與逮捕
    explain: 糖業先在免關稅與補貼的保護下長大，再有原料採取區讓糖廠成為區內唯一買主。蔗田需要排水和穩定供水，製糖會社因此派代表參與嘉南大圳的請願，也提供補助、要求水利組合配合（卡片沒有寫補助是哪一年開始的，所以不放進排序）；大圳開工後，農民從第二年起繳水租。二林蔗農覺得價錢比鄰近糖廠低，才在文化協會成員李應章等人協助下組成蔗農組合，1925 年衝突後有 93 人被捕。這條線大致依時間與因果排列，但並不是每一格都有卡片明確寫出的因果，請看下面的追問。
    hints:
      - 最早的一件事，是糖業怎麼被保護、養大的，答案在糖業卡的故事裡。
      - 糖廠要有「唯一買主」的位置，需要先有保護，也要先有劃好的區域。
      - 水租是大圳開工後才開始收的；二林蔗農組成組合、發生衝突，比開始收水租更晚，排在最後。
    ref: commodity-taiwan-sugar#B2
    followup:
      question: "這條線上的幾組，哪一組是卡片明確寫了「前一件促成後一件」？（其他幾組，卡片只各自寫了事情，沒有明說因果，但這不代表它們一定沒有關係。）"
      options:
        - 農民開始繳水租 → 二林蔗農組成蔗農組合
        - 糖廠成為區內唯一買主 → 二林蔗農發現價錢比別廠低
        - 蔗田需要排水與穩定供水 → 製糖會社派代表參與大圳的請願
        - 免關稅與補貼 → 劃定原料採取區
      answer: 2
      explain: 糖業卡的「影響」欄寫，蔗田要排水與穩定供水，製糖會社因此派代表參與請願，也提供補助要求水利組合配合；嘉南大圳卡的「原因」欄也寫了糖業促成大圳。其他幾組，卡片分別寫了各自的事：水租從 1921 年起收、二林事件在 1925 年、原料採取區是 1905 年的規則，但沒有明說前一件造成了後一件。沒寫不等於沒有關係，只是這一課不把它當成定論。
      why_wrong:
        - 卡片寫了水租和蔗農組合各自是怎麼回事，但沒有說前者促成後者。
        - 卡片寫了「唯一買主」，也寫了二林蔗農發現價錢較低，但沒有直接寫前者造成後者；這個關係是讀者可以推想的，但不是卡片的明說。
        - null
        - 卡片寫了免關稅與補貼，也寫了 1905 年確立原料採取區，但沒有說前者促成後者。
  - type: card
    id: event-taiwan-urban-culture
    depth: deep
    prompt: 換到城市。這張卡的「摩登」是真的，但不是人人都過得到。讀「受益者與受損者」時注意誰被算進去、誰被排除；讀「史家怎麼吵」時注意三位作者各提醒了什麼。
    focus: [C2, C5, debate]
    quick:
      - q: "電台成立一年後，登記的收音機裡有多少是臺灣人的？節目主要是給誰聽的？"
        a: "電台成立一年後登記的收音機超過 9,400 台，其中只有約四分之一是臺灣人的；節目主要針對在臺日本人。不過咖啡館、餐廳會裝喇叭播放廣播吸引客人。"
      - q: "姚明俐（以林百貨為例）提醒了什麼？"
        a: "她指出，市民把林百貨看成「繁榮的象徵」，今天介紹它時也常只強調日治時期「美好舊日的一面」；而且當時評估客群的計算方式只算日本人，「並未將臺灣本島人納入計算之中」。"
  - type: source
    card: event-taiwan-urban-culture
    idx: 0
    question: 王詩琅小說〈夜雨〉裡，主角走在臺北街上。這兩句描寫的是什麼畫面？
    options:
      - 鄉下的村莊晚上沒有電，四周都是一片漆黑的
      - 百貨公司裡搭電梯的新奇經驗，覺得很時髦
      - 一列夜車穿過黑夜，車廂裡旅客坐得滿滿的
      - 大馬路兩旁商店林立，電燈漸漸亮起
    answer: 3
    explain: 原文寫「廣闊的太平町道、兩旁櫛比的大店舖」，傍晚夜色裡「輝煌的電光，漸漸地逞威、要代替太陽支配世界了」。所以是臺北大馬路兩旁店舖林立、電燈亮起來的景象。電梯是林百貨的故事，夜車是鄭坤五漢詩的內容，都不在這兩句裡。
    hints:
      - 先找地名：「太平町道」是在城市還是鄉下？
      - 「櫛比的大店舖」「輝煌的電光」分別在寫什麼？
      - 四個選項裡，哪一個同時有大馬路、商店和電燈？
    ref: event-taiwan-urban-culture#C2
    why_wrong:

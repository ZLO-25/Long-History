    start: -70000
    end: -10000
    precision: stations-only
    note: 一般認為智人約 7 萬到 5 萬年前離開非洲、擴散到歐亞 [s1]；其中一說是沿阿拉伯半島南岸、南亞海岸往東的「南方路線」，另有經黎凡特的「北方路線」，兩說並存 [s1]。抵達澳洲的年代有約 6.5 萬年前（馬傑德貝貝）與約 5 萬年前兩說 [s2][s3]；蒙哥湖的埋葬約 4 萬年前 [s4]。東非、曼德海峽、南亞、巽他三點只是示意位置，線**不是**實際走法。

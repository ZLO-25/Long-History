- { id: finance-amsterdam-wisselbank, type: finance, track: west, name: 阿姆斯特丹匯兌銀行（Wisselbank）, time: "1609–1820", civ: "荷蘭", brief: "1609成立、解決劣幣混雜、銀行貨幣（bank guilder）與溢價agio、匯票必須經它結算、被稱為早期中央銀行原型（Quinn & Roberds研究）、1780年代對東印度公司放款後喪失信用、1795/1820關閉。" }
- { id: finance-mississippi-bubble, type: finance, track: west, name: 約翰·羅與密西西比泡沫, time: "1716–1720", civ: "法國", brief: "路易十四留下的債務、約翰·羅的通用銀行1716→皇家銀行、密西西比公司以國債換股、紙幣大發行、1720崩潰；法國因此長期不信任紙幣與銀行，相對英國金融落後（連南海泡沫同年）。" }
- { id: finance-amsterdam-decline, type: finance, track: west, name: 阿姆斯特丹金融中心的衰落, time: "1763–1795", civ: "荷蘭", brief: "1763信用危機（Neufville破產）、1772–73危機、第四次英荷戰爭1780–84、東印度公司1799解散、法軍入侵1795建巴達維亞共和國、荷普銀行等移往倫敦；荷蘭資本仍大量投資英國國債與美國。" }
- { id: finance-london-rise, type: finance, track: west, name: 倫敦取代阿姆斯特丹：拿破崙戰爭與羅斯柴爾德, time: "1793–1815", civ: "英國, 荷蘭, 法國", brief: "英國國債與財政軍事國家、1797停止兌換金、霸菱與內森·羅斯柴爾德、拿破崙戰爭融資與滑鐵盧後倫敦成為世界金融中心（駁斥滑鐵盧內線致富迷思）。" }
- { id: finance-gold-standard, type: finance, track: west, name: 古典金本位與英鎊時代, time: "1821–1914", civ: "英國, 日耳曼與法蘭克/德國, 美國（內戰與工業化）", brief: "英國1821恢復金兌換、1844銀行特許法、德國1871–73轉金本位、各國跟進、倫敦匯票與英鎊為國際結算中心、白銀貶值對中國與印度的衝擊；1914一戰中止。" }
- { id: finance-new-york-overtakes-london, type: finance, track: west, name: 紐約取代倫敦：一戰後英鎊退位, time: "1914–1931", civ: "美國（世界強權）, 英國", brief: "一戰英國向美國大舉借款（J.P.摩根代理）、美國從債務國變債權國、1913聯準會讓紐約承兌匯票市場出現、1925邱吉爾以戰前平價回歸金本位、1931英國放棄金本位；之後布列敦森林美元正式接班。" }
- { id: finance-eurodollar-big-bang, type: finance, track: west, name: 歐洲美元市場與倫敦金融城「大爆炸」, time: "1957–1986", civ: "英國, 美國（世界強權）", brief: "冷戰時蘇聯把美元存在歐洲、1957英鎊危機、Q條例與利息平衡稅推動美元離岸化、倫敦成為美元在海外的中心、1986柴契爾大爆炸金融自由化。中心不一定跟著貨幣走。" }
- { id: finance-japan-bubble, type: finance, track: east, name: 日本泡沫經濟與東京的興衰, time: "1986–1991", civ: "日本（近現代）", brief: "廣場協議後低利率、日經1989-12-29高點38915、東京皇居地價傳說、日本銀行升息與不動產融資總量管制、崩盤與失落的十年；東京曾被看好取代紐約。" }
- { id: finance-asian-financial-crisis, type: finance, track: east, name: 1997 亞洲金融風暴, time: "1997–1998", civ: "東南亞/泰國, 東南亞/印尼, 朝鮮（近現代）, 香港", brief: "1997-07-02泰銖放棄釘住美元、短期美元外債、IMF紓困與條件爭議、韓國、印尼蘇哈托下台、香港捍衛聯繫匯率；臺灣相對未受重創的原因（查證）。" }
- { id: finance-euro, type: finance, track: west, name: 歐元誕生與歐債危機, time: "1999–2012", civ: "日耳曼與法蘭克/德國, 法國, 義大利, 歐盟", brief: "馬斯垂克條約1992、1999歐元記帳/2002紙鈔、單一貨幣挑戰美元、2010希臘危機、2012德拉吉『不惜一切代價』；為何歐元沒取代美元。" }

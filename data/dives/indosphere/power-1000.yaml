# 南進與吳哥示意圖：以今日越南、柬埔寨的省（Natural Earth 10m 舊省界）近似當時的勢力範圍；寮國、泰國整國用經緯線切出一部分。
# npm run power 會拼成同名 .geojson（底圖 data/ne/indochina_provinces.geojson，npm run basemap -- IC）。邊界只是示意。
year: 1000
basemap: indochina_provinces
title: 三國並立：大瞿越（後來的大越）、占婆、吳哥（約 1000 年）
note: 938 年越南北部自主，此時國號叫「大瞿越」（1054 年才改稱大越），範圍只到今天的河靜；占婆沿著中部海岸由好幾個地區組成，政治中心傳統上認為在 982 年後從因陀羅補羅（今廣南）南移到毗闍耶（今平定），也有研究認為毗闍耶要到 12 世紀中才成為中心；吳哥王朝控制洞里薩湖周圍與湄公河下游，勢力也伸進今天泰國東北與寮國南部。長山山脈的高地各族不直接受任何王朝統治。今天泰國、寮國只畫出受吳哥影響的部分，界線全是示意。
view: [[8, 99], [23.5, 110.5]]

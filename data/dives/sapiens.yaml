      en: A Permanent Revolution
      claim: |
        哈拉瑞指出，過去照顧人的是家族和村落；現代國家和市場接手了這些工作，讓人變成「個人」，但他懷疑這是否讓人更快樂 [b18]。他把國家稱為「想像的共同體」，靠國旗、神話和象徵把陌生人連在一起 [b18]。他也認為核武讓大戰形同集體自殺，而貿易比戰爭更有利可圖，所以國際大戰變少、多數人活在相對和平中，但未來仍可能逆轉 [b18][b26]。
      cards:
        - war-world-war-one
        - war-world-war-two
        - event-end-of-cold-war
        - war-war-on-terror
        - event-nuclear-long-peace
      debate:
        - who: 達珊娜・納拉亞南（Darshana Narayanan，神經科學家）
          text: 書中「和平時代」一節把暴力減少主要歸功於國家興起，並拿「住在亞馬遜森林深處、沒有軍隊、警察和監獄」的厄瓜多瓦奧拉尼人當沒有國家的例子；她指出瓦奧拉尼人自 1970 年代初以來大致過著和平生活，這個例子用得不妥 [b29]。
          src:
            - b29
      think: 哈拉瑞認為核武和貿易讓大國之間的戰爭變得不划算。讀「第一次世界大戰」卡：當時沒有核武，各國靠什麼維持和平，結果如何？再對照「冷戰結束」卡，你覺得是什麼讓美蘇沒有直接開戰——核武、貿易，還是別的？
    - no: 19
      part: 4
      title: 我們比祖先更快樂嗎？
      en: And They Lived Happily Ever After
      claim: |
        哈拉瑞指出，歷史學很少問「人類有沒有變快樂」，而他認為答案可能是沒有，甚至採集者還更快樂 [b19][b22]。他主張快樂主要取決於期望，而不是客觀條件：生活一改善，期望就跟著膨脹 [b19]。他也討論快樂的生化基礎、宗教給人的意義感，並介紹佛教「放下對感受的追逐」的觀點 [b19][b26]。
      cards: []
      debate:
        - who: 理查・伊斯特林（Richard Easterlin，經濟學家）
          text: 他 1974 年提出「伊斯特林悖論」：在同一時間點，收入較高的人和國家比較快樂；但長期來看，一個國家收入成長，快樂程度卻沒有跟著上升 [b53]。這和書裡「期望會跟著膨脹」的說法相近。
          src:
            - b53
        - who: 貝琪・史蒂文森與賈斯汀・沃爾弗斯（Betsey Stevenson & Justin Wolfers，經濟學家）
          text: 她們 2008 年的研究認為，伊斯特林的結論來自統計上不夠顯著的資料；用更多國家的長期資料，可以看到收入和快樂有明顯的正相關，日本「沒變快樂」的印象部分是問卷題目改變造成的。伊斯特林在 2017 年回應，認為這些研究的時間太短，只反映短期起伏，不是長期趨勢 [b53]。這場爭論到今天還沒有定論。
          src:
            - b53
      think: （討論題）如果快樂主要取決於期望，那麼「生活水準提高」還值得追求嗎？請舉一個你自己或家人的例子，說明期望和滿足感的關係，再想想：歷史學家能用什麼證據比較古人和今人的快樂？
    - no: 20
      part: 4
      title: 智人會被自己取代嗎？
      en: The End of Homo Sapiens
      claim: |
        哈拉瑞指出，生命靠天擇演化了約 40 億年，而人類正開始用基因工程、人機結合（生化人）和人工智慧，自己設計下一步 [b20][b26][b22]。他舉出被植入水母基因而會發光的兔子、裝了晶片的昆蟲等例子，並擔心政府或企業可能打造出「超人菁英」 [b20]。他承認這些多屬推測，但呼籲大眾趁早參與決定科學研究的方向 [b20][b26]。
      cards: []
      debate:
        - who: 達珊娜・納拉亞南（Darshana Narayanan，神經科學家）
          text: 她批評書的最後一章（「為什麼不重新設計更好的智人？」）把基因看得太有決定性；她舉 MAO-A 基因為例，說明基因和攻擊性的關聯並不是一對一；她強調發育和環境都會影響基因如何表現，所以「改幾個基因就能設計人」的想像過於簡化 [b29]。
          src:
            - b29
        - who: 克里斯多福・哈派克（Christopher R. Hallpike，人類學家）
          text: 他在書評中指出，這本書以「令人毛骨悚然」的人類命運預言作結（例如人類最後會被智慧機器取代），並認為不該把它當成嚴肅的知識貢獻，而應看作「資訊娛樂」（infotainment）；本站只讀到這篇書評的轉載節錄 [b28][b22]。
          src:
            - b28
            - b22
      think: （討論題）如果有一天可以用基因工程讓孩子更聰明，誰應該決定能不能做？請列出支持和反對的理由各一個，並想想：你的理由是根據證據，還是根據價值觀？

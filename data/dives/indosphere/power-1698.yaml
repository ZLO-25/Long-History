# 南進與吳哥示意圖：以今日越南、柬埔寨的省（Natural Earth 10m 舊省界）近似當時的勢力範圍；寮國、泰國整國用經緯線切出一部分。
# npm run power 會拼成同名 .geojson（底圖 data/ne/indochina_provinces.geojson，npm run basemap -- IC）。邊界只是示意。
year: 1698
basemap: indochina_provinces
title: 阮主設嘉定、占婆成為附庸（1698 年）
note: 1697 年占婆最後的中心賓童龍（今寧順、平順）成為越南南方阮主的附庸；更北邊的富安、慶和在這之前已被阮主取得。1698 年阮有鏡在今胡志明市一帶設嘉定府，越南人開始在湄公河三角洲東北角定居；三角洲大部分仍屬柬埔寨。此時越南分成北方鄭主與南方阮主，圖上合為一色。界線只是示意。
view: [[8, 99], [23.5, 110.5]]

id: unit-america-rise
title: 美國崛起（上）：從十三個殖民地到憲法，立國的制度與想法
histories:
- 美國史
- 美洲史
- 錢的歷史
- 世界通史
mystery: 美國為什麼這麼強？先從制度和想法看：殖民地自治、獨立宣言、憲法，每一步靠什麼想法支撐，又讓誰付出了代價？
teaser: 從 1619 年的一場殖民地議會，到 1787 年的憲法，美國先把「權力從哪來、怎麼限制」寫成規則。下一課再看財政、土地、工業與美元。
goals:
- 能說出殖民地自治、獨立宣言與憲法分權，各自替美國打下什麼基礎
- 能說出自然權利、同意統治、分權與制衡等想法，如何一路連到《獨立宣言》、憲法與《聯邦黨人文集》，並知道學界對洛克影響大小、自由主義與共和主義的看法不同
- 能判讀獨立宣言、憲法的原文，說出它們實際寫了什麼、沒寫什麼
- 能分辨後見之明與倖存者偏差，不把歷史當成投資建議
minutes: 30
level: 皆可
curriculum: []
steps:
- type: hook
  text: |
    想像一個班級：一開始是幾個同學自己訂班規，班費怎麼花由大家選出的代表決定。
    後來班級越辦越大，有人負責管帳，讓大家相信「借出去的錢一定會還」；班上也一直找到新的空間和資源。
    但如果你只看這個班級後來多風光，就會漏掉兩個問題：每一步到底是怎麼走成的？有誰其實沒有被問過意見？
    這個單元要一起看美國怎麼走到今天。我們不找「唯一的答案」，而是把幾種解釋並排，再看每一種解釋的代價。
    這一課是上半場：先看制度與立國思想。財政、土地、工業與美元留給下一課。
  guess:
    q: 1776 年，殖民地的人說他們可以脫離英國，最主要的理由是什麼？
    options:
    - 英國國王是外國人，所以沒有資格管北美
    - 政府的權力要來自被治理者的同意，不能未經同意就向人民課稅
    - 英國軍隊已經占領所有殖民地，所以必須先把軍隊趕走
    - 殖民地已經很富有，所以不需要再繳稅給任何政府
    reveal: 《獨立宣言》先講道理：人人生而平等，政府的正當權力來自被治理者的同意；再列出對英王的控訴，其中一條就是未經同意就向殖民地課稅。
- type: card
  id: event-thirteen-colonies
  depth: understand
  prompt: 先回到 1607 年。注意兩件事：殖民地離英國很遠、管得鬆，議會因此握有什麼權力？1763 年戰勝法國之後，英國為什麼開始想讓殖民地分擔成本？
  focus: [C4, C6, C7]
  quick:
  - q: 英國離得遠、管得鬆，殖民地議會因此多了什麼？
    a: 殖民地議會握有愈來愈多課稅與預算的權力，在本地事務與稅收上取得相當的發言權。這些議會經驗，後來成為獨立後建立州政府與聯邦制度的底子。
  - q: 1763 年英國打贏法國，為什麼反而開始想讓殖民地分擔成本？
    a: 戰勝後英國取得大片土地，卻也背上沉重的債務，還需要在北美駐軍。倫敦因此開始思考讓殖民地分擔，衝突的伏筆就此埋下。
- type: card
  id: event-american-founding-philosophy
  depth: deep
  prompt: 殖民地人憑什麼說「我們可以脫離英國」？先讀故事與三段原文，認識自然權利、同意統治、社會契約、分權與共和主義。再看「史家怎麼吵」：洛克自由主義派與 Bailyn、Wood 這一派，對建國者主要受誰影響看法不同，這張卡並列兩種說法，沒有裁決。
  focus: [terms, C4, debate]
  quick:
  - q: 「同意統治」是什麼意思？人民不同意的話，會怎麼樣？
    a: 政府有權力統治，是因為被統治的人同意。人民不同意，政府就失去正當性；宣言還寫到，人民有權改變或廢除不保障這些權利的政府。
  - q: 很多人以為《獨立宣言》是照抄洛克，其實呢？
    a: 洛克把自然權利概括為生命、自由與財產，宣言寫的卻是「生命、自由與追求幸福」，所以不是照抄。學者對影響來源也有不同看法：洛克派強調宣言接近洛克，Bailyn 則指出殖民地人讀得最多的是英國反對派對權力腐化的警告。
- type: source
  card: event-american-founding-philosophy
  idx: 0
  question: 《獨立宣言》寫「政府的正當權力來自被治理者的同意」，這句話最能說明什麼？
  options:
  - 只要政府的武力夠強大，就有資格統治，不必問人民的意見
  - 人民一旦同意某個政府，就永遠不能再改變或廢除它
  - 宣言明確規定了立法、行政、司法三權分立的政府架構
  - 政府能不能統治，要看被治理的人是否同意，不是靠血統
  answer: 3
  why_wrong:
  - 宣言說政府的權力來自同意，不是來自武力；沒有人民同意，政府就失去正當性。
  - 宣言寫人民有權「改變或廢除」不保障這些權利的政府，同意之後並不是永遠不能改。
  - 宣言沒有規定政府的架構；用條文設計三權分立，要到 1787 年的憲法。
  - null
  critique:
    question: 這句話出自《獨立宣言》，是殖民地領袖寫的。關於這份文件，下列哪個判斷最穩妥？
    options:
    - 它寫下「同意」原則，但「人人」不含奴隸與原住民，不能說人人都有權同意
    - 它證明從 1776 年起，美國所有居民都能參與決定政府要怎麼治理，沒有人被排除
    - 它證明所有殖民地居民都支持獨立，當時沒有任何人站在英國那一邊，所以不用反對
    - 它的字句完全是洛克的原文，所以只代表洛克的想法，不是殖民地人自己的主張
    answer: 0
    explain: 宣言寫下了很重要的原則，但同一份文件的「人人」，在當時並不包括奴隸與原住民族，女性也沒有被提到；而且還有仍忠於英王的效忠派。所以它能證明「殖民地領袖提出了這樣的主張」，不能證明當時所有人都享有同意統治的權利。
    why_wrong:
    - null
    - 當時奴隸、原住民族與女性並沒有參與決定政府，「人人」並不包括他們。
    - 當時還有仍忠於英王的效忠派，不是所有人都支持獨立。
    - 宣言把洛克的「生命、自由與財產」改成「生命、自由與追求幸福」，不是照抄原文。
  explain: 這句話把政府正當性的來源放在被治理者的同意。這是宣言的主張，和洛克談同意統治的語言很接近；不過這張卡也提醒，宣言寫的是「生命、自由與追求幸福」，不是洛克原本的「生命、自由與財產」，所以不是照抄洛克，學界對洛克影響有多大也有不同看法。宣言同時寫到人民有權「改變或廢除」不保障這些權利的政府，所以「同意之後就永遠不能再改變政府」的說法不對；三權分立要到憲法才用條文設計，宣言並沒有規定。
  hints:
  - 先找關鍵詞「consent of the governed」，政府的權力是誰給的？
  - 宣言有沒有說人民同意後就不能改變政府？回想卡片的「制度或機制變化」。
  - 分權是 1787 年憲法才處理的事，宣言這一句在談的是什麼？
  ref: event-american-founding-philosophy#C4
- type: card
  id: event-declaration-of-independence
  depth: deep
  prompt: 讀完故事與三段原文後，特別看「史家怎麼吵」：「人人生而平等」是偽善，還是後人可以要求兌現的承諾？
  focus: [debate]
  quick:
  - q: 為什麼說《獨立宣言》不只是一份哲學文件，也是一份政治文件？
    a: 宣言開頭就說，出於對人類輿論的尊重，應該說明促使他們分離的原因。它的目的是爭取國內外的支持，所以不只是講道理，也是在說服別人。
  - q: 「人人生而平等」是偽善，還是承諾？兩邊各怎麼說？
    a: 批評者指出，傑佛遜自己擁有奴隸，大會還刪掉他譴責奴隸貿易的段落，可見「人人」不包括所有人。另一種看法是，這些文字成了後人要求兌現的標準，林肯 1863 年的蓋茨堡演說就以此作為建國主張。
- type: source
  card: event-declaration-of-independence
  idx: 2
  question: 《獨立宣言》把「未經我們同意就向我們課稅」列為對英王的控訴之一，最能說明殖民地人民的主張是什麼？
  options:
  - 殖民地人民反對任何政府向人民收稅，不管有沒有代表
  - 課稅要經過自己或代表的同意，不能由遠方單方面決定
  - 英國從來沒有向殖民地徵收過稅，這條控訴只是虛構的罪名
  - 殖民地人民認為稅該由英王一個人決定，國會不能插手
  answer: 1
  why_wrong:
  - 宣言反對的是「未經同意」的稅，不是所有的稅；重點在有沒有自己的代表參與。
  - null
  - 1763 年之後英國確實開始向殖民地徵新稅（例如 1765 年的印花稅法），這條控訴有它的背景。
  - 殖民地要的是由自己或自己的代表同意，不是把決定權交給英王一個人。
  critique:
    question: 這份控訴清單是殖民地領袖寫的。關於這份清單，下列哪個讀法最穩妥？
    options:
    - 這是殖民地一方的說法，目的是爭取支持；英國怎麼看要另外對照
    - 這是中立的第三方整理出來的事實清單，每一條都已經被逐條證實，沒有爭議
    - 這是英王寫給殖民地的信，信裡承認自己課稅不對、向殖民地道歉
    - 這只是文字上的修辭，和 1760 年代英國的稅制與政策完全沒有任何關係
    answer: 0
    explain: 宣言是一份對內對外的政治文件，目的是爭取國內外的支持，控訴清單是殖民地這一方的說法。例如英國就主張國會可以「虛擬代表」殖民地。所以清單能讓我們看到殖民地人為什麼不滿，但要了解英國的立場，還得另外找證據。
    why_wrong:
    - null
    - 這份清單是殖民地一方寫的，立場並不中立，也沒有被第三方逐條證實。
    - 宣言是殖民地寫來控訴英王的，不是英王寫的，更沒有道歉。
    - 清單對應 1760 年代的新稅與口號「無代表不納稅」，有具體的歷史背景。
  explain: 這條控訴對應 1760 年代的口號「無代表不納稅」：殖民地認為自己沒有代表在英國國會，稅就不該被強加；英國則主張國會可以「虛擬代表」殖民地。但也要記得，宣言是一份爭取國內外支持的政治文件，這張控訴清單是殖民地這一方的說法。
  hints:
  - 先找原文裡的關鍵字「without our Consent」，它在講什麼？
  - 回想 1760 年代殖民地喊出的口號，是不是跟「代表」有關？
  - 這句話是反對「所有稅」，還是反對「沒經過我們同意的稅」？
  ref: event-declaration-of-independence#C1
- type: card
  id: event-us-constitution
  depth: deep
  prompt: 注意《邦聯條例》哪裡太弱、憲法怎麼分權，也看看「五分之三妥協是讓步，還是壓制」這段史家的討論。
  focus: [C1, C4, debate]
  quick:
  - q: 《邦聯條例》下的國會哪裡太弱？憲法怎麼補救？
    a: 條例下的國會沒有直接徵稅權，也沒有行政首長，修改條例還要十三州全數同意。憲法授予國會徵稅與管理州際商業的權力，另外設立總統與法院，各自分掌一部分權力。
  - q: 五分之三妥協：南方和北方原本各主張什麼？結果對誰比較有利？
    a: 南方原本主張奴隸全額計入人口，北方主張不計，雙方各退一步才談成。它是計算眾議員席次與直接稅的規則，讓蓄奴州在眾議院與選舉人團中取得較大的政治影響力。
- type: source
  card: event-us-constitution
  idx: 1
  question: 憲法第 1 條第 2 款寫的「所有其他人口的五分之三」，實際上是在規定什麼？
  options:
  - 計算眾議員席次與直接稅時，奴隸人口怎麼計入的規則
  - 宣告奴隸在法律上只算五分之三個人，權利也只有一般人的五分之三
  - 規定奴隸制從這條條文生效後要逐步廢除，時程由各州自行決定
  - 讓奴隸可以在選舉中投票，每張票只算五分之三票
  answer: 0
  why_wrong:
  - null
  - 它是人口的計數規則，不是在說奴隸的價值或權利只有五分之三；被計入的人也沒有因此享有憲法權利。
  - 憲法沒有規定奴隸制要廢除；它把問題延後處理，還規定 1808 年以前國會不能禁止輸入。
  - 它是計算席次與直接稅的規則，不是投票規則；被計入的人本身沒有投票權。
  critique:
    question: 這段憲法條文沒有使用「奴隸」一詞，只寫「所有其他人口」。這個寫法最能提醒我們什麼？
    options:
    - 條文沒寫「奴隸」不代表奴隸制不存在，還要對照其他條款才看得出影響
    - 因為條文沒寫「奴隸」，所以在憲法之下，奴隸制當然是不合法的、已經被禁止
    - 因為條文沒寫「奴隸」，所以這條規則完全不會影響蓄奴州的政治力量和席次
    - 條文改用「其他人口」，是因為當時的奴隸已經享有完整的公民權，不需再特別提到
    answer: 0
    explain: 條文用字雖然沒有「奴隸」，但同一部憲法規定國會 1808 年以前不得禁止既有各州輸入「此類人口」，還加入逃亡者歸還條款；五分之三規則也讓蓄奴州取得較大的政治影響力。讀條文時，不能只看字面，還要看它在整部憲法與當時政治裡實際造成什麼。
    why_wrong:
    - null
    - 憲法沒有廢除奴隸制，還規定 1808 年以前國會不得禁止輸入，並有逃亡者歸還條款。
    - 這條規則讓蓄奴州在眾議院與選舉人團中取得較大的影響力。
    - 被計入的人本身並沒有因此享有憲法權利，更談不上完整的公民權。
  explain: 它是計算眾議員席次與直接稅分配的計數規則，不是在說「奴隸只算五分之三個人」；憲法條文甚至沒有使用「奴隸」一詞。維基百科整理的看法指出，它讓蓄奴州在眾議院與選舉人團中取得較大的政治影響力。南方原本主張全額計入、北方主張不計，雙方各退一步才談成。被計入的人本身並沒有因此享有憲法權利，這是美國強大背後的一項代價。
  hints:
  - 看這句話出現的位置：憲法第 1 條在設立國會，第 2 款談的是什麼分配？
  - 「席次」和「直接稅」都跟「人口怎麼算」有關。
  - 想一想：被「計入」是不是就等於「得到權利」？
  ref: event-us-constitution#C2

    model_answer: 一開始的問題是「美國為什麼這麼強」，答案不是單一的。從制度看，殖民地議會與地方自治經驗是獨立後州政府與聯邦制度的底子，憲法再用成文規則分權，漢彌爾頓的財政計畫則讓新國家建立信用，不過當時就有人擔心富人與投機者獲利。從土地與資源看，購地使領土大約增加一倍，鐵路、鋼鐵與石油在鍍金時代長出巨型公司，但史家對邊疆論、對大資本家是「強盜大亨」還是「產業領袖」都有不同評價。從時機看，二戰剛結束時美國經濟遠強於其他主要國家，馬歇爾計畫提供超過 130 億美元援助，DeLong 與 Eichengreen 認為關鍵在它促成歐洲採取穩定財政與市場導向的政策，Milward 等學者則質疑援助的貢獻被誇大。從美元看，1944 年的規則把美元放在體系中心，1971 年之後它仍是最主要的儲備貨幣，但 IMF 統計中的占比會變化，今天也不能直接套用當年的情況。每一條解釋背後都有代價：奴隸制與五分之三規則、被迫遷移的原住民族（切羅基人估計約 4,000 人死亡）、割讓土地的墨西哥、面對壓力的工人和被排華法案排除的華人勞工。最後提醒：事後看很清楚的事，當時並不清楚，我們看到的也是倖存下來的故事；歷史可以幫我們理解強國怎麼形成，但不能用來預測市場，本單元不構成投資建議。

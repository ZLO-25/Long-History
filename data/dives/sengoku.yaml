# 深入專題：日本戰國。專題是疊在長河上的一層「放大鏡」：把一段時代的卡片、人物、故事線、勢力圖聚在一起。
# 怎麼新增一個專題見 docs/dives.md
id: dive-sengoku
title: 日本戰國：從應仁之亂到鎖國
question: 一個將軍還在、卻沒人聽他的國家，怎麼打了一百多年，最後被三個人接力收拾成一個關起門來的太平日本？
blurb: 這個專題把戰國一百七十年放大來看：誰在什麼時候最強、三位「天下人」各自做了什麼決定、鐵砲與白銀怎麼把日本接上世界，以及這段歷史和明朝、朝鮮、臺灣有什麼關係。
range: { start: 1467, end: 1639 }
histories: [日本史]
# 專題時間軸的軌道：每張卡依類型分軌（沒列到的類型放「其他」）
lanes:
  - { name: 政治與制度, types: [event, social, finance] }
  - { name: 戰役, types: [war] }
  - { name: 技術與對外, types: [tech, commodity] }
  - { name: 人物（在世期間）, types: [person] }
# 專題收錄的卡（人物卡也列在這裡；順序不重要，畫面依年份排）
cards:
  - war-onin
  - tech-tanegashima-arquebus
  - commodity-iwami-silver
  - war-okehazama
  - event-sengoku-japan
  - war-nagashino
  - event-honnoji-incident
  - event-toyotomi-unification
  - social-taiko-kenchi-katanagari
  - war-imjin
  - war-sekigahara
  - war-osaka-sieges
  - event-sakoku
  - person-oda-nobunaga
  - person-toyotomi-hideyoshi
  - person-tokugawa-ieyasu
  - person-akechi-mitsuhide
storylines: [story-sengoku, story-japan]
units: [unit-imjin-war]
# 大名勢力示意圖（data/dives/sengoku/power-<年>.yaml → npm run power）
power_maps:
  - { year: 1582, file: sengoku/power-1582.geojson }

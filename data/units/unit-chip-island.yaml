      - 1960 年代加工區讓臺灣累積電子組裝經驗，1970 年代十大建設補上交通和重工業
      - 1974 年起政府決定發展積體電路、向美國 RCA 學技術，1980 年竹科開幕，1987 年台積電選擇只做代工
      - 學者對「是不是政府計畫成功」看法不一：有人強調國家主導，也有人強調跨國人才和產業聚落
      - 這條路上也有人付出代價，例如加工區的女工和後來失業的工人
reflect: 台積電選擇「只替別人製造」時很少人看好，張忠謀後來說，那是在臺灣研發、設計都弱的條件下「最不壞的選擇」。你有沒有在選項不多的時候，從自己比較擅長的地方下手的經驗？後來結果怎麼樣？

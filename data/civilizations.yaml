# 文明分類：篩選面板「文明」用的三層樹（地區 > 文明／國家 > 朝代時期）
# 卡片的 civilization 欄位照寫原文，build-index 依本檔把每個寫法對應到樹上的路徑。
# 對應規則（依序）：
#   1. map 裡有這個寫法 → 用 map 指定的路徑（可多個）
#   2. 寫法剛好是某個文明名或別名 → 對應到該文明
#   3. 寫法是「文明（時期）」且時期在該文明的 periods 裡 → 對應到該時期
# 都對不上的寫法，validate 會警告，篩選面板放進「其他」。

regions:
  - name: 東亞
    civs:
      - name: 中國
        periods: [周, 春秋, 戰國, 秦, 西漢, 新, 東漢, 三國, 晉與十六國, 南北朝, 隋, 唐, 北宋, 南宋, 元, 明, 清, 中華民國, 中華人民共和國]
      - name: 北方草原
        aliases: []
        periods: [匈奴, 金, 蒙古帝國]
      - name: 臺灣
        aliases: [台灣]
        periods: [史前與原住民族, 荷西時期, 明鄭, 清治, 日治, 戰後]
      - name: 日本
        periods: [古代, 平安, 鎌倉, 室町, 戰國, 江戶, 明治, 近現代]
      - name: 朝鮮
        aliases: [朝鮮半島, 韓國]
        periods: [三國, 高麗, 朝鮮王朝, 近現代]
  - name: 中亞與西亞
    civs:
      - name: 中亞
        periods: [大宛]
      - name: 波斯
        periods: [阿契美尼德, 安息（帕提亞）]
      - name: 伊斯蘭世界
        aliases: [阿拉伯（伊斯蘭）, 阿拉伯]
        periods: [塞爾柱, 阿尤布王朝, 馬木路克, 鄂圖曼帝國]
  - name: 南亞與東南亞
    civs:
      - name: 印度
      - name: 東南亞
        periods: [麻六甲, 菲律賓, 爪哇]
  - name: 地中海古代
    civs:
      - name: 古希臘
        periods: [馬其頓]
      - name: 古羅馬
        aliases: [羅馬帝國, 羅馬]
        periods: [羅馬埃及]
      - name: 迦太基
      - name: 埃及
        periods: [托勒密埃及]
  - name: 歐洲
    civs:
      - name: 日耳曼與法蘭克
        periods: [日耳曼部落, 法蘭克王國, 神聖羅馬帝國, 德國]
      - name: 拜占庭帝國
      - name: 英國
        aliases: [英格蘭]
      - name: 法國
      - name: 伊比利半島
        periods: [葡萄牙, 西班牙]
      - name: 奧地利與哈布斯堡
        periods: [奧匈帝國]
      - name: 荷蘭
        aliases: [尼德蘭聯省共和國, 荷蘭共和國]
      - name: 法蘭德斯與比利時
        aliases: [比利時, 法蘭德斯, 南尼德蘭, 西屬尼德蘭]
        periods: [布魯日, 安特衛普]
      - name: 義大利
        periods: [威尼斯共和國, 熱那亞共和國, 佛羅倫斯共和國]
      - name: 俄羅斯與蘇聯
        periods: [俄羅斯, 蘇聯]
  - name: 美洲
    civs:
      - name: 美國
        aliases: [美利堅合眾國]
        periods: [殖民地時期, 建國初期, 內戰與工業化, 世界強權, 冷戰後]
      - name: 拉丁美洲
        aliases: [墨西哥, 古巴]


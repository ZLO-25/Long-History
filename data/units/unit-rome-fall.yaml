id: unit-rome-fall
title: 西羅馬為什麼會亡？一個問題，兩百多種答案
histories: [希臘羅馬史, 世界通史]
mystery: 羅馬曾經統治整個地中海，最後西半部卻在 5 世紀瓦解了。它到底是怎麼亡的？還是說，它其實沒有「亡」？
teaser: 一場森林裡的埋伏、一道橫越不列顛的牆、一船船埃及小麥，和一位被廢掉的少年皇帝。
goals:
  - 能依時間說出西羅馬瓦解前後的幾個關鍵事件
  - 能判讀一段耶柔米的書信，說出寫信的情境和它的限制
  - 能比較條頓堡森林戰役和哈德良長城，說出羅馬邊疆政策的變化
  - 能說明「衰亡」和「轉型」兩種看法，以及為什麼史家會吵這麼久
minutes: 35
steps:
  - type: hook
    text: |
      如果有人問：「你們班的籃球隊為什麼輸了？」答案可能有很多：對手太強、主將受傷、教練換人、練習太少、那天下雨……
      很難只挑一個原因，對吧？
      羅馬帝國西半部的瓦解，也是這樣。有一位德國史家統計過，光是「羅馬為什麼亡」的理論，就有 210 種。
  - type: card
    id: war-teutoburg
    depth: story
    prompt: 先回到帝國最強盛的時候。注意：打敗羅馬的阿米尼烏斯，原本是什麼身分？
  - type: card
    id: building-hadrians-wall
    depth: story
    prompt: 一百多年後，羅馬在不列顛北部蓋了一道牆。注意牆上有很多城門，以及守牆的是哪些士兵。
  - type: compare
    cards: [war-teutoburg, building-hadrians-wall]
    prompt: 比一比兩個羅馬邊疆的故事。
    rows:
      - { aspect: 時間地點, a: 西元 9 年，日耳曼尼亞（萊茵河以東）, b: 約西元 122 年起，不列顛北部 }
      - { aspect: 發生什麼, a: 三個軍團在森林中被伏擊，全軍覆沒, b: 築起約 117 公里長的牆，每一羅馬里有一座有守衛的城門 }
      - { aspect: 和「蠻族」的關係, a: 帶頭的阿米尼烏斯是在羅馬長大、替羅馬效力的輔助部隊軍官, b: 守牆的主要是來自帝國各地的輔助部隊士兵 }
      - { aspect: 後來, a: 羅馬停在萊茵河一線，沒有再征服這片土地, b: 堡壘一直用到 5 世紀初，羅馬統治不列顛結束才廢棄 }
    question: 從這兩個故事看，羅馬對邊疆的做法有什麼變化？「羅馬人」和「蠻族」真的分得很清楚嗎？
    model_answer: 條頓堡之後羅馬停止往日耳曼尼亞擴張；到了哈德良時代，更進一步用一道固定的牆來標示和管理邊界，有人把它看成帝國停止擴張的象徵。但這條界線並不是密不透風：牆上有很多城門讓人和貨物在監控下通過，而且雙方的人常常混在一起，打敗羅馬的阿米尼烏斯本身就替羅馬效力過，守牆的也多是來自各地的輔助部隊。
    hints:
      - 看「後來」那一列：羅馬還繼續往外打嗎？
      - 看「和蠻族的關係」那一列：兩邊的主角是什麼身分？
      - 長城的城門是做什麼用的？
  - type: card
    id: event-constitutio-antoniniana
    depth: story
    prompt: 「誰算羅馬人」這個問題，在 212 年有了大轉變。注意：同時代的人和現代學者，對皇帝的動機看法一樣嗎？
  - type: card
    id: commodity-egypt-grain
    depth: story
    prompt: 羅馬城住了幾十萬人，大家吃的麵包從哪裡來？記住「北非」這個地名，等一下會再出現。
  - type: decision
    role: 你是羅馬第一位皇帝奧古斯都
    situation: |
      國家把糧食便宜賣、甚至免費發給登記的羅馬公民，大約有 20 萬人。這要花很多錢，也讓很多人習慣靠國家吃飯。
      你可以把這項配給永遠廢除，也可以把它留下來。你會怎麼做？
    options:
      - { label: 永遠廢除糧食配給, result: 奧古斯都自己寫過，他非常想這麼做，但他擔心以後會有政客為了討好人民又把它恢復，所以沒有廢除。真的廢除會怎樣，只能推測：可能省下開支，也可能讓首都民心不穩。 }
      - { label: 保留配給，由國家管理, result: 這是奧古斯都當年的選擇。配給成了常設制度，國家也設了專門管糧食的官員；糧食從此和首都的秩序、皇帝的聲望綁在一起。 }
    actual: 奧古斯都保留了配給，並把它固定下來。幾百年後，汪達爾人奪下北非，西羅馬失去大部分糧源和稅收，羅馬城人口在半世紀內大約少了一半（估計）。
    ref: commodity-egypt-grain#story
    note: 「沒有發生的選項」的後果都是推測，標示清楚。
  - type: card
    id: event-fall-western-rome
    depth: deep
    prompt: 最後來看 5 世紀。讀「史家怎麼吵」時，注意兩個問題：羅馬到底有沒有「亡」？原因是外面的壓力，還是內部的問題？
  - type: chain
    prompt: 把下列事件依照時間排成一條鏈（最上面是最早的）。
    items:
      - 被匈人追趕的哥德人大批進入羅馬帝國
      - 羅馬皇帝在阿德里安堡戰死
      - 西哥德人攻進羅馬城搶劫
      - 汪達爾人奪下北非，西羅馬失去大部分糧食和稅收
      - 奧多亞塞廢掉年幼的皇帝，皇帝徽章被送到君士坦丁堡
    explain: 376 哥德人入境 → 378 阿德里安堡 → 410 羅馬城被劫 → 約 439 失去北非 → 476 皇帝被廢。注意：這是一連串壓力一層層疊上去，不是一個原因就造成一切；還記得埃及和北非的小麥嗎？失去北非，等於同時失去糧食和錢。史家對哪一個原因最重要，到今天還沒有共識。
    hints:
      - 最早的一步是一群人被別人追趕、逃進帝國。
      - 羅馬城被劫比失去北非早大約三十年。
      - 最後一步不是大戰，而是一個皇帝被廢。
    ref: event-fall-western-rome#C2
  - type: source
    card: event-fall-western-rome
    idx: 0
    question: 耶柔米在 412 年寫下「那座曾經征服全世界的城市，自己被攻陷了」。讀這句話時，最需要注意什麼？
    options:
      - 這證明西羅馬帝國在 410 年就滅亡了
      - 它反映了當時的人聽到羅馬城被劫時的震驚，但羅馬城被劫不等於帝國結束
      - 耶柔米是蠻族，所以他很高興羅馬被攻陷
      - 這句話是現代史家寫的，不是古代史料
    answer: 1
    explain: 410 年羅馬城被西哥德人劫掠，對當時的人是極大的震撼，耶柔米的話寫出了這種情緒。但西方的皇帝在那之後還繼續存在了六十多年，東羅馬更延續到 1453 年。讀史料時，要分清楚「當時的人有什麼感受」和「事情實際上的結果」。
    hints:
      - 這句話寫在哪一年？西羅馬最後一位皇帝是哪一年被廢的？
      - 「城市被攻陷」和「國家滅亡」是同一件事嗎？
      - 這是一封信，信裡常常帶著寫信人的情緒。
    ref: event-fall-western-rome#story
  - type: today
    card: event-fall-western-rome
    question: 常有人說「某某大國就像晚期的羅馬，快要滅亡了」。這個比喻哪裡不成立？
    model_answer: 羅馬「滅亡」的日期和意義本身就有爭議：東半部又延續了近千年，西半部也是在一百多年裡多重壓力疊加才瓦解。古代晚期的人口、氣候、軍事技術和國家運作方式，和今天的國家差異極大。拿羅馬來比喻，可以提醒我們「很多慢慢累積的壓力會一起造成危機」，但不能拿來預測哪個國家會不會滅亡。
  - type: check
    items:
      - kind: choice
        q: 關於西元 476 年，下列哪一句正確？
        options: [羅馬帝國全部在這一年滅亡, 將領奧多亞塞廢掉年幼的西方皇帝，皇帝徽章被送到君士坦丁堡, 這一年發生了一場決定羅馬命運的大戰, 西哥德人在這一年第一次攻進羅馬城]
        answer: 1
        explain: 476 年不是一場大戰，而是一位將領廢掉皇帝；東羅馬還延續到 1453 年。把 476 年當成終點，是後來許多史家的習慣。
        hints: [回去看西羅馬卡的「常見誤解」。, 東邊的君士坦丁堡後來怎麼了？]
        ref: event-fall-western-rome#C6
      - kind: order
        q: 依時間先後排列：
        items: [條頓堡森林戰役, 哈德良開始築長城, 卡拉卡拉讓帝國自由人成為公民, 西哥德人劫掠羅馬城, 奧多亞塞廢掉西方皇帝]
        explain: 9 條頓堡 → 約 122 哈德良長城 → 212 卡拉卡拉敕令 → 410 羅馬城被劫 → 476 皇帝被廢。
        hints: [條頓堡是奧古斯都在位時的事。, 卡拉卡拉敕令的年份是 212 年。]
        ref: event-constitutio-antoniniana#C2
      - kind: short
        q: 用一兩句話說明：關於「羅馬有沒有亡」，史家有哪兩種不同的看法？
        model: 一種看法認為這是「衰亡」，像沃德－帕金斯就不接受「和平轉型」的說法，認為 5 世紀並不是和平多於暴力；另一種看法像皮雷納等人強調羅馬文化在 476 年後仍然延續，後來也有學者主張更適合叫「複雜的文化轉型」。
        explain: 兩派看到的是同一段歷史，差別在他們更重視「被破壞的東西」還是「延續下來的東西」。
        hints: [回去看西羅馬卡的「史家怎麼吵」第一段。, 一派說「亡」，一派說「變」。]
        ref: event-fall-western-rome#C7
  - type: recap
    model_answer: 沒有單一答案。外面有哥德人、汪達爾人等移民和入侵的壓力；裡面有軍隊依賴蠻族士兵、財政吃緊、內戰和爭權；失去北非又同時斷了糧食和稅收。這些壓力在一百多年間一層層疊上去，最後在 476 年，一位將領廢掉了西方的皇帝。但「亡」這個字本身就有爭議：東羅馬又延續近千年，羅馬的語言、法律和宗教也留了下來，所以有些史家說這是一場「轉型」。讀歷史時，遇到「為什麼會亡」這種大問題，最好先問：有哪些原因？誰這樣說？他看重的是什麼？
next: [unit-athens-sparta, unit-ming-silver]

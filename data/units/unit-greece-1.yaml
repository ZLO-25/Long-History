id: unit-greece-1
title: 人民自己管自己？雅典民主怎麼長出來
histories: [希臘羅馬史, 世界通史]
mystery: 「人民自己管自己」聽起來很公平，雅典人卻是從欠債變奴隸、貴族搶權、外敵壓境一步一步走到這裡的。這個制度是怎麼長出來的？而它說的「人民」，到底包括誰、不包括誰？
teaser: 一筆銀礦的錢，平分給每個人，還是拿去造船？
goals:
  - 能說出城邦、梭倫改革、克里斯提尼改革各解決了什麼問題
  - 能判讀一段希羅多德的敘述，說出克里斯提尼為什麼去拉攏平民
  - 能說出銀礦的錢「平分或造船」這個選擇，當時看得到哪些選項、各有什麼代價
  - 能描述雅典民主怎麼運作，並指出誰被排除在「人民」之外
minutes: 40
companion: unit-greece-2
steps:
  - type: hook
    text: |
      想像你們班沒有老師、沒有班長，班上的事全靠每個人舉手決定：誰當值日、怎麼分班費、要不要處罰某個同學。
      聽起來很公平吧？兩千五百年前的雅典，真的這樣管自己。
      不過先問一個問題：這個「每個人」，是誰？我們先看這個制度是怎麼長出來的，再回頭問這個問題。
  - type: card
    id: event-greek-polis-colonization
    depth: understand
    prompt: 先看舞台：古希臘為什麼不是一個國家？注意「城邦」是什麼、誰算公民，還有「公民同時是戰士」這件事。
  - type: card
    id: event-solon-reform
    depth: understand
    prompt: 前 6 世紀初的雅典出了什麼危機？注意欠債的人會有什麼下場，以及梭倫做了什麼、沒做什麼。
  - type: card
    id: event-cleisthenes-reform
    depth: understand
    prompt: 梭倫之後貴族又在搶權。注意克里斯提尼怎麼「重新分班」，以及他一開始是為了什麼才去拉攏平民。
  - type: source
    card: event-cleisthenes-reform
    idx: 0
    question: 這段希羅多德的敘述，最能說明克里斯提尼為什麼去拉攏平民？
    options:
      - 他從一開始就想建立人人平等的民主，所以主動去找平民
      - 斯巴達國王要求他這樣做，他只是照辦
      - 他在跟對手爭權時居於下風，有了平民的支持才壓過對手
      - 平民先發動起義，他是被逼著改革的
    answer: 2
    explain: 希羅多德寫的是權力鬥爭：克里斯提尼爭不過對手，才把原本被排除在外的平民拉到自己這邊，改了部落，有平民撐腰就遠遠壓過對手。這不代表他沒有理想，但這段文字裡看不到「一開始就想建立民主」，當時的新制度也還不叫民主，而叫 isonomia（大家在法律和政治上平等）。讀史料時要問：作者交代的是動機，還是結果？
    hints:
      - 先看「平民原本被排除在一切之外」之後發生了什麼事：是誰先動的？
      - 「有了平民支持，他就遠遠壓過對手」，說明他需要平民幫他做什麼？
      - 這段文字有沒有提到「平等」或「民主」這種字眼？
    ref: event-cleisthenes-reform#C2
  - type: compare
    cards: [event-solon-reform, event-cleisthenes-reform]
    prompt: 比一比雅典走向民主的前兩步：梭倫和克里斯提尼。
    rows:
      - aspect: 時間
        a: 傳統上定在前 594 年
        b: 約前 508 年（前 510 年趕走僭主之後）
      - aspect: 起因
        a: 窮農民還不起債，連家人都可能被當奴隸，人民起來反抗上層階級
        b: 僭主被趕走後貴族搶權，克里斯提尼居於下風，去拉攏平民
      - aspect: 做了什麼
        a: 取消債務契約、禁止用人身當借錢的擔保，並依財產把公民分成四等
        b: 把依血緣的四個舊部落換成依居住地混合的十個新部落，議事會由 400 人擴為 500 人
      - aspect: 窮人與一般公民得到什麼
        a: 最窮的一等不能做官，但可以進公民大會和陪審法庭
        b: 一般男性公民參與政治的權利擴大，貴族的地方勢力被削弱
      - aspect: 誰還是被排除
        a: 女性在四個等級裡都沒有政治角色；奴隸仍是奴隸
        b: 女性、奴隸與外邦人不是公民
    question: 梭倫和克里斯提尼各自解決了什麼問題？為什麼兩個人的改革都還不能說是「完整的民主」？
    model_answer: 梭倫解決的是社會快撐不住的債務危機：窮人還不起債就可能被賣成奴隸，他取消債務、禁止用人身擔保，還讓最窮的人也能進公民大會和陪審法庭，但最窮的一等仍不能做官，他本人也不是民主派。克里斯提尼解決的是貴族家族靠血緣和地盤把持政治的問題：他把人重新分組、混合不同地區，削弱貴族的地方勢力，也讓公民大會的權力變大。兩個人的改革都只讓部分人受益：女性、奴隸、外邦人還是被擋在門外，而且當時用的字是 isonomia，「民主」這個詞是後來才通行的。這題沒有標準答案，重點是看出兩次改革解決的問題不同，但都是危機或爭權逼出來的。
    hints:
      - 先看表格的「起因」那一列：兩個人面對的問題一樣嗎？
      - 再看「誰還是被排除」：兩次改革之後，哪些人仍然沒有政治權利？
      - 想想看：這兩次改革是因為有人想實現理想，還是因為舊辦法行不通了？
  - type: decision
    role: 你是約前 483 年雅典公民大會裡的一位公民
    situation: |
      雅典東南邊的勞里昂銀礦，是城邦自己的礦場，租給私人承包商開採。最近挖到一條特別豐富的新礦脈，收入很可觀。照習慣，礦場的收入是分給市民的。
      七年前，雅典才在馬拉松擊退波斯的登陸部隊，東邊那個大帝國還在。這時地米斯托克利在公民大會上站起來，主張停止分錢，改拿這筆錢造三列槳戰船（雅典的主力戰艦），理由是要對付鄰近的埃伊納島。
      先別急著看選項：如果你是在場的一位公民，只知道這些，你會怎麼舉手？
    options:
      - label: 照舊，平分給每個公民
        result: 推測：每個人立刻拿到錢，這個提議很容易通過，因為好處就在眼前。但艦隊要靠這筆錢才造得起來，雅典到幾年後可能就沒有那麼多戰船。歷史沒有走這條路，所以後果只能推測。
      - label: 先存起來，以後再決定
        result: 推測：錢還在，不必立刻得罪想分錢的人；但船不是說要就有，將來真的需要時趕不趕得上，沒人知道。歷史沒有走這條路，所以後果只能推測。
      - label: 停止分錢，拿去造三列槳戰船
        result: 這是雅典當年的選擇。普魯塔克說，地米斯托克利是「唯一」敢在公民大會上提議停止分錢的人。到前 480 年波斯大軍南下時，雅典有大約兩百艘戰船（不同來源的數字不一，也有說是一百艘）。代價是眼前少拿一筆錢，好處要等幾年後的戰爭才看得出來。
    actual: 雅典選擇了造船。前 480 年，薛西斯的大軍渡海而來，地米斯托克利用假消息把波斯艦隊引進狹窄的薩拉米斯海峽，希臘贏了。但這個功臣的下場並不好：戰後大約十年，他被陶片放逐，之後在缺席時被雅典判叛國，最後逃到波斯，死在波斯王讓他治理的馬格尼西亞。另一個值得想的地方是：這筆錢是靠礦坑裡的奴隸挖出來的，而他們沒有投票權。
    ref: person-themistocles#P3
    note: 沒有發生的選項，後果都是推測，標示清楚。決策題先請學生寫下自己的想法再看選項；這題沒有標準答案，歷史上也不是所有人都贊成。
  - type: card
    id: commodity-laurion-silver
    depth: understand
    prompt: 這筆銀子是誰挖出來的？注意礦山屬於誰、礦坑裡是什麼人在工作。
  - type: card
    id: war-greco-persian
    depth: understand
    prompt: 看這支艦隊後來在哪裡派上用場。注意薩拉米斯海峽的地形，還有雅典為什麼會和波斯開戰。
  - type: card
    id: person-themistocles
    depth: understand
    prompt: 讀「從另一邊看他」：同樣一個陶片放逐，在雅典人眼裡和在他眼裡，意思為什麼不一樣？
  - type: chain
    prompt: 把下列事件依照時間順序排成一條鏈（最上面最早）。
    items:
      - 克里斯提尼改革後，公民大會作主的雅典決定派船支援愛奧尼亞的起義
      - 波斯在馬拉松登陸，被雅典與普拉提亞軍擊退
      - 約前 483 年，勞里昂發現新礦脈，地米斯托克利說服公民不分錢、改造戰船
      - 前 480 年，希臘艦隊在薩拉米斯打敗波斯艦隊
      - 前 478/477 年，雅典成為提洛同盟的盟主
    explain: 雅典派船幫愛奧尼亞起義，招來波斯報復，才有前 490 年的馬拉松；之後有了新礦脈和造船的決定，這支艦隊成了薩拉米斯海戰的主力；戰後雅典靠海軍當上提洛同盟的盟主。注意這條鏈說的是「一步銜接一步」，不代表每一步都是必然。
    hints:
      - 先找出最早的一步：和克里斯提尼改革、公民大會有關的那一個。
      - 馬拉松在前 490 年，薩拉米斯在前 480 年，造船的決定夾在兩者之間。
      - 同盟是「打贏之後」才成立的。
    ref: war-greco-persian#A7
  - type: card
    id: social-athenian-democracy
    depth: understand
    prompt: 現在回頭問開頭那個問題：「每個人」是誰？注意公民大會、抽籤、陪審法庭、陶片放逐怎麼運作，以及誰不算數。
  - type: source
    card: social-athenian-democracy
    idx: 1
    question: 亞里斯多德《雅典政制》寫到「公民權屬於父母雙方都是公民的人」，這句話說明了什麼？
    options:
      - 在雅典，公民身分要看父母是不是公民，住在雅典的外邦人因此進不了公民大會
      - 只要在雅典出生、長大，講希臘語，就可以成為公民
      - 這條規定是為了讓女性也能參加公民大會
      - 只要有錢繳稅，外邦人也能買到公民身分
    answer: 0
    explain: 這句話把公民身分綁在「父母雙方都是公民」上。亞里斯多德也記下，前 451／450 年伯里克里斯提案：沒有雙方公民血統的人不得列入公民。外邦人是住在雅典的自由人，要繳稅、要當兵，卻不能投票，也不能當陪審員。女性即使有公民父母，也沒有政治權利。所以「人民」其實是一個很窄的圈子。
    hints:
      - 先看句子：決定誰是公民的條件是什麼？
      - 想想看：一個外國人在雅典住了三十年，這條規定對他有沒有幫助？
      - 回去看卡片的「他們面對的規則」，外邦人和女性分別能做什麼？
    ref: social-athenian-democracy#E3
  - type: today
    card: social-athenian-democracy
    question: 有人說「雅典是現代民主的老祖宗，我們班上投票決定事情，就是在做雅典式的民主」。這個類比哪裡不成立？
    model_answer: 先說不能類比的地方：雅典有政治權利的主要是成年男性公民，約占居民的一到兩成，女性、奴隸、外邦人都被排除；雅典是只有幾萬公民的小城邦，所有人能擠進一個山坡開會，這是直接民主，今天多數國家人口動輒千萬，是選代表來決定；雅典沒有今日的人權保障，多數決可以決定很多事，包括放逐與審判。可以借來想的是：誰算「人民」、怎麼讓機會平等（抽籤）、怎麼防止一個人權力太大（陶片放逐），這些問題今天還在問。
    hints:
      - 先想：班上投票時，每個同學都有一票嗎？雅典的「人民」是不是每個居民？
      - 雅典的公民大會人人都能到山坡上去，今天的國家人口這麼多，辦得到嗎？
      - 最後想想：有哪些雅典人問過的問題，到今天還沒有標準答案？
  - type: check
    items:
      - kind: choice
        q: 梭倫把公民依財產分成四等。最窮的「雇工級」可以做什麼？
        options:
          - 可以當執政官，不過每年要先繳一筆錢給城邦才行
          - 什麼事都不能做，只能在家種田，連公民大會都不能去
          - 可以進五百人議事會擔任議員，但是一輩子最多當兩年
          - 不能當官，但可以參加公民大會和陪審法庭
        answer: 3
        explain: 梭倫讓最窮的一等雖然不能擔任任何官職，卻可以進公民大會和陪審法庭，這是雅典民主的前一步；但他本人不是民主派。
        hints:
          - 梭倫的改革是「財產決定能做什麼官」，窮人被完全擋在門外嗎？
          - 回想比較表中「窮人與一般公民得到什麼」那一列。
        ref: event-solon-reform#C2
      - kind: choice
        q: 關於陶片放逐，下面哪一個說法是對的？
        options:
          - 被放逐的人是犯了罪，財產會被沒收
          - 被放逐的人不一定犯了罪，要離開十年，十年後可以回來
          - 每年都一定要放逐一個人
          - 只有貴族可以投票
        answer: 1
        explain: 陶片放逐不是審判，投票不需要罪名；被選中的人離開雅典十年，財產保留，之後可以回來。它每年先公決要不要舉行，比較像防止有人權力太大的安全閥。
        hints:
          - 它是處罰罪犯的辦法，還是預防有人權力太大的辦法？
          - 回去看卡片：陶片放逐的投票需不需要先指出罪名？財產會不會被沒收？
        ref: social-athenian-democracy#E2
      - kind: order
        q: 依時間先後排列：
        items:
          - 梭倫解負令
          - 克里斯提尼重新劃分十個部落
          - 陶片放逐第一次真的被使用
          - 薩拉米斯海戰
          - 伯里克里斯的公民權法
        explain: 前 594 年（傳統年代）梭倫 → 約前 508 年克里斯提尼 → 前 487 年第一次陶片放逐 → 前 480 年薩拉米斯 → 前 451／450 年公民權法。
        hints:
          - 梭倫在克里斯提尼之前，這點比較表裡已經看過了。
          - 薩拉米斯是波希戰爭的名場面，在前 480 年。
          - 公民權法是伯里克里斯的提案，比薩拉米斯晚三十年左右。
        ref: event-cleisthenes-reform#C4
      - kind: short
        q: 用一兩句話說明：為什麼說雅典的「民主」不是人人平等？
        model: 有投票權的只有成年男性公民，約占居民的一到兩成；女性、奴隸和外邦人都被排除，連公民身分也要父母雙方都是公民。
        explain: 重點是「誰算人民」：看制度要同時看它納入了誰、又擋掉了誰。
        hints:
          - 回去看卡片的「誰的生活」那一段。
          - 想想女性、奴隸、外邦人各自能不能投票。
        ref: social-athenian-democracy#E1
  - type: recap
    model_answer: 雅典的「人民自己管自己」不是一次投票就出現的。城邦本來就小而分散，公民還要自己出力打仗；前 6 世紀初，窮農民還不起債就可能被賣成奴隸，梭倫用解負令和財產分級把危機壓下來，讓窮人也能進公民大會和陪審法庭，但他本人不是民主派。後來僭主被趕走，克里斯提尼在爭權中拉攏平民，約前 508 年把人重新分成十個部落，削弱貴族的地方勢力。之後雅典拿勞里昂銀礦的收入造戰船，和其他希臘城邦一起在薩拉米斯打敗波斯艦隊，公民大會、抽籤、陪審法庭和陶片放逐也成為日常制度。但這個「人民」只包括成年男性公民，約占居民的一到兩成；女性、奴隸、外邦人不算數，而造船的銀子正是礦坑裡的奴隸挖出來的。所以答案是：它是債務危機、貴族爭權和外敵壓力一步一步逼出來的，而且從一開始就有人被排除在外。這題沒有標準答案，你也可以從別的角度回答。
reflect: 地米斯托克利提議停止分錢、改造戰船時，眼前的錢和幾年後的安全擺在一起，大家要投票選。想一次你們班或你自己遇到的「現在就有好處」和「以後才看得出好處」的選擇：你當時選了哪一個？班上做決定的時候，有沒有人其實沒有被問到、或不敢說話？

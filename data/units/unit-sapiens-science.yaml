      - kind: choice
        q: 哈拉瑞認為，有了核武以後，超級強權彼此開打等於一起毀滅自己，所以大國不敢再打大戰。關於 1945 年以後的「長和平」，哪一個說法最穩妥？
        options:
          - 學者已有共識：長和平完全是核嚇阻造成的，其他因素幾乎沒有作用
          - 平克認為核武是暴力下降最主要的原因
          - 「長和平」是指 1945 年以後，世界上再也沒有發生任何戰爭
          - 學者看法分歧：有人列出核嚇阻、貿易、民主國家增加等多種解釋，也有人認為幾十年的和平在統計上還不足以下定論
        answer: 3
        explain: 「長和平」是蓋迪斯 1986 年提出的說法，只是說大國之間沒有直接開戰，不是說世界沒有戰爭。支持者強調沒有單一因素足以解釋；平克列出的主要力量是國家、貿易、女性地位、世界主義與理性，不是核武；Cirillo 與 Taleb 認為戰爭死亡是肥尾分布，Clauset 也估計還要再過約 100 到 140 年，才能在統計上確定不是偶然；但 2020 年 Cunen 等人換一種分布計算，又認為 1950 年後戰爭致死程度確實下降，爭論還沒結束。這也提醒我們：長和平是用廣島、長崎的大量平民死亡開場的。
        hints:
          - 「長和平」說的是誰和誰之間沒有開戰？
          - 回去看「史家怎麼吵」：平克列出的主要力量裡有核武嗎？
          - Cirillo 與 Taleb 為什麼說「幾十年沒出事」還不夠？
        ref: event-nuclear-long-peace#C10

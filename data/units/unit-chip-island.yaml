id: unit-chip-island
title: 晶片島：臺灣怎麼從加工廠變成晶片重鎮？
histories: [臺灣史, 科技史]
mystery: 五十多年前，臺灣有很多工廠替外國公司組裝收音機、電視等電子產品；今天，全世界一半以上的先進晶片在臺灣製造。這是怎麼辦到的？
teaser: 從加工區的女工、高速公路和中鋼，到南陽街的一頓早餐和台積電。
goals:
  - 能說出臺灣從加工出口、十大建設到半導體產業的發展順序
  - 能判讀張忠謀的口述，說出台積電為什麼選擇只做代工
  - 能比較加工區與科學園區，說出兩者的差異
  - 能指出把「矽盾」或「晶片就是臺灣的石油」當成定論時，哪裡不成立
minutes: 35
steps:
  - type: hook
    text: |
      拿出你的手機。裡面最重要的那顆晶片，很可能是在新竹、臺中或臺南做出來的。
      可是在你阿嬤年輕的時候，臺灣有不少工廠是替外國公司組裝零件，很多女孩國小一畢業就進廠工作。
      從「替人組裝」到「做全世界最難做的晶片」，中間發生了什麼事？
    guess:
      q: 臺灣的晶片產業一開始是怎麼起步的？
      options:
        - 政府決定要發展，先向美國公司學技術、送年輕工程師去受訓
        - 外國晶片大廠看上臺灣的低工資，自己來蓋廠，臺灣再慢慢跟著學
        - 民間公司自己研發成功，政府一直到很後來才開始幫忙
        - 臺灣向日本買下整套的晶片工廠，工程師照著說明書直接開工
      reveal: 1974 年孫運璿等人決定發展積體電路，1976 年工研院和美國 RCA 簽約學技術，派年輕工程師赴美受訓；1980 年示範工廠團隊分出聯電，1987 年的台積電政府也出了約一半資本。
  - type: card
    id: event-kaohsiung-epz
    depth: story
    prompt: 第一站：1966 年的高雄。注意外國工廠為什麼要來這裡，以及在工廠工作的是誰。
    focus: [C1, C5]
    quick:
      - q: 1960 年代，政府為什麼要設立加工出口區？
        a: 當時美援即將結束，政府想吸引外資、增加出口和就業。高雄有港口，又有新填海造出的土地，進出口很方便。
      - q: 在加工區工作，對農村來的年輕女孩只有吃苦而已嗎？
        a: 不只。對很多人來說，這是第一次有自己的收入；但工資偏低，有些人還沒到合法年齡就上工，1980 年代後期工廠外移時，還有人失業。
  - type: card
    id: building-ten-major-projects
    depth: story
    prompt: 第二站：1970 年代的大建設。想一想：公路、港口、鋼鐵和晶片有什麼關係？
    focus: [D1, D2]
    quick:
      - q: 十大建設是在什麼情況下提出的？裡面包含哪幾類工程？
        a: 1973 年底爆發第一次石油危機，油價暴漲、臺灣經濟陷入困境，政府在這時提出大建設。十項裡有六項是交通、三項是重工業（鋼鐵、造船、石化），一項是核電廠。
      - q: 蓋這麼多工程，錢是從哪裡來的？
        a: 資金來自政府預算、公債與國外借款。例如鐵路電氣化約 230.8 億元，超過一半來自國外借款。
  - type: card
    id: event-hsinchu-park-tsmc
    depth: deep
    prompt: 第三站：一頓早餐、一份技術合約，和一家「只替別人做」的公司。讀「史家怎麼吵」時注意兩種不同的解釋。
    focus: [C2, C4, debate]
    quick:
      - q: 臺灣是怎麼一步步學會做晶片的？
        a: 先由工研院向美國 RCA 學技術、派工程師受訓、蓋示範工廠；再把團隊「分拆」成民營公司，例如聯電、台積電。
      - q: 有人說台積電是「國家主導」的成功。學者黃凌明怎麼補充？
        a: 他同意國家很重要，但認為 RCA 計畫是人、知識、材料的跨國流動，臺灣真正的強項是整個產業聚落，不是一兩家公司。
  - type: chain
    prompt: 把下列事件排成一條「前一件促成後一件」的鏈（最上面是最早的）。
    items:
      - 高雄加工出口區成立，外國電子公司來臺設廠
      - 孫運璿等人在南陽街早餐會，決定發展積體電路
      - 工研院和美國 RCA 簽約，派工程師赴美受訓
      - 示範工廠團隊分出成立聯電，新竹科學園區開幕
      - 台積電成立，專門替別人代工製造晶片
    followup:
      question: 鏈的第一項（加工出口區成立）和第二項（早餐會決定發展積體電路）之間，是什麼關係？
      options:
        - 加工區帶來成長，但技術握在外國公司手上，政府才想找新突破口
        - 加工區直接造成了早餐會，因為外國公司要求臺灣馬上開始發展晶片
        - 兩者完全沒有關係，因為加工區裡根本沒有任何一家電子公司
        - 加工區成立後，外國公司把晶片的技術全部免費教給了臺灣工程師
      answer: 0
      explain: 卡片說，臺灣靠加工出口快速成長，但工資上升、技術多掌握在外國公司手上，政府才想找新的技術突破口。所以加工區和早餐會有關：它帶來成長，也讓人看見限制。但卡片沒有說早餐會是外國公司要求的，發展積體電路是政府這邊的決定。
      why_wrong:
        - null
        - 卡片說是政府想找新的技術突破口，沒有說是外國公司要求的。
        - 加工區裡有美國、日本的電子公司，也讓臺灣學到電子業的生產與管理方式。
        - 卡片說技術多掌握在外國公司手上；臺灣是向美國 RCA 簽約學技術，並不是免費學到的。
    explain: 1966 加工區 → 1974 早餐會 → 1976 RCA 計畫 → 1980 聯電與竹科 → 1987 台積電。加工區讓臺灣累積了電子組裝的經驗和工人；但要從組裝走到製造晶片，還需要政府主動引進技術、培養人才。
    hints:
      - 最早的是「替外國公司組裝」的階段。
      - 要先決定發展、再去買技術、再培養團隊。
      - 台積電是最後成立的。
    ref: event-hsinchu-park-tsmc#C2
  - type: source
    card: event-hsinchu-park-tsmc
    idx: 0
    question: 張忠謀說代工是「最不壞的選擇」（the least evil choice），他的意思最接近哪一個？
    options:
      - 臺灣研發設計都弱、只有製造有機會，代工是有限選擇中較好的
      - 代工是當時全世界最賺錢的模式，所以他才選了代工這條路來做
      - 他其實不想成立台積電，是被政府一路推著走，才勉強接下這份工作
      - 代工是政府強迫他做的決定，他自己並不同意，只好照著去執行
    answer: 0
    explain: 「最不壞」不是「最好」：他承認臺灣當時研發、設計都弱，只剩製造可能有優勢，所以選代工。這是當事人 2007 年回顧時的說法，事後回顧可能把當年的決定說得比較有條理；讀口述歷史要記得這一點。
    hints:
      - 「最不壞」和「最好」有什麼不同？
      - 回去看卡片「代工是遠見，還是不得不？」那一段。
      - 這是事情發生二十年後的訪談，會不會影響說法？
    why_wrong:
      - null
      - 他說的是「最不壞」，不是「最賺錢」；卡片還說代工模式在當時很少人看好。
      - 他是受李國鼎之託籌組公司；「最不壞」說的是代工這個選項，不是不想成立公司。
      - 卡片說政府出約一半資本，但「最不壞的選擇」是他自己回顧時對代工的評價，並沒有說是被強迫。
    critique:
      question: 張忠謀是台積電的創辦人，這段話出自他 2007 年的口述訪談。用它來說明當年為什麼選代工，有什麼限制？
      options:
        - 這是當事人事後回顧的說法，可能把決定說得比較有條理，要對照其他證據
        - 因為他是創辦人，所以這段話就是當年的會議紀錄，可以完全當成當時的事實
        - 這段話是政府的正式公文，所以代表所有參與決策的人都同意這個說法
        - 這段話是他在 1987 年成立台積電當天說的，所以最能代表當時的想法
      answer: 0
      explain: 這是 2007 年、事情發生二十年後的口述歷史。創辦人最了解內情，但回顧時可能把當年的決定說得比較有條理。所以它可以告訴我們他怎麼看，但要和史家的其他說法對照，例如有人強調國家主導，也有人強調產業聚落。
      why_wrong:
        - null
        - 這是事隔多年的口述訪談，不是當年的會議紀錄。
        - 這是他個人的口述歷史，不是政府公文，也不能代表所有人的看法。
        - 卡片說這是 2007 年的訪談，不是 1987 年成立當天說的話。
    ref: event-hsinchu-park-tsmc#C4
  - type: compare
    cards: [event-kaohsiung-epz, event-hsinchu-park-tsmc]
    prompt: 比一比加工出口區和科學園區。
    rows:
      - { aspect: 開始, a: 1966 年高雄, b: 1980 年新竹 }
      - { aspect: 主角, a: 外國公司來臺設廠組裝, b: 工研院技術團隊分出的臺灣公司，例如聯電、台積電 }
      - { aspect: 需要的人, a: 大量手巧、工資低的作業員，多為年輕女性, b: 工程師與研發人才，園區設在清華、交大旁邊 }
      - { aspect: 臺灣掌握什麼, a: 主要是勞力與土地，技術多在外國公司手上, b: 逐漸掌握製程技術與整個產業聚落 }
    question: 從加工區到科學園區，臺灣在產業中的角色發生了什麼變化？
    model_answer: 加工區時期，臺灣主要提供便宜的勞力和土地，技術和品牌在外國公司手上；科學園區時期，政府先引進技術、培養工程師，再讓臺灣自己的公司接手，臺灣開始掌握製程技術。但也要記得：加工區的女工和工廠經驗是後來發展的基礎，而且早期的轉型是有代價的，例如 1987 到 1992 年加工區有 3 萬多名工人失業。
    points:
      - 加工區時期：臺灣提供便宜的勞力和土地，技術和品牌在外國公司手上
      - 科學園區時期：政府先引進技術、培養工程師，再讓臺灣自己的公司接手，開始掌握製程技術
      - 加工區的女工和工廠經驗，是後來發展的基礎
      - 轉型有代價：1987 到 1992 年加工區有 3 萬多名工人失業
    hints:
      - 看「臺灣掌握什麼」那一列。
      - 「需要的人」有什麼不同？
      - 產業升級時，原本的工人怎麼了？
  - type: card
    id: commodity-taiwan-semiconductor
    depth: understand
    prompt: 最後一站：今天。注意臺灣「強在哪裡」，也注意它「依賴別人什麼」。
    focus: [B2, B5]
    quick:
      - q: 臺灣半導體強在哪一段？哪些東西又要靠別的國家？
        a: 臺灣強在晶圓代工和封裝測試。但 IC 設計約七成營收在美國，製造設備大多從美國、荷蘭、日本進口，前段材料臺灣自己只生產約 1%。
      - q: 有人說晶片集中在臺灣就像一面「矽盾」。為什麼也有人認為這反而是風險？
        a: 因為生產集中在臺灣海峽旁，一旦發生衝突或天災，全球供應都會受影響。也有人認為台積電赴美投資會削弱「矽盾」。
  - type: decision
    role: 你是 1985 年剛回臺灣的張忠謀
    situation: |
      政府請你籌組一家新的半導體公司。臺灣的研發和晶片設計能力都很弱；但工研院的團隊已經會製造，而且很會控制良率。
      當時全世界的半導體大廠，都是自己設計、自己製造、自己賣。你要怎麼定位這家新公司？
    options:
      - { label: 只做代工，替別人製造晶片, result: 這是台積電當年的選擇。它不和客戶競爭設計，讓沒有工廠的設計公司放心下單；這個模式在當時很少人看好，後來卻讓台積電成為全球最大的晶圓代工公司。 }
      - { label: 像國外大廠一樣，自己設計、製造、銷售, result: 推測：臺灣當時研發和設計都弱，要和國際大廠正面競爭，很可能處於劣勢。歷史沒有走這條路，所以後果只能推測。 }
    actual: 1987 年台積電成立，政府出約一半資本、荷蘭飛利浦出 27.5%，專門替別人代工製造晶片。
    ref: event-hsinchu-park-tsmc#C2
    note: 「沒有發生的選項」的後果都是推測，標示清楚。
  - type: today
    card: commodity-taiwan-semiconductor
    question: 有人說「晶片就是臺灣的石油，有了它，臺灣就安全了」。這個說法哪裡不成立？
    model_answer: 晶片不是挖出來的天然資源，而是靠技術、人才和整條國際分工做出來的；臺灣的設備大多從美國、荷蘭、日本進口，前段材料也大多仰賴進口，別國可以花錢、花時間追上。至於「矽盾」能不能保護臺灣，學者和官員看法分歧，也有人認為晶片集中在臺灣反而是風險。所以這個說法可以幫我們思考臺灣的位置，但不能當成定論。
    points:
      - 晶片不是挖出來的天然資源，是靠技術、人才和整條國際分工做出來的
      - 設備和前段材料大多進口，別國可以花錢、花時間追上
      - 「矽盾」能不能保護臺灣，看法分歧，也有人認為晶片集中反而是風險
      - 這個說法可以幫我們思考臺灣的位置，但不能當成定論

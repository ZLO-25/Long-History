id: unit-three-kingdoms-1
title: 三國（上）：一個統一的漢朝，怎麼碎成好幾塊？
histories: [中國史]
mystery: 184 年黃巾之亂爆發時，天下還在東漢朝廷手上；不到二十五年後，皇帝成了別人手上的招牌，各地將領各據一方。一個大帝國是怎麼在一個世代裡碎掉的？誰在碎片裡撿到了機會？
teaser: 一句「蒼天已死」的口號、一座被燒掉的首都、一座被燒掉的糧倉、一場順風的大火。
goals:
  - 能用一條因果鏈說明從宦官外戚之爭、黃巾之亂、董卓入京到群雄割據的過程
  - 能判讀《後漢書》描寫董卓遷都的一段史料，說出百姓付出了什麼代價
  - 能說明屯田制和「糧食」在官渡之戰中扮演的角色
  - 能比較官渡與赤壁兩場「以少勝多」的戰役，並分辨《三國演義》的情節和正史記載
minutes: 40
steps:
  - type: hook
    text: |
      想像學校的學生會突然沒人管了：會長被架空，幾個社團各自拉人、搶經費，每個都說自己在「維護學校」。
      一開始大家還會聯合起來對付最兇的那一個，但很快就互相搶地盤。最後剩下的，不一定是最會喊口號的，而是最會「管糧草」、最能留住人的那一個。
      東漢末年就是這樣。我們從一句口號開始看：一個統一的漢朝，怎麼在一個世代裡碎成好幾塊？
  - type: card
    id: event-yellow-turban
    depth: understand
    prompt: 先看亂世怎麼開始：那句「蒼天已死」的口號是誰喊出來的？再注意朝廷為了平定黃巾，把什麼權力交給了地方？這一步後來帶來什麼問題？
  - type: card
    id: event-dong-zhuo-luoyang
    depth: understand
    prompt: 189 年中央失控。讀「經過」時注意：董卓怎麼進到洛陽？他離開洛陽時又做了什麼？
  - type: source
    card: event-dong-zhuo-luoyang
    idx: 0
    question: 依照這段《後漢書》的記載，董卓把首都遷到長安時，洛陽一帶發生了什麼事？
    options:
      - 百姓被強迫遷走，路上互相踩踏、餓死的人堆滿道路，宮殿民宅被燒光
      - 百姓自願跟著皇帝搬家，沿路秩序良好
      - 只有官員搬走，百姓留在洛陽照常生活
      - 董卓把洛陽改建成更大的城市
    answer: 0
    explain: 「盡徙洛陽人……於長安，步騎驅蹙，更相蹈藉，飢餓寇掠，積屍盈路」：百姓被軍隊驅趕，互相踩踏、挨餓、被搶，屍體堆滿道路；「悉燒宮廟官府居家，二百里內無復孑遺」：連宮殿、官府和民宅都燒掉了。注意「數百萬口」這種數字可能有誇大，要當成估計看。
    hints:
      - 先找動詞：「盡徙」「驅蹙」「蹈藉」是自願還是被逼？
      - 「積屍盈路」的「屍」是什麼意思？
      - 最後一句「悉燒宮廟官府居家」，燒的是哪些地方？
    ref: event-dong-zhuo-luoyang#C2
  - type: card
    id: event-cao-wei-tuntian
    depth: understand
    prompt: 董卓之亂後中原殘破，大批百姓因戰爭和饑荒逃離家園，田地荒廢；誰能讓田重新長出糧食，誰就比較養得起軍隊。看看屯田是怎麼運作的：田地從哪裡來？種田的人又是誰？
  - type: card
    id: war-guandu
    depth: understand
    prompt: 200 年，北方兩強對決。注意雙方的兵力、曹操一度想做什麼、以及戰局是怎麼因為「糧食」翻轉的。
  - type: decision
    role: 你是 208 年的孫權，江東的主人
    situation: |
      曹操剛統一北方，又拿下荊州，收編了大批荊州降兵。他順著長江往東推進，寫信給你，號稱有八十萬水軍。
      你的臣子吵成兩派：有人說曹操挾天子、兵多，不如投降，江東還能保全；也有人說北方兵不習慣南方水土、不熟水戰，剛投降的荊州兵也未必忠心，可以一戰。劉備派來的使者也在等你的回答。
      先別急著看選項：如果你是他，只知道這些，你會怎麼做？
    options:
      - { label: 和劉備聯手，出兵抵抗曹操, result: 這是孫權當年的選擇。他派周瑜、程普率軍，和劉備合力，聯軍大約五萬人，在赤壁一帶用火攻打敗曹軍；曹操退回北方，三家的根據地從此確立。 }
      - { label: 向曹操投降，換取保全江東, result: 推測：江東可能像剛投降的荊州一樣被併入曹操的政權，孫權本人或許能保住爵位，但未必能繼續統治江東；天下有可能更早統一在曹氏手中。歷史沒有走這條路，所以後果只能推測。 }
      - { label: 不出兵也不投降，守住長江觀望, result: 推測：曹操若在荊州站穩、整編水軍，江東就得單獨面對北方與荊州兩路的壓力；劉備可能被消滅，孫權也失去盟友。歷史沒有走這條路，所以後果只能推測。 }
    actual: 孫權決定聯合劉備抵抗。曹操在赤壁戰敗後退回北方，劉備之後取得荊州大部分，孫權保住江東，三家鼎立的局面由此形成。
    ref: war-red-cliffs#A2
    note: 「沒有發生的選項」的後果都是推測，標示清楚。曹操信裡的兵數是他自己誇大的說法，周瑜的估計少得多。
  - type: card
    id: war-red-cliffs
    depth: understand
    prompt: 看看孫劉聯軍怎麼打贏：火攻是誰的計？曹軍的弱點在哪裡？讀到「戲劇 vs 史實」時，比一比《三國演義》的草船借箭、借東風和正史差在哪裡。
  - type: card
    id: social-three-kingdoms-people
    depth: understand
    prompt: 換個角度，從百姓看亂世：曹操自己寫的〈蒿里行〉描寫了什麼景象？登記人口最後少了多少？讀到人口數字時，也看看為什麼它可能被低估。
  - type: chain
    prompt: 把下列事件依照「因 → 果」排成一條鏈（最上面是最早的原因）。
    items:
      - 宦官與外戚爭權、黨錮之禍，朝廷失去士人和百姓的支持
      - 184 年黃巾之亂，朝廷讓地方擁兵平亂
      - 189 年何進想除掉宦官反被殺，宦官也遭屠殺，董卓趁亂帶兵進入洛陽、廢立皇帝
      - 關東將領起兵討董，董卓遷都長安、焚燒洛陽，群雄割據
      - 曹操迎漢獻帝、興屯田，200 年在官渡打敗袁紹
      - 208 年曹操南下荊州，在赤壁被孫劉聯軍打敗，三家各據一方
    explain: 中央先從內部爛掉（宦官外戚之爭），黃巾之亂讓地方有了兵；189 年宮廷火拼給了董卓進京的機會，董卓的暴行又讓各地將領有了起兵的理由，從此誰有兵、有糧，誰就有地盤。曹操把漢獻帝接到身邊、興屯田累積糧食，200 年在官渡燒掉袁紹的糧草勝出，之後統一北方；赤壁一戰卻擋住了他南下，留下三家分立的局面。
    hints:
      - 最早的原因在朝廷裡面，不在戰場上。
      - 董卓是趁著宮廷大亂才進得了洛陽的。
      - 官渡（200）比赤壁（208）早。
    ref: event-three-kingdoms#C1
  - type: compare
    cards: [war-guandu, war-red-cliffs]
    prompt: 比一比兩場常被說成「以少勝多」的戰役：官渡讓曹操贏，赤壁讓曹操輸。
    rows:
      - { aspect: 誰對誰, a: 曹操對袁紹（200 年）, b: 孫權、劉備聯軍對曹操（208 年） }
      - { aspect: 兵力, a: 英文維基估計袁軍約 11 萬、曹軍約 4 萬（都是估計）；de Crespigny 後來的著作懷疑袁紹的兵力優勢沒有傳統說的那麼大, b: 曹操在信中自稱八十萬；周瑜估計約二十二到二十四萬，其中七、八萬是剛投降的荊州兵；聯軍約五萬 }
      - { aspect: 關鍵轉折, a: 袁紹謀士許攸投奔曹操，曹操夜襲烏巢燒掉袁軍糧草, b: 黃蓋詐降，用裝滿柴草的火船燒曹軍船隊；曹軍又有疾病 }
      - { aspect: 結果, a: 袁軍崩潰，袁紹死後兒子內鬥，曹操逐步統一北方, b: 曹操退回北方，南方的孫、劉站穩，天下三分 }
    question: 這兩場戰役贏的一方，都不是靠「人多」。請說出兩場戰役共同的一個勝負關鍵，再說說為什麼「以少勝多」的說法要小心看。
    model_answer: 共同的關鍵之一是「後勤」：官渡是曹操燒掉袁紹在烏巢的糧草，赤壁是曹軍遠道而來、北方士兵不習水土又爆發疾病，船隊被火攻燒掉。兩場戰役都說明，古代大軍最怕的是補給和疾病，而不只是對方的兵力。但「以少勝多」要小心：兵力數字多半來自當事人自己的說法或後來史家的轉述，曹操寫給孫權的「八十萬」就是誇大；官渡的兵力差距，de Crespigny 後來的著作也懷疑沒有傳統說得那麼大；赤壁方面，他還認為「曹操戰敗的記載很可能被誇大了」。數字是誰說的、為什麼這樣說，都要先問清楚。
    hints:
      - 先看「關鍵轉折」那一列：兩場戰役燒掉的分別是什麼？
      - 再看「兵力」那一列：這些數字是誰說的？
      - 打開兩張卡的「史家怎麼吵」，看看學者對兵力數字的看法。
  - type: today
    card: war-guandu
    question: 有人說「官渡之戰告訴我們，打仗只要燒掉對方的倉庫就會贏」。這個說法哪裡不成立？
    model_answer: 先說不能類比的地方：東漢末年的軍隊靠人力和牲口運糧，補給路線很少，一座糧倉被燒，十萬人就可能斷糧；今天的軍隊有鐵路、卡車、空運和好幾條補給網，燒掉一座倉庫不會讓整支軍隊崩潰。而且官渡的勝利也不只靠燒糧，還有許攸投奔、張郃高覽倒戈、袁紹陣營內部不合等原因。可以借來想的是「最脆弱的環節」：一個龐大的組織，常常不是被正面打倒，而是倒在最不起眼、卻所有人都依賴的那一環。
  - type: check
    items:
      - kind: choice
        q: 官渡之戰中，曹操扭轉戰局的關鍵行動是什麼？
        options: [在赤壁用火船燒掉袁紹的船隊, 派諸葛亮去說服袁紹投降, 挖開黃河淹沒袁紹大營, 夜襲烏巢，燒掉袁軍的糧草]
        answer: 3
        explain: 袁紹的謀士許攸投奔曹操，說出烏巢的糧草防守薄弱；曹操親自帶兵夜襲，把糧草幾乎燒光，袁軍隨即崩潰。赤壁火攻是 208 年孫劉聯軍打曹操，不是官渡。
        hints: [回想官渡卡裡，袁紹的謀士許攸告訴曹操什麼。, 「烏巢」放的是什麼東西？]
        ref: war-guandu#A7
      - kind: order
        q: 依時間先後排列：
        items: [黃巾之亂爆發, 董卓進入洛陽、廢立皇帝, 曹操迎漢獻帝到許、開始屯田, 官渡之戰, 赤壁之戰]
        explain: 184 年黃巾之亂 → 189 年董卓入京 → 196 年曹操迎獻帝、興屯田 → 200 年官渡之戰 → 208 年赤壁之戰。
        hints: [黃巾之亂是整個亂世的起點。, 曹操要先有皇帝和糧食，才打得了官渡。]
        ref: event-three-kingdoms#C1
      - kind: short
        q: 用一兩句話說明：為什麼在東漢末年的亂世裡，「糧食」和「留住百姓」這麼重要？
        model: 戰亂和饑荒讓大量百姓逃離家園、田地荒廢，軍隊沒有糧食就會散掉；曹操用屯田讓流民替政府種田，有了自己掌握的糧源才養得起兵；不過官渡對峙時曹軍仍一度缺糧，反而是袁紹在烏巢的糧草一被燒，大軍就崩潰了。
        explain: 這是一種解讀：亂世裡贏的人，常常不是最會打仗的，而是最會讓田重新長出糧食的。不過曹操的勝利也和「挾天子」的政治優勢、用人等因素有關。
        hints: [回去看百姓卡：亂世裡的百姓都去了哪裡？, 再看屯田卡和官渡卡：糧食對軍隊有什麼影響？]
        ref: event-cao-wei-tuntian#C4
  - type: recap
    model_answer: 漢朝不是一夕之間被打垮的，而是先從裡面碎掉：宦官和外戚爭權，讓朝廷失去士人和百姓的支持；184 年黃巾之亂，朝廷讓地方擁兵平亂，等於把刀交到地方手上；189 年宮廷火拼之後，董卓帶兵進京廢立皇帝，接著遷都、焚燒洛陽，各地將領從此各據一方。在這場碎片爭奪戰裡，曹操把漢獻帝接到身邊，又用屯田讓荒地重新生產糧食（不過官渡對峙時曹軍仍一度缺糧），200 年在官渡燒掉袁紹的糧草，打贏了北方的決戰；但 208 年他南下時，在赤壁被孫權和劉備的聯軍打敗，南方因此保住了，三家分立的局面就此成形。要記得兩個提醒：第一，正史裡的兵力和死亡數字常有誇大，當事人自己的說法要特別小心；第二，《三國演義》的草船借箭、借東風很精彩，但多半是小說的創作，不是《三國志》的記載。這是一種參考說法，不是標準答案。
reflect: 孫權決定開戰前，臣子吵成兩派：投降派說得很有道理，主戰派也說得很有道理。你有沒有遇過一個兩邊聽起來都對的決定？那時候你是怎麼選的？如果重來一次，你會先多問哪一個問題？

id: unit-three-kingdoms-2
title: 三國（下）：打了五十年，為什麼最後贏的是司馬家？
histories: [中國史]
mystery: 曹操、劉備、孫權打了半輩子，他們的子孫也繼續打；可是到了 280 年，統一天下的不是魏、蜀、吳任何一家，而是曹魏的臣子司馬家建立的晉朝。戰場上分不出勝負的事，是在哪裡決定的？
teaser: 一場燒掉四十多座營寨的大火、一篇寫給皇帝的〈出師表〉、一套替人打分數的制度、一次趁皇帝出城謁陵發動的政變。
goals:
  - 能說明夷陵之戰、諸葛亮北伐怎麼讓三國的國力差距固定下來
  - 能判讀〈出師表〉的一段原文，說出諸葛亮北伐的目標與他自己承認的困難
  - 能說明九品官人法怎麼讓世家大族掌握做官的機會，以及司馬家怎麼在朝廷裡奪權
  - 能比較諸葛亮和司馬懿兩人的選擇，並分辨《三國演義》與正史的說法
minutes: 40
steps:
  - type: hook
    text: |
      一場籃球比賽打到第四節，兩隊比分一直咬得很緊。最後決定勝負的，卻不是場上的球員，而是一個在場邊默默坐了很久、等主將犯滿離場的替補。
      三國也有點像這樣：曹、劉、孫三家在戰場上打了幾十年，誰也吃不掉誰；最後贏的，是一個在魏國朝廷裡等了很久的人。
      這一課，我們看三國的「下半場」：國力差距怎麼固定下來，權力又是怎麼悄悄換了手。
    guess:
      q: 曹、劉、孫三家打了幾十年，誰也吃不掉誰。你猜：最後決定天下歸誰的事，是在哪裡發生的？
      options:
        - 在戰場上：某一場決定性的大會戰，讓其中一家吃掉另外兩家
        - 在朝廷裡：一位重臣趁機掌握了實權，最後取代了皇帝
        - 在談判桌上：三國互相談判，和平合併成一個國家
        - 在民間：百姓起義，同時推翻了三個政權
      reveal: 是在魏國朝廷裡。249 年司馬懿趁曹爽陪皇帝出城謁陵，發動高平陵之變，掌握魏國實權；之後司馬家滅蜀、篡魏、滅吳，最後由晉朝統一天下，不是魏、蜀、吳任何一家。
  - type: card
    id: event-three-kingdoms
    depth: understand
    prompt: 先看全局：220、221、229 年三家先後稱帝。讀到最後，注意三國結束時登記人口剩下多少。
    focus: [C2, C6]
    quick:
      - q: 最後統一天下的，是魏、蜀、吳哪一家？
        a: 都不是。263 年魏滅蜀，266 年魏國的司馬炎迫魏帝讓位、建立晉朝，280 年晉軍攻下建業，吳主投降，三國結束。
      - q: 三國時代的登記人口為什麼少了這麼多？這個數字可靠嗎？
        a: 戰亂、饑荒與疫病讓人口大減，登記人口從約 5,649 萬降到約 1,616 萬。但也可能有人逃稅漏報，所以數字可能低估。
  - type: card
    id: war-yiling
    depth: understand
    prompt: 219 年關羽丟了荊州，劉備兩年後親自伐吳報仇。注意陸遜為什麼一直不出戰？這一仗讓蜀漢失去了什麼？
    focus: [A5, A9]
    quick:
      - q: 陸遜為什麼一直不出戰？後來怎麼贏的？
        a: 蜀軍據守山地、士氣正旺，陸遜等到蜀軍連營數百里、拖到疲憊才反擊。他下令每個士兵帶一把茅草放火，攻破蜀軍四十多座營寨。
      - q: 這一仗之後，蜀漢失去了什麼？它接著怎麼做？
        a: 船隻、器械、糧草幾乎全失，也失去東出荊州的路，只剩從漢中北上一條路。諸葛亮和吳重新結盟後，轉向北伐。
  - type: decision
    role: 你是 227 年的諸葛亮，蜀漢的丞相
    situation: |
      劉備在夷陵大敗後病死，把兒子劉禪託付給你。你和吳國重新結了盟，也平定了南方的叛亂。
      蜀漢只有益州一地，人口和兵力都遠不如北方的魏；你自己也承認「益州疲弊」。但蜀漢以漢朝的繼承者自居，立國的理由就是要恢復漢朝、打回北方。
      先別急著看選項：如果你是他，只知道這些，你會怎麼做？
    options:
      - { label: 主動北伐，出兵攻魏, result: 這是諸葛亮的選擇。227 年他上〈出師表〉，228 年起多次出兵，一度讓三郡歸降，但街亭失利、糧草不繼，始終沒能拿下關中；234 年他病死在五丈原。 }
      - { label: 守住益州，休養生息, result: 推測：蜀漢可能累積更多糧食和人口，但國力和魏的差距未必縮小；「興復漢室」的口號失去行動，蜀漢立國的正當性也可能受到質疑。歷史沒有走這條路，所以後果只能推測。 }
      - { label: 和吳聯手，從長江一起攻魏, result: 推測：兩國同時出兵可以分散魏的兵力，但吳、蜀剛在荊州打過仗，互相不信任，協調不易。歷史沒有走這條路，所以後果只能推測。 }
    actual: 諸葛亮選擇北伐，從 228 到 234 年多次出兵，取得武都、陰平兩郡，但沒能改變魏強蜀弱的局面；他死後，姜維繼續北伐，蜀漢的國力持續消耗，263 年被魏所滅。
    ref: war-zhuge-northern-expeditions#A2
    note: 「沒有發生的選項」的後果都是推測，標示清楚。史家對北伐是「以攻為守」的必要之舉，還是耗盡國力，看法並不一致。
  - type: card
    id: war-zhuge-northern-expeditions
    depth: understand
    prompt: 看看北伐的經過：街亭為什麼失利？最後一次北伐，司馬懿用什麼方法對付諸葛亮？讀「戲劇 vs 史實」時，留意空城計和「死諸葛走生仲達」：哪一個是史書記下的，哪一個是後人編的？
    focus: [A5, A7]
    quick:
      - q: 為什麼蜀軍的北伐常常半途撤退？諸葛亮怎麼想辦法？
        a: 糧食是最大的弱點，第二次（陳倉）和第四次（231 年）都因糧盡撤退。他先用木牛、流馬運糧，最後一次在五丈原就地屯田，準備長期對峙。
      - q: 最後一次北伐，司馬懿用什麼方法對付諸葛亮？
        a: 堅守不戰。他奉曹叡之命不出兵，蜀軍十多萬人屯在五丈原，同年八月諸葛亮病逝，蜀軍撤回。
  - type: source
    card: war-zhuge-northern-expeditions
    idx: 0
    question: 在這段〈出師表〉裡，諸葛亮說他北伐要達成什麼目標？
    options:
      - 留在益州好好種田，讓百姓休養生息、過安穩的日子
      - 除掉姦凶、恢復漢朝，回到漢朝的舊都
      - 向魏國投降，換取蜀漢百姓的和平
      - 趁機自己稱帝，取代劉禪成為蜀漢的皇帝
    answer: 1
    why_wrong:
      - 「躬耕於南陽」是他說自己過去只是種田的平民；這段話要講的是北伐，不是留在益州種田。
      - null
      - 原文要「攘除姦凶」，是要趕走他眼中篡漢的人，不是向對方投降。
      - 原文的目標是「興復漢室」，是恢復漢朝，不是自己稱帝。
    critique:
      question: 〈出師表〉是諸葛亮寫給皇帝劉禪看的。這段文字能證明什麼、不能證明什麼？
      options:
        - 能證明他公開說的北伐理由，也承認「益州疲弊」；但不能證明北伐會成功
        - 能證明北伐一定會成功，因為丞相寫給皇帝的話，每一句都是已經發生的事實
        - 能證明蜀漢朝廷上下全都支持北伐，沒有任何人覺得國力太疲弊、不該出兵
        - 能證明北伐只是諸葛亮找的藉口，他私底下其實根本不想恢復漢朝
      answer: 0
      explain: 〈出師表〉是 227 年諸葛亮寫給劉禪的，一方面說明他自己怎麼解釋北伐（興復漢室、報答先帝），一方面也承認「益州疲弊」。但它是說服皇帝的文章，不能證明北伐會成功。史家看法也不一：易中天認為北伐有興復漢室的正當性、控制內部、以攻為守三重目的；de Crespigny 認為把力量耗在徒勞的進攻上。
      why_wrong:
        - null
        - 這是他說服皇帝的文章，不是結果；實際上北伐只取得武都、陰平兩郡，沒有拿下關中。
        - 一篇文章只代表寫的人自己的說法；卡片還提到後來姜維的北伐在軍政兩界都不受歡迎。
        - 卡片沒有證據說他不想恢復漢朝；他自己把北伐說成報答先帝、興復漢室的責任。
    explain: 「攘除姦凶，興復漢室，還於舊都」：趕走他眼中的「姦凶」（篡漢的魏），恢復漢朝，回到舊都。前面「臣本布衣，躬耕於南陽」說的是他本來只是個在南陽種田的平民。這篇是寫給劉禪看的，所以也是一篇說服皇帝支持北伐的文章，讀的時候要想到寫作的目的。
    hints:
      - 找三個並列的短句：「攘除……」「興復……」「還於……」。
      - 「漢室」指的是哪個朝代？
      - 「舊都」是漢朝的首都，還是蜀漢的首都成都？
    ref: war-zhuge-northern-expeditions#A2
  - type: card
    id: event-nine-rank-system
    depth: understand
    prompt: 換到朝廷裡面。看看九品官人法怎麼替人打分數、誰來打分數，以及為什麼後來變成「上品無寒門，下品無勢族」。
    focus: [C4, C5]
    quick:
      - q: 九品官人法怎麼替人打分數？誰來打？
        a: 各州郡設「中正」，由在中央做官的人擔任。他們看家世、才德表現和自己的鑑定，把人評成從上上到下下九等，朝廷再依品授官。
      - q: 一套原本想選人才的制度，為什麼變成「上品無寒門，下品無勢族」？
        a: 父親的官品會影響兒子的品，中正又多出自大族，所以高品越來越集中在少數世家手裡，沒有家世的寒門士人吃虧。
  - type: card
    id: event-gaopingling-incident
    depth: understand
    prompt: 249 年，皇帝出城謁陵，一場政變在幾天內決定了魏國的主人。注意：司馬懿動手前做了什麼準備？曹爽為什麼不反抗？
    focus: [C1, C2]
    quick:
      - q: 司馬懿動手前做了什麼，讓曹爽放下戒心？
        a: 247 年他稱病不再上朝。曹爽派李勝去探病，他裝成病得快死的樣子，曹爽就放鬆了警戒。
      - q: 政變時曹爽有機會反擊嗎？他為什麼沒有？
        a: 有。桓範勸他帶皇帝去許昌號召各地，但曹爽不肯，以為投降後還能當個富足的侯爵。結果幾天後曹爽兄弟和親信全被處死、誅滅家族。
  - type: chain
    prompt: 把下列事件依照「因 → 果」排成一條鏈（最上面是最早的原因）。
    items:
      - 關羽失荊州，蜀漢只剩益州
      - 夷陵之戰，劉備大敗，蜀漢國力大損
      - 諸葛亮多次北伐，司馬懿領兵抵擋，聲望與兵權日增
      - 高平陵之變，司馬懿誅殺曹爽，魏國實權落入司馬家
      - 魏滅蜀，司馬炎取代曹魏建立晉朝
      - 晉滅吳，三國結束
    followup:
      question: 第 3 項（諸葛亮北伐）和第 4 項（高平陵之變）是什麼關係？
      options:
        - 北伐讓司馬懿長期統率西線大軍、累積兵權聲望，是政變的背景，不是直接原因
        - 北伐失敗直接導致曹爽被殺，所以兩件事其實是同一場戰爭的前後兩段
        - 諸葛亮在北伐時就和司馬懿私下約好，要一起除掉曹爽，再瓜分整個魏國
        - 兩件事完全沒有關係，司馬懿的兵權是在政變那天才第一次拿到的
      answer: 0
      explain: 高平陵卡寫，司馬懿在對抗諸葛亮北伐時長期統率西線大軍，累積兵權與聲望，這是背景。直接的導火線是曹爽排擠司馬懿、司馬懿裝病，再趁皇帝出城謁陵取得太后支持、控制宮門。所以北伐是背景，不是直接原因。
      why_wrong:
        - null
        - 卡片寫的直接過程是曹爽排擠司馬懿、司馬懿趁曹爽陪皇帝出城時動手，不是北伐的失敗。
        - 卡片裡沒有這樣的記載；兩人在北伐時是對手，司馬懿奉命堅守不戰。
        - 卡片寫司馬懿在對抗北伐時已經累積兵權與聲望，並被曹叡指定為輔政大臣之一。
    explain: 荊州與夷陵兩次失敗，讓蜀漢只剩益州一地，國力和魏的差距固定下來；諸葛亮的北伐沒能改變這個差距，卻讓防守關中的司馬懿累積了兵權和聲望。249 年司馬懿趁曹爽陪皇帝出城時發動政變，從此魏國由司馬家掌握；司馬昭滅蜀、司馬炎篡魏建晉，最後滅吳統一。戰場上分不出的勝負，是在朝廷裡決定的。
    hints:
      - 最早的原因是蜀漢丟掉一塊很重要的地方。
      - 司馬懿的兵權和聲望，有一部分是在對抗諸葛亮時累積的。
      - 晉朝是先滅蜀、再建國、最後滅吳。
    ref: event-gaopingling-incident#C7
  - type: compare
    cards: [person-zhuge-liang, person-sima-yi]
    prompt: 比一比兩位在五丈原對峙的人：一個一直進攻，一個一直等。
    rows:
      - { aspect: 身分, a: 蜀漢丞相，受劉備託孤、輔佐劉禪, b: 曹魏重臣，歷仕曹操、曹丕、曹叡、曹芳 }
      - { aspect: 對峙時的做法, a: 多次北伐，主動出擊、設法解決運糧問題, b: 堅守不戰，等對方糧盡或撐不下去 }
      - { aspect: 結局, a: 234 年病死在五丈原軍中, b: 249 年發動高平陵之變掌握魏國實權，251 年去世；孫子司馬炎建立晉朝 }
      - { aspect: 後世形象, a: 《三國演義》把他寫成料事如神的智者；正史裡他以執法公平、賞罰分明著稱，北伐卻始終未能成功, b: 小說裡總被諸葛亮算計；唐太宗稱讚他用人求賢，但連東晉明帝聽了祖先奪權的經過，都說晉朝國運怎能長久 }
    question: 諸葛亮和司馬懿，一個主動、一個等待。請說說兩人的選擇各自有什麼道理，再說說為什麼兩人的「形象」和正史有落差。
    model_answer: 諸葛亮主動北伐，是因為「興復漢室」是蜀漢存在的理由，易中天也認為北伐有以攻為守、先發制人的用意；司馬懿堅守不戰，是因為魏國國力較強，蜀軍翻越秦嶺運糧，好幾次都因糧盡撤退，拖得越久對蜀越不利。兩人的選擇都和自己國家的處境有關。形象的落差，一部分來自《三國演義》偏向蜀漢、把諸葛亮寫得料事如神（例如空城計是裴松之當場就反駁過的軼事）；至於「死諸葛走生仲達」，倒是史書記下的當時俗語，可見對峙時兩人的名聲就已經不一樣；另一部分來自後世對司馬氏篡魏的批評，連晉朝自己的皇帝聽到祖先奪權的經過都感到羞愧。讀人物時，要把「小說的他」「正史的他」「後世評價的他」分開看。
    points:
      - 諸葛亮主動北伐：「興復漢室」是蜀漢存在的理由，易中天也認為有以攻為守、先發制人的用意
      - 司馬懿堅守不戰：魏國國力較強，蜀軍翻越秦嶺運糧常因糧盡撤退，拖得越久對蜀越不利
      - 兩人的選擇都和自己國家的處境有關
      - 形象落差：《三國演義》偏向蜀漢，空城計是軼事；「死諸葛走生仲達」是史書記下的俗語；還有後世對司馬氏篡魏的批評
    hints:
      - 先看「對峙時的做法」：一個國力弱、一個國力強，各自適合什麼打法？
      - 再看「後世形象」：這些形象是從哪本書來的？
      - 打開兩張人物卡的「評價怎麼變」與「戲劇 vs 史實」。
  - type: today
    card: event-nine-rank-system
    question: 有人說「九品官人法就像今天看家世背景的推甄」。這個類比哪裡不成立？

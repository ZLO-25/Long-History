id: unit-cold-war-2
title: 冷戰（下）：太空、阿富汗與一個帝國的瓦解
histories: [歐洲史, 美國史]
mystery: 1957 年，蘇聯第一個把人造衛星送上太空；1961 年，又第一個把人送上太空。可是三十年後，這個擁有核武的超級強國沒有被外國打敗，卻在 1991 年由自己的加盟共和國宣布「不再存在」。一個帝國，是怎麼從裡面散掉的？
teaser: 一顆 83.6 公斤的金屬球、一趟秘密飛往北京的行程、一場陷在山谷裡的戰爭、一場很快失敗的政變。
goals:
  - 能說明太空競賽為什麼同時是科學比賽，也是飛彈和面子的比賽
  - 能說出尼克森訪華到美中建交的幾個步驟，以及《臺灣關係法》怎麼來的
  - 能說出 1986 年戈巴契夫在阿富汗問題上面對的選項，以及他最後怎麼決定
  - 能判讀戈巴契夫辭職演說的一段原文，並指出說話的人站在哪個立場
  - 能比較雷根和戈巴契夫，說明「冷戰怎麼結束」為什麼有不同的解釋
  - 能說出 1989 到 1991 年東歐劇變與蘇聯解體的主要經過
minutes: 45
level: 高中
curriculum: ["歷 Qc-IV-3", "歷 Lb-IV-1", "歷 Na-V-1"]
steps:
  - type: hook
    text: |
      上一課停在 1962 年：甘迺迪和赫魯雪夫在古巴危機裡各退一步，美蘇開始用熱線和條約管理核武。但比賽沒有停，只是換了場地。
      想像兩家公司比了三十年，一家先拿下好幾個「第一」，還有上萬名員工；最後它卻不是被對手併購，而是自己的分公司一家一家宣布獨立，總公司就這樣解散了。
      這一課我們先跟著火箭上太空、跟著季辛吉秘密飛到北京，再走進 1986 年蘇共中央的一場政治局會議，替戈巴契夫做一次決定。
    guess:
      q: 擁有核武的蘇聯，在 1991 年底解散了。你猜它最主要是怎麼「散掉」的？
      options:
        - 輸給美國的軍備競賽後，被外國逼著簽約投降，宣布解散
        - 被外國軍隊打敗，首都被占領，政府被迫解散
        - 強硬派政變失敗後中央失去權威，由加盟共和國的領袖簽約宣布不再存在
        - 在阿富汗戰敗後，國內軍隊譁變，推翻政府後自己解散
      reveal: 蘇聯不是被外國打垮的。1991 年 8 月強硬派政變失敗，中央權威崩潰；12 月 8 日俄羅斯、烏克蘭、白俄羅斯的領袖宣布蘇聯不再存在，12 月 26 日蘇聯正式解散。至於背後的原因，史家有不同的解釋。
  - type: card
    id: tech-space-race
    depth: understand
    prompt: 先看比賽的新場地。為什麼一顆 83.6 公斤的史普尼克，會讓美國人那麼害怕？前半段誰拿下比較多「第一」？蘇聯的「太空鐵幕」是什麼意思？
    focus: [T1, debate]
    quick:
      - q: 一顆只有 83.6 公斤的衛星，為什麼讓美國人那麼害怕？
        a: 因為能發射衛星的火箭，也可能把核彈打到美國。太空能力被當成國家安全的一部分。
      - q: 蘇聯的「太空鐵幕」是什麼意思？
        a: 蘇聯的太空計畫高度保密，通常只在成功後才公布，失敗常被隱瞞。史家費倫用「太空鐵幕」來形容。
  - type: card
    id: event-nixon-china
    depth: understand
    prompt: 冷戰不只是美蘇兩邊。美國為什麼要接近中國？注意 1971、1972、1979 年分別發生什麼事；「認知」和「承認」差在哪裡？從臺灣看，這七年發生了什麼？
    focus: [C1, C4]
    quick:
      - q: 1970 年代初，美國和中國為什麼都想改善關係？
        a: 美國陷在越戰裡，又和蘇聯對峙；中國和蘇聯在 1960 年代交惡，1969 年還爆發邊界衝突。雙方都有理由找新的外交選項。
      - q: 《上海公報》裡美方說的是「認知」，不是「承認」。兩者差在哪裡？
        a: 美方是「認知」到兩岸的中國人都主張只有一個中國，並說不挑戰這個立場；這不等於美方「承認」臺灣是中國的一部分。
  - type: decision
    role: 你是 1986 年 11 月 13 日出席蘇共中央政治局會議的戈巴契夫
    situation: |
      你在 1985 年 3 月當上總書記，蘇聯經濟長期停滯，和美國的軍備競賽、對外衝突又是沉重的負擔。美國總統雷根稱蘇聯為「邪惡帝國」。
      1979 年 12 月底，蘇聯大軍開進阿富汗，殺死不聽話的領導人阿明，扶植卡爾邁勒。原本以為很快就能收場，但各地的反抗者「聖戰士」得到美國經巴基斯坦秘密送來的援助，沙烏地阿拉伯、中國等國也出錢出力。蘇軍最多時約 11 萬 5 千人，能占住喀布爾等城市，卻控制不了山區：潘傑希爾谷地在 1980 到 1985 年間被攻打了九次，政府軍始終守不住。
      出兵之後，聯合國大會以 104 票對 18 票通過決議表達抗議，美國實施穀物禁運、帶頭抵制莫斯科奧運，剛簽好的限武條約 SALT II 也沒有被美國參議院批准。到這次會議時，你自己也說：「我們已經在阿富汗打了六年。」
      先別急著看選項：如果你是戈巴契夫，只知道這些，你會怎麼做？
    options:
      - label: 增兵、加大攻勢，打到贏為止
        result: 推測：蘇軍已經有十萬以上，山區卻始終打不下來；反抗軍的後方在巴基斯坦，外國援助也會繼續送進來。增兵等於在經濟停滯時再加一筆大開支，也會讓和美國的關係更緊張。歷史沒有走這條路，所以後果只能推測。
      - label: 維持現有兵力，繼續打下去
        result: 推測：戈巴契夫自己在這次會議上估計，如果做法不改，還會再打二、三十年。維持現狀也許守得住城市，但傷亡和開支會一年一年累積。歷史沒有走這條路，所以後果只能推測。
      - label: 訂下期限，分兩年把部隊撤出來
        result: 這是戈巴契夫在會議上主張的做法。他說「我們需要盡快結束這個過程」，提議 1987、1988 年各撤出一半部隊；1987 年年中他宣布將全面撤軍。至於撤軍之後阿富汗怎麼了，等一下的阿富汗卡會告訴你。
    actual: 戈巴契夫在 1986 年 11 月 13 日的政治局會議上說「如果做法不改，我們還會再打二、三十年」，主張 1987、1988 年各撤出一半部隊。1989 年 2 月 15 日，最後一支蘇軍縱隊越過邊界回到國內。但撤軍沒有帶來和平：阿富汗接著陷入內戰，估計有 100 萬到 300 萬阿富汗人在這場戰爭中死亡。
    ref: war-soviet-afghan#A7
    note: 沒有發生的選項，後果都是推測，標示清楚。阿富汗卡的故事、史料與觀點都寫到這次會議和撤軍，雷根卡的「史家怎麼吵」也提到援助游擊隊「有助於結束蘇聯占領」，所以兩張卡都放在決策之後；teaser 原本想寫「打了將近十年的戰爭」，會預告撤軍的時間，改成「陷在山谷裡的戰爭」。
  - type: card
    id: war-soviet-afghan
    depth: understand
    prompt: 對照你的選擇，看看這場戰爭從頭到尾怎麼走。蘇聯是有計畫地往南擴張，還是一步步陷進去？美國是不是故意把蘇聯拉進「越戰泥沼」？為什麼說蘇軍撤走並沒有帶來和平？
    focus: [debate, A8]
    quick:
      - q: 蘇聯出兵阿富汗，是早就計畫好的「往南擴張」嗎？
        a: 美國國家安全檔案館根據蘇聯的原始文件，認為是「任務逐步擴大」把蘇聯一步步拖進去，而不是預先計畫好的南進。
      - q: 1989 年蘇軍撤走之後，阿富汗就和平了嗎？
        a: 沒有。戰爭轉為內戰；1991 年蘇聯解體後援助中斷，政府在 1992 年被聖戰士推翻。估計有 100 萬到 300 萬阿富汗人在戰爭中死亡。
  - type: card
    id: person-reagan
    depth: understand
    prompt: 美國這邊的對手。雷根前半任和後半任，對蘇聯的做法有什麼不同？「星戰計畫」是什麼？他一句「推倒這道牆」，真的就讓圍牆倒了嗎？
    focus: [P3, debate]
    quick:
      - q: 雷根前半任和後半任，對蘇聯的做法有什麼不同？
        a: 前半任他放棄緩和，稱蘇聯為「邪惡帝國」、提出星戰計畫、援助阿富汗游擊隊。戈巴契夫上台後，他一邊公開喊話，一邊坐下來談，簽下《中程核武條約》。
      - q: 有人說冷戰的結束是被雷根的強硬路線逼出來的。這個說法有什麼不同的看法？
        a: 英文維基說雷根的外交政策「促成了冷戰的結束」。但戈巴契夫的辭職演說強調的是蘇聯內部的改變。兩種說法孰輕孰重，來源不足，沒有定論。
  - type: card
    id: person-gorbachev
    depth: understand
    prompt: 認識做決定的人。他想「修好」蘇聯，靠的是哪幾個政策？注意：他不是從來不動武，1990、1991 年在巴庫和維爾紐斯發生了什麼？西方和蘇聯國內，怎麼看他得諾貝爾和平獎？
    focus: [P5, P6]
    quick:
      - q: 戈巴契夫是不是從來不動武？
        a: 不是。1990 年 1 月蘇軍開進巴庫，向群眾開火；1991 年 1 月蘇軍在維爾紐斯占領建築、攻擊抗議群眾，15 人死亡。
      - q: 西方和蘇聯國內，對他得諾貝爾和平獎的看法有什麼差別？
        a: 西方領袖稱讚他結束冷戰、帶來自由。但當時民調顯示 90% 的蘇聯公民不贊成，批評者認為他削弱了俄羅斯的影響力，也要為經濟崩潰負責。
  - type: source
    card: person-gorbachev
    idx: 0
    question: 戈巴契夫在 1991 年 12 月 25 日的辭職演說裡，怎麼說冷戰的結束？
    options:
      - 他說冷戰是因為美國逼蘇聯投降才結束的，所以功勞全在美國
      - 他說冷戰還沒有結束，蘇聯會繼續留下來和美國長期競爭
      - 他辭去總統職務，並說冷戰已經結束、軍備競賽已經停止
      - 他辭職是因為在總統選舉中輸給了雷根，所以不得不下台
    answer: 2
    explain: 「I cease my activities in the post of the U.S.S.R. president」是宣布辭去蘇聯總統；「The Cold War has ended, the arms race has stopped」是說冷戰結束、軍備競賽停止。戈巴契夫卡的「史家怎麼吵」指出，他把這些當成自己推動的成果。讀的時候要想到：這是當事人在下台那天替自己說的話，雷根卡就記下另一種看法，認為雷根的外交政策「促成了冷戰的結束」。兩種說法孰輕孰重，卡片寫明目前來源不足，不能只聽一方。
    hints:
      - 先讀括號裡的中文翻譯：他「停止」擔任什麼？
      - 後半句說哪兩件事「已經結束」「已經停止」？
      - 想想看：誰在說這段話？他會怎麼替自己的任期下結論？
    why_wrong:
      - 演說裡他把結束冷戰說成自己推動的成果，並沒有說是美國逼出來的。
      - 原文是「冷戰已經結束」，不是還沒結束。
      - null
      - 雷根是美國總統，不是蘇聯選舉裡的對手；他是在三個共和國宣布蘇聯不再存在之後辭職的。
    critique:
      question: 戈巴契夫在下台那天說「冷戰結束了，軍備競賽停止了」。把它當史料，要注意什麼？
      options:
        - 這是當事人替自己下結論，把結束冷戰說成自己的成果，要對照其他說法
        - 這是雷根的說法，所以最能證明冷戰是被美國的強硬路線逼出來的，不必再看別人的意見
        - 這是第三方學者的研究結論，所以兩種解釋孰輕孰重已經有了定論，不需再討論
        - 這是政變的強硬派發表的聲明，所以只代表反對改革的那些人的想法，不是他的
      answer: 0
      explain: 這是戈巴契夫自己在辭職那天說的話，他很自然會把冷戰結束寫成自己推動的成果。另一種說法是雷根的外交政策「促成了冷戰的結束」。兩種說法孰輕孰重，卡片寫明目前來源不足，所以要對照著讀。
      why_wrong:
        - null
        - 這句話是戈巴契夫自己說的；雷根卡記下的是另一種看法，兩者並不是同一個人說的。
        - 這是當事人的演說，不是學者的研究；兩種說法孰輕孰重，卡片寫明來源不足，沒有定論。
        - 這是他自己的辭職演說；政變的強硬派是想推翻他，不是替他發言。
    ref: person-gorbachev#P4
  - type: card
    id: event-gorbachev-reform
    depth: understand
    prompt: 把改革的步驟排出來：國營企業法、合作社法、1989 年的選舉。為什麼改革反而讓商品短缺更嚴重？「改革害死了蘇聯」和「蘇聯早就病入膏肓」，兩種看法各看重什麼？
    focus: [C2, debate]
    quick:
      - q: 戈巴契夫的改革，為什麼反而讓商品短缺更嚴重？
        a: 他讓國營企業有更多自主權、允許私人合作社，但價格管制和國營體制大多沒有改，所以商品短缺反而更嚴重。
      - q: 「改革害死了蘇聯」和「蘇聯早就病入膏肓」，兩種看法各看重什麼？
        a: 前者看重改革本身：戈巴契夫和顧問低估了危機，也低估了放權的風險。後者看重結構：長期經濟停滯、軍備競賽的負擔和各共和國的民族主義，改革只是讓問題浮上檯面。
  - type: card
    id: event-end-of-cold-war
    depth: understand
    prompt: 1989 年像骨牌一樣。依序找出波蘭、匈牙利、波羅的海人鏈、柏林圍牆、馬爾他會談。哪一個國家是唯一用暴力推翻共黨政權的？冷戰到底是哪一天結束的，史家有幾種說法？
    focus: [C2, C7]
    quick:
      - q: 1989 年，東歐的共產政權為什麼會像骨牌一樣一個接一個倒下？
        a: 戈巴契夫放鬆了對東歐的控制。波蘭團結工聯在選舉中大勝，共產政權和平交出權力；匈牙利拆除邊界鐵絲網，又引發連鎖反應。
      - q: 冷戰到底是哪一天結束的？
        a: 沒有統一的答案。有人以 1989 年 12 月的馬爾他會談為準，也有許多史家以 1991 年蘇聯解體為準。
  - type: card
    id: event-soviet-collapse-1991
    depth: understand
    prompt: 最後四個月。1991 年 8 月的政變想做什麼，結果反而造成什麼？12 月 8 日、21 日、25 日、26 日分別發生什麼？為什麼說蘇聯「不是被外國打垮的」？
    focus: [C2]
    quick:
      - q: 1991 年 8 月的政變想做什麼？結果反而造成什麼？
        a: 共產黨強硬派想推翻戈巴契夫、阻止聯盟鬆動。但政變很快失敗，中央權威反而崩潰，烏克蘭、白俄羅斯等共和國接連宣布獨立。
      - q: 12 月 8 日和 12 月 25 日，各發生了什麼事？
        a: 12 月 8 日，俄羅斯、烏克蘭、白俄羅斯的領袖宣布蘇聯不再存在。12 月 25 日戈巴契夫辭職，把總統權力和核武發射密碼的控制權交給葉爾欽；26 日蘇聯正式解散。
  - type: chain
    prompt: 把蘇聯走向解體的過程，依照「因 → 果」排成一條鏈（最上面是最早的原因）。
    items:
      - 蘇聯經濟長期停滯，軍備競賽與對外戰爭的開支沉重
      - 戈巴契夫上台，推動改革重建與開放政策，也放鬆對東歐的控制
      - 蘇聯舉行第一次全國性競爭選舉，東歐各國共產政權接連下台，柏林圍牆開放

title: 凱撒遇刺（前 44 年三月）
note: "前 44 年三月，凱撒在元老院被刺殺。這時羅馬共和國已管到：義大利（含波河平原）、西西里與薩丁尼亞科西嘉、整個伊比利亞半島（北岸山區要到前 19 年才平定）、高盧（凱撒從前 58 年起征服，約前 50 年完成）、伊利里亞（達爾馬提亞）、馬其頓與希臘、亞細亞行省與比提尼亞—本都、奇里乞亞、敘利亞、昔蘭尼加與北非的阿非利加行省。托勒密埃及名義上獨立，由克麗奧佩脫拉七世統治，但實際靠羅馬支持；凱撒前 47 年讓她的弟妹統治賽普勒斯，所以圖上把賽普勒斯畫在埃及。東邊的安息帝國是羅馬唯一的對等強權，前 53 年卡雷之戰擊敗克拉蘇。小亞細亞中部、亞美尼亞與猶太等是羅馬的附庸王國（背景）。以今日國界近似，邊界只是示意；切線理由見 docs/dive-rome.md。"

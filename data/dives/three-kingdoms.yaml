# 深入專題：三國。怎麼新增一個專題見 docs/dives.md；勢力圖的切線與來源見 docs/dive-three-kingdoms.md
id: dive-three-kingdoms
title: 三國：從黃巾之亂到三家歸晉
question: 小說裡的三國是英雄的舞台，正史裡的三國卻是人口少掉一大半的亂世。曹操、劉備、孫權、諸葛亮各自做了什麼選擇？打了快一百年，最後得天下的為什麼是司馬家？
blurb: 這個專題把東漢末到西晉統一的近百年放大來看：中央怎麼垮掉、北方怎麼被曹操收拾、赤壁之後三家怎麼站穩、諸葛亮為什麼一直北伐，以及屯田、九品官人法這些「不熱鬧」的制度，怎麼決定了誰撐得久。每個人物都放上「從另一邊看他」，也把《三國演義》的說法和《三國志》並排比對。
# 184 年黃巾之亂：東漢中央開始失控；280 年晉滅吳：三國結束
range: { start: 184, end: 280 }

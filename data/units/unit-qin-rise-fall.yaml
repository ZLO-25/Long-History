  - type: transfer
    card: war-seven-states-rebellion
    case: 劉邦建立漢朝後，把東方大片土地封給劉家親戚當諸侯王，西部則設郡，這叫「郡國並行」。幾十年後，吳國有銅有鹽、百姓不必繳稅，吳王劉濞富可敵國；文帝時諸侯還可以自己鑄錢。前 154 年，景帝採納晁錯的〈削藩策〉，削減楚、趙、膠西、吳等國的封地，吳王聯合七國起兵，口號是「誅晁錯，清君側」。戰事約三個月就被平定，戰後景帝規定諸侯王不得治理封國。
    question: 這一課看到，秦用嚴法與動員讓國家變強，統一後同一套做法卻變成壓力。請借用這個想法看漢初的諸侯王國：一套安排為什麼會隨著時間變成麻煩？它和秦末有哪裡像、哪裡不同？
    hint: 先問：幾十年之後，諸侯國變得怎麼樣？朝廷後來做了什麼？再和大澤鄉的戍卒比一比。
    points:
      - 劉邦把東方大片土地封給劉氏親屬，形成西部設郡、東部封國的「郡國並行」
      - 幾十年後王國越來越強：吳國有銅有鹽、百姓不必繳稅，文帝時諸侯可以自己鑄錢
      - 朝廷削減封地，吳王聯合七國起兵；晁錯自己說「削之亦反，不削亦反」
      - 和秦末相比：都是一套安排隨時間變成壓力；但七國之亂約三個月就平定，戰後中央權力大增，不像秦十五年就亡
    model_answer: 劉邦把東方大片土地封給劉氏親屬，西部設郡，形成「郡國並行」。幾十年後，王國越來越強：吳國有銅有鹽、百姓不必繳稅，文帝時諸侯還可以自己鑄錢。朝廷（晁錯的〈削藩策〉）開始削減封地，吳王便聯合七國起兵；晁錯自己說「削之亦反，不削亦反」，也就是封國太強，早晚會出問題。和秦末相似的是：一套原本的安排，隨著時間變成壓力或威脅，雙方最後只能硬碰硬。不同的是：七國之亂約三個月就被平定，戰後景帝規定諸侯王不得治理封國，中央大為加強；秦則在統一後十五年就滅亡了。
  - type: recap
    model_answer: 秦最強的時候，讓它亡的東西很可能已經在裡面了。商鞅變法用連坐、軍功和獎勵耕戰，把秦國改造成能動員全國人力種田、打仗的國家，這讓秦十年間滅掉六國；但統一後，秦繼續用同一套思路治理全國：嚴法、重稅、大量徭役，還想用焚書統一思想。前 209 年，九百名戍卒在大澤鄉遇雨誤期，相信「失期，法皆斬」，選擇起事；各地反秦勢力接連而起，秦朝在前 206 年滅亡。諷刺的是，接手的漢朝沿用了秦的政府機構和法律，只是調整了用法、慢慢收回地方的權力。也要記得兩個提醒：第一，「焚書坑儒」裡的焚書有《史記》的焚書令可查，但「坑儒」在《史記》以前沒有任何文獻提到，被殺的未必是儒生，「坑」也不一定是活埋，四個字連用最早出現在 4 世紀初；第二，「暴秦」的形象多半出自漢代以後的史家，有學者提醒後世筆下秦的嚴刑峻法可能受到政治偏見影響，連「失期當斬」是不是秦法明文也有爭議。這是一種參考說法，不是標準答案。
    points:
      - 讓秦變強的商鞅變法，統一後仍用同一套思路：嚴法、重稅、大量徭役，還想用焚書統一思想
      - 前 209 年戍卒遇雨誤期，相信「失期，法皆斬」而起事，各地反秦，秦於前 206 年滅亡
      - 漢朝沿用秦的政府機構與法律，只調整用法、慢慢收回地方的權力
      - 兩個提醒：「坑儒」的史料有爭議；「暴秦」形象多出自漢代以後，「失期當斬」是不是明文也有爭議

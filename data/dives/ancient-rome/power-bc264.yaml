title: 第一次布匿戰爭前夕（前 264 年）
note: "前 264 年，羅馬已把義大利半島中南部（波河以南）收進自己的同盟與殖民體系，迦太基則是西地中海最大的海上強權：突尼西亞核心、利比亞與阿爾及利亞的沿海據點、西班牙南岸的幾個港口、西西里西部與薩丁尼亞（科西嘉當時的歸屬不確定，這裡只把島的位置標給迦太基，僅供示意）。西西里東南角是敘拉古王國（希倫二世）；東北角的墨西拿由『馬末爾提諾』傭兵占據，他們向羅馬求援，成為戰爭的導火線，圖中留白。東方的三大希臘化王國（安提柯、塞琉古、托勒密）標示當背景，色彩與古希臘專題一致。以今日國界近似，邊界只是示意；切線理由見 docs/dive-rome.md。"

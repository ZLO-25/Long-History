  - type: recap
    model_answer: 1492 年哥倫布往西航行，以為自己到了亞洲的「印度」，其實到了美洲，那裡早就住著人。哥倫布日誌寫「只要五十個人，就能把他們全部征服」，這是哥倫布自己的看法，泰諾人當時的書面紀錄沒有查到。科爾特斯只有約 630 人，卻能攻下阿茲特克，是因為有好幾萬原住民盟軍，加上 1520 年天花爆發；皮薩羅是在印加剛陷入兄弟內戰時，俘虜了皇帝。同樣是西班牙人，拉斯卡薩斯 1514 年放棄原住民勞力，他的報告促成 1542 年《新法》，卻在殖民地引起反彈；他也曾建議引進非洲奴隸，後來後悔。作物也跟著走：番薯從呂宋傳到福建，後來成為臺灣最有代表性的食物之一；但同一場交換，也帶來疫病與奴役的代價，美洲原住民一百年內可能死了九成。
    points:
      - 科爾特斯攻下阿茲特克，靠原住民盟軍與天花，不只幾百人
      - 哥倫布的日誌只是他自己的看法；拉斯卡薩斯為原住民說話，也有爭議
      - 大交換有兩面：番薯等作物改變餐桌，疾病、強迫勞動與奴役讓美洲原住民人口崩潰
reflect: 同一場大交換，有人多了一種救荒的作物，有人卻失去了家人與家園。想一次你做過的決定：對你自己是好處，對別人卻可能是代價。你會怎麼提醒自己，看見另一邊的人？

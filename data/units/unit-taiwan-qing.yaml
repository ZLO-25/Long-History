id: unit-taiwan-qing
title: 清領兩百年：清朝為什麼要兩百年才認真看臺灣？
histories: [臺灣史, 中國史, 世界通史]
mystery: 清朝統治臺灣 212 年，為什麼前 190 年幾乎不管，最後 20 年卻突然蓋鐵路、設省？
teaser: 一塊差點不要的島、一群擋不住的移民、一艘琉球船的船難：清朝治臺的態度是怎麼翻轉的？
goals:
  - 能說出清領前期清廷治臺的目標（防止臺灣再變成反清基地），以及渡臺禁令、番界這些「消極治臺」的做法
  - 能指出 1860 年代開港、1874 年牡丹社事件、1884 年清法戰爭，各自如何把清廷推向「積極治臺」
  - 能判讀 1875 年廢除渡臺禁令的官方告示，說出它宣布了什麼
  - 能比較清領前期與建省後的治理，並從移民社會與原住民族兩個視角說出「積極治臺」的代價
  - 能指出拿牡丹社事件比喻今天的國際爭端時，哪裡不成立
minutes: 40
steps:
  - type: hook
    text: |
      想像你家在很遠的地方繼承了一塊地。長輩覺得那裡只會惹麻煩，派個人看著就好，誰想搬過去還要先登記、不准帶家人。
      結果擋不住：一堆人偷偷搬過去，自己挖水圳、自己分地盤，常常為了地和水打起來。
      一百多年後，隔壁鄰居忽然帶人闖進你家那塊地，還說「反正那邊沒人管」。這時候家裡才急了：開路、圍籬笆、蓋房子，最後乾脆把它升格成一個「分公司」。
      1683 年清朝取得臺灣，1895 年把它割讓給日本。這兩百多年裡，清廷對這座島的態度，差不多就是這樣翻轉的。
  - type: card
    id: event-koxinga-taiwan
    depth: story
    prompt: 先看清朝是怎麼拿到臺灣的：注意最後一段，1683 年施琅攻下澎湖後鄭家投降。清朝要的是消滅鄭氏，還是要這座島？
  - type: card
    id: event-qing-taiwan-frontier
    depth: understand
    prompt: 讀「背景」時注意：清廷拿到臺灣後，朝中竟有人主張不要留下；施琅說了什麼，康熙才接受？再看「經過」，官府限制移民，人口卻怎麼變化？
  - type: card
    id: commodity-taiwan-tea-camphor
    depth: story
    prompt: 1860 年代開港後，臺灣多了什麼能賣到美國、歐洲的東西？注意故事最後一句，經濟重心從哪裡移到哪裡。
  - type: card
    id: event-mudan-incident
    depth: deep
    prompt: 這是整個單元的轉折：讀「背景」時注意清廷回答日本的那一句話，讀「經過」時注意 1874 年和 1884 年兩次外敵之後，清廷各做了什麼。再看「常見誤解」：這場事件裡清軍有沒有和日軍打起來？最後看「長期影響」，國家力量進入山區之後，對原住民族意味著什麼。
  - type: source
    card: event-mudan-incident
    idx: 0
    question: 這段 1875 年刻在石碑上的上諭，宣布了什麼？
    options:
      - 從今以後不准民人渡臺
      - 廢除從前不准民人渡臺的各項禁令，並放寬鐵、竹的買賣
      - 命令原住民遷往山區
      - 宣布臺灣正式建省
    answer: 1
    explain: 「着悉與開除」就是「全部廢除」；「弛禁」是放寬禁令；「以廣招徠」是要吸引更多人來。這張告示是沈葆楨奏准後，由臺灣總兵與臺澎兵備道聯名發布的，立在南投鹿谷的福德廟。它和清領前期的方向正好相反：以前限制人來，現在要招人來。
    hints:
      - 抓關鍵詞：「不准民人渡臺各例禁」指的是哪一類規定？後面接的動詞是什麼？
      - 「開除」在這裡不是開除學生，是把這些禁令「除掉」；「弛禁」是鬆開禁令。
      - 整句的意思是：以前所有不准人渡臺的禁令全部廢除，鐵和竹也一律開放買賣，好讓更多人來。
    ref: event-mudan-incident#C4
  - type: chain
    prompt: 把下列事件依照「因 → 果」排成一條鏈（最上面是最早的）。想一想：每一步怎麼把清廷推向「認真看臺灣」？
    items:
      - 清廷把臺灣設為福建省下的一個府，限制移民、劃番界
      - 移民照樣偷渡湧入，形成移墾社會，分類械鬥與民變不斷
      - 1860 年代淡水、打狗等港口開港，茶、糖、樟腦賣到世界，經濟重心北移
      - 1874 年日本以琉球船難為由出兵臺灣南端（牡丹社事件）
      - 沈葆楨來臺：開山撫番、奏准廢除渡臺禁令、增設臺北府
      - 1884 年清法戰爭，法軍攻占基隆
      - 1885 年清廷決定臺灣建省，劉銘傳清賦、鋪電纜、蓋鐵路
    explain: 前兩步是清領前期：清廷的重點是治安而不是開發，官府管不住移民，社會動盪。開港後茶糖樟腦讓臺灣接上世界市場，北部財富累積。真正的轉折是外敵：1874 年日本出兵暴露了清廷在邊疆「不管」的空隙，沈葆楨才來臺開山、廢禁、設府；1884 年法軍攻基隆再次敲響警鐘，1885 年清廷決定建省，劉銘傳推動新政。
    hints:
      - 先把「清廷不想管」的兩步放最前面：先有制度上的限制，才有移民偷渡與動盪。
      - 開港（1860 年代）在牡丹社事件（1874）之前；沈葆楨是因為日本出兵才來的。
      - 清法戰爭（1884）在建省（1885）前一年，建省是對它的回應。
    ref: event-mudan-incident#C2
  - type: compare
    cards: [event-qing-taiwan-frontier, event-mudan-incident]
    prompt: 比一比清領前期（1684 年起）和牡丹社事件以後（1874 年起）的治理。
    rows:
      - aspect: 態度
        a: 消極：目標是消滅明鄭勢力，怕臺灣再變成反清基地；朝中甚至有人反對把臺灣留下來
        b: 積極：日本出兵與清法戰爭讓清廷意識到東南海防的漏洞，轉為「積極治臺」
      - aspect: 政策重點
        a: 治安而非開發：設一府三縣、班兵制度，要憑照才能來、不准帶家眷
        b: 海防與開發：建砲臺、開山、廢除渡臺禁令以招人來，建省後清賦、鐵路、電報、西學堂
      - aspect: 政治重心
        a: 臺灣府城（今臺南）；移民由南往北推進，「一府二鹿三艋舺」
        b: 1875 年增設臺北府，建省後臺北成為劉銘傳新政的中心
      - aspect: 對原住民族的影響
        a: 用土牛溝與番界把漢人和原住民隔開，但界線一路往山區移；平埔族土地被租走、買走或侵墾，獵場縮小
        b: 國家力量直接進入山區與後山，「撫番」必要時武力征討；排灣族各社先被日軍燒村，樟腦開採也侵入泰雅族領域
    question: 清廷的態度為什麼從「消極」變「積極」？這個轉變對原住民族來說，是變好還是變壞？
    model_answer: 轉變的關鍵不是清廷自己想通，而是外力：1874 年日本出兵、1884 年法軍攻基隆，讓清廷意識到邊疆「不管」會被別人利用，才願意花錢在臺灣開山、設府、建省。對原住民族來說，前期的政策是「隔開」，番界雖然一直往山裡移，官府至少名義上禁墾番地；後期則是「進入」，開山撫番把國家力量推進山區與後山，必要時武力征討，樟腦利益也把漢人腦丁和官府推進泰雅族領域。所以「積極治臺」從原住民族的角度看，與其說是進步，更像是此後數十年衝突的開始。
    hints:
      - 看「態度」那一列：兩個時期各發生了什麼「從外面來」的事件？
      - 看「對原住民族的影響」那一列：前期的關鍵字是「隔開」，後期的關鍵字是「進入」。
      - 牡丹社卡的「長期影響」說，國家力量進入山區，開啟了此後數十年漢人、國家與原住民族之間的衝突。
  - type: decision
    role: 你是 1874 年 5 月的清廷大臣
    situation: |
      三年前，琉球宮古島的船漂到臺灣南端，船員上岸後與排灣族高士佛社發生衝突，54 人遇害。日本抗議時，朝廷回答：臺灣「生番」是化外之民，由日方自行處理。
      現在日本真的來了：西鄉從道率約 3,600 人在社寮登陸，正在攻打牡丹社。朝廷要怎麼辦？
    options:
      - label: 堅持「生番」是化外之民，不是我們的事，不管
        result: 推測：等於承認臺灣南端不在清朝版圖內，日本可能就此留下。歷史沒有走這條路，所以後果只能推測。
      - label: 派欽差大臣來臺辦防務，同時和日本談判讓它撤兵
        result: 這是清廷當年的選擇。5 月下旬派沈葆楨為欽差大臣來臺；10 月 31 日簽訂北京專約，清廷付 50 萬兩（10 萬兩撫卹、40 萬兩購買道路房屋），日軍撤離。但日本取得清朝承認其出兵為「保民義舉」，1879 年進一步廢琉球王國、設沖繩縣。
      - label: 直接派清軍攻打登陸的日軍
        result: 推測：清軍與日軍直接開戰，結果難料。歷史沒有走這條路，牡丹社事件中清軍沒有參戰，所以後果只能推測。
    actual: 清廷選擇了派沈葆楨來臺、同時用外交解決。日本撤兵了，但這件事嚇醒了清廷：沈葆楨在安平蓋億載金城、分三路開山進入後山、奏准廢除渡臺禁令、增設臺北府與恆春縣。清廷從「消極防臺」轉為「積極治臺」，就是從這裡開始。
    ref: event-mudan-incident#C2
    note: 「沒有發生的選項」的後果都是推測，標示清楚。「生番」「化外之民」是當時清廷的用語，不是今天對原住民族的稱呼。
  - type: today
    card: event-mudan-incident
    question: 有人說「牡丹社事件就像今天某國拿一個小事件當藉口，出兵別國的邊境」。這個類比哪裡不成立？
    model_answer: 先說不能類比的地方：1874 年沒有今天的國際法框架來處理船難與領土主張，清廷那句「化外之民」在今天不可能成立；原住民族當時沒有任何法律地位，排灣族各社是被日本和清朝兩邊「代表」卻沒人問過的當事人；清代的「建省」也不是今天的地方自治，巡撫由皇帝任免。所以不能直接拿它套今天的國際爭端。可以借來想的是結構：一個國家在邊疆「不管」留下的空隙，可能被別人拿來當出兵的藉口；而中央往往要等到外敵威脅之後，才願意花錢投資邊疆的基礎建設。
  - type: check
    items:
      - kind: choice
        q: 清朝剛取得臺灣時，治理的重點是什麼？
        options: [開發茶和樟腦出口賺錢, 防止臺灣再變成反清基地, 蓋鐵路和電報接上世界, 把原住民族納入戶口]
        answer: 1
        explain: 清廷的目標是消滅明鄭勢力，連要不要留下臺灣都有人反對；施琅說留臺不會增加財政負擔、又能當東南沿海的屏障，康熙才接受。之後的移民限制、番界，重點都是治安而不是發展。
        hints: [回想 hook 裡「長輩覺得那塊地只會惹麻煩」的比喻。, 清領前期卡的「背景」寫了施琅是怎麼說服康熙的。]
        ref: event-qing-taiwan-frontier#C1
      - kind: order
        q: 依時間先後排列：
        items: [施琅攻下澎湖、鄭氏投降, 林爽文事件, 淡水、打狗等港口陸續開港, 日本出兵臺灣（牡丹社事件）, 法軍攻占基隆（清法戰爭）, 基隆—臺北鐵路通車]
        explain: 1683 施琅攻澎湖 → 1786 林爽文 → 1860 年代開港 → 1874 牡丹社事件 → 1884 清法戰爭 → 1891 鐵路通車。前三件是清領前期與開港，後三件是「認真看臺灣」的二十年。
        hints: [林爽文事件是清領前期三大民變之一，比開港早。, 牡丹社事件在清法戰爭前十年；鐵路是建省後劉銘傳蓋的。]
        ref: event-mudan-incident#C2
      - kind: short
        q: 用一兩句話說出沈葆楨 1874 年來臺之後做的兩件事，並說明它們和清領前期的做法有什麼不同。
        model: 他分三路開山進入後山並「撫番」、奏准廢除渡臺禁令、增設臺北府與恆春縣、在安平蓋億載金城。前期是限制人來、用番界把山區隔開；沈葆楨反過來要招人來、把國家力量推進山區。
        explain: 這幾件事標誌清廷從「消極防臺」轉為「積極治臺」。不過別忘了，「開山撫番」對沿路的原住民族來說，意味著被征討與遷村。
        hints: [回去看牡丹社卡故事版「這件事嚇醒了清廷」後面那一句。, 想想 source 步驟那塊石碑：它廢除的是什麼？]
        ref: event-mudan-incident#story
  - type: recap
    model_answer: |
      清朝一開始要的不是臺灣，而是消滅鄭氏；朝中甚至有人主張不要留下這座島。留下之後，政策重點是治安而不是開發：限制移民、劃番界，但擋不住偷渡，臺灣變成一個常常械鬥、民變的移墾社會，官府管不太動。
      轉變來自外面：1860 年代開港後茶、糖、樟腦讓臺灣接上世界市場、北部富起來；1874 年日本以琉球船難為由出兵，暴露了清廷說「生番」是化外之民、自己不管的空隙；1884 年法軍又攻占基隆。清廷這才意識到東南海防的漏洞，沈葆楨開山、廢禁、設府，1885 年建省，劉銘傳蓋鐵路、鋪電纜、清賦。所以不是清朝突然想通，而是被逼的。
      最後記住兩個視角：對漢人移民社會來說，這兩百年是村落、祖籍分布與水圳定型、北部崛起的時代；對原住民族來說，前期是土地被租走買走、被推往山區，後期「積極治臺」反而讓國家力量直接進入山區與後山，衝突才剛開始。十年後的 1895 年，清朝又把臺灣割讓給了日本。

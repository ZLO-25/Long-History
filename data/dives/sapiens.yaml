    - no: 8
      part: 2
      title: 不平等是天生的嗎？
      en: There Is No Justice in History
      claim: |
        哈拉瑞認為，想像的秩序讓大家能合作，卻一點也不公平：印度種姓、美洲的種族階級、幾乎普世的男尊女卑，都缺乏生物學根據 [b8][b24]。他主張這些階級常起於偶然，例如歐洲人到非洲買奴隸，部分只是因為從非洲運過去比較便宜，之後再編出「天生低劣」的說法 [b8]。歧視讓弱勢者得不到教育，又反過來「證明」了偏見，形成惡性循環，使不平等延續好幾百年 [b8]。

id: unit-taiwan-currency-1949
title: 四萬換一塊：錢為什麼會變成廢紙？
histories: [臺灣史, 錢的歷史, 中國史]
mystery: 1949 年，四萬塊舊臺幣只換得到一塊新臺幣。錢怎麼會一下子變得這麼不值錢？
teaser: 你錢包裡的新臺幣，是為了救一場「錢變廢紙」的災難才誕生的。
goals:
  - 能用「政府缺錢 → 印鈔 → 物價飛漲」的因果鏈說明惡性通膨
  - 能判讀一段 1949 年官員的書信，說出他擔心什麼
  - 能比較臺灣舊臺幣、大陸金圓券、德國紙馬克三次通膨的異同
  - 能指出把 1949 年的通膨拿來比喻今天的物價上漲時，哪裡不成立
minutes: 35
steps:
  - type: hook
    text: |
      想像你早上拿 50 元買一碗麵，晚上同一碗麵變 80 元，下禮拜變 200 元。
      你領到零用錢的第一件事，會是趕快花掉，因為明天它就更薄了。
      1945 到 1949 年的臺灣，大家每天都在過這種日子。最後政府乾脆宣布：四萬元舊臺幣，換一元新臺幣。
  - type: card
    id: finance-taiwan-1949-currency
    depth: story
    prompt: 先看臺灣發生了什麼：注意「錢是從哪裡多出來的」。
  - type: sim
    sim: debase
    prompt: 動手試試看：這個模擬用的是古代銀幣，但道理和印鈔相通：政府用「不值那麼多」的錢付帳，付得越多，物價會怎樣？想一想，舊臺幣的情況哪裡和模擬一樣、哪裡不一樣？
  - type: chain
    prompt: 把下列事件依照「因 → 果」排成一條鏈（最上面是最早的原因）。
    items:
      - 政府和公營事業花的錢比收入多
      - 臺灣銀行替政府墊錢、多印鈔票
      - 市面上的鈔票越來越多，物價越漲越快
      - 鈔票面額越印越大，大家不再相信舊臺幣
      - 1949 年 6 月改發新臺幣，四萬換一元
    explain: 缺錢 → 印鈔 → 物價上漲 → 失去信任 → 換新貨幣。注意最後一步並沒有立刻解決問題：物價要到 1950 年代初美援進來、赤字縮小後才穩定。
    hints:
      - 最早的原因跟「政府的帳」有關。
      - 鈔票變多，跟物價變高，哪一個先發生？
      - 換新貨幣是在大家已經不信任舊錢之後。
    ref: finance-taiwan-1949-currency#F2
  - type: source
    card: finance-taiwan-1949-currency
    idx: 1
    question: 陳誠在 1949 年的信裡，最擔心的是什麼？
    options:
      - 臺灣的稻米產量不夠
      - 臺灣銀行替中央墊付的軍公經費太多，臺灣會被拖垮
      - 美國不願意給臺灣援助
      - 新臺幣印得太少，市面上不夠用
    answer: 1
    explain: 他說墊款已經「合新臺幣發行總額百分之九十」，再這樣下去「臺省勢必非至崩潰不可」。也就是說，臺灣發出去的錢，大部分是替中央付軍費和公務開支；這是鈔票越印越多的重要來源之一（學者對其他原因，例如管制政策的影響，也有討論）。讀這段史料也要注意：這是當時主政者自己的說法，他有立場，但他點出的問題和學者用資料算出來的結果一致。
    hints:
      - 先找數字：「百分之九十」指的是什麼佔了發行總額的九成？
      - 「長此以往」後面接的是什麼結果？
      - 想想看：墊付經費的錢是從哪裡來的？
    ref: finance-taiwan-1949-currency#F2
  - type: card
    id: finance-gold-yuan-1948
    depth: story
    prompt: 同一時間，大陸也在換新貨幣。讀完想想看：金圓券和新臺幣的命運為什麼不一樣？
  - type: card
    id: finance-weimar-hyperinflation
    depth: story
    prompt: 再往前二十多年，德國也發生過一樣的事。注意德國的錢最後是怎麼「止血」的。
  - type: compare
    cards: [finance-taiwan-1949-currency, finance-weimar-hyperinflation]
    prompt: 比一比臺灣和德國的兩次換新貨幣。
    rows:
      - { aspect: 時間, a: 1945–1949 年通膨，1949 年 6 月換新臺幣, b: 1921–1923 年通膨，1923 年 11 月換地租馬克 }
      - { aspect: 錢為什麼印太多, a: 替中央墊付內戰軍費與公務開支, b: 戰爭債務、賠款，加上 1923 年替魯爾罷工工人發薪水 }
      - { aspect: 換算比例, a: 四萬元舊臺幣換一元新臺幣, b: 一兆紙馬克換一地租馬克 }
      - { aspect: 怎麼重建信用, a: 限量發行、80 萬兩黃金準備，後來還要靠美援, b: 以全國土地與工商業資產擔保、和黃金價格掛鉤 }
    question: 兩次換新貨幣最大的相同點和最大的不同點各是什麼？
    model_answer: 相同點：都是政府靠印鈔撐財政，最後鈔票失去信用，只好換一種有擔保、限量發行的新貨幣。不同點：德國換成地租馬克後物價很快穩定；臺灣換成新臺幣後，因為赤字還在，物價又漲了好幾倍，要到美援進來才真正穩定。同一時期的大陸金圓券則是反例：換了新貨幣卻繼續濫印，不到一年就崩潰。
    hints:
      - 先看「錢為什麼印太多」那一列：兩邊的共同點是什麼？
      - 再看兩張卡的故事最後一段：換新貨幣之後，物價有沒有馬上停？
      - 想想金圓券：換新貨幣一定有用嗎？
  - type: decision
    role: 你是 1949 年 6 月的臺灣省政府官員
    situation: |
      舊臺幣已經印到一萬元面額，物價天天漲。大陸的金圓券正在崩潰，熱錢一直流進臺灣。
      中央撥來 80 萬兩黃金當準備。你可以換新貨幣，但手上的黃金有限，政府每個月還是要付軍費。你會怎麼設計？
    options:
      - { label: 發行新臺幣，嚴格限量並以黃金為準備, result: 這接近當年的選擇：新臺幣發行以 2 億元為限，5 元換 1 美元，並切斷和金圓券的兌換。但赤字仍在，物價一年內又漲了數倍，直到 1950 年代初美援進來才穩定。 }
      - { label: 不換貨幣，繼續發行舊臺幣、用管制壓物價, result: 推測：金圓券的經驗顯示，只靠限價、不停止印鈔，物價管制撐不了多久。歷史沒有在臺灣走這條路，所以後果只能推測。 }
    actual: 1949 年 6 月 15 日臺灣實施幣制改革，四萬元舊臺幣換一元新臺幣；新臺幣一直用到今天，但穩定物價花了好幾年。
    ref: finance-taiwan-1949-currency#F3
    note: 「沒有發生的選項」的後果都是推測，標示清楚。
  - type: today
    card: finance-taiwan-1949-currency
    question: 最近物價上漲，有人說「臺灣會不會又要四萬換一塊？」這個類比哪裡不成立？
    model_answer: 1949 年的臺灣處在內戰和大量移民湧入的非常時期，發鈔的是省級銀行，政府直接叫它印錢付軍費；今天臺灣有獨立的中央銀行、龐大的外匯存底和完整的物價統計，一般的物價上漲和當年每年漲好幾倍的惡性通膨，規模完全不同。這個類比可以提醒我們「印太多錢會出事」，但不能拿來預測今天會發生同樣的事。
  - type: check
    items:
      - kind: choice
        q: 惡性通膨最根本的原因是什麼？
        options: [人民太愛花錢, 貨幣發行量遠遠超過經濟需要，政府靠印鈔補財政缺口, 商人故意漲價, 天災造成糧食歉收]
        answer: 1
        explain: 吳聰敏與高櫻芬的研究指出，1945 年底到 1950 年底臺灣的貨幣數量和物價都漲了 6,000 倍以上，物價跟著鈔票走。商人漲價、搶購都是結果，不是根源。
        hints: [回去看「史家怎麼吵」的第一段。, 哪一個選項說的是「錢的數量」？]
        ref: finance-taiwan-1949-currency#F4
      - kind: order
        q: 依時間先後排列：
        items: [德國發行地租馬克, 臺灣銀行發行舊臺幣, 大陸發行金圓券, 臺灣發行新臺幣]
        explain: 1923 地租馬克 → 1946 舊臺幣 → 1948 年 8 月金圓券 → 1949 年 6 月新臺幣。
        hints: [德國的事發生在二戰之前。, 金圓券比新臺幣早不到一年。]
        ref: finance-gold-yuan-1948#F5
      - kind: short
        q: 用一兩句話說明：為什麼大陸的金圓券崩潰，會讓臺灣的通膨更嚴重？
        model: 金圓券發行初期和舊臺幣維持固定匯率，大陸的避險資金大量流入臺灣，讓臺灣市面上的錢更多、物價漲得更快；所以新臺幣改革第二天就停止和金圓券兌換。
        explain: 兩地的貨幣被綁在一起，一邊出事會傳到另一邊。
        hints: [看金圓券卡「從臺灣看」那一句。, 錢會往哪裡跑？]
        ref: finance-gold-yuan-1948#F5
  - type: recap
    model_answer: 因為政府長期花的比收的多，叫銀行印鈔票來補，鈔票越來越多，物價就越漲越快；大家一旦不相信這種錢，就只能換新貨幣、拿掉後面的零。但換新貨幣不是魔法：大陸的金圓券換了卻繼續濫印，很快崩潰；臺灣的新臺幣要靠限量發行、黃金準備，再加上後來美援讓赤字縮小，才慢慢穩定下來。事後看「印太多錢會出事」很清楚，但當時的人面對內戰和軍費，選擇很少；而被記住的多半是撐過來的人，當年積蓄化為烏有的家庭很少留下紀錄。

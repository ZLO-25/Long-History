  - type: recap
    model_answer: 金融中心會搬家，不是因為單一原因。商人和資金會去「最方便又最放心」的地方：香檳市集靠伯爵的保護與定期結算，後來因海路直航與王室影響增強而衰落；布魯日靠近海，但河口淤積，又與統治者發生衝突；安特衛普靠香料、銀行家與君主借款興盛，卻受 1557 年違約、1576 年洗劫、1585 年陷落與河口封鎖打擊，人與資金北移到阿姆斯特丹。熱那亞這一環比較特別：1557 年西班牙王室停付、南德銀行家受創後，熱那亞的私人銀行家家族逐漸成為主要放款人，用貸款合約與匯票把美洲白銀與法蘭德斯的軍餉接起來，約 1579 年起（年份為估計）還有皮亞琴察的市集結算；聖喬治之家則是另一件事，由債權人管理公債與稅收，不是銀行家家族借錢給西班牙。阿姆斯特丹因匯兌銀行與信用而興盛，後來受戰爭與占領打擊，銀行信用也被耗損；倫敦靠國債、新稅與銀行信用撐過長期戰爭，一戰後則因英國背債、美國成為債權國而讓出位置給紐約。把這串接力寫成「香檳→布魯日→安特衛普→熱那亞→阿姆斯特丹→倫敦→紐約」只是簡化：熱那亞銀行家的時期與前後城市互有重疊，舊中心通常不會消失，史家對轉捩點在哪裡也常有不同看法。最後提醒：回頭看像一條必然的路，但那是後見之明，也只看到了勝出者（倖存者偏差）；歷史可以幫我們理解金融中心怎麼移動，卻不能用來預測市場，本單元不構成投資建議。

- { id: finance-federal-reserve, type: finance, track: west, name: 1907 年大恐慌與聯準會成立, time: "1907–1913", civ: "美國（內戰與工業化）", brief: "1907恐慌、尼克伯克信託、J.P.摩根出面救市、國家貨幣委員會、哲基爾島、1913聯邦準備法；美國終於有最後貸款人。federalreservehistory.org 為佳來源。" }

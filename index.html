<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>歷史長河：國高中生的歷史學習</title>
    <meta name="description" content="給國高中生的互動歷史學習網站：從一個謎題出發，讀卡片、看史料、排因果、比一比，配時間軸與地圖。涵蓋臺灣史、東亞史、世界史與錢的歷史。" />
    <!-- 效能：卡片資料和程式同時開始下載，不必等程式跑起來才抓 -->
    <link rel="preload" href="%BASE_URL%index.json" as="fetch" crossorigin="anonymous" />
    <!-- 網址直接指到卡片／單元／專題時，卡片長內文也一開始就抓（src/App.tsx 會接手這個 Promise） -->
    <script>if (/[?&](card|unit|dive|story|sim|topic|chain|today)=/.test(location.search)) window.__hrDetail = fetch('%BASE_URL%index-detail.json').then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });</script>

  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

# 古代疆域（historical-basemaps）政權／族群名稱的中文譯名：英文原名 → 中文
# build-index 會把中文寫進疆域檔，地圖上滑過疆域時顯示「中文 English」。
# 沒有列在這裡的名稱（多半是澳洲、北美的小族群，沒有通用中文譯名），
# 會依位置自動標成「澳洲原住民族群」「北美原住民族群」等，英文原名照樣顯示。
"?": 名稱不詳

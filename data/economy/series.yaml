  - id: clio-real-wage
    metric: real_wage
    name: 都市非技術工人的實質工資（Clio Infra）
    kind: 估計
    verification: AI草稿
    note: 單位是「一天的工資買得到幾籃最低生活必需品」。一籃＝一個人一天最基本的生活所需：主要是最便宜的主食（每天至少 1,940 大卡、40 公克蛋白質），再加少量衣物、燃料、肥皂和蠟燭，不含房租。數字 1 代表一天工資只夠一個人過一天最基本的生活；工人還要養家，也不是每天都有工作，所以數字要明顯大於 1，一家人才過得下去。資料主要是都市建築業的非技術男性工人，有些年份是內插的。作者自評資料品質：1820、1870 年各地區都是「低」；1913、1950 年只有西歐是「中」，其他地區是「低」；1973、2008 年各地區都是「中」。每十年畫最低到最高。臺灣只有 1951–1960、1964–1970 和 2002–2004 年。

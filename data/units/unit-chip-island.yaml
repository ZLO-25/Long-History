id: unit-chip-island
title: 晶片島：臺灣怎麼從加工廠變成晶片重鎮？
histories: [臺灣史, 科技史]
mystery: 五十多年前，臺灣有很多工廠替外國公司組裝收音機、電視等電子產品；今天，全世界一半以上的先進晶片在臺灣製造。這是怎麼辦到的？
teaser: 從加工區的女工、高速公路和中鋼，到南陽街的一頓早餐和台積電。
goals:
  - 能說出臺灣從加工出口、十大建設到半導體產業的發展順序
  - 能判讀張忠謀的口述，說出台積電為什麼選擇只做代工
  - 能比較加工區與科學園區，說出兩者的差異
  - 能指出把「矽盾」或「晶片就是臺灣的石油」當成定論時，哪裡不成立
minutes: 35
steps:
  - type: hook
    text: |
      拿出你的手機。裡面最重要的那顆晶片，很可能是在新竹、臺中或臺南做出來的。
      可是在你阿嬤年輕的時候，臺灣有不少工廠是替外國公司組裝零件，很多女孩國小一畢業就進廠工作。
      從「替人組裝」到「做全世界最難做的晶片」，中間發生了什麼事？
  - type: card
    id: event-kaohsiung-epz
    depth: story
    prompt: 第一站：1966 年的高雄。注意外國工廠為什麼要來這裡，以及在工廠工作的是誰。
  - type: card
    id: building-ten-major-projects
    depth: story
    prompt: 第二站：1970 年代的大建設。想一想：公路、港口、鋼鐵和晶片有什麼關係？
  - type: card
    id: event-hsinchu-park-tsmc
    depth: deep
    prompt: 第三站：一頓早餐、一份技術合約，和一家「只替別人做」的公司。讀「史家怎麼吵」時注意兩種不同的解釋。
  - type: chain
    prompt: 把下列事件依照時間與因果排成一條鏈（最上面是最早的）。
    items:
      - 高雄加工出口區成立，外國電子公司來臺設廠
      - 孫運璿等人在南陽街早餐會，決定發展積體電路
      - 工研院和美國 RCA 簽約，派工程師赴美受訓
      - 示範工廠團隊分出成立聯電，新竹科學園區開幕
      - 台積電成立，專門替別人代工製造晶片
    explain: 1966 加工區 → 1974 早餐會 → 1976 RCA 計畫 → 1980 聯電與竹科 → 1987 台積電。加工區讓臺灣累積了電子組裝的經驗和工人；但要從組裝走到製造晶片，還需要政府主動引進技術、培養人才。
    hints:
      - 最早的是「替外國公司組裝」的階段。
      - 要先決定發展、再去買技術、再培養團隊。
      - 台積電是最後成立的。
    ref: event-hsinchu-park-tsmc#C2
  - type: source
    card: event-hsinchu-park-tsmc
    idx: 0
    question: 張忠謀說代工是「最不壞的選擇」（the least evil choice），他的意思最接近哪一個？
    options:
      - 代工是當時全世界最賺錢的模式
      - 臺灣研發和設計都弱，只有製造可能有優勢，所以代工是在有限選項中比較好的一個
      - 他其實不想成立台積電
      - 代工是政府強迫他做的決定
    answer: 1
    explain: 「最不壞」不是「最好」：他承認臺灣當時研發、設計都弱，只剩製造可能有優勢，所以選代工。這是當事人 2007 年回顧時的說法，事後回顧可能把當年的決定說得比較有條理；讀口述歷史要記得這一點。
    hints:
      - 「最不壞」和「最好」有什麼不同？
      - 回去看卡片「代工是遠見，還是不得不？」那一段。
      - 這是事情發生二十年後的訪談，會不會影響說法？
    ref: event-hsinchu-park-tsmc#C4
  - type: compare
    cards: [event-kaohsiung-epz, event-hsinchu-park-tsmc]
    prompt: 比一比加工出口區和科學園區。
    rows:
      - { aspect: 開始, a: 1966 年高雄, b: 1980 年新竹 }
      - { aspect: 主角, a: 外國公司來臺設廠組裝, b: 工研院技術團隊分出的臺灣公司，例如聯電、台積電 }
      - { aspect: 需要的人, a: 大量手巧、工資低的作業員，多為年輕女性, b: 工程師與研發人才，園區設在清華、交大旁邊 }
      - { aspect: 臺灣掌握什麼, a: 主要是勞力與土地，技術多在外國公司手上, b: 逐漸掌握製程技術與整個產業聚落 }
    question: 從加工區到科學園區，臺灣在產業中的角色發生了什麼變化？
    model_answer: 加工區時期，臺灣主要提供便宜的勞力和土地，技術和品牌在外國公司手上；科學園區時期，政府先引進技術、培養工程師，再讓臺灣自己的公司接手，臺灣開始掌握製程技術。但也要記得：加工區的女工和工廠經驗是後來發展的基礎，而且早期的轉型是有代價的，例如 1987 到 1992 年加工區有 3 萬多名工人失業。
    hints:
      - 看「臺灣掌握什麼」那一列。
      - 「需要的人」有什麼不同？
      - 產業升級時，原本的工人怎麼了？
  - type: card
    id: commodity-taiwan-semiconductor
    depth: understand
    prompt: 最後一站：今天。注意臺灣「強在哪裡」，也注意它「依賴別人什麼」。
  - type: decision
    role: 你是 1985 年剛回臺灣的張忠謀
    situation: |
      政府請你籌組一家新的半導體公司。臺灣的研發和晶片設計能力都很弱；但工研院的團隊已經會製造，而且很會控制良率。
      當時全世界的半導體大廠，都是自己設計、自己製造、自己賣。你要怎麼定位這家新公司？
    options:
      - { label: 只做代工，替別人製造晶片, result: 這是台積電當年的選擇。它不和客戶競爭設計，讓沒有工廠的設計公司放心下單；這個模式在當時很少人看好，後來卻讓台積電成為全球最大的晶圓代工公司。 }
      - { label: 像國外大廠一樣，自己設計、製造、銷售, result: 推測：臺灣當時研發和設計都弱，要和國際大廠正面競爭，很可能處於劣勢。歷史沒有走這條路，所以後果只能推測。 }
    actual: 1987 年台積電成立，政府出約一半資本、荷蘭飛利浦出 27.5%，專門替別人代工製造晶片。
    ref: event-hsinchu-park-tsmc#C2
    note: 「沒有發生的選項」的後果都是推測，標示清楚。
  - type: today
    card: commodity-taiwan-semiconductor
    question: 有人說「晶片就是臺灣的石油，有了它，臺灣就安全了」。這個說法哪裡不成立？
    model_answer: 晶片不是挖出來的天然資源，而是靠技術、人才和整條國際分工做出來的；臺灣的設備大多從美國、荷蘭、日本進口，前段材料也大多仰賴進口，別國可以花錢、花時間追上。至於「矽盾」能不能保護臺灣，學者和官員看法分歧，也有人認為晶片集中在臺灣反而是風險。所以這個說法可以幫我們思考臺灣的位置，但不能當成定論。
  - type: check
    items:
      - kind: choice
        q: 高雄加工出口區吸引外國工廠的主要方法是什麼？
        options: [政府直接出錢替外國公司蓋工廠, 原料進口和成品出口都免關稅，前幾年還免稅, 禁止臺灣本地公司生產電子產品, 給外國公司臺灣的土地所有權]
        answer: 1
        explain: 加工區的規則是：原料進口免關稅、成品出口也免關稅，前五年還免稅，讓外國公司在臺灣組裝再出口很划算。
        hints: [回去看加工區卡片的故事。, 外國公司最在意的是成本。]
        ref: event-kaohsiung-epz#C4
      - kind: order
        q: 依時間先後排列：
        items: [高雄加工出口區成立, 十大建設提出, 新竹科學園區開幕, 台積電成立]
        explain: 1966 加工區 → 1973 十大建設 → 1980 竹科 → 1987 台積電。
        hints: [十大建設是在石油危機那年提出的。, 竹科比台積電早七年。]
        ref: building-ten-major-projects#D1
      - kind: short
        q: 用一兩句話說明：為什麼說臺灣半導體「不是什麼都自己來」？
        model: 因為臺灣強在晶圓代工和封裝測試，但 IC 設計約七成營收在美國，製造設備大多從美國、荷蘭、日本進口，前段材料臺灣自己只生產約 1%。
        explain: 臺灣是國際分工中的關鍵一環，但也依賴這個分工。
        hints: [回去看半導體卡片的故事後半段。, 設備從哪裡來？]
        ref: commodity-taiwan-semiconductor#B2
  - type: recap
    model_answer: 一步一步來的。1960 年代加工區讓外國電子公司來臺組裝，臺灣累積了工廠經驗；1970 年代十大建設補上交通和重工業；1974 年起政府決定發展積體電路，向美國 RCA 學技術、培養工程師；1980 年竹科開幕；1987 年台積電選擇只做代工。學者對「是不是政府計畫成功」看法不一：有人強調國家主導，也有人強調跨國人才和整個產業聚落。而且這條路上也有人付出代價，例如加工區的女工和後來失業的工人。
